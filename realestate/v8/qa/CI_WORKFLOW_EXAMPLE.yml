# Proposal only: install in .github/workflows/ after review and CI resource approval.
name: CPX RealEstate V8 Quality Gates
on:
  pull_request:
    paths:
      - 'realestate/v8/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install 'beautifulsoup4==4.14.3' 'playwright==1.57.0'
      - run: python -m playwright install --with-deps chromium
      - run: python realestate/v8/qa/quality_gate.py
      - run: node realestate/v8/qa/test_api.mjs
      - run: python realestate/v8/qa/offline_browser.py
      # Never publish screenshots of live customer data. Only synthetic data in this suite.