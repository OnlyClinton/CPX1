name: WDCC Trigger Dealer Ready v4
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wdcc-trigger-v4-automation.yml']
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch v4 acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wdcc-dealer-ready-double-acceptance-v4.yml -R OnlyClinton/CPX1 --ref main
