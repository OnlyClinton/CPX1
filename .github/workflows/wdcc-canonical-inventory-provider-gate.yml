name: WDCC Canonical Inventory Provider Gate

on:
  push:
    branches:
      - fix/wdcc-locked-contract-20260826
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-canonical-inventory-provider-gate
  cancel-in-progress: true

jobs:
  provider-read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify canonical inventory read path
        shell: bash
        run: |
          set -euo pipefail
          backend="$(node -e "const c=JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8'));process.stdout.write(String(c.vars?.WDCC_DEALER_BACKEND_URL||''))")"
          test -n "$backend"
          url="${backend%/}/api/inventory?provider-gate=$GITHUB_RUN_ID"
          code="$(curl -sS -L --connect-timeout 15 --max-time 30 -D provider-headers.txt -o provider-body.json -w '%{http_code}' "$url" || true)"
          printf '%s\n' "$backend" > canonical-backend-url.txt
          printf '%s\n' "$code" > provider-http-status.txt
          echo "### WDCC canonical inventory provider gate" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Backend: $backend" >> "$GITHUB_STEP_SUMMARY"
          echo "Inventory HTTP: $code" >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != 200 ]; then
            echo 'BLOCKED: canonical inventory read path is unhealthy. Visual fallback may still be acceptable, but functional/release acceptance is not.' >> "$GITHUB_STEP_SUMMARY"
            cat provider-body.json >> "$GITHUB_STEP_SUMMARY" || true
            exit 1
          fi
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('provider-body.json','utf8'));
          const items=Array.isArray(j.items)?j.items:Array.isArray(j.inventory)?j.inventory:[];
          if(!Array.isArray(items))process.exit(1);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`Canonical inventory items readable: ${items.length}\n`);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-provider-gate-${{ github.sha }}
          path: |
            canonical-backend-url.txt
            provider-http-status.txt
            provider-headers.txt
            provider-body.json
          if-no-files-found: warn
          retention-days: 7
