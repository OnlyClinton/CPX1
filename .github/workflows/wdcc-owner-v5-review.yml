name: WDCC Owner V5 Review Capture

on:
  push:
    branches:
      - freeze/wdcc-owner-v5-20260826
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-owner-v5-review-capture
  cancel-in-progress: true

env:
  EXPECTED_HERO_SIZE: '145504'
  EXPECTED_HERO_SHA256: 1d7a0e4fced7450f2bbc66443d44b1f35bd9e24a6366308362aafa65576d3eb2

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Guard isolated V5 source
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          grep -q 'owner-review-v5.css' app/layout.tsx
          grep -q 'vdp-page' 'app/vehicle/[id]/page.tsx'
          test "$(grep -o 'wdcc-hero-v2.webp' app/LockedIntro.tsx | wc -l | tr -d ' ')" = 1
          ! grep -Eqi 'WebGPU|requestAdapter|getContext\("webgpu"\)|createRenderPipeline|<canvas|\.animate\(' app/LockedIntro.tsx
          test "$(wc -c < public/wdcc-hero-v2.webp | tr -d ' ')" = "$EXPECTED_HERO_SIZE"
          printf '%s  %s\n' "$EXPECTED_HERO_SHA256" public/wdcc-hero-v2.webp | sha256sum -c -

      - name: Build V5
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0 playwright@1.55.0
          npx opennextjs-cloudflare build
          npx playwright install --with-deps chromium >/dev/null

      - name: Configure isolated Worker
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          cfg.name='wdcc-owner-v5-review';
          cfg.workers_dev=true;
          cfg.preview_urls=true;
          delete cfg.route; delete cfg.routes;
          fs.writeFileSync('wrangler.v5-review.jsonc',JSON.stringify(cfg,null,2)+'\n');
          NODE
          ! grep -qi 'wedontcarecars.com' wrangler.v5-review.jsonc

      - name: Deploy isolated review
        id: deploy
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.v5-review.jsonc 2>&1 | tee /tmp/v5-review.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/v5-review.log | tail -1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > preview-url.txt

      - name: Wait for review Worker
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          code=000
          for i in $(seq 1 30); do
            code="$(curl -sS -L -o /tmp/home.html -w '%{http_code}' "$URL/?ready=$GITHUB_RUN_ID-$i" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          test "$code" = 200

      - name: Capture V5 storefront and VDP
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          mkdir -p visual-proof
          node - <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const url=process.env.URL;
            const browser=await chromium.launch({headless:true});
            const out={url,sha:process.env.GITHUB_SHA,mobile:{},inventory:{},vdp:{},desktop:{}};
            const waitImg=async(p,s,w=100)=>{await p.locator(s).waitFor({state:'visible',timeout:12000});await p.waitForFunction(({s,w})=>{const i=document.querySelector(s);return i&&i.complete&&i.naturalWidth>=w},{s,w},{timeout:12000});};
            const finishIntro=async p=>{const i=p.locator('.li');if(await i.count())await i.waitFor({state:'detached',timeout:6500});await p.locator('.rh-hero-art').waitFor({state:'visible',timeout:5000});};
            try{
              const mc=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
              const p=await mc.newPage();const errors=[];
              p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});p.on('pageerror',e=>errors.push(String(e)));
              await p.goto(`${url}/?review=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
              await waitImg(p,'.li-scene img',1000);await waitImg(p,'.li-badge img',200);
              const intro=await p.evaluate(()=>{const b=document.querySelector('.li-badge'),s=document.querySelector('.li-scene img'),bs=getComputedStyle(b),ss=getComputedStyle(s);return{sceneCount:document.querySelectorAll('.li-scene img').length,canvas:document.querySelectorAll('canvas').length,badgeAnimation:bs.animationName,badgeDuration:parseFloat(bs.animationDuration),sceneAnimation:ss.animationName,sceneDuration:parseFloat(ss.animationDuration)}});
              await p.waitForTimeout(560);await p.screenshot({path:'visual-proof/mobile-intro.png'});
              await finishIntro(p);await waitImg(p,'.rh-logo img',200);await p.waitForTimeout(900);
              const mob=await p.evaluate(()=>{const q=s=>document.querySelector(s),r=s=>q(s)?.getBoundingClientRect?.(),st=s=>q(s)?getComputedStyle(q(s)):null;return{utilityH:r('.rh-utility')?.height,headerH:r('.rh-header')?.height,logoW:r('.rh-logo img')?.width,menu:st('.rh-menu')?.display,heroH:r('.rh-hero-art')?.height,h1:parseFloat(st('.rh-copy h1')?.fontSize||'0'),whiteRight:r('.rh-copy h1 .white')?.right,benefitH:r('.rh-benefit')?.height,h2:parseFloat(st('.rh-section-head h2')?.fontSize||'0'),grid:st('.rh-grid')?.display||'absent',cardW:r('.rh-card')?.width||0,inventoryState:q('.rh-inventory-state')?.textContent?.trim()||'ready',finance:parseFloat(st('.finance-heading h2')?.fontSize||'0'),stepH:r('.rh-step')?.height,trustH:r('.rh-trust-grid article')?.height,utilityPos:st('.rh-utility')?.position,headerPos:st('.rh-header')?.position,scrollW:document.documentElement.scrollWidth,innerW:innerWidth}});
              if(mob.utilityH>24||mob.headerH>72||mob.logoW<78||mob.logoW>90||mob.menu==='none')throw Error(`HEADER ${JSON.stringify(mob)}`);
              if(mob.heroH<300||mob.heroH>330||mob.h1<39||mob.h1>43||mob.whiteRight>390)throw Error(`HERO ${JSON.stringify(mob)}`);
              if(mob.benefitH>84||mob.h2<27||mob.h2>31)throw Error(`UPPER_SECTIONS ${JSON.stringify(mob)}`);
              if(mob.grid==='flex'&&(mob.cardW<280||mob.cardW>305))throw Error(`CAROUSEL ${JSON.stringify(mob)}`);
              if(mob.finance<25||mob.finance>30||mob.stepH>82||mob.trustH>68||mob.scrollW>mob.innerW+2)throw Error(`LOWER ${JSON.stringify(mob)}`);
              await p.evaluate(()=>scrollTo(0,700));await p.waitForTimeout(150);
              const pin=await p.evaluate(()=>{const u=document.querySelector('.rh-utility').getBoundingClientRect(),h=document.querySelector('.rh-header').getBoundingClientRect();return{uTop:u.top,uH:u.height,hTop:h.top}});
              if(Math.abs(pin.uTop)>2||Math.abs(pin.hTop-pin.uH)>3)throw Error(`PIN ${JSON.stringify(pin)}`);
              await p.evaluate(()=>scrollTo(0,0));await p.waitForTimeout(80);
              await p.screenshot({path:'visual-proof/mobile-hero.png'});await p.screenshot({path:'visual-proof/mobile-full.png',fullPage:true});out.mobile={intro,mob,pin,errors};

              let id='';
              try{
                const resp=await mc.request.get(`${url}/api/inventory?review=${Date.now()}`,{timeout:20000});
                out.inventory.status=resp.status();
                if(resp.ok()){
                  const data=await resp.json();const items=data.items||data.inventory||[];
                  out.inventory.count=items.length;
                  const first=items.find(x=>x&&String(x.id||x.slug||'').trim())||null;
                  id=first?String(first.id||first.slug):'';
                  out.inventory.first=id;
                }
              }catch(e){out.inventory.error=String(e)}
              if(id){
                const v=await mc.newPage();await v.goto(`${url}/vehicle/${encodeURIComponent(id)}?review=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});await v.locator('.vdp-title').waitFor({state:'visible',timeout:12000});
                const vdp=await v.evaluate(()=>{const q=s=>document.querySelector(s),r=s=>q(s)?.getBoundingClientRect?.(),st=s=>q(s)?getComputedStyle(q(s)):null;return{commandH:r('.commandStrip')?.height,headerH:r('.premiumHeader')?.height,logoW:r('.logoBrand img')?.width,title:parseFloat(st('.vdp-title')?.fontSize||'0'),photoW:r('.vdp-photo')?.width,photoH:r('.vdp-photo')?.height,price:parseFloat(st('.vdp-price')?.fontSize||'0'),stickyH:r('.stickyCtaBar')?.height,actions:st('.vdp-actions')?.display,scrollW:document.documentElement.scrollWidth,innerW:innerWidth}});
                const ratio=vdp.photoW/vdp.photoH;out.vdp={...vdp,ratio};
                if(vdp.commandH>24||vdp.headerH>72||vdp.logoW<74||vdp.logoW>86||vdp.title<35||vdp.title>41||ratio<1.5||ratio>1.75||vdp.price<34||vdp.price>42||vdp.stickyH>56||vdp.actions!=='none'||vdp.scrollW>vdp.innerW+2)throw Error(`VDP ${JSON.stringify(out.vdp)}`);
                await v.screenshot({path:'visual-proof/mobile-vdp.png',fullPage:true});
              }
              await mc.close();

              const dc=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});const d=await dc.newPage();
              await d.goto(`${url}/?desktop=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});await waitImg(d,'.li-scene img',1000);await finishIntro(d);await waitImg(d,'.rh-logo img',200);
              const desk=await d.evaluate(()=>{const q=s=>document.querySelector(s),r=s=>q(s).getBoundingClientRect(),st=s=>getComputedStyle(q(s));return{nav:st('.rh-nav').display,menu:st('.rh-menu').display,grid:st('.rh-grid')?.display||'absent',h1:parseFloat(st('.rh-copy h1').fontSize),logoW:r('.rh-logo img').width}});
              if(desk.nav!=='flex'||desk.menu!=='none'||desk.h1<60||desk.logoW<88)throw Error(`DESKTOP ${JSON.stringify(desk)}`);
              await d.screenshot({path:'visual-proof/desktop-full.png',fullPage:true});out.desktop=desk;await dc.close();
            }finally{await browser.close()}
            fs.writeFileSync('visual-proof/metrics.json',JSON.stringify(out,null,2)+'\n');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Summary
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo '### WDCC Owner V5 review capture' >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: ${URL:-not-created}" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Storefront visual is tested independently of inventory publication state. Production untouched.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-owner-v5-review-proof
          path: |
            preview-url.txt
            visual-proof/
          if-no-files-found: warn
          retention-days: 7
