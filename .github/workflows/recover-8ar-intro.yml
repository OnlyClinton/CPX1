name: Recover exact WDCC 8AR intro
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-8ar-intro.yml'
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      DEPLOYMENT_ID: dpl_8ARLPgiW4ZKC9qwQxJrwqc2hrZzX
    steps:
      - uses: actions/checkout@v4
      - name: Require Vercel token
        run: test -n "$VERCEL_TOKEN" || { echo 'VERCEL_TOKEN missing' >&2; exit 78; }
      - name: Extract exact intro implementation from immutable 8AR build
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments/$DEPLOYMENT_ID/files?teamId=$VERCEL_TEAM_ID" > /tmp/files.json
          cat > /tmp/extract.mjs <<'EOF'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const token=process.env.VERCEL_TOKEN, team=process.env.VERCEL_TEAM_ID, dep=process.env.DEPLOYMENT_ID;
          const tree=JSON.parse(await fs.readFile('/tmp/files.json','utf8'));
          const files=[];
          function walk(nodes,prefix=''){
            for(const n of nodes||[]){
              const p=prefix?`${prefix}/${n.name}`:n.name;
              if(n.type==='directory') walk(n.children||[],p);
              else if(n.type==='file'&&n.uid) files.push({...n,path:p});
            }
          }
          walk(tree);
          const re=/intro-sequence|intro-reveal|intro-scene|intro-smoke|intro-badge|intro-tagline|intro-state-reveal|wdcc opening animation/i;
          const out=[];
          await fs.mkdir('recovered-8ar-intro',{recursive:true});
          for(const f of files){
            if(!/\.(css|js|mjs|cjs|html|txt)$/i.test(f.path)) continue;
            if(Number(f.size||0)>2500000) continue;
            const u=`https://api.vercel.com/v8/deployments/${dep}/files/${f.uid}?teamId=${encodeURIComponent(team)}`;
            const r=await fetch(u,{headers:{Authorization:`Bearer ${token}`}});
            if(!r.ok) continue;
            const raw=await r.text();
            let parsed; try{parsed=JSON.parse(raw)}catch{parsed=raw}
            const b64=typeof parsed==='string'?parsed:(parsed?.data??parsed?.content??parsed?.file??parsed?.value);
            if(typeof b64!=='string') continue;
            const buf=Buffer.from(b64,'base64');
            const text=buf.toString('utf8');
            if(!re.test(text)) continue;
            const safe=f.path.replace(/[^a-zA-Z0-9._-]+/g,'__');
            await fs.writeFile(path.join('recovered-8ar-intro',safe),buf);
            const hits=[];
            for(const term of ['intro-sequence','intro-reveal','intro-scene','intro-smoke','intro-badge','intro-tagline','intro-state-reveal']){
              let i=text.indexOf(term);
              while(i>=0){hits.push({term,index:i,snippet:text.slice(Math.max(0,i-1400),Math.min(text.length,i+4000))});i=text.indexOf(term,i+term.length)}
            }
            out.push({path:f.path,uid:f.uid,size:buf.length,hits});
          }
          await fs.writeFile('recovered-8ar-intro/MATCHES.json',JSON.stringify(out,null,2));
          if(!out.length) throw new Error('NO_INTRO_MATCHES_FOUND');
          console.log(`Matched ${out.length} donor files`);
          EOF
          node /tmp/extract.mjs
      - name: Publish intro extraction branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WDCC Recovery Bot'
          git config user.email '120651995+OnlyClinton@users.noreply.github.com'
          git checkout --orphan recovered-8ar-intro
          git rm -rf . >/dev/null 2>&1 || true
          cp -a recovered-8ar-intro/. .
          git add -A
          git commit -m 'Recover exact WDCC 8AR intro implementation'
          git push --force origin HEAD:recovered-8ar-intro
      - name: Report extraction
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC 8AR intro recovery ${GITHUB_SHA:0:7}" --body "Recovered the immutable 8AR intro implementation from deployment \`$DEPLOYMENT_ID\` to branch \`recovered-8ar-intro\`." || true
