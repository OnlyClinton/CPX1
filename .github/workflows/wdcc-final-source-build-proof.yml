name: WDCC Final Source Build Proof

on:
  push:
    branches: [main]
    paths: ['.github/workflows/wdcc-final-source-build-proof.yml']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FINAL_SHA: 3101a4fc38e85e56d5b4c9a2171be820cf16886b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FINAL_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Compile exact final source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          npm ci
          npm run build
      - name: Static one-authority contract
        run: |
          set -euo pipefail
          grep -q 'wdcc-cpx-launch-qhcvflfih-cpxagency.vercel.app' lib/wdccAuthority.ts
          grep -q 'WDCC_CANONICAL_BLOB_STORE_ID' lib/wdccAuthority.ts
          grep -q 'oidc-auto' lib/wdccAuthority.ts
          grep -q 'options:{storeId}' lib/wdccAuthority.ts
          grep -q 'VERCEL_OIDC_TOKEN' lib/wdccAuthority.ts
          grep -q 'STOREFRONT_PROJECT_ID' lib/dealerRuntime.ts
          grep -q 'canonicalDealerBackend' lib/legacyAuthProxy.ts
          grep -q 'proxyDealer(request,"/api/leads")' app/api/leads/route.ts
          grep -q 'canonicalGET(request)' app/api/lead/route.ts
          grep -q 'proxyDealer(request,"/api/upload")' app/api/upload/route.ts
          grep -q 'handleUploadPresigned' app/api/upload/route.ts
          grep -q 'issueSignedToken' app/api/upload/route.ts
          grep -q 'uploadPresigned' app/dealer/inventory/new/page.tsx
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('lib/wdccAuthority.ts','utf8');
          const auto=s.indexOf('if(vercelBackendRuntime&&storeId)return {mode:"oidc-auto"');
          const token=s.indexOf('const token=(process.env.BLOB_READ_WRITE_TOKEN');
          if(auto<0||token<0||auto>token)throw Error('STATIC_TOKEN_PRECEDES_AUTO_OIDC');
          console.log('OIDC_AUTH_ORDER=PASS');
          NODE
          echo 'WDCC_FINAL_SOURCE_CONTRACT=PASS'
      - name: Report source proof
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC final source build ${GITHUB_RUN_ID}" --body "Exact SHA: \`$FINAL_SHA\`\nStatus: **$STATUS**\nRequest-context OIDC is ordered ahead of static Blob token fallback for Vercel backend runtime. No Vercel deployment, Blob mutation, alias move, DNS change, or Cloudflare route change was performed." || true
