name: WDCC Dealer Isolated E2E

on:
  push:
    branches: [feat/wdcc-webgpu-intro-owner-override-20260827]
    paths:
      - '.github/workflows/wdcc-dealer-isolated-e2e.yml'
      - '.github/scripts/wdcc-dealer-isolated-e2e.mjs'
      - '.github/workflows/wdcc-webgpu-full-owner-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-dealer-isolated-e2e-${{ github.sha }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build exact application
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false three@0.185.1 playwright@1.55.0
          npm run build
          npx playwright install --with-deps chromium >/dev/null
      - name: Prove login vehicle create edit photo upload and public listing
        shell: bash
        env:
          QA_EMAIL: wdcc-local-${{ github.run_id }}-${{ github.run_attempt }}@invalid.example
          QA_PASSWORD: WdccLocal-${{ github.run_id }}-${{ github.run_attempt }}-A9!x
          STATE_TOKEN: wdcc-local-state-${{ github.run_id }}-${{ github.run_attempt }}
          SESSION_SECRET: wdcc-isolated-session-${{ github.run_id }}-${{ github.run_attempt }}-20260827
          LOCAL_STOCK: LOCAL514-${{ github.run_id }}-${{ github.run_attempt }}
          WDCC_RUNTIME_ROLE: backend
          WDCC_STATE_SERVICE_URL: http://127.0.0.1:4311
          WDCC_STATE_SERVICE_TOKEN: wdcc-local-state-${{ github.run_id }}-${{ github.run_attempt }}
          WDCC_MEDIA_SERVICE_URL: http://127.0.0.1:4311
          WDCC_MEDIA_SERVICE_TOKEN: wdcc-local-state-${{ github.run_id }}-${{ github.run_attempt }}
          WDCC_DEALER_BACKEND_URL: http://127.0.0.1:65535
        run: |
          set -euo pipefail
          unset BLOB_READ_WRITE_TOKEN VERCEL_OIDC_TOKEN BLOB_STORE_ID || true
          echo '::add-mask::${{ env.QA_PASSWORD }}'
          echo '::add-mask::${{ env.STATE_TOKEN }}'
          echo '::add-mask::${{ env.SESSION_SECRET }}'
          node .github/scripts/wdcc-dealer-isolated-e2e.mjs
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '### WDCC dealer isolated exact-head E2E' >> "$GITHUB_STEP_SUMMARY"
          echo "Exact SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          [ ! -s dealer-isolated-e2e/metrics.json ] || cat dealer-isolated-e2e/metrics.json >> "$GITHUB_STEP_SUMMARY"
          echo 'Disposable localhost state/media authority; production storefront verification redirected locally; no production write, provider, route, alias, DNS, database, or schema mutation.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-dealer-isolated-e2e-${{ github.sha }}
          path: dealer-isolated-e2e/
          if-no-files-found: warn
          retention-days: 7
