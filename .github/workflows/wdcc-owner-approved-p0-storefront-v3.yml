name: WDCC Owner Approved P0 Storefront Recovery V3

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

concurrency:
  group: wdcc-owner-approved-p0-storefront-v3
  cancel-in-progress: false

env:
  APPROVED_SHA: 3d255fa8f1d65e4307e7c3ee474a996dd68ba3e1
  PROD_ROOT: https://wedontcarecars.com
  PROD_WWW: https://www.wedontcarecars.com
  LIVE_WORKER: wdcc-reference-root
  STAGE_WORKER: wdcc-storefront

jobs:
  promote:
    if: >-
      github.event.issue.number == 205 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == 'PROMOTE-WDCC-P0-STOREFRONT-V3-3D255FA8'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Fail-closed release gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY_OWNER" = "${{ github.event.comment.user.login }}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          curl -fsS "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/205" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' > /tmp/issue.json
          jq -e '.number==205 and .state=="open"' /tmp/issue.json >/dev/null
          body="$(jq -r '.body // ""' /tmp/issue.json)"
          grep -Fq 'OWNER-APPROVED P0 LIVE PRIORITY — MAIN + DEALER + VEHICLE UPLOAD' <<<"$body"
          grep -Fq "exact owner-approved visual source SHA \`$APPROVED_SHA\`" <<<"$body"
          grep -Fq '`wdcc-reference-root`' <<<"$body"
          grep -Fq 'routes/DNS left attached exactly as they are now' <<<"$body"
          grep -Fq 'Full release remains NO-GO outside this P0 exception.' <<<"$body"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_SHA }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build exact owner-approved candidate and recovery wrapper
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          node - <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('lib/recoveryInventory.ts','utf8');
          if(!src.includes('WDCC_RECOVERY_INVENTORY_EVIDENCE="2vfd-stable-public-five"')) throw new Error('RECOVERY_EVIDENCE_DRIFT');
          const m=src.match(/export const WDCC_RECOVERY_INVENTORY=\[([\s\S]*?)\]\s+as const;/);
          if(!m) throw new Error('RECOVERY_ARRAY_NOT_FOUND');
          const items=Function('"use strict";return ['+m[1]+']')();
          if(!Array.isArray(items)||items.length!==5) throw new Error('RECOVERY_COUNT_INVALID');
          for(const v of items){
            const id=String(v?.id??v?.slug??'').trim();
            const stock=String(v?.stock??v?.stock_id??'').toUpperCase();
            if(!id||Number(v?.year||0)<1901||!String(v?.make||'').trim()||!String(v?.model||'').trim()||!(Number(v?.price??v?.cashPrice??0)>0)) throw new Error('INVALID_RECOVERY_RECORD');
            if(/^(R36TEST|WDCC[-_]QA|QA|TEST)[-_]/i.test(stock)) throw new Error('QA_RECOVERY_RECORD');
          }
          fs.writeFileSync('/tmp/recovery.json',JSON.stringify({ok:true,live:false,readOnly:true,blobHealthy:false,count:5,items,recoveryFallback:true,inventorySource:'verified-recovery-readonly',sourceEvidence:'2vfd-stable-public-five',availabilityNotice:'Verified recovery inventory. Confirm current availability with Sean at 813-516-4752.'}));
          NODE
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets
          test -s .next/BUILD_ID
          cp /tmp/recovery.json .wdcc-recovery.json
          node - <<'NODE'
          const fs=require('fs');
          const recovery=JSON.parse(fs.readFileSync('.wdcc-recovery.json','utf8'));
          const approved=process.env.APPROVED_SHA;
          fs.writeFileSync('wdcc-reference-wrapper.mjs',`import app from "./.open-next/worker.js";
          const RECOVERY=${JSON.stringify(recovery)}; const APPROVED_SHA=${JSON.stringify(approved)};
          const hdr=(extra={})=>({"content-type":"application/json; charset=utf-8","cache-control":"public, max-age=30, stale-while-revalidate=120","x-wdcc-inventory-source":"verified-real-edge-recovery","x-wdcc-visual-sha":APPROVED_SHA,...extra});
          export default {async fetch(request,env,ctx){const u=new URL(request.url);
            if(request.method==="GET"&&u.pathname==="/api/inventory") return new Response(JSON.stringify(RECOVERY),{status:200,headers:hdr()});
            const m=u.pathname.match(/^\\/api\\/inventory\\/([^/]+)$/); if(request.method==="GET"&&m){const id=decodeURIComponent(m[1]); const item=RECOVERY.items.find(v=>String(v?.id??v?.slug??"")===id); return item?new Response(JSON.stringify({ok:true,item,readOnly:true,live:false,inventorySource:"verified-recovery-readonly"}),{status:200,headers:hdr()}):new Response(JSON.stringify({ok:false,error:"Not found",readOnly:true,live:false}),{status:404,headers:hdr()});}
            const r=await app.fetch(request,env,ctx); const h=new Headers(r.headers); h.set("x-wdcc-visual-sha",APPROVED_SHA); h.set("x-wdcc-frontdoor","owner-approved-p0"); return new Response(r.body,{status:r.status,statusText:r.statusText,headers:h});}};`);
          const base={"$schema":"./node_modules/wrangler/config-schema.json",main:"wdcc-reference-wrapper.mjs",compatibility_date:"2026-08-25",compatibility_flags:["nodejs_compat","global_fetch_strictly_public"],assets:{directory:".open-next/assets",binding:"ASSETS",run_worker_first:false},observability:{enabled:true},vars:{WDCC_RUNTIME_ROLE:"frontend",WDCC_DEALER_BACKEND_URL:"https://wdcc-cpx-launch-cpxagency.vercel.app"}};
          fs.writeFileSync('wrangler.p0-stage.jsonc',JSON.stringify({...base,name:process.env.STAGE_WORKER,workers_dev:true,preview_urls:true},null,2)+'\n');
          fs.writeFileSync('wrangler.p0-live.jsonc',JSON.stringify({...base,name:process.env.LIVE_WORKER,workers_dev:false,preview_urls:false},null,2)+'\n');
          NODE
          ! grep -Eq '"routes?"|"custom_domains?"' wrangler.p0-live.jsonc

      - name: Upload and prove immutable stage preview
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler versions upload --config wrangler.p0-stage.jsonc --message "P0 storefront V3 stage $APPROVED_SHA" 2>&1 | tee /tmp/stage.log
          direct="$(sed -n 's#.*Version Preview URL: \(https://[^ ]*\).*#\1#p' /tmp/stage.log | tail -1)"
          test -n "$direct"
          echo "STAGE_PREVIEW=$direct"
          build="$(tr -d '\r\n' < .next/BUILD_ID)"
          for i in $(seq 1 20); do
            code="$(curl --http1.1 -sS -D /tmp/sh -o /tmp/sb -w '%{http_code}' "$direct/?v3=$GITHUB_RUN_ID-$i" || true)"
            if [ "$code" = 200 ] && grep -Fq "$build" /tmp/sb && grep -qi "^x-wdcc-visual-sha: $APPROVED_SHA" /tmp/sh; then break; fi
            sleep 2
          done
          test "$code" = 200
          grep -Fq "$build" /tmp/sb
          grep -qi "^x-wdcc-visual-sha: $APPROVED_SHA" /tmp/sh
          test "$(curl --http1.1 -sS -D /tmp/aih -o /tmp/aib -w '%{http_code}' "$direct/api/inventory?v3=$GITHUB_RUN_ID")" = 200
          grep -qi '^x-wdcc-inventory-source: verified-real-edge-recovery' /tmp/aih
          jq -e '.ok==true and .readOnly==true and .count==5 and (.items|length)==5 and .sourceEvidence=="2vfd-stable-public-five"' /tmp/aib >/dev/null

      - name: Capture rollback version
        id: rollback
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments status --name "$LIVE_WORKER" --json > /tmp/status.json
          old="$(python - <<'PY'
          import json
          d=json.load(open('/tmp/status.json')); rows=[]
          def walk(x):
            if isinstance(x,dict):
              v=x.get('version_id') or x.get('versionId'); p=x.get('percentage')
              if v: rows.append((p,str(v)))
              for y in x.values(): walk(y)
            elif isinstance(x,list):
              for y in x: walk(y)
          walk(d)
          print(next((v for p,v in rows if p in (100,100.0,'100','100.0',1,1.0,'1','1.0')), rows[0][1] if rows else ''))
          PY
          )"
          test -n "$old"
          echo "old=$old" >> "$GITHUB_OUTPUT"

      - name: Upload exact live version
        id: live
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler versions upload --config wrangler.p0-live.jsonc --message "Owner-approved P0 storefront V3 $APPROVED_SHA" 2>&1 | tee /tmp/live.log
          new="$(grep -Eo 'Worker Version ID: [0-9a-f-]+' /tmp/live.log | tail -1 | awk '{print $4}')"
          test -n "$new"
          test "$new" != "${{ steps.rollback.outputs.old }}"
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: Promote existing front door and verify or rollback
        shell: bash
        env:
          OLD_VERSION: ${{ steps.rollback.outputs.old }}
          NEW_VERSION: ${{ steps.live.outputs.new }}
        run: |
          set -Eeuo pipefail
          promoted=0
          rollback(){ rc=$?; trap - ERR INT TERM; if [ "$promoted" = 1 ]; then npx wrangler versions deploy "$OLD_VERSION@100%" --name "$LIVE_WORKER" -y --message "P0 V3 AUTO-ROLLBACK $GITHUB_RUN_ID" || true; fi; exit "$rc"; }
          trap rollback ERR INT TERM
          npx wrangler versions deploy "$NEW_VERSION@100%" --name "$LIVE_WORKER" -y --message "Owner-approved P0 storefront V3 $APPROVED_SHA"
          promoted=1
          build="$(tr -d '\r\n' < .next/BUILD_ID)"
          for i in $(seq 1 30); do
            code="$(curl --http1.1 -sS -D /tmp/lh -o /tmp/lb -w '%{http_code}' "$PROD_ROOT/?v3=$APPROVED_SHA-$i" || true)"
            if [ "$code" = 200 ] && grep -Fq "$build" /tmp/lb && grep -qi "^x-wdcc-visual-sha: $APPROVED_SHA" /tmp/lh; then break; fi
            sleep 2
          done
          test "$code" = 200
          grep -Fq "$build" /tmp/lb
          test "$(curl --http1.1 -sS -o /tmp/invp -w '%{http_code}' "$PROD_ROOT/inventory?v3=$APPROVED_SHA")" = 200
          grep -Fq "$build" /tmp/invp
          test "$(curl --http1.1 -sS -D /tmp/aih -o /tmp/aib -w '%{http_code}' "$PROD_ROOT/api/inventory?v3=$APPROVED_SHA")" = 200
          grep -qi '^x-wdcc-inventory-source: verified-real-edge-recovery' /tmp/aih
          jq -e '.ok==true and .readOnly==true and .count==5 and (.items|length)==5' /tmp/aib >/dev/null
          first="$(jq -r '.items[0].id // empty' /tmp/aib)"; test -n "$first"
          test "$(curl --http1.1 -sS -o /tmp/detail -w '%{http_code}' "$PROD_ROOT/api/inventory/$first?v3=$APPROVED_SHA")" = 200
          test "$(curl --http1.1 -sS -o /tmp/www -w '%{http_code}' "$PROD_WWW/?v3=$APPROVED_SHA")" = 200
          grep -Fq "$build" /tmp/www
          curl --http1.1 -fsSL "$PROD_ROOT/wdcc-hero-v2.webp?v3=$APPROVED_SHA" -o /tmp/hero
          test "$(sha256sum /tmp/hero|awk '{print $1}')" = "$(sha256sum public/wdcc-hero-v2.webp|awk '{print $1}')"
          trap - ERR INT TERM
          printf '### WDCC P0 STOREFRONT V3 — PASS\nApproved SHA: %s\nLive Worker: %s\nLive version: %s\nMain/inventory/API/www/hero: PASS\nDNS/routes/Vercel aliases: UNCHANGED\n' "$APPROVED_SHA" "$LIVE_WORKER" "$NEW_VERSION" >> "$GITHUB_STEP_SUMMARY"
