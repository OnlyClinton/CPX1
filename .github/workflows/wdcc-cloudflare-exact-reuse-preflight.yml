name: WDCC Cloudflare Exact Reuse Preflight

on:
  push:
    branches: [diagnostic/wdcc-cloudflare-worker-capacity-20260827]
    paths:
      - '.github/workflows/wdcc-cloudflare-exact-reuse-preflight.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify three exact worker reuse targets are existing and unattached
        shell: bash
        run: |
          set -euo pipefail
          targets=(wdcc-v53-1-staging wdcc-v53-staging wdcc-proof-04a2a133)
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" "${auth[@]}" > /tmp/scripts.json
          curl -fsS "https://api.cloudflare.com/client/v4/zones?name=wedontcarecars.com" "${auth[@]}" > /tmp/zones.json
          zone="$(jq -r '.result[0].id // empty' /tmp/zones.json)"; test -n "$zone"
          curl -fsS "https://api.cloudflare.com/client/v4/zones/$zone/workers/routes" "${auth[@]}" > /tmp/routes.json
          set +e
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" "${auth[@]}" > /tmp/domains.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] || ! jq -e '.success==true' /tmp/domains.json >/dev/null 2>&1; then echo '{"success":true,"result":[]}' >/tmp/domains.json; fi
          for name in "${targets[@]}"; do
            jq -e --arg n "$name" 'any(.result[]?; ((.id // .name // .script // "") == $n))' /tmp/scripts.json >/dev/null
            jq -e --arg n "$name" 'all(.result[]?; ((.script // .script_name // "") != $n))' /tmp/routes.json >/dev/null
            jq -e --arg n "$name" 'all(.result[]?; ((.service // .script // .script_name // "") != $n))' /tmp/domains.json >/dev/null
            jq -r --arg n "$name" '.result[]? | select((.id // .name // .script // "") == $n) | {name:(.id // .name // .script),modified:(.modified_on // .modifiedOn // .created_on // null)}' /tmp/scripts.json
          done
          echo 'EXACT_REUSE_PREFLIGHT=PASS'
