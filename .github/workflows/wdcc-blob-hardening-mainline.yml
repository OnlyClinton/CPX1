name: WDCC State Hardening Mainline Proof

on:
  push:
    branches:
      - fix/wdcc-blob-hardening-mainline-20260826
    paths:
      - lib/store.ts
      - lib/postgresState.ts
      - lib/wdccAuthority.ts
      - app/api/health/route.ts
      - scripts/wdcc-import-state-postgres.mjs
      - db/wdcc-platform-state-v2.sql
      - package.json
      - package-lock.json
      - .github/workflows/wdcc-blob-hardening-mainline.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-state-hardening-mainline
  cancel-in-progress: true

jobs:
  build-and-recovery-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      PROJECT_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
      EXPECTED_STORE_ID: store_cNUyQRVlXtyvZQ5N
      MIN_KNOWN_CLEAN_REVISION: "640"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and compile only
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Verify durable state guards and provider-neutral lane
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'READ_CACHE_TTL_MS' lib/store.ts
          grep -q 'readInFlight' lib/store.ts
          grep -q 'STATE_PROVIDER_BLOCKED' lib/store.ts
          grep -q 'BACKUP_READ_LIMIT' lib/store.ts
          grep -q 'BACKUP_SCAN_MAX_PAGES' lib/store.ts
          grep -q 'BACKUP_LIST_PAGE_SIZE' lib/store.ts
          grep -q 'private/state/backups/platform-v3-' lib/store.ts
          grep -q 'result?.cursor' lib/store.ts
          grep -q 'providerAccessBlocked' lib/store.ts
          grep -q 'isInternalVehicleRecord' lib/store.ts
          grep -q '!isInternalVehicleRecord(vehicle)' lib/store.ts
          grep -q 'selectedStateProvider' lib/store.ts
          grep -q 'readPostgresState' lib/store.ts
          grep -q 'writePostgresState' lib/store.ts
          grep -q 'STATE_WRITE_CONFLICT' lib/postgresState.ts
          grep -q 'STATE_POSTGRES_CHECKSUM_MISMATCH' lib/postgresState.ts
          grep -q 'wdcc_platform_state_history' lib/postgresState.ts
          grep -q 'WDCC_IMPORT_CONFIRM' scripts/wdcc-import-state-postgres.mjs
          grep -q 'WDCC_IMPORT_EXPECTED_REVISION' scripts/wdcc-import-state-postgres.mjs
          grep -q 'CREATE TABLE IF NOT EXISTS public.wdcc_platform_state' db/wdcc-platform-state-v2.sql
          grep -q 'wdcc_platform_state_imports' db/wdcc-platform-state-v2.sql
          grep -q 'WDCC_CANONICAL_BLOB_STORE_ID' lib/wdccAuthority.ts
          grep -q 'store_cNUyQRVlXtyvZQ5N' lib/wdccAuthority.ts
          grep -q 'if(oidcToken&&canonicalStoreId)' lib/wdccAuthority.ts
          grep -q '"@neondatabase/serverless"' package.json
          grep -q 'node_modules/@neondatabase/serverless' package-lock.json
          echo 'WDCC_STATE_HARDENING_STATIC=PASS' >> "$GITHUB_STEP_SUMMARY"

      - name: Read-only provider/store metadata diagnostic
        id: provider
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          code="$(curl -sS -o /tmp/wdcc-store-meta.json -w '%{http_code}' \
            "https://api.vercel.com/storage/stores/$EXPECTED_STORE_ID?teamId=$ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN")"
          echo "http=$code" >> "$GITHUB_OUTPUT"
          if jq -e . /tmp/wdcc-store-meta.json >/dev/null 2>&1; then
            jq '(.store // .) | {id,name,type,status,region,access,ownerId,projectId,projects,createdAt,updatedAt,usage,reason,error,message}' \
              /tmp/wdcc-store-meta.json | tee /tmp/wdcc-store-meta-sanitized.json
          else
            printf '{"http":"%s","body":"non-json"}\n' "$code" | tee /tmp/wdcc-store-meta-sanitized.json
          fi
          {
            echo '### WDCC Blob provider metadata'
            echo
            echo "HTTP: $code"
            echo '```json'
            cat /tmp/wdcc-store-meta-sanitized.json
            echo '```'
            echo
            echo 'Metadata read only; no storage or project setting changed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Classify exact canonical recovery state read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          npm install --global vercel@59.3.0 >/dev/null
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$PROJECT_ID" > .vercel/project.json

          cat > .wdcc-recovery-proof.mjs <<'NODE'
          import crypto from 'node:crypto';
          import {get} from '@vercel/blob';

          const path='private/state/platform-v3.json';
          const expected=process.env.EXPECTED_STORE_ID;
          const minimum=Number(process.env.MIN_KNOWN_CLEAN_REVISION||0);
          const oidcToken=process.env.VERCEL_OIDC_TOKEN||'';
          const connectedStoreId=process.env.BLOB_STORE_ID||'';
          const stores=[
            ['canonical-v10','store_cNUyQRVlXtyvZQ5N'],
            ['clean-bootstrap','store_vVJ5kU6x76yZVkGs'],
            ['rescue-bootstrap','store_KopvAQeMcatdS5DS'],
            ['private-20260801','store_LdMSV1550BRgc0SP']
          ];

          if(!oidcToken)throw Error('OIDC_TOKEN_MISSING');

          async function read(storeId,pathname=path){
            const r=await get(pathname,{access:'private',useCache:false,oidcToken,storeId});
            if(!r||r.statusCode!==200||!r.stream)throw Error(`READ_FAILED:${pathname}`);
            const chunks=[];
            for await(const chunk of r.stream)chunks.push(chunk);
            const raw=Buffer.concat(chunks);
            const state=JSON.parse(raw.toString('utf8'));
            if(!Array.isArray(state.users)||!Array.isArray(state.leads)||!Array.isArray(state.vehicles)||!Array.isArray(state.audit))throw Error('STATE_CONTRACT_INVALID');
            const timestamps=[state.updatedAt,...state.vehicles.map(v=>v?.updatedAt||v?.createdAt),...state.leads.map(l=>l?.updatedAt||l?.createdAt),...state.audit.map(a=>a?.at)].filter(Boolean).map(String).sort();
            const badPublishedVehicles=state.vehicles.filter(v=>String(v?.status||'').toLowerCase()==='published'&&(Number(v?.year)<=1900||!String(v?.make||'').trim()||!String(v?.model||'').trim()||Number(v?.price||v?.cashPrice||0)<=0||String(v?.stock||'').toUpperCase().startsWith('R36TEST-'))).length;
            const qaLeads=state.leads.filter(l=>l?.qa===true||String(l?.status||'').toLowerCase()==='test'||String(l?.email||'').toLowerCase().endsWith('@invalid.example')||String(l?.name||'').toUpperCase().startsWith('WDCC QA ')).length;
            return {
              revision:Number(state.revision||0),
              users:state.users.length,
              vehicles:state.vehicles.length,
              leads:state.leads.length,
              audit:state.audit.length,
              badPublishedVehicles,
              qaLeads,
              latestTimestamp:timestamps.at(-1)||null,
              sha256:crypto.createHash('sha256').update(raw).digest('hex')
            };
          }

          const results=[];
          for(const [name,storeId] of stores){
            try{results.push({name,storeId,ok:true,...await read(storeId)});}
            catch(error){results.push({name,storeId,ok:false,error:String(error?.message||error)});}
          }

          const canonical=results.find(x=>x.storeId===expected);
          let emergencyFallback=null;
          if(!canonical?.ok){
            try{
              const pathname='private/state/backups/platform-v3-pre-phx-v4-clean-32881804744-3-r639-8a204b36-3426-4a68-8141-8a44e1ffb931.json';
              emergencyFallback={ok:true,pathname,...await read(expected,pathname)};
            }catch(error){emergencyFallback={ok:false,error:String(error?.message||error)};}
          }

          const providerBlocked=results.every(x=>!x.ok&&/403|forbidden|quota|usage limit/i.test(String(x.error||'')))&&
            (!emergencyFallback||(!emergencyFallback.ok&&/403|forbidden|quota|usage limit/i.test(String(emergencyFallback.error||''))));
          const classification=canonical?.ok&&canonical.revision>=minimum?'ready':providerBlocked?'provider_blocked':'unresolved';
          const report={
            ok:classification==='ready',
            classification,
            expectedStoreId:expected,
            connectedStoreId:connectedStoreId||null,
            connectedStoreDrift:Boolean(connectedStoreId&&connectedStoreId!==expected),
            minimumKnownCleanRevision:minimum,
            canonical,
            emergencyFallback,
            candidates:results
          };
          console.log('RECOVERY_PROOF='+JSON.stringify(report));
          NODE

          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID \
            vercel env run --environment=production --token="$VERCEL_TOKEN" --scope=cpxagency -- \
            node .wdcc-recovery-proof.mjs | tee /tmp/wdcc-recovery-proof.log
          rm -f .wdcc-recovery-proof.mjs

          grep '^RECOVERY_PROOF=' /tmp/wdcc-recovery-proof.log | tail -1 | cut -d= -f2- > /tmp/wdcc-recovery-proof.json
          jq . /tmp/wdcc-recovery-proof.json
          classification="$(jq -r '.classification' /tmp/wdcc-recovery-proof.json)"

          {
            echo '### WDCC canonical recovery gate'
            echo
            echo "Exact SHA: $GITHUB_SHA"
            echo "Canonical store: $EXPECTED_STORE_ID"
            echo "Classification: $classification"
            echo "Connected-store drift: $(jq -r '.connectedStoreDrift' /tmp/wdcc-recovery-proof.json)"
            if [ "$classification" = ready ]; then
              echo "Canonical revision: $(jq -r '.canonical.revision' /tmp/wdcc-recovery-proof.json)"
              echo "State SHA-256: $(jq -r '.canonical.sha256' /tmp/wdcc-recovery-proof.json)"
            elif [ "$classification" = provider_blocked ]; then
              echo 'Canonical and fallback reads are consistently provider-blocked. This is an external storage entitlement/quota gate, not a code/build failure.'
            fi
            echo
            echo 'Read-only verification only. No Blob object, deployment, route, alias, DNS, provider setting, or production data was changed.'
          } >> "$GITHUB_STEP_SUMMARY"

          case "$classification" in
            ready|provider_blocked) exit 0 ;;
            *) echo 'RECOVERY_STATE_UNRESOLVED' >&2; exit 2 ;;
          esac
