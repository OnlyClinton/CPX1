name: WDCC 522 Immutable Parser Proof

on:
  push:
    branches: [proof/wdcc-522-immutable-parser-20260829]
    paths:
      - '.github/workflows/wdcc-522-immutable-parser-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-522-immutable-parser-proof
  cancel-in-progress: true

env:
  FROZEN_CANDIDATE_SHA: 883f211f345f69967ffad84c3dec3ff36e4f0aee

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove frozen parent
        run: |
          set -euo pipefail
          git cat-file -e "$FROZEN_CANDIDATE_SHA^{commit}"
          test "$(git rev-parse HEAD^)" = "$FROZEN_CANDIDATE_SHA"
          echo "FROZEN_PARENT=$FROZEN_CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build exact candidate payload
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          c.name=`wdcc-v2-${process.env.FROZEN_CANDIDATE_SHA.slice(0,12)}-parser`;
          c.workers_dev=true;
          c.preview_urls=true;
          c.vars={...(c.vars||{}),WDCC_MOCKUP_PREVIEW:'1'};
          delete c.route; delete c.routes;
          fs.writeFileSync('wrangler.parser.jsonc',JSON.stringify(c,null,2)+'\n');
          NODE
          ! grep -qi 'wedontcarecars.com' wrangler.parser.jsonc
      - name: Upload immutable no-route version and inspect safe schema
        id: upload
        run: |
          set -euo pipefail
          export WRANGLER_OUTPUT_FILE_PATH=/tmp/wrangler-version-upload.ndjson
          : > "$WRANGLER_OUTPUT_FILE_PATH"
          npx wrangler versions upload --config wrangler.parser.jsonc 2>&1 | tee /tmp/upload.log
          test -s "$WRANGLER_OUTPUT_FILE_PATH"
          echo '=== SAFE WRANGLER NDJSON SHAPE ==='
          jq -c 'if type=="object" then {type,version,keys:(keys|sort),worker_name,version_id,preview_url} else {json_type:type} end' "$WRANGLER_OUTPUT_FILE_PATH"
          echo '=== SAFE STDOUT IDENTIFIERS ==='
          grep -E 'Uploaded wdcc-v2-|Worker Version ID:|workers\.dev' /tmp/upload.log || true
          echo 'PRODUCTION_DEPLOYED=NO'
          echo 'ROUTES_CHANGED=NO'
