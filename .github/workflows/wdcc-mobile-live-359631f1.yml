name: WDCC Owner Approved Mobile Live 359631F1

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: wdcc-mobile-live-359631f1
  cancel-in-progress: false

env:
  RELEASE_SHA: 8daf842583bcfec6e56c9c2845974d9df1d4a100
  VISUAL_SHA: 359631f1ec434f66f5ea400dfa6dff5d277ab7dc
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_SCOPE: cpxagency
  VERCEL_TEAM_ID: team_G6jmETRRl8fV3KfivPOdj8JM
  VERCEL_ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
  VERCEL_PROJECT_ID: prj_We7xkAkB5Qy31Pt17USSkQFE0u7h
  APEX: wedontcarecars.com
  WWW: www.wedontcarecars.com

jobs:
  promote:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 205 &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.body == 'PROMOTE-WDCC-MOBILE-359631F1')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fail-closed owner release gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          COMMENT_USER: ${{ github.event.comment.user.login || '' }}
          ISSUE_NUMBER: ${{ github.event.issue.number || 0 }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = issue_comment ]; then
            test "$ISSUE_NUMBER" = 205
            test "$COMMENT_USER" = "$GITHUB_REPOSITORY_OWNER"
            test "$COMMENT_BODY" = 'PROMOTE-WDCC-MOBILE-359631F1'
          fi
          curl -fsS "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/205" \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' > /tmp/issue.json
          jq -e '.number==205 and .state=="open"' /tmp/issue.json >/dev/null
          curl -fsS "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/205/comments?per_page=100" \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' > /tmp/comments.json
          token="WDCC_OWNER_VISUAL_APPROVAL $VISUAL_SHA"
          jq -e --arg owner "$GITHUB_REPOSITORY_OWNER" --arg token "$token" \
            'any(.[]; .user.login==$owner and .author_association=="OWNER" and (((.body // "") | split("\n")[0])==$token))' \
            /tmp/comments.json >/dev/null
          curl -fsS "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/591" \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' > /tmp/pr.json
          jq -e --arg head "$VISUAL_SHA" --arg merge "$RELEASE_SHA" \
            '.merged==true and .head.sha==$head and .merge_commit_sha==$merge' /tmp/pr.json >/dev/null
          echo "OWNER_RELEASE_GATE=PASS visual=$VISUAL_SHA release=$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Require Vercel authority
        run: test -n "${VERCEL_TOKEN:-}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Prove immutable release ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$VISUAL_SHA"
          test -f app/mobile-density-polish.css
          grep -Fq 'width:92px!important' app/mobile-density-polish.css
          grep -Fq 'window.scrollY>140' app/FinalCTAContract.tsx
          echo 'IMMUTABLE_RELEASE_ANCESTRY=PASS' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install and link Vercel CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global vercel@59.5.0
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"

      - name: Build and deploy immutable mobile donor
        id: donor
        shell: bash
        run: |
          set -euo pipefail
          vercel build --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
          target="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" | tail -1 | sed 's#https://##')"
          test -n "$target"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "IMMUTABLE_MOBILE_DONOR=$target" >> "$GITHUB_STEP_SUMMARY"
          for path in / /inventory /get-approved /schedule-test-drive /app; do
            vercel --scope "$VERCEL_SCOPE" curl "$path" --deployment "$target" > /tmp/donor.html
            test -s /tmp/donor.html
          done
          vercel --scope "$VERCEL_SCOPE" curl / --deployment "$target" > /tmp/donor-home.html
          grep -qi 'we don.t care' /tmp/donor-home.html
          grep -q 'wdcc-logo-transparent.webp' /tmp/donor-home.html
          grep -q 'wdcc-hero-r31.webp' /tmp/donor-home.html
          echo 'IMMUTABLE_DONOR_ROUTES=PASS' >> "$GITHUB_STEP_SUMMARY"

      - name: Pin apex and www with dynamic exact rollback, then verify
        shell: bash
        env:
          TARGET: ${{ steps.donor.outputs.target }}
        run: |
          set -Eeuo pipefail
          for host in "$APEX" "$WWW"; do
            key="${host//./_}"
            curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$host?teamId=$VERCEL_TEAM_ID" > "/tmp/current-$key.json"
            current="$(jq -r '.url // empty' "/tmp/current-$key.json")"
            test -n "$current"
            printf '%s' "$current" > "/tmp/rollback-$key"
            echo "ROLLBACK_TARGET $host -> $current"
          done

          changed=0
          rollback(){
            rc=$?
            trap - ERR INT TERM
            if [ "$changed" = 1 ]; then
              for host in "$APEX" "$WWW"; do
                key="${host//./_}"
                old="$(cat "/tmp/rollback-$key")"
                vercel alias set "$old" "$host" --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" || true
              done
              echo 'ROLLBACK_EXECUTED=YES' >> "$GITHUB_STEP_SUMMARY"
            fi
            exit "$rc"
          }
          trap rollback ERR INT TERM

          changed=1
          vercel alias set "$TARGET" "$APEX" --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
          vercel alias set "$TARGET" "$WWW" --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"

          for host in "$APEX" "$WWW"; do
            ok=0
            for i in $(seq 1 40); do
              curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v13/deployments/$host?teamId=$VERCEL_TEAM_ID" > /tmp/live-meta.json || true
              live="$(jq -r '.url // empty' /tmp/live-meta.json 2>/dev/null || true)"
              if [ "$live" = "$TARGET" ]; then ok=1; break; fi
              sleep 2
            done
            test "$ok" = 1

            for path in / /inventory /get-approved /schedule-test-drive /app; do
              code="$(curl -sS -L --max-time 25 -o /tmp/live.html -w '%{http_code}' "https://$host$path?mobileproof=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" || true)"
              echo "$code" | grep -Eq '^(200|302|307|308)$'
            done
            curl -fsS "https://$host/?mobileproof=$GITHUB_RUN_ID" -o /tmp/live-home.html
            grep -qi 'we don.t care' /tmp/live-home.html
            grep -q 'wdcc-logo-transparent.webp' /tmp/live-home.html
            grep -q 'wdcc-hero-r31.webp' /tmp/live-home.html
          done

          dealer_code="$(curl -sS -L --max-time 20 -o /tmp/dealer.html -w '%{http_code}' https://dealer.wedontcarecars.com/dealer || true)"
          echo "$dealer_code" | grep -Eq '^(200|302|307|308)$'
          trap - ERR INT TERM
          echo 'WDCC_MOBILE_359631F1_LIVE=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'DEALER_DOMAIN_UNCHANGED=PASS' >> "$GITHUB_STEP_SUMMARY"
