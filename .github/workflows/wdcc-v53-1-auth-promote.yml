name: WDCC V53.1 Authenticated Dealer Promotion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-v53-1-auth-promote.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wdcc-v53-1-auth-promote
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  SOURCE_SHA: 05eb60918e7bf305afbeb18303049f42d243e7a4
  STAGE: https://wdcc-v53-1-staging.clico-global.workers.dev
  BACKEND: https://wdcc-cpx-launch-cpxagency.vercel.app
  DEALER: https://dealer.wedontcarecars.com
  CUSTOMER: https://wedontcarecars.com
  LIVE_WORKER: wdcc-dealer-frontdoor
  TEAM: cpxagency
  ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
  PHOENIX_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_API_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Preflight exact source, staging, backend and customer baseline
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ZONE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${VERCEL_TOKEN:-}"
          curl -fsS "$STAGE/api/health?auth-promote=$GITHUB_RUN_ID" -o /tmp/stage-health.json
          jq -e '.ok==true and .degraded==false and .release=="WDCC-V53-OPS-HARDENED" and .backend=="healthy"' /tmp/stage-health.json >/dev/null
          curl -fsS "$BACKEND/api/health?auth-promote=$GITHUB_RUN_ID" -o /tmp/backend-health.json
          jq -e '.ok==true and .degraded==false' /tmp/backend-health.json >/dev/null
          curl -fsS -L "$CUSTOMER/?auth-promote-before=$GITHUB_RUN_ID" -o /tmp/customer-before.html
          grep -q 'intro-sequence intro-impact' /tmp/customer-before.html
          grep -q 'mobile-action-bar' /tmp/customer-before.html
          grep -q '/assets/cars/2016-ford-f150-limited-1.webp' /tmp/customer-before.html
          curl -fsS -L "$STAGE/dealer" -o /tmp/stage-dealer.html
          grep -q 'SALES COMMAND' /tmp/stage-dealer.html
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Install identity browser and deployment runtime
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --global vercel@59.3.0 >/dev/null
          npm install --no-save --package-lock=false @opennextjs/cloudflare@latest wrangler@latest playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          mkdir -p .vercel /tmp/screens
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$PHOENIX_ID" > .vercel/project.json
          cat > /tmp/v531-ui-check.mjs <<'NODE'
          import {chromium} from 'playwright';
          const base=process.env.BASE,email=process.env.QA_EMAIL,password=process.env.QA_PASSWORD,label=process.env.LABEL||'target';
          if(!base||!email||!password)throw Error('UI_CHECK_ENV_MISSING');
          const browser=await chromium.launch({headless:true});
          try{
            const context=await browser.newContext({viewport:{width:1440,height:1000}});const page=await context.newPage();
            await page.goto(`${base}/dealer`,{waitUntil:'networkidle'});
            await page.locator('input[autocomplete="username"]').fill(email);
            await page.locator('input[autocomplete="current-password"]').fill(password);
            await page.getByRole('button',{name:/sign in/i}).click();
            await page.waitForFunction(()=>document.body.innerText.includes('NEXT BEST MOVE')&&document.body.innerText.includes('OVERDUE')&&document.body.innerText.includes('CUSTOMER LIVE')&&document.body.innerText.includes('NOTIFY GAPS'),null,{timeout:30000});
            await page.screenshot({path:`/tmp/screens/${label}-dashboard.png`,fullPage:true});
            await page.goto(`${base}/dealer/leads`,{waitUntil:'networkidle'});
            await page.waitForFunction(()=>document.body.innerText.includes('OVERDUE')&&document.body.innerText.includes('NOTIFY'),null,{timeout:30000});
            await page.screenshot({path:`/tmp/screens/${label}-leads.png`,fullPage:true});
            await page.goto(`${base}/dealer/inventory`,{waitUntil:'networkidle'});
            await page.waitForFunction(()=>document.body.innerText.includes('Customer Live'),null,{timeout:30000});
            await page.screenshot({path:`/tmp/screens/${label}-inventory.png`,fullPage:true});
            console.log(JSON.stringify({ok:true,base,label}));
          }finally{await browser.close()}
          NODE

      - name: Create short-lived dealer acceptance identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          export RUN_TAG="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > /tmp/create-auth-user.mjs <<'NODE'
          import crypto from 'node:crypto';import fs from 'node:fs';import {get,head,put,BlobPreconditionFailedError} from '@vercel/blob';
          const path='private/state/platform-v3.json',run=process.env.RUN_TAG;
          async function stable(){for(let i=0;i<6;i++){const a=await head(path);const r=await get(path,{access:'private',useCache:false});if(!r||r.statusCode!==200||!r.stream)throw Error('STATE_READ_FAILED');const chunks=[];for await(const x of r.stream)chunks.push(x);const raw=Buffer.concat(chunks),b=await head(path);if(a.etag===b.etag)return{raw,etag:b.etag,state:JSON.parse(raw.toString('utf8'))}}throw Error('STATE_TOO_HOT')}
          for(let attempt=1;attempt<=5;attempt++){const before=await stable(),s=before.state,now=new Date().toISOString();const password=`WdccV531-${crypto.randomBytes(18).toString('base64url')}!`,salt=crypto.randomBytes(24),digest=crypto.scryptSync(password,salt,64),passwordHash=`scrypt$${salt.toString('base64url')}$${digest.toString('base64url')}`;const id=`v531-auth-${crypto.randomUUID()}`,email=`v531-auth-${run}@invalid.example`;s.users=Array.isArray(s.users)?s.users:[];s.audit=Array.isArray(s.audit)?s.audit:[];s.users.push({id,email,username:email,displayName:`V53.1 Auth Acceptance ${run}`,role:'dealer_agent',tenantId:'wdcc',status:'active',disabled:false,passwordHash});const backup=`private/state/backups/platform-v3-pre-v531-auth-r${Number(s.revision||0)}-${crypto.randomUUID()}.json`;await put(backup,before.raw,{access:'private',addRandomSuffix:false,allowOverwrite:false,contentType:'application/json'});s.audit.push({id:crypto.randomUUID(),at:now,action:'qa.v531.auth_create',actor:'github-actions',run,userId:id,backup});s.revision=Number(s.revision||0)+1;s.updatedAt=now;try{await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:before.etag});fs.writeFileSync('/tmp/v531-auth.env',`QA_ID=${id}\nQA_EMAIL=${email}\nQA_PASSWORD=${password}\nRUN_TAG=${run}\n`);console.log(JSON.stringify({ok:true,id,email,backup}));process.exit(0)}catch(e){if(e instanceof BlobPreconditionFailedError&&attempt<5)continue;throw e}}
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- node /tmp/create-auth-user.mjs
          set -a; . /tmp/v531-auth.env; set +a
          printf '::add-mask::%s\n' "$QA_PASSWORD"
          echo 'created=true' >> "$GITHUB_OUTPUT"

      - name: Authenticated V53.1 staging acceptance
        id: authstage
        shell: bash
        run: |
          set -euo pipefail
          set -a; . /tmp/v531-auth.env; set +a
          printf '::add-mask::%s\n' "$QA_PASSWORD"
          payload="$(jq -nc --arg u "$QA_EMAIL" --arg p "$QA_PASSWORD" '{username:$u,email:$u,password:$p}')"
          code="$(curl -sS -c /tmp/stage.cookies -o /tmp/stage-login.json -w '%{http_code}' -H "Origin: $STAGE" -H 'content-type: application/json' -X POST "$STAGE/api/auth/login" --data "$payload")"
          test "$code" = 200
          jq -e '.ok==true' /tmp/stage-login.json >/dev/null
          scode="$(curl -sS -b /tmp/stage.cookies -o /tmp/stage-session.json -w '%{http_code}' "$STAGE/api/auth/session")"
          test "$scode" = 200
          jq -e '.authenticated==true and ((.user.role|ascii_downcase)=="dealer_agent")' /tmp/stage-session.json >/dev/null
          for path in /api/crm/dashboard /api/leads /api/inventory; do
            c="$(curl -sS -b /tmp/stage.cookies -o /tmp/stage-feed.json -w '%{http_code}' "$STAGE$path")"
            test "$c" = 200
            jq -e '.ok==true' /tmp/stage-feed.json >/dev/null
          done
          BASE="$STAGE" LABEL=stage QA_EMAIL="$QA_EMAIL" QA_PASSWORD="$QA_PASSWORD" node /tmp/v531-ui-check.mjs
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Capture live Cloudflare rollback point and route
        id: cfpre
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify -o /tmp/cf-token.json
          jq -e '.success==true and .result.status=="active"' /tmp/cf-token.json >/dev/null
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_ZONE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=wedontcarecars.com&account.id=$CLOUDFLARE_ACCOUNT_ID&per_page=50" -o /tmp/zones.json
          jq -e '.success==true and (.result|length)==1' /tmp/zones.json >/dev/null
          ZONE_ID="$(jq -r '.result[0].id' /tmp/zones.json)"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_ZONE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=dealer.wedontcarecars.com" -o /tmp/dealer-dns.json
          jq -e '.success==true and (.result|length)==1 and .result[0].proxied==true' /tmp/dealer-dns.json >/dev/null
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$LIVE_WORKER/routes" -o /tmp/routes.json
          jq -e --arg p 'dealer.wedontcarecars.com/*' --arg s "$LIVE_WORKER" '.success==true and any(.result[]?;.pattern==$p and .script==$s)' /tmp/routes.json >/dev/null
          npx wrangler deployments status --name "$LIVE_WORKER" --json > /tmp/live-deployments.json
          OLD_VERSION="$(jq -r '[.. | objects | select((.percentage? // 0)==100) | (.version_id? // .versionId? // empty)] | first // empty' /tmp/live-deployments.json)"
          if [ -z "$OLD_VERSION" ]; then OLD_VERSION="$(jq -r '[.. | objects | .version_id? // .versionId? // empty] | map(select(type=="string" and length>0)) | first // empty' /tmp/live-deployments.json)"; fi
          test -n "$OLD_VERSION"
          echo "old_version=$OLD_VERSION" >> "$GITHUB_OUTPUT"
          echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"

      - name: Build and upload V53.1 live-worker version with zero traffic
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          cat > open-next.config.ts <<'EOF'
          import { defineCloudflareConfig } from "@opennextjs/cloudflare";
          export default defineCloudflareConfig();
          EOF
          node <<'NODE'
          const fs=require('fs');const p='wrangler.jsonc';const cfg=JSON.parse(fs.readFileSync(p,'utf8'));
          cfg.name=process.env.LIVE_WORKER;cfg.workers_dev=false;cfg.preview_urls=true;cfg.keep_vars=true;delete cfg.route;delete cfg.routes;
          cfg.vars=cfg.vars||{};cfg.vars.WDCC_RUNTIME_ROLE='frontend';cfg.vars.WDCC_DEALER_BACKEND_URL=process.env.BACKEND;
          fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          NODE
          npx opennextjs-cloudflare build
          TAG="wdcc-v53-1-${GITHUB_RUN_ID}"
          npx wrangler versions upload --name "$LIVE_WORKER" --tag "$TAG" --message "WDCC V53.1 authenticated candidate $GITHUB_RUN_ID" 2>&1 | tee /tmp/upload.log
          npx wrangler versions list --name "$LIVE_WORKER" --json > /tmp/versions.json
          NEW_VERSION="$(jq -r --arg tag "$TAG" '[.. | objects | select((.tag? // "")==$tag) | (.id? // .version_id? // .versionId? // empty)] | first // empty' /tmp/versions.json)"
          if [ -z "$NEW_VERSION" ]; then NEW_VERSION="$(grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/upload.log | tail -1 || true)"; fi
          test -n "$NEW_VERSION"
          test "$NEW_VERSION" != "${{ steps.cfpre.outputs.old_version }}"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Atomic dealer-only promotion with automatic rollback
        id: cutover
        env:
          OLD_VERSION: ${{ steps.cfpre.outputs.old_version }}
          NEW_VERSION: ${{ steps.upload.outputs.new_version }}
        shell: bash
        run: |
          set -euo pipefail
          rollback(){ rc=$?; echo "Promotion gate failed; rolling back to $OLD_VERSION" >&2; npx wrangler rollback "$OLD_VERSION" --name "$LIVE_WORKER" --message "WDCC V53.1 automatic rollback $GITHUB_RUN_ID" || true; exit "$rc"; }
          trap rollback ERR INT TERM
          npx wrangler versions deploy "$NEW_VERSION@100%" --name "$LIVE_WORKER" -y --message "WDCC V53.1 dealer promotion $GITHUB_RUN_ID"
          ok=0
          for attempt in $(seq 1 25); do
            code="$(curl -sS -o /tmp/live-health.json -w '%{http_code}' "$DEALER/api/health?v531-live=$GITHUB_RUN_ID-$attempt" || true)"
            if [ "$code" = 200 ] && jq -e '.ok==true and .degraded==false and .release=="WDCC-V53-OPS-HARDENED"' /tmp/live-health.json >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          set -a; . /tmp/v531-auth.env; set +a
          payload="$(jq -nc --arg u "$QA_EMAIL" --arg p "$QA_PASSWORD" '{username:$u,email:$u,password:$p}')"
          lcode="$(curl -sS -c /tmp/live.cookies -o /tmp/live-login.json -w '%{http_code}' -H "Origin: $DEALER" -H 'content-type: application/json' -X POST "$DEALER/api/auth/login" --data "$payload")"
          test "$lcode" = 200
          jq -e '.ok==true' /tmp/live-login.json >/dev/null
          for path in /api/auth/session /api/crm/dashboard /api/leads /api/inventory; do
            c="$(curl -sS -b /tmp/live.cookies -o /tmp/live-check.json -w '%{http_code}' "$DEALER$path")"
            test "$c" = 200
          done
          jq -e '.authenticated==true' <(curl -sS -b /tmp/live.cookies "$DEALER/api/auth/session") >/dev/null
          BASE="$DEALER" LABEL=live QA_EMAIL="$QA_EMAIL" QA_PASSWORD="$QA_PASSWORD" node /tmp/v531-ui-check.mjs
          curl -fsS -L "$CUSTOMER/?v531-live-after=$GITHUB_RUN_ID" -o /tmp/customer-after.html
          grep -q 'intro-sequence intro-impact' /tmp/customer-after.html
          grep -q 'mobile-action-bar' /tmp/customer-after.html
          grep -q '/assets/cars/2016-ford-f150-limited-1.webp' /tmp/customer-after.html
          trap - ERR INT TERM
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Upload authenticated visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wdcc-v53-1-auth-promote-${{ github.run_id }}
          path: /tmp/screens/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove short-lived dealer acceptance identity
        id: cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [ -f /tmp/v531-auth.env ] || { echo 'ok=true' >> "$GITHUB_OUTPUT"; exit 0; }
          set -a; . /tmp/v531-auth.env; set +a
          export QA_ID RUN_TAG
          cat > /tmp/cleanup-auth-user.mjs <<'NODE'
          import crypto from 'node:crypto';import {get,head,put,BlobPreconditionFailedError} from '@vercel/blob';
          const path='private/state/platform-v3.json',id=process.env.QA_ID,run=process.env.RUN_TAG;
          async function stable(){for(let i=0;i<6;i++){const a=await head(path);const r=await get(path,{access:'private',useCache:false});if(!r||r.statusCode!==200||!r.stream)throw Error('STATE_READ_FAILED');const chunks=[];for await(const x of r.stream)chunks.push(x);const raw=Buffer.concat(chunks),b=await head(path);if(a.etag===b.etag)return{raw,etag:b.etag,state:JSON.parse(raw.toString('utf8'))}}throw Error('STATE_TOO_HOT')}
          for(let attempt=1;attempt<=5;attempt++){const before=await stable(),s=before.state,users=Array.isArray(s.users)?s.users:[];s.users=users.filter(u=>u.id!==id);s.audit=Array.isArray(s.audit)?s.audit:[];s.audit.push({id:crypto.randomUUID(),at:new Date().toISOString(),action:'qa.v531.auth_cleanup',actor:'github-actions',run,userId:id});s.revision=Number(s.revision||0)+1;s.updatedAt=new Date().toISOString();try{await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:before.etag});console.log(JSON.stringify({ok:true,removed:users.length-s.users.length}));process.exit(0)}catch(e){if(e instanceof BlobPreconditionFailedError&&attempt<5)continue;throw e}}
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- node /tmp/cleanup-auth-user.mjs
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Publish promotion evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          PREFLIGHT: ${{ steps.preflight.outcome }}
          AUTH_STAGE: ${{ steps.authstage.outcome }}
          OLD_VERSION: ${{ steps.cfpre.outputs.old_version }}
          NEW_VERSION: ${{ steps.upload.outputs.new_version }}
          CUTOVER: ${{ steps.cutover.outcome }}
          CLEANUP: ${{ steps.cleanup.outcome }}
        shell: bash
        run: |
          INTEGRATIONS='not-live'
          if [ -f /tmp/live-health.json ]; then INTEGRATIONS="$(jq -c '.integrations // {}' /tmp/live-health.json)"; fi
          body=$(cat <<EOF
          Exact application source: \`$SOURCE_SHA\`
          Job: **$STATUS**
          Preflight: **$PREFLIGHT**
          Authenticated V53.1 staging acceptance: **$AUTH_STAGE**
          Previous live Worker version: \`${OLD_VERSION:-unknown}\`
          Uploaded V53.1 Worker version: \`${NEW_VERSION:-not-uploaded}\`
          Dealer-only cutover: **$CUTOVER**
          Temporary identity cleanup: **$CLEANUP**
          Live notification readiness: \`$INTEGRATIONS\`

          Customer production baseline is explicitly re-checked after dealer promotion. Any failed live gate triggers automatic Worker rollback.
          EOF
          )
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC V53.1 authenticated dealer promotion ${GITHUB_RUN_ID}" --body "$body" || true
