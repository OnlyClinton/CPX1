name: WDCC Approved Head Functional Proof

on:
  push:
    branches: [proof/wdcc-functional-eb804d9]
    paths: ['.github/workflows/wdcc-approved-head-functional-proof.yml']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wdcc-approved-head-functional-proof-eb804d9
  cancel-in-progress: false

env:
  APPROVED_SHA: eb804d9517c7c4832897f99eb085c931d5c1798d
  APPROVED_BRANCH: fix/wdcc-locked-contract-20260826
  BASE: https://wdcc-proof-eb804d9517c7c4832897f99eb085c931d5c1798d.clico-global.workers.dev
  TEAM: cpxagency
  TEAM_ID: team_G6jmETRRl8fV3KfivPOdj8JM
  PHOENIX_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR

jobs:
  functional-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Freeze approved application bytes and current PR head
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          git fetch --no-tags --depth=1 origin "$APPROVED_SHA"
          current="$(git ls-remote origin "refs/heads/$APPROVED_BRANCH" | awk '{print $1}')"
          test "$current" = "$APPROVED_SHA" || { echo "STALE_APPROVAL approved=$APPROVED_SHA current=$current" >&2; exit 40; }
          changed="$(git diff --name-only "$APPROVED_SHA" HEAD)"
          printf '%s\n' "$changed"
          test "$changed" = '.github/workflows/wdcc-approved-head-functional-proof.yml' || { echo 'PROOF_BRANCH_APP_BYTES_CHANGED' >&2; exit 41; }
          test "$(curl --http1.1 -sS -L -o /tmp/health.json -w '%{http_code}' "$BASE/api/health?functional-pre=$GITHUB_RUN_ID")" = 200
          jq -e '.ok==true' /tmp/health.json >/dev/null
          test "$(curl --http1.1 -sS -L -o /tmp/dealer.html -w '%{http_code}' "$BASE/dealer?functional-pre=$GITHUB_RUN_ID")" = 200
          grep -qi 'dealer' /tmp/dealer.html

      - name: Install QA-isolated functional runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false @vercel/blob@2 playwright@1.55.0 >/dev/null
          npm install --global vercel@59.5.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          mkdir -p .vercel /tmp/wdcc-functional-evidence
          printf '{"orgId":"%s","projectId":"%s"}\n' "$TEAM_ID" "$PHOENIX_ID" > .vercel/project.json

      - name: Create short-lived QA dealer identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          export RUN_TAG="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > /tmp/wdcc-functional-create.mjs <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import {get,head,put,BlobPreconditionFailedError} from '@vercel/blob';
          const path='private/state/platform-v3.json',run=process.env.RUN_TAG;
          async function stable(){for(let i=0;i<8;i++){const a=await head(path),r=await get(path,{access:'private',useCache:false});if(!r?.stream)throw Error('STATE_READ_FAILED');const chunks=[];for await(const x of r.stream)chunks.push(x);const raw=Buffer.concat(chunks),b=await head(path);if(a.etag===b.etag)return{raw,etag:b.etag,s:JSON.parse(raw.toString())}}throw Error('STATE_TOO_HOT')}
          for(let n=1;n<=6;n++){
            const before=await stable(),s=before.s,now=new Date().toISOString();
            const password=`Fn-${crypto.randomBytes(18).toString('base64url')}!`,salt=crypto.randomBytes(24),digest=crypto.scryptSync(password,salt,64),passwordHash=`scrypt$${salt.toString('base64url')}$${digest.toString('base64url')}`;
            const id=`fn-${crypto.randomUUID()}`,email=`fn-${run}@invalid.example`,stock=`QA-FN-${run}`,backup=`private/state/backups/platform-v3-pre-functional-${run}-r${Number(s.revision||0)}-${crypto.randomUUID()}.json`;
            await put(backup,before.raw,{access:'private',addRandomSuffix:false,allowOverwrite:false,contentType:'application/json'});
            s.users=Array.isArray(s.users)?s.users:[];
            s.users.push({id,email,username:email,displayName:`WDCC Functional QA ${run}`,role:'dealer_agent',tenantId:'wdcc',status:'active',disabled:false,passwordHash});
            s.revision=Number(s.revision||0)+1;s.updatedAt=now;
            try{await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:before.etag});fs.writeFileSync('/tmp/wdcc-functional.env',`RUN_TAG=${run}\nDEALER_ID=${id}\nDEALER_EMAIL=${email}\nQA_PASSWORD=${password}\nSTOCK=${stock}\nBACKUP=${backup}\n`);console.log(JSON.stringify({ok:true,id,email,stock,backup,revision:s.revision}));process.exit(0)}catch(e){if(e instanceof BlobPreconditionFailedError&&n<6)continue;throw e}
          }
          NODE
          RUN_TAG="$RUN_TAG" env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- node /tmp/wdcc-functional-create.mjs
          set -a; . /tmp/wdcc-functional.env; set +a
          printf '::add-mask::%s\n' "$QA_PASSWORD"
          echo "run_tag=$RUN_TAG" >> "$GITHUB_OUTPUT"

      - name: Prove auth leads dedupe inventory upload publish and QA isolation
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          set -a; . /tmp/wdcc-functional.env; set +a
          printf '::add-mask::%s\n' "$QA_PASSWORD"
          export BASE RUN_TAG STOCK DEALER_EMAIL QA_PASSWORD
          cat > /tmp/wdcc-functional-proof.mjs <<'NODE'
          import fs from 'node:fs';
          import {chromium} from 'playwright';
          const base=process.env.BASE,run=process.env.RUN_TAG,stock=process.env.STOCK,email=process.env.DEALER_EMAIL,password=process.env.QA_PASSWORD;
          const out={ok:false,base,approvedSha:process.env.APPROVED_SHA,run,stock,trace:[],consoleErrors:[]};
          const short=u=>{try{const x=new URL(u);return x.pathname+x.search}catch{return u}};
          async function body(r){try{return(await r.text()).slice(0,4000)}catch{return''}}
          const b=await chromium.launch({headless:true});
          try{
            const c=await b.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const p=await c.newPage();
            p.on('console',m=>{if(m.type()==='error')out.consoleErrors.push(m.text())});
            p.on('pageerror',e=>out.consoleErrors.push(String(e)));
            p.on('response',r=>{if(/\/api\/(auth|leads|inventory|upload)/.test(r.url()))out.trace.push({method:r.request().method(),url:short(r.url()),status:r.status()})});
            const first=await p.goto(`${base}/dealer/login?functional=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
            if(!first||first.status()!==200)throw Error(`DEALER_LOGIN_PAGE_${first?.status()||0}`);
            const login=await p.evaluate(async({email,password})=>{const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,password})});return{status:r.status,body:await r.text()}},{email,password});
            if(login.status!==200)throw Error(`LOGIN_${login.status}_${login.body}`);out.login=login.status;
            const ses=await p.evaluate(async()=>{const r=await fetch('/api/auth/session',{cache:'no-store'});return{status:r.status,body:await r.text()}});
            const sj=JSON.parse(ses.body);if(ses.status!==200||!sj.authenticated)throw Error(`SESSION_${ses.status}_${ses.body}`);out.session=ses.status;
            const dash=await p.evaluate(async()=>{const r=await fetch('/api/crm/dashboard',{cache:'no-store'});return{status:r.status,body:await r.text()}});if(dash.status!==200)throw Error(`DASHBOARD_${dash.status}_${dash.body}`);out.dashboard=dash.status;
            const ids=[],keys=[];
            for(const [kind,source] of [['schedule','schedule-test-drive'],['approval','get-approved'],['contact','call-sean']]){
              const key=`wdcc-fn-${kind}-${run}`;keys.push(key);
              const res=await p.evaluate(async({kind,source,run,key})=>{const r=await fetch('/api/leads',{method:'POST',headers:{'content-type':'application/json','Idempotency-Key':key},body:JSON.stringify({qa:true,kind,source,name:`WDCC QA FUNCTIONAL ${kind} ${run}`,phone:'813-555-0189',email:`qa-functional-${kind}-${run}@invalid.example`,vehicleInterest:'Approved-head QA proof',message:'Automated QA-isolated functional verification',consent:true})});return{status:r.status,body:await r.text()}},{kind,source,run,key});
              if(![200,201].includes(res.status))throw Error(`LEAD_${kind}_${res.status}_${res.body}`);const j=JSON.parse(res.body);if(!j.ok||!j.persisted||!j.item?.id)throw Error(`LEAD_CONTRACT_${kind}_${res.body}`);ids.push(j.item.id);
            }
            out.leadIds=ids;
            const dup=await p.evaluate(async({run,key})=>{const r=await fetch('/api/leads',{method:'POST',headers:{'content-type':'application/json','Idempotency-Key':key},body:JSON.stringify({qa:true,kind:'schedule',source:'schedule-test-drive',name:`WDCC QA FUNCTIONAL schedule ${run}`,phone:'813-555-0189',email:`qa-functional-schedule-${run}@invalid.example`,vehicleInterest:'Approved-head QA proof',message:'Automated QA-isolated functional verification',consent:true})});return{status:r.status,body:await r.text()}},{run,key:keys[0]});
            const dj=JSON.parse(dup.body);if(dup.status!==200||dj.deduplicated!==true||dj.item?.id!==ids[0])throw Error(`DEDUPE_${dup.status}_${dup.body}`);out.dedupe=true;
            const feed=await p.evaluate(async()=>{const r=await fetch('/api/leads',{cache:'no-store'});return{status:r.status,body:await r.text()}});if(feed.status!==200)throw Error(`LEADS_FEED_${feed.status}_${feed.body}`);const fj=JSON.parse(feed.body);for(const id of ids)if(!(fj.items||[]).some(x=>x.id===id))throw Error(`LEAD_READBACK_MISSING_${id}`);out.leadReadback=true;
            await p.goto(`${base}/dealer/inventory/new?functional=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
            async function fill(name,value){const x=p.locator(`input[name="${name}"],textarea[name="${name}"]`).first();await x.waitFor({state:'visible',timeout:20000});await x.fill(value,{force:true})}
            await fill('year','2019');await fill('make','Toyota');await fill('model','Corolla');await fill('trim',`Functional ${run}`);await fill('price','12345');await fill('downPayment','1500');await fill('mileage','54321');await fill('stock',stock);
            const desc=p.locator('textarea').first();if(await desc.count())await desc.fill(`QA-isolated approved-head functional proof ${run}`);
            fs.writeFileSync('/tmp/wdcc-functional.png',Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9WlV1GQAAAAASUVORK5CYII=','base64'));
            const input=p.locator('input[type=file][multiple]').first();if(!await input.count())throw Error('FILE_INPUT_MISSING');await input.setInputFiles('/tmp/wdcc-functional.png');
            await p.screenshot({path:'/tmp/wdcc-functional-evidence/add-vehicle-before-publish.png',fullPage:true});
            const draftP=p.waitForResponse(r=>short(r.url()).split('?')[0]==='/api/inventory'&&r.request().method()==='POST',{timeout:25000});
            const uploadP=p.waitForResponse(r=>short(r.url()).split('?')[0]==='/api/upload'&&r.request().method()==='POST',{timeout:45000});
            const publish=p.locator('button[type="submit"][name="intent"][value="published"]:visible').first();if(!await publish.count())throw Error('VISIBLE_PUBLISH_MISSING');await publish.click({noWaitAfter:true,timeout:10000});
            const draft=await draftP,dt=await body(draft);if(!draft.ok())throw Error(`DRAFT_${draft.status()}_${dt}`);const vehicleId=String(JSON.parse(dt).item?.id||'');if(!vehicleId)throw Error('DRAFT_ID_MISSING');out.vehicleId=vehicleId;
            const upload=await uploadP,ut=await body(upload);out.upload={status:upload.status(),body:ut.slice(0,1000)};if(!upload.ok())throw Error(`UPLOAD_${upload.status()}_${ut}`);
            const nav=await p.waitForURL(/\/dealer\/inventory\?saved=published(?:&|$)/,{timeout:50000}).then(()=>true).catch(()=>false);if(!nav)throw Error(`PUBLISH_NAV_${await p.locator('.statusMessage').first().textContent().catch(()=> '')}`);
            await p.screenshot({path:'/tmp/wdcc-functional-evidence/inventory-after-publish.png',fullPage:true});
            const inv=await p.evaluate(async()=>{const r=await fetch('/api/inventory',{cache:'no-store'});return{status:r.status,body:await r.text()}});if(inv.status!==200)throw Error(`INVENTORY_${inv.status}_${inv.body}`);const item=(JSON.parse(inv.body).items||[]).find(x=>x.id===vehicleId||x.stock===stock);if(!item||String(item.status).toLowerCase()!=='published'||!(item.photoPathnames||[]).length)throw Error(`INVENTORY_READBACK_${JSON.stringify(item||null)}`);out.vehicle={id:item.id,stock:item.stock,status:item.status,photoPathnames:item.photoPathnames,primaryPhotoPathname:item.primaryPhotoPathname||null};
            const pub=await b.newContext();const pr=await pub.request.get(`${base}/api/inventory?public-functional=${Date.now()}`),pj=await pr.json();await pub.close();if((pj.items||[]).some(x=>x.id===item.id||x.stock===stock))throw Error('QA_VEHICLE_LEAKED_PUBLIC');out.qaHidden=true;
            out.ok=true;fs.writeFileSync('/tmp/wdcc-functional-evidence/result.json',JSON.stringify(out,null,2)+'\n');
            await c.close();
          }catch(e){out.error=String(e?.message||e);fs.writeFileSync('/tmp/wdcc-functional-evidence/result.json',JSON.stringify(out,null,2)+'\n');console.error(e);process.exitCode=1}finally{await b.close()}
          NODE
          node /tmp/wdcc-functional-proof.mjs
          jq -e '.ok==true and .login==200 and .session==200 and .dashboard==200 and .dedupe==true and .leadReadback==true and (.leadIds|length)==3 and .upload.status==200 and .qaHidden==true and (.vehicle.photoPathnames|length)>0' /tmp/wdcc-functional-evidence/result.json >/dev/null

      - name: Exact-run QA cleanup
        id: cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/wdcc-functional.env || { echo ok=true >> "$GITHUB_OUTPUT"; exit 0; }
          set -a; . /tmp/wdcc-functional.env; set +a
          export RUN_TAG DEALER_ID STOCK
          cat > /tmp/wdcc-functional-clean.mjs <<'NODE'
          import crypto from 'node:crypto';
          import {del,get,head,put,BlobPreconditionFailedError} from '@vercel/blob';
          const path='private/state/platform-v3.json',run=process.env.RUN_TAG,userId=process.env.DEALER_ID,stock=process.env.STOCK;
          async function stable(){for(let i=0;i<8;i++){const a=await head(path),r=await get(path,{access:'private',useCache:false});if(!r?.stream)throw Error('STATE_READ_FAILED');const c=[];for await(const x of r.stream)c.push(x);const raw=Buffer.concat(c),b=await head(path);if(a.etag===b.etag)return{raw,etag:b.etag,s:JSON.parse(raw.toString())}}throw Error('STATE_TOO_HOT')}
          for(let n=1;n<=6;n++){
            const before=await stable(),s=before.s,leads=Array.isArray(s.leads)?s.leads:[],vehicles=Array.isArray(s.vehicles)?s.vehicles:[],users=Array.isArray(s.users)?s.users:[],audit=Array.isArray(s.audit)?s.audit:[];
            const leadRows=leads.filter(x=>String(x.idempotencyKey||'').includes(run)||String(x.email||'').includes(run)),leadIds=new Set(leadRows.map(x=>String(x.id))),vehicleRows=vehicles.filter(x=>String(x.stock||'')===stock),vehicleIds=new Set(vehicleRows.map(x=>String(x.id)));
            const paths=[...new Set(vehicleRows.flatMap(x=>[...(Array.isArray(x.photoPathnames)?x.photoPathnames:[]),x.primaryPhotoPathname].filter(Boolean).map(String)))];
            s.users=users.filter(x=>String(x.id)!==userId);s.leads=leads.filter(x=>!leadIds.has(String(x.id)));s.vehicles=vehicles.filter(x=>!vehicleIds.has(String(x.id)));s.audit=audit.filter(x=>String(x.actor||x.actorId||'')!==userId&&!leadIds.has(String(x.leadId||''))&&!vehicleIds.has(String(x.vehicleId||''))&&!String(x.idempotencyKey||'').includes(run));s.revision=Number(s.revision||0)+1;s.updatedAt=new Date().toISOString();
            const backup=`private/state/backups/platform-v3-pre-functional-clean-${run}-r${Number(before.s.revision||0)}-${crypto.randomUUID()}.json`;await put(backup,before.raw,{access:'private',addRandomSuffix:false,allowOverwrite:false,contentType:'application/json'});
            try{await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:before.etag});for(const p of paths)await del(p).catch(()=>{});console.log(JSON.stringify({ok:true,run,removed:{users:users.length-s.users.length,leads:leadIds.size,vehicles:vehicleIds.size,paths:paths.length},backup,revision:s.revision}));process.exit(0)}catch(e){if(e instanceof BlobPreconditionFailedError&&n<6)continue;throw e}
          }
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- node /tmp/wdcc-functional-clean.mjs | tee /tmp/wdcc-functional-evidence/cleanup.jsonl
          echo ok=true >> "$GITHUB_OUTPUT"

      - name: Recheck approval head and immutable preview after cleanup
        id: final
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin "refs/heads/$APPROVED_BRANCH" | awk '{print $1}')"
          test "$current" = "$APPROVED_SHA"
          test "$(curl --http1.1 -sS -L -o /tmp/post-health.json -w '%{http_code}' "$BASE/api/health?functional-post=$GITHUB_RUN_ID")" = 200
          jq -e '.ok==true' /tmp/post-health.json >/dev/null
          echo ok=true >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-functional-proof-${{ env.APPROVED_SHA }}-${{ github.run_id }}
          path: /tmp/wdcc-functional-evidence/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish exact-SHA functional gate to PR 494
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GATE: ${{ steps.gate.outcome }}
          CLEAN: ${{ steps.cleanup.outcome }}
          FINAL: ${{ steps.final.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          evidence='not-produced'; [ -s /tmp/wdcc-functional-evidence/result.json ] && evidence="$(jq -c '{ok,login,session,dashboard,leadIds,dedupe,leadReadback,vehicleId,uploadStatus:(.upload.status//null),vehicle,qaHidden,error}' /tmp/wdcc-functional-evidence/result.json)"
          verdict=FAIL; [ "$GATE" = success ] && [ "$CLEAN" = success ] && [ "$FINAL" = success ] && verdict=PASS
          body=$(printf 'CORE FUNCTIONAL ACCEPTANCE — **%s**\n\nApproved application SHA: `%s`\nImmutable Worker: `%s`\nProof workflow commit: `%s` (workflow-only; application bytes pinned to approved SHA)\nAuth + 3 lead paths + dedupe/readback + vehicle create/photo upload/publish/readback + QA public isolation: **%s**\nExact-run cleanup: **%s**\nPost-cleanup immutable/head recheck: **%s**\nEvidence: `%s`\n\nNo merge, production deployment, alias/DNS movement, Cloudflare production-route change, provider cutover, or schema change was performed.' "$verdict" "$APPROVED_SHA" "$BASE" "$GITHUB_SHA" "$GATE" "$CLEAN" "$FINAL" "$evidence")
          gh issue comment 494 --repo "$GITHUB_REPOSITORY" --body "$body"
          [ "$verdict" = PASS ]
