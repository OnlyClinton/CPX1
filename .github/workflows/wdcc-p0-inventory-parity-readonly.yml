name: WDCC P0 Inventory Parity Readonly

on:
  push:
    branches: [proof/wdcc-522-immutable-parser-20260829]
    paths:
      - '.github/workflows/wdcc-p0-inventory-parity-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare live recovery and P0 app inventory
        shell: bash
        run: |
          set -euo pipefail
          LIVE='https://wedontcarecars.com/api/inventory'
          APP='https://wdcc-proof-04c5d526.clico-global.workers.dev/api/inventory'
          for kind in live app; do
            url="$LIVE"; [ "$kind" = app ] && url="$APP"
            code="$(curl --http1.1 -sS -D "/tmp/$kind.h" -o "/tmp/$kind.json" -w '%{http_code}' "$url?owner-live-parity=$(date +%s)")"
            echo "$kind HTTP=$code"; [ "$code" = 200 ]
            tr -d '\r' <"/tmp/$kind.h" >"/tmp/$kind.hn"
            grep -Ei '^(x-wdcc-|cache-control|content-type):' "/tmp/$kind.hn" || true
            jq -c '{mockupPreview,inventorySource,count:(.items//.inventory//.vehicles//[]|length),items:[(.items//.inventory//.vehicles//[])[]?|{id,year,make,model,trim,status,primary_image_url,primaryPhotoPathname}]}' "/tmp/$kind.json" | head -c 10000; echo
            echo "$kind BODY_SHA256=$(sha256sum /tmp/$kind.json|awk '{print $1}')"
          done
          echo 'READ_ONLY=YES'
          echo 'PRODUCTION_CHANGED=NO'
