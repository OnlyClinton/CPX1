name: WDCC Reference Root Edge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-reference-root-edge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-reference-root-edge
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require Cloudflare authority
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install Wrangler
        run: npm install --global wrangler@4.90.0 >/dev/null
      - name: Build exact root worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wdcc-reference-root
          cat > /tmp/wdcc-reference-root/worker.js <<'EOF'
          const html=`<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02060a"><title>We Don't Care Cars | Tampa Bay Used Cars</title><style>
          :root{--r:#ef202f;--b:#168af4;--g:#d7a72d;--k:#02060a;--n:#071522;--p:#f4f4f2;--i:#101820}*{box-sizing:border-box}html,body{margin:0;background:var(--k);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}.utility{height:30px;background:#020609;border-bottom:1px solid #ffffff12}.utility>div,.head,.heroIn,.secHead,.grid,.financeIn,.trust,.foot{width:min(1480px,calc(100% - 42px));margin:auto}.utility>div{height:100%;display:flex;align-items:center;gap:18px;font-size:9px;font-weight:900;letter-spacing:.07em;text-transform:uppercase}.utility span:last-child{margin-left:auto}.utility b{color:var(--r)}header{height:78px;background:#03080df5;border-bottom:1px solid #ffffff17;position:sticky;top:0;z-index:100;backdrop-filter:blur(16px)}.head{height:100%;display:grid;grid-template-columns:118px minmax(0,1fr) auto;align-items:center;gap:24px}.logo{width:104px;height:72px;display:grid;place-items:center}.logo img{width:82px;height:82px;object-fit:contain}.nav{display:flex;align-items:center;justify-content:center;gap:27px;font-size:10px;font-weight:900;text-transform:uppercase}.headCta{min-height:42px;padding:0 19px;border-radius:5px;background:var(--r);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:950;text-transform:uppercase}.menu,.call{display:none}.hero{min-height:610px;position:relative;overflow:hidden;background-image:linear-gradient(90deg,#02060af4 0,#02060ad9 33%,#02060a58 55%,#0000 76%),linear-gradient(0deg,#02060abc 0,#0000 34%),url('/wdcc-hero-v2.webp');background-position:62% center;background-size:cover}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#02060aa8,#0000 31%)}.heroIn{min-height:610px;position:relative;z-index:2;display:flex;align-items:center}.copy{width:min(620px,47vw);padding:54px 0 44px}.kicker{margin:0 0 13px;color:#57a9ec;font-size:10px;font-weight:950;text-transform:uppercase;letter-spacing:.13em}.kicker:before{content:"";display:inline-block;width:34px;height:2px;background:var(--g);margin-right:10px;vertical-align:middle}h1{margin:0 0 18px;text-transform:uppercase;font-size:clamp(54px,5.7vw,88px);line-height:.87;letter-spacing:-.058em;font-weight:1000;text-shadow:0 6px 24px #000d}h1 .red{color:var(--r)}h1 .blue{color:var(--b)}.lead{max-width:520px;margin:0;color:#eef3f7;font-size:15px;line-height:1.5;font-weight:650}.actions{display:flex;gap:11px;flex-wrap:wrap;margin-top:22px}.btn{min-height:47px;padding:0 20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:950;text-transform:uppercase}.btn.red{background:var(--r)}.btn.dark{background:#09131dcc;border:1px solid #8295a7}.phone{display:flex;align-items:center;gap:8px;margin-top:17px;font-size:11px;font-weight:950;text-transform:uppercase}.phone b{color:var(--r)}.benefitWrap{background:#fff;color:var(--i)}.benefits{width:min(1460px,calc(100% - 30px));margin:-1px auto 0;position:relative;z-index:8;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #dfe3e7;border-radius:0 0 10px 10px;overflow:hidden;box-shadow:0 14px 36px #0002}.benefit{min-height:100px;padding:17px 18px;background:#fff;display:grid;grid-template-columns:42px 1fr;align-items:center;gap:12px;border-right:1px solid #e0e4e8}.benefit:last-child{border:0}.icon{width:38px;height:38px;border:2px solid var(--r);border-radius:50%;display:grid;place-items:center;color:var(--r);font-weight:1000}.benefit strong{display:block;font-size:10px;font-weight:950;text-transform:uppercase}.benefit small{display:block;margin-top:4px;color:#65717c;font-size:9px}.inventory{background:var(--p);color:var(--i);padding:40px 20px 50px}.secHead{margin-bottom:18px;display:flex;align-items:end;justify-content:space-between}.secHead small{display:block;color:#65717c;font-size:9px;font-weight:950;text-transform:uppercase}.secHead h2{margin:4px 0;font-size:clamp(28px,3vw,42px);letter-spacing:-.045em}.secHead p{margin:0;color:#66717b;font-size:11px}.viewAll{font-size:10px;font-weight:950;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{background:#fff;border:1px solid #d7dde2;border-radius:7px;overflow:hidden;box-shadow:0 6px 18px #11182714}.photo{display:block;aspect-ratio:1.38;background:#101820;overflow:hidden;position:relative}.photo img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;top:7px;left:7px;padding:4px 6px;background:#159052;color:#fff;font-size:7px;font-weight:950}.body{padding:11px}.ey{margin:0 0 4px;color:#68727d;font-size:8px;font-weight:900;text-transform:uppercase}.title{display:block;min-height:31px;color:#101820;font-size:13px;font-weight:950}.price{display:block;margin-top:7px;font-size:21px;font-weight:1000}.pay{margin:2px 0;color:#59636d;font-size:9px}.pills{display:flex;gap:4px;margin-top:8px}.pills span{padding:4px 6px;background:#f0f2f4;font-size:7px;font-weight:900}.finance{background:#07131e;padding:45px 20px 48px}.finance h2{margin:0 0 17px;font-size:29px;text-transform:uppercase;font-style:italic}.finance h2 span{color:var(--r)}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.step{min-height:142px;padding:18px;border:1px solid #263746;border-radius:7px;background:#0d1b28}.step b{width:32px;height:32px;border-radius:50%;background:var(--r);display:grid;place-items:center;margin-bottom:12px}.step strong{display:block;font-size:10px;text-transform:uppercase}.step small{display:block;margin-top:6px;color:#c6d0d8;font-size:9px}.trustWrap{background:#fff;color:var(--i);padding:0 18px 22px}.trust{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #dce2e7;border-radius:0 0 10px 10px;overflow:hidden}.trust article{min-height:86px;padding:15px;border-right:1px solid #e0e4e7}.trust b{font-size:9px;text-transform:uppercase}.trust span{display:block;color:#66717c;font-size:8px;margin-top:3px}footer{background:#02060a;padding:24px 20px;color:#9ba7b2}.foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:10px}
          @media(max-width:1100px){.nav{gap:17px}.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:820px){.utility{display:none}header{height:72px}.head{width:100%;padding:0 13px;grid-template-columns:48px 1fr 48px;gap:6px}.logo{grid-column:1;justify-self:start;width:60px}.logo img{width:58px;height:58px}.menu{grid-column:3;display:grid;place-items:center;width:44px;height:44px;border:0;background:transparent;color:#fff;font-size:25px;justify-self:end}.call{display:none}.headCta{display:none}.nav{display:none}.hero{min-height:610px;background-position:70% top;background-size:auto 610px}.heroIn{width:100%;min-height:610px;align-items:flex-end}.copy{width:100%;padding:280px 14px 24px;background:linear-gradient(0deg,#02060a 8%,#02060ade 56%,#02060a00 100%)}h1{font-size:clamp(41px,13.1vw,56px)}.lead{font-size:14px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.phone{display:none}.benefits{width:100%;margin:0;border-radius:0;grid-template-columns:repeat(4,1fr);box-shadow:none}.benefit{min-height:80px;padding:10px 6px;display:block;text-align:center}.icon{width:30px;height:30px;margin:0 auto 6px}.benefit strong{font-size:7px}.benefit small{font-size:6.5px}.inventory{padding:28px 12px 34px}.grid{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px}.card{min-width:72%;scroll-snap-align:start}.steps{grid-template-columns:1fr 1fr}.trust{grid-template-columns:1fr 1fr}}@media(max-width:520px){header{height:68px}.hero{min-height:600px;background-size:auto 600px}.heroIn{min-height:600px}.copy{padding-top:270px}.steps{grid-template-columns:1fr}.card{min-width:82%}}
          </style></head><body><div class="reference-home"><div class="utility"><div><span>⌖ Tampa Bay</span><span>›</span><span>In-house financing</span><span>›</span><span>Sean · <b>813-516-4752</b></span></div></div><header><div class="head"><a class="logo" href="/"><img src="/wdcc-logo-transparent.webp" alt="We Don't Care Cars"></a><nav class="nav"><a href="/inventory">Inventory</a><a href="/financing">Financing</a><a href="#how">How it works</a><a href="/reviews">Reviews</a><a href="/about">About us</a></nav><a class="headCta" href="/get-approved">Get pre-approved</a><button class="menu">☰</button></div></header><section class="hero"><div class="heroIn"><div class="copy"><p class="kicker">Tampa Bay · Drive today</p><h1><span class="red">Bad credit?</span><br><span class="blue">No credit?</span><br>We don't care.</h1><p class="lead">In-house financing. Low down payments.<br>Fast approvals. Straight answers.<br>Get on the road without the runaround.</p><div class="actions"><a class="btn red" href="/get-approved">Get pre-approved →</a><a class="btn dark" href="/inventory">Browse inventory →</a></div><a class="phone" href="tel:+18135164752">☎ Call Sean <b>813-516-4752</b></a></div></div></section><section class="benefitWrap"><div class="benefits"><article class="benefit"><span class="icon">✓</span><div><strong>Fast approvals</strong><small>Quick, straightforward decisions.</small></div></article><article class="benefit"><span class="icon">$</span><div><strong>Low down payments</strong><small>Options designed around real buyers.</small></div></article><article class="benefit"><span class="icon">▣</span><div><strong>Drive today</strong><small>Move from interest to the road.</small></div></article><article class="benefit"><span class="icon">◇</span><div><strong>Build your credit</strong><small>Ask what programs may apply.</small></div></article></div></section><section class="inventory"><div class="secHead"><div><small>Featured inventory</small><h2>Vehicles ready now.