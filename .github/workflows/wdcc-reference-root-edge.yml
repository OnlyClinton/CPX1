          <article class="card"><a class="photo" href="/inventory/2004-nissan-350z"><img src="/assets/cars/2004-nissan-350z-1.webp"><span class="badge">AVAILABLE</span></a><div class="body"><p class="ey">2004 NISSAN</p><a class="title" href="/inventory/2004-nissan-350z">350Z</a><strong class="price">$4,900</strong><p class="pay">$2,000 down · 154,000 miles</p><div class="pills"><span>Car</span><span>RWD</span></div></div></article>
          <article class="card"><a class="photo" href="/inventory/2016-ford-f150-limited"><img src="/assets/cars/2016-ford-f150-limited-1.webp"><span class="badge">AVAILABLE</span></a><div class="body"><p class="ey">2016 FORD</p><a class="title" href="/inventory/2016-ford-f150-limited">F-150 Limited</a><strong class="price">$15,000</strong><p class="pay">$6,000 down · 164,000 miles</p><div class="pills"><span>Truck</span><span>Automatic</span></div></div></article>
          <article class="card"><a class="photo" href="/inventory/2019-honda-pilot"><img src="/assets/cars/2019-honda-pilot-1.webp"><span class="badge">AVAILABLE</span></a><div class="body"><p class="ey">2019 HONDA</p><a class="title" href="/inventory/2019-honda-pilot">Pilot</a><strong class="price">$7,900</strong><p class="pay">$3,000 down · 380,000 miles</p><div class="pills"><span>SUV</span><span>Automatic</span></div></div></article>
          <article class="card"><a class="photo" href="/inventory/2019-kia-sportage"><img src="/assets/cars/2019-kia-sportage-1.webp"><span class="badge">AVAILABLE</span></a><div class="body"><p class="ey">2019 KIA</p><a class="title" href="/inventory/2019-kia-sportage">Sportage</a><strong class="price">$6,500</strong><p class="pay">$2,500 down · 127,000 miles</p><div class="pills"><span>SUV</span><span>Automatic</span></div></div></article>
