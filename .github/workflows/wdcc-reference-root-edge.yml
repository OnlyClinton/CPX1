          export default {async fetch(request){const u=new URL(request.url);if(u.pathname!=="/")return new Response("Not found",{status:404});return new Response(html,{headers:{"content-type":"text/html; charset=utf-8","cache-control":"no-store, max-age=0","x-wdcc-reference-root":"1"}})}};
          EOF
          cat > /tmp/wdcc-reference-root/wrangler.jsonc <<EOF
          {"name":"wdcc-reference-root","main":"worker.js","compatibility_date":"2026-08-25","routes":[{"pattern":"wedontcarecars.com/","zone_name":"wedontcarecars.com"},{"pattern":"www.wedontcarecars.com/","zone_name":"wedontcarecars.com"}]}
          EOF
      - name: Deploy exact root worker
        working-directory: /tmp/wdcc-reference-root
        run: wrangler deploy
      - name: Verify live root
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 30); do
            code="$(curl -sS -D /tmp/root.h -o /tmp/root.html -w '%{http_code}' "https://wedontcarecars.com/?root=$GITHUB_RUN_ID&attempt=$i" || true)"
            if [ "$code" = 200 ] && grep -qi 'x-wdcc-reference-root: 1' /tmp/root.h && grep -q 'reference-home' /tmp/root.html && grep -q 'Vehicles ready now' /tmp/root.html; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          echo 'REFERENCE_ROOT_LIVE=PASS'
