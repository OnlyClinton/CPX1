name: WDCC Full Live Acceptance V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-full-live-acceptance-v3.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wdcc-full-live-acceptance-v3
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      PHOENIX_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
      DEALER: https://dealer.wedontcarecars.com
      STOREFRONT: https://wedontcarecars.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --global vercel@59.3.0 >/dev/null
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Pull canonical Phoenix production binding
        id: binding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phoenix/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$PHOENIX_ID" > /tmp/phoenix/.vercel/project.json
          cd /tmp/phoenix
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env pull /tmp/phoenix.env --yes --environment=production --token="$VERCEL_TOKEN" --scope=cpxagency >/dev/null
          grep -q '^BLOB_READ_WRITE_TOKEN=' /tmp/phoenix.env

      - name: Create temporary live-login identities
        id: identities
        shell: bash
        run: |
          set -euo pipefail
          set -a; . /tmp/phoenix.env; set +a
          export RUN_TAG="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';import fs from 'node:fs';import {get,head,put} from '@vercel/blob';
          const token=process.env.BLOB_READ_WRITE_TOKEN,path='private/state/platform-v3.json',run=process.env.RUN_TAG;
          async function readStable(){for(let i=0;i<4;i++){const a=await head(path,{token});const r=await get(path,{access:'private',useCache:false,token});if(!r||r.statusCode!==200||!r.stream)throw Error('STATE_READ_FAILED');const c=[];for await(const x of r.stream)c.push(x);const raw=Buffer.concat(c);const b=await head(path,{token});if(a.etag===b.etag)return{raw,etag:b.etag,state:JSON.parse(raw.toString('utf8'))}}throw Error('STATE_TOO_HOT')}
          const before=await readStable(),s=before.state,now=new Date().toISOString(),password=`WdccQA-${crypto.randomBytes(18).toString('base64url')}!`;
          const hash=v=>{const salt=crypto.randomBytes(24),dig=crypto.scryptSync(v,salt,64);return `scrypt$${salt.toString('base64url')}$${dig.toString('base64url')}`};
          const dealerId=`qa-dealer-${crypto.randomUUID()}`,adminId=`qa-admin-${crypto.randomUUID()}`,dealerEmail=`qa-dealer-${run}@invalid.example`,adminEmail=`qa-admin-${run}@invalid.example`,passwordHash=hash(password);
          s.users=Array.isArray(s.users)?s.users:[];s.audit=Array.isArray(s.audit)?s.audit:[];
          s.users.push({id:dealerId,email:dealerEmail,username:dealerEmail,displayName:`WDCC QA Dealer ${run}`,role:'dealer_agent',tenantId:'wdcc',status:'active',disabled:false,passwordHash});
          s.users.push({id:adminId,email:adminEmail,username:adminEmail,displayName:`WDCC QA Admin ${run}`,role:'platform_admin',tenantId:'wdcc',status:'active',disabled:false,passwordHash});
          s.audit.push({id:crypto.randomUUID(),at:now,action:'qa.full_live_v3.users_create',actor:'github-actions',run,dealerId,adminId});s.revision=Number(s.revision||0)+1;s.updatedAt=now;
          const backup=`private/state/backups/platform-v3-pre-full-v3-r${Number(before.state.revision||0)}-${now.replace(/[:.]/g,'-')}-${crypto.randomUUID()}.json`;
          await put(backup,before.raw,{access:'private',addRandomSuffix:false,allowOverwrite:false,contentType:'application/json',token});
          await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:before.etag,token});
          fs.writeFileSync('/tmp/qa.env',`RUN_TAG=${run}\nQA_PASSWORD=${password}\nDEALER_ID=${dealerId}\nDEALER_EMAIL=${dealerEmail}\nADMIN_ID=${adminId}\nADMIN_EMAIL=${adminEmail}\n`);
          console.log(JSON.stringify({ok:true,run,dealerId,adminId,backup},null,2));
          NODE
          set -a; . /tmp/qa.env; set +a
          printf '::add-mask::%s\n' "$QA_PASSWORD"

      - name: Prove real dealer and admin login
        id: login
        shell: bash
        run: |
          set -euo pipefail
          set -a; . /tmp/qa.env; set +a
          printf '::add-mask::%s\n' "$QA_PASSWORD"
          login(){ label="$1"; base="$2"; origin="$3"; email="$4"; role="$5"; payload="$(jq -nc --arg e "$email" --arg p "$QA_PASSWORD" '{email:$e,password:$p}')"; code="$(curl -sS -c "/tmp/$label.cookies" -o "/tmp/$label-login.json" -w '%{http_code}' -H "Origin: $origin" -H 'content-type: application/json' -X POST "$base/api/auth/login" --data "$payload")"; test "$code" = 200; sc="$(curl -sS -b "/tmp/$label.cookies" -o "/tmp/$label-session.json" -w '%{http_code}' "$base/api/auth/session")"; test "$sc" = 200; jq -e --arg r "$role" '.authenticated==true and ((.user.role|ascii_downcase)==($r|ascii_downcase))' "/tmp/$label-session.json" >/dev/null; echo "${label}_login=$code" >> "$GITHUB_OUTPUT"; echo "${label}_session=$sc" >> "$GITHUB_OUTPUT"; }
          login dealer "$DEALER" "$DEALER" "$DEALER_EMAIL" dealer_agent
          login admin "$STOREFRONT" "$STOREFRONT" "$ADMIN_EMAIL" platform_admin

      - name: Prove leads, dashboard feed, and notification transport
        id: leads
        shell: bash
        run: |
          set -euo pipefail
          set -a; . /tmp/qa.env; set +a
          run="$RUN_TAG"
          post(){ kind="$1"; source="$2"; suffix="$3"; qa="$4"; key="wdcc-full-v3-$suffix-$run"; if [ "$qa" = true ]; then name="WDCC QA FULL V3 $suffix $run"; email="qa-v3-$suffix-$run@invalid.example"; q='"qa":true,'; else name="WDCC ACCEPTANCE V3 $suffix $run"; email="acceptance-v3-$suffix-$run@example.com"; q=''; fi; body="{${q}\"kind\":\"$kind\",\"name\":\"$name\",\"phone\":\"813-555-0199\",\"email\":\"$email\",\"vehicleInterest\":\"Full acceptance vehicle\",\"preferredTime\":\"QA only\",\"message\":\"Automated WDCC acceptance. Do not contact applicant.\",\"consent\":true,\"source\":\"$source\"}"; code="$(curl -sS -o "/tmp/$suffix.json" -w '%{http_code}' -H 'content-type: application/json' -H "Idempotency-Key: $key" -X POST "$STOREFRONT/api/leads" --data "$body")"; case "$code" in 200|201);;*) cat "/tmp/$suffix.json"; exit 1;;esac; jq -e '.ok==true and .persisted==true and .item.id!=null' "/tmp/$suffix.json" >/dev/null; }
          post schedule schedule-test-drive schedule false
          post approval get-approved approval true
          post contact call-sean contact true
          S="$(jq -r '.item.id' /tmp/schedule.json)"; A="$(jq -r '.item.id' /tmp/approval.json)"; C="$(jq -r '.item.id' /tmp/contact.json)"
          fc="$(curl -sS -b /tmp/dealer.cookies -o /tmp/feed.json -w '%{http_code}' "$DEALER/api/leads")"; test "$fc" = 200
          jq -e --arg s "$S" --arg a "$A" --arg c "$C" '(.items//[]) as $x | any($x[];.id==$s) and any($x[];.id==$a) and any($x[];.id==$c)' /tmp/feed.json >/dev/null
          echo "schedule=$S" >> "$GITHUB_OUTPUT"; echo "approval=$A" >> "$GITHUB_OUTPUT"; echo "contact=$C" >> "$GITHUB_OUTPUT"; echo "feed_http=$fc" >> "$GITHUB_OUTPUT"
          echo "email=$(jq -r '.notifications.email // "unknown"' /tmp/schedule.json)" >> "$GITHUB_OUTPUT"; echo "sms=$(jq -r '.notifications.sms // "unknown"' /tmp/schedule.json)" >> "$GITHUB_OUTPUT"; echo "webhook=$(jq -r '.notifications.webhook // "unknown"' /tmp/schedule.json)" >> "$GITHUB_OUTPUT"

      - name: Prove rendered dealer/admin portals and listing lifecycle
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          set -a; . /tmp/qa.env; set +a
          export DEALER_COOKIE="$(awk '$6=="__Host-wdcc_session"{print $7}' /tmp/dealer.cookies | tail -1)" ADMIN_COOKIE="$(awk '$6=="__Host-wdcc_session"{print $7}' /tmp/admin.cookies | tail -1)" SCHEDULE_ID="${{ steps.leads.outputs.schedule }}"
          test -n "$DEALER_COOKIE"; test -n "$ADMIN_COOKIE"; printf '::add-mask::%s\n' "$DEALER_COOKIE"; printf '::add-mask::%s\n' "$ADMIN_COOKIE"
          node <<'NODE'
          const fs=require('fs'),{chromium}=require('playwright');
          (async()=>{const run=process.env.RUN_TAG,dealer=process.env.DEALER,store=process.env.STOREFRONT,stock=`WDCC-QA-FULL-V3-${run}`;fs.mkdirSync('/tmp/screens',{recursive:true});fs.writeFileSync('/tmp/q.png',Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9WlV1GQAAAAASUVORK5CYII=','base64'));const b=await chromium.launch({headless:true});
          const dc=await b.newContext({viewport:{width:1440,height:1000}});await dc.addCookies([{name:'__Host-wdcc_session',value:process.env.DEALER_COOKIE,domain:'dealer.wedontcarecars.com',path:'/',httpOnly:true,secure:true,sameSite:'Strict'}]);const p=await dc.newPage();await p.goto(`${dealer}/dealer`,{waitUntil:'networkidle'});if(p.url().includes('/dealer/login'))throw Error('DEALER_LOGIN_REDIRECT');await p.screenshot({path:'/tmp/screens/dealer-dashboard.png',fullPage:true});await p.goto(`${dealer}/dealer/leads`,{waitUntil:'networkidle'});const t=(await p.locator('body').innerText()).toLowerCase();if(!t.includes('wdcc acceptance v3')&&!t.includes(String(process.env.SCHEDULE_ID).toLowerCase()))throw Error('LEAD_NOT_RENDERED');await p.screenshot({path:'/tmp/screens/dealer-leads.png',fullPage:true});
          await p.goto(`${dealer}/dealer/inventory/new`,{waitUntil:'networkidle'});if(p.url().includes('/dealer/login'))throw Error('INVENTORY_LOGIN_REDIRECT');await p.getByLabel('Year').fill('2019');await p.getByLabel('Make').fill('Toyota');await p.getByLabel('Model').fill(`FULL-V3-${run}`);await p.getByLabel('Trim').fill('QA');await p.getByLabel('Cash Price').fill('12345');await p.getByLabel('Estimated Down Payment').fill('1500');await p.getByLabel('Mileage').fill('54321');await p.getByLabel('Stock #').fill(stock);await p.getByLabel('Description').fill('Automated full live acceptance listing. QA only.');await p.locator('input[type=file][multiple]').first().setInputFiles('/tmp/q.png');await p.getByRole('button',{name:'PUBLISH VEHICLE'}).click();await p.waitForURL(/\/dealer\?saved=published/,{timeout:60000});const ir=await dc.request.get(`${dealer}/api/inventory`,{headers:{Cookie:`__Host-wdcc_session=${process.env.DEALER_COOKIE}`}});if(!ir.ok())throw Error(`DEALER_INVENTORY_${ir.status()}`);const ij=await ir.json(),item=(ij.items||[]).find(v=>v.stock===stock);if(!item)throw Error('LISTING_NOT_IN_DEALER');if(!(item.photoPathnames||[]).length)throw Error('LISTING_PHOTO_MISSING');const pr=await dc.request.get(`${store}/api/inventory?v3=${Date.now()}`);if(!pr.ok())throw Error(`PUBLIC_INVENTORY_${pr.status()}`);const pj=await pr.json();if(!(pj.items||[]).some(v=>v.id===item.id||v.stock===stock))throw Error('LISTING_NOT_PUBLIC');await p.goto(`${dealer}/dealer/inventory`,{waitUntil:'networkidle'});await p.screenshot({path:'/tmp/screens/dealer-inventory.png',fullPage:true});const h=await dc.request.patch(`${dealer}/api/inventory/${encodeURIComponent(item.id)}`,{headers:{Cookie:`__Host-wdcc_session=${process.env.DEALER_COOKIE}`,'content-type':'application/json'},data:{status:'draft',stock:`R36TEST-${stock}`}});if(!h.ok())throw Error(`HIDE_${h.status()}`);
          const ac=await b.newContext({viewport:{width:1440,height:1000}});await ac.addCookies([{name:'__Host-wdcc_session',value:process.env.ADMIN_COOKIE,domain:'wedontcarecars.com',path:'/',httpOnly:true,secure:true,sameSite:'Strict'}]);const a=await ac.newPage();await a.goto(`${store}/admin`,{waitUntil:'networkidle'});if(a.url().includes('/admin/login'))throw Error('ADMIN_LOGIN_REDIRECT');await a.screenshot({path:'/tmp/screens/admin-dashboard.png',fullPage:true});await a.goto(`${store}/admin/users`,{waitUntil:'networkidle'});if(a.url().includes('/admin/login'))throw Error('ADMIN_USERS_LOGIN_REDIRECT');await a.screenshot({path:'/tmp/screens/admin-users.png',fullPage:true});fs.writeFileSync('/tmp/browser.json',JSON.stringify({ok:true,vehicleId:item.id,photoCount:item.photoPathnames.length,publicVisible:true},null,2));await b.close()})().catch(e=>{fs.writeFileSync('/tmp/browser.json',JSON.stringify({ok:false,error:String(e.message||e)},null,2));console.error(e);process.exit(1)})
          NODE
          cat /tmp/browser.json
          echo "vehicle=$(jq -r '.vehicleId // ""' /tmp/browser.json)" >> "$GITHUB_OUTPUT"; echo "photos=$(jq -r '.photoCount // 0' /tmp/browser.json)" >> "$GITHUB_OUTPUT"; echo "public=$(jq -r '.publicVisible // false' /tmp/browser.json)" >> "$GITHUB_OUTPUT"

      - name: Upload rendered portal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wdcc-full-v3-screens-${{ github.run_id }}
          path: /tmp/screens/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup temporary QA state
        id: cleanup
        if: always() && steps.identities.outcome == 'success'
        shell: bash
        run: |
          set +e
          set -a; . /tmp/phoenix.env; . /tmp/qa.env; set +a
          export VEHICLE_ID="$(jq -r '.vehicleId // ""' /tmp/browser.json 2>/dev/null)"
          node --input-type=module <<'NODE' > /tmp/cleanup.json
          import crypto from 'node:crypto';import {del,get,head,put} from '@vercel/blob';const token=process.env.BLOB_READ_WRITE_TOKEN,path='private/state/platform-v3.json',run=process.env.RUN_TAG,ids=new Set([process.env.DEALER_ID,process.env.ADMIN_ID]),vehicleId=process.env.VEHICLE_ID;async function read(){for(let i=0;i<4;i++){const a=await head(path,{token});const r=await get(path,{access:'private',useCache:false,token});if(!r||r.statusCode!==200||!r.stream)throw Error('READ');const c=[];for await(const x of r.stream)c.push(x);const raw=Buffer.concat(c);const b=await head(path,{token});if(a.etag===b.etag)return{raw,etag:b.etag,s:JSON.parse(raw.toString('utf8'))}}throw Error('HOT')}const before=await read(),s=before.s,now=new Date().toISOString(),leadIds=(s.leads||[]).filter(x=>String(x.name||'').includes(run)||String(x.email||'').includes(run)).map(x=>x.id),v=(s.vehicles||[]).find(x=>x.id===vehicleId||String(x.stock||'').includes(`WDCC-QA-FULL-V3-${run}`)),media=[...(v?.photoPathnames||[])];s.users=(s.users||[]).filter(x=>!ids.has(x.id));s.leads=(s.leads||[]).filter(x=>!leadIds.includes(x.id));if(v)s.vehicles=s.vehicles.map(x=>x.id===v.id?{...x,status:'archived',updatedAt:now,qaCleanupAt:now}:x);s.audit=Array.isArray(s.audit)?s.audit:[];s.audit.push({id:crypto.randomUUID(),at:now,action:'qa.full_live_v3.cleanup',actor:'github-actions',run,leadsRemoved:leadIds.length,vehicleArchived:v?.id||null});s.revision=Number(s.revision||0)+1;s.updatedAt=now;const backup=`private/state/backups/platform-v3-pre-v3-clean-r${Number(before.s.revision||0)}-${now.replace(/[:.]/g,'-')}-${crypto.randomUUID()}.json`;await put(backup,before.raw,{access:'private',addRandomSuffix:false,allowOverwrite:false,contentType:'application/json',token});await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:before.etag,token});for(const m of media){try{await del(m,{token})}catch{}}console.log(JSON.stringify({ok:true,usersRemoved:2,leadsRemoved:leadIds.length,vehicleArchived:v?.id||null,mediaDeleted:media.length,backup},null,2));
          NODE
          cat /tmp/cleanup.json

      - name: Report acceptance result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          LOGIN: ${{ steps.login.outcome }}
          DEALER_LOGIN: ${{ steps.login.outputs.dealer_login }}
          DEALER_SESSION: ${{ steps.login.outputs.dealer_session }}
          ADMIN_LOGIN: ${{ steps.login.outputs.admin_login }}
          ADMIN_SESSION: ${{ steps.login.outputs.admin_session }}
          LEADS: ${{ steps.leads.outcome }}
          SCHEDULE: ${{ steps.leads.outputs.schedule }}
          APPROVAL: ${{ steps.leads.outputs.approval }}
          CONTACT: ${{ steps.leads.outputs.contact }}
          FEED: ${{ steps.leads.outputs.feed_http }}
          EMAIL: ${{ steps.leads.outputs.email }}
          SMS: ${{ steps.leads.outputs.sms }}
          WEBHOOK: ${{ steps.leads.outputs.webhook }}
          BROWSER: ${{ steps.browser.outcome }}
          VEHICLE: ${{ steps.browser.outputs.vehicle }}
          PHOTOS: ${{ steps.browser.outputs.photos }}
          PUBLIC: ${{ steps.browser.outputs.public }}
          CLEANUP: ${{ steps.cleanup.outcome }}
        shell: bash
        run: |
          err=''; [ -f /tmp/browser.json ] && err="$(jq -r '.error // ""' /tmp/browser.json)"
          body=$(printf '## WDCC Full Live Acceptance V3\n\n- Overall: **%s**\n- Real dealer/admin login: **%s** (dealer %s/%s, admin %s/%s)\n- Three lead flows + dealer feed: **%s** (feed HTTP %s)\n  - schedule: `%s`\n  - approval: `%s`\n  - contact: `%s`\n  - notification email: `%s`\n  - notification SMS: `%s`\n  - notification webhook: `%s`\n- Rendered portals + listing lifecycle: **%s**\n  - vehicle: `%s`\n  - photos: `%s`\n  - public visible before QA hide: `%s`\n  - error: `%s`\n- Cleanup: **%s**\n\nScreenshots are attached to the workflow run.' "$STATUS" "$LOGIN" "$DEALER_LOGIN" "$DEALER_SESSION" "$ADMIN_LOGIN" "$ADMIN_SESSION" "$LEADS" "$FEED" "$SCHEDULE" "$APPROVAL" "$CONTACT" "$EMAIL" "$SMS" "$WEBHOOK" "$BROWSER" "$VEHICLE" "$PHOTOS" "$PUBLIC" "$err" "$CLEANUP")
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC full live acceptance V3 ${GITHUB_RUN_ID}" --body "$body" || true
