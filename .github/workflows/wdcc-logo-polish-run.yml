name: WDCC Logo and Dealer UI Polish

on:
  push:
    branches: [wdcc-logo-polish]

jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      DEPLOYMENT_ID: dpl_2vfDGZg6erycSF6Pmwo6yPbFSaxp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Require Vercel token
        run: test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN missing" >&2; exit 78; }

      - name: Recover approved 2vfD transparent logo
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments/$DEPLOYMENT_ID/files?teamId=$VERCEL_TEAM_ID" > /tmp/files.json
          cat > /tmp/recover-logo.mjs <<'EOF'
          import fs from 'node:fs/promises';
          const token=process.env.VERCEL_TOKEN, team=process.env.VERCEL_TEAM_ID, dep=process.env.DEPLOYMENT_ID;
          const tree=JSON.parse(await fs.readFile('/tmp/files.json','utf8'));
          const files=[];
          function walk(nodes,prefix=''){
            for(const n of nodes||[]){
              const p=prefix?`${prefix}/${n.name}`:n.name;
              if(n.type==='directory') walk(n.children||[],p);
              else if(n.type==='file'&&n.uid) files.push({...n,path:p});
            }
          }
          walk(tree);
          const target=files.find(f=>f.path==='wdcc-logo-transparent.webp'||f.path.endsWith('/wdcc-logo-transparent.webp'));
          if(!target) throw new Error('Approved wdcc-logo-transparent.webp not found in 2vfD deployment');
          const url=`https://api.vercel.com/v8/deployments/${dep}/files/${target.uid}?teamId=${encodeURIComponent(team)}`;
          const r=await fetch(url,{headers:{Authorization:`Bearer ${token}`}});
          if(!r.ok) throw new Error(`logo fetch failed: ${r.status}`);
          const raw=await r.text();
          let parsed; try{parsed=JSON.parse(raw)}catch{parsed=raw}
          const b64=typeof parsed==='string'?parsed:(parsed?.data??parsed?.content??parsed?.file??parsed?.value);
          if(typeof b64!=='string') throw new Error('unknown Vercel file payload');
          const buf=Buffer.from(b64,'base64');
          if(buf.length<20000||buf.slice(8,12).toString()!=='WEBP') throw new Error(`logo validation failed (${buf.length} bytes)`);
          await fs.mkdir('public',{recursive:true});
          await fs.writeFile('public/wdcc-logo-transparent.webp',buf);
          await fs.writeFile('public/wdcc-official-logo.webp',buf);
          console.log(`Recovered exact approved logo: ${buf.length} bytes`);
          EOF
          node /tmp/recover-logo.mjs

      - name: Apply dealer visual lock
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          for file in ['app/dealer/page.tsx','app/dealer/leads/page.tsx']:
              p=Path(file)
              s=p.read_text()
              s=s.replace('/wdcc-official-logo.webp','/wdcc-logo-transparent.webp')
              p.write_text(s)

          p=Path('app/dealer/inventory/new/page.tsx')
          s=p.read_text()
          s=s.replace('<div className="dealerLogo"><b>WDCC</b><span>DEALER COMMAND</span></div>', '<Link className="dealerLogo dealerLogoImage" href="/dealer"><img src="/wdcc-logo-transparent.webp" alt="We Don\'t Care Cars"/><span>DEALER COMMAND</span></Link>')
          p.write_text(s)

          p=Path('app/dealer/crm/page.tsx')
          s=p.read_text()
          s=s.replace('<div className={styles.brand}><b>WDCC</b><span>SALES COMMAND</span></div>', '<div className={styles.brand}><img src="/wdcc-logo-transparent.webp" alt="We Don\'t Care Cars" style={{width:150,height:150,objectFit:"contain"}}/><span>SALES COMMAND</span></div>')
          p.write_text(s)

          p=Path('app/layout.tsx')
          s=p.read_text()
          if 'dealer-polish.css' not in s:
              s=s.replace('import"./crm.css";', 'import"./crm.css";import"./dealer-polish.css";')
          p.write_text(s)
          PY

          cat > app/dealer/login/page.tsx <<'EOF'
          "use client";
          import {FormEvent,useState} from "react";
          import {useRouter} from "next/navigation";

          export default function DealerLogin(){
            const router=useRouter();
            const[username,setUsername]=useState("");
            const[password,setPassword]=useState("");
            const[msg,setMsg]=useState("");
            const[busy,setBusy]=useState(false);
            async function submit(e:FormEvent){
              e.preventDefault();setBusy(true);setMsg("Signing in…");
              try{
                const r=await fetch("/api/auth/login",{method:"POST",credentials:"include",headers:{"content-type":"application/json"},body:JSON.stringify({email:username.trim(),password})});
                const j=await r.json().catch(()=>({}));
                if(!r.ok||!j?.ok)throw new Error(j?.error||"Sign-in failed");
                document.cookie="wdcc_login_context=dealer; Path=/; SameSite=Lax; Secure";
                sessionStorage.setItem("wdcc_login_context","dealer");
                router.replace("/dealer");
              }catch(x:any){setMsg(x?.message||"Sign-in failed");setBusy(false)}
            }
            return <main className="dealerLoginShell">
              <form className="dealerLoginCard" onSubmit={submit}>
                <div className="dealerLoginBrand"><img src="/wdcc-logo-transparent.webp" alt="We Don't Care Cars"/><span>DEALER COMMAND</span></div>
                <div className="dealerLoginKicker">PRIVATE · INTERNAL DEALER ACCESS</div>
                <h1>Sales Command</h1>
                <p>Leads, inventory, photos, appointments and daily follow-up in one place.</p>
                <label>Username</label>
                <input autoComplete="username" value={username} onChange={e=>setUsername(e.target.value)} required/>
                <label>Password</label>
                <input type="password" autoComplete="current-password" value={password} onChange={e=>setPassword(e.target.value)} required/>
                <button disabled={busy}>{busy?"SIGNING IN…":"ENTER DEALER COMMAND"}</button>
                <div className="dealerLoginMessage" role="status">{msg}</div>
                <div className="dealerLoginNote">Internal dealer system. Customer information and dealer operations are private. Admin credentials may open a dealer-view session for support.</div>
              </form>
            </main>;
          }
          EOF

          cat > app/dealer/inventory/page.tsx <<'EOF'
          "use client";
          import Link from "next/link";
          import {useEffect,useMemo,useState} from "react";
          const money=(v:any)=>Number(v||0).toLocaleString(undefined,{style:"currency",currency:"USD",maximumFractionDigits:0});
          export default function DealerInventory(){
            const[data,setData]=useState<any>();const[message,setMessage]=useState("Loading inventory…");
            useEffect(()=>{fetch("/api/auth/session",{cache:"no-store"}).then(r=>r.json()).then(session=>{if(!session.authenticated){location.href="/dealer/login";return}return fetch("/api/crm/dashboard",{cache:"no-store"})}).then(async r=>{if(!r)return;const j=await r.json();if(!r.ok)throw Error(j.error||"Inventory failed to load");setData(j);setMessage("")}).catch(e=>setMessage(e.message||"Inventory failed to load"))},[]);
            const items=data?.inventory||[];
            const published=useMemo(()=>items.filter((v:any)=>String(v.status||"published")==="published").length,[items]);
            return <main className="crmShell">
              <aside className="crmSidebar"><Link className="crmLogo" href="/dealer"><img src="/wdcc-logo-transparent.webp" alt="We Don't Care Cars"/><span>SALES COMMAND</span></Link><nav><Link href="/dealer">Today</Link><Link href="/dealer/leads">Leads</Link><Link href="/dealer#pipeline">Pipeline</Link><Link href="/dealer#appointments">Appointments</Link><Link className="active" href="/dealer/inventory">Inventory</Link><Link href="/dealer/inventory/new">+ Add Vehicle</Link><Link href="/">View Website</Link></nav></aside>
              <section className="crmMain">
                <header className="inventoryCommandHeader"><div><span className="crmKicker">DEALER COMMAND · INVENTORY</span><h1>Inventory</h1><p>Publish clean listings, keep photos attached, and know exactly what customers can see.</p></div><Link className="inventoryAddPrimary" href="/dealer/inventory/new">+ Add Vehicle</Link></header>
                <section className="inventoryManagerStats"><article><span>Total loaded</span><strong>{items.length}</strong></article><article><span>Customer visible</span><strong>{published}</strong></article><article><span>Needs review</span><strong>{Math.max(0,items.length-published)}</strong></article></section>
                {message&&<div className="crmAlert">{message}</div>}
                <div className="inventoryManagerGrid">{items.map((v:any)=><article className="inventoryManagerCard" key={v.id}><div className="inventoryManagerPhoto">{v.primaryPhotoPathname?<img src={`/api/media?p=${encodeURIComponent(v.primaryPhotoPathname)}`} alt={`${v.year||""} ${v.make||""} ${v.model||""}`}/>:<div><b>PHOTO NEEDED</b><span>Add a customer-facing vehicle image</span></div>}</div><div className="inventoryManagerBody"><div className="inventoryManagerTitle"><div><small>{v.stock?`STOCK ${v.stock}`:"WDCC INVENTORY"}</small><h2>{v.year} {v.make} {v.model}</h2><p>{v.trim||""}</p></div><span className={`inventoryStatus ${String(v.status||"published").toLowerCase()}`}>{String(v.status||"published")}</span></div><div className="inventoryManagerNumbers"><strong>{money(v.price)}</strong><span>{Number(v.mileage||0).toLocaleString()} mi</span>{Number(v.downPayment||0)>0&&<span>{money(v.downPayment)} down</span>}</div><div className="inventoryManagerActions"><Link href={`/vehicle/${v.id}`}>View Listing</Link><Link className="primary" href="/dealer/inventory/new">Add Another</Link></div></div></article>)}{!items.length&&!message&&<div className="crmEmpty">No inventory is loaded yet. Add the first vehicle.</div>}</div>
              </section>
            </main>;
          }
          EOF

          cat > app/dealer-polish.css <<'EOF'
          /* WDCC dealer visual lock — approved transparent circular badge / 2vfD lineage */
          .crmShell{background:radial-gradient(circle at 78% -10%,#102b46 0,transparent 30%),radial-gradient(circle at 18% 110%,#381016 0,transparent 28%),#03070b!important}
          .crmSidebar{background:linear-gradient(180deg,#03070b 0,#07111a 52%,#03070b 100%)!important;border-right:1px solid #243746!important;box-shadow:18px 0 54px #0006}
          .crmLogo{padding:0 8px 18px!important;gap:5px!important}.crmLogo img{width:176px!important;height:176px!important;object-fit:contain!important;background:transparent!important;filter:drop-shadow(0 12px 24px #000b)!important}.crmLogo span{font-size:8px!important;letter-spacing:.24em!important;color:#9cadba!important}
          .crmMain{max-width:1640px;width:100%;margin-inline:auto}
          .crmTopbar h1,.leadInboxHeader h1,.inventoryCommandHeader h1{font-weight:950;letter-spacing:-.045em}
          .crmKpis article,.nextBestCard,.scoreCard,.pipelinePanel,.crmPanel,.leadCardPro,.inventoryManagerCard{box-shadow:0 14px 36px #0003}
          .crmKpis article{border-color:#24394a!important}.crmKicker,.crmSectionHead>div>span{font-size:9px!important}.crmTopbar p,.leadInboxHeader p{font-size:12px!important;line-height:1.55}
          .inventoryCommandHeader{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.inventoryCommandHeader h1{font-size:clamp(34px,5vw,58px);margin:3px 0 4px}.inventoryCommandHeader p{margin:0;color:#8ea0ae;max-width:720px;font-size:12px;line-height:1.5}.inventoryAddPrimary{min-height:48px;padding:0 20px;border-radius:999px;background:#ef202f;color:#fff;text-decoration:none;font-size:10px;font-weight:950;text-transform:uppercase;display:flex;align-items:center;white-space:nowrap;box-shadow:0 10px 28px #ef202f33}
          .inventoryManagerStats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}.inventoryManagerStats article{background:linear-gradient(145deg,#0d1822,#071019);border:1px solid #233848;border-radius:12px;padding:15px 17px}.inventoryManagerStats span{display:block;color:#7e909f;text-transform:uppercase;font-size:8px;font-weight:900;letter-spacing:.08em}.inventoryManagerStats strong{display:block;font-size:30px;margin-top:4px}
          .inventoryManagerGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.inventoryManagerCard{background:linear-gradient(145deg,#0c1721,#071019);border:1px solid #223747;border-radius:14px;overflow:hidden}.inventoryManagerPhoto{aspect-ratio:16/9;background:#101820;display:grid;place-items:center;overflow:hidden}.inventoryManagerPhoto img{width:100%;height:100%;object-fit:cover}.inventoryManagerPhoto>div{text-align:center;color:#8293a0}.inventoryManagerPhoto b,.inventoryManagerPhoto span{display:block}.inventoryManagerPhoto b{font-size:12px}.inventoryManagerPhoto span{font-size:9px;margin-top:4px}.inventoryManagerBody{padding:15px}.inventoryManagerTitle{display:flex;justify-content:space-between;gap:12px}.inventoryManagerTitle small{color:#6c8090;font-size:8px;font-weight:900;letter-spacing:.1em}.inventoryManagerTitle h2{font-size:20px;margin:3px 0 0}.inventoryManagerTitle p{color:#8899a6;margin:2px 0 0;font-size:10px}.inventoryStatus{height:26px;padding:0 9px;border-radius:999px;border:1px solid #315067;display:flex;align-items:center;text-transform:uppercase;font-size:7px;font-weight:900;color:#9db1c0}.inventoryStatus.published{border-color:#235b43;background:#0d2b20;color:#53d69b}.inventoryStatus.draft{border-color:#67552b;background:#2b2410;color:#ffc85d}.inventoryManagerNumbers{display:flex;align-items:baseline;gap:12px;margin:14px 0;color:#8d9daa}.inventoryManagerNumbers strong{font-size:22px;color:#fff}.inventoryManagerNumbers span{font-size:9px}.inventoryManagerActions{display:flex;gap:7px}.inventoryManagerActions a{flex:1;min-height:40px;border:1px solid #345064;border-radius:7px;color:#dce6ee;text-decoration:none;text-transform:uppercase;font-size:8px;font-weight:900;display:flex;align-items:center;justify-content:center}.inventoryManagerActions a.primary{background:#0d6fd0;border-color:#0d6fd0;color:#fff}
