          .dealerLogoImage{display:grid!important;justify-items:center!important;text-decoration:none!important}.dealerLogoImage img{width:170px!important;height:170px!important;object-fit:contain!important}.dealerLogoImage span{display:block!important}

          @media(max-width:760px){
            body{background:#03070b}.crmShell{display:block!important;min-height:100svh!important}.crmSidebar{position:sticky!important;top:0!important;height:92px!important;min-height:92px!important;width:100%!important;padding:4px 12px!important;display:flex!important;align-items:center!important;border-right:0!important;border-bottom:1px solid #243746!important;backdrop-filter:blur(18px);z-index:100!important}.crmLogo{border:0!important;margin:0!important;padding:0!important;display:flex!important;align-items:center!important;gap:8px!important}.crmLogo img{width:88px!important;height:88px!important}.crmLogo span{display:block!important;font-size:6px!important;letter-spacing:.2em!important}.crmSidebar nav{position:fixed!important;left:8px!important;right:8px!important;bottom:calc(8px + env(safe-area-inset-bottom))!important;margin:0!important;padding:7px!important;background:#061019f5!important;border:1px solid #2a3d4c!important;border-radius:18px!important;box-shadow:0 16px 45px #000b!important;display:grid!important;grid-template-columns:repeat(4,1fr)!important;gap:5px!important;z-index:120!important;backdrop-filter:blur(18px)}.crmSidebar nav a{display:none!important;min-height:48px!important;padding:0 5px!important;justify-content:center!important;border-radius:12px!important;font-size:9px!important;letter-spacing:0!important;text-transform:none!important}.crmSidebar nav a:before{content:none!important}.crmSidebar nav a:nth-child(1),.crmSidebar nav a:nth-child(2),.crmSidebar nav a:nth-child(5),.crmSidebar nav a:nth-child(6){display:flex!important}.crmLogout{display:none!important}.crmMain{padding:18px 13px calc(92px + env(safe-area-inset-bottom))!important}.crmTopbar,.leadInboxHeader,.inventoryCommandHeader{display:grid!important;grid-template-columns:1fr!important;gap:12px!important;align-items:start!important;margin-bottom:16px!important}.crmTopbar h1,.leadInboxHeader h1,.inventoryCommandHeader h1{font-size:36px!important;line-height:1!important}.crmTopbar p,.leadInboxHeader p,.inventoryCommandHeader p{font-size:12px!important}.momentum{width:100%!important;min-width:0!important;text-align:left!important;display:grid!important;grid-template-columns:1fr auto!important;align-items:center!important}.momentum small{grid-column:1/-1!important;margin-top:3px!important}.crmKpis{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:9px!important}.crmKpis article{min-height:96px!important;padding:14px!important;border-radius:14px!important}.crmKpis strong{font-size:29px!important}.crmKpis span,.crmKpis small{font-size:9px!important}.crmKpis article:last-child{grid-column:1/-1!important}.crmHeroGrid,.crmLowerGrid{grid-template-columns:1fr!important}.nextBestCard,.scoreCard,.pipelinePanel,.crmPanel{border-radius:14px!important}.crmSectionHead{padding:14px!important}.crmSectionHead h2{font-size:15px!important}.nextLead{padding:15px!important}.nextIdentity h3{font-size:22px!important}.nextIdentity p{font-size:11px!important}.nextSignals span{font-size:8px!important}.nextAction p{font-size:10px!important}.nextButtons a{min-height:44px!important;font-size:9px!important}.pipelineStages{grid-template-columns:repeat(2,1fr)!important}.pipelineStages>div{min-height:88px!important}.hotList article{grid-template-columns:42px minmax(0,1fr)!important}.hotAction{grid-column:2!important;text-align:left!important}.hotPerson strong{font-size:12px!important}.hotPerson span,.hotAction b{font-size:9px!important}.leadCardPro{grid-template-columns:44px minmax(0,1fr)!important;padding:12px!important}.leadCardPro .leadStageSelect,.leadCardPro .leadCardActions{grid-column:2!important}.leadCardActions{justify-content:flex-start!important}.leadCardActions a,.leadCardActions button,.leadStageSelect{min-height:38px!important;font-size:8px!important}.inventoryCommandHeader .inventoryAddPrimary{width:100%;justify-content:center}.inventoryManagerStats{grid-template-columns:repeat(3,minmax(0,1fr))!important}.inventoryManagerStats article{padding:12px 10px!important}.inventoryManagerStats strong{font-size:26px!important}.inventoryManagerGrid{grid-template-columns:1fr!important}.inventoryManagerCard{border-radius:16px!important}.inventoryManagerTitle h2{font-size:19px!important}.inventoryManagerNumbers{flex-wrap:wrap!important}.dealerLoginShell{padding:12px!important}.dealerLoginCard{padding:18px!important;border-radius:18px!important}.dealerLoginBrand img{width:190px!important;height:190px!important}.dealerLoginCard h1{font-size:31px!important}.dealerLogoImage img{width:118px!important;height:118px!important}
          }
          EOF

      - name: Validate production build
        run: |
          npm ci
          npm run build

      - name: Commit one visual-fix changeset to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WDCC Visual Recovery"
          git config user.email "120651995+OnlyClinton@users.noreply.github.com"
          git add public/wdcc-logo-transparent.webp public/wdcc-official-logo.webp app/dealer app/dealer-polish.css app/layout.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Restore approved WDCC logo and polish dealer app"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "Pushed $(git rev-parse HEAD)"
