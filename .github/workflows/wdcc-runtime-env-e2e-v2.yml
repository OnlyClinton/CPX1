name: WDCC Runtime Env Deep E2E v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-runtime-env-e2e-v2.yml'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      BACKEND_PROJECT_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
      STOREFRONT: https://wedontcarecars.com
      DEALER: https://dealer.wedontcarecars.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Link canonical backend
        run: |
          set -euo pipefail
          npm install --global vercel@59.3.0 >/dev/null
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$BACKEND_PROJECT_ID" > .vercel/project.json

      - name: Runtime storage preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          cat > .wdcc-preflight.mjs <<'NODE'
          import {get} from '@vercel/blob';
          if(String(process.env.SESSION_SECRET||'').length<32)throw Error('SESSION_SECRET_NOT_CONFIGURED');
          const r=await get('private/state/platform-v3.json',{access:'private',useCache:false,token:process.env.BLOB_READ_WRITE_TOKEN});
          if(!r||r.statusCode!==200||!r.stream)throw Error('STATE_READ_FAILED');
          const chunks=[];for await(const c of r.stream)chunks.push(c);
          const s=JSON.parse(Buffer.concat(chunks).toString('utf8'));
          console.log('WDCC_PREFLIGHT='+JSON.stringify({ok:true,revision:Number(s.revision||0),users:(s.users||[]).length,vehicles:(s.vehicles||[]).length,leads:(s.leads||[]).length}));
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope=cpxagency -- node .wdcc-preflight.mjs | tee /tmp/preflight.log
          grep '^WDCC_PREFLIGHT=' /tmp/preflight.log | tail -1 | cut -d= -f2- > /tmp/preflight.json
          jq -e '.ok==true' /tmp/preflight.json >/dev/null
          echo "revision=$(jq -r '.revision' /tmp/preflight.json)" >> "$GITHUB_OUTPUT"

      - name: Create runtime-signed QA session
        shell: bash
        run: |
          set -euo pipefail
          cat > .wdcc-session.cjs <<'NODE'
          const crypto=require('crypto');const{get}=require('@vercel/blob');
          (async()=>{const r=await get('private/state/platform-v3.json',{access:'private',useCache:false,token:process.env.BLOB_READ_WRITE_TOKEN});if(!r||r.statusCode!==200||!r.stream)throw Error('STATE_READ_FAILED');const chunks=[];for await(const c of r.stream)chunks.push(c);const s=JSON.parse(Buffer.concat(chunks).toString('utf8'));const roles=new Set(['dealer_agent','tenant_admin','platform_admin']);const u=(s.users||[]).find(x=>roles.has(String(x.role||'').toLowerCase())&&x.status!=='disabled'&&!x.disabled);if(!u)throw Error('NO_ACTIVE_DEALER_USER');const raw=Buffer.from(JSON.stringify({id:u.id,role:u.role,exp:Date.now()+1800000})).toString('base64url');const sig=crypto.createHmac('sha256',process.env.SESSION_SECRET).update(raw).digest('base64url');console.log(`QA_COOKIE=${raw}.${sig}`)})().catch(e=>{console.error(e);process.exit(1)})
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope=cpxagency -- node .wdcc-session.cjs | grep '^QA_COOKIE=' > /tmp/session.env
          cat /tmp/session.env >> "$GITHUB_ENV"

      - name: Verify dealer session
        id: auth
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/auth.json -w '%{http_code}' "$DEALER/api/auth/session" -H "Cookie: __Host-wdcc_session=$QA_COOKIE")"
          cat /tmp/auth.json | jq .
          test "$code" = 200
          jq -e '.authenticated==true' /tmp/auth.json >/dev/null
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Trace all customer lead contracts
        id: leads
        shell: bash
        run: |
          set -euo pipefail
          RUN="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BEFORE="$(curl -fsS "$DEALER/api/leads" -H "Cookie: __Host-wdcc_session=$QA_COOKIE")";BN="$(echo "$BEFORE"|jq '(.items//[])|length')"
          post(){ k="$1";s="$2";x="$3";p="$4";curl -fsS -X POST "$STOREFRONT/api/leads" -H 'content-type: application/json' -H "idempotency-key: wdcc-qa-v2-$x-$RUN" --data "{\"qa\":true,\"kind\":\"$k\",\"name\":\"WDCC QA V2 $x $RUN\",\"phone\":\"$p\",\"email\":\"qa-v2-$x-$RUN@invalid.example\",\"vehicleInterest\":\"Runtime V2 QA\",\"message\":\"Automated deep QA - do not contact\",\"consent\":true,\"source\":\"$s\"}";}
          post schedule schedule-test-drive schedule 813-555-0151 >/tmp/s.json
          post approval get-approved approval 813-555-0152 >/tmp/a.json
          post contact call-sean contact 813-555-0153 >/tmp/c.json
          jq -e '.ok==true and .persisted==true and .item.kind=="schedule" and .item.source=="schedule-test-drive"' /tmp/s.json >/dev/null
          jq -e '.ok==true and .persisted==true and .item.kind=="approval" and .item.source=="get-approved"' /tmp/a.json >/dev/null
          jq -e '.ok==true and .persisted==true and .item.kind=="contact" and .item.source=="call-sean"' /tmp/c.json >/dev/null
          SID="$(jq -r '.item.id' /tmp/s.json)";AID="$(jq -r '.item.id' /tmp/a.json)";CID="$(jq -r '.item.id' /tmp/c.json)"
          post schedule schedule-test-drive schedule 813-555-0151 >/tmp/d.json
          jq -e --arg id "$SID" '.deduplicated==true and .item.id==$id' /tmp/d.json >/dev/null
          curl -fsS "$DEALER/api/leads" -H "Cookie: __Host-wdcc_session=$QA_COOKIE" >/tmp/feed.json
          jq -e --arg s "$SID" --arg a "$AID" --arg c "$CID" '(.items//[]) as $x | any($x[];.id==$s and .source=="schedule-test-drive") and any($x[];.id==$a and .source=="get-approved") and any($x[];.id==$c and .source=="call-sean")' /tmp/feed.json >/dev/null
          echo "before=$BN" >> "$GITHUB_OUTPUT";echo "after=$(jq '(.items//[])|length' /tmp/feed.json)" >> "$GITHUB_OUTPUT";echo "schedule=$SID" >> "$GITHUB_OUTPUT";echo "approval=$AID" >> "$GITHUB_OUTPUT";echo "contact=$CID" >> "$GITHUB_OUTPUT"

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Dealer UI vehicle upload acceptance
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          export RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > .wdcc-upload.cjs <<'NODE'
          const fs=require('fs');const{chromium}=require('playwright');
          (async()=>{const run=process.env.RUN_ID,stock=`WDCC-QA-${run}`;fs.writeFileSync('/tmp/qa.png',Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9WlV1GQAAAAASUVORK5CYII=','base64'));const b=await chromium.launch({headless:true});const c=await b.newContext({viewport:{width:390,height:844}});await c.addCookies([{name:'__Host-wdcc_session',value:process.env.QA_COOKIE,domain:'dealer.wedontcarecars.com',path:'/',httpOnly:true,secure:true,sameSite:'Strict'}]);const p=await c.newPage();const errors=[];p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});p.on('pageerror',e=>errors.push(String(e)));await p.goto(`${process.env.DEALER}/dealer/inventory/new`,{waitUntil:'networkidle'});if(p.url().includes('/dealer/login'))throw Error('SESSION_REDIRECTED');await p.getByLabel('Year').fill('2019');await p.getByLabel('Make').fill('Toyota');await p.getByLabel('Model').fill(`E2E-${run}`);await p.getByLabel('Trim').fill('WDCC QA');await p.getByLabel('Cash Price').fill('12345');await p.getByLabel('Estimated Down Payment').fill('1500');await p.getByLabel('Mileage').fill('54321');await p.getByLabel('Stock #').fill(stock);await p.getByLabel('Description').fill('Automated WDCC dealer upload QA.');await p.locator('input[type=file][multiple]').first().setInputFiles('/tmp/qa.png');await p.getByRole('button',{name:'PUBLISH VEHICLE'}).click();await p.waitForURL(/\/dealer\?saved=published/,{timeout:60000});const r=await c.request.get(`${process.env.DEALER}/api/inventory`,{headers:{Cookie:`__Host-wdcc_session=${process.env.QA_COOKIE}`}});const j=await r.json();const item=(j.items||[]).find(v=>v.stock===stock);if(!item)throw Error('NOT_IN_DEALER');if(!(item.photoPathnames||[]).length)throw Error('NO_PHOTO');const pub=await c.request.get(`${process.env.STOREFRONT}/api/inventory?qa=${Date.now()}`);const pj=await pub.json();if(!(pj.items||[]).some(v=>v.id===item.id||v.stock===stock))throw Error('NOT_PUBLIC');const hide=await c.request.patch(`${process.env.DEALER}/api/inventory/${encodeURIComponent(item.id)}`,{headers:{Cookie:`__Host-wdcc_session=${process.env.QA_COOKIE}`,'content-type':'application/json'},data:{status:'draft',stock:`R36TEST-${stock}`}});if(!hide.ok())throw Error(`HIDE_${hide.status()}`);fs.writeFileSync('/tmp/upload.json',JSON.stringify({ok:true,id:item.id,photos:item.photoPathnames.length,consoleErrors:errors},null,2));await b.close()})().catch(e=>{fs.writeFileSync('/tmp/upload.json',JSON.stringify({ok:false,error:String(e.message||e)},null,2));console.error(e);process.exit(1)})
          NODE
          node .wdcc-upload.cjs
          cat /tmp/upload.json
          echo "vehicle=$(jq -r '.id // ""' /tmp/upload.json)" >> "$GITHUB_OUTPUT";echo "photos=$(jq -r '.photos // 0' /tmp/upload.json)" >> "$GITHUB_OUTPUT"

      - name: Cleanup QA records with runtime environment
        id: cleanup
        if: always() && steps.preflight.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cat > .wdcc-cleanup.mjs <<'NODE'
          import crypto from 'node:crypto';import {get,put} from '@vercel/blob';const token=process.env.BLOB_READ_WRITE_TOKEN,path='private/state/platform-v3.json';async function read(){const r=await get(path,{access:'private',useCache:false,token});if(!r||r.statusCode!==200||!r.stream)throw Error('STATE_READ_FAILED');const c=[];for await(const x of r.stream)c.push(x);return JSON.parse(Buffer.concat(c).toString('utf8'))}const s=await read(),now=new Date().toISOString();const ql=l=>l?.qa===true||String(l?.status||'').toLowerCase()==='test'||String(l?.email||'').toLowerCase().endsWith('@invalid.example')||String(l?.name||'').toUpperCase().startsWith('WDCC QA ');const qv=v=>{const st=String(v?.status||'').toLowerCase(),stock=String(v?.stock||'').toUpperCase(),badges=Array.isArray(v?.badges)?v.badges.map(x=>String(x).toUpperCase()):[];const invalid=Number(v?.year)<=1900||!String(v?.make||'').trim()||!String(v?.model||'').trim()||Number(v?.price||0)<=0;return st==='published'&&(stock.startsWith('R36TEST-')||stock.startsWith('WDCC-QA-')||badges.includes('R36-TEST')||invalid)};const lids=(s.leads||[]).filter(ql).map(x=>x.id),vids=(s.vehicles||[]).filter(qv).map(x=>x.id);s.leads=(s.leads||[]).filter(x=>!lids.includes(x.id));s.vehicles=(s.vehicles||[]).map(v=>vids.includes(v.id)?{...v,status:'archived',updatedAt:now,qaCleanupAt:now}:v);s.audit=Array.isArray(s.audit)?s.audit:[];s.audit.push({id:crypto.randomUUID(),at:now,action:'qa.runtime.cleanup',actor:'wdcc-runtime-v2',qaLeadsRemoved:lids.length,vehiclesArchived:vids.length});if(lids.length||vids.length){s.revision=Number(s.revision||0)+1;s.updatedAt=now;await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',token})}console.log('WDCC_CLEANUP='+JSON.stringify({ok:true,qaLeadsRemoved:lids.length,vehiclesArchived:vids.length}));
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope=cpxagency -- node .wdcc-cleanup.mjs | tee /tmp/cleanup.log
          grep '^WDCC_CLEANUP=' /tmp/cleanup.log | tail -1 | cut -d= -f2- > /tmp/cleanup.json
          echo "leads=$(jq -r '.qaLeadsRemoved' /tmp/cleanup.json)" >> "$GITHUB_OUTPUT";echo "vehicles=$(jq -r '.vehiclesArchived' /tmp/cleanup.json)" >> "$GITHUB_OUTPUT"
          curl -fsS "$STOREFRONT/api/inventory?clean=${GITHUB_RUN_ID}" >/tmp/public.json
          jq -e 'all((.items//[])[]; (.year>1900) and ((.make|length)>0) and ((.model|length)>0) and (.price>0) and (((.stock//"")|ascii_upcase|startswith("R36TEST-"))|not) and (((.stock//"")|ascii_upcase|startswith("WDCC-QA-"))|not))' /tmp/public.json >/dev/null

      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          PREFLIGHT: ${{ steps.preflight.outcome }}
          REVISION: ${{ steps.preflight.outputs.revision }}
          AUTH: ${{ steps.auth.outcome }}
          AUTHCODE: ${{ steps.auth.outputs.code }}
          LEADS: ${{ steps.leads.outcome }}
          SCHEDULE: ${{ steps.leads.outputs.schedule }}
          APPROVAL: ${{ steps.leads.outputs.approval }}
          CONTACT: ${{ steps.leads.outputs.contact }}
          UPLOAD: ${{ steps.upload.outcome }}
          VEHICLE: ${{ steps.upload.outputs.vehicle }}
          PHOTOS: ${{ steps.upload.outputs.photos }}
          CLEAN: ${{ steps.cleanup.outcome }}
          CLEADS: ${{ steps.cleanup.outputs.leads }}
          CVEHICLES: ${{ steps.cleanup.outputs.vehicles }}
        run: |
          body=$(printf 'Status: **%s**\nRuntime ledger preflight: `%s` revision `%s`\nDealer session: `%s` HTTP `%s`\nLead trace: `%s` schedule `%s`, approval `%s`, contact `%s`\nVehicle upload/publish: `%s` vehicle `%s`, photos `%s`\nCleanup: `%s` QA leads `%s`, invalid/QA vehicles `%s`' "$STATUS" "$PREFLIGHT" "$REVISION" "$AUTH" "$AUTHCODE" "$LEADS" "$SCHEDULE" "$APPROVAL" "$CONTACT" "$UPLOAD" "$VEHICLE" "$PHOTOS" "$CLEAN" "$CLEADS" "$CVEHICLES")
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC runtime deep E2E v2 ${GITHUB_RUN_ID}" --body "$body" || true

# No deployment. Runtime secrets stay inside Vercel env run and are not printed.
