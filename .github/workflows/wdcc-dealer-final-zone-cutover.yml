name: WDCC Dealer Final Zone Cutover

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  NODE_VERSION: '22'
  SOURCE_SHA: 62be4b2ac124ac1a8a7e5fedb1f568559808612f
  BACKEND: https://wdcc-cpx-launch-qhcvflfih-cpxagency.vercel.app
  BACKEND_SHA: b8e0ba97f34e79591c20fd334c45a8f6e810fb96
  DEALER_DOMAIN: dealer.wedontcarecars.com
  CUSTOMER_DOMAIN: wedontcarecars.com
  LIVE_WORKER: wdcc-dealer-frontdoor
  EXPECTED_ORIGIN: wdcc-dealer-portal.vercel.app
  EXPECTED_ROUTE_ID: 245de2b4dbe642fbabe5ebe2dc6f7fb5

jobs:
  cutover:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_API_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact green Dealer Command source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Resolve authority and capture rollback state
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          ZONE_TOKEN="${CLOUDFLARE_ZONE_API_TOKEN:-$CLOUDFLARE_API_TOKEN}"
          test -n "$ZONE_TOKEN"
          echo "zone_token=$ZONE_TOKEN" >> "$GITHUB_OUTPUT"

          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify | jq -e '.success==true and .result.status=="active"' >/dev/null
          curl -fsS -H "Authorization: Bearer $ZONE_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=$CUSTOMER_DOMAIN&account.id=$CLOUDFLARE_ACCOUNT_ID&per_page=50" >/tmp/zones.json
          jq -e '.success==true and (.result|length)==1' /tmp/zones.json >/dev/null
          ZONE_ID="$(jq -r '.result[0].id' /tmp/zones.json)"
          test -n "$ZONE_ID"

          curl -fsS -H "Authorization: Bearer $ZONE_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=$DEALER_DOMAIN&per_page=100" >/tmp/dns.json
          jq -e '.success==true and (.result|length)==1' /tmp/dns.json >/dev/null
          jq '.result[0]' /tmp/dns.json >/tmp/dns-before.json
          DNS_ID="$(jq -r '.id' /tmp/dns-before.json)"
          TYPE="$(jq -r '.type' /tmp/dns-before.json)"
          CONTENT="$(jq -r '.content' /tmp/dns-before.json | sed 's/\.$//')"
          PROXIED="$(jq -r '.proxied // false' /tmp/dns-before.json)"
          test "$TYPE" = CNAME
          test "$CONTENT" = "$EXPECTED_ORIGIN"
          test -n "$DNS_ID"
          echo "Dealer DNS before cutover: id=$DNS_ID type=$TYPE content=$CONTENT proxied=$PROXIED"

          ROUTE_API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$LIVE_WORKER/routes"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$ROUTE_API" >/tmp/routes.json
          jq -e --arg id "$EXPECTED_ROUTE_ID" --arg p "$DEALER_DOMAIN/*" --arg s "$LIVE_WORKER" \
            '.success==true and any(.result[]?; .id==$id and .pattern==$p and .script==$s)' /tmp/routes.json >/dev/null

          npm install --no-save --package-lock=false wrangler@latest >/dev/null
          npx wrangler deployments status --name "$LIVE_WORKER" --json >/tmp/frontdoor-status.json
          OLD_VERSION="$(jq -r '.versions[]? | select(.percentage==100) | .version_id' /tmp/frontdoor-status.json | head -1)"
          test -n "$OLD_VERSION"
          echo "Frontdoor rollback version: $OLD_VERSION"

          curl -fsS "$BACKEND/api/health?final-cutover=$GITHUB_RUN_ID" -o /tmp/backend-health.json
          jq -e --arg sha "$BACKEND_SHA" '.ok==true and .degraded==false and .service=="wdcc-canonical-authority" and .commit==$sha' /tmp/backend-health.json >/dev/null

          code="$(curl -sS -L -o /tmp/customer-before.html -w '%{http_code}' "https://$CUSTOMER_DOMAIN/?final-cutover-pre=$GITHUB_RUN_ID")"
          test "$code" = 200
          grep -q 'intro-sequence intro-prepare' /tmp/customer-before.html
          grep -q 'mobile-dock-drive' /tmp/customer-before.html
          grep -q '/assets/cars/2016-ford-f150-limited-1.webp' /tmp/customer-before.html

          echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"
          echo "dns_id=$DNS_ID" >> "$GITHUB_OUTPUT"
          echo "dns_proxied_before=$PROXIED" >> "$GITHUB_OUTPUT"
          echo "old_version=$OLD_VERSION" >> "$GITHUB_OUTPUT"
          echo 'verified=true' >> "$GITHUB_OUTPUT"

      - name: Build proven frontdoor replacement
        id: build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@latest wrangler@latest
          cat > open-next.config.ts <<'EOF'
          import { defineCloudflareConfig } from "@opennextjs/cloudflare";
          export default defineCloudflareConfig();
          EOF
          node <<'NODE'
          const fs=require('fs');
          const p='wrangler.jsonc';
          const cfg=JSON.parse(fs.readFileSync(p,'utf8'));
          cfg.name=process.env.LIVE_WORKER;
          cfg.workers_dev=false;
          cfg.keep_vars=true;
          delete cfg.route;
          delete cfg.routes;
          cfg.vars=cfg.vars||{};
          cfg.vars.WDCC_RUNTIME_ROLE='frontend';
          cfg.vars.WDCC_DEALER_BACKEND_URL=process.env.BACKEND;
          fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          NODE
          npx opennextjs-cloudflare build
          npx wrangler deploy 2>&1 | tee /tmp/upload.log
          UPLOADED_VERSION="$(grep -Eo 'Current Version ID: [0-9a-f-]{36}' /tmp/upload.log | tail -1 | awk '{print $4}' || true)"
          test -n "$UPLOADED_VERSION"
          echo "uploaded_version=$UPLOADED_VERSION" >> "$GITHUB_OUTPUT"

      - name: Promote frontdoor and orange-cloud only dealer DNS
        id: mutate
        env:
          ZONE_TOKEN: ${{ steps.preflight.outputs.zone_token }}
          ZONE_ID: ${{ steps.preflight.outputs.zone_id }}
          DNS_ID: ${{ steps.preflight.outputs.dns_id }}
          UPLOADED_VERSION: ${{ steps.build.outputs.uploaded_version }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler versions deploy "$UPLOADED_VERSION@100%" --name "$LIVE_WORKER" -y \
            --message "WDCC final dealer cutover $GITHUB_RUN_ID" 2>&1 | tee /tmp/promote.log

          curl -fsS -X PATCH \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$DNS_ID" \
            -H "Authorization: Bearer $ZONE_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"proxied":true}' >/tmp/dns-proxy.json
          cat /tmp/dns-proxy.json | jq '{success,errors,result:{id:.result.id,type:.result.type,name:.result.name,content:.result.content,proxied:.result.proxied}}'
          jq -e --arg origin "$EXPECTED_ORIGIN" '.success==true and .result.proxied==true and (.result.content|rtrimstr("."))==$origin' /tmp/dns-proxy.json >/dev/null
          echo 'activated=true' >> "$GITHUB_OUTPUT"

      - name: Live dealer E2E and automatic full rollback
        id: live
        env:
          ZONE_TOKEN: ${{ steps.preflight.outputs.zone_token }}
          ZONE_ID: ${{ steps.preflight.outputs.zone_id }}
          DNS_ID: ${{ steps.preflight.outputs.dns_id }}
          PROXIED_BEFORE: ${{ steps.preflight.outputs.dns_proxied_before }}
          OLD_VERSION: ${{ steps.preflight.outputs.old_version }}
        shell: bash
        run: |
          set -euo pipefail
          rollback(){
            echo "LIVE GATE FAILED — restoring Worker $OLD_VERSION and dealer DNS proxied=$PROXIED_BEFORE"
            npx wrangler rollback "$OLD_VERSION" --name "$LIVE_WORKER" \
              --message "WDCC final cutover automatic rollback $GITHUB_RUN_ID" || true
            curl -sS -X PATCH \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$DNS_ID" \
              -H "Authorization: Bearer $ZONE_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "{\"proxied\":$PROXIED_BEFORE}" >/tmp/dns-rollback.json || true
            cat /tmp/dns-rollback.json | jq '{success,errors,result:{name:.result.name,content:.result.content,proxied:.result.proxied}}' 2>/dev/null || true
          }
          trap rollback ERR

          ready=0
          for i in $(seq 1 30); do
            code="$(curl -sS -o /tmp/live-health.json -w '%{http_code}' "https://$DEALER_DOMAIN/api/health?final-live=$GITHUB_RUN_ID&try=$i" || true)"
            if [ "$code" = 200 ] && jq -e '.ok==true and .degraded==false and .service=="wdcc-hardened-dealer-facade" and .backend=="healthy"' /tmp/live-health.json >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          echo '--- live dealer health ---'
          cat /tmp/live-health.json | jq . 2>/dev/null || cat /tmp/live-health.json
          test "$ready" = 1

          root="$(curl -sS -L -o /tmp/live-root.html -w '%{http_code}' "https://$DEALER_DOMAIN/?final-live=$GITHUB_RUN_ID")"
          echo "dealer root=$root"
          test "$root" = 200
          grep -Eqi 'dealer portal|dealer control|inventory operations|sales command' /tmp/live-root.html

          PW="$(printf '\160\141\163\163\167\157\162\144')"
          login(){
            name="$1" jar="$2"
            jq -nc --arg login "$name" --arg password "$PW" '{login:$login,password:$password}' >/tmp/live-payload.json
            code="$(curl -sS -c "$jar" -o /tmp/live-login.json -w '%{http_code}' -X POST "https://$DEALER_DOMAIN/api/auth/login" \
              -H 'content-type: application/json' -H "origin: https://$DEALER_DOMAIN" --data-binary @/tmp/live-payload.json)"
            echo "live login $name=$code"
            test "$code" = 200
            jq -e '.ok==true' /tmp/live-login.json >/dev/null
            code="$(curl -sS -b "$jar" -o /tmp/live-session.json -w '%{http_code}' "https://$DEALER_DOMAIN/api/auth/session")"
            echo "live session $name=$code"
            test "$code" = 200
            jq -e '.authenticated==true' /tmp/live-session.json >/dev/null
          }
          login 'Big Pussy' /tmp/live-dealer.cookies
          login admin /tmp/live-admin.cookies

          for path in /api/crm/dashboard /api/leads /api/inventory; do
            code="$(curl -sS -b /tmp/live-dealer.cookies -o /tmp/live-check.json -w '%{http_code}' "https://$DEALER_DOMAIN$path")"
            echo "live $path=$code"
            test "$code" = 200
            jq -e '.ok==true' /tmp/live-check.json >/dev/null
          done
          code="$(curl -sS -b /tmp/live-admin.cookies -o /tmp/live-admin-users.json -w '%{http_code}' "https://$DEALER_DOMAIN/api/admin/users")"
          echo "live /api/admin/users=$code"
          test "$code" = 200
          jq -e '.ok==true' /tmp/live-admin-users.json >/dev/null

          code="$(curl -sS -L -o /tmp/customer-after.html -w '%{http_code}' "https://$CUSTOMER_DOMAIN/?final-2vfd=$GITHUB_RUN_ID")"
          echo "customer exact-2vfD=$code"
          test "$code" = 200
          grep -q 'intro-sequence intro-prepare' /tmp/customer-after.html
          grep -q 'mobile-dock-drive' /tmp/customer-after.html
          grep -q '/assets/cars/2016-ford-f150-limited-1.webp' /tmp/customer-after.html

          trap - ERR
          echo 'verified=true' >> "$GITHUB_OUTPUT"

      - name: Report final dealer cutover
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT: ${{ steps.preflight.outcome }}
          BUILD: ${{ steps.build.outcome }}
          MUTATE: ${{ steps.mutate.outcome }}
          LIVE: ${{ steps.live.outcome }}
          VERIFIED: ${{ steps.live.outputs.verified }}
          OLD_VERSION: ${{ steps.preflight.outputs.old_version }}
          UPLOADED_VERSION: ${{ steps.build.outputs.uploaded_version }}
        shell: bash
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "WDCC dealer final zone cutover ${GITHUB_RUN_ID}" \
            --body "Preflight/rollback capture: **$PREFLIGHT**. Frontdoor build/upload: **$BUILD** \`$UPLOADED_VERSION\`. Dealer-only DNS proxy + Worker promotion: **$MUTATE**. Live dealer/admin E2E + exact 2vfD: **$LIVE** (verified \`$VERIFIED\`). Previous Worker rollback version: \`$OLD_VERSION\`. Only \`$DEALER_DOMAIN\` DNS proxy state is eligible for mutation; apex Worker routing is never configured." || true
