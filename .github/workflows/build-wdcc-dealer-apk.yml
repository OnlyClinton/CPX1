name: BUILD WDCC DEALER APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/dealer-app/**'
      - '.github/workflows/build-wdcc-dealer-apk.yml'

permissions:
  contents: write

concurrency:
  group: wdcc-dealer-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable APK
        working-directory: android/dealer-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Stage dealer APK
        run: |
          cp android/dealer-app/app/build/outputs/apk/debug/app-debug.apk WDCC-Dealer.apk
          test "$(stat -c%s WDCC-Dealer.apk)" -gt 10000
          sha256sum WDCC-Dealer.apk | tee WDCC-Dealer.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: WDCC-Dealer-APK
          path: |
            WDCC-Dealer.apk
            WDCC-Dealer.apk.sha256
          retention-days: 30

      - name: Publish stable download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wdcc-dealer-app-v1
          name: WDCC Dealer Android App
          body: |
            WDCC Dealer 1.1 Android installer.

            Automatically rejects a misrouted customer storefront and selects a verified dealer portal endpoint.
            Includes persistent portal cookies, camera/file picker support, multiple-photo selection, and secure external-link handling.
            Build commit: ${{ github.sha }}
          files: |
            WDCC-Dealer.apk
            WDCC-Dealer.apk.sha256
          make_latest: true
          prerelease: false
          draft: false
          overwrite_files: true

      - name: Verify public installer
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/OnlyClinton/CPX1/releases/download/wdcc-dealer-app-v1/WDCC-Dealer.apk"
          for attempt in $(seq 1 12); do
            if curl -fL --retry 2 --retry-delay 2 "$URL" -o /tmp/WDCC-Dealer.apk; then
              break
            fi
            sleep 5
          done
          test -s /tmp/WDCC-Dealer.apk
          test "$(stat -c%s /tmp/WDCC-Dealer.apk)" -gt 10000
          RELEASE_SHA="$(sha256sum /tmp/WDCC-Dealer.apk | awk '{print $1}')"
          LOCAL_SHA="$(awk '{print $1}' WDCC-Dealer.apk.sha256)"
          test "$RELEASE_SHA" = "$LOCAL_SHA"
          cat > /tmp/ready.json <<EOF
          {"message":"certify WDCC Dealer APK $GITHUB_SHA","content":"$(printf 'status=READY\nversion=1.1.0\nbuild_commit=%s\nsha256=%s\ndownload=https://github.com/OnlyClinton/CPX1/releases/download/wdcc-dealer-app-v1/WDCC-Dealer.apk\n' "$GITHUB_SHA" "$RELEASE_SHA" | base64 -w0)"}
          EOF
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/WDCC_DEALER_APK_READY.txt"
          CURRENT_SHA="$(curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' "$API" | jq -r '.sha // empty' || true)"
          if [ -n "$CURRENT_SHA" ]; then
            jq --arg sha "$CURRENT_SHA" '. + {sha:$sha}' /tmp/ready.json > /tmp/ready-update.json
            mv /tmp/ready-update.json /tmp/ready.json
          fi
          curl -fsS -X PUT -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' "$API" --data-binary @/tmp/ready.json >/dev/null
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
