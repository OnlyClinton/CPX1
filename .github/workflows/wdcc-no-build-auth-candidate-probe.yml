name: WDCC No-Build Auth Candidate Probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-no-build-auth-candidate-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Install Vercel CLI
        run: npm install --global vercel@59.3.0 >/dev/null
      - name: Probe READY artifacts for routes and Blob-backed auth
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            wdcc-v32-storefront-mqfvbvl65-cpxagency.vercel.app
            wdcc-v32-storefront-dt496r4il-cpxagency.vercel.app
            wdcc-v32-storefront-9x6w64q3k-cpxagency.vercel.app
            wdcc-cpx-launch-g0t1np08g-cpxagency.vercel.app
            wdcc-cpx-launch-b01un0onc-cpxagency.vercel.app
            wdcc-dealer-portal-9yp7ajong-cpxagency.vercel.app
            wdcc-dealer-portal-haaxzbb5n-cpxagency.vercel.app
            wdcc-dealer-portal-db34q2tqa-cpxagency.vercel.app
          )
          for d in "${candidates[@]}"; do
            echo "=== $d ==="
            for p in / /dealer /admin /api/health; do
              out="$(vercel curl "$p" --deployment "$d" -- --silent --output /tmp/body --write-out '%{http_code}' 2>/tmp/err || true)"
              code="$(printf '%s' "$out" | tail -c 3)"
              echo "$p HTTP=${code:-ERR}"
            done
            auth="$(vercel curl /api/auth/login --deployment "$d" -- --silent --request POST --header 'Origin: https://wedontcarecars.com' --header 'Content-Type: application/json' --data '{"email":"probe-no-user@invalid.example","password":"nope"}' --write-out '\nHTTP:%{http_code}' 2>&1 || true)"
            printf '%s\n' "$auth" | tail -8
            if printf '%s' "$auth" | grep -q 'No blob credentials found'; then echo 'BLOB_AUTH=FAIL';
            elif printf '%s' "$auth" | grep -Eqi 'invalid|credential|401|403|user'; then echo 'BLOB_AUTH=AVAILABLE';
            else echo 'BLOB_AUTH=UNKNOWN'; fi
          done
