name: WDCC DEALER UI FINAL LIVE

on:
  push:
    branches: [main]
    paths:
      - 'TRIGGER_WDCC_DEALER_UI_FINAL.txt'
  workflow_dispatch:

concurrency:
  group: wdcc-dealer-ui-final-live
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
      actions: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: cpxagency
      VERCEL_PROJECT: wdcc-v32-storefront
      RELEASE_SHA: 98c84814c00528e6114196f8d5ff7597fb844b20
      APEX: https://wedontcarecars.com
      DEALER: https://dealer.wedontcarecars.com
    steps:
      - name: Checkout frozen unified release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify unified source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'screenshotContract' app/Exact2vfDHome.tsx
          grep -q 'header-logo-image' app/Exact2vfDHome.tsx
          grep -q 'Schedule a test drive' app/Exact2vfDHome.tsx
          grep -q 'Get pre-approved' app/Exact2vfDHome.tsx
          grep -q 'CALL SEAN' app/Exact2vfDHome.tsx
          grep -q 'mobile-action-bar' app/Exact2vfDHome.tsx
          grep -q 'Total Vehicles' app/dealer/page.tsx
          grep -q 'Inventory Overview' app/dealer/page.tsx
          grep -q 'Recent Vehicles' app/dealer/page.tsx
          grep -q 'Add / Edit Vehicle' app/dealer/inventory/new/page.tsx
          grep -q 'Vehicle Information' app/dealer/inventory/new/page.tsx
          grep -q 'Listing Readiness' app/dealer/inventory/new/page.tsx
          grep -q 'Upload Files' app/dealer/inventory/new/page.tsx
          grep -q 'Publish / Submit' app/dealer/inventory/new/page.tsx

      - name: Install Vercel CLI
        run: npm install --global vercel@59.3.0

      - name: Link exact storefront project
        run: vercel link --yes --project="$VERCEL_PROJECT" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Pull production environment
        run: vercel pull --yes --environment=production --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Build production locally
        run: vercel build --prod --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output even if optional Vercel checks fail
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          set +e
          vercel deploy --prebuilt --prod --yes --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" > /tmp/deploy.log 2>&1
          rc=$?
          set -e
          cat /tmp/deploy.log
          url="$(grep -Eo 'https://wdcc-v32-storefront-[a-z0-9]+-cpxagency\.vercel\.app' /tmp/deploy.log | tail -n 1 || true)"
          test -n "$url"
          echo "Vercel CLI exit after deployment/checks: $rc"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $url"

      - name: Point all WDCC Vercel aliases to one deployment
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_URL"
          vercel promote "$DEPLOY_URL" --yes --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" || true
          for domain in wedontcarecars.com www.wedontcarecars.com dealer.wedontcarecars.com; do
            vercel alias set "$DEPLOY_URL" "$domain" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
          done

      - name: Verify live storefront API and portal contract
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 40); do
            home_code="$(curl -sS -L -o /tmp/home.html -w '%{http_code}' "$APEX/?intro=1&release=${GITHUB_RUN_ID}" || true)"
            health_code="$(curl -sS -L -o /tmp/health.json -w '%{http_code}' "$APEX/api/health" || true)"
            inv_code="$(curl -sS -L -o /tmp/inventory.json -w '%{http_code}' "$APEX/api/inventory?release=${GITHUB_RUN_ID}" || true)"
            test_code="$(curl -sS -L -o /tmp/test.html -w '%{http_code}' "$APEX/schedule-test-drive" || true)"
            approved_code="$(curl -sS -L -o /tmp/approved.html -w '%{http_code}' "$APEX/get-approved" || true)"
            dealer_code="$(curl -sS -L -o /tmp/dealer.html -w '%{http_code}' "$DEALER/dealer" || true)"
            admin_code="$(curl -sS -L -o /tmp/admin.html -w '%{http_code}' "$APEX/admin/login" || true)"
            if [ "$home_code" = 200 ] && [ "$health_code" = 200 ] && [ "$inv_code" = 200 ] && [ "$test_code" = 200 ] && [ "$approved_code" = 200 ] && [ "$dealer_code" = 200 ] && [ "$admin_code" = 200 ]; then
              if jq -e --arg sha "$RELEASE_SHA" '.ok == true and .degraded == false and .commit == $sha' /tmp/health.json >/dev/null 2>&1 && jq -e '.ok == true and (.items|type)=="array"' /tmp/inventory.json >/dev/null 2>&1; then
                if grep -q 'screenshotContract' /tmp/home.html && grep -q 'header-logo-image' /tmp/home.html && grep -qi 'Schedule a test drive' /tmp/home.html && grep -qi 'Get pre-approved' /tmp/home.html && grep -qi 'CALL SEAN' /tmp/home.html && grep -q 'mobile-action-bar' /tmp/home.html; then
                  ok=1
                  break
                fi
              fi
            fi
            sleep 3
          done
          test "$ok" = 1
          ! grep -q 'R36TEST-' /tmp/home.html
          echo verified=true >> "$GITHUB_OUTPUT"

      - name: Trigger authenticated dealer listing acceptance
        if: steps.verify.outputs.verified == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wdcc-listing-only-e2e.yml --ref main

      - name: Report release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          VERIFY: ${{ steps.verify.outputs.verified }}
        shell: bash
        run: |
          body=$(printf 'Unified source SHA: `%s`\nProduction deployment: `%s`\nApex/www/dealer aliases unified: attempted\nPublic contract verified: `%s`\nAuthenticated dealer acceptance: triggered after public PASS\n\nApex: %s\nDealer: %s' "$RELEASE_SHA" "${DEPLOY_URL:-not-created}" "${VERIFY:-false}" "$APEX" "$DEALER")
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC unified final live ${GITHUB_RUN_ID}" --body "$body" || true
