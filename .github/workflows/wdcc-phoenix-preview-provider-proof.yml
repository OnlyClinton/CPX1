name: WDCC Phoenix Preview Provider Recovery

# Code/build safety runs automatically on the isolated recovery branch.
# Blob/provider proof is manual-only while the canonical Vercel Blob store is
# known to be paused. This prevents quota/auth faults from creating probe fan-out.
on:
  push:
    branches:
      - fix/wdcc-preview-provider-recovery-20260827
    paths:
      - 'lib/store.ts'
      - 'lib/wdccAuthority.ts'
      - 'app/api/health/route.ts'
      - 'app/api/inventory/**'
      - 'tsconfig.json'
      - '.github/workflows/wdcc-phoenix-preview-provider-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-phoenix-preview-provider-recovery
  cancel-in-progress: true

env:
  VERCEL_CLI_VERSION: '59.3.0'

jobs:
  build-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify Vercel build isolation
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const ts=JSON.parse(fs.readFileSync('tsconfig.json','utf8'));
          const excluded=new Set(Array.isArray(ts.exclude)?ts.exclude:[]);
          if(!excluded.has('open-next.config.ts')){
            throw new Error('open-next.config.ts must stay outside the Vercel/Next typecheck');
          }
          NODE
          npm run build

  provider-proof:
    if: github.event_name == 'workflow_dispatch'
    needs: build-safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      VERCEL_PROJECT_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
      WDCC_BLOB_STORE_ID: store_cNUyQRVlXtyvZQ5N
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Require Vercel credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"

      - name: Link isolated Phoenix project
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Inspect Blob project connection READ ONLY
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +e
          npx --yes "vercel@${VERCEL_CLI_VERSION}" blob list-stores --token="$VERCEL_TOKEN" --scope=cpxagency 2>&1 | tee blob-project-stores.txt
          echo "project_store_list_rc=${PIPESTATUS[0]}" | tee blob-project-stores-status.txt
          npx --yes "vercel@${VERCEL_CLI_VERSION}" blob list-stores --all --token="$VERCEL_TOKEN" --scope=cpxagency 2>&1 | tee blob-team-stores.txt
          echo "team_store_list_rc=${PIPESTATUS[0]}" | tee blob-team-stores-status.txt
          npx --yes "vercel@${VERCEL_CLI_VERSION}" blob get-store "$WDCC_BLOB_STORE_ID" --token="$VERCEL_TOKEN" --scope=cpxagency 2>&1 | tee blob-store.txt
          echo "get_store_rc=${PIPESTATUS[0]}" | tee blob-store-status.txt
          set -e

      - name: Deploy PREVIEW only with Vercel-managed runtime identity
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -uo pipefail
          log="$PWD/phoenix-preview-deploy.log"
          : > "$log"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --yes \
            --token="$VERCEL_TOKEN" \
            --scope=cpxagency \
            --env "BLOB_READ_WRITE_TOKEN=" \
            --env "BLOB_STORE_ID=$WDCC_BLOB_STORE_ID" \
            --build-env "BLOB_READ_WRITE_TOKEN=" \
            --build-env "BLOB_STORE_ID=$WDCC_BLOB_STORE_ID" \
            2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          clean="$(sed -r 's/\x1B\[[0-9;]*[mK]//g' "$log")"
          url="$(printf '%s\n' "$clean" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -1 || true)"
          if [ "$rc" -ne 0 ]; then
            echo "Vercel preview deploy failed rc=$rc" >&2
            exit "$rc"
          fi
          if [ -z "$url" ]; then
            echo 'Vercel preview deploy succeeded but emitted no immutable preview URL' >&2
            exit 1
          fi
          case "$url" in
            https://wdcc-cpx-launch.vercel.app|https://wedontcarecars.com|https://www.wedontcarecars.com)
              echo 'Refusing production or mutable project domain' >&2
              exit 1
              ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > phoenix-preview-url.txt

      - name: Prove canonical state READ ONLY
        id: health
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          : > health.json
          health_code="$(curl -sS -L --connect-timeout 15 --max-time 30 -o health.json -w '%{http_code}' "$URL/api/health" || true)"
          health_code="${health_code:-000}"
          jq . health.json 2>/dev/null || cat health.json || true

          if [ "$health_code" != 200 ] || ! jq -e '.ok==true and .state=="readable"' health.json >/dev/null 2>&1; then
            HEALTH_CODE="$health_code" URL="$URL" node - <<'NODE'
          const fs=require('fs');
          let health={};
          try{ health=JSON.parse(fs.readFileSync('health.json','utf8')); }catch{}
          const providerErrors=new Set(['STATE_PROVIDER_BLOCKED','STATE_PROVIDER_BACKOFF','STATE_AUTHORITY_MISSING']);
          const classification=providerErrors.has(String(health.error||''))?'provider-blocked':'health-unhealthy';
          fs.writeFileSync('provider-classification.json',JSON.stringify({
            sha:process.env.GITHUB_SHA,
            url:process.env.URL,
            classification,
            healthCode:process.env.HEALTH_CODE,
            error:health.error||null,
            state:health.state||null,
            storage:health.storage||null,
            provider:health.provider||null,
            writeRequests:0
          },null,2)+'\n');
          NODE
            echo 'Provider proof stopped after health. Inventory was not queried.' >&2
            exit 1
          fi

      - name: Prove public inventory READ ONLY
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          : > inventory.json
          inv_code="$(curl -sS -L --connect-timeout 15 --max-time 30 -o inventory.json -w '%{http_code}' "$URL/api/inventory" || true)"
          inv_code="${inv_code:-000}"
          jq '{ok,count,error,previewFallback,inventorySource}' inventory.json 2>/dev/null || cat inventory.json || true

          if [ "$inv_code" != 200 ] || ! jq -e '.ok==true and (.previewFallback!=true) and (.inventorySource!="last-known-good-real-proof") and (.items|type=="array")' inventory.json >/dev/null 2>&1; then
            INV_CODE="$inv_code" URL="$URL" node - <<'NODE'
          const fs=require('fs');
          let inventory={};
          try{ inventory=JSON.parse(fs.readFileSync('inventory.json','utf8')); }catch{}
          fs.writeFileSync('provider-classification.json',JSON.stringify({
            sha:process.env.GITHUB_SHA,
            url:process.env.URL,
            classification:'inventory-unhealthy',
            inventoryCode:process.env.INV_CODE,
            error:inventory.error||null,
            writeRequests:0
          },null,2)+'\n');
          NODE
            exit 1
          fi

          URL="$URL" node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('health.json','utf8'));
          const i=JSON.parse(fs.readFileSync('inventory.json','utf8'));
          const publicSummary=(Array.isArray(i.items)?i.items:[]).map(v=>({
            id:v.id,
            year:v.year,
            make:v.make,
            model:v.model,
            trim:v.trim||'',
            price:v.price??v.cashPrice,
            mileage:v.mileage,
            photo:Boolean(v.primaryPhotoPathname||v.primary_image_url||v.image)
          }));
          const proof={
            sha:process.env.GITHUB_SHA,
            url:process.env.URL,
            health:{ok:h.ok,state:h.state,storage:h.storage,revision:h.revision,commit:h.commit},
            inventory:{ok:i.ok,count:publicSummary.length,items:publicSummary},
            writeRequests:0
          };
          fs.writeFileSync('phoenix-provider-proof.json',JSON.stringify(proof,null,2)+'\n');
          fs.writeFileSync('provider-classification.json',JSON.stringify({
            sha:process.env.GITHUB_SHA,
            url:process.env.URL,
            classification:'provider-green',
            healthCode:200,
            inventoryCode:200,
            writeRequests:0
          },null,2)+'\n');
          NODE

      - name: Upload proof and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wdcc-phoenix-preview-provider-recovery-${{ github.sha }}
          path: |
            blob-project-stores.txt
            blob-project-stores-status.txt
            blob-team-stores.txt
            blob-team-stores-status.txt
            blob-store.txt
            blob-store-status.txt
            phoenix-preview-deploy.log
            phoenix-preview-url.txt
            phoenix-provider-proof.json
            provider-classification.json
            health.json
            inventory.json
          if-no-files-found: warn
          retention-days: 7
