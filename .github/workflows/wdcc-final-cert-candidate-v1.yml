name: WDCC Final Cert Candidate V1

on:
  push:
    branches: [main]
    paths: ['.github/workflows/wdcc-final-cert-candidate-v1.yml']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wdcc-final-cert-candidate-v1
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM: cpxagency
      ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      PHOENIX_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
      STOREFRONT_ID: prj_We7xkAkB5Qy31Pt17USSkQFE0u7h
      FINAL_SHA: 4d229b6c04c641edc4798285a2fca7ad9cc97274
      AUTHORITY: https://wdcc-cpx-launch-qhcvflfih-cpxagency.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FINAL_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and build source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          npm ci
          npm install --global vercel@59.3.0 >/dev/null
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          npm run build

      - name: Prove immutable V53 authority before test mutation
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/authority-health.json -w '%{http_code}' "$AUTHORITY/api/health?final_cert=$GITHUB_RUN_ID")"
          test "$code" = 200
          jq -e '.ok==true and .degraded==false and .service=="wdcc-canonical-authority"' /tmp/authority-health.json >/dev/null

      - name: Create exact-run dealer identity with backup
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$PHOENIX_ID" > .vercel/project.json
          export RUN_TAG="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > .wdcc-final-identity.mjs <<'NODE'
          import crypto from 'node:crypto';import fs from 'node:fs';import {get,head,put,BlobPreconditionFailedError} from '@vercel/blob';
          const path='private/state/platform-v3.json',run=process.env.RUN_TAG;
          async function stable(){for(let i=0;i<5;i++){const a=await head(path),r=await get(path,{access:'private',useCache:false});if(!r?.stream)throw Error('STATE_READ_FAILED');const c=[];for await(const x of r.stream)c.push(x);const raw=Buffer.concat(c),b=await head(path);if(a.etag===b.etag)return{raw,etag:b.etag,s:JSON.parse(raw.toString())}}throw Error('STATE_TOO_HOT')}
          for(let n=1;n<=4;n++){const before=await stable(),s=before.s,now=new Date().toISOString(),password=`WdccFinal-${crypto.randomBytes(18).toString('base64url')}!`,salt=crypto.randomBytes(24),digest=crypto.scryptSync(password,salt,64),passwordHash=`scrypt$${salt.toString('base64url')}$${digest.toString('base64url')}`,id=`final-dealer-${crypto.randomUUID()}`,email=`final-dealer-${run}@invalid.example`,stock=`R36TEST-FINAL-${run}`,backup=`private/state/backups/platform-v3-pre-final-cert-${run}-r${Number(s.revision||0)}-${crypto.randomUUID()}.json`;await put(backup,before.raw,{access:'private',addRandomSuffix:false,allowOverwrite:false,contentType:'application/json'});s.users=Array.isArray(s.users)?s.users:[];s.users.push({id,email,username:email,displayName:`WDCC Final Cert ${run}`,role:'dealer_agent',tenantId:'wdcc',status:'active',disabled:false,passwordHash});s.revision=Number(s.revision||0)+1;s.updatedAt=now;try{await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:before.etag});fs.writeFileSync('/tmp/final.env',`RUN_TAG=${run}\nQA_PASSWORD=${password}\nDEALER_ID=${id}\nDEALER_EMAIL=${email}\nSTOCK=${stock}\nBACKUP=${backup}\n`);console.log(JSON.stringify({ok:true,id,stock,backup}));process.exit(0)}catch(e){if(e instanceof BlobPreconditionFailedError&&n<4)continue;throw e}}
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- node .wdcc-final-identity.mjs
          set -a; . /tmp/final.env; set +a
          printf '::add-mask::%s\n' "$QA_PASSWORD"

      - name: Deploy exact storefront candidate without aliases
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel .next
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$STOREFRONT_ID" > .vercel/project.json
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" >/dev/null
          vercel build --prod --token="$VERCEL_TOKEN" --scope="$TEAM" >/dev/null
          vercel deploy --prebuilt --prod --skip-domain --archive=tgz --yes --token="$VERCEL_TOKEN" --scope="$TEAM" 2>&1 | tee /tmp/final-deploy.log
          url="$(grep -Eo 'https://wdcc-v32-storefront-[a-z0-9]+-cpxagency\.vercel\.app' /tmp/final-deploy.log | tail -1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s' "$url" > /tmp/final-candidate-url

      - name: Gate candidate health and public inventory
        id: public
        shell: bash
        env:
          CANDIDATE: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          healthy=false
          for i in $(seq 1 25); do
            code="$(curl -sS -o /tmp/candidate-health.json -w '%{http_code}' "$CANDIDATE/api/health?attempt=$i" || true)"
            if [ "$code" = 200 ] && jq -e '.ok==true and .backend=="healthy"' /tmp/candidate-health.json >/dev/null 2>&1; then healthy=true; break; fi
            sleep 2
          done
          test "$healthy" = true
          curl -fsS "$CANDIDATE/api/inventory?final_public=$GITHUB_RUN_ID" -o /tmp/candidate-inventory.json
          jq -e '.ok==true and (.items|type=="array") and all(.items[]; ((.stock//"")|ascii_upcase|startswith("R36TEST-")|not) and ((.stock//"")|ascii_upcase|startswith("QA-")|not))' /tmp/candidate-inventory.json >/dev/null

      - name: Prove login leads photo publish and QA isolation
        id: e2e
        shell: bash
        env:
          CANDIDATE: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          set -a; . /tmp/final.env; set +a
          printf '::add-mask::%s\n' "$QA_PASSWORD"
          node <<'NODE'
          const fs=require('fs');const{chromium}=require('playwright');
          const base=process.env.CANDIDATE,run=process.env.RUN_TAG,stock=process.env.STOCK;
          const result={ok:false,base,run,stock,trace:[],stages:{}};
          const short=u=>{try{const x=new URL(u);return x.pathname+x.search}catch{return u}};
          async function txt(r){try{return (await r.text()).slice(0,2500)}catch{return ''}}
          (async()=>{const b=await chromium.launch({headless:true});try{const c=await b.newContext({viewport:{width:390,height:844}}),p=await c.newPage();p.on('response',r=>{if(/\/api\/(?:auth|leads|inventory|upload)/.test(r.url()))result.trace.push({method:r.request().method(),url:short(r.url()),status:r.status()})});
          await p.goto(`${base}/dealer/login`,{waitUntil:'domcontentloaded',timeout:30000});const u=p.locator('input[autocomplete="username"]').first(),pw=p.locator('input[autocomplete="current-password"]').first();await u.waitFor({state:'visible',timeout:20000});await u.fill(process.env.DEALER_EMAIL);await pw.fill(process.env.QA_PASSWORD);await p.getByRole('button',{name:'SIGN IN'}).click();await p.waitForURL(/\/dealer(?:$|\?)/,{timeout:30000});result.stages.login=true;
          const leadIds=[];for(const [kind,source] of [['schedule','schedule-test-drive'],['approval','get-approved'],['contact','call-sean']]){const r=await c.request.post(`${base}/api/leads`,{headers:{'content-type':'application/json','Idempotency-Key':`wdcc-qa-final-${kind}-${run}`},data:{qa:true,kind,source,name:`WDCC QA FINAL ${kind} ${run}`,phone:'813-555-0199',email:`qa-final-${kind}-${run}@invalid.example`,vehicleInterest:'Final certification vehicle',message:'Automated WDCC contract verification',consent:true}});const body=await txt(r);if(!r.ok())throw Error(`LEAD_${kind}_${r.status()}_${body}`);const j=JSON.parse(body);if(!j.ok||!j.persisted||!j.item?.id)throw Error(`LEAD_${kind}_CONTRACT_${body}`);leadIds.push(j.item.id)}result.leadIds=leadIds;
          const feed=await c.request.get(`${base}/api/leads`);const ft=await txt(feed);if(!feed.ok())throw Error(`LEAD_FEED_${feed.status()}_${ft}`);const fj=JSON.parse(ft);for(const id of leadIds)if(!(fj.items||[]).some(x=>x.id===id))throw Error(`LEAD_NOT_IN_FEED_${id}`);result.stages.leads=true;
          await p.goto(`${base}/dealer/inventory/new`,{waitUntil:'domcontentloaded',timeout:30000});async function fill(n,v){const x=p.locator(`input[name="${n}"],textarea[name="${n}"]`).first();await x.waitFor({state:'visible',timeout:20000});await x.fill(v,{force:true})}await fill('year','2019');await fill('make','Toyota');await fill('model','Corolla');await fill('trim',`Final Cert ${run}`);await fill('price','12345');await fill('downPayment','1500');await fill('mileage','54321');await fill('stock',stock);const d=p.locator('textarea').first();if(await d.count())await d.fill(`QA-isolated final certification ${run}`);fs.writeFileSync('/tmp/final.png',Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9WlV1GQAAAAASUVORK5CYII=','base64'));const input=p.locator('input[type=file][multiple]').first();await input.setInputFiles('/tmp/final.png');const draftP=p.waitForResponse(r=>short(r.url()).split('?')[0]==='/api/inventory'&&r.request().method()==='POST',{timeout:20000});const uploadP=p.waitForResponse(r=>short(r.url()).split('?')[0]==='/api/upload'&&r.request().method()==='POST',{timeout:40000}).catch(()=>null);const pub=p.locator('button[type="submit"][name="intent"][value="published"]:visible').first();await pub.click();const draft=await draftP,dt=await txt(draft);if(!draft.ok())throw Error(`DRAFT_${draft.status()}_${dt}`);const dj=JSON.parse(dt),vehicleId=dj.item?.id;if(!vehicleId)throw Error('DRAFT_ID_MISSING');result.vehicleId=vehicleId;const up=await uploadP;if(!up)throw Error('UPLOAD_REQUEST_NOT_SEEN');const ut=await txt(up);result.upload={status:up.status(),body:ut};if(!up.ok())throw Error(`UPLOAD_${up.status()}_${ut}`);const nav=await p.waitForURL(/\/dealer\/inventory\?saved=published(?:&|$)/,{timeout:50000}).then(()=>true).catch(()=>false);if(!nav)throw Error(`PUBLISH_NAV_TIMEOUT_${await p.locator('.statusMessage').first().textContent().catch(()=> '')}`);
          const inv=await c.request.get(`${base}/api/inventory`),it=await txt(inv);if(!inv.ok())throw Error(`DEALER_INV_${inv.status()}_${it}`);const ij=JSON.parse(it),item=(ij.items||[]).find(x=>x.id===vehicleId||x.stock===stock);if(!item||String(item.status).toLowerCase()!=='published'||!(item.photoPathnames||[]).length)throw Error(`PUBLISHED_READBACK_${JSON.stringify(item||null)}`);result.vehicle={id:item.id,photoPathnames:item.photoPathnames,stock:item.stock,status:item.status};const pi=await c.request.get(`${base}/api/inventory?public_check=${Date.now()}`),pt=await txt(pi);if(!pi.ok())throw Error(`PUBLIC_INV_${pi.status()}_${pt}`);const pj=JSON.parse(pt);if((pj.items||[]).some(x=>x.id===item.id||x.stock===stock))throw Error('QA_VEHICLE_PUBLIC');result.qaHidden=true;await p.goto(`${base}/dealer/inventory`,{waitUntil:'domcontentloaded',timeout:30000});await p.screenshot({path:'/tmp/final-dealer.png',fullPage:true});result.stages.listing=true;result.ok=true;fs.writeFileSync('/tmp/final-result.json',JSON.stringify(result,null,2));}catch(e){result.error=String(e?.message||e);fs.writeFileSync('/tmp/final-result.json',JSON.stringify(result,null,2));console.error(e);process.exitCode=1}finally{await b.close()}})();
          NODE

      - name: Exact-run cleanup
        if: always() && steps.identity.outcome == 'success'
        shell: bash
        run: |
          set +e
          set -a; . /tmp/final.env; set +a
          export VEHICLE_ID="$(jq -r '.vehicleId // ""' /tmp/final-result.json 2>/dev/null)"
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$PHOENIX_ID" > .vercel/project.json
          cat > .wdcc-final-clean.mjs <<'NODE'
          import crypto from 'node:crypto';import {del,get,head,put,BlobPreconditionFailedError} from '@vercel/blob';const path='private/state/platform-v3.json',run=process.env.RUN_TAG,user=process.env.DEALER_ID,stock=process.env.STOCK,vehicleId=process.env.VEHICLE_ID;async function stable(){for(let i=0;i<5;i++){const a=await head(path),r=await get(path,{access:'private',useCache:false});if(!r?.stream)throw Error('READ');const c=[];for await(const x of r.stream)c.push(x);const raw=Buffer.concat(c),b=await head(path);if(a.etag===b.etag)return{raw,etag:b.etag,s:JSON.parse(raw.toString())}}throw Error('HOT')}for(let n=1;n<=4;n++){const before=await stable(),s=before.s,leadIds=(s.leads||[]).filter(x=>String(x.name||'').includes(run)||String(x.email||'').includes(run)).map(x=>x.id),vehicles=(s.vehicles||[]),v=vehicles.find(x=>x.id===vehicleId||String(x.stock||'')===stock),media=[...(v?.photoPathnames||[])],backup=`private/state/backups/platform-v3-pre-final-clean-${run}-r${Number(s.revision||0)}-${crypto.randomUUID()}.json`;await put(backup,before.raw,{access:'private',addRandomSuffix:false,allowOverwrite:false,contentType:'application/json'});s.users=(s.users||[]).filter(x=>x.id!==user);s.leads=(s.leads||[]).filter(x=>!leadIds.includes(x.id));s.vehicles=vehicles.filter(x=>x.id!==v?.id);s.revision=Number(s.revision||0)+1;s.updatedAt=new Date().toISOString();try{await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:before.etag});if(media.length)await del(media);console.log(JSON.stringify({ok:true,revision:s.revision,userRemoved:1,leadsRemoved:leadIds.length,vehicleRemoved:v?.id||null,mediaRemoved:media.length,backup}));process.exit(0)}catch(e){if(e instanceof BlobPreconditionFailedError&&n<4)continue;throw e}}
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- node .wdcc-final-clean.mjs | tee /tmp/final-cleanup.json

      - name: Report final-cert candidate
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          CANDIDATE: ${{ steps.deploy.outputs.url }}
        run: |
          result='not captured'; [ -f /tmp/final-result.json ] && result="$(cat /tmp/final-result.json)"
          health='not captured'; [ -f /tmp/candidate-health.json ] && health="$(cat /tmp/candidate-health.json)"
          cleanup='not captured'; [ -f /tmp/final-cleanup.json ] && cleanup="$(tail -1 /tmp/final-cleanup.json)"
          body=$(cat <<EOF
          Exact SHA: \`$FINAL_SHA\`
          Status: **$STATUS**
          Candidate: \`${CANDIDATE:-not-created}\`
          Authority: \`$AUTHORITY\`

          No apex/www/dealer alias, DNS record, or Cloudflare route is moved by this workflow.

          Health:
          \`\`\`json
          $health
          \`\`\`

          E2E:
          \`\`\`json
          $result
          \`\`\`

          Cleanup:
          \`\`\`json
          $cleanup
          \`\`\`
          EOF
          )
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC final-cert candidate ${GITHUB_RUN_ID}" --body "$body" || true

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wdcc-final-cert-${{ github.run_id }}
          path: |
            /tmp/final-result.json
            /tmp/final-dealer.png
            /tmp/candidate-health.json
          if-no-files-found: ignore
          retention-days: 5
