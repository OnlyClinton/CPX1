name: WDCC 522 All-Preview Closeout

on:
  push:
    branches: [proof/wdcc-522-immutable-parser-20260829]
    paths:
      - '.github/workflows/wdcc-522-all-preview-closeout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FROZEN_SHA: 883f211f345f69967ffad84c3dec3ff36e4f0aee
      V54_PREVIEW_BACKEND: https://wdcc-cpx-launch-55hastzmt-cpxagency.vercel.app
      WDCC_GATE_SCORER_SHA256: 77153296fbdadf7e17dffd0c44e44783504e0f35b5ca8b23c6d061b3789af25a
      WDCC_GATE_FINGERPRINTS_SHA256: 87dcb891d40d7f396eb583a331d999bb8c92dab93bb2b2ea13c32b62e27a7065
      WDCC_GATE_MEDIA_EVIDENCE_SHA256: 246e7ad3b790d3cacec9ed0008bf5d665d758aeec4155d9cd5057282f008de68
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prove frozen lineage and acceptance contract
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FROZEN_SHA" HEAD
          test "$(git rev-parse "$FROZEN_SHA")" = "$FROZEN_SHA"
          test "$(git show "$FROZEN_SHA":.github/support/wdcc-mockup-95-score.mjs | sha256sum | awk '{print $1}')" = "$WDCC_GATE_SCORER_SHA256"
          test "$(git show "$FROZEN_SHA":.github/support/wdcc-mockup-fingerprints.mjs | sha256sum | awk '{print $1}')" = "$WDCC_GATE_FINGERPRINTS_SHA256"
          test "$(git show "$FROZEN_SHA":.github/support/wdcc-dealer-media-evidence.mjs | sha256sum | awk '{print $1}')" = "$WDCC_GATE_MEDIA_EVIDENCE_SHA256"
          echo "FROZEN_SHA=$FROZEN_SHA"
          echo 'PRODUCTION_CHANGED=NO'

      - name: Extract and build exact frozen candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wdcc-frozen && mkdir -p /tmp/wdcc-frozen
          git archive "$FROZEN_SHA" | tar -x -C /tmp/wdcc-frozen
          cd /tmp/wdcc-frozen
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0 playwright@1.55.0 yaml
          node --test .github/support/wdcc-dealer-media-evidence.test.mjs
          node .github/support/wdcc-mockup-95-score.mjs --self-test
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets
          test -s .next/BUILD_ID
          npx playwright install --with-deps chromium >/dev/null

      - name: Create isolated no-route config bound to frozen V54 preview backend
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/wdcc-frozen
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          c.name=`wdcc-v2-${process.env.FROZEN_SHA.slice(0,12)}-proof`;
          c.workers_dev=true;
          c.preview_urls=true;
          c.vars={...(c.vars||{}),WDCC_MOCKUP_PREVIEW:'1',WDCC_DEALER_BACKEND_URL:process.env.V54_PREVIEW_BACKEND};
          delete c.route; delete c.routes;
          fs.writeFileSync('wrangler.closeout.jsonc',JSON.stringify(c,null,2)+'\n');
          NODE
          ! grep -qi 'wedontcarecars.com' wrangler.closeout.jsonc
          grep -Fq "$V54_PREVIEW_BACKEND" wrangler.closeout.jsonc
          echo 'CUSTOM_ROUTES=NONE'
          echo 'PRODUCTION_TRAFFIC=UNCHANGED'

      - name: Upload immutable proof version only
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          cd /tmp/wdcc-frozen
          alias="proof883fv54"
          export WRANGLER_OUTPUT_FILE_PATH=/tmp/wrangler-closeout.ndjson
          : > "$WRANGLER_OUTPUT_FILE_PATH"
          npx wrangler versions upload --config wrangler.closeout.jsonc --preview-alias "$alias" 2>&1 | tee /tmp/wrangler-closeout.log
          test -s "$WRANGLER_OUTPUT_FILE_PATH"
          record="$(jq -cs '[.[] | select(.type=="version-upload" and .version==1)][0]' "$WRANGLER_OUTPUT_FILE_PATH")"
          version_id="$(jq -r '.version_id // empty' <<<"$record")"
          worker_name="$(jq -r '.worker_name // empty' <<<"$record")"
          test -n "$version_id"; test -n "$worker_name"
          test "$worker_name" = "wdcc-v2-${FROZEN_SHA:0:12}-proof"
          sub_json="$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          subdomain="$(jq -r '.result.subdomain // empty' <<<"$sub_json")"
          test -n "$subdomain"
          url="https://${alias}-${worker_name}.${subdomain}.workers.dev"
          code=000
          for i in $(seq 1 30); do
            code="$(curl --http1.1 -sS -L -o /tmp/preview-probe -w '%{http_code}' "$url/?preview-probe=$i" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          [ "$code" = 200 ]
          {
            echo "url=$url"
            echo "version_id=$version_id"
            echo "version_prefix=$alias"
            echo "worker_name=$worker_name"
          } >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > /tmp/mockup-v2-preview-url.txt
          printf 'upload_mode=wrangler-versions-upload-not-deployed\nurl=%s\nworker_name=%s\npreview_alias=%s\ncloudflare_version_id=%s\nfrozen_sha=%s\nbackend=%s\n' "$url" "$worker_name" "$alias" "$version_id" "$FROZEN_SHA" "$V54_PREVIEW_BACKEND" > /tmp/mockup-v2-preview-version.txt
          echo 'PRODUCTION_DEPLOYED=NO'
          echo 'ROUTES_CHANGED=NO'

      - name: Extract frozen gates with hydration-only render correction
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/wdcc-frozen
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import YAML from 'yaml';
          const doc=YAML.parse(fs.readFileSync('.github/workflows/wdcc-mockup-convergence-v2-proof.yml','utf8'));
          const steps=doc.jobs.proof.steps;
          const remote=steps.find(s=>s.name==='Prove remote build identity')?.run;
          const render=steps.find(s=>s.name==='Render owner-board proof and fail on regressions')?.run;
          const score=steps.find(s=>s.name==='Enforce objective 95/100 mockup score')?.run;
          if(!remote||!render||!score) throw new Error('frozen acceptance steps missing');
          const needle="await page.locator('.stepper > button').nth(2).click();";
          if(!render.includes(needle)) throw new Error('expected frozen wizard click not found');
          const corrected=render.replace(needle,"await page.waitForLoadState('networkidle',{timeout:15000}).catch(()=>{});\n            "+needle);
          fs.writeFileSync('/tmp/remote.sh',remote+'\n',{mode:0o700});
          fs.writeFileSync('/tmp/render-corrected.sh',corrected+'\n',{mode:0o700});
          fs.writeFileSync('/tmp/score.sh',score+'\n',{mode:0o700});
          console.log('REMOTE_IDENTITY_GATE_DELTA=NONE');
          console.log('VISUAL_HARNESS_DELTA=ONE_NETWORKIDLE_WAIT_BEFORE_PHOTOS_CLICK');
          console.log('SCORER_DELTA=NONE');
          NODE

      - name: Prove frozen remote build identity end-to-end
        shell: bash
        env:
          REMOTE_URL: ${{ steps.upload.outputs.url }}
          CLOUDFLARE_VERSION_ID: ${{ steps.upload.outputs.version_id }}
          CLOUDFLARE_VERSION_PREFIX: ${{ steps.upload.outputs.version_prefix }}
          CLOUDFLARE_WORKER_NAME: ${{ steps.upload.outputs.worker_name }}
        run: |
          set -euo pipefail
          cd /tmp/wdcc-frozen
          GITHUB_SHA="$FROZEN_SHA" bash /tmp/remote.sh

      - name: Render owner-board proof
        shell: bash
        env:
          REMOTE_URL: ${{ steps.upload.outputs.url }}
        run: |
          set -euo pipefail
          cd /tmp/wdcc-frozen
          REMOTE_URL="$REMOTE_URL" GITHUB_SHA="$FROZEN_SHA" bash /tmp/render-corrected.sh

      - name: Enforce unchanged objective 95/100 scorer
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/wdcc-frozen
          GITHUB_SHA="$FROZEN_SHA" bash /tmp/score.sh

      - name: Record closeout boundary
        if: always()
        shell: bash
        run: |
          {
            echo "FROZEN_SHA=$FROZEN_SHA"
            echo "V54_PREVIEW_BACKEND=$V54_PREVIEW_BACKEND"
            echo 'PRODUCTION_DEPLOYED=NO'
            echo 'PRODUCTION_ALIAS_CHANGED=NO'
            echo 'ROUTES_CHANGED=NO'
            echo 'PRODUCTION_NEON_CHANGED=NO'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-522-all-preview-closeout-${{ github.sha }}
          path: |
            /tmp/wdcc-frozen/mockup-v2-proof
            /tmp/wdcc-frozen/mockup-v2-integrity.txt
            /tmp/mockup-v2-preview-url.txt
            /tmp/mockup-v2-preview-version.txt
          if-no-files-found: warn
