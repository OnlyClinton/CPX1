name: WDCC Blob Recovery Read-Only V2

on:
  push:
    branches: [proof/wdcc-blob-recovery-20260827]
    paths:
      - '.github/workflows/wdcc-blob-recovery-readonly-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      PROJECT_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --global vercel@59.3.0 >/dev/null
      - name: Link frozen Phoenix project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$PROJECT_ID" > .vercel/project.json
      - name: Compare private recovery snapshots without writes
        shell: bash
        run: |
          set -euo pipefail
          cat > .wdcc-recovery-v2.mjs <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import {list,get} from '@vercel/blob';
          const oidc=String(process.env.VERCEL_OIDC_TOKEN||'').trim();
          if(!oidc)throw new Error('VERCEL_OIDC_TOKEN_MISSING');
          const primary={name:'wdcc-v10-20260819-194257',storeId:'store_cNUyQRVlXtyvZQ5N'};
          const canonicalStores=[
            {name:'wdcc-clean-20260819-173749',storeId:'store_vVJ5kU6x76yZVkGs'},
            {name:'wdcc-rescue-20260819-172412',storeId:'store_KopvAQeMcatdS5DS'},
            {name:'wdcc-private-20260801005157',storeId:'store_LdMSV1550BRgc0SP'}
          ];
          const rev=p=>Number((String(p).match(/(?:^|-)r(\d+)(?:-|\.|$)/i)||[])[1]||0);
          async function all(storeId,prefix){let cursor,out=[];for(let i=0;i<20;i++){const r=await list({prefix,limit:200,cursor,oidcToken:oidc,storeId});out.push(...(r.blobs||[]));if(!r.hasMore||!r.cursor)break;cursor=r.cursor}return out}
          async function read(pathname,storeId){
            const r=await get(pathname,{access:'private',oidcToken:oidc,storeId});
            if(!r||r.statusCode!==200)throw new Error(`GET_${r?.statusCode||0}_${pathname}`);
            const bytes=Buffer.from(await new Response(r.stream).arrayBuffer());
            const doc=JSON.parse(bytes.toString('utf8'));
            return {bytes,doc,sha256:crypto.createHash('sha256').update(bytes).digest('hex'),etag:r.blob?.etag||null};
          }
          function meta(doc){const roots=[doc,doc?._meta,doc?.meta,doc?.metadata].filter(x=>x&&typeof x==='object'&&!Array.isArray(x)),o={};for(const root of roots)for(const k of ['revision','ledgerRevision','version','schemaVersion','updatedAt','createdAt','timestamp','release']){const v=root[k];if((typeof v==='string'||typeof v==='number')&&o[k]===undefined)o[k]=v}return o}
          function counts(doc){const o={};for(const k of ['users','inventory','vehicles','leads','events','media','sessions','audit','logs','customers','appointments','applications','messages']){const v=doc?.[k];if(Array.isArray(v))o[k]=v.length;else if(v&&typeof v==='object')o[k]=Object.keys(v).length}return o}
          async function summary(store,blob){const x=await read(blob.pathname,store.storeId);return{store:store.name,storeId:store.storeId,pathname:blob.pathname,uploadedAt:blob.uploadedAt||null,size:blob.size??x.bytes.length,pathRevision:rev(blob.pathname),sha256:x.sha256,etag:x.etag,meta:meta(x.doc),counts:counts(x.doc),validJson:true}}
          const result={mode:'READ_ONLY',canonicalCopies:[],primaryBackups:[],errors:[]};
          for(const store of canonicalStores){try{const xs=await all(store.storeId,'private/state/platform-v3.json'),b=xs.find(x=>x.pathname==='private/state/platform-v3.json');if(!b)throw Error('CANONICAL_NOT_FOUND');result.canonicalCopies.push(await summary(store,b))}catch(e){result.errors.push({store:store.name,error:String(e?.message||e)})}}
          try{
            const backups=await all(primary.storeId,'private/state/backups/');
            backups.sort((a,b)=>rev(b.pathname)-rev(a.pathname)||String(b.uploadedAt||'').localeCompare(String(a.uploadedAt||'')));
            result.primaryBackupCount=backups.length;result.primaryMaxPathRevision=Math.max(0,...backups.map(x=>rev(x.pathname)));
            for(const b of backups.slice(0,10)){try{result.primaryBackups.push(await summary(primary,b))}catch(e){result.errors.push({store:primary.name,pathname:b.pathname,error:String(e?.message||e)})}}
          }catch(e){result.errors.push({store:primary.name,error:String(e?.message||e)})}
          const candidates=[...result.primaryBackups,...result.canonicalCopies];
          const score=x=>Number(x.meta?.revision??x.meta?.ledgerRevision??x.pathRevision??0);
          candidates.sort((a,b)=>score(b)-score(a)||String(b.uploadedAt||'').localeCompare(String(a.uploadedAt||'')));
          result.recommended=candidates[0]||null;
          fs.writeFileSync('wdcc-blob-recovery-readonly-v2.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result,null,2));
          if(!result.recommended)process.exit(2);
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope=cpxagency -- node .wdcc-recovery-v2.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-blob-recovery-readonly-v2-${{ github.sha }}
          path: wdcc-blob-recovery-readonly-v2.json
          if-no-files-found: warn
          retention-days: 3

# READ-ONLY: list/get only. No put/copy/del/store/env/deploy operations.
