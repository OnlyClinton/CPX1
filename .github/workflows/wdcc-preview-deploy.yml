name: WDCC Preview Deploy
on:
  push:
    branches: [wdcc-crm-inventory-8ar]
  workflow_dispatch:
jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      VERCEL_PROJECT_ID: prj_We7xkAkB5Qy31Pt17USSkQFE0u7h
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: test -n "$VERCEL_TOKEN"
      - name: Pull preview environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Build preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel@latest build --token="$VERCEL_TOKEN"
      - name: Deploy preview only
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN" | tee preview-url.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wdcc-preview-url
          path: preview-url.txt
