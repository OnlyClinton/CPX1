name: Probe WDCC Frontdoor Route Metadata v1m

on:
  push:
    branches: [release/dealer-cloudflare-v1]
    paths:
      - '.github/workflows/probe-frontdoor-route-metadata-v1m.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  LIVE_WORKER: wdcc-dealer-frontdoor
  DEALER_DOMAIN: dealer.wedontcarecars.com

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Probe account-level Worker routes endpoint
        id: route
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$LIVE_WORKER/routes"
          code="$(curl -sS -o /tmp/routes.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API")"
          echo "route_http=$code"
          cat /tmp/routes.json | jq . 2>/dev/null || cat /tmp/routes.json
          echo "http=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = 200 ]; then
            ZONE_ID="$(jq -r '[.. | objects | .zone_id? // .zoneId? // empty] | map(select(type=="string" and length>0)) | first // empty' /tmp/routes.json)"
            ROUTE_ID="$(jq -r --arg p "$DEALER_DOMAIN/*" '[.. | objects | select(.pattern?==$p) | .id? // empty] | first // empty' /tmp/routes.json)"
            echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"
            echo "route_id=$ROUTE_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Try zone DNS query only if metadata exposed zone id
        id: dns
        if: steps.route.outputs.zone_id != ''
        env:
          ZONE_ID: ${{ steps.route.outputs.zone_id }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/dns.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=$DEALER_DOMAIN&per_page=100")"
          echo "dns_http=$code"
          cat /tmp/dns.json | jq '{success,errors,result:[.result[]? | {id,type,name,content,proxied,ttl}]}' 2>/dev/null || cat /tmp/dns.json
          echo "http=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = 200 ]; then
            test "$(jq '.result|length' /tmp/dns.json)" -eq 1
            echo "record_id=$(jq -r '.result[0].id' /tmp/dns.json)" >> "$GITHUB_OUTPUT"
            echo "content=$(jq -r '.result[0].content' /tmp/dns.json)" >> "$GITHUB_OUTPUT"
            echo "proxied=$(jq -r '.result[0].proxied // false' /tmp/dns.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ROUTE_HTTP: ${{ steps.route.outputs.http }}
          ZONE_ID: ${{ steps.route.outputs.zone_id }}
          ROUTE_ID: ${{ steps.route.outputs.route_id }}
          DNS_HTTP: ${{ steps.dns.outputs.http }}
          RECORD_ID: ${{ steps.dns.outputs.record_id }}
          CONTENT: ${{ steps.dns.outputs.content }}
          PROXIED: ${{ steps.dns.outputs.proxied }}
        shell: bash
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC frontdoor route metadata v1m ${GITHUB_RUN_ID}" --body "Account route metadata HTTP: \`$ROUTE_HTTP\`. Zone id: \`$ZONE_ID\`. Route id: \`$ROUTE_ID\`. Direct dealer DNS HTTP: \`$DNS_HTTP\`. Record: \`$RECORD_ID\` content \`$CONTENT\` proxied \`$PROXIED\`. Read-only probe; no Cloudflare mutation." || true
