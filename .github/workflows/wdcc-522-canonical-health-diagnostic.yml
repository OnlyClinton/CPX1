name: WDCC 522 Canonical Health Diagnostic

on:
  push:
    branches: [proof/wdcc-522-immutable-parser-20260829]
    paths:
      - '.github/workflows/wdcc-522-canonical-health-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect canonical Vercel health only
        shell: bash
        run: |
          set -euo pipefail
          url='https://wdcc-cpx-launch-cpxagency.vercel.app/api/health?proof=522-canonical-direct'
          code="$(curl --http1.1 -sS -L -D /tmp/headers -o /tmp/body -w '%{http_code}' "$url" || true)"
          tr -d '\r' </tmp/headers >/tmp/headers.norm || true
          echo "CANONICAL_HEALTH_HTTP=$code"
          grep -Ei '^(x-wdcc-data-authority|x-wdcc-backend|content-type|server):' /tmp/headers.norm || true
          jq -c '{ok,degraded,state,authority,provider,release,database:{configured:.database.configured,database:.database.database,host:.database.host},session,integrations:{auth:.integrations.auth,email:.integrations.email,media:.integrations.media,outboxRetry:.integrations.outboxRetry},reasons,error}' /tmp/body 2>/dev/null || head -c 1000 /tmp/body
          echo
          echo 'PRODUCTION_CHANGED=NO'
