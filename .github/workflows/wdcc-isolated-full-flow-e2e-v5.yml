name: WDCC Isolated Full Flow E2E V5

on:
  push:
    branches:
      - qa/wdcc-full-flow-e2e-20260827-1637833
    paths:
      - '.github/workflows/wdcc-isolated-full-flow-e2e-v5.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-isolated-full-flow-e2e-v5-1637833
  cancel-in-progress: true

jobs:
  full-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: 1637833a1ec7b7a4942faad240d02c1706a8bf04
      WDCC_DEALER_E2E_PASSWORD: ${{ secrets.WDCC_DEALER_E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove exact PR application source
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$SOURCE_SHA^{commit}"
          test "$(git merge-base HEAD "$SOURCE_SHA")" = "$SOURCE_SHA"
          test -z "$(git diff --name-only "$SOURCE_SHA..HEAD" -- app lib public package.json package-lock.json next.config.ts tsconfig.json)"
          echo "Application code is byte-identical to PR #494 exact head $SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install and build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          npm run build
      - name: Run full isolated transaction
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${WDCC_DEALER_E2E_PASSWORD:-}" ]; then printf '::add-mask::%s\n' "$WDCC_DEALER_E2E_PASSWORD"; fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/wdcc-isolated-full-flow-e2e-v2.mjs')
          s=p.read_text()
          marker="    const page=await context.newPage();const name=`Flow ${kind} ${tag}`;\n"
          approval=r'''    if(kind==='approval'){
                await page.goto(`${BASE}${path}?source=${encodeURIComponent(source)}`,{waitUntil:'domcontentloaded',timeout:30000});
                const info=page.locator('section[data-stage="info"]');await info.waitFor({state:'visible',timeout:30000});
                const infoInputs=info.locator('input');
                await infoInputs.nth(0).fill(name);await infoInputs.nth(1).fill('813-555-0147');await infoInputs.nth(2).fill(`approval-${tag}@wdcc-e2e.test`);await infoInputs.nth(3).fill('5200');
                await page.getByRole('button',{name:'Continue'}).click();
                const vehicleStage=page.locator('section[data-stage="vehicle"]');await vehicleStage.waitFor({state:'visible',timeout:10000});
                const vehicleInputs=vehicleStage.locator('input');await vehicleInputs.nth(0).fill('1500');await vehicleInputs.nth(1).fill('2021 Toyota Camry');await vehicleStage.locator('select').selectOption({label:'Google'});
                await page.getByRole('button',{name:'Continue'}).click();
                const review=page.locator('section[data-stage="review"]');await review.waitFor({state:'visible',timeout:10000});await review.locator('input[type="checkbox"]').check();
                const responsePromise=page.waitForResponse(r=>r.url().endsWith('/api/leads')&&r.request().method()==='POST',{timeout:30000});
                await page.getByRole('button',{name:'SEND PRE-APPROVAL REQUEST'}).click();
                const response=await responsePromise;const payload=await response.json();
                if(response.status()!==201||payload?.ok!==true||payload?.persisted!==true)fail('LEAD_approval_SUBMIT',{status:response.status(),payload});
                if(payload?.item?.kind!=='approval'||payload?.item?.source!==source)fail('LEAD_approval_ROUTE',payload?.item);
                if(payload?.sync?.upstream!=='synced')fail('LEAD_approval_UPSTREAM',payload?.sync);
                if(payload?.notifications?.webhook!=='sent')fail('LEAD_approval_WEBHOOK',payload?.notifications);
                await page.getByRole('status').waitFor({state:'visible',timeout:10000});await page.screenshot({path:`${SCREENS}/lead-approval.png`,fullPage:true});await page.close();
                return {id:payload.item.id,name,kind:'approval',source,upstream:payload.sync.upstream,webhook:payload.notifications.webhook};
              }
          '''
          if marker not in s: raise SystemExit('leadFlow marker not found')
          s=s.replace(marker,marker+approval,1)
          replacements={
            "page.getByLabel('Name')":"page.locator('input[name=\"name\"]')",
            "page.getByLabel('Phone')":"page.locator('input[name=\"phone\"]')",
            "page.getByLabel('Email')":"page.locator('input[name=\"email\"]')",
            "page.getByLabel('Vehicle of interest')":"page.locator('input[name=\"vehicleInterest\"]')",
            "page.getByLabel('Preferred date or time')":"page.locator('input[name=\"preferredTime\"]')",
            "page.getByLabel('Message')":"page.locator('textarea[name=\"message\"]')",
            "publicPage.getByText('2021 Toyota Camry',{exact:false}).first()":"publicPage.getByRole('link',{name:'View 2021 Toyota Camry'}).first()",
          }
          for old,new in replacements.items(): s=s.replace(old,new)
          p.write_text(s)
          PY
          node scripts/wdcc-isolated-full-flow-e2e-v2.mjs
      - name: Result summary
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/wdcc-full-flow-e2e-v2/result.json ]; then
            cat /tmp/wdcc-full-flow-e2e-v2/result.json
            { echo '## WDCC isolated full-flow E2E V5'; echo '```json'; jq '{ok,sourceSha,credentialSource,leads,routing,vehicle,dashboard,pages,productionWrites,error}' /tmp/wdcc-full-flow-e2e-v2/result.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wdcc-isolated-full-flow-v5-${{ github.run_id }}
          path: /tmp/wdcc-full-flow-e2e-v2
          if-no-files-found: warn
          retention-days: 7
