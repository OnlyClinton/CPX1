name: WDCC Cloudflare Staging Session Proof

on:
  push:
    branches:
      - emergency/wdcc-cloudflare-r2-20260827
    paths:
      - .github/workflows/wdcc-cloudflare-stage-session-proof.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_WORKER: wdcc-v53-1-staging
      APP_URL: https://wdcc-v53-1-staging.clico-global.workers.dev
      STATE_URL: https://wdcc-v53-staging.clico-global.workers.dev

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npm install --global wrangler@4.90.0 >/dev/null

      - name: Set isolated staging session secret
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/wrangler.secret.jsonc <<EOF
          {
            "name":"$APP_WORKER",
            "compatibility_date":"2026-08-27"
          }
          EOF
          SESSION_VALUE="$(openssl rand -hex 48)"
          printf '::add-mask::%s\n' "$SESSION_VALUE"
          printf '%s' "$SESSION_VALUE" | wrangler secret put SESSION_SECRET --config /tmp/wrangler.secret.jsonc >/tmp/secret-put.log 2>&1
          grep -Eqi 'success|created|uploaded|secret' /tmp/secret-put.log || cat /tmp/secret-put.log
          sleep 5

      - name: Prove Cloudflare app after session repair
        shell: bash
        run: |
          set -euo pipefail
          code="000"
          for i in $(seq 1 15); do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$APP_URL/api/health?session-proof=$GITHUB_RUN_ID-$i" || true)"
            if [ "$code" = "200" ]; then break; fi
            sleep 2
          done
          echo "HEALTH_HTTP=$code"
          cat /tmp/health.json || true
          test "$code" = "200"
          jq -e '.ok==true and .degraded==false and .backend=="local" and .storage=="cloudflare-do" and .state=="readable" and .provider=="cloudflare" and .session=="configured" and .revision>=1' /tmp/health.json >/dev/null

          inventory_code="$(curl -sS -o /tmp/inventory.json -w '%{http_code}' "$APP_URL/api/inventory?session-proof=$GITHUB_RUN_ID" || true)"
          echo "INVENTORY_HTTP=$inventory_code"
          cat /tmp/inventory.json || true
          test "$inventory_code" = "200"
          jq -e '.ok==true and (.items|type)=="array"' /tmp/inventory.json >/dev/null

          dealer_code="$(curl -sS -L -o /tmp/dealer.html -w '%{http_code}' "$APP_URL/dealer?session-proof=$GITHUB_RUN_ID" || true)"
          echo "DEALER_HTTP=$dealer_code"
          test "$dealer_code" = "200"
          grep -qi dealer /tmp/dealer.html

          state_code="$(curl -sS -o /tmp/state.json -w '%{http_code}' "$STATE_URL/health?session-proof=$GITHUB_RUN_ID" || true)"
          echo "STATE_HTTP=$state_code"
          cat /tmp/state.json || true
          test "$state_code" = "200"
          jq -e '.ok==true and .storage=="durable-object-sqlite" and .state=="readable" and .revision>=1' /tmp/state.json >/dev/null

      - name: Record green staging replacement
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 205 --repo "$GITHUB_REPOSITORY" --body "Cloudflare staging replacement is GREEN after isolated session-secret repair in run $GITHUB_RUN_ID. App=wdcc-v53-1-staging: health=200, provider=cloudflare, storage=cloudflare-do, state=readable, session=configured; inventory=200; dealer=200. State=wdcc-v53-staging: Durable Object health=200. No production route, DNS, Vercel alias, apex, or dealer traffic changed. State is still synthetic/non-production; live cutover remains blocked on the verified production ledger revision 654." || true

      - name: Record failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 205 --repo "$GITHUB_REPOSITORY" --body "Cloudflare staging session repair run $GITHUB_RUN_ID failed in isolated staging. No production route, DNS, Vercel alias, apex, or dealer traffic changed." || true
