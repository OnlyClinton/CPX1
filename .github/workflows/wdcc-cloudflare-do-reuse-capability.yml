name: WDCC Cloudflare DO Reuse Capability

on:
  push:
    branches: [ops/wdcc-blob-recovery-20260827]
    paths:
      - '.github/workflows/wdcc-cloudflare-do-reuse-capability.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Wrangler
        run: npm install --global wrangler@4.90.0 >/dev/null
      - name: Reuse stale no-route SHA proof Worker for Durable Object capability
        shell: bash
        run: |
          set -euo pipefail
          NAME='wdcc-proof-a9570307a3cabdbc67e9e32a9f2e48df1f6d65f9'
          cat > worker.mjs <<'JS'
          export class StateProbe {
            constructor(state){this.state=state}
            async fetch(req){
              const u=new URL(req.url);
              if(req.method==='POST'&&u.pathname==='/write'){
                const body=await req.json();await this.state.storage.put('probe',body);return Response.json({ok:true});
              }
              const v=await this.state.storage.get('probe');return Response.json({ok:true,value:v||null});
            }
          }
          export default {async fetch(req,env){const u=new URL(req.url);if(u.pathname==='/health')return Response.json({ok:true,storage:'durable-object-reuse-probe'});const id=env.STATE.idFromName('wdcc-recovery-probe');return env.STATE.get(id).fetch(req)}};
          JS
          cat > wrangler.jsonc <<EOF
          {
            "name":"$NAME",
            "main":"worker.mjs",
            "compatibility_date":"2026-08-25",
            "workers_dev":true,
            "preview_urls":true,
            "durable_objects":{"bindings":[{"name":"STATE","class_name":"StateProbe"}]},
            "migrations":[{"tag":"wdcc-do-recovery-v1","new_sqlite_classes":["StateProbe"]}]
          }
          EOF
          wrangler deploy --config wrangler.jsonc 2>&1 | tee deploy.log
          URL="https://${NAME}.clico-global.workers.dev"
          test "$(curl -fsS "$URL/health" | jq -r .storage)" = durable-object-reuse-probe
          MARKER="do-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl -fsS -X POST -H 'content-type: application/json' --data "{\"marker\":\"$MARKER\"}" "$URL/write" | jq -e '.ok==true' >/dev/null
          test "$(curl -fsS "$URL/read" | jq -r .value.marker)" = "$MARKER"
          printf '%s\n' "$URL" > do-reuse-probe-url.txt
          echo 'DURABLE_OBJECT_REUSE_CAPABILITY=PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-cloudflare-do-reuse-capability-${{ github.sha }}
          path: |
            deploy.log
            do-reuse-probe-url.txt
          retention-days: 3
