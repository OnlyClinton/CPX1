name: WDCC Safe Candidate Repair and QA Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-safe-candidate-repair-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: wdcc-safe-candidate-repair-cleanup
  cancel-in-progress: false

env:
  TEAM: cpxagency
  ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
  PHOENIX_PROJECT: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
  STOREFRONT_PROJECT: prj_We7xkAkB5Qy31Pt17USSkQFE0u7h
  DEALER_PROJECT: prj_fz5mN7Q5gImZ9UGpv1GDpHxPtLNB
  CANDIDATE_SHA: 188392c81696da5d0d61f5c6f0bec45f490a232d
  ROLLBACK_SHA: d6c886ec252441ae46f7a7eb166521b2f5f09492
  CANONICAL_ALIAS: https://wdcc-cpx-launch-cpxagency.vercel.app
  STORE_ID: store_cNUyQRVlXtyvZQ5N
  QA_STOCK_1: QA-LOAD-32819132897-1
  QA_STOCK_2: QA-LOAD-32819198581-1

jobs:
  repair-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@v4
        with:
          ref: 188392c81696da5d0d61f5c6f0bec45f490a232d
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact candidate dependencies and pinned Vercel CLI
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -n "$VERCEL_TOKEN"
          npm ci
          npm install --global vercel@59.3.0 >/dev/null

      - name: Prove live rollback target is untouched and healthy
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/live-before.json -w '%{http_code}' "$CANONICAL_ALIAS/api/health?safe_repair=$GITHUB_RUN_ID")"
          test "$code" = 200
          jq -e --arg sha "$ROLLBACK_SHA" '.ok==true and .degraded==false and .commit==$sha' /tmp/live-before.json >/dev/null
          echo 'LIVE_ROLLBACK_BASELINE=PASS'

      - name: Discover read-only canonical Blob and session authority
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/probe-authority.mjs <<'NODE'
          import {get} from '@vercel/blob';
          const r=await get('private/state/platform-v3.json',{access:'private',useCache:false});
          if(!r||r.statusCode!==200||!r.stream)throw Error('STATE_READ_FAILED');
          const chunks=[];for await(const c of r.stream)chunks.push(c);
          const s=JSON.parse(Buffer.concat(chunks).toString('utf8'));
          if(!Array.isArray(s.users)||!Array.isArray(s.leads)||!Array.isArray(s.vehicles))throw Error('STATE_CONTRACT_INVALID');
          const stocks=new Set(['QA-LOAD-32819132897-1','QA-LOAD-32819198581-1']);
          const qa=(s.vehicles||[]).filter(v=>stocks.has(String(v.stock||''))).map(v=>({id:v.id,stock:v.stock,status:v.status}));
          console.log(JSON.stringify({ok:true,revision:Number(s.revision||0),users:s.users.length,leads:s.leads.length,vehicles:s.vehicles.length,qa}));
          NODE

          found=''
          for project in "$PHOENIX_PROJECT" "$DEALER_PROJECT" "$STOREFRONT_PROJECT"; do
            dir="/tmp/authority-$project"
            rm -rf "$dir"; mkdir -p "$dir/.vercel"
            printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$project" > "$dir/.vercel/project.json"
            if ! (cd "$dir" && vercel env pull "$dir/production.env" --yes --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" >/dev/null 2>&1); then
              continue
            fi
            grep -q '^SESSION_SECRET=' "$dir/production.env" || continue
            grep -q '^BLOB_READ_WRITE_TOKEN=' "$dir/production.env" || continue
            if (
              set -a
              . "$dir/production.env"
              set +a
              node /tmp/probe-authority.mjs > "$dir/probe.json"
              jq -e '.ok==true' "$dir/probe.json" >/dev/null
            ); then
              cp "$dir/production.env" /tmp/wdcc-authority.env
              cp "$dir/probe.json" /tmp/wdcc-authority-probe.json
              found="$project"
              break
            fi
          done
          test -n "$found" || { echo 'P0: no read-only source exposes a working static canonical Blob token plus session secret; refusing project-env mutation' >&2; exit 78; }
          (
            set -a; . /tmp/wdcc-authority.env; set +a
            printf '::add-mask::%s\n' "$BLOB_READ_WRITE_TOKEN"
            printf '::add-mask::%s\n' "$SESSION_SECRET"
          )
          echo "source_project=$found" >> "$GITHUB_OUTPUT"
          echo "AUTHORITY_SOURCE=$found"
          cat /tmp/wdcc-authority-probe.json

      - name: Build and deploy one immutable Phoenix candidate without aliases or project-env mutation
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          set -a; . /tmp/wdcc-authority.env; set +a
          printf '::add-mask::%s\n' "$BLOB_READ_WRITE_TOKEN"
          printf '::add-mask::%s\n' "$SESSION_SECRET"
          rm -rf .vercel .next
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$PHOENIX_PROJECT" > .vercel/project.json
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" >/dev/null
          vercel build --prod --token="$VERCEL_TOKEN" --scope="$TEAM" >/dev/null
          out="$(vercel deploy --prebuilt --prod --skip-domain \
            --env "BLOB_READ_WRITE_TOKEN=$BLOB_READ_WRITE_TOKEN" \
            --env "SESSION_SECRET=$SESSION_SECRET" \
            --env "BLOB_STORE_ID=$STORE_ID" \
            --token="$VERCEL_TOKEN" --scope="$TEAM" 2>&1)"
          printf '%s\n' "$out"
          url="$(printf '%s\n' "$out" | grep -Eo 'https://wdcc-cpx-launch-[a-z0-9]+-cpxagency\.vercel\.app' | head -1 || true)"
          test -n "$url" || { echo 'P0: candidate deployment URL not found' >&2; exit 1; }
          echo "$url" > /tmp/candidate-url.txt
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "CANDIDATE_URL=$url"

      - name: Prove repaired candidate state and backend QA filter before data cleanup
        shell: bash
        run: |
          set -euo pipefail
          url="$(cat /tmp/candidate-url.txt)"
          ok=0
          for attempt in $(seq 1 20); do
            code="$(curl -sS -o /tmp/candidate-health-before.json -w '%{http_code}' "$url/api/health?repair=$GITHUB_RUN_ID&attempt=$attempt" || true)"
            if [ "$code" = 200 ] && jq -e --arg sha "$CANDIDATE_SHA" '.ok==true and .degraded==false and .state=="readable" and .storage=="token" and .commit==$sha' /tmp/candidate-health-before.json >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 2
          done
          cat /tmp/candidate-health-before.json
          test "$ok" = 1
          curl -fsS "$url/api/inventory?qa_filter_precleanup=$GITHUB_RUN_ID" -o /tmp/candidate-inventory-before.json
          jq -e --arg a "$QA_STOCK_1" --arg b "$QA_STOCK_2" '.ok==true and ([.items[]? | select(.stock==$a or .stock==$b)] | length)==0' /tmp/candidate-inventory-before.json >/dev/null
          echo 'FROZEN_BACKEND_QA_FILTER=PASS'

      - name: Archive exact leaked QA rows with backup and compare-and-swap
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          set -a; . /tmp/wdcc-authority.env; set +a
          printf '::add-mask::%s\n' "$BLOB_READ_WRITE_TOKEN"
          cat > /tmp/archive-exact-qa.mjs <<'NODE'
          import crypto from 'node:crypto';
          import {get,head,put,BlobPreconditionFailedError} from '@vercel/blob';
          const path='private/state/platform-v3.json';
          const stocks=new Set(['QA-LOAD-32819132897-1','QA-LOAD-32819198581-1']);
          let result=null;
          for(let attempt=1;attempt<=3;attempt++){
            const meta=await head(path);
            const r=await get(path,{access:'private',useCache:false});
            if(!r||r.statusCode!==200||!r.stream)throw Error('STATE_READ_FAILED');
            const chunks=[];for await(const c of r.stream)chunks.push(c);
            const raw=Buffer.concat(chunks),s=JSON.parse(raw.toString('utf8'));
            const matches=(s.vehicles||[]).filter(v=>stocks.has(String(v.stock||'')));
            const unresolved=matches.filter(v=>String(v.status||'').toLowerCase()!=='archived');
            if(unresolved.length===0){result={ok:true,noOp:true,revision:Number(s.revision||0),found:matches.map(v=>({id:v.id,stock:v.stock,status:v.status}))};break;}
            const now=new Date().toISOString();
            const backup=`private/state/backups/platform-v3-pre-qa-load-archive-r${Number(s.revision||0)}-${crypto.randomUUID()}.json`;
            await put(backup,raw,{access:'private',addRandomSuffix:false,allowOverwrite:false,contentType:'application/json'});
            const archived=[];
            s.vehicles=(s.vehicles||[]).map(v=>{
              if(!stocks.has(String(v.stock||'')))return v;
              archived.push({id:v.id,stock:v.stock,fromStatus:v.status});
              return {...v,status:'archived',qa:true,updatedAt:now,qaCleanupAt:now};
            });
            s.audit=Array.isArray(s.audit)?s.audit:[];
            s.audit.push({id:crypto.randomUUID(),at:now,action:'qa.load_inventory.archive_exact',actor:'github-actions',run:process.env.GITHUB_RUN_ID||null,stocks:[...stocks],vehicleIds:archived.map(x=>x.id),backup});
            s.revision=Number(s.revision||0)+1;s.updatedAt=now;
            try{
              await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:meta.etag});
              result={ok:true,noOp:false,revision:s.revision,archived,backup};break;
            }catch(e){if(e instanceof BlobPreconditionFailedError&&attempt<3)continue;throw e;}
          }
          if(!result)throw Error('QA_ARCHIVE_NO_RESULT');
          console.log(JSON.stringify(result));
          NODE
          GITHUB_RUN_ID="$GITHUB_RUN_ID" node /tmp/archive-exact-qa.mjs | tee /tmp/qa-cleanup.json
          jq -e '.ok==true' /tmp/qa-cleanup.json >/dev/null

      - name: Verify public leak closed and live production untouched
        shell: bash
        run: |
          set -euo pipefail
          url="$(cat /tmp/candidate-url.txt)"
          for base in "$CANONICAL_ALIAS" "$url"; do
            curl -fsS "$base/api/inventory?qa_cleanup_verify=$GITHUB_RUN_ID" -o /tmp/inventory-verify.json
            jq -e --arg a "$QA_STOCK_1" --arg b "$QA_STOCK_2" '.ok==true and ([.items[]? | select(.stock==$a or .stock==$b)] | length)==0' /tmp/inventory-verify.json >/dev/null
          done
          code="$(curl -sS -o /tmp/live-after.json -w '%{http_code}' "$CANONICAL_ALIAS/api/health?safe_repair_after=$GITHUB_RUN_ID")"
          test "$code" = 200
          jq -e --arg sha "$ROLLBACK_SHA" '.ok==true and .degraded==false and .commit==$sha' /tmp/live-after.json >/dev/null
          code="$(curl -sS -o /tmp/candidate-health-after.json -w '%{http_code}' "$url/api/health?safe_repair_after=$GITHUB_RUN_ID")"
          test "$code" = 200
          jq -e --arg sha "$CANDIDATE_SHA" '.ok==true and .degraded==false and .state=="readable" and .commit==$sha' /tmp/candidate-health-after.json >/dev/null
          echo 'QA_PUBLIC_LEAK=CLOSED'
          echo 'LIVE_ALIAS_UNTOUCHED=PASS'

      - name: Report repair and cleanup evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          AUTHORITY_SOURCE: ${{ steps.authority.outputs.source_project }}
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
        shell: bash
        run: |
          health='not captured'; [ -f /tmp/candidate-health-after.json ] && health="$(cat /tmp/candidate-health-after.json)"
          cleanup='not captured'; [ -f /tmp/qa-cleanup.json ] && cleanup="$(cat /tmp/qa-cleanup.json)"
          live='not captured'; [ -f /tmp/live-after.json ] && live="$(cat /tmp/live-after.json)"
          body=$(cat <<EOF
          Frozen SHA: \`$CANDIDATE_SHA\`
          Status: **$STATUS**
          Authority source: \`${AUTHORITY_SOURCE:-not-found}\`
          Candidate URL: \`${CANDIDATE_URL:-not-created}\`

          No project environment was changed. No alias, DNS record, Cloudflare route, storefront domain, or dealer domain was moved.

          Candidate health:
          \`\`\`json
          $health
          \`\`\`

          Exact QA cleanup:
          \`\`\`json
          $cleanup
          \`\`\`

          Live health after candidate work:
          \`\`\`json
          $live
          \`\`\`
          EOF
          )
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC safe candidate repair ${GITHUB_RUN_ID}" --body "$body" || true

      - name: Dispatch controlled frozen-candidate E2E only after repair and cleanup pass
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run wdcc-candidate-local-e2e.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'CONTROLLED_E2E_DISPATCHED=true'
