name: WDCC Read-Only OIDC Authority Probe

# Supersedes the failed static-token authority detector from issue #280.
# This workflow is intentionally manual-only and read-only. It does not deploy,
# mutate Vercel project environment, clean up data, move aliases, touch DNS,
# change Cloudflare routes, or dispatch release E2E.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-read-only-oidc-authority-probe
  cancel-in-progress: false

env:
  TEAM: cpxagency
  ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
  PHOENIX_PROJECT: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
  STORE_ID: store_cNUyQRVlXtyvZQ5N
  FROZEN_TOOLING_SHA: 188392c81696da5d0d61f5c6f0bec45f490a232d
  IMMUTABLE_PHOENIX_URL: https://wdcc-cpx-launch-qhcvflfih-cpxagency.vercel.app
  IMMUTABLE_PHOENIX_SHA: b8e0ba97f34e79591c20fd334c45a8f6e810fb96

jobs:
  authority-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout frozen WDCC tooling
        uses: actions/checkout@v4
        with:
          ref: 188392c81696da5d0d61f5c6f0bec45f490a232d
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned read-only probe tooling
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FROZEN_TOOLING_SHA"
          test -n "$VERCEL_TOKEN"
          npm ci
          npm install --global vercel@59.3.0 >/dev/null
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$PHOENIX_PROJECT" > .vercel/project.json

      - name: Prove immutable Phoenix remains healthy
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/phoenix-health.json -w '%{http_code}' "$IMMUTABLE_PHOENIX_URL/api/health?oidc_authority_probe=$GITHUB_RUN_ID")"
          test "$code" = 200
          cat /tmp/phoenix-health.json
          jq -e --arg sha "$IMMUTABLE_PHOENIX_SHA" '.ok==true and .degraded==false and .commit==$sha' /tmp/phoenix-health.json >/dev/null
          echo 'IMMUTABLE_PHOENIX_HEALTH=PASS'

      - name: Probe canonical Blob authority through Vercel OIDC
        shell: bash
        run: |
          set -euo pipefail
          cat > .wdcc-authority-probe.mjs <<'NODE'
          import {get, head} from '@vercel/blob';

          const path = 'private/state/platform-v3.json';
          const storeId = String(process.env.STORE_ID || '').trim();
          const oidcToken = String(process.env.VERCEL_OIDC_TOKEN || '').trim();
          if (!storeId || !oidcToken) throw Error('OIDC_AUTHORITY_MISSING');

          const opt = {oidcToken, storeId};
          const before = await head(path, opt);
          const r = await get(path, {access: 'private', useCache: false, ...opt});
          if (!r || r.statusCode !== 200 || !r.stream) throw Error('STATE_READ_FAILED');

          const chunks = [];
          for await (const c of r.stream) chunks.push(c);
          const raw = Buffer.concat(chunks);
          const after = await head(path, opt);
          if (before.etag !== after.etag) throw Error('STATE_CHANGED_DURING_READ');

          const s = JSON.parse(raw.toString('utf8'));
          if (!Array.isArray(s.users) || !Array.isArray(s.leads) || !Array.isArray(s.vehicles)) {
            throw Error('STATE_CONTRACT_INVALID');
          }

          console.log(JSON.stringify({
            ok: true,
            authority: 'phoenix-oidc',
            revision: Number(s.revision || 0),
            users: s.users.length,
            leads: s.leads.length,
            vehicles: s.vehicles.length,
            etagStable: true
          }));
          NODE

          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID -u BLOB_READ_WRITE_TOKEN \
            vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- \
            env -u BLOB_READ_WRITE_TOKEN STORE_ID="$STORE_ID" node .wdcc-authority-probe.mjs \
            | tee /tmp/wdcc-authority-probe.json

          jq -e '.ok==true and .authority=="phoenix-oidc" and .etagStable==true' /tmp/wdcc-authority-probe.json >/dev/null
          echo 'AUTHORITY_SOURCE=phoenix-oidc'
          echo 'STATIC_BLOB_TOKEN_REQUIRED=false'
          echo 'PROJECT_ENV_MUTATION=false'

      - name: Confirm probe was read-only
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/wdcc-authority-probe.json
          echo 'WDCC_AUTHORITY_PROBE=PASS'
          echo 'NO_DEPLOYMENT_CREATED=true'
          echo 'NO_QA_CLEANUP_PERFORMED=true'
          echo 'NO_ALIAS_DNS_OR_ROUTE_CHANGE=true'
