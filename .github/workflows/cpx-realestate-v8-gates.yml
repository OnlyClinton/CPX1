name: CPX RealEstate V8 Release Gates
on:
  pull_request:
    paths:
      - 'realestate/v8/**'
      - '.github/workflows/cpx-realestate-v8-gates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install parser
        run: python -m pip install 'beautifulsoup4==4.14.3'
      - name: Audit all page links, journeys, content claims, security policy, source integrity
        run: python realestate/v8/qa/quality_gate.py
      - name: Validate JavaScript and fail-closed API cases
        run: node realestate/v8/qa/test_api.mjs
      - name: Require review of visual renders
        run: |
          test -f realestate/v8/DESIGN_CONTRACT.md
          test -f realestate/v8/RELEASE_NOTES_AND_BLOCKERS.md
          echo "Static gates passed; human screenshot review still required before production."
