name: WDCC Neon Credential Presence Readonly

on:
  push:
    branches: [proof/wdcc-522-immutable-parser-20260829]
    paths:
      - '.github/workflows/wdcc-neon-credential-presence-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      S_NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      S_NEON_TOKEN: ${{ secrets.NEON_TOKEN }}
      S_WDCC_NEON_API_KEY: ${{ secrets.WDCC_NEON_API_KEY }}
      S_NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      S_NEON_BRANCH_ID: ${{ secrets.NEON_BRANCH_ID }}
      S_WDCC_NEON_DATABASE_URL: ${{ secrets.WDCC_NEON_DATABASE_URL }}
      S_NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          for n in NEON_API_KEY NEON_TOKEN WDCC_NEON_API_KEY NEON_PROJECT_ID NEON_BRANCH_ID WDCC_NEON_DATABASE_URL NEON_DATABASE_URL; do
            v="S_${n}"; if [ -n "${!v:-}" ]; then echo "$n=PRESENT"; else echo "$n=MISSING"; fi
          done
          echo 'SECRET_VALUES_PRINTED=NO'
          echo 'READ_ONLY=YES'
