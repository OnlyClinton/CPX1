name: WDCC P0 Live Source Snapshot

on:
  push:
    branches: [proof/wdcc-522-immutable-parser-20260829]
    paths:
      - '.github/workflows/wdcc-p0-live-source-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Snapshot live scripts and versions read-only
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          for script in wdcc-dealer-frontdoor wdcc-reference-root; do
            curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$script" "${auth[@]}" > "/tmp/$script.raw"
            curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$script/settings" "${auth[@]}" > "/tmp/$script.settings.json"
            echo "=== $script ==="
            echo "sha256=$(sha256sum /tmp/$script.raw | awk '{print $1}') bytes=$(wc -c </tmp/$script.raw)"
            grep -Eo 'https://[A-Za-z0-9._/?=&:-]+' "/tmp/$script.raw" | sort -u || true
            strings "/tmp/$script.raw" | grep -E '^(const|let|var) (UI|API|ORIGIN|BACKEND|TARGET)|url\.pathname|pathname|/api/' | head -n 120 || true
            jq -c '{bindings:[.result.bindings[]? | {name,type}],compatibility_date:.result.compatibility_date,compatibility_flags:.result.compatibility_flags}' "/tmp/$script.settings.json"
          done
          echo 'READ_ONLY=YES'
          echo 'PRODUCTION_CHANGED=NO'
      - uses: actions/upload-artifact@v4
        with:
          name: wdcc-precutover-worker-snapshot-${{ github.sha }}
          path: |
            /tmp/wdcc-dealer-frontdoor.raw
            /tmp/wdcc-dealer-frontdoor.settings.json
            /tmp/wdcc-reference-root.raw
            /tmp/wdcc-reference-root.settings.json
