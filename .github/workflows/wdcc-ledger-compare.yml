name: WDCC Ledger Compare
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-ledger-compare.yml'
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      PROJECT_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --global vercel@59.3.0 >/dev/null
      - run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$PROJECT_ID" > .vercel/project.json
      - name: Read and summarize candidate ledgers
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          cat > .wdcc-ledger-compare.mjs <<'NODE'
          import crypto from 'node:crypto';
          import {get} from '@vercel/blob';
          const stores=[
            ['canonical-v10','store_cNUyQRVlXtyvZQ5N'],
            ['clean','store_vVJ5kU6x76yZVkGs'],
            ['rescue','store_KopvAQeMcatdS5DS'],
            ['private-20260801','store_LdMSV1550BRgc0SP']
          ];
          const oidc=process.env.VERCEL_OIDC_TOKEN;
          const out=[];
          const read=async(storeId)=>{const r=await get('private/state/platform-v3.json',{access:'private',useCache:false,oidcToken:oidc,storeId});if(!r||r.statusCode!==200||!r.stream)throw Error('STATE_READ_FAILED');const c=[];for await(const x of r.stream)c.push(x);const raw=Buffer.concat(c);return {state:JSON.parse(raw.toString('utf8')),sha256:crypto.createHash('sha256').update(raw).digest('hex')}};
          for(const [name,storeId] of stores){
            try{
              const {state:s,sha256}=await read(storeId);
              const vehicles=Array.isArray(s.vehicles)?s.vehicles:[],leads=Array.isArray(s.leads)?s.leads:[],audit=Array.isArray(s.audit)?s.audit:[];
              const badVehicles=vehicles.filter(v=>String(v?.status||'').toLowerCase()==='published'&&(Number(v?.year)<=1900||!String(v?.make||'').trim()||!String(v?.model||'').trim()||Number(v?.price||0)<=0||String(v?.stock||'').toUpperCase().startsWith('R36TEST-')||(Array.isArray(v?.badges)&&v.badges.map(x=>String(x).toUpperCase()).includes('R36-TEST')))).length;
              const qaLeads=leads.filter(l=>l?.qa===true||String(l?.status||'').toLowerCase()==='test'||String(l?.email||'').toLowerCase().endsWith('@invalid.example')||String(l?.name||'').toUpperCase().startsWith('WDCC QA ')).length;
              const timestamps=[s.updatedAt,...vehicles.map(v=>v?.updatedAt||v?.createdAt),...leads.map(l=>l?.updatedAt||l?.createdAt),...audit.map(a=>a?.at)].filter(Boolean).map(String).sort();
              out.push({name,storeId,ok:true,revision:Number(s.revision||0),users:Array.isArray(s.users)?s.users.length:0,vehicles:vehicles.length,leads:leads.length,audit:audit.length,badPublishedVehicles:badVehicles,qaLeads,latestTimestamp:timestamps.at(-1)||null,sha256});
            }catch(e){out.push({name,storeId,ok:false,error:String(e?.message||e)});}
          }
          console.log('LEDGERS='+JSON.stringify(out));
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope=cpxagency -- node .wdcc-ledger-compare.mjs | tee /tmp/ledgers.log
          grep '^LEDGERS=' /tmp/ledgers.log | tail -1 | cut -d= -f2- >/tmp/ledgers.json
          cat /tmp/ledgers.json | jq .
          echo "best_revision=$(jq '[.[]|select(.ok==true)|.revision]|max' /tmp/ledgers.json)" >> "$GITHUB_OUTPUT"
      - name: Report ledger comparison
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          data='not captured'; [ -f /tmp/ledgers.json ] && data="$(cat /tmp/ledgers.json)"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC ledger comparison ${GITHUB_RUN_ID}" --body "PII-free ledger comparison; no mutation performed.\n\n\`\`\`json\n$data\n\`\`\`" || true

# Read-only summary: counts, revision, integrity flags, timestamp and hash only. No lead/user PII is printed.
