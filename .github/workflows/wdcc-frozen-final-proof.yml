name: WDCC Frozen Final Proof

on:
  push:
    branches:
      - fix/wdcc-owner-final-logo-lock-20260829
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-frozen-final-${{ github.sha }}
  cancel-in-progress: false

jobs:
  frozen-final:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Lock frozen source
        shell: bash
        run: |
          set -euo pipefail
          test -s app/dealer/dealer-brand-lock.css
          test -s app/public-brand-lock.css
          grep -Fq 'dealer-brand-lock.css' app/dealer/layout.tsx
          grep -Fq 'src="/wdcc-official-logo.webp"' app/dealer/DashboardManager.tsx
          grep -Fq 'src="/wdcc-official-logo.webp"' app/dealer/inventory/InventoryManager.tsx
          grep -Fq 'public-brand-lock.css' app/layout.tsx
          grep -Fq 'WDCC_CORRECT_LOGO_DATA_URI' app/WdccPublicChrome.tsx
          grep -Fq 'data-wdcc-logo-art="owner-approved-round"' app/WdccPublicChrome.tsx
          ! grep -Fq 'wdcc-header-wordmark' app/WdccPublicChrome.tsx
          test -s app/wdccCorrectLogoData.ts
          grep -Fq 'Exact owner-approved WDCC round emblem' app/wdccCorrectLogoData.ts
          test -s .github/support/wdcc-final-brand-proof.mjs
          test -s .github/support/wdcc-polished-visual-proof.mjs
          test -s .github/support/wdcc-intro-motion-proof.mjs
          grep -Fq 'type Phase="impact"|"reveal"|"done"' app/LockedIntro.tsx
          grep -Fq 'data-wdcc-intro-v32-phase={phase}' app/LockedIntro.tsx
          grep -Fq 'data-wdcc-intro-benchmark="wdcc-v32-storefront"' app/LockedIntro.tsx
          grep -Fq 'liV32Scene 2.65s' app/LockedIntro.tsx
          grep -Fq 'liV32SmokeOne 2.45s' app/LockedIntro.tsx
          grep -Fq 'setPhase("reveal"),1150' app/LockedIntro.tsx
          grep -Fq '},2850)' app/LockedIntro.tsx
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
      - name: Build exact candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0 playwright@1.55.0
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets
          test -s .next/BUILD_ID
          npx playwright install --with-deps chromium >/dev/null
      - name: Create exact-SHA Worker
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          cfg.name=`wff-${process.env.GITHUB_SHA}`;
          cfg.workers_dev=true;
          cfg.preview_urls=true;
          delete cfg.route;
          delete cfg.routes;
          fs.writeFileSync('wrangler.frozen-final.jsonc',JSON.stringify(cfg,null,2)+'\n');
          NODE
          ! grep -qi 'wedontcarecars.com' wrangler.frozen-final.jsonc
          grep -Fq "$GITHUB_SHA" wrangler.frozen-final.jsonc
      - name: Deploy exact-SHA preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.frozen-final.jsonc 2>&1 | tee /tmp/wff.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wff.log | tail -1)"
          test -n "$url"
          case "$url" in *"$GITHUB_SHA"*) ;; *) echo "Not exact SHA: $url" >&2; exit 1;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > frozen-final-preview-url.txt
      - name: Warm exact preview
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          code=000
          for i in $(seq 1 40); do
            code="$(curl --http1.1 -sS -L -o /tmp/home.html -w '%{http_code}' "$URL/?owner-review=1&warm=$GITHUB_RUN_ID-$i" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          test "$code" = 200
          local_build="$(tr -d '\r\n' < .next/BUILD_ID)"
          grep -Fq "$local_build" /tmp/home.html
          for asset in wdcc-official-logo.webp wdcc-owner-logo; do
            asset_code=000
            for i in $(seq 1 15); do
              asset_code="$(curl --http1.1 -sS -L -o "/tmp/${asset//\//-}.bin" -w '%{http_code}' "$URL/$asset?warm=$GITHUB_RUN_ID-$i" || true)"
              [ "$asset_code" = 200 ] && break
              sleep 1
            done
            test "$asset_code" = 200
          done
      - name: Prove cinematic intro motion
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          node .github/support/wdcc-intro-motion-proof.mjs
      - name: Prove frozen final
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          node .github/support/wdcc-final-brand-proof.mjs
      - name: Prove visual polish and decoded media
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          node .github/support/wdcc-polished-visual-proof.mjs
      - name: Require exact branch head
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test -n "$current"
          test "$current" = "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-frozen-final-${{ github.sha }}
          path: |
            frozen-final-preview-url.txt
            frozen-final-proof/
          if-no-files-found: warn
          retention-days: 7
