name: WDCC HOME SLEEK EDGE

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-home-sleek-edge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-home-sleek-edge
  cancel-in-progress: false

env:
  ORIGIN: https://www.wedontcarecars.com
  APEX: https://wedontcarecars.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require Cloudflare authorization
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Prove unmodified homepage origin
        run: |
          set -euo pipefail
          code="$(curl -sS -L -o /tmp/origin.html -w '%{http_code}' "$ORIGIN/?edge_preflight=$GITHUB_RUN_ID")"
          test "$code" = 200
          grep -q 'class="site-header"' /tmp/origin.html
          grep -q 'class="mobile-call"' /tmp/origin.html
          grep -q 'class="hero-actions"' /tmp/origin.html
          grep -q 'class="mobile-action-bar"' /tmp/origin.html
          grep -q 'wdcc-logo-transparent.webp' /tmp/origin.html
          curl -fsS "$ORIGIN/api/health?edge_preflight=$GITHUB_RUN_ID" -o /tmp/origin-health.json
          jq -e '.ok==true and .degraded==false' /tmp/origin-health.json >/dev/null
          curl -fsS "$ORIGIN/api/inventory?edge_preflight=$GITHUB_RUN_ID" -o /tmp/origin-inventory.json
          jq -e '.ok==true and (.items|type)=="array"' /tmp/origin-inventory.json >/dev/null

      - name: Install Wrangler
        run: npm install --global wrangler@4.90.0 >/dev/null

      - name: Build apex proxy with root-only presentation transform
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wdcc-home-edge
          cat > /tmp/wdcc-home-edge/worker.js <<'EOF'
          const ORIGIN = "https://www.wedontcarecars.com";
          const CSS = `
          <style id="wdcc-sleek-edge">
          @media(max-width:900px){
            .utility-bar{height:28px!important;min-height:28px!important;padding:0 14px!important;display:flex!important;align-items:center!important;justify-content:space-between!important;gap:10px!important;background:#02070c!important;border-bottom:1px solid #ffffff12!important;font-size:8px!important;letter-spacing:.075em!important}
            .utility-bar>span{white-space:nowrap!important}.utility-bar>span:nth-child(2){display:none!important}
            .home-header-shell{background:#02070ceb!important;border-bottom:1px solid #ffffff12!important;backdrop-filter:blur(16px)!important}
            .site-header{position:relative!important;height:76px!important;min-height:76px!important;padding:0 14px!important;display:grid!important;grid-template-columns:minmax(0,1fr) 44px!important;align-items:center!important;gap:12px!important;background:transparent!important}
            .logo-button{grid-column:1!important;grid-row:1!important;justify-self:start!important;position:relative!important;inset:auto!important;width:84px!important;height:84px!important;margin:0!important;padding:0!important;background:url('/wdcc-logo-transparent.webp') center/contain no-repeat!important;transform:none!important;filter:drop-shadow(0 5px 15px #000b)!important}
            .logo-button>span{display:none!important}.mobile-call{display:none!important}
            .mobile-menu{grid-column:2!important;grid-row:1!important;justify-self:end!important;position:relative!important;inset:auto!important;display:grid!important;place-items:center!important;width:44px!important;height:44px!important;min-width:44px!important;min-height:44px!important;margin:0!important;padding:0!important;border:1px solid #ffffff24!important;border-radius:12px!important;background:#0a1621e8!important;color:#fff!important;box-shadow:none!important}
            .mobile-menu>span{display:grid!important;width:18px!important;height:14px!important;align-content:space-between!important}.mobile-menu i{display:block!important;width:18px!important;height:2px!important;margin:0!important;border:0!important;border-radius:3px!important;background:#e8eef3!important;transform:none;opacity:1}
            .mobile-menu[aria-expanded="true"]>span i:nth-child(1){transform:translateY(6px) rotate(45deg)!important}.mobile-menu[aria-expanded="true"]>span i:nth-child(2){opacity:0!important}.mobile-menu[aria-expanded="true"]>span i:nth-child(3){transform:translateY(-6px) rotate(-45deg)!important}
            .main-nav{position:absolute!important;z-index:520!important;top:68px!important;left:10px!important;right:10px!important;width:auto!important;margin:0!important;padding:8px!important;display:none!important;grid-template-columns:1fr 1fr!important;gap:2px!important;background:#07131ff7!important;border:1px solid #ffffff20!important;border-radius:14px!important;box-shadow:0 22px 60px #000d!important;backdrop-filter:blur(18px)!important}.main-nav.open{display:grid!important}.main-nav a{min-height:46px!important;display:flex!important;align-items:center!important;padding:0 13px!important;border:0!important;border-radius:8px!important;color:#dfe8ef!important;font-size:10px!important;font-weight:900!important;letter-spacing:.05em!important;text-transform:uppercase!important}
            .hero-actions{display:none!important}.hero-copy{padding-bottom:28px!important}
            .mobile-action-bar{z-index:620!important;grid-template-columns:1.08fr 1fr .78fr!important;background:#050c13f7!important;border-top:1px solid #ffffff1c!important;box-shadow:0 -12px 32px #0008!important;backdrop-filter:blur(14px)!important}.mobile-action-bar a{min-height:58px!important;font-size:10px!important;font-weight:950!important;letter-spacing:.015em!important}
          }
          @media(max-width:560px){.utility-bar{padding:0 11px!important;font-size:7.5px!important;letter-spacing:.05em!important}.site-header{height:72px!important;min-height:72px!important;padding:0 11px!important;grid-template-columns:minmax(0,1fr) 42px!important}.logo-button{width:78px!important;height:78px!important}.mobile-menu{width:42px!important;height:42px!important;min-width:42px!important;min-height:42px!important;border-radius:11px!important}.main-nav{top:65px!important;left:7px!important;right:7px!important}.hero-copy{padding-bottom:22px!important}.mobile-action-bar a{font-size:9px!important}}
          </style>`;

          function target(request){
            const incoming=new URL(request.url);
            const out=new URL(ORIGIN);
            out.pathname=incoming.pathname;
            out.search=incoming.search;
            return out;
          }
          function rewriteLocation(headers,incoming){
            const location=headers.get('location');
            if(!location)return;
            try{
              const loc=new URL(location,ORIGIN);
              if(loc.hostname==='www.wedontcarecars.com'){
                loc.protocol='https:';loc.hostname=incoming.hostname;loc.port='';
                headers.set('location',loc.toString());
              }
            }catch{}
          }
          async function originFetch(request){
            const incoming=new URL(request.url),headers=new Headers(request.headers);
            if(!headers.has('x-forwarded-host'))headers.set('x-forwarded-host',incoming.host);
            if(!headers.has('x-forwarded-proto'))headers.set('x-forwarded-proto','https');
            headers.delete('cf-worker');
            const init={method:request.method,headers,redirect:'manual'};
            if(!['GET','HEAD'].includes(request.method))init.body=request.body;
            const response=await fetch(new Request(target(request).toString(),init));
            const outHeaders=new Headers(response.headers);rewriteLocation(outHeaders,incoming);
            return {response,outHeaders};
          }
          class HeadInjector{element(el){el.append(CSS,{html:true});}}

          export default{
            async fetch(request){
              const incoming=new URL(request.url);
              const {response,outHeaders}=await originFetch(request);
              if(incoming.pathname!=='/')return new Response(response.body,{status:response.status,statusText:response.statusText,headers:outHeaders});
              const type=response.headers.get('content-type')||'';
              if(!type.includes('text/html'))return new Response(response.body,{status:response.status,statusText:response.statusText,headers:outHeaders});
              const transformed=new HTMLRewriter().on('head',new HeadInjector()).transform(response);
              const rootHeaders=new Headers(transformed.headers);
              rewriteLocation(rootHeaders,incoming);
              rootHeaders.set('x-wdcc-edge','cloudflare-home-sleek');
              rootHeaders.set('x-wdcc-origin','www.wedontcarecars.com');
              rootHeaders.set('cache-control','no-store');
              return new Response(transformed.body,{status:transformed.status,statusText:transformed.statusText,headers:rootHeaders});
            }
          };
          EOF
          cat > /tmp/wdcc-home-edge/wrangler.jsonc <<'EOF'
          {
            "$schema":"node_modules/wrangler/config-schema.json",
            "name":"wdcc-home-sleek-edge",
            "main":"worker.js",
            "compatibility_date":"2026-08-25",
            "workers_dev":true,
            "observability":{"enabled":true}
          }
          EOF

      - name: Deploy and prove candidate
        id: stage
        working-directory: /tmp/wdcc-home-edge
        shell: bash
        run: |
          set -euo pipefail
          wrangler deploy 2>&1 | tee /tmp/wrangler.log
          URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wrangler.log | tail -1 || true)"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 20); do
            root="$(curl -sS -D /tmp/candidate-root.h -o /tmp/candidate-root.html -w '%{http_code}' "$URL/?candidate=$GITHUB_RUN_ID&attempt=$attempt" || true)"
            health="$(curl -sS -D /tmp/candidate-health.h -o /tmp/candidate-health.json -w '%{http_code}' "$URL/api/health?candidate=$GITHUB_RUN_ID&attempt=$attempt" || true)"
            inv="$(curl -sS -D /tmp/candidate-inv.h -o /tmp/candidate-inv.json -w '%{http_code}' "$URL/api/inventory?candidate=$GITHUB_RUN_ID&attempt=$attempt" || true)"
            if [ "$root" = 200 ] && [ "$health" = 200 ] && [ "$inv" = 200 ] \
              && grep -q 'id="wdcc-sleek-edge"' /tmp/candidate-root.html \
              && jq -e '.ok==true and .degraded==false' /tmp/candidate-health.json >/dev/null 2>&1 \
              && jq -e '.ok==true and (.items|type)=="array"' /tmp/candidate-inv.json >/dev/null 2>&1; then break; fi
            sleep 2
          done
          grep -q 'id="wdcc-sleek-edge"' /tmp/candidate-root.html
          grep -qi '^x-wdcc-edge: cloudflare-home-sleek' /tmp/candidate-root.h
          ! grep -qi '^x-wdcc-edge: cloudflare-home-sleek' /tmp/candidate-health.h
          ! grep -qi '^x-wdcc-edge: cloudflare-home-sleek' /tmp/candidate-inv.h

      - name: Bind apex route
        working-directory: /tmp/wdcc-home-edge
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');const p='wrangler.jsonc';const c=JSON.parse(fs.readFileSync(p,'utf8'));
          c.routes=[{pattern:'wedontcarecars.com/*',zone_name:'wedontcarecars.com'}];
          fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');
          NODE
          wrangler deploy
          sleep 5

      - name: Verify bound route remains dormant or healthy
        shell: bash
        run: |
          set -euo pipefail
          # DNS may still be unproxied at this stage. When proxied later, the activation workflow owns the final live gate.
          curl -fsS "$ORIGIN/api/health?edge_postbind=$GITHUB_RUN_ID" -o /tmp/health.json
          jq -e '.ok==true and .degraded==false' /tmp/health.json >/dev/null
          curl -fsS "$ORIGIN/api/inventory?edge_postbind=$GITHUB_RUN_ID" -o /tmp/inventory.json
          jq -e '.ok==true and (.items|type)=="array"' /tmp/inventory.json >/dev/null
          echo 'WDCC_HOME_SLEEK_EDGE_READY=PASS'
