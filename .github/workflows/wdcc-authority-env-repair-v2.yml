name: WDCC Authority Env Repair v2
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/wdcc-authority-env-repair-v2.yml'
      - 'scripts/wdcc-authority-env-repair.sh'
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --global vercel@59.3.0 >/dev/null
      - name: Repair and verify next-deployment authority bindings
        id: repair
        run: bash scripts/wdcc-authority-env-repair.sh
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          revision="unknown"
          if [ -f /tmp/wdcc-envverify.json ]; then revision="$(jq -r '.revision // "unknown"' /tmp/wdcc-envverify.json)"; fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC authority env repair v2 ${GITHUB_RUN_ID}" --body "Phoenix next-deployment authority bindings: **$STATUS**. Canonical store is store_cNUyQRVlXtyvZQ5N; session secret is generated and stored as sensitive without being printed. Verified ledger revision: $revision. No app deployment." || true
