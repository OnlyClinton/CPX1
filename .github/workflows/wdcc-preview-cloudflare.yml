name: WDCC Cloudflare Preview

on:
  push:
    branches:
      - fix/wdcc-locked-contract-20260826
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-cloudflare-preview-locked
  cancel-in-progress: true

env:
  EXPECTED_HERO_SIZE: '145504'
  EXPECTED_HERO_SHA256: 1d7a0e4fced7450f2bbc66443d44b1f35bd9e24a6366308362aafa65576d3eb2

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact visual source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate preview inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test "$(wc -c < public/wdcc-hero-v2.webp | tr -d ' ')" = "$EXPECTED_HERO_SIZE"
          printf '%s  %s\n' "$EXPECTED_HERO_SHA256" public/wdcc-hero-v2.webp | sha256sum -c -
          test -s public/wdcc-official-logo.webp
          test -s public/wdcc-logo-transparent.webp
          grep -q 'wdcc-hero-v2.webp' app/LockedIntro.tsx
          grep -q 'wdcc-logo-transparent.webp' app/LockedIntro.tsx
          grep -q 'wdcc-official-logo.webp' app/mobile-visual-lock.css

      - name: Build Cloudflare artifact
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets

      - name: Create isolated Worker config
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          cfg.name='wdcc-preview-locked';
          cfg.workers_dev=true;
          cfg.preview_urls=true;
          delete cfg.route;
          delete cfg.routes;
          fs.writeFileSync('wrangler.preview.jsonc',JSON.stringify(cfg,null,2)+'\n');
          NODE

      - name: Deploy isolated Cloudflare preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.preview.jsonc 2>&1 | tee /tmp/wdcc-preview.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wdcc-preview.log | tail -1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" | tee preview-url.txt

      - name: Verify preview is real
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          code=000
          for i in $(seq 1 20); do
            code="$(curl -sS -L -o /tmp/home.html -w '%{http_code}' "$URL/?proof=$GITHUB_RUN_ID-$i" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          test "$code" = 200
          grep -qi "we don.t care" /tmp/home.html
          test "$(curl -sS -L -o /tmp/hero.webp -w '%{http_code}' "$URL/wdcc-hero-v2.webp?proof=$GITHUB_RUN_ID")" = 200
          printf '%s  %s\n' "$EXPECTED_HERO_SHA256" /tmp/hero.webp | sha256sum -c -
          test "$(curl -sS -L -o /tmp/logo1.webp -w '%{http_code}' "$URL/wdcc-official-logo.webp?proof=$GITHUB_RUN_ID")" = 200
          test -s /tmp/logo1.webp
          test "$(curl -sS -L -o /tmp/logo2.webp -w '%{http_code}' "$URL/wdcc-logo-transparent.webp?proof=$GITHUB_RUN_ID")" = 200
          test -s /tmp/logo2.webp
          test "$(curl -sS -L -o /tmp/dealer.html -w '%{http_code}' "$URL/dealer?proof=$GITHUB_RUN_ID")" = 200
          grep -qi dealer /tmp/dealer.html

      - name: Publish URL
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "### WDCC Cloudflare Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Production untouched." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: wdcc-cloudflare-preview-url
          path: preview-url.txt
          retention-days: 7
