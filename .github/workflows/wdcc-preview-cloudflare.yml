name: WDCC Cloudflare Preview

on:
  push:
    branches:
      - fix/wdcc-locked-contract-20260826
      - preview/wdcc-webgpu-logo-handoff-20260826
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-cloudflare-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_HERO_SIZE: '145504'
  EXPECTED_HERO_SHA256: 1d7a0e4fced7450f2bbc66443d44b1f35bd9e24a6366308362aafa65576d3eb2

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact visual source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate current visual authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test "$(wc -c < public/wdcc-hero-v2.webp | tr -d ' ')" = "$EXPECTED_HERO_SIZE"
          printf '%s  %s\n' "$EXPECTED_HERO_SHA256" public/wdcc-hero-v2.webp | sha256sum -c -
          test -s public/wdcc-official-logo.webp
          test -s app/LockedIntro.tsx
          test -s app/ReferenceCloneHome.tsx
          test -s app/owner-visual-polish.css
          test -s app/owner-visual-hotfix.css
          test -f 'app/vehicle/[id]/page.tsx'
          grep -q 'wdcc-hero-v2.webp' app/LockedIntro.tsx
          grep -q 'wdcc-official-logo.webp' app/LockedIntro.tsx
          grep -q 'navigator as any).gpu' app/LockedIntro.tsx
          grep -q 'getBoundingClientRect' app/LockedIntro.tsx
          grep -q 'clip-path:circle' app/LockedIntro.tsx
          grep -q 'rh-photo-placeholder' app/ReferenceCloneHome.tsx
          grep -q '/vehicle/' app/ReferenceCloneHome.tsx

      - name: Build Cloudflare artifact
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0 playwright@1.55.0
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets
          npx playwright install --with-deps chromium >/dev/null

      - name: Create isolated Worker config
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          cfg.name='wdcc-webgpu-handoff-preview';
          cfg.workers_dev=true;
          cfg.preview_urls=true;
          delete cfg.route; delete cfg.routes;
          fs.writeFileSync('wrangler.preview.jsonc',JSON.stringify(cfg,null,2)+'\n');
          NODE
          ! grep -qi 'wedontcarecars.com' wrangler.preview.jsonc

      - name: Deploy isolated Cloudflare preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.preview.jsonc 2>&1 | tee /tmp/wdcc-preview.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wdcc-preview.log | tail -1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" | tee preview-url.txt

      - name: Smoke exact preview and canonical assets
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          code=000
          for i in $(seq 1 30); do
            code="$(curl -sS -L -o /tmp/home.html -w '%{http_code}' "$URL/?proof=$GITHUB_RUN_ID-$i" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          test "$code" = 200
          grep -qi "we don.t care" /tmp/home.html
          test "$(curl -sS -L -o /tmp/hero.webp -w '%{http_code}' "$URL/wdcc-hero-v2.webp?proof=$GITHUB_RUN_ID")" = 200
          printf '%s  %s\n' "$EXPECTED_HERO_SHA256" /tmp/hero.webp | sha256sum -c -
          test "$(curl -sS -L -o /tmp/logo.webp -w '%{http_code}' "$URL/wdcc-official-logo.webp?proof=$GITHUB_RUN_ID")" = 200
          test -s /tmp/logo.webp
          test "$(curl -sS -L -o /tmp/inventory.json -w '%{http_code}' "$URL/api/inventory?proof=$GITHUB_RUN_ID")" = 200
          test "$(curl -sS -L -o /tmp/dealer.html -w '%{http_code}' "$URL/dealer?proof=$GITHUB_RUN_ID")" = 200

      - name: Capture and validate desktop/mobile visual proof
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-proof
          node - <<'NODE'
          const fs=require('fs'); const {chromium}=require('playwright');
          (async()=>{
            const url=process.env.URL; if(!url)throw Error('PREVIEW_URL_MISSING');
            const browser=await chromium.launch({headless:true}); const ev={url,sha:process.env.GITHUB_SHA,mobile:{},desktop:{}};
            const waitImg=async(p,s,w=100)=>{await p.locator(s).waitFor({state:'visible',timeout:12000});await p.waitForFunction(({s,w})=>{const i=document.querySelector(s);return i&&i.complete&&i.naturalWidth>=w},{s,w},{timeout:12000})};
            try{
              const m=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true}); const p=await m.newPage();
              await p.goto(`${url}/?m=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000}); await waitImg(p,'.li-scene img',1000); await waitImg(p,'.li-badge img',200); await p.waitForTimeout(500);
              const start=await p.evaluate(()=>{const i=document.querySelector('.li-badge img').getBoundingClientRect(),s=document.querySelector('.li-scene img').getBoundingClientRect();return{logo:{x:i.x,y:i.y,w:i.width,h:i.height},scene:{w:s.width,h:s.height},gpu:!!document.querySelector('.gpu-canvas')}});
              if(start.logo.w<170||start.scene.w<380||start.scene.h<800||!start.gpu)throw Error(`INTRO_START_BAD ${JSON.stringify(start)}`);
              await p.screenshot({path:'visual-proof/mobile-intro-start.png'}); await p.waitForTimeout(720);
              const mid=await p.evaluate(()=>{const i=document.querySelector('.li-badge img')?.getBoundingClientRect(),c=document.querySelector('.gpu-canvas'),scene=document.querySelector('.li-scene');return{i:i&&{x:i.x,y:i.y,w:i.width,h:i.height,opacity:getComputedStyle(document.querySelector('.li-badge img')).opacity},canvas:!!c,sceneOpacity:scene&&getComputedStyle(scene).opacity}});
              await p.screenshot({path:'visual-proof/mobile-intro-handoff.png'}); await p.locator('.li').waitFor({state:'detached',timeout:5000}); await waitImg(p,'.rh-logo img',200);
              const end=await p.evaluate(()=>{const i=document.querySelector('.rh-logo img').getBoundingClientRect(),hero=document.querySelector('.rh-hero-art').getBoundingClientRect();return{logo:{x:i.x,y:i.y,w:i.width,h:i.height},hero:{w:hero.width,h:hero.height},menu:getComputedStyle(document.querySelector('.rh-menu')).display,grid:getComputedStyle(document.querySelector('.rh-grid')).display}});
              if(end.logo.w<88||end.menu==='none'||end.grid!=='flex'||end.hero.h>420)throw Error(`MOBILE_END_BAD ${JSON.stringify(end)}`);
              await p.screenshot({path:'visual-proof/mobile-hero.png'}); ev.mobile={start,mid,end}; await m.close();

              const d=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});const q=await d.newPage();
              await q.goto(`${url}/?d=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});await waitImg(q,'.li-scene img',1000);await q.locator('.li').waitFor({state:'detached',timeout:5000});await waitImg(q,'.rh-logo img',200);
              const endD=await q.evaluate(()=>{const i=document.querySelector('.rh-logo img').getBoundingClientRect();return{logoW:i.width,menu:getComputedStyle(document.querySelector('.rh-menu')).display,grid:getComputedStyle(document.querySelector('.rh-grid')).display}});
              if(endD.logoW<88||endD.menu!=='none'||endD.grid!=='grid')throw Error(`DESKTOP_END_BAD ${JSON.stringify(endD)}`);
              await q.screenshot({path:'visual-proof/desktop-hero.png'});ev.desktop=endD;await d.close();
            }finally{await browser.close()}
            fs.writeFileSync('visual-proof/metrics.json',JSON.stringify(ev,null,2)+'\n');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Publish preview evidence summary
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          echo '### WDCC WebGPU logo handoff preview' >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: ${URL:-not-created}" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Static Challenger/Tampa scene; measured logo-to-header handoff; scene fade; no production routes.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-webgpu-handoff-proof
          path: |
            preview-url.txt
            visual-proof/
          if-no-files-found: warn
          retention-days: 7
