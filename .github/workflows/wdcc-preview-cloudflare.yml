name: WDCC Cloudflare Preview

on:
  push:
    branches:
      - preview/wdcc-exact-mockup-20260826
      - preview/wdcc-locked-contract-20260826
      - dev/wdcc-cinematic-mockup-v1
      - fix/wdcc-locked-contract-20260826
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-cloudflare-preview
  cancel-in-progress: true

env:
  EXPECTED_HERO_SIZE: '145504'
  EXPECTED_HERO_SHA256: 1d7a0e4fced7450f2bbc66443d44b1f35bd9e24a6366308362aafa65576d3eb2

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout preview source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Require canonical 8AR hero in source
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < public/wdcc-hero-v2.webp | tr -d ' ')" = "$EXPECTED_HERO_SIZE"
          printf '%s  %s\n' "$EXPECTED_HERO_SHA256" public/wdcc-hero-v2.webp | sha256sum -c -
          grep -q 'wdcc-logo-transparent.webp' app/LockedIntro.tsx
          grep -q 'wdcc-logo-transparent.webp' app/ReferenceCloneHome.tsx

      - name: Install source and Cloudflare adapter
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0

      - name: Build Cloudflare preview
        shell: bash
        run: |
          set -euo pipefail
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets

      - name: Create isolated preview config
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const source=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          source.name='wdcc-preview';
          source.workers_dev=true;
          source.preview_urls=true;
          delete source.route;
          delete source.routes;
          fs.writeFileSync('wrangler.preview.jsonc',JSON.stringify(source,null,2)+'\n');
          NODE

      - name: Deploy Cloudflare preview only
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.preview.jsonc 2>&1 | tee /tmp/wdcc-cloudflare-preview.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wdcc-cloudflare-preview.log | tail -1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" | tee preview-url.txt

      - name: Smoke exact preview and asset bytes
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          code=000
          for i in $(seq 1 20); do
            code="$(curl -sS -L -o /tmp/home.html -w '%{http_code}' "$URL/?wdcc-preview=$GITHUB_RUN_ID-$i" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          test "$code" = 200
          grep -qi "we don.t care" /tmp/home.html
          grep -q "wdcc-logo-transparent.webp" /tmp/home.html
          grep -q "wdcc-hero-v2.webp" /tmp/home.html

          test "$(curl -sS -L -o /tmp/hero.webp -w '%{http_code}' "$URL/wdcc-hero-v2.webp?asset=$GITHUB_RUN_ID")" = 200
          test "$(wc -c < /tmp/hero.webp | tr -d ' ')" = "$EXPECTED_HERO_SIZE"
          printf '%s  %s\n' "$EXPECTED_HERO_SHA256" /tmp/hero.webp | sha256sum -c -

          test "$(curl -sS -L -o /tmp/logo.webp -w '%{http_code}' "$URL/wdcc-logo-transparent.webp?asset=$GITHUB_RUN_ID")" = 200
          test -s /tmp/logo.webp

          test "$(curl -sS -L -o /tmp/fallback.webp -w '%{http_code}' "$URL/assets/cars/2004-nissan-350z-1.webp?asset=$GITHUB_RUN_ID")" = 200
          printf '%s  %s\n' "$EXPECTED_HERO_SHA256" /tmp/fallback.webp | sha256sum -c -

          test "$(curl -sS -L -o /tmp/inventory.json -w '%{http_code}' "$URL/api/inventory?preview=$GITHUB_RUN_ID")" = 200
          grep -qi 'items\|inventory' /tmp/inventory.json

          test "$(curl -sS -L -o /tmp/dealer.html -w '%{http_code}' "$URL/dealer?wdcc-preview=$GITHUB_RUN_ID")" = 200
          grep -qi "dealer" /tmp/dealer.html
          {
            echo '### WDCC Cloudflare preview — PASS'
            echo
            echo "Preview: $URL"
            echo "Hero SHA-256: $EXPECTED_HERO_SHA256"
            echo 'Canonical 8AR hero bytes served by Worker: PASS.'
            echo 'Transparent logo asset: PASS.'
            echo 'Inventory media fallback: PASS.'
            echo 'Production domains were not changed.'
            echo 'No Vercel deployment was created.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: wdcc-cloudflare-preview-url
          path: preview-url.txt
          retention-days: 7
