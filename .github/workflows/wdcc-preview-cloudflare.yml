name: WDCC Cloudflare Preview

on:
  push:
    branches:
      - fix/wdcc-locked-contract-20260826
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-cloudflare-preview-locked
  cancel-in-progress: true

env:
  EXPECTED_HERO_SIZE: '145504'
  EXPECTED_HERO_SHA256: 1d7a0e4fced7450f2bbc66443d44b1f35bd9e24a6366308362aafa65576d3eb2

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact visual source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate locked visual inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test "$(wc -c < public/wdcc-hero-v2.webp | tr -d ' ')" = "$EXPECTED_HERO_SIZE"
          printf '%s  %s\n' "$EXPECTED_HERO_SHA256" public/wdcc-hero-v2.webp | sha256sum -c -
          test -s public/wdcc-official-logo.webp
          test -s public/wdcc-logo-transparent.webp
          grep -q 'wdcc-hero-v2.webp' app/LockedIntro.tsx
          grep -q 'wdcc-official-logo.webp' app/LockedIntro.tsx
          grep -q 'wdcc-official-logo.webp' app/ReferenceCloneHome.tsx
          grep -q 'wdcc-logo-transparent.webp' app/ReferenceCloneHome.tsx
          grep -q 'clip-path:circle' app/LockedIntro.tsx
          grep -q 'owner-visual-polish.css' app/layout.tsx
          ! grep -q 'brand-hero-final.css' app/layout.tsx
          ! grep -q 'owner-optical-final.css' app/layout.tsx
          ! grep -q 'preview-visual-corrections.css' app/layout.tsx
          grep -q 'rh-photo-placeholder' app/ReferenceCloneHome.tsx
          grep -q '/vehicle/' app/ReferenceCloneHome.tsx
          test -f 'app/vehicle/[id]/page.tsx'

      - name: Build Cloudflare artifact
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets

      - name: Create isolated Worker config
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          cfg.name='wdcc-preview';
          cfg.workers_dev=true;
          cfg.preview_urls=true;
          delete cfg.route;
          delete cfg.routes;
          fs.writeFileSync('wrangler.preview.jsonc',JSON.stringify(cfg,null,2)+'\n');
          NODE
          ! grep -qi 'wedontcarecars.com' wrangler.preview.jsonc

      - name: Deploy isolated Cloudflare preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.preview.jsonc 2>&1 | tee /tmp/wdcc-preview.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wdcc-preview.log | tail -1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" | tee preview-url.txt

      - name: Smoke exact preview and canonical assets
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          code=000
          for i in $(seq 1 30); do
            code="$(curl -sS -L -o /tmp/home.html -w '%{http_code}' "$URL/?proof=$GITHUB_RUN_ID-$i" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          test "$code" = 200
          grep -qi "we don.t care" /tmp/home.html
          grep -q "wdcc-official-logo.webp" /tmp/home.html
          grep -q "wdcc-hero-v2.webp" /tmp/home.html
          test "$(curl -sS -L -o /tmp/hero.webp -w '%{http_code}' "$URL/wdcc-hero-v2.webp?proof=$GITHUB_RUN_ID")" = 200
          test "$(wc -c < /tmp/hero.webp | tr -d ' ')" = "$EXPECTED_HERO_SIZE"
          printf '%s  %s\n' "$EXPECTED_HERO_SHA256" /tmp/hero.webp | sha256sum -c -
          test "$(curl -sS -L -o /tmp/logo.webp -w '%{http_code}' "$URL/wdcc-official-logo.webp?proof=$GITHUB_RUN_ID")" = 200
          test -s /tmp/logo.webp
          test "$(curl -sS -L -o /tmp/inventory.json -w '%{http_code}' "$URL/api/inventory?proof=$GITHUB_RUN_ID")" = 200
          jq -e '((.items // .inventory // []) | length) >= 1' /tmp/inventory.json >/dev/null
          test "$(curl -sS -L -o /tmp/dealer.html -w '%{http_code}' "$URL/dealer?proof=$GITHUB_RUN_ID")" = 200

      - name: Install browser for visual proof
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null

      - name: Capture and validate desktop/mobile visual proof
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-proof
          node - <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const url=process.env.URL;
            if(!url) throw Error('PREVIEW_URL_MISSING');
            const browser=await chromium.launch({headless:true});
            const evidence={preview:url,sha:process.env.GITHUB_SHA,mobile:{},desktop:{},dealer:{}};
            const waitImg=async(p,s,w=100)=>{
              await p.locator(s).waitFor({state:'visible',timeout:12000});
              await p.waitForFunction(({s,w})=>{const i=document.querySelector(s);return !!i&&i.complete===true&&Number(i.naturalWidth||0)>=w},{s,w},{timeout:12000});
            };
            const waitIntroDone=async p=>{
              const intro=p.locator('.li');
              if(await intro.count()) await intro.waitFor({state:'detached',timeout:5000}).catch(async()=>{if(await intro.count()) await p.getByRole('button',{name:/skip intro/i}).click({force:true,timeout:1500}).catch(()=>{})});
              await p.locator('.rh-hero-art').waitFor({state:'visible',timeout:5000});
            };
            try{
              const m=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
              const p=await m.newPage();
              const failures=[]; const consoleErrors=[];
              p.on('response',r=>{if(r.status()>=400)failures.push({status:r.status(),url:r.url()})});
              p.on('requestfailed',r=>failures.push({failed:r.url(),error:r.failure()?.errorText}));
              p.on('console',msg=>{if(msg.type()==='error')consoleErrors.push(msg.text())});
              p.on('pageerror',e=>consoleErrors.push(String(e)));
              await p.goto(`${url}/?visual=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
              await waitImg(p,'.li-scene img',1000); await waitImg(p,'.li-badge img',200); await p.waitForTimeout(650);
              const intro=await p.locator('.li-badge img').evaluate(el=>{const s=getComputedStyle(el),b=el.getBoundingClientRect();return{src:el.currentSrc||el.src,clipPath:s.clipPath,opacity:s.opacity,visibility:s.visibility,w:b.width,h:b.height}});
              if(!intro.src.includes('wdcc-official-logo.webp')||!String(intro.clipPath).includes('circle')||Number(intro.opacity)<.9||intro.visibility==='hidden'||intro.w<120) throw Error(`INTRO_BADGE_BAD ${JSON.stringify(intro)}`);
              await p.screenshot({path:'visual-proof/mobile-intro.png'});
              await waitIntroDone(p);
              await waitImg(p,'.rh-hero-art',1000); await waitImg(p,'.rh-logo img',200);
              const layout=await p.evaluate(()=>{
                const q=s=>document.querySelector(s), style=s=>q(s)?getComputedStyle(q(s)):null, rect=s=>q(s)?.getBoundingClientRect();
                return {viewport:innerWidth,headerPosition:style('.rh-header')?.position,utilityPosition:style('.rh-utility')?.position,menuDisplay:style('.rh-menu')?.display,gridDisplay:style('.rh-grid')?.display,cardWidth:rect('.rh-card')?.width||0,headerLogoWidth:rect('.rh-logo img')?.width||0,headerLogoSrc:q('.rh-logo img')?.currentSrc||q('.rh-logo img')?.src||'',utilityTop:rect('.rh-utility')?.top,headerTop:rect('.rh-header')?.top,utilityHeight:rect('.rh-utility')?.height};
              });
              if(!layout.headerLogoSrc.includes('wdcc-official-logo.webp')||layout.headerLogoWidth<70) throw Error(`MOBILE_HEADER_LOGO_BAD ${JSON.stringify(layout)}`);
              if(layout.menuDisplay==='none'||layout.gridDisplay!=='flex'||layout.cardWidth>360) throw Error(`MOBILE_COMPOSITION_BAD ${JSON.stringify(layout)}`);
              if(!['fixed','sticky'].includes(layout.headerPosition)||!['fixed','sticky'].includes(layout.utilityPosition)) throw Error(`MOBILE_PINNING_MODE_BAD ${JSON.stringify(layout)}`);
              if(Math.abs(Number(layout.utilityTop||0))>2||Math.abs(Number(layout.headerTop||0)-Number(layout.utilityHeight||0))>3) throw Error(`MOBILE_STACK_TOP_BAD ${JSON.stringify(layout)}`);
              await p.evaluate(()=>scrollTo(0,650)); await p.waitForTimeout(150);
              const after=await p.evaluate(()=>{const u=document.querySelector('.rh-utility')?.getBoundingClientRect(),h=document.querySelector('.rh-header')?.getBoundingClientRect();return{utilityTop:u?.top,utilityHeight:u?.height,headerTop:h?.top}});
              if(Math.abs(Number(after.utilityTop||0))>2||Math.abs(Number(after.headerTop||0)-Number(after.utilityHeight||0))>3) throw Error(`MOBILE_STACK_NOT_PINNED_AFTER_SCROLL ${JSON.stringify(after)}`);
              await p.evaluate(()=>scrollTo(0,0)); await p.waitForTimeout(100);
              const h1=p.locator('.rh-copy h1'); const hb=await h1.boundingBox();
              if(await h1.locator('span').count()!==3||!hb||hb.x<0||hb.x+hb.width>390) throw Error(`MOBILE_HEADLINE_BAD ${JSON.stringify(hb)}`);
              const hero=await p.locator('.rh-hero-art').boundingBox(); const copy=await p.locator('.rh-copy').boundingBox();
              if(!hero||!copy||hero.height>420||copy.height>500) throw Error(`MOBILE_HERO_SCALE_BAD ${JSON.stringify({hero,copy})}`);
              if(await p.locator('.rh-photo img[src*="wdcc-hero-v2.webp"]').count()) throw Error('INVENTORY_HERO_REUSE');
              if(await p.locator('.rh-card a[href*="/vehicle/"]').count()<1) throw Error('VEHICLE_LINKS_MISSING');
              const critical=failures.filter(x=>x.status>=500||(x.status===404&&/\/(vehicle|inventory)\//.test(x.url||'')));
              if(critical.length||consoleErrors.length) throw Error(`MOBILE_RUNTIME_ERRORS ${JSON.stringify({critical,consoleErrors})}`);
              await p.screenshot({path:'visual-proof/mobile-hero.png'}); await p.screenshot({path:'visual-proof/mobile-full.png',fullPage:true});
              evidence.mobile={intro,layout,after,headline:hb,hero,copy,failures,consoleErrors};
              await m.close();

              const d=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});
              const q=await d.newPage();
              await q.goto(`${url}/?desktop=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
              await waitImg(q,'.li-scene img',1000); await waitImg(q,'.li-badge img',200); await q.waitForTimeout(650); await q.screenshot({path:'visual-proof/desktop-intro.png'}); await waitIntroDone(q); await waitImg(q,'.rh-hero-art',1000); await waitImg(q,'.rh-logo img',200);
              const dl=await q.locator('.rh-logo img').evaluate(el=>{const b=el.getBoundingClientRect();return{src:el.currentSrc||el.src,w:b.width,h:b.height}});
              if(!dl.src.includes('wdcc-official-logo.webp')||dl.w<80) throw Error(`DESKTOP_HEADER_LOGO_BAD ${JSON.stringify(dl)}`);
              const dh=q.locator('.rh-copy h1'),db=await dh.boundingBox(); if(!db||db.x<0||db.x+db.width>1440) throw Error(`DESKTOP_HEADLINE_BAD ${JSON.stringify(db)}`);
              const desktopLayout=await q.evaluate(()=>({grid:getComputedStyle(document.querySelector('.rh-grid')).display,menu:getComputedStyle(document.querySelector('.rh-menu')).display}));
              if(desktopLayout.grid!=='grid'||desktopLayout.menu!=='none') throw Error(`DESKTOP_COMPOSITION_BAD ${JSON.stringify(desktopLayout)}`);
              await q.screenshot({path:'visual-proof/desktop-hero.png'}); await q.screenshot({path:'visual-proof/desktop-full.png',fullPage:true});
              evidence.desktop={logo:dl,headline:db,layout:desktopLayout};
              const dealer=await d.newPage(); await dealer.goto(`${url}/dealer?visual=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000}); await dealer.waitForTimeout(800); await dealer.screenshot({path:'visual-proof/dealer.png'}); evidence.dealer={url:dealer.url(),title:await dealer.title()};
              await d.close();
            } finally { await browser.close(); }
            fs.writeFileSync('visual-proof/metrics.json',JSON.stringify(evidence,null,2)+'\n');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Publish preview evidence summary
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          {
            echo '### WDCC Cloudflare visual gate'
            echo
            echo "Preview: ${URL:-not-created}"
            echo "Candidate SHA: $GITHUB_SHA"
            echo "Hero SHA-256: $EXPECTED_HERO_SHA256"
            echo 'Official round badge is rendered in intro and header.'
            echo 'Pinned utility/header behavior is verified before and after scroll.'
            echo 'Mobile carousel and mobile breakpoint are behaviorally verified.'
            echo 'Production domains, aliases, DNS and production routes remain unchanged.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-cloudflare-final-visual-proof
          path: |
            preview-url.txt
            visual-proof/
          if-no-files-found: warn
          retention-days: 7
