name: WDCC Cloudflare Preview

on:
  push:
    branches:
      - fix/wdcc-locked-contract-20260826
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-cloudflare-preview-locked
  cancel-in-progress: true

env:
  EXPECTED_HERO_SIZE: '145504'
  EXPECTED_HERO_SHA256: 1d7a0e4fced7450f2bbc66443d44b1f35bd9e24a6366308362aafa65576d3eb2

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact visual source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate locked visual inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test "$(wc -c < public/wdcc-hero-v2.webp | tr -d ' ')" = "$EXPECTED_HERO_SIZE"
          printf '%s  %s\n' "$EXPECTED_HERO_SHA256" public/wdcc-hero-v2.webp | sha256sum -c -
          test -s public/wdcc-logo-transparent.webp
          grep -q 'wdcc-hero-v2.webp' app/LockedIntro.tsx
          grep -q 'wdcc-logo-transparent.webp' app/LockedIntro.tsx
          grep -q 'wdcc-logo-transparent.webp' app/ReferenceCloneHome.tsx
          ! grep -q 'wdcc-official-logo.webp' app/LockedIntro.tsx
          ! grep -q 'wdcc-official-logo.webp' app/ReferenceCloneHome.tsx
          grep -q 'visual-perfect.css' app/layout.tsx

      - name: Build Cloudflare artifact
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets

      - name: Create isolated Worker config
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          cfg.name='wdcc-preview-locked';
          cfg.workers_dev=true;
          cfg.preview_urls=true;
          delete cfg.route;
          delete cfg.routes;
          fs.writeFileSync('wrangler.preview.jsonc',JSON.stringify(cfg,null,2)+'\n');
          NODE

      - name: Deploy isolated Cloudflare preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.preview.jsonc 2>&1 | tee /tmp/wdcc-preview.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wdcc-preview.log | tail -1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" | tee preview-url.txt

      - name: Smoke exact preview and canonical assets
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          code=000
          for i in $(seq 1 20); do
            code="$(curl -sS -L -o /tmp/home.html -w '%{http_code}' "$URL/?proof=$GITHUB_RUN_ID-$i" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          test "$code" = 200
          grep -qi "we don.t care" /tmp/home.html
          grep -q "wdcc-logo-transparent.webp" /tmp/home.html
          grep -q "wdcc-hero-v2.webp" /tmp/home.html
          test "$(curl -sS -L -o /tmp/hero.webp -w '%{http_code}' "$URL/wdcc-hero-v2.webp?proof=$GITHUB_RUN_ID")" = 200
          test "$(wc -c < /tmp/hero.webp | tr -d ' ')" = "$EXPECTED_HERO_SIZE"
          printf '%s  %s\n' "$EXPECTED_HERO_SHA256" /tmp/hero.webp | sha256sum -c -
          test "$(curl -sS -L -o /tmp/logo.webp -w '%{http_code}' "$URL/wdcc-logo-transparent.webp?proof=$GITHUB_RUN_ID")" = 200
          test -s /tmp/logo.webp
          test "$(curl -sS -L -o /tmp/inventory.json -w '%{http_code}' "$URL/api/inventory?proof=$GITHUB_RUN_ID")" = 200
          grep -qi 'items\|inventory' /tmp/inventory.json
          test "$(curl -sS -L -o /tmp/dealer.html -w '%{http_code}' "$URL/dealer?proof=$GITHUB_RUN_ID")" = 200
          grep -qi dealer /tmp/dealer.html

      - name: Install browser for visual proof
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture and validate desktop/mobile visual proof
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-proof
          node - <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const url=process.env.URL;
            if(!url) throw new Error('PREVIEW_URL_MISSING');
            const waitImage=async(page,selector,minWidth=100)=>{
              await page.locator(selector).waitFor({state:'visible',timeout:12000});
              await page.waitForFunction(({selector,minWidth})=>{
                const el=document.querySelector(selector);
                return !!el && el.complete===true && Number(el.naturalWidth||0)>=minWidth;
              },{selector,minWidth},{timeout:12000});
              return page.locator(selector).evaluate(el=>({naturalWidth:el.naturalWidth,naturalHeight:el.naturalHeight,src:el.currentSrc||el.src}));
            };
            const browser=await chromium.launch({headless:true});
            const evidence={preview:url,sha:process.env.GITHUB_SHA,mobile:{},desktop:{},dealer:{}};
            try{
              const mobile=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
              const page=await mobile.newPage();
              await page.goto(`${url}/?visual=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
              const introHero=await waitImage(page,'.li-scene img',1000);
              const introLogo=await waitImage(page,'.li-badge img',200);
              await page.waitForTimeout(900);
              await page.screenshot({path:'visual-proof/mobile-intro.png',fullPage:false});
              await page.getByRole('button',{name:/skip intro/i}).click({timeout:5000});
              const mobileHero=await waitImage(page,'.rh-hero-art',1000);
              const h1=page.locator('.rh-copy h1');
              await h1.waitFor({state:'visible',timeout:5000});
              const mobileBox=await h1.boundingBox();
              const mobileSpanCount=await h1.locator('span').count();
              if(mobileSpanCount!==3) throw new Error(`MOBILE_HEADLINE_SPANS_${mobileSpanCount}`);
              if(!mobileBox||mobileBox.x<0||mobileBox.x+mobileBox.width>390) throw new Error('MOBILE_HEADLINE_OVERFLOW');
              if(await page.locator('.rh-photo img[src*="wdcc-hero-v2.webp"]').count()) throw new Error('INVENTORY_REUSES_CHALLENGER_HERO');
              const callSean=page.getByRole('link',{name:/call sean/i});
              if(await callSean.count()<1) throw new Error('MOBILE_CALL_SEAN_MISSING');
              await page.screenshot({path:'visual-proof/mobile-hero.png',fullPage:false});
              await page.screenshot({path:'visual-proof/mobile-full.png',fullPage:true});
              evidence.mobile={introHero,introLogo,mobileHero,headline:mobileBox,headlineSpans:mobileSpanCount};
              await mobile.close();

              const desktop=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});
              const desk=await desktop.newPage();
              await desk.goto(`${url}/?desktop=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
              await waitImage(desk,'.li-scene img',1000);
              await waitImage(desk,'.li-badge img',200);
              await desk.waitForTimeout(900);
              await desk.screenshot({path:'visual-proof/desktop-intro.png',fullPage:false});
              await desk.getByRole('button',{name:/skip intro/i}).click({timeout:5000});
              const desktopHero=await waitImage(desk,'.rh-hero-art',1000);
              const desktopHeadline=desk.locator('.rh-copy h1');
              await desktopHeadline.waitFor({state:'visible',timeout:5000});
              const desktopBox=await desktopHeadline.boundingBox();
              if(!desktopBox||desktopBox.x<0||desktopBox.x+desktopBox.width>1440) throw new Error('DESKTOP_HEADLINE_OVERFLOW');
              if(await desk.locator('.rh-photo img[src*="wdcc-hero-v2.webp"]').count()) throw new Error('DESKTOP_INVENTORY_REUSES_CHALLENGER_HERO');
              await desk.screenshot({path:'visual-proof/desktop-hero.png',fullPage:false});
              await desk.screenshot({path:'visual-proof/desktop-full.png',fullPage:true});
              evidence.desktop={desktopHero,headline:desktopBox,headlineSpans:await desktopHeadline.locator('span').count()};
              const dealer=await desktop.newPage();
              await dealer.goto(`${url}/dealer?visual=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
              await dealer.waitForTimeout(900);
              await dealer.screenshot({path:'visual-proof/dealer.png',fullPage:false});
              evidence.dealer={url:dealer.url(),title:await dealer.title()};
              await desktop.close();
            } finally { await browser.close(); }
            fs.writeFileSync('visual-proof/metrics.json',JSON.stringify(evidence,null,2)+'\n');
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE

      - name: Publish preview evidence summary
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          {
            echo '### WDCC Cloudflare final visual gate'
            echo
            echo "Preview: ${URL:-not-created}"
            echo "Candidate SHA: $GITHUB_SHA"
            echo "Hero SHA-256: $EXPECTED_HERO_SHA256"
            echo 'Canonical hero/logo bytes: enforced.'
            echo 'Inventory hero-reuse: forbidden.'
            echo 'Mobile + desktop screenshots: required.'
            echo 'Production domains, aliases, DNS and production routes: unchanged.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-cloudflare-final-visual-proof
          path: |
            preview-url.txt
            visual-proof/
          if-no-files-found: warn
          retention-days: 7
