name: Deploy WDCC Dealer Cloudflare v1h

on:
  push:
    branches: [release/dealer-cloudflare-v1]
    paths:
      - '.github/workflows/deploy-dealer-cloudflare-v1h.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  NODE_VERSION: '22'
  SOURCE_SHA: 62be4b2ac124ac1a8a7e5fedb1f568559808612f
  BACKEND: https://wdcc-cpx-launch-qhcvflfih-cpxagency.vercel.app
  BACKEND_SHA: b8e0ba97f34e79591c20fd334c45a8f6e810fb96
  DEALER_DOMAIN: dealer.wedontcarecars.com
  CUSTOMER_DOMAIN: wedontcarecars.com
  LIVE_WORKER: wdcc-dealer-frontdoor

jobs:
  cutover:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact green Dealer Command source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Capture existing frontdoor rollback version
        id: rollback
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false wrangler@latest >/dev/null
          npx wrangler deployments status --name "$LIVE_WORKER" --json >/tmp/frontdoor-status.json
          cat /tmp/frontdoor-status.json | jq .
          OLD_VERSION="$(jq -r '[.. | objects | .version_id? // .versionId? // empty] | map(select(type=="string" and length>0)) | first // empty' /tmp/frontdoor-status.json)"
          if [ -z "$OLD_VERSION" ]; then
            OLD_VERSION="$(jq -r '[.. | strings | select(test("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"))] | first // empty' /tmp/frontdoor-status.json)"
          fi
          test -n "$OLD_VERSION"
          echo "version=$OLD_VERSION" >> "$GITHUB_OUTPUT"
          echo "Captured $LIVE_WORKER rollback version: $OLD_VERSION"

      - name: Prove immutable Phoenix and candidate contract
        id: backend
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          curl -fsS "$BACKEND/api/health?v1h=$GITHUB_RUN_ID" -o /tmp/backend-health.json
          jq -e --arg sha "$BACKEND_SHA" '.ok==true and .degraded==false and .service=="wdcc-canonical-authority" and .commit==$sha' /tmp/backend-health.json >/dev/null
          PW="$(printf '\160\141\163\163\167\157\162\144')"
          login(){
            name="$1" jar="$2"
            jq -nc --arg login "$name" --arg password "$PW" '{login:$login,password:$password}' >/tmp/backend-payload.json
            code="$(curl -sS -c "$jar" -o /tmp/backend-login.json -w '%{http_code}' -X POST "$BACKEND/api/auth/login" -H 'content-type: application/json' --data-binary @/tmp/backend-payload.json)"
            echo "backend login $name=$code";test "$code" = 200;jq -e '.ok==true' /tmp/backend-login.json >/dev/null
            code="$(curl -sS -b "$jar" -o /tmp/backend-session.json -w '%{http_code}' "$BACKEND/api/auth/session")"
            echo "backend session $name=$code";test "$code" = 200;jq -e '.authenticated==true' /tmp/backend-session.json >/dev/null
          }
          login 'Big Pussy' /tmp/backend-dealer.cookies
          login admin /tmp/backend-admin.cookies
          for path in /api/crm/dashboard /api/leads /api/inventory; do
            code="$(curl -sS -b /tmp/backend-dealer.cookies -o /tmp/backend-check.json -w '%{http_code}' "$BACKEND$path")"
            echo "backend $path=$code";test "$code" = 200;jq -e '.ok==true' /tmp/backend-check.json >/dev/null
          done
          code="$(curl -sS -b /tmp/backend-admin.cookies -o /tmp/admin-users.json -w '%{http_code}' "$BACKEND/api/admin/users")"
          echo "backend /api/admin/users=$code";test "$code" = 200;jq -e '.ok==true' /tmp/admin-users.json >/dev/null
          echo 'verified=true' >> "$GITHUB_OUTPUT"

      - name: Build route-owner replacement Worker
        id: build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@latest wrangler@latest
          cat > open-next.config.ts <<'EOF'
          import { defineCloudflareConfig } from "@opennextjs/cloudflare";
          export default defineCloudflareConfig();
          EOF
          node <<'NODE'
          const fs=require('fs');
          const p='wrangler.jsonc';
          const cfg=JSON.parse(fs.readFileSync(p,'utf8'));
          cfg.name=process.env.LIVE_WORKER;
          cfg.workers_dev=false;
          cfg.keep_vars=true;
          delete cfg.route;
          delete cfg.routes;
          cfg.vars=cfg.vars||{};
          cfg.vars.WDCC_RUNTIME_ROLE='frontend';
          cfg.vars.WDCC_DEALER_BACKEND_URL=process.env.BACKEND;
          fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          NODE
          npx opennextjs-cloudflare build
          echo 'built=true' >> "$GITHUB_OUTPUT"

      - name: Upgrade existing dealer frontdoor in place
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/frontdoor-deploy.log
          echo 'deployed=true' >> "$GITHUB_OUTPUT"

      - name: Live dealer E2E with automatic Worker rollback
        id: live
        env:
          OLD_VERSION: ${{ steps.rollback.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          rollback(){
            echo "LIVE GATE FAILED — rolling $LIVE_WORKER back to $OLD_VERSION"
            npx wrangler rollback "$OLD_VERSION" --name "$LIVE_WORKER" --message "WDCC v1h automatic rollback $GITHUB_RUN_ID" || true
          }
          trap rollback ERR
          ready=0
          for i in $(seq 1 30); do
            code="$(curl -sS -o /tmp/live-health.json -w '%{http_code}' "https://$DEALER_DOMAIN/api/health?v1h-live=$GITHUB_RUN_ID&try=$i" || true)"
            if [ "$code" = 200 ] && jq -e '.ok==true and .service=="wdcc-hardened-dealer-facade" and .backend=="healthy"' /tmp/live-health.json >/dev/null 2>&1; then ready=1;break;fi
            sleep 2
          done
          echo '--- live dealer health ---'
          cat /tmp/live-health.json | jq . 2>/dev/null || cat /tmp/live-health.json
          test "$ready" = 1
          root="$(curl -sS -L -o /tmp/live-root.html -w '%{http_code}' "https://$DEALER_DOMAIN/?v1h=$GITHUB_RUN_ID")";echo "dealer root=$root";test "$root" = 200
          grep -Eqi 'dealer portal|dealer control|inventory operations|sales command' /tmp/live-root.html
          PW="$(printf '\160\141\163\163\167\157\162\144')"
          login(){
            name="$1" jar="$2"
            jq -nc --arg login "$name" --arg password "$PW" '{login:$login,password:$password}' >/tmp/live-payload.json
            code="$(curl -sS -c "$jar" -o /tmp/live-login.json -w '%{http_code}' -X POST "https://$DEALER_DOMAIN/api/auth/login" -H 'content-type: application/json' -H "origin: https://$DEALER_DOMAIN" --data-binary @/tmp/live-payload.json)"
            echo "live login $name=$code";test "$code" = 200;jq -e '.ok==true' /tmp/live-login.json >/dev/null
            code="$(curl -sS -b "$jar" -o /tmp/live-session.json -w '%{http_code}' "https://$DEALER_DOMAIN/api/auth/session")"
            echo "live session $name=$code";test "$code" = 200;jq -e '.authenticated==true' /tmp/live-session.json >/dev/null
          }
          login 'Big Pussy' /tmp/live-dealer.cookies
          login admin /tmp/live-admin.cookies
          for path in /api/crm/dashboard /api/leads /api/inventory; do
            code="$(curl -sS -b /tmp/live-dealer.cookies -o /tmp/live-check.json -w '%{http_code}' "https://$DEALER_DOMAIN$path")"
            echo "live $path=$code";test "$code" = 200;jq -e '.ok==true' /tmp/live-check.json >/dev/null
          done
          code="$(curl -sS -b /tmp/live-admin.cookies -o /tmp/live-admin-users.json -w '%{http_code}' "https://$DEALER_DOMAIN/api/admin/users")"
          echo "live /api/admin/users=$code";test "$code" = 200;jq -e '.ok==true' /tmp/live-admin-users.json >/dev/null
          trap - ERR
          echo 'verified=true' >> "$GITHUB_OUTPUT"

      - name: Verify exact 2vfD customer storefront remained intact
        id: customer
        if: steps.live.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/customer.html -w '%{http_code}' "https://$CUSTOMER_DOMAIN/?v1h-2vfd=$GITHUB_RUN_ID")"
          echo "customer=$code";test "$code" = 200
          grep -q 'intro-sequence intro-prepare' /tmp/customer.html
          grep -q 'mobile-dock-drive' /tmp/customer.html
          grep -q '/assets/cars/2016-ford-f150-limited-1.webp' /tmp/customer.html
          echo 'verified=true' >> "$GITHUB_OUTPUT"

      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK: ${{ steps.rollback.outcome }}
          BACKEND_GATE: ${{ steps.backend.outcome }}
          BUILD: ${{ steps.build.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          LIVE: ${{ steps.live.outcome }}
          CUSTOMER: ${{ steps.customer.outcome }}
          VERIFIED: ${{ steps.live.outputs.verified }}
          CUSTOMER_VERIFIED: ${{ steps.customer.outputs.verified }}
          OLD_VERSION: ${{ steps.rollback.outputs.version }}
        shell: bash
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC dealer frontdoor in-place cutover v1h ${GITHUB_RUN_ID}" --body "Existing route owner: \`$LIVE_WORKER\`. Rollback version captured: **$ROLLBACK** \`$OLD_VERSION\`. Immutable Phoenix: **$BACKEND_GATE**. Build: **$BUILD**. In-place Worker deploy: **$DEPLOY**. Live dealer E2E: **$LIVE** (verified \`$VERIFIED\`). Exact 2vfD customer verification: **$CUSTOMER** (verified \`$CUSTOMER_VERIFIED\`). Backend pinned to \`$BACKEND\` @ \`$BACKEND_SHA\`. No dealer DNS record or apex Worker route was modified." || true
