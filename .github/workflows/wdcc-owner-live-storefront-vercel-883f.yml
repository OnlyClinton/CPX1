name: WDCC Owner Live Storefront Vercel 883f

on:
  push:
    branches: [proof/wdcc-522-immutable-parser-20260829]
    paths:
      - '.github/workflows/wdcc-owner-live-storefront-vercel-883f.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-owner-live-storefront
  cancel-in-progress: false

jobs:
  storefront-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FROZEN_SHA: 883f211f345f69967ffad84c3dec3ff36e4f0aee
      TEAM_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      TEAM: cpxagency
      PROJECT_ID: prj_We7xkAkB5Qy31Pt17USSkQFE0u7h
      OLD_DEPLOYMENT_ID: dpl_2vfDGZg6erycSF6Pmwo6yPbFSaxp
      OLD_DEPLOYMENT_URL: https://wdcc-v32-storefront-a2wntmnnn-cpxagency.vercel.app
      APP_URL: https://wdcc-proof-04c5d526.clico-global.workers.dev
      PROD_ROOT: https://wedontcarecars.com
      PROD_WWW: https://www.wedontcarecars.com
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fail closed on current production owner and frozen source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test "$(git rev-parse "$FROZEN_SHA")" = "$FROZEN_SHA"
          current="$(curl -fsS "https://api.vercel.com/v13/deployments/wedontcarecars.com?teamId=$TEAM_ID" -H "Authorization: Bearer $VERCEL_TOKEN")"
          echo "CURRENT_PROJECT=$(jq -r '.name // empty' <<<"$current")"
          echo "CURRENT_DEPLOYMENT=$(jq -r '.id // empty' <<<"$current")"
          jq -e --arg p "$PROJECT_ID" --arg d "$OLD_DEPLOYMENT_ID" '.projectId==$p and .id==$d' <<<"$current" >/dev/null
          echo 'CURRENT_STOREFRONT_OWNER=PASS'
      - name: Extract exact frozen source and create deployment-only config
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wdcc-storefront-live && mkdir -p /tmp/wdcc-storefront-live
          git archive "$FROZEN_SHA" | tar -x -C /tmp/wdcc-storefront-live
          mkdir -p /tmp/wdcc-storefront-live/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$TEAM_ID" "$PROJECT_ID" > /tmp/wdcc-storefront-live/.vercel/project.json
          node - <<'NODE'
          const fs=require('fs');
          const p='/tmp/wdcc-storefront-live/vercel.json';
          const c=JSON.parse(fs.readFileSync(p,'utf8'));
          if(!Array.isArray(c.crons)||c.crons.length!==1) throw new Error('expected frozen cron missing');
          delete c.crons;
          fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');
          console.log('DEPLOYMENT_ONLY_DELTA=REMOVE_UNSUPPORTED_HOBBY_CRON');
          console.log('APP_SOURCE_DELTA=NONE');
          NODE
          sha256sum /tmp/wdcc-storefront-live/public/wdcc-hero-v2.webp | awk '{print $1}' >/tmp/frozen-hero-sha
      - name: Stage production-environment storefront without assigning domains
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          npm install --global vercel@59.5.0 >/dev/null
          cd /tmp/wdcc-storefront-live
          VERCEL_ORG_ID="$TEAM_ID" VERCEL_PROJECT_ID="$PROJECT_ID" \
            vercel deploy --prod --skip-domain --yes --token="$VERCEL_TOKEN" --scope="$TEAM" \
            --env "WDCC_RUNTIME_ROLE=frontend" \
            --env "WDCC_DEALER_BACKEND_URL=$APP_URL" 2>&1 | tee /tmp/storefront-stage.log
          url="$(grep -Eo 'https://[^ ]+\.vercel\.app' /tmp/storefront-stage.log | tail -1)"; test -n "$url"
          host="${url#https://}"
          meta="$(curl -fsS "https://api.vercel.com/v13/deployments/$host?teamId=$TEAM_ID" -H "Authorization: Bearer $VERCEL_TOKEN")"
          id="$(jq -r '.id // empty' <<<"$meta")"; test -n "$id"; test "$id" != "$OLD_DEPLOYMENT_ID"
          echo "url=$url" >> "$GITHUB_OUTPUT"; echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "STAGED_URL=$url"
          echo "STAGED_DEPLOYMENT_ID=$id"
          echo 'PRODUCTION_DOMAINS_ASSIGNED=NO'
      - name: Prove staged exact storefront and P0 API boundary
        shell: bash
        env:
          STAGED_URL: ${{ steps.stage.outputs.url }}
        run: |
          set -euo pipefail
          hero_sha="$(cat /tmp/frozen-hero-sha)"
          code=000
          for i in $(seq 1 15); do
            code="$(curl --http1.1 -sS -L -o /tmp/stage-root -w '%{http_code}' "$STAGED_URL/?stage=$i" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          [ "$code" = 200 ]
          grep -Fqi "BAD CREDIT" /tmp/stage-root
          code="$(curl --http1.1 -sS -L -o /tmp/stage-inventory-page -w '%{http_code}' "$STAGED_URL/inventory?stage=1")"; [ "$code" = 200 ]
          code="$(curl --http1.1 -sS -D /tmp/stage-invh -o /tmp/stage-inv -w '%{http_code}' "$STAGED_URL/api/inventory?stage=1")"; [ "$code" = 200 ]
          tr -d '\r' </tmp/stage-invh >/tmp/stage-invhn; ! grep -Eiq '^x-wdcc-mockup-preview:' /tmp/stage-invhn
          jq -e '.count==5 and (.items|length)==5 and (.mockupPreview!=true) and ([.items[].status]|all(.=="published"))' /tmp/stage-inv >/dev/null
          code="$(curl --http1.1 -sS -o /tmp/stage-health -w '%{http_code}' "$STAGED_URL/api/health?stage=1")"; [ "$code" = 200 ]
          jq -e '.ok==true and .state=="readable" and .storage=="cloudflare-do"' /tmp/stage-health >/dev/null
          code="$(curl --http1.1 -sS -L -o /tmp/stage-hero -w '%{http_code}' "$STAGED_URL/wdcc-hero-v2.webp?stage=1")"; [ "$code" = 200 ]; [ "$(sha256sum /tmp/stage-hero|awk '{print $1}')" = "$hero_sha" ]
          code="$(curl --http1.1 -sS -L -o /tmp/stage-dealer -w '%{http_code}' "$STAGED_URL/dealer?stage=1")"; [ "$code" = 200 ]
          code="$(curl --http1.1 -sS -L -o /tmp/stage-add -w '%{http_code}' "$STAGED_URL/dealer/inventory/new?stage=1")"; [ "$code" = 200 ]
          code="$(curl --http1.1 -sS -o /tmp/stage-session -w '%{http_code}' "$STAGED_URL/api/auth/session?stage=1")"; [ "$code" = 200 ]
          jq -e '.authenticated==false' /tmp/stage-session >/dev/null
          echo 'STAGED_STOREFRONT=PASS'
      - name: Promote staged storefront to existing production aliases and verify
        shell: bash
        env:
          STAGED_URL: ${{ steps.stage.outputs.url }}
          STAGED_ID: ${{ steps.stage.outputs.id }}
        run: |
          set -euo pipefail
          touch /tmp/storefront-promoted
          cd /tmp/wdcc-storefront-live
          VERCEL_ORG_ID="$TEAM_ID" VERCEL_PROJECT_ID="$PROJECT_ID" vercel promote "$STAGED_URL" --yes --token="$VERCEL_TOKEN" --scope="$TEAM"
          sleep 3
          current="$(curl -fsS "https://api.vercel.com/v13/deployments/wedontcarecars.com?teamId=$TEAM_ID" -H "Authorization: Bearer $VERCEL_TOKEN")"
          jq -e --arg id "$STAGED_ID" '.id==$id' <<<"$current" >/dev/null
          hero_sha="$(cat /tmp/frozen-hero-sha)"
          for origin in "$PROD_ROOT" "$PROD_WWW"; do
            code="$(curl --http1.1 -sS -L --max-redirs 5 -o /tmp/live-root -w '%{http_code}' "$origin/?live=$GITHUB_RUN_ID")"; [ "$code" = 200 ]; grep -Fqi "BAD CREDIT" /tmp/live-root
            code="$(curl --http1.1 -sS -o /tmp/live-inv -w '%{http_code}' "$origin/api/inventory?live=$GITHUB_RUN_ID")"; [ "$code" = 200 ]; jq -e '.count==5 and (.items|length)==5 and (.mockupPreview!=true)' /tmp/live-inv >/dev/null
          done
          code="$(curl --http1.1 -sS -o /tmp/live-health -w '%{http_code}' "$PROD_ROOT/api/health?live=$GITHUB_RUN_ID")"; [ "$code" = 200 ]; jq -e '.ok==true and .state=="readable" and .storage=="cloudflare-do"' /tmp/live-health >/dev/null
          code="$(curl --http1.1 -sS -L -o /tmp/live-hero -w '%{http_code}' "$PROD_ROOT/wdcc-hero-v2.webp?live=$GITHUB_RUN_ID")"; [ "$code" = 200 ]; [ "$(sha256sum /tmp/live-hero|awk '{print $1}')" = "$hero_sha" ]
          echo 'STOREFRONT_LIVE=PASS'
      - name: Record live storefront evidence
        if: success()
        shell: bash
        env:
          STAGED_ID: ${{ steps.stage.outputs.id }}
          STAGED_URL: ${{ steps.stage.outputs.url }}
        run: |
          {
            echo '### WDCC STOREFRONT LIVE — PASS'
            echo "Frozen SHA: $FROZEN_SHA"
            echo "Vercel deployment: $STAGED_ID"
            echo "Immutable URL: $STAGED_URL"
            echo "Previous deployment: $OLD_DEPLOYMENT_ID"
            echo 'wedontcarecars.com + www: PASS'
            echo 'P0 inventory/health boundary: PASS'
            echo 'Cloudflare DNS/routes: UNCHANGED'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Roll back production aliases on any post-promotion failure
        if: failure()
        shell: bash
        run: |
          set +e
          if [ -f /tmp/storefront-promoted ]; then
            npm install --global vercel@59.5.0 >/dev/null 2>&1 || true
            VERCEL_ORG_ID="$TEAM_ID" VERCEL_PROJECT_ID="$PROJECT_ID" vercel promote "$OLD_DEPLOYMENT_URL" --yes --token="$VERCEL_TOKEN" --scope="$TEAM" || true
            sleep 3
            echo "ROLLBACK_ROOT_HTTP=$(curl --http1.1 -sS -L -o /dev/null -w '%{http_code}' "$PROD_ROOT/?rollback=$GITHUB_RUN_ID" || true)"
            echo 'STOREFRONT_ROLLBACK_ATTEMPTED=YES'
          else
            echo 'PRODUCTION_ALIASES_WERE_NOT_MUTATED=YES'
          fi
