name: WDCC Android Desktop-Site Lower Page Proof

on:
  push:
    branches:
      - fix/wdcc-locked-contract-20260826
      - fix/wdcc-owner-board-final-lock-20260827
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-android-lower-page-${{ github.sha }}
  cancel-in-progress: false

jobs:
  android-desktop-site-lower-page:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Lock final owner-board source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -s app/wdcc-owner-board-final.css
          test -s app/wdcc-review-media/[id]/route.ts
          grep -Fq 'owner-board-finance-grid' app/ReferenceCloneHome.tsx
          grep -Fq 'owner-board-trust-grid' app/ReferenceCloneHome.tsx
          grep -Fq 'src="/wdcc-owner-logo"' app/WdccPublicChrome.tsx
          grep -Fq 'recoveredSourceText' app/wdcc-review-media/[id]/route.ts
          grep -Fq 'contents-api' app/wdcc-review-media/[id]/route.ts

      - name: Build exact Cloudflare candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0 playwright@1.55.0
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets
          test -s .next/BUILD_ID
          npx playwright install --with-deps chromium >/dev/null

      - name: Create exact-SHA no-route Worker
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          cfg.name=`wdal-${process.env.GITHUB_SHA}`;
          cfg.workers_dev=true;
          cfg.preview_urls=true;
          delete cfg.route;
          delete cfg.routes;
          fs.writeFileSync('wrangler.android-lower.jsonc',JSON.stringify(cfg,null,2)+'\n');
          NODE
          ! grep -qi 'wedontcarecars.com' wrangler.android-lower.jsonc
          grep -Fq "$GITHUB_SHA" wrangler.android-lower.jsonc

      - name: Deploy immutable isolated lower-page preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.android-lower.jsonc 2>&1 | tee /tmp/wdcc-android-lower.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wdcc-android-lower.log | tail -1)"
          test -n "$url"
          case "$url" in *"$GITHUB_SHA"*) ;; *) echo "Not exact SHA: $url" >&2; exit 1;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > android-lower-preview-url.txt

      - name: Verify recovered first-party media routes
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-lower-proof
          for id in nissan350z fordF150 hondaPilot kiaSportage toyotaRav4; do
            code=000
            for i in $(seq 1 8); do
              code="$(curl --http1.1 -sS -D "/tmp/$id.headers" -L -o "/tmp/$id.webp" -w '%{http_code}' "$URL/wdcc-review-media/$id?lower-media=$GITHUB_RUN_ID-$i" || true)"
              [ "$code" = 200 ] && break
              sleep 2
            done
            test "$code" = 200
            test -s "/tmp/$id.webp"
            grep -qi '^content-type: image/webp' "/tmp/$id.headers"
            grep -qi '^x-wdcc-media-truth: verified-first-party-recovery' "/tmp/$id.headers"
          done

      - name: Prove 980px Android Desktop-Site board
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {chromium} from 'playwright';
          const base=process.env.URL,out='android-lower-proof';
          const ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36';
          fs.mkdirSync(out,{recursive:true});
          const browser=await chromium.launch({headless:true});
          const writes=[];
          try{
            const ctx=await browser.newContext({viewport:{width:980,height:844},screen:{width:980,height:844},deviceScaleFactor:1,isMobile:false,hasTouch:true,userAgent:ua,reducedMotion:'no-preference'});
            const page=await ctx.newPage();
            page.on('request',r=>{if(['POST','PUT','PATCH','DELETE'].includes(r.method()))writes.push({method:r.method(),url:r.url()})});
            const response=await page.goto(`${base}/?owner-review=1&desktop-lower=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
            if(!response||response.status()!==200)throw new Error(`ANDROID_LOWER_HOME_HTTP_${response?.status()||0}`);
            const skip=page.getByRole('button',{name:/skip intro/i});if(await skip.count())await skip.click().catch(()=>{});
            await page.locator('.wdccOwnerReviewBanner').waitFor({state:'visible',timeout:10000});
            await page.locator('.rh-grid > article').first().waitFor({state:'visible',timeout:10000});
            await page.waitForFunction(()=>{const imgs=[...document.querySelectorAll('.rh-grid > article img')];return imgs.length===5&&imgs.every(i=>i.complete&&i.naturalWidth>20&&i.naturalHeight>20)},null,{timeout:20000});
            const r=await page.evaluate(()=>{
              const q=s=>document.querySelector(s),R=e=>{const x=e?.getBoundingClientRect();return x?{x:x.x,y:x.y,w:x.width,h:x.height,right:x.right,bottom:x.bottom}:null};
              const grid=q('.rh-grid'),gs=getComputedStyle(grid),cards=[...grid.children].map(R),imgs=[...grid.querySelectorAll('img')].map(i=>({src:i.getAttribute('src')||'',naturalWidth:i.naturalWidth,naturalHeight:i.naturalHeight})),buttons=[...document.querySelectorAll('.rh-hero-actions .rh-btn')].map(R),utility=q('[data-wdcc-public-chrome="utility"]'),header=q('[data-wdcc-public-chrome="header"]'),hero=q('.rh-hero');
              return{utility:R(utility),header:R(header),hero:R(hero),buttons,benefits:getComputedStyle(q('.rh-benefits')).gridTemplateColumns.split(/\s+/).filter(Boolean).length,gridDisplay:gs.display,gridTracks:gs.gridTemplateColumns.split(/\s+/).filter(Boolean).length,cards,imgs,placeholders:grid.querySelectorAll('[role="img"][aria-label*="photo unavailable" i]').length,dots:q('.rh-mobile-dots')?getComputedStyle(q('.rh-mobile-dots')).display:'none',finance:getComputedStyle(q('.rh-steps')).gridTemplateColumns.split(/\s+/).filter(Boolean).length,trust:getComputedStyle(q('.rh-trust-grid')).gridTemplateColumns.split(/\s+/).filter(Boolean).length,overflow:document.documentElement.scrollWidth-innerWidth};
            });
            if(!r.utility||r.utility.h<28)throw Error(`ANDROID_LOWER_UTILITY_${JSON.stringify(r)}`);
            if(!r.header||r.header.h<70||r.header.h>80)throw Error(`ANDROID_LOWER_HEADER_${JSON.stringify(r)}`);
            if(!r.hero||Math.abs(r.hero.y-r.header.bottom)>3||r.hero.h<490)throw Error(`ANDROID_LOWER_HERO_${JSON.stringify(r)}`);
            if(r.buttons.length!==2||Math.abs(r.buttons[0].y-r.buttons[1].y)>3||r.buttons.some(b=>!b||b.w<160))throw Error(`ANDROID_LOWER_CTAS_${JSON.stringify(r)}`);
            if(r.benefits!==4)throw Error(`ANDROID_LOWER_BENEFITS_${JSON.stringify(r)}`);
            if(r.gridDisplay!=='grid'||r.gridTracks!==5||r.cards.length!==5||r.cards.some(c=>!c||c.w<170||c.w>200))throw Error(`ANDROID_LOWER_FEATURED_GEOMETRY_${JSON.stringify(r)}`);
            if(r.placeholders!==0||r.imgs.length!==5||r.imgs.some(i=>!i.src.startsWith('/wdcc-review-media/')||i.naturalWidth<20||i.naturalHeight<20))throw Error(`ANDROID_LOWER_FEATURED_MEDIA_${JSON.stringify(r)}`);
            if(r.dots!=='none'||r.finance!==4||r.trust!==4||r.overflow>2||writes.length)throw Error(`ANDROID_LOWER_FINAL_${JSON.stringify({r,writes})}`);
            await page.screenshot({path:`${out}/android-desktop-site-lower-full.png`,fullPage:true});
            fs.writeFileSync(`${out}/result.json`,JSON.stringify({sha:process.env.GITHUB_SHA,url:base,result:r,writes,pass:true},null,2)+'\n');
            console.log('WDCC_ANDROID_LOWER_PAGE_PASS',JSON.stringify({header:r.header.h,featured:r.gridTracks,cardW:r.cards[0].w,photos:r.imgs.length,overflow:r.overflow,writes:writes.length}));
            await ctx.close();
          }finally{await browser.close()}
          NODE

      - name: Require exact current head
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test -n "$current"
          test "$current" = "$GITHUB_SHA"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-android-lower-page-${{ github.sha }}
          path: |
            android-lower-preview-url.txt
            android-lower-proof/
          if-no-files-found: warn
          retention-days: 7
