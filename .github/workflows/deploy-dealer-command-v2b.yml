name: Deploy WDCC Dealer Command v2b
on:
  push:
    branches: [release/dealer-command-v2]
    paths:
      - '.github/workflows/deploy-dealer-command-v2b.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deploy-and-gate:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM: cpxagency
      TEAM_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      DEALER_PROJECT_ID: prj_fz5mN7Q5gImZ9UGpv1GDpHxPtLNB
      BLOB_STORE_ID: store_cNUyQRVlXtyvZQ5N
      B01: wdcc-cpx-launch-b01un0onc-cpxagency.vercel.app
      DEALER_DOMAIN: dealer.wedontcarecars.com
      DEALER_PROJECT_ALIAS: wdcc-dealer-portal-cpxagency.vercel.app
      STOREFRONT: wedontcarecars.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.3.0 >/dev/null

      - name: Configure dealer authority without stale Blob token
        id: env
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          FALLBACK_SECRET="$(openssl rand -base64 72 | tr -d '\n')"
          printf '::add-mask::%s\n' "$FALLBACK_SECRET"
          api="https://api.vercel.com/v10/projects/${DEALER_PROJECT_ID}/env?upsert=true&teamId=${TEAM_ID}"
          upsert(){
            key="$1" value="$2" type="$3"
            jq -n --arg k "$key" --arg v "$value" --arg t "$type" '{key:$k,value:$v,type:$t,target:["production","preview"]}' >/tmp/env-payload.json
            curl -fsS -X POST "$api" -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/env-payload.json >/tmp/env-response.json
          }
          upsert BLOB_STORE_ID "$BLOB_STORE_ID" plain
          upsert SESSION_SECRET "$FALLBACK_SECRET" sensitive
          upsert WDCC_RUNTIME_ROLE backend plain
          upsert WDCC_DEALER_BACKEND_URL "https://${B01}" plain
          upsert WDCC_SESSION_BACKEND_URL "https://${B01}" plain

          curl -fsS "https://api.vercel.com/v10/projects/${DEALER_PROJECT_ID}/env?teamId=${TEAM_ID}" -H "Authorization: Bearer $VERCEL_TOKEN" >/tmp/dealer-envs.json
          jq -r '.envs[]|select(.key=="BLOB_READ_WRITE_TOKEN")|.id' /tmp/dealer-envs.json >/tmp/stale-blob-env-ids || true
          while read -r id; do
            [ -n "$id" ] || continue
            curl -fsS -X DELETE "https://api.vercel.com/v9/projects/${DEALER_PROJECT_ID}/env/${id}?teamId=${TEAM_ID}" -H "Authorization: Bearer $VERCEL_TOKEN" >/dev/null
          done </tmp/stale-blob-env-ids

          curl -fsS "https://api.vercel.com/v10/projects/${DEALER_PROJECT_ID}/env?teamId=${TEAM_ID}" -H "Authorization: Bearer $VERCEL_TOKEN" >/tmp/dealer-envs-after.json
          jq -e '[.envs[]|select(.key=="BLOB_STORE_ID" and (.target|index("production")!=null))]|length>=1' /tmp/dealer-envs-after.json >/dev/null
          jq -e '[.envs[]|select(.key=="SESSION_SECRET" and .type=="sensitive" and (.target|index("production")!=null))]|length>=1' /tmp/dealer-envs-after.json >/dev/null
          jq -e '[.envs[]|select(.key=="BLOB_READ_WRITE_TOKEN")]|length==0' /tmp/dealer-envs-after.json >/dev/null
          echo 'authority_synced=true' >> "$GITHUB_OUTPUT"

      - name: Build dealer project with production bindings
        id: build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$TEAM_ID" "$DEALER_PROJECT_ID" > .vercel/project.json
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" >/dev/null
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel build --prod --token="$VERCEL_TOKEN" --scope="$TEAM"
          echo 'built=true' >> "$GITHUB_OUTPUT"

      - name: Deploy prebuilt dealer candidate
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" --scope="$TEAM" 2>&1 | tee /tmp/deploy.out
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' /tmp/deploy.out | head -1 | sed 's#https://##')"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Dealer candidate: https://$url"

      - name: Gate project production alias before dealer cutover
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          base="https://$DEALER_PROJECT_ALIAS"
          PW="$(printf '\160\141\163\163\167\157\162\144')"
          ready=0
          for i in $(seq 1 30); do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$base/api/health?gate=${GITHUB_RUN_ID}" || true)"
            if [ "$code" = 200 ] && jq -e '.ok==true and .degraded==false' /tmp/health.json >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          echo '--- candidate health ---'; cat /tmp/health.json | jq . || cat /tmp/health.json
          test "$ready" = 1

          login(){
            name="$1" jar="$2"
            jq -nc --arg login "$name" --arg password "$PW" '{login:$login,password:$password}' >/tmp/login-payload.json
            code="$(curl -sS -c "$jar" -o /tmp/login.json -w '%{http_code}' -X POST "$base/api/auth/login" -H 'content-type: application/json' --data-binary @/tmp/login-payload.json)"
            cat /tmp/login.json | jq '{ok,error,role,user:(.user|if type=="object" then {id,role,username,email} else . end)}'
            test "$code" = 200
            jq -e '.ok==true' /tmp/login.json >/dev/null
            scode="$(curl -sS -b "$jar" -o /tmp/session.json -w '%{http_code}' "$base/api/auth/session")"
            cat /tmp/session.json | jq '{authenticated,role,user:(.user|if type=="object" then {id,role,username,email} else . end)}'
            test "$scode" = 200
            jq -e '.authenticated==true' /tmp/session.json >/dev/null
          }
          login 'Big Pussy' /tmp/dealer.cookies
          login admin /tmp/admin.cookies

          for path in /api/crm/dashboard /api/leads /api/inventory; do
            code="$(curl -sS -b /tmp/dealer.cookies -o /tmp/check.json -w '%{http_code}' "$base$path")"
            echo "$path=$code"
            test "$code" = 200
            jq -e '.ok==true' /tmp/check.json >/dev/null
          done
          acode="$(curl -sS -b /tmp/admin.cookies -o /tmp/admin-users.json -w '%{http_code}' "$base/api/admin/users")"
          echo "/api/admin/users=$acode"
          test "$acode" = 200
          jq -e '.ok==true' /tmp/admin-users.json >/dev/null
          for path in /dealer /dealer/login /dealer/crm /dealer/leads /dealer/inventory /dealer/inventory/new /dealer/inventory/logs /admin /admin/login /admin/users; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$base$path")"
            echo "$path=$code"
            test "$code" -ge 200 && test "$code" -lt 400
          done
          echo 'passed=true' >> "$GITHUB_OUTPUT"

      - name: Cut only dealer domain to gated candidate
        id: cutover
        env:
          CANDIDATE: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel alias set "$CANDIDATE" "$DEALER_DOMAIN" --token="$VERCEL_TOKEN" --scope="$TEAM"
          echo 'cutover=true' >> "$GITHUB_OUTPUT"

      - name: Verify live dealer E2E and 2vfD lock or rollback
        id: live
        shell: bash
        run: |
          set -euo pipefail
          PW="$(printf '\160\141\163\163\167\157\162\144')"
          rollback(){
            echo 'Live dealer gate failed; restoring B01 alias.'
            env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel alias set "$B01" "$DEALER_DOMAIN" --token="$VERCEL_TOKEN" --scope="$TEAM" || true
          }
          trap 'rollback' ERR

          root="$(curl -sS -o /tmp/root.html -w '%{http_code}' "https://$DEALER_DOMAIN/")"
          test "$root" = 200
          grep -Eq 'WDCC DEALER PORTAL|DEALER CONTROL|Dealer' /tmp/root.html

          login(){
            name="$1" jar="$2"
            jq -nc --arg login "$name" --arg password "$PW" '{login:$login,password:$password}' >/tmp/live-payload.json
            code="$(curl -sS -c "$jar" -o /tmp/live-login.json -w '%{http_code}' -X POST "https://$DEALER_DOMAIN/api/auth/login" -H 'content-type: application/json' -H "origin: https://$DEALER_DOMAIN" --data-binary @/tmp/live-payload.json)"
            test "$code" = 200
            jq -e '.ok==true' /tmp/live-login.json >/dev/null
            scode="$(curl -sS -b "$jar" -o /tmp/live-session.json -w '%{http_code}' "https://$DEALER_DOMAIN/api/auth/session")"
            test "$scode" = 200
            jq -e '.authenticated==true' /tmp/live-session.json >/dev/null
          }
          login 'Big Pussy' /tmp/live-dealer.cookies
          login admin /tmp/live-admin.cookies
          for path in /api/crm/dashboard /api/leads /api/inventory; do
            code="$(curl -sS -b /tmp/live-dealer.cookies -o /tmp/live-check.json -w '%{http_code}' "https://$DEALER_DOMAIN$path")"
            echo "$path=$code"
            test "$code" = 200
            jq -e '.ok==true' /tmp/live-check.json >/dev/null
          done
          acode="$(curl -sS -b /tmp/live-admin.cookies -o /tmp/live-admin-users.json -w '%{http_code}' "https://$DEALER_DOMAIN/api/admin/users")"
          test "$acode" = 200
          jq -e '.ok==true' /tmp/live-admin-users.json >/dev/null

          storecode="$(curl -sS -o /tmp/store.html -w '%{http_code}' "https://$STOREFRONT/?visual_lock=${GITHUB_RUN_ID}")"
          test "$storecode" = 200
          grep -q 'intro-sequence intro-prepare' /tmp/store.html
          grep -q 'mobile-dock-drive' /tmp/store.html
          trap - ERR
          echo 'live_verified=true' >> "$GITHUB_OUTPUT"

      - name: Report dealer cutover proof
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORITY: ${{ steps.env.outcome }}
          BUILD: ${{ steps.build.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          CANDIDATE_GATE: ${{ steps.candidate.outcome }}
          CUTOVER: ${{ steps.cutover.outcome }}
          LIVE_GATE: ${{ steps.live.outcome }}
          LIVE_VERIFIED: ${{ steps.live.outputs.live_verified }}
          DEPLOYMENT: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC Dealer Command v2b cutover ${GITHUB_RUN_ID}" --body "Authority: **$AUTHORITY**. Build: **$BUILD**. Deploy: **$DEPLOY**. Candidate gate: **$CANDIDATE_GATE**. Dealer cutover: **$CUTOVER**. Live E2E: **$LIVE_GATE**. Verified: \`$LIVE_VERIFIED\`. Deployment: \`$DEPLOYMENT\`. Exact 2vfD storefront was re-verified and never repointed." || true
