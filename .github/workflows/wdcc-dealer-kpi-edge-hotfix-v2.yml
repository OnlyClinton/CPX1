name: WDCC Dealer KPI Edge Hotfix V2

on:
  push:
    branches:
      - fix/dealer-kpi-drilldowns-thumbnails
    paths:
      - 'ops/wdcc-dealer-kpi-edge-worker.js'
      - 'ops/wdcc-dealer-edge-rollback.js'
      - '.github/workflows/wdcc-dealer-kpi-edge-hotfix-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-dealer-kpi-edge-hotfix-v2
  cancel-in-progress: false

env:
  PRIMARY_ORIGIN: https://wdcc-cpx-launch-qhcvflfih-cpxagency.vercel.app
  EXPECTED_SHA: b8e0ba97f34e79591c20fd334c45a8f6e810fb96
  DEALER_HOST: dealer.wedontcarecars.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Require Cloudflare authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Prove current dealer origin
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$PRIMARY_ORIGIN/api/health?kpi_edge_v2=$GITHUB_RUN_ID" -o /tmp/health.json
          jq -e --arg sha "$EXPECTED_SHA" '.ok==true and .degraded==false and .commit==$sha' /tmp/health.json >/dev/null
          for path in /dealer /dealer/leads /dealer/inventory; do
            test "$(curl -sS -o /dev/null -w '%{http_code}' "$PRIMARY_ORIGIN$path")" = 200
          done

      - name: Syntax-check Worker source
        shell: bash
        run: |
          set -euo pipefail
          cp ops/wdcc-dealer-kpi-edge-worker.js /tmp/worker.mjs
          node --check /tmp/worker.mjs
          cp ops/wdcc-dealer-edge-rollback.js /tmp/rollback.mjs
          node --check /tmp/rollback.mjs
          grep -q 'WDCC_KPI_EDGE_V1' ops/wdcc-dealer-kpi-edge-worker.js
          grep -q '/dealer/leads?view=hot' ops/wdcc-dealer-kpi-edge-worker.js
          grep -q '/dealer/inventory?view=published' ops/wdcc-dealer-kpi-edge-worker.js
          grep -q 'primaryPhotoPathname' ops/wdcc-dealer-kpi-edge-worker.js

      - name: Install Wrangler
        run: npm install --global wrangler@4.90.0 >/dev/null

      - name: Prepare isolated stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wdcc-kpi-edge-v2
          cp ops/wdcc-dealer-kpi-edge-worker.js /tmp/wdcc-kpi-edge-v2/worker.js
          cat > /tmp/wdcc-kpi-edge-v2/wrangler.jsonc <<'EOF'
          {
            "name": "wdcc-dealer-kpi-stage-v2",
            "main": "worker.js",
            "compatibility_date": "2026-08-25",
            "workers_dev": true,
            "observability": {"enabled": true}
          }
          EOF

      - name: Deploy isolated workers.dev stage
        id: stage
        working-directory: /tmp/wdcc-kpi-edge-v2
        shell: bash
        run: |
          set -euo pipefail
          wrangler deploy 2>&1 | tee /tmp/kpi-stage-v2.log
          URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/kpi-stage-v2.log | tail -1 || true)"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify isolated stage
        shell: bash
        run: |
          set -euo pipefail
          URL='${{ steps.stage.outputs.url }}'
          for attempt in $(seq 1 20); do
            code="$(curl -sS -o /tmp/stage-health.json -w '%{http_code}' "$URL/api/health?attempt=$attempt" || true)"
            if [ "$code" = 200 ] && jq -e --arg sha "$EXPECTED_SHA" '.ok==true and .degraded==false and .commit==$sha' /tmp/stage-health.json >/dev/null 2>&1; then break; fi
            sleep 2
          done
          jq -e --arg sha "$EXPECTED_SHA" '.ok==true and .degraded==false and .commit==$sha' /tmp/stage-health.json >/dev/null
          for path in '/dealer' '/dealer/leads?view=hot' '/dealer/inventory?view=published'; do
            curl -fsS -D /tmp/stage.h "$URL$path" -o /tmp/stage.html
            grep -q 'WDCC_KPI_EDGE_V1' /tmp/stage.html
            grep -qi '^x-wdcc-kpi-edge: WDCC_KPI_EDGE_V1' /tmp/stage.h
          done
          echo 'KPI_EDGE_STAGE_V2=PASS'

      - name: Prepare production config
        shell: bash
        run: |
          set -euo pipefail
          cp ops/wdcc-dealer-kpi-edge-worker.js /tmp/wdcc-kpi-edge-v2/worker.js
          cp ops/wdcc-dealer-edge-rollback.js /tmp/wdcc-kpi-edge-v2/rollback.js
          cat > /tmp/wdcc-kpi-edge-v2/wrangler.jsonc <<'EOF'
          {
            "name": "wdcc-dealer-frontdoor",
            "main": "worker.js",
            "compatibility_date": "2026-08-25",
            "workers_dev": true,
            "observability": {"enabled": true},
            "routes": [{"pattern":"dealer.wedontcarecars.com/*","zone_name":"wedontcarecars.com"}]
          }
          EOF

      - name: Deploy live dealer edge hotfix
        working-directory: /tmp/wdcc-kpi-edge-v2
        shell: bash
        run: |
          set -euo pipefail
          wrangler deploy

      - name: Verify live dealer edge hotfix
        id: liveverify
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          curl -fsS -D /tmp/live-health.h "https://$DEALER_HOST/api/health?kpi_edge_v2_live=$GITHUB_RUN_ID" -o /tmp/live-health.json
          jq -e --arg sha "$EXPECTED_SHA" '.ok==true and .degraded==false and .commit==$sha' /tmp/live-health.json >/dev/null
          grep -qi '^x-wdcc-edge: cloudflare-dealer' /tmp/live-health.h
          for path in '/dealer' '/dealer/leads?view=hot' '/dealer/inventory?view=published'; do
            curl -fsS -D /tmp/live.h "https://$DEALER_HOST$path" -o /tmp/live.html
            grep -q 'WDCC_KPI_EDGE_V1' /tmp/live.html
            grep -qi '^x-wdcc-kpi-edge: WDCC_KPI_EDGE_V1' /tmp/live.h
          done
          echo 'WDCC_KPI_EDGE_LIVE=PASS'

      - name: Roll back production Worker on live verification failure
        if: failure() && steps.liveverify.outcome == 'failure'
        working-directory: /tmp/wdcc-kpi-edge-v2
        shell: bash
        run: |
          set -euo pipefail
          cp rollback.js worker.js
          wrangler deploy
