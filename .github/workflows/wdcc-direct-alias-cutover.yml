name: WDCC direct alias cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-direct-alias-cutover.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wdcc-direct-alias-cutover
  cancel-in-progress: false

env:
  TEAM_ID: team_G6jmETRRl8fV3KfivPOdj8JM
  CANDIDATE_ID: dpl_82TtEv3Bkeq59WMpRHLUyjDgofmk
  CANDIDATE_URL: wdcc-v32-storefront-htz3k7zdd-cpxagency.vercel.app
  EXPECTED_COMMIT: 3b7d9e5fee9ec448a00408f3cdb4311e2b66d0a7
  APEX: wedontcarecars.com
  WWW: www.wedontcarecars.com

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate visual candidate and capture rollback alias
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          curl -fsSL -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$CANDIDATE_ID?teamId=$TEAM_ID" -o /tmp/candidate.json
          jq -e --arg id "$CANDIDATE_ID" --arg sha "$EXPECTED_COMMIT" '.id==$id and .readyState=="READY" and .meta.githubCommitSha==$sha' /tmp/candidate.json >/dev/null
          npx --yes vercel@59.3.0 curl / --deployment "$CANDIDATE_URL" > /tmp/candidate-home.html
          grep -q 'class="cinematic cinematic-enter"' /tmp/candidate-home.html
          grep -q 'wdcc-logo-transparent.webp' /tmp/candidate-home.html
          grep -qi 'GET PRE-APPROVED' /tmp/candidate-home.html
          grep -qi 'BROWSE INVENTORY' /tmp/candidate-home.html
          npx --yes vercel@59.3.0 curl /wdcc-hero-v2.webp --deployment "$CANDIDATE_URL" > /tmp/hero.webp
          test -s /tmp/hero.webp
          npx --yes vercel@59.3.0 curl /api/health --deployment "$CANDIDATE_URL" > /tmp/health.json
          jq -e '.ok==true and .degraded==false' /tmp/health.json >/dev/null
          curl -fsSL -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v4/aliases/$APEX?teamId=$TEAM_ID" -o /tmp/old-alias.json || true
          jq -r '.deployment.id // .deploymentId // empty' /tmp/old-alias.json > /tmp/old-deployment-id || true

      - name: Reassign apex alias to approved READY candidate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.vercel.com/v2/deployments/$CANDIDATE_ID/aliases?teamId=$TEAM_ID" \
            --data "{\"alias\":\"$APEX\",\"redirect\":null}" -o /tmp/apex-result.json
          jq -e --arg a "$APEX" '.alias==$a' /tmp/apex-result.json >/dev/null

      - name: Reassign www alias
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.vercel.com/v2/deployments/$CANDIDATE_ID/aliases?teamId=$TEAM_ID" \
            --data "{\"alias\":\"$WWW\",\"redirect\":null}" -o /tmp/www-result.json
          jq -e --arg a "$WWW" '.alias==$a' /tmp/www-result.json >/dev/null

      - name: Verify live visual contract and backend
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in 1 2 3 4 5 6; do
            if curl -fsSL -H 'Cache-Control: no-cache' "https://$APEX/?visualcutover=$GITHUB_RUN_ID-$i" -o /tmp/live.html \
              && grep -q 'class="cinematic cinematic-enter"' /tmp/live.html \
              && grep -q 'wdcc-logo-transparent.webp' /tmp/live.html \
              && grep -qi 'GET PRE-APPROVED' /tmp/live.html \
              && grep -qi 'BROWSE INVENTORY' /tmp/live.html \
              && curl -fsSL "https://$APEX/wdcc-hero-v2.webp?visualcutover=$GITHUB_RUN_ID-$i" -o /tmp/live-hero.webp \
              && test -s /tmp/live-hero.webp \
              && curl -fsSL "https://$APEX/api/health?visualcutover=$GITHUB_RUN_ID-$i" -o /tmp/live-health.json \
              && jq -e '.ok==true and .degraded==false' /tmp/live-health.json >/dev/null; then ok=1; break; fi
            sleep 3
          done
          test "$ok" -eq 1

      - name: Restore old apex alias if verification fails
        if: steps.verify.outcome != 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          OLD="$(cat /tmp/old-deployment-id 2>/dev/null || true)"
          if [ -n "$OLD" ]; then
            curl -fsSL -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H 'Content-Type: application/json' \
              "https://api.vercel.com/v2/deployments/$OLD/aliases?teamId=$TEAM_ID" \
              --data "{\"alias\":\"$APEX\",\"redirect\":null}" >/tmp/rollback.json
          fi
          exit 1

      - name: Publish cutover proof
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          if [ "$OUTCOME" = success ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title 'WDCC approved visual cutover passed' --body "Candidate \`$CANDIDATE_ID\` is serving \`$APEX\`; cinematic opener, WDCC logo, hero asset, approval/inventory CTAs, and API health all passed." || true
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title 'WDCC approved visual cutover failed safely' --body "Approved visual candidate did not pass the live gate; rollback was attempted." || true
          fi
