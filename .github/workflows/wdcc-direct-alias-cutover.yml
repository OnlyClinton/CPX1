name: WDCC direct alias cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-direct-alias-cutover.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wdcc-direct-alias-cutover
  cancel-in-progress: false

env:
  TEAM_ID: team_G6jmETRRl8fV3KfivPOdj8JM
  CANDIDATE_ID: dpl_HsafQFMVjRnrGBGjt86YxaEvHudz
  CANDIDATE_URL: wdcc-v32-storefront-9x6w64q3k-cpxagency.vercel.app
  EXPECTED_COMMIT: e119854bc60a4a507e9f6162774a29366bbe497d
  APEX: wedontcarecars.com
  WWW: www.wedontcarecars.com

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate API-capable visual candidate and capture rollback aliases
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          curl -fsSL -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$CANDIDATE_ID?teamId=$TEAM_ID" -o /tmp/candidate.json
          jq -e --arg id "$CANDIDATE_ID" --arg sha "$EXPECTED_COMMIT" '.id==$id and .readyState=="READY" and .meta.githubCommitSha==$sha' /tmp/candidate.json >/dev/null

          npx --yes vercel@59.3.0 curl / --deployment "$CANDIDATE_URL" > /tmp/candidate-home.html
          grep -q 'intro-sequence' /tmp/candidate-home.html
          grep -q 'wdcc-logo-transparent.webp' /tmp/candidate-home.html
          grep -qi 'GET PRE-APPROVED' /tmp/candidate-home.html
          grep -qi 'SCHEDULE A TEST DRIVE' /tmp/candidate-home.html
          grep -q 'stickyCtaBar' /tmp/candidate-home.html

          npx --yes vercel@59.3.0 curl /wdcc-hero-v2.webp --deployment "$CANDIDATE_URL" > /tmp/hero.webp
          test -s /tmp/hero.webp

          npx --yes vercel@59.3.0 curl /api/health --deployment "$CANDIDATE_URL" > /tmp/health.json
          jq -e '.ok==true and .degraded==false' /tmp/health.json >/dev/null

          npx --yes vercel@59.3.0 curl /api/inventory --deployment "$CANDIDATE_URL" > /tmp/inventory.json
          jq -e '.ok==true and (.items|type)=="array"' /tmp/inventory.json >/dev/null
          jq -e 'all(.items[]; ((.stock // "") | ascii_upcase | startswith("WDCC-QA-") | not) and ((.stock // "") | ascii_upcase | startswith("R36TEST-") | not))' /tmp/inventory.json >/dev/null

          curl -fsSL -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v4/aliases/$APEX?teamId=$TEAM_ID" -o /tmp/old-apex.json || true
          jq -r '.deployment.id // .deploymentId // empty' /tmp/old-apex.json > /tmp/old-apex-id || true
          curl -fsSL -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v4/aliases/$WWW?teamId=$TEAM_ID" -o /tmp/old-www.json || true
          jq -r '.deployment.id // .deploymentId // empty' /tmp/old-www.json > /tmp/old-www-id || true

      - name: Reassign apex alias to approved READY candidate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.vercel.com/v2/deployments/$CANDIDATE_ID/aliases?teamId=$TEAM_ID" \
            --data "{\"alias\":\"$APEX\",\"redirect\":null}" -o /tmp/apex-result.json
          jq -e --arg a "$APEX" '.alias==$a' /tmp/apex-result.json >/dev/null

      - name: Reassign www alias
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.vercel.com/v2/deployments/$CANDIDATE_ID/aliases?teamId=$TEAM_ID" \
            --data "{\"alias\":\"$WWW\",\"redirect\":null}" -o /tmp/www-result.json
          jq -e --arg a "$WWW" '.alias==$a' /tmp/www-result.json >/dev/null

      - name: Verify live visual, mobile, health, and inventory contracts
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in 1 2 3 4 5 6; do
            if curl -fsSL -H 'Cache-Control: no-cache' "https://$APEX/?cutover=$GITHUB_RUN_ID-$i" -o /tmp/live.html \
              && grep -q 'intro-sequence' /tmp/live.html \
              && grep -q 'wdcc-logo-transparent.webp' /tmp/live.html \
              && grep -qi 'GET PRE-APPROVED' /tmp/live.html \
              && grep -qi 'SCHEDULE A TEST DRIVE' /tmp/live.html \
              && grep -q 'stickyCtaBar' /tmp/live.html \
              && curl -fsSL "https://$APEX/wdcc-hero-v2.webp?cutover=$GITHUB_RUN_ID-$i" -o /tmp/live-hero.webp \
              && test -s /tmp/live-hero.webp \
              && curl -fsSL "https://$APEX/api/health?cutover=$GITHUB_RUN_ID-$i" -o /tmp/live-health.json \
              && jq -e '.ok==true and .degraded==false' /tmp/live-health.json >/dev/null \
              && curl -fsSL "https://$APEX/api/inventory?cutover=$GITHUB_RUN_ID-$i" -o /tmp/live-inventory.json \
              && jq -e '.ok==true and (.items|type)=="array"' /tmp/live-inventory.json >/dev/null \
              && jq -e 'all(.items[]; ((.stock // "") | ascii_upcase | startswith("WDCC-QA-") | not) and ((.stock // "") | ascii_upcase | startswith("R36TEST-") | not))' /tmp/live-inventory.json >/dev/null; then
              ok=1
              break
            fi
            sleep 3
          done
          test "$ok" -eq 1

      - name: Restore old aliases if verification fails
        if: steps.verify.outcome != 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          OLD_APEX="$(cat /tmp/old-apex-id 2>/dev/null || true)"
          OLD_WWW="$(cat /tmp/old-www-id 2>/dev/null || true)"
          if [ -n "$OLD_APEX" ]; then
            curl -fsSL -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H 'Content-Type: application/json' \
              "https://api.vercel.com/v2/deployments/$OLD_APEX/aliases?teamId=$TEAM_ID" \
              --data "{\"alias\":\"$APEX\",\"redirect\":null}" >/tmp/rollback-apex.json
          fi
          if [ -n "$OLD_WWW" ]; then
            curl -fsSL -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H 'Content-Type: application/json' \
              "https://api.vercel.com/v2/deployments/$OLD_WWW/aliases?teamId=$TEAM_ID" \
              --data "{\"alias\":\"$WWW\",\"redirect\":null}" >/tmp/rollback-www.json
          fi
          exit 1

      - name: Publish cutover proof
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          count="$(jq -r '.items|length // 0' /tmp/live-inventory.json 2>/dev/null || echo 0)"
          if [ "$OUTCOME" = success ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title 'WDCC API-capable storefront cutover passed' --body "Candidate \`$CANDIDATE_ID\` / commit \`$EXPECTED_COMMIT\` is serving \`$APEX\` and \`$WWW\`. Intro, logo, hero, sticky quick actions, test-drive/pre-approval CTAs, healthy backend, and public inventory JSON all passed. Public inventory count: \`$count\`." || true
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title 'WDCC API-capable storefront cutover failed safely' --body "Candidate \`$CANDIDATE_ID\` did not pass the live gate; apex and www rollback were attempted." || true
          fi
