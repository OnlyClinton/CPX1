name: Ops recover exact 8AR assets
on:
  push:
    branches: [ops-recover-8ar-assets]
    paths:
      - '.github/workflows/ops-recover-8ar-assets.yml'
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      DEPLOYMENT_ID: dpl_8ARLPgiW4ZKC9qwQxJrwqc2hrZzX
    steps:
      - uses: actions/checkout@v4
      - name: Recover matching immutable 8AR files
        id: recover
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          curl -fsSL -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments/$DEPLOYMENT_ID/files?teamId=$TEAM_ID" > /tmp/files.json
          cat >/tmp/recover.mjs <<'EOF'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const tree=JSON.parse(await fs.readFile('/tmp/files.json','utf8'));
          const token=process.env.VERCEL_TOKEN, team=process.env.TEAM_ID, dep=process.env.DEPLOYMENT_ID;
          const files=[];
          function walk(nodes,p=''){for(const n of nodes||[]){const q=p?`${p}/${n.name}`:n.name;if(n.type==='directory')walk(n.children||[],q);else if(n.type==='file'&&n.uid)files.push({...n,path:q})}}
          walk(tree);
          const needles=['intro-sequence','intro-scene','intro-badge','intro-tagline','featured-carousel','brand-logo','hero-kicker','hero-actions'];
          const matched=[];
          await fs.mkdir('recovered-8ar-assets',{recursive:true});
          for(const f of files){
            if(!/\.(css|js|mjs|cjs|html)$/i.test(f.path)) continue;
            if(Number(f.size||0)>4000000) continue;
            const u=`https://api.vercel.com/v8/deployments/${dep}/files/${f.uid}?teamId=${encodeURIComponent(team)}`;
            const r=await fetch(u,{headers:{Authorization:`Bearer ${token}`}});
            if(!r.ok) continue;
            const raw=await r.text(); let parsed; try{parsed=JSON.parse(raw)}catch{parsed=raw}
            const b64=typeof parsed==='string'?parsed:(parsed?.data??parsed?.content??parsed?.file??parsed?.value);
            if(typeof b64!=='string') continue;
            const buf=Buffer.from(b64,'base64'); const text=buf.toString('utf8');
            const hits=needles.filter(n=>text.includes(n));
            if(!hits.length) continue;
            const safe=f.path.replace(/[^a-zA-Z0-9._-]+/g,'__');
            await fs.writeFile(path.join('recovered-8ar-assets',safe),buf);
            matched.push({path:f.path,uid:f.uid,size:buf.length,hits});
          }
          await fs.writeFile('recovered-8ar-assets/MANIFEST.json',JSON.stringify(matched,null,2));
          if(!matched.length) throw new Error('NO_MATCHING_8AR_FILES');
          console.log(JSON.stringify(matched,null,2));
          EOF
          node /tmp/recover.mjs
          count=$(jq 'length' recovered-8ar-assets/MANIFEST.json)
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Commit recovered donor assets to this ops branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WDCC Recovery Bot'
          git config user.email '120651995+OnlyClinton@users.noreply.github.com'
          rm -rf ops/recovered-8ar-assets
          mkdir -p ops
          cp -a recovered-8ar-assets ops/recovered-8ar-assets
          git add ops/recovered-8ar-assets
          git commit -m 'Recover exact immutable 8AR donor implementation' || true
          git push origin HEAD:ops-recover-8ar-assets
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ steps.recover.outputs.count }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC recovered exact 8AR assets ${GITHUB_SHA:0:7}" --body "Recovered matching immutable donor files: \`${COUNT:-0}\`. Branch: \`ops-recover-8ar-assets\`." || true
