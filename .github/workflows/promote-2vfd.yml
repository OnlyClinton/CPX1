name: Promote WDCC 2vfD
on:
  push:
    branches:
      - ops/promote-2vfd-20260824
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: test -n "$VERCEL_TOKEN"
      - name: Promote exact 2vfD deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest promote wdcc-v32-storefront-a2wntmnnn-cpxagency.vercel.app --yes --token "$VERCEL_TOKEN" --scope cpxagency
