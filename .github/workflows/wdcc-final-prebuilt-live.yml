name: WDCC FINAL PREBUILT LIVE

on:
  push:
    branches: [main]
    paths:
      - 'TRIGGER_WDCC_FINAL_PREBUILT.txt'
  workflow_dispatch:

concurrency:
  group: wdcc-final-prebuilt-live
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      actions: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: cpxagency
      DEPLOY_URL: https://wdcc-v32-storefront-fwi0ko41b-cpxagency.vercel.app
      RELEASE_SHA: 98c84814c00528e6114196f8d5ff7597fb844b20
      APEX: https://wedontcarecars.com
      DEALER: https://dealer.wedontcarecars.com
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Vercel CLI
        run: npm install --global vercel@59.3.0
      - name: Point apex www and dealer to the existing READY deployment
        shell: bash
        run: |
          set -euo pipefail
          vercel promote "$DEPLOY_URL" --yes --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" || true
          for domain in wedontcarecars.com www.wedontcarecars.com dealer.wedontcarecars.com; do
            vercel alias set "$DEPLOY_URL" "$domain" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
          done
      - name: Verify live contract
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 40); do
            home_code="$(curl -sS -L -o /tmp/home.html -w '%{http_code}' "$APEX/?intro=1&release=${GITHUB_RUN_ID}" || true)"
            health_code="$(curl -sS -L -o /tmp/health.json -w '%{http_code}' "$APEX/api/health" || true)"
            inv_code="$(curl -sS -L -o /tmp/inventory.json -w '%{http_code}' "$APEX/api/inventory?release=${GITHUB_RUN_ID}" || true)"
            test_code="$(curl -sS -L -o /tmp/test.html -w '%{http_code}' "$APEX/schedule-test-drive" || true)"
            approve_code="$(curl -sS -L -o /tmp/approve.html -w '%{http_code}' "$APEX/get-approved" || true)"
            dealer_code="$(curl -sS -L -o /tmp/dealer.html -w '%{http_code}' "$DEALER/dealer" || true)"
            admin_code="$(curl -sS -L -o /tmp/admin.html -w '%{http_code}' "$APEX/admin/login" || true)"
            if [ "$home_code" = 200 ] && [ "$health_code" = 200 ] && [ "$inv_code" = 200 ] && [ "$test_code" = 200 ] && [ "$approve_code" = 200 ] && [ "$dealer_code" = 200 ] && [ "$admin_code" = 200 ]; then
              if jq -e --arg sha "$RELEASE_SHA" '.ok==true and .degraded==false and .commit==$sha' /tmp/health.json >/dev/null 2>&1 && jq -e '.ok==true and (.items|type)=="array"' /tmp/inventory.json >/dev/null 2>&1; then
                if grep -q 'screenshotContract' /tmp/home.html && grep -q 'header-logo-image' /tmp/home.html && grep -qi 'Schedule a test drive' /tmp/home.html && grep -qi 'Get pre-approved' /tmp/home.html && grep -qi 'CALL SEAN' /tmp/home.html && grep -q 'mobile-action-bar' /tmp/home.html; then ok=1; break; fi
              fi
            fi
            sleep 3
          done
          test "$ok" = 1
          ! grep -q 'R36TEST-' /tmp/home.html
          echo verified=true >> "$GITHUB_OUTPUT"
      - name: Trigger authenticated dealer listing acceptance
        if: steps.verify.outputs.verified == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wdcc-listing-only-e2e.yml --ref main
      - name: Report release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY: ${{ steps.verify.outputs.verified }}
        shell: bash
        run: |
          body=$(printf 'Unified source SHA: `%s`\nDeployment: `%s`\nApex/www/dealer aliases unified: attempted\nPublic contract verified: `%s`\nAuthenticated listing E2E: triggered after public PASS\n\nApex: %s\nDealer: %s' "$RELEASE_SHA" "$DEPLOY_URL" "${VERIFY:-false}" "$APEX" "$DEALER")
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC unified alias cutover ${GITHUB_RUN_ID}" --body "$body" || true
