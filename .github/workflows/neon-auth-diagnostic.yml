name: Neon Auth Diagnostic

on:
  push:
    branches: [ops/neon-auth-diagnostic]
    paths: ['.github/workflows/neon-auth-diagnostic.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe managed auth without exposing credentials
        shell: bash
        env:
          AUTH_BASE: https://ep-curly-breeze-ay2iih1f.neonauth.c-5.us-east-2.aws.neon.tech/neondb/auth
          CF_ORIGIN: https://wdcc-storefront.clico-global.workers.dev
        run: |
          set -euo pipefail
          EMAIL="wdcc-auth-probe-${GITHUB_RUN_ID}@example.invalid"
          PASSWORD="$(openssl rand -base64 30 | tr -d '\n')Aa1!"
          redact_cookies(){ tr -d '\r' | sed -E 's/^(set-cookie: [^=]+=)[^;]*/\1[REDACTED]/I'; }

          printf '== SIGNUP WITH CLOUDFLARE ORIGIN ==\n'
          code=$(curl -sS -D /tmp/signup.headers -o /tmp/signup.body -w '%{http_code}' \
            -X POST "$AUTH_BASE/sign-up/email" \
            -H 'content-type: application/json' \
            -H "origin: $CF_ORIGIN" \
            --data "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\",\"name\":\"WDCC Auth Probe\"}")
          echo "HTTP=$code"
          cat /tmp/signup.headers | grep -iE '^(set-cookie|location|content-type):' | redact_cookies || true
          jq -c '{code,message,error,user:(.user|if type=="object" then {id,email} else . end)}' /tmp/signup.body 2>/dev/null || head -c 300 /tmp/signup.body; echo

          printf '== SIGNIN WITH CLOUDFLARE ORIGIN ==\n'
          code=$(curl -sS -D /tmp/signin-cf.headers -o /tmp/signin-cf.body -w '%{http_code}' \
            -X POST "$AUTH_BASE/sign-in/email" \
            -H 'content-type: application/json' \
            -H "origin: $CF_ORIGIN" \
            --data "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\",\"rememberMe\":true}")
          echo "HTTP=$code"
          cat /tmp/signin-cf.headers | grep -iE '^(set-cookie|location|content-type):' | redact_cookies || true
          jq -c '{code,message,error,user:(.user|if type=="object" then {id,email} else . end)}' /tmp/signin-cf.body 2>/dev/null || head -c 300 /tmp/signin-cf.body; echo

          printf '== SIGNIN NO ORIGIN ==\n'
          code=$(curl -sS -D /tmp/signin-no.headers -o /tmp/signin-no.body -w '%{http_code}' \
            -X POST "$AUTH_BASE/sign-in/email" \
            -H 'content-type: application/json' \
            --data "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\",\"rememberMe\":true}")
          echo "HTTP=$code"
          cat /tmp/signin-no.headers | grep -iE '^(set-cookie|location|content-type):' | redact_cookies || true
          jq -c '{code,message,error,user:(.user|if type=="object" then {id,email} else . end)}' /tmp/signin-no.body 2>/dev/null || head -c 300 /tmp/signin-no.body; echo

          printf '== COOKIE ATTRIBUTES ==\n'
          grep -i '^set-cookie:' /tmp/signin-cf.headers | sed -E 's/(=[^;]*)/=[REDACTED]/' || true
