name: Deploy current WDCC composite to production
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-restore-exact-8ar-apex.yml'
  workflow_dispatch:

concurrency:
  group: wdcc-production-cutover
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      VERCEL_PROJECT_ID: prj_We7xkAkB5Qy31Pt17USSkQFE0u7h
      APEX: wedontcarecars.com
      WWW: www.wedontcarecars.com
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Require Vercel token
        run: test -n "$VERCEL_TOKEN"
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Link canonical storefront project
        run: vercel link --yes --project wdcc-v32-storefront --scope cpxagency --token "$VERCEL_TOKEN"
      - name: Pull production environment
        run: vercel pull --yes --environment=production --scope cpxagency --token "$VERCEL_TOKEN"
      - name: Build current main for production
        run: vercel build --prod --scope cpxagency --token "$VERCEL_TOKEN"
      - name: Deploy exact prebuilt output to production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --scope cpxagency --token "$VERCEL_TOKEN" | tail -n1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $url"
      - name: Verify public domains and core routes
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          for host in "$APEX" "$WWW"; do
            ok=0
            for i in $(seq 1 30); do
              home_code="$(curl -sS -L -o /tmp/home.html -w '%{http_code}' "https://$host/" || true)"
              inv_code="$(curl -sS -L -o /tmp/inventory.json -w '%{http_code}' "https://$host/api/inventory" || true)"
              if [ "$home_code" = '200' ] && [ "$inv_code" = '200' ]; then ok=1; break; fi
              sleep 2
            done
            test "$ok" = '1'
          done
          curl -sS -L "https://$APEX/" -o /tmp/live-home.html
          grep -q 'SCHEDULE A TEST DRIVE' /tmp/live-home.html
          grep -q 'GET PRE-APPROVED' /tmp/live-home.html
          echo 'verified=true' >> "$GITHUB_OUTPUT"
      - name: Report cutover
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          RESULT: ${{ steps.verify.outputs.verified }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC composite production cutover ${GITHUB_SHA:0:7}" --body "Current-main production deployment: \`${DEPLOY_URL:-unknown}\`\nPublic verification: \`${RESULT:-false}\`\nApex: https://wedontcarecars.com/" || true
