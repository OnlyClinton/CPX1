name: Restore functional 8AR storefront apex
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-restore-exact-8ar-apex.yml'
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      DEPLOYMENT_ID: dpl_B7iTYdinR6VFWEnFGf5wWMBwH8H1
      APEX: wedontcarecars.com
      WWW: www.wedontcarecars.com
    steps:
      - name: Require token
        run: test -n "$VERCEL_TOKEN"
      - name: Assign apex and www directly through Vercel API
        shell: bash
        run: |
          set -euo pipefail
          for alias in "$APEX" "$WWW"; do
            code="$(curl -sS -o /tmp/alias.json -w '%{http_code}' -X POST \
              "https://api.vercel.com/v2/deployments/$DEPLOYMENT_ID/aliases?teamId=$TEAM_ID" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "{\"alias\":\"$alias\"}")"
            cat /tmp/alias.json
            test "$code" = '200'
          done
      - name: Verify public domains and core routes
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          for host in "$APEX" "$WWW"; do
            ok=0
            for i in $(seq 1 20); do
              home_code="$(curl -sS -L -o /tmp/home.html -w '%{http_code}' "https://$host/" || true)"
              inv_code="$(curl -sS -L -o /tmp/inventory.json -w '%{http_code}' "https://$host/api/inventory" || true)"
              if [ "$home_code" = '200' ] && [ "$inv_code" = '200' ]; then ok=1; break; fi
              sleep 2
            done
            test "$ok" = '1'
          done
          echo 'restored=true' >> "$GITHUB_OUTPUT"
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.verify.outputs.restored }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC functional 8AR REST cutover ${GITHUB_SHA:0:7}" --body "Deployment: \`$DEPLOYMENT_ID\`\nApex restore verified: \`${RESULT:-false}\`\nApex: https://wedontcarecars.com/" || true
