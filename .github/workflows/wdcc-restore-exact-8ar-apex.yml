name: Restore exact 2vfD storefront apex
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-restore-exact-8ar-apex.yml'
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM: cpxagency
      DONOR: wdcc-v32-storefront-a2wntmnnn-cpxagency.vercel.app
      APEX: wedontcarecars.com
      WWW: www.wedontcarecars.com
    steps:
      - name: Require token
        run: test -n "$VERCEL_TOKEN"
      - name: Install Vercel CLI
        run: npm install --global vercel@59.3.0 >/dev/null
      - name: Restore exact 2vfD to apex and www
        shell: bash
        run: |
          set -euo pipefail
          vercel alias set "$DONOR" "$APEX" --token="$VERCEL_TOKEN" --scope="$TEAM"
          vercel alias set "$DONOR" "$WWW" --token="$VERCEL_TOKEN" --scope="$TEAM"
      - name: Verify public domains and core routes
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          for host in "$APEX" "$WWW"; do
            ok=0
            for i in $(seq 1 20); do
              home_code="$(curl -sS -L -o /tmp/home.html -w '%{http_code}' "https://$host/" || true)"
              inv_code="$(curl -sS -L -o /tmp/inventory.json -w '%{http_code}' "https://$host/api/inventory" || true)"
              if [ "$home_code" = '200' ] && [ "$inv_code" = '200' ]; then ok=1; break; fi
              sleep 2
            done
            test "$ok" = '1'
          done
          echo 'restored=true' >> "$GITHUB_OUTPUT"
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.verify.outputs.restored }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC exact 2vfD apex restore ${GITHUB_SHA:0:7}" --body "Exact donor: \`$DONOR\`\nApex restore verified: \`${RESULT:-false}\`\nApex: https://wedontcarecars.com/" || true
