name: Emergency Vercel alias pin exact 2vfD

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-vercel-alias-pin-2vfd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-emergency-vercel-alias-pin-2vfd
  cancel-in-progress: true

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_SCOPE: cpxagency
  DONOR_HOST: wdcc-v32-storefront-a2wntmnnn-cpxagency.vercel.app
  APEX: wedontcarecars.com
  WWW: www.wedontcarecars.com

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require Vercel authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@59.5.0

      - name: Verify exact 2vfD through authenticated Vercel access
        shell: bash
        run: |
          set -euo pipefail
          vercel --scope "$VERCEL_SCOPE" curl / --deployment "$DONOR_HOST" > /tmp/donor.html
          grep -qi 'we don.t care' /tmp/donor.html
          grep -q 'wdcc-logo-transparent.webp' /tmp/donor.html
          grep -q 'wdcc-hero-v2.webp' /tmp/donor.html
          vercel --scope "$VERCEL_SCOPE" curl /wdcc-logo-transparent.webp --deployment "$DONOR_HOST" > /tmp/donor-logo.webp
          vercel --scope "$VERCEL_SCOPE" curl /wdcc-hero-v2.webp --deployment "$DONOR_HOST" > /tmp/donor-hero.webp
          test -s /tmp/donor-logo.webp
          test -s /tmp/donor-hero.webp
          file /tmp/donor-logo.webp /tmp/donor-hero.webp

      - name: Pin apex and www aliases to exact 2vfD
        shell: bash
        run: |
          set -euo pipefail
          vercel alias set "$DONOR_HOST" "$APEX" --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
          vercel alias set "$DONOR_HOST" "$WWW" --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"

      - name: Verify live domains match exact donor media
        shell: bash
        run: |
          set -euo pipefail
          stamp="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          donor_logo="$(sha256sum /tmp/donor-logo.webp | awk '{print $1}')"
          donor_hero="$(sha256sum /tmp/donor-hero.webp | awk '{print $1}')"
          for host in "$APEX" "$WWW"; do
            ok=0
            for i in $(seq 1 30); do
              code="$(curl -sS -L --max-time 25 -o /tmp/live.html -w '%{http_code}' "https://$host/?proof=$stamp-$i" || true)"
              if [ "$code" = 200 ] && grep -qi 'we don.t care' /tmp/live.html && grep -q 'wdcc-logo-transparent.webp' /tmp/live.html && grep -q 'wdcc-hero-v2.webp' /tmp/live.html; then
                ok=1
                break
              fi
              sleep 2
            done
            test "$ok" = 1
            curl -fsS "https://$host/wdcc-logo-transparent.webp?proof=$stamp" -o /tmp/live-logo.webp
            curl -fsS "https://$host/wdcc-hero-v2.webp?proof=$stamp" -o /tmp/live-hero.webp
            live_logo="$(sha256sum /tmp/live-logo.webp | awk '{print $1}')"
            live_hero="$(sha256sum /tmp/live-hero.webp | awk '{print $1}')"
            test "$live_logo" = "$donor_logo"
            test "$live_hero" = "$donor_hero"
          done

      - name: Confirm dealer stays isolated
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -L --max-time 20 -o /tmp/dealer.html -w '%{http_code}' https://dealer.wedontcarecars.com/dealer || true)"
          echo "$code" | grep -Eq '^(200|302|307|308)$'
          echo 'CUSTOMER_ALIASES_EXACT_2VFD=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'CUSTOMER_MEDIA_HASH_PARITY=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'DEALER_DOMAIN_UNCHANGED=PASS' >> "$GITHUB_STEP_SUMMARY"
