name: WDCC Deep QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-deep-qa.yml'
  workflow_dispatch:

concurrency:
  group: wdcc-deep-qa
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      STOREFRONT: https://wedontcarecars.com
      DEALER: https://dealer.wedontcarecars.com
      BACKEND: https://wdcc-cpx-launch.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        id: deps
        continue-on-error: true
        run: npm ci

      - name: TypeScript strict check
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Lint TypeScript and JavaScript
        id: lint
        continue-on-error: true
        run: npx --yes @biomejs/biome@1.9.4 lint app lib scripts

      - name: Dependency security audit
        id: audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Next production build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Inspect staged 2vfD plus 8AR navigation
        id: stagednav
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin release/8ar-on-exact-2vfd
          git show FETCH_HEAD:app/Exact2vfDHome.tsx > /tmp/hybrid.tsx
          bad=0
          : > /tmp/staged-nav.txt
          for route in /financing /reviews /about; do
            if grep -Fq "href=\"$route\"" /tmp/hybrid.tsx; then
              echo "BROKEN staged nav target: $route" | tee -a /tmp/staged-nav.txt
              bad=$((bad+1))
            fi
          done
          echo "bad=$bad" >> "$GITHUB_OUTPUT"
          test "$bad" = 0

      - name: Live page route matrix
        id: routes
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/routes.tsv
          fail=0
          check(){
            label="$1"; url="$2"
            code="$(curl -sS -L -o /tmp/page.html -w '%{http_code}' "$url" || echo 000)"
            printf '%s\t%s\t%s\n' "$label" "$code" "$url" | tee -a /tmp/routes.tsv
            if [ "$code" = 000 ] || [ "$code" = 404 ] || [ "$code" -ge 500 ] 2>/dev/null; then fail=$((fail+1)); fi
          }
          check home "$STOREFRONT/"
          check inventory "$STOREFRONT/inventory"
          check test_drive "$STOREFRONT/schedule-test-drive?source=qa-route"
          check approval "$STOREFRONT/get-approved?source=qa-route"
          check contact "$STOREFRONT/contact?source=qa-route"
          check dealer_home "$STOREFRONT/dealer"
          check dealer_login "$STOREFRONT/dealer/login"
          check dealer_leads "$STOREFRONT/dealer/leads"
          check dealer_inventory "$STOREFRONT/dealer/inventory"
          check dealer_inventory_new "$STOREFRONT/dealer/inventory/new"
          check dealer_inventory_logs "$STOREFRONT/dealer/inventory/logs"
          check dealer_crm "$STOREFRONT/dealer/crm"
          check admin "$STOREFRONT/admin"
          check admin_login "$STOREFRONT/admin/login"
          check admin_users "$STOREFRONT/admin/users"
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          test "$fail" = 0

      - name: Crawl internal homepage links
        id: crawl
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "$STOREFRONT/" -o /tmp/home.html
          python3 - <<'PY' > /tmp/internal-links.txt
          from html.parser import HTMLParser
          from urllib.parse import urlparse
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.links=set()
              def handle_starttag(self, tag, attrs):
                  if tag != 'a': return
                  href=dict(attrs).get('href','').strip()
                  if href.startswith('/') and not href.startswith('//'):
                      self.links.add(href.split('#',1)[0] or '/')
          p=P(); p.feed(open('/tmp/home.html',encoding='utf-8').read())
          for x in sorted(p.links): print(x)
          PY
          fail=0; total=0
          : > /tmp/crawl.tsv
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            total=$((total+1))
            code="$(curl -sS -L -o /dev/null -w '%{http_code}' "$STOREFRONT$path" || echo 000)"
            printf '%s\t%s\n' "$code" "$path" | tee -a /tmp/crawl.tsv
            if [ "$code" = 000 ] || [ "$code" = 404 ] || [ "$code" -ge 500 ] 2>/dev/null; then fail=$((fail+1)); fi
          done < /tmp/internal-links.txt
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          test "$fail" = 0

      - name: Security headers and hero assets
        id: headers
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSI "$STOREFRONT/" > /tmp/headers.txt
          grep -qi '^strict-transport-security:' /tmp/headers.txt
          grep -qi '^content-security-policy:' /tmp/headers.txt
          grep -qi '^x-content-type-options: *nosniff' /tmp/headers.txt
          grep -qi '^x-frame-options:' /tmp/headers.txt
          for asset in /wdcc-logo-transparent.webp /wdcc-hero-v2.webp; do
            code="$(curl -sS -L -o /tmp/asset.bin -w '%{http_code}' "$STOREFRONT$asset")"
            test "$code" = 200
            test "$(wc -c < /tmp/asset.bin)" -gt 1000
          done

      - name: Public inventory contract
        id: inventory
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/inventory.json -w '%{http_code}' "$STOREFRONT/api/inventory?qa=${GITHUB_RUN_ID}")"
          test "$code" = 200
          jq -e '.ok == true and ((.items // [])|type)=="array"' /tmp/inventory.json >/dev/null
          jq -e 'all((.items // [])[]; ((.status|ascii_downcase)=="published") and (.year > 1900) and ((.make|length)>0) and ((.model|length)>0) and (.price > 0) and (((.stock // "")|ascii_upcase|startswith("R36TEST-"))|not) and (((.badges // [])|map(ascii_upcase)|index("R36-TEST")) == null))' /tmp/inventory.json >/dev/null
          echo "count=$(jq '(.items // [])|length' /tmp/inventory.json)" >> "$GITHUB_OUTPUT"

      - name: Three attributed lead contracts plus idempotency
        id: leads
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          RUN="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          post(){
            kind="$1"; source="$2"; suffix="$3"; phone="$4"
            curl -sS -X POST "$STOREFRONT/api/leads" \
              -H 'content-type: application/json' \
              -H "idempotency-key: wdcc-qa-deep-$suffix-$RUN" \
              --data "{\"qa\":true,\"kind\":\"$kind\",\"name\":\"WDCC QA DEEP $suffix $RUN\",\"phone\":\"$phone\",\"email\":\"qa-deep-$suffix-$RUN@invalid.example\",\"vehicleInterest\":\"Deep QA synthetic vehicle\",\"preferredTime\":\"QA only\",\"message\":\"Automated WDCC deep QA - do not contact\",\"consent\":true,\"source\":\"$source\"}"
          }
          post schedule schedule-test-drive schedule 813-555-0111 > /tmp/schedule.json
          post approval get-approved approval 813-555-0112 > /tmp/approval.json
          post contact call-sean contact 813-555-0113 > /tmp/contact.json
          jq -e '.ok==true and .persisted==true and .item.kind=="schedule" and .item.source=="schedule-test-drive" and .qa==true' /tmp/schedule.json >/dev/null
          jq -e '.ok==true and .persisted==true and .item.kind=="approval" and .item.source=="get-approved" and .qa==true' /tmp/approval.json >/dev/null
          jq -e '.ok==true and .persisted==true and .item.kind=="contact" and .item.source=="call-sean" and .qa==true' /tmp/contact.json >/dev/null
          post schedule schedule-test-drive schedule 813-555-0111 > /tmp/dedupe.json
          jq -e '.ok==true and .deduplicated==true' /tmp/dedupe.json >/dev/null
          echo "schedule=$(jq -r '.item.id' /tmp/schedule.json)" >> "$GITHUB_OUTPUT"
          echo "approval=$(jq -r '.item.id' /tmp/approval.json)" >> "$GITHUB_OUTPUT"
          echo "contact=$(jq -r '.item.id' /tmp/contact.json)" >> "$GITHUB_OUTPUT"

      - name: Dealer authorization gates
        id: authgate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          post_code="$(curl -sS -o /tmp/deny.json -w '%{http_code}' -X POST "$DEALER/api/inventory" -H 'content-type: application/json' --data '{"year":2020,"make":"QA","model":"AUTH-GATE","price":1}')"
          leads_code="$(curl -sS -o /tmp/leads-deny.json -w '%{http_code}' "$DEALER/api/leads")"
          echo "inventory_post=$post_code" >> "$GITHUB_OUTPUT"
          echo "leads_get=$leads_code" >> "$GITHUB_OUTPUT"
          { test "$post_code" = 401 || test "$post_code" = 403; }
          { test "$leads_code" = 401 || test "$leads_code" = 403; }

      - name: Backend and dealer health parity
        id: parity
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$STOREFRONT/api/health?deep=${GITHUB_RUN_ID}" -o /tmp/store-health.json
          curl -fsS "$DEALER/api/health?deep=${GITHUB_RUN_ID}" -o /tmp/dealer-health.json
          curl -fsS "$BACKEND/api/health?deep=${GITHUB_RUN_ID}" -o /tmp/backend-health.json
          jq -e '.ok==true and .degraded==false' /tmp/store-health.json >/dev/null
          jq -e '.ok==true and .degraded==false' /tmp/dealer-health.json >/dev/null
          jq -e '.ok==true and .degraded==false' /tmp/backend-health.json >/dev/null
          echo "store_commit=$(jq -r '.commit // "unknown"' /tmp/store-health.json)" >> "$GITHUB_OUTPUT"
          echo "dealer_commit=$(jq -r '.commit // "unknown"' /tmp/dealer-health.json)" >> "$GITHUB_OUTPUT"
          echo "backend_commit=$(jq -r '.commit // "unknown"' /tmp/backend-health.json)" >> "$GITHUB_OUTPUT"

      - name: Report deep QA result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPS: ${{ steps.deps.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          BUILD: ${{ steps.build.outcome }}
          STAGEDNAV: ${{ steps.stagednav.outcome }}
          STAGED_BAD: ${{ steps.stagednav.outputs.bad }}
          ROUTES: ${{ steps.routes.outcome }}
          ROUTE_FAIL: ${{ steps.routes.outputs.fail }}
          CRAWL: ${{ steps.crawl.outcome }}
          CRAWL_TOTAL: ${{ steps.crawl.outputs.total }}
          CRAWL_FAIL: ${{ steps.crawl.outputs.fail }}
          HEADERS: ${{ steps.headers.outcome }}
          INVENTORY: ${{ steps.inventory.outcome }}
          INVENTORY_COUNT: ${{ steps.inventory.outputs.count }}
          LEADS: ${{ steps.leads.outcome }}
          SCHEDULE: ${{ steps.leads.outputs.schedule }}
          APPROVAL: ${{ steps.leads.outputs.approval }}
          CONTACT: ${{ steps.leads.outputs.contact }}
          AUTH: ${{ steps.authgate.outcome }}
          AUTH_POST: ${{ steps.authgate.outputs.inventory_post }}
          AUTH_LEADS: ${{ steps.authgate.outputs.leads_get }}
          PARITY: ${{ steps.parity.outcome }}
          STORE_COMMIT: ${{ steps.parity.outputs.store_commit }}
          DEALER_COMMIT: ${{ steps.parity.outputs.dealer_commit }}
          BACKEND_COMMIT: ${{ steps.parity.outputs.backend_commit }}
        shell: bash
        run: |
          body=$(cat <<EOF
          ## WDCC deep QA

          - Dependencies: **$DEPS**
          - TypeScript: **$TYPECHECK**
          - Lint: **$LINT**
          - Dependency audit: **$AUDIT**
          - Production build: **$BUILD**
          - Staged hybrid navigation: **$STAGEDNAV** (broken targets: ${STAGED_BAD:-unknown})
          - Live route matrix: **$ROUTES** (failures: ${ROUTE_FAIL:-unknown})
          - Homepage internal-link crawl: **$CRAWL** (${CRAWL_TOTAL:-0} checked, ${CRAWL_FAIL:-unknown} failed)
          - Security headers/assets: **$HEADERS**
          - Public inventory contract: **$INVENTORY** (${INVENTORY_COUNT:-unknown} visible vehicles)
          - Three lead contracts + idempotency: **$LEADS**
            - schedule: ${SCHEDULE:-unknown}
            - approval: ${APPROVAL:-unknown}
            - contact: ${CONTACT:-unknown}
          - Dealer auth gates: **$AUTH** (inventory POST ${AUTH_POST:-unknown}, leads GET ${AUTH_LEADS:-unknown})
          - Health parity: **$PARITY**
            - storefront commit: ${STORE_COMMIT:-unknown}
            - dealer commit: ${DEALER_COMMIT:-unknown}
            - backend commit: ${BACKEND_COMMIT:-unknown}

          This workflow does not deploy anything.
          EOF
          )
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC deep QA ${GITHUB_RUN_ID}" --body "$body" || true

      - name: Enforce QA gate
        if: always()
        env:
          DEPS: ${{ steps.deps.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          BUILD: ${{ steps.build.outcome }}
          STAGEDNAV: ${{ steps.stagednav.outcome }}
          ROUTES: ${{ steps.routes.outcome }}
          CRAWL: ${{ steps.crawl.outcome }}
          HEADERS: ${{ steps.headers.outcome }}
          INVENTORY: ${{ steps.inventory.outcome }}
          LEADS: ${{ steps.leads.outcome }}
          AUTH: ${{ steps.authgate.outcome }}
          PARITY: ${{ steps.parity.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for value in "$DEPS" "$TYPECHECK" "$LINT" "$AUDIT" "$BUILD" "$STAGEDNAV" "$ROUTES" "$CRAWL" "$HEADERS" "$INVENTORY" "$LEADS" "$AUTH" "$PARITY"; do
            [ "$value" = success ] || fail=$((fail+1))
          done
          echo "QA failing checks: $fail"
          test "$fail" = 0
