# trigger canonical reference cutover
name: WDCC Reference Alias Cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-reference-alias-cutover.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-reference-alias-cutover
  cancel-in-progress: true

env:
  VERCEL_SCOPE: cpxagency
  SOURCE: wdcc-v32-storefront-3ks09nai6-cpxagency.vercel.app
  CANONICAL: wdcc-v32-storefront-cpxagency.vercel.app
  APEX: https://wedontcarecars.com

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Require Vercel authority
        run: test -n "$VERCEL_TOKEN"
      - name: Install Vercel CLI
        run: npm install --global vercel@59.3.0
      - name: Pin canonical alias to verified reference clone
        shell: bash
        run: |
          set -euo pipefail
          vercel alias rm "$CANONICAL" --yes --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
          vercel alias set "$SOURCE" "$CANONICAL" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
      - name: Verify canonical alias
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 30); do
            code="$(curl -sS -L -o /tmp/canonical.html -w '%{http_code}' "https://$CANONICAL/?cutover=$GITHUB_RUN_ID" || true)"
            if [ "$code" = 200 ] && grep -q 'reference-home' /tmp/canonical.html && grep -q 'Vehicles ready now' /tmp/canonical.html; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
      - name: Verify public apex follows canonical source
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            code="$(curl -sS -L -o /tmp/apex.html -w '%{http_code}' "$APEX/?cutover=$GITHUB_RUN_ID&attempt=$i" || true)"
            if [ "$code" = 200 ] && grep -q 'reference-home' /tmp/apex.html; then echo 'PUBLIC_REFERENCE_CLONE=PASS'; exit 0; fi
            sleep 2
          done
          echo 'PUBLIC_REFERENCE_CLONE=PENDING_CLOUDFLARE'
          exit 0
