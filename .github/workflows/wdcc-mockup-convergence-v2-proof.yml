name: WDCC Mockup Convergence V2 Proof

on:
  push:
    branches: [preview/wdcc-mockup-convergence-20260827-v2-proof]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-mockup-v2-${{ github.sha }}
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WDCC_GATE_SCORER_SHA256: 77153296fbdadf7e17dffd0c44e44783504e0f35b5ca8b23c6d061b3789af25a
      WDCC_GATE_FINGERPRINTS_SHA256: 87dcb891d40d7f396eb583a331d999bb8c92dab93bb2b2ea13c32b62e27a7065
      WDCC_GATE_MEDIA_EVIDENCE_SHA256: 246e7ad3b790d3cacec9ed0008bf5d665d758aeec4155d9cd5057282f008de68
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify isolated visual scope
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -s app/wdcc-owner-board-convergence-v2.css
          test -s app/recoveredVisualMedia/nissan350z.ts
          test -s app/recoveredVisualMedia/fordF150.ts
          test -s app/recoveredVisualMedia/hondaPilot.ts
          test -s app/recoveredVisualMedia/kiaSportage.ts
          test -s app/recoveredVisualMedia/toyotaRav4.ts
          test -s public/wdcc-recovered-media/2004-nissan-350z.webp
          test -s public/wdcc-recovered-media/2016-ford-f150.webp
          test -s public/wdcc-recovered-media/2019-honda-pilot.webp
          test -s public/wdcc-recovered-media/2019-kia-sportage.webp
          test -s public/wdcc-recovered-media/2019-toyota-rav4.webp
          test -s public/wdcc-mockup-preview/2020-dodge-challenger-sxt.webp
          test -s public/wdcc-mockup-preview/2019-dodge-charger-rt.webp
          test -s public/wdcc-mockup-preview/2018-chevrolet-camaro-lt.webp
          test -s public/wdcc-mockup-preview/2020-jeep-grand-cherokee-laredo.webp
          test -s public/wdcc-mockup-preview/2018-ford-f150-xlt.webp
          test -s public/wdcc-dealer-proof/reference-only/README.md
          test -s public/wdcc-dealer-proof/reference-only/01-front-angle.webp
          test -s public/wdcc-dealer-proof/reference-only/02-interior.webp
          test -s public/wdcc-dealer-proof/reference-only/03-rear-road.webp
          test -s public/wdcc-dealer-proof/reference-only/04-rear-skyline.webp
          test -s public/wdcc-dealer-proof/reference-only/05-rear-side.webp
          test -s public/wdcc-dealer-proof/reference-only/06-rear-close.webp
          test -s public/wdcc-dealer-proof/reference-only-preview.webp
          test -s app/dealer-editor-r31-convergence.css
          test -s app/favicon.ico
          grep -q 'RECOVERED FIRST-PARTY MEDIA' app/wdccVisualReviewInventory.ts
          grep -q 'withWdccRecoveredReviewMedia' app/ReferenceCloneHome.tsx
          grep -q 'pointer:coarse' app/wdcc-r31-owner-convergence.css
          grep -Fq 'wizardStep${step+1}' app/dealer/inventory/VehicleEditor.tsx
          test -s lib/visualProofInventory.ts
          grep -Fq 'if(isIsolatedWorkersDevRequest(request)&&process.env.WDCC_MOCKUP_PREVIEW==="1"){' app/api/inventory/route.ts
          grep -Fq 'const fixture=mockupPreviewInventoryPayload();' app/api/inventory/route.ts
          grep -Fq '"X-WDCC-Inventory-Source":"r31-r25-design-reference"' app/api/inventory/route.ts
          grep -Fq '"X-WDCC-Inventory-Live":"false"' app/api/inventory/route.ts
          grep -Fq '"X-WDCC-Mockup-Preview":"forced"' app/api/inventory/route.ts
          grep -Fq 'mockupPreview:true' lib/visualProofInventory.ts
          grep -Fq 'inventorySource:"r31-r25-design-reference"' lib/visualProofInventory.ts
          grep -Fq 'live:false' lib/visualProofInventory.ts
          ! grep -Fq 'visualProofInventoryFallback' app/api/inventory/route.ts
          grep -q 'data-wdcc-cinematic-intro="owner-v3"' app/LockedIntro.tsx
          grep -q 'wdcc-owner-board-convergence-v2.css' app/layout.tsx
          test "$(sha256sum .github/support/wdcc-mockup-95-score.mjs | awk '{print $1}')" = "$WDCC_GATE_SCORER_SHA256"
          test "$(sha256sum .github/support/wdcc-mockup-fingerprints.mjs | awk '{print $1}')" = "$WDCC_GATE_FINGERPRINTS_SHA256"
          test "$(sha256sum .github/support/wdcc-dealer-media-evidence.mjs | awk '{print $1}')" = "$WDCC_GATE_MEDIA_EVIDENCE_SHA256"

      - name: Build exact candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0 playwright@1.55.0
          node --test .github/support/wdcc-dealer-media-evidence.test.mjs
          node .github/support/wdcc-mockup-95-score.mjs --self-test
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets
          test -s .next/BUILD_ID
          npx playwright install --with-deps chromium >/dev/null

      - name: Create SHA-only no-route worker config
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          c.name=`wdcc-v2-${process.env.GITHUB_SHA.slice(0,12)}`;
          c.workers_dev=true;
          c.preview_urls=true;
          c.vars={...(c.vars||{}),WDCC_MOCKUP_PREVIEW:"1"};
          delete c.route;
          delete c.routes;
          fs.writeFileSync('wrangler.mockup-v2.jsonc',JSON.stringify(c,null,2)+'\n');
          NODE
          ! grep -qi 'wedontcarecars.com' wrangler.mockup-v2.jsonc

      - name: Upload immutable preview version without deployment
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          export WRANGLER_OUTPUT_FILE_PATH=/tmp/wrangler-version-upload.ndjson
          : > "$WRANGLER_OUTPUT_FILE_PATH"
          npx wrangler versions upload --config wrangler.mockup-v2.jsonc 2>&1 | tee /tmp/versions-upload.log
          test -s "$WRANGLER_OUTPUT_FILE_PATH"
          # Wrangler 4.90.0 writes NDJSON containing a wrangler-session entry
          # and one version-upload/v1 record; record order is not assumed.
          jq -se '
            ([.[] | select(.type == "wrangler-session" and .version == 1)]|length) >= 1 and
            ([.[] | select(.type == "command-failed")]|length) == 0 and
            ([.[] | select(.type == "version-upload" and .version == 1)]|length) == 1 and
            ([.[] | select(.type == "version-upload" and .version == 1)][0]) as $record |
            (($record.worker_name|type) == "string") and (($record.worker_name|length) > 0) and
            (($record.version_id|type) == "string") and (($record.version_id|length) > 0) and
            (($record.preview_url|type) == "string") and (($record.preview_url|length) > 0)
          ' "$WRANGLER_OUTPUT_FILE_PATH" >/dev/null
          version_record="$(jq -cs '[.[] | select(.type == "version-upload")][0]' "$WRANGLER_OUTPUT_FILE_PATH")"
          version_id="$(jq -r '.version_id // empty' <<< "$version_record")"
          url="$(jq -r '.preview_url // empty' <<< "$version_record")"
          worker_name="wdcc-v2-${GITHUB_SHA:0:12}"
          record_worker="$(jq -r '.worker_name // empty' <<< "$version_record")"
          test -n "$version_id"
          test -n "$url"
          [[ "$version_id" =~ ^[0-9A-Fa-f-]{8,64}$ ]]
          test "$record_worker" = "$worker_name"
          url="$(node -e 'const u=new URL(process.argv[1]);if(u.protocol!=="https:"||u.username||u.password||u.port||u.pathname!=="/"||u.search||u.hash)process.exit(1);process.stdout.write(u.origin)' "$url")"
          preview_host="$(node -e 'process.stdout.write(new URL(process.argv[1]).hostname.toLowerCase())' "$url")"
          preview_label="${preview_host%%.*}"
          case "$preview_host" in "$preview_label".*.workers.dev) ;; *) echo "not a versioned workers.dev preview: $url" >&2; exit 1;; esac
          case "$preview_label" in *-"$worker_name") ;; *) echo "preview is not bound to worker $worker_name: $url" >&2; exit 1;; esac
          version_prefix="${preview_label%-${worker_name}}"
          test -n "$version_prefix"
          test "$preview_label" = "${version_prefix}-${worker_name}"
          case "$version_prefix" in *[!a-z0-9-]*) echo "invalid version prefix: $version_prefix" >&2; exit 1;; esac
          expected_version_prefix="${version_id:0:8}"
          expected_version_prefix="${expected_version_prefix,,}"
          test "$version_prefix" = "$expected_version_prefix"
          {
            echo "url=$url"
            echo "version_id=$version_id"
            echo "version_prefix=$version_prefix"
            echo "worker_name=$worker_name"
          } >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > mockup-v2-preview-url.txt
          printf 'upload_mode=wrangler-versions-upload-not-deployed\nwrangler_output_schema=version-upload/v1\nurl=%s\nworker_name=%s\nversion_prefix=%s\ncloudflare_version_id=%s\nsha=%s\n' "$url" "$worker_name" "$version_prefix" "$version_id" "$GITHUB_SHA" > mockup-v2-preview-version.txt

      - name: Prove remote build identity
        shell: bash
        env:
          REMOTE_URL: ${{ steps.upload.outputs.url }}
          CLOUDFLARE_VERSION_ID: ${{ steps.upload.outputs.version_id }}
          CLOUDFLARE_VERSION_PREFIX: ${{ steps.upload.outputs.version_prefix }}
          CLOUDFLARE_WORKER_NAME: ${{ steps.upload.outputs.worker_name }}
        run: |
          set -euo pipefail
          test -n "$REMOTE_URL"
          test -n "$CLOUDFLARE_VERSION_ID"
          test -n "$CLOUDFLARE_VERSION_PREFIX"
          test -n "$CLOUDFLARE_WORKER_NAME"
          code=000
          for i in $(seq 1 18); do
            code="$(curl --http1.1 -sS -L -o /tmp/root.html -w '%{http_code}' "$REMOTE_URL/?owner-review=0&proof=$i" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          [ "$code" = 200 ]
          build="$(tr -d '\r\n' < .next/BUILD_ID)"
          grep -Fq "$build" /tmp/root.html
          health_code=000
          for i in $(seq 1 18); do
            : > /tmp/health.headers
            health_code="$(curl --http1.1 -sS -D /tmp/health.headers -o /tmp/health.json -w '%{http_code}' "$REMOTE_URL/api/health?boundary-proof=$GITHUB_SHA&attempt=$i" || true)"
            tr -d '\r' < /tmp/health.headers > /tmp/health.headers.normalized
            if { [ "$health_code" = 200 ] || [ "$health_code" = 503 ]; } && grep -Eiq '^x-wdcc-backend:[[:space:]]*canonical-vercel[[:space:]]*$' /tmp/health.headers.normalized && grep -Eiq '^x-wdcc-data-authority:[[:space:]]*neon[[:space:]]*$' /tmp/health.headers.normalized; then
              break
            fi
            sleep 2
          done
          case "$health_code" in 200|503) ;; *) echo "canonical health boundary returned $health_code" >&2; exit 1;; esac
          grep -Eiq '^x-wdcc-backend:[[:space:]]*canonical-vercel[[:space:]]*$' /tmp/health.headers.normalized
          grep -Eiq '^x-wdcc-data-authority:[[:space:]]*neon[[:space:]]*$' /tmp/health.headers.normalized
          ! grep -Eiq '^x-wdcc-mockup-preview:' /tmp/health.headers.normalized
          hero_code=000
          for i in $(seq 1 18); do
            hero_code="$(curl --http1.1 -sS -L -o /tmp/hero.webp -w '%{http_code}' "$REMOTE_URL/wdcc-hero-v2.webp?asset-proof=$i" || true)"
            [ "$hero_code" = 200 ] && break
            sleep 2
          done
          [ "$hero_code" = 200 ]
          [ "$(sha256sum /tmp/hero.webp|awk '{print $1}')" = "$(sha256sum public/wdcc-hero-v2.webp|awk '{print $1}')" ]
          curl --http1.1 -fsSL "$REMOTE_URL/wdcc-hero-canonical.webp?asset-proof=$GITHUB_SHA" -o /tmp/hero-canonical.webp
          [ "$(sha256sum /tmp/hero-canonical.webp|awk '{print $1}')" = "$(sha256sum public/wdcc-hero-canonical.webp|awk '{print $1}')" ]
          for asset in public/wdcc-recovered-media/*.webp public/wdcc-mockup-preview/*.webp public/wdcc-dealer-proof/reference-only/*.webp public/wdcc-dealer-proof/reference-only-preview.webp; do
            remote_asset="${asset#public/}"
            curl --http1.1 -fsSL "$REMOTE_URL/$remote_asset?asset-proof=$GITHUB_SHA" -o "/tmp/$(basename "$asset")"
            [ "$(sha256sum "/tmp/$(basename "$asset")"|awk '{print $1}')" = "$(sha256sum "$asset"|awk '{print $1}')" ]
          done
          curl --http1.1 -fsSL "$REMOTE_URL/favicon.ico?asset-proof=$GITHUB_SHA" -o /tmp/favicon.ico
          [ "$(sha256sum /tmp/favicon.ico|awk '{print $1}')" = "$(sha256sum app/favicon.ico|awk '{print $1}')" ]
          inventory_code="$(curl --http1.1 -sS -D /tmp/inventory.headers -o /tmp/inventory.json -w '%{http_code}' "$REMOTE_URL/api/inventory")"
          [ "$inventory_code" = 200 ]
          grep -qi '^x-wdcc-mockup-preview: forced' /tmp/inventory.headers
          jq -e '.mockupPreview == true and .inventorySource == "r31-r25-design-reference" and (.items|length) == 5 and ([.items[].primary_image_url|startswith("/wdcc-mockup-preview/")]|all) and ([.items[]|(.year|tostring)+" "+.make+" "+.model+" "+.trim] == ["2020 Dodge Challenger SXT","2019 Dodge Charger R/T","2018 Chevrolet Camaro LT","2020 Jeep Grand Cherokee Laredo","2018 Ford F-150 XLT"])' /tmp/inventory.json >/dev/null
          {
            printf 'url=%s\nsha=%s\n' "$REMOTE_URL" "$GITHUB_SHA"
            printf 'cloudflare_upload_mode=wrangler-versions-upload-not-deployed\nwrangler_output_schema=version-upload/v1\ncloudflare_worker_name=%s\ncloudflare_version_prefix=%s\ncloudflare_version_id=%s\n' "$CLOUDFLARE_WORKER_NAME" "$CLOUDFLARE_VERSION_PREFIX" "$CLOUDFLARE_VERSION_ID"
            printf 'build=%s\nhttp=%s\nhealth_http=%s\nhealth_backend=canonical-vercel\nhealth_data_authority=neon\nhero_http=%s\ninventory_http=%s\n' "$build" "$code" "$health_code" "$hero_code" "$inventory_code"
            printf 'inventory_mode=isolated-r31-r25-design-reference\nmockup_media=5/5\nfavicon=verified\n'
            printf 'scorer_sha256=%s\nfingerprints_sha256=%s\nmedia_evidence_sha256=%s\n' "$WDCC_GATE_SCORER_SHA256" "$WDCC_GATE_FINGERPRINTS_SHA256" "$WDCC_GATE_MEDIA_EVIDENCE_SHA256"
          } > mockup-v2-integrity.txt

      - name: Render owner-board proof and fail on regressions
        shell: bash
        env:
          REMOTE_URL: ${{ steps.upload.outputs.url }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {chromium} from 'playwright';
          import {measureDealerMediaEvidence} from './.github/support/wdcc-dealer-media-evidence.mjs';
          const out='mockup-v2-proof'; fs.mkdirSync(out,{recursive:true});
          const browser=await chromium.launch({headless:true,args:process.env.WDCC_LOCAL_HOST_RESOLVER==='1'?['--no-proxy-server','--host-resolver-rules=MAP local.workers.dev 127.0.0.1']:[]});
          const report={sha:process.env.GITHUB_SHA,url:process.env.REMOTE_URL,consoleErrors:[],failedRequests:[],httpErrors:[],writes:[],visualAssertions:[],ownerMobile:null,plainMobile:null,androidWide:null,desktop:null,dealerDesktop:null,dealerMobile:null};
          const androidUA='Mozilla/5.0 (Linux; Android 14; SM-S918U) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36';
          async function settleVisual(page,label){
            await page.addStyleTag({content:'html{scroll-behavior:auto!important}*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important}'});
            const assets=await page.evaluate(async()=>{
              if(document.fonts?.ready)await document.fonts.ready;
              await Promise.allSettled([...document.images].map(image=>typeof image.decode==='function'?image.decode():Promise.resolve()));
              const backgroundUrls=[...new Set([...document.querySelectorAll('*')].flatMap(element=>[...getComputedStyle(element).backgroundImage.matchAll(/url\(["']?([^"')]+)["']?\)/g)].map(match=>match[1])))];
              await Promise.all(backgroundUrls.map(url=>new Promise((resolve,reject)=>{
                const image=new Image(),timeout=setTimeout(()=>reject(new Error(`background timeout: ${url}`)),5000);
                image.onload=()=>{clearTimeout(timeout);resolve()};image.onerror=()=>{clearTimeout(timeout);reject(new Error(`background failed: ${url}`))};image.src=url;
                if(image.complete&&image.naturalWidth){clearTimeout(timeout);resolve()}
              })));
              await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
              return{fonts:document.fonts?.status||'unsupported',backgroundAssets:backgroundUrls.length};
            });
            let previous='',stableSamples=0;
            for(let sample=0;sample<16;sample++){
              const signature=await page.evaluate(()=>{
                const selectors=['.rh-header','.rh-hero','.rh-benefits','.rh-inventory','.rh-finance','.rh-trust','.editTop','.editSide','.editLayout','.editMain','.editRight','.photoVehicleInfo','.photoTools','.thumbGrid','.mobileReadiness'];
                const boxes=selectors.map(selector=>{const element=document.querySelector(selector);if(!element)return null;const box=element.getBoundingClientRect();return[selector,...[box.x,box.y,box.width,box.height].map(value=>Math.round(value*100)/100)]});
                return JSON.stringify([document.documentElement.scrollWidth,document.documentElement.scrollHeight,document.fonts?.status||'unsupported',boxes]);
              });
              stableSamples=signature===previous?stableSamples+1:0;
              previous=signature;
              if(stableSamples>=2)return{...assets,stableSamples:stableSamples+1,animations:'disabled'};
              await page.waitForTimeout(60);
            }
            throw new Error(`${label}_VISUAL_DID_NOT_SETTLE`);
          }
          async function run({viewport,label,query,isMobile=false,hasTouch=false,userAgent,inventoryProof=false,captureIntro=false}){
            const context=await browser.newContext({viewport,screen:isMobile?{width:390,height:844}:viewport,deviceScaleFactor:1,isMobile,hasTouch,userAgent,reducedMotion:'no-preference'});
            const page=await context.newPage();
            page.on('console',m=>{if(m.type()==='error'){const at=m.location();report.consoleErrors.push(`${label}: ${m.text()}${at.url?` @ ${at.url}:${at.lineNumber||0}`:''}`)}});
            page.on('pageerror',e=>report.consoleErrors.push(`${label}: ${String(e)}`));
            page.on('requestfailed',r=>{const failure=r.failure()?.errorText||'';if(!/ERR_ABORTED|NS_BINDING_ABORTED/i.test(failure))report.failedRequests.push(`${label}: ${r.url()} ${failure}`)});
            page.on('response',r=>{if(r.status()>=400&&new URL(r.url()).origin===new URL(process.env.REMOTE_URL).origin)report.httpErrors.push(`${label}: ${r.status()} ${r.url()}`)});
            let r=await page.goto(`${process.env.REMOTE_URL}/?${query}&proof=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:25000});
            if(!r||r.status()!==200)throw new Error(`${label}_ROOT_HTTP_${r?.status()||0}`);
            const intro=page.locator('.li');
            if(await intro.count())await intro.waitFor({state:'visible',timeout:7000});
            if(captureIntro){await page.waitForTimeout(650);await settleVisual(page,`${label}_intro`);await page.screenshot({path:`${out}/${label}-01-intro.png`,fullPage:false})}
            const skip=page.locator('.li-skip');
            if(await skip.count())await skip.click({force:true});
            await page.waitForFunction(()=>!document.querySelector('.li'),null,{timeout:4000});
            await page.waitForFunction(()=>document.querySelectorAll('.rh-grid article').length>=5,null,{timeout:7000});
            await page.waitForFunction(()=>[...document.querySelectorAll('.rh-grid article img')].filter(i=>i.complete&&i.naturalWidth>0).length>=5,null,{timeout:7000});
            const captureStability=await settleVisual(page,label);
            const metrics=await page.evaluate(()=>{
              const h1=document.querySelector('.rh-copy h1');
              const header=document.querySelector('.rh-header');
              const banner=document.querySelector('.wdccRecoveryInventoryBanner,.wdccOwnerReviewBanner');
              const cards=[...document.querySelectorAll('.rh-grid article')];
              const photos=cards.map(c=>c.querySelector('a:first-child img')).filter(Boolean);
              const visible=cards.filter(c=>{const b=c.getBoundingClientRect();return b.right>0&&b.left<innerWidth&&b.bottom>0&&b.top<innerHeight}).length;
              const benefits=document.querySelector('.rh-benefits');
              const menu=document.querySelector('.rh-menu');
              const logo=document.querySelector('.rh-logo');
              const logoImage=document.querySelector('.rh-logo img');
              const call=document.querySelector('.rh-call');
              const nav=document.querySelector('.rh-nav');
              const heroHeight=document.querySelector('.rh-hero')?.getBoundingClientRect().height||0;
              const benefitsHeight=benefits?.getBoundingClientRect().height||0;
              const inventoryTop=document.querySelector('.rh-inventory')?.getBoundingClientRect().top||0;
              const finance=document.querySelector('.rh-finance');
              const trust=document.querySelector('.rh-trust');
              const financeStart=document.querySelector('.finance-start');
              const expandedTrust=document.querySelector('.rh-trust-grid-expanded');
              const standardTrust=document.querySelector('.rh-trust-grid-standard');
              const proofCopy=document.querySelector('.rh-proof-copy');
              const primaryButton=document.querySelector('.rh-btn.red');
              const inventory=document.querySelector('.rh-inventory');
              const sectionHeading=document.querySelector('.rh-section-head h2');
              const heroArt=document.querySelector('.rh-hero-art');
              const redLine=document.querySelector('.rh-copy h1 .red');
              const blueLine=document.querySelector('.rh-copy h1 .blue');
              const benefitTexts=[...document.querySelectorAll('.rh-benefit')].map(el=>el.textContent?.replace(/\s+/g,' ').trim()||'');
              const benefitGeometry=[...document.querySelectorAll('.rh-benefit')].map(element=>{
                const geometry=node=>{if(!node)return null;const box=node.getBoundingClientRect();return{x:box.x,y:box.y,width:box.width,height:box.height,right:box.right,bottom:box.bottom}};
                const style=getComputedStyle(element),columns=style.gridTemplateColumns;
                return {box:geometry(element),icon:geometry(element.querySelector('.rh-icon')),heading:geometry(element.querySelector('strong')),copy:geometry(element.querySelector('small')),gridTracks:columns==='none'?0:columns.split(/\s+/).filter(Boolean).length,textAlign:style.textAlign};
              });
              // The card intentionally renders year/make as the eyebrow and
              // model/trim as the linked title.  Score the complete visible
              // identity instead of only the second line.
              const vehicleTitles=cards.map(card=>{
                const eyebrow=card.querySelector('div > p')?.textContent?.replace(/\s+/g,' ').trim()||'';
                const title=card.querySelector('div > a')?.textContent?.replace(/\s+/g,' ').trim()||'';
                return `${eyebrow} ${title}`.trim();
              });
              const vehiclePrices=cards.map(card=>card.querySelector('div > strong')?.textContent?.replace(/\s+/g,' ').trim()||'');
              const navLabels=[...document.querySelectorAll('.rh-nav a')].filter(el=>getComputedStyle(el).display!=='none').map(el=>el.textContent?.replace(/\s+/g,' ').trim()||'');
              const actionLabels=[...document.querySelectorAll('.rh-hero-actions a')].map(el=>el.textContent?.replace(/\s+/g,' ').trim()||'');
              const heroStyle=heroArt?getComputedStyle(heroArt):null;
              const h1Style=h1?getComputedStyle(h1):null;
