      - name: Enforce objective 95/100 mockup score
        if: always()
        shell: bash
        run: |
          node .github/support/wdcc-mockup-95-score.mjs mockup-v2-proof/metrics.json mockup-v2-proof

      - name: Summary
        if: always()
        shell: bash
        env:
          REMOTE_URL: ${{ steps.upload.outputs.url }}
          CLOUDFLARE_VERSION_ID: ${{ steps.upload.outputs.version_id }}
          CLOUDFLARE_VERSION_PREFIX: ${{ steps.upload.outputs.version_prefix }}
          CLOUDFLARE_WORKER_NAME: ${{ steps.upload.outputs.worker_name }}
        run: |
          printf 'scorer_sha256=%s\nfingerprints_sha256=%s\nmedia_evidence_sha256=%s\n' "$WDCC_GATE_SCORER_SHA256" "$WDCC_GATE_FINGERPRINTS_SHA256" "$WDCC_GATE_MEDIA_EVIDENCE_SHA256" > mockup-v2-gate-digests.txt
          echo '### WDCC Mockup Convergence V2' >> "$GITHUB_STEP_SUMMARY"
          echo "Exact SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Immutable version preview: ${REMOTE_URL:-not-created}" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare upload mode: versions upload (not deployed)" >> "$GITHUB_STEP_SUMMARY"
          echo "Wrangler output schema: version-upload/v1" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare worker: ${CLOUDFLARE_WORKER_NAME:-not-created}" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare version prefix: ${CLOUDFLARE_VERSION_PREFIX:-not-created}" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare version ID: ${CLOUDFLARE_VERSION_ID:-not-created}" >> "$GITHUB_STEP_SUMMARY"
          echo "Scorer SHA-256: $WDCC_GATE_SCORER_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "Fingerprints SHA-256: $WDCC_GATE_FINGERPRINTS_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "Media-evidence SHA-256: $WDCC_GATE_MEDIA_EVIDENCE_SHA256" >> "$GITHUB_STEP_SUMMARY"
          [ ! -s mockup-v2-proof/score-report.md ] || cat mockup-v2-proof/score-report.md >> "$GITHUB_STEP_SUMMARY"
          [ ! -s mockup-v2-proof/metrics.json ] || { echo '<details><summary>Raw measurements</summary>' >> "$GITHUB_STEP_SUMMARY"; echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat mockup-v2-proof/metrics.json >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; echo '</details>' >> "$GITHUB_STEP_SUMMARY"; }
          echo 'Preview only. Production untouched.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-mockup-v2-${{ github.sha }}
          path: |
            mockup-v2-preview-url.txt
            mockup-v2-preview-version.txt
            mockup-v2-gate-digests.txt
            mockup-v2-integrity.txt
            mockup-v2-proof/
          if-no-files-found: warn
          retention-days: 7
