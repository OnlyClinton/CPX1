name: WDCC Mockup Convergence V2 Proof

on:
  push:
    branches: [preview/wdcc-mockup-convergence-20260827-v2-proof]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-mockup-v2-${{ github.sha }}
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify isolated visual scope
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -s app/wdcc-owner-board-convergence-v2.css
          test -s app/recoveredVisualMedia/nissan350z.ts
          test -s app/recoveredVisualMedia/fordF150.ts
          test -s app/recoveredVisualMedia/hondaPilot.ts
          test -s app/recoveredVisualMedia/kiaSportage.ts
          test -s app/recoveredVisualMedia/toyotaRav4.ts
          grep -q 'RECOVERED FIRST-PARTY MEDIA' app/wdccVisualReviewInventory.ts
          grep -q 'data-wdcc-cinematic-intro="owner-v3"' app/LockedIntro.tsx
          grep -q 'wdcc-owner-board-convergence-v2.css' app/layout.tsx

      - name: Build exact candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0 playwright@1.55.0
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets
          test -s .next/BUILD_ID
          npx playwright install --with-deps chromium >/dev/null

      - name: Create SHA-only no-route worker config
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          c.name=`wdcc-v2-${process.env.GITHUB_SHA.slice(0,12)}`;
          c.workers_dev=true;
          c.preview_urls=true;
          delete c.route;
          delete c.routes;
          fs.writeFileSync('wrangler.mockup-v2.jsonc',JSON.stringify(c,null,2)+'\n');
          NODE
          ! grep -qi 'wedontcarecars.com' wrangler.mockup-v2.jsonc

      - name: Deploy immutable preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.mockup-v2.jsonc 2>&1 | tee /tmp/deploy.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/deploy.log | tail -1)"
          test -n "$url"
          case "$url" in *"${GITHUB_SHA:0:12}"*) ;; *) echo "preview is not SHA-bound: $url" >&2; exit 1;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > mockup-v2-preview-url.txt

      - name: Prove remote build identity
        shell: bash
        env:
          REMOTE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          code=000
          for i in $(seq 1 18); do
            code="$(curl --http1.1 -sS -L -o /tmp/root.html -w '%{http_code}' "$REMOTE_URL/?owner-review=1&proof=$i" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          [ "$code" = 200 ]
          build="$(tr -d '\r\n' < .next/BUILD_ID)"
          grep -Fq "$build" /tmp/root.html
          curl --http1.1 -fsSL "$REMOTE_URL/wdcc-hero-v2.webp" -o /tmp/hero.webp
          [ "$(sha256sum /tmp/hero.webp|awk '{print $1}')" = "$(sha256sum public/wdcc-hero-v2.webp|awk '{print $1}')" ]
          printf 'url=%s\nsha=%s\nbuild=%s\nhttp=%s\n' "$REMOTE_URL" "$GITHUB_SHA" "$build" "$code" > mockup-v2-integrity.txt

      - name: Render owner-board proof and fail on regressions
        shell: bash
        env:
          REMOTE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {chromium} from 'playwright';
          const out='mockup-v2-proof'; fs.mkdirSync(out,{recursive:true});
          const browser=await chromium.launch({headless:true});
          const report={sha:process.env.GITHUB_SHA,url:process.env.REMOTE_URL,consoleErrors:[],mobile:null,desktop:null};
          async function run(viewport,label){
            const context=await browser.newContext({viewport,deviceScaleFactor:1,isMobile:label==='mobile',hasTouch:label==='mobile',reducedMotion:'no-preference'});
            const page=await context.newPage();
            page.on('console',m=>{if(m.type()==='error')report.consoleErrors.push(`${label}: ${m.text()}`)});
            page.on('pageerror',e=>report.consoleErrors.push(`${label}: ${String(e)}`));
            let r=await page.goto(`${process.env.REMOTE_URL}/?owner-review=1&intro=1&proof=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:25000});
            if(!r||r.status()!==200)throw new Error(`${label}_ROOT_HTTP_${r?.status()||0}`);
            await page.locator('.li').waitFor({state:'visible',timeout:7000});
            await page.waitForTimeout(650);
            await page.screenshot({path:`${out}/${label}-01-intro.png`,fullPage:false});
            const skip=page.locator('.li-skip');
            if(await skip.count())await skip.click({force:true});
            await page.waitForFunction(()=>!document.querySelector('.li'),null,{timeout:3500});
            await page.waitForFunction(()=>document.querySelectorAll('.rh-grid article').length>=5,null,{timeout:7000});
            await page.waitForTimeout(250);
            const metrics=await page.evaluate(()=>{
              const h1=document.querySelector('.rh-copy h1');
              const banner=document.querySelector('.wdccRecoveryInventoryBanner,.wdccOwnerReviewBanner');
              const cards=[...document.querySelectorAll('.rh-grid article')];
              const photos=cards.map(c=>c.querySelector('a:first-child img')).filter(Boolean);
              const visible=cards.filter(c=>{const b=c.getBoundingClientRect();return b.right>0&&b.left<innerWidth&&b.bottom>0&&b.top<innerHeight}).length;
              return {h1Font:h1?parseFloat(getComputedStyle(h1).fontSize):0,heroHeight:document.querySelector('.rh-hero')?.getBoundingClientRect().height||0,bannerHeight:banner?.getBoundingClientRect().height||0,cards:cards.length,visibleCards:visible,photoCount:photos.length,loadedPhotos:photos.filter(i=>i.complete&&i.naturalWidth>0).length,photoSources:photos.map(i=>i.getAttribute('src')?.slice(0,22)||'')};
            });
            if(metrics.cards<5)throw new Error(`${label}_CARDS_${metrics.cards}`);
            if(metrics.photoCount<5||metrics.loadedPhotos<5)throw new Error(`${label}_REAL_MEDIA_${JSON.stringify(metrics)}`);
            if(label==='mobile'&&metrics.h1Font>40.5)throw new Error(`MOBILE_HEADLINE_TOO_LARGE_${metrics.h1Font}`);
            if(label==='mobile'&&metrics.visibleCards<3)throw new Error(`MOBILE_DENSITY_${metrics.visibleCards}`);
            if(label==='mobile'&&metrics.bannerHeight>36)throw new Error(`MOBILE_RECOVERY_BANNER_TOO_TALL_${metrics.bannerHeight}`);
            if(label==='desktop'&&metrics.visibleCards<5)throw new Error(`DESKTOP_DENSITY_${metrics.visibleCards}`);
            await page.screenshot({path:`${out}/${label}-02-home.png`,fullPage:true});
            r=await page.goto(`${process.env.REMOTE_URL}/inventory?owner-review=1&visual-fixture=verified-real&proof=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:25000});
            if(!r||r.status()!==200)throw new Error(`${label}_INVENTORY_HTTP_${r?.status()||0}`);
            await page.waitForTimeout(900);
            await page.screenshot({path:`${out}/${label}-03-inventory.png`,fullPage:true});
            await context.close();
            return metrics;
          }
          try{report.mobile=await run({width:390,height:844},'mobile');report.desktop=await run({width:1440,height:1000},'desktop');fs.writeFileSync(`${out}/metrics.json`,JSON.stringify(report,null,2)+'\n')}catch(e){report.failure=String(e);fs.writeFileSync(`${out}/metrics.json`,JSON.stringify(report,null,2)+'\n');throw e}finally{await browser.close()}
          NODE

      - name: Summary
        if: always()
        shell: bash
        env:
          REMOTE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo '### WDCC Mockup Convergence V2' >> "$GITHUB_STEP_SUMMARY"
          echo "Exact SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Immutable no-route preview: ${REMOTE_URL:-not-created}" >> "$GITHUB_STEP_SUMMARY"
          [ ! -s mockup-v2-proof/metrics.json ] || cat mockup-v2-proof/metrics.json >> "$GITHUB_STEP_SUMMARY"
          echo 'Preview only. Production untouched.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-mockup-v2-${{ github.sha }}
          path: |
            mockup-v2-preview-url.txt
            mockup-v2-integrity.txt
            mockup-v2-proof/
          if-no-files-found: warn
          retention-days: 7
