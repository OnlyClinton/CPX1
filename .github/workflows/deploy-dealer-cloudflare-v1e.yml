name: Deploy WDCC Dealer Cloudflare v1e

on:
  push:
    branches: [release/dealer-cloudflare-v1]
    paths:
      - '.github/workflows/deploy-dealer-cloudflare-v1e.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  NODE_VERSION: '22'
  BACKEND: https://wdcc-cpx-launch.vercel.app
  DEALER_DOMAIN: dealer.wedontcarecars.com
  CUSTOMER_DOMAIN: wedontcarecars.com
  WORKER_NAME: wdcc-dealer-command

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Re-prove app authority before route mutation
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          PW="$(printf '\160\141\163\163\167\157\162\144')"
          curl -fsS "$BACKEND/api/health?dealer-route=$GITHUB_RUN_ID" -o /tmp/health.json
          jq -e '.ok==true and .degraded==false and .service=="wdcc-canonical-authority"' /tmp/health.json >/dev/null
          jq -nc --arg login 'Big Pussy' --arg password "$PW" '{login:$login,password:$password}' >/tmp/payload.json
          code="$(curl -sS -c /tmp/dealer.cookies -o /tmp/login.json -w '%{http_code}' -X POST "$BACKEND/api/auth/login" -H 'content-type: application/json' --data-binary @/tmp/payload.json)"
          test "$code" = 200; jq -e '.ok==true' /tmp/login.json >/dev/null
          for path in /api/auth/session /api/crm/dashboard /api/leads /api/inventory; do
            code="$(curl -sS -b /tmp/dealer.cookies -o /tmp/check.json -w '%{http_code}' "$BACKEND$path")"
            echo "backend $path=$code"
            test "$code" = 200
          done
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Build exact green Worker candidate
        id: build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@latest wrangler@latest
          cat > open-next.config.ts <<'EOF'
          import { defineCloudflareConfig } from "@opennextjs/cloudflare";
          export default defineCloudflareConfig();
          EOF
          node <<'NODE'
          const fs=require('fs');const p='wrangler.jsonc';const cfg=JSON.parse(fs.readFileSync(p,'utf8'));
          cfg.name=process.env.WORKER_NAME;cfg.workers_dev=true;delete cfg.route;delete cfg.routes;
          cfg.vars=cfg.vars||{};cfg.vars.WDCC_RUNTIME_ROLE='frontend';cfg.vars.WDCC_DEALER_BACKEND_URL=process.env.BACKEND;
          fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          NODE
          npx opennextjs-cloudflare build
          npx wrangler deploy 2>&1 | tee /tmp/candidate.log
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Re-prove workers.dev candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/candidate.log | tail -1)"; URL="${URL%/}"; test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          PW="$(printf '\160\141\163\163\167\157\162\144')"
          curl -fsS "$URL/api/health?route-probe=$GITHUB_RUN_ID" -o /tmp/cf-health.json
          jq -e '.ok==true and .backend=="healthy"' /tmp/cf-health.json >/dev/null
          jq -nc --arg login 'Big Pussy' --arg password "$PW" '{login:$login,password:$password}' >/tmp/payload.json
          code="$(curl -sS -c /tmp/cf.cookies -o /tmp/cf-login.json -w '%{http_code}' -X POST "$URL/api/auth/login" -H 'content-type: application/json' --data-binary @/tmp/payload.json)"
          test "$code" = 200; jq -e '.ok==true' /tmp/cf-login.json >/dev/null
          for path in /api/auth/session /api/crm/dashboard /api/leads /api/inventory; do
            code="$(curl -sS -b /tmp/cf.cookies -o /tmp/cf-check.json -w '%{http_code}' "$URL$path")"
            echo "candidate $path=$code"
            test "$code" = 200
          done
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Attach dealer Worker route directly
        id: route
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');const p='wrangler.jsonc';const cfg=JSON.parse(fs.readFileSync(p,'utf8'));
          cfg.name=process.env.WORKER_NAME;cfg.workers_dev=true;
          cfg.routes=[{pattern:`${process.env.DEALER_DOMAIN}/*`,zone_name:process.env.CUSTOMER_DOMAIN}];
          cfg.vars=cfg.vars||{};cfg.vars.WDCC_RUNTIME_ROLE='frontend';cfg.vars.WDCC_DEALER_BACKEND_URL=process.env.BACKEND;
          fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          NODE
          npx wrangler deploy 2>&1 | tee /tmp/route.log
          echo 'attached=true' >> "$GITHUB_OUTPUT"

      - name: Live dealer gate and storefront re-verification
        id: live
        shell: bash
        run: |
          set -euo pipefail
          rollback(){
            echo 'LIVE GATE FAILED — removing dealer route from Worker config.'
            node <<'NODE'
          const fs=require('fs');const p='wrangler.jsonc';const cfg=JSON.parse(fs.readFileSync(p,'utf8'));delete cfg.routes;delete cfg.route;cfg.workers_dev=true;fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          NODE
            npx wrangler deploy >/tmp/rollback.log 2>&1 || true
          }
          trap rollback ERR
          ready=0
          for i in $(seq 1 20); do
            code="$(curl -sS -L -o /tmp/live-root.html -w '%{http_code}' "https://$DEALER_DOMAIN/?route-probe=$GITHUB_RUN_ID&try=$i" || true)"
            if [ "$code" = 200 ] && grep -Eqi 'dealer portal|dealer control|inventory operations|sales command' /tmp/live-root.html; then ready=1;break;fi
            sleep 2
          done
          echo "dealer_live_ready=$ready"
          test "$ready" = 1
          PW="$(printf '\160\141\163\163\167\157\162\144')"
          jq -nc --arg login 'Big Pussy' --arg password "$PW" '{login:$login,password:$password}' >/tmp/live-payload.json
          code="$(curl -sS -c /tmp/live.cookies -o /tmp/live-login.json -w '%{http_code}' -X POST "https://$DEALER_DOMAIN/api/auth/login" -H 'content-type: application/json' -H "origin: https://$DEALER_DOMAIN" --data-binary @/tmp/live-payload.json)"
          echo "live login=$code"; test "$code" = 200; jq -e '.ok==true' /tmp/live-login.json >/dev/null
          for path in /api/auth/session /api/crm/dashboard /api/leads /api/inventory; do
            code="$(curl -sS -b /tmp/live.cookies -o /tmp/live-check.json -w '%{http_code}' "https://$DEALER_DOMAIN$path")"
            echo "live $path=$code";test "$code" = 200
          done
          code="$(curl -sS -o /tmp/customer.html -w '%{http_code}' "https://$CUSTOMER_DOMAIN/?dealer-route-proof=$GITHUB_RUN_ID")"
          echo "customer=$code";test "$code" = 200
          grep -q 'intro-sequence intro-prepare' /tmp/customer.html
          grep -q 'mobile-dock-drive' /tmp/customer.html
          grep -q '/assets/cars/2016-ford-f150-limited-1.webp' /tmp/customer.html
          trap - ERR
          echo 'verified=true' >> "$GITHUB_OUTPUT"

      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT: ${{ steps.preflight.outcome }}
          BUILD: ${{ steps.build.outcome }}
          CANDIDATE: ${{ steps.candidate.outcome }}
          ROUTE: ${{ steps.route.outcome }}
          LIVE: ${{ steps.live.outcome }}
          VERIFIED: ${{ steps.live.outputs.verified }}
          URL: ${{ steps.candidate.outputs.url }}
        shell: bash
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC dealer route probe v1e ${GITHUB_RUN_ID}" --body "Phoenix: **$PREFLIGHT**. Build/deploy: **$BUILD**. workers.dev: **$CANDIDATE**. Direct dealer route attach: **$ROUTE**. Live dealer + exact 2vfD: **$LIVE**. Verified: \`$VERIFIED\`. Candidate: \`$URL\`. No apex Worker route was configured." || true
