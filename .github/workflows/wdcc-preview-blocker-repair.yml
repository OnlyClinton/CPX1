name: WDCC Preview Blocker Repair

on:
  push:
    branches:
      - fix/wdcc-preview-provider-recovery-20260827
    paths:
      - '.github/workflows/wdcc-preview-blocker-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-preview-blocker-repair
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: '59.3.0'
  VERCEL_ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
  VERCEL_PROJECT_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
  RECOVERY_MODE: drive-r6-20260822

jobs:
  build-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify isolated Vercel build and recovery guard
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const ts=JSON.parse(fs.readFileSync('tsconfig.json','utf8'));
          if(!(ts.exclude||[]).includes('open-next.config.ts')) throw new Error('open-next.config.ts isolation missing');
          const recovery=fs.readFileSync('lib/wdccPreviewRecoveryState.ts','utf8');
          if(!recovery.includes('process.env.VERCEL_ENV==="preview"')) throw new Error('preview-only recovery guard missing');
          if(!recovery.includes('process.env.WDCC_PREVIEW_RECOVERY_STATE===RECOVERY_MODE')) throw new Error('recovery selector guard missing');
          const store=fs.readFileSync('lib/store.ts','utf8');
          if(!store.includes('PREVIEW_RECOVERY_READ_ONLY')) throw new Error('recovery write lock missing');
          NODE
          npm run build

  repair-preview:
    needs: build-safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Require Vercel credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"

      - name: Link Phoenix project without changing settings
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Deploy exactly one provider-independent recovery preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -uo pipefail
          log="$PWD/phoenix-preview-deploy.log"
          : > "$log"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --yes \
            --token="$VERCEL_TOKEN" \
            --scope=cpxagency \
            --env "WDCC_PREVIEW_RECOVERY_STATE=$RECOVERY_MODE" \
            --build-env "WDCC_PREVIEW_RECOVERY_STATE=$RECOVERY_MODE" \
            2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          clean="$(sed -r 's/\x1B\[[0-9;]*[mK]//g' "$log")"
          url="$(printf '%s\n' "$clean" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -1 || true)"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          if [ -z "$url" ]; then echo 'No immutable preview URL returned' >&2; exit 1; fi
          case "$url" in
            https://wdcc-cpx-launch.vercel.app|https://wedontcarecars.com|https://www.wedontcarecars.com)
              echo 'Refusing mutable/production domain' >&2; exit 1;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > phoenix-preview-url.txt

      - name: Health gate — one request only
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          code="$(curl -sS -L --connect-timeout 15 --max-time 30 -o health.json -w '%{http_code}' "$URL/api/health" || true)"
          code="${code:-000}"
          jq . health.json 2>/dev/null || cat health.json || true
          if [ "$code" != 200 ] || ! jq -e --arg mode "$RECOVERY_MODE" '.ok==true and .state=="readable" and .storage=="recovery-readonly" and .recoveryMode==$mode' health.json >/dev/null 2>&1; then
            jq -n --arg code "$code" '{classification:"health-blocked",http:$code,inventoryQueried:false,productionTouched:false}' > recovery-result.json
            exit 1
          fi

      - name: Inventory gate — only after readable health
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          code="$(curl -sS -L --connect-timeout 15 --max-time 30 -o inventory.json -w '%{http_code}' "$URL/api/inventory" || true)"
          code="${code:-000}"
          jq '{ok,count,error,revision}' inventory.json 2>/dev/null || cat inventory.json || true
          if [ "$code" != 200 ] || ! jq -e '.ok==true and .revision==1 and (.items|type=="array") and (.items|length==5) and ([.items[]|select((.stock//"")|test("^(R36TEST|QA|TEST)[-_]";"i"))]|length==0)' inventory.json >/dev/null 2>&1; then
            jq -n --arg code "$code" '{classification:"inventory-blocked",http:$code,inventoryQueried:true,productionTouched:false}' > recovery-result.json
            exit 1
          fi
          jq -n --arg url "$URL" --arg sha "$GITHUB_SHA" --arg mode "$RECOVERY_MODE" --argjson count "$(jq '.items|length' inventory.json)" '{classification:"preview-recovered",sha:$sha,url:$url,recoveryMode:$mode,inventoryCount:$count,productionTouched:false,blobRequests:0,authCertified:false}' > recovery-result.json

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wdcc-preview-blocker-repair-${{ github.sha }}
          path: |
            recovery-result.json
            phoenix-preview-deploy.log
            phoenix-preview-url.txt
            health.json
            inventory.json
          if-no-files-found: warn
          retention-days: 7
