name: WDCC Preview Blocker Repair

on:
  push:
    branches:
      - fix/wdcc-preview-provider-recovery-20260827
    paths:
      - '.github/workflows/wdcc-preview-blocker-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-preview-blocker-repair
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: '59.3.0'
  VERCEL_ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
  VERCEL_PROJECT_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
  TARGET_STORE_ID: store_WtHRfeknoGWfBJaG
  CANONICAL_PATH: private/state/platform-v3.json

jobs:
  build-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify isolated Vercel build
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const ts=JSON.parse(fs.readFileSync('tsconfig.json','utf8'));
          if(!(ts.exclude||[]).includes('open-next.config.ts')) throw new Error('open-next.config.ts isolation missing');
          NODE
          npm run build

  repair-preview:
    needs: build-safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Require Vercel credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"

      - name: Link Phoenix project without changing settings
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Seed sanitized off-Blob recovery ledger into isolated store
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          cat > .wdcc-preview-repair.mjs <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import {get,list,put} from '@vercel/blob';

          const oidc=(process.env.VERCEL_OIDC_TOKEN||'').trim();
          const target=process.env.TARGET_STORE_ID;
          const canonical=process.env.CANONICAL_PATH;
          if(!oidc) throw new Error('VERCEL_OIDC_TOKEN missing');
          if(!target||!canonical) throw new Error('recovery target configuration missing');

          const vehicles=[
            {year:2004,make:'Nissan',model:'350Z',trim:'',bodyStyle:'',condition:'Used',exteriorColor:'',interiorColor:'',transmission:'',drivetrain:'',fuelType:'',location:'Tampa Bay',price:4900,downPayment:2000,mileage:154000,vin:'',stock:'RECOVERED-2004-NISSAN-350Z',description:'',features:[],badges:['RECOVERED'],featured:true,submitForReview:false,status:'published',id:'recovered-2004-nissan-350z',tenantId:'wdcc',photoPathnames:[],primaryPhotoPathname:null,createdAt:'2026-08-21T13:32:19.309Z',updatedAt:'2026-08-21T13:32:19.309Z'},
            {year:2016,make:'Ford',model:'F150',trim:'Limited',bodyStyle:'Truck',condition:'Used',exteriorColor:'Black',interiorColor:'Black',transmission:'',drivetrain:'4x4',fuelType:'Gas',location:'Tampa Bay',price:15000,downPayment:6000,mileage:164000,vin:'',stock:'RECOVERED-2016-FORD-F150-LIM',description:'',features:[],badges:['RECOVERED'],featured:true,submitForReview:false,status:'published',id:'recovered-2016-ford-f150-limited',tenantId:'wdcc',photoPathnames:[],primaryPhotoPathname:null,createdAt:'2026-08-21T13:32:19.309Z',updatedAt:'2026-08-21T13:32:19.309Z'},
            {year:2019,make:'Honda',model:'Pilot',trim:'',bodyStyle:'',condition:'Used',exteriorColor:'',interiorColor:'',transmission:'',drivetrain:'',fuelType:'',location:'Tampa Bay',price:7900,downPayment:3000,mileage:380000,vin:'',stock:'RECOVERED-2019-HONDA-PILOT',description:'',features:[],badges:['RECOVERED'],featured:true,submitForReview:false,status:'published',id:'recovered-2019-honda-pilot',tenantId:'wdcc',photoPathnames:[],primaryPhotoPathname:null,createdAt:'2026-08-21T13:32:19.309Z',updatedAt:'2026-08-21T13:32:19.309Z'},
            {year:2019,make:'Kia',model:'Sportage',trim:'',bodyStyle:'Suv',condition:'Used',exteriorColor:'Black',interiorColor:'Charcoal',transmission:'',drivetrain:'',fuelType:'',location:'Tampa Bay',price:6500,downPayment:2500,mileage:127000,vin:'',stock:'RECOVERED-2019-KIA-SPORTAGE',description:'',features:[],badges:['RECOVERED'],featured:true,submitForReview:false,status:'published',id:'recovered-2019-kia-sportage',tenantId:'wdcc',photoPathnames:[],primaryPhotoPathname:null,createdAt:'2026-08-21T13:32:19.309Z',updatedAt:'2026-08-21T13:32:19.309Z'},
            {year:2019,make:'Toyota',model:'Rav4',trim:'',bodyStyle:'',condition:'Used',exteriorColor:'',interiorColor:'',transmission:'',drivetrain:'',fuelType:'',location:'Tampa Bay',price:10500,downPayment:4500,mileage:240000,vin:'',stock:'RECOVERED-2019-TOYOTA-RAV4',description:'',features:[],badges:['RECOVERED'],featured:true,submitForReview:false,status:'published',id:'recovered-2019-toyota-rav4',tenantId:'wdcc',photoPathnames:[],primaryPhotoPathname:null,createdAt:'2026-08-21T13:32:19.309Z',updatedAt:'2026-08-21T13:32:19.309Z'}
          ];

          const state={
            revision:1,
            tenants:[{id:'wdcc',name:"We Don't Care Cars"}],
            users:[],
            vehicles,
            leads:[],
            audit:[],
            updatedAt:'2026-08-22T04:34:34.000Z',
            recoverySource:'drive:r6-live-20260822-003343/inventory-before.json',
            recoveryScope:'preview-only-public-inventory',
            previewOnly:true
          };
          const raw=JSON.stringify(state,null,2)+'\n';
          const sha256=crypto.createHash('sha256').update(raw).digest('hex');
          const options={access:'private',useCache:false,oidcToken:oidc,storeId:target};
          async function read(pathname){
            const r=await get(pathname,options);
            if(!r||r.statusCode!==200||!r.stream) throw new Error(`GET_FAILED:${r?.statusCode||'none'}:${pathname}`);
            const chunks=[];
            for await(const chunk of r.stream) chunks.push(chunk);
            return Buffer.concat(chunks).toString('utf8');
          }
          const hash=(value)=>crypto.createHash('sha256').update(value).digest('hex');
          const publicEligible=(v)=>String(v.status||'').toLowerCase()==='published'&&Number.isInteger(Number(v.year))&&Number(v.year)>=1901&&Number(v.year)<=new Date().getUTCFullYear()+1&&Boolean(String(v.make||'').trim())&&Boolean(String(v.model||'').trim())&&Number(v.price)>0&&Number(v.downPayment||0)>=0&&Number(v.downPayment||0)<=Number(v.price)&&Number(v.mileage||0)>=0&&!/^R36TEST[-_]/i.test(String(v.stock||''));
          if(vehicles.length!==5||vehicles.some(v=>!publicEligible(v))) throw new Error('RECOVERY_DONOR_SAFETY_GATE_FAILED');

          let targetPaths=[];
          try{
            const targetListing=await list({prefix:'private/state/',limit:10,oidcToken:oidc,storeId:target});
            targetPaths=(targetListing?.blobs||[]).map(b=>b.pathname);
          }catch(error){
            fs.writeFileSync('recovery-target-diagnostic.json',JSON.stringify({targetStore:target,stage:'list',error:String(error?.message||error).slice(0,300),productionTouched:false},null,2)+'\n');
            throw error;
          }
          if(targetPaths.length>1||(targetPaths.length===1&&targetPaths[0]!==canonical)) throw new Error(`TARGET_STORE_NOT_ISOLATED:${targetPaths.join(',')}`);

          let seeded=false;
          try{
            if(targetPaths.length===1){
              const existing=await read(canonical);
              if(hash(existing)!==sha256) throw new Error('TARGET_CANONICAL_DIFFERS_REFUSING_OVERWRITE');
            }else{
              await put(canonical,raw,{access:'private',addRandomSuffix:false,allowOverwrite:false,contentType:'application/json',oidcToken:oidc,storeId:target});
              seeded=true;
            }
            const verify=await read(canonical);
            if(hash(verify)!==sha256) throw new Error('TARGET_HASH_MISMATCH');
          }catch(error){
            fs.writeFileSync('recovery-target-diagnostic.json',JSON.stringify({targetStore:target,stage:'seed-or-verify',error:String(error?.message||error).slice(0,300),productionTouched:false},null,2)+'\n');
            throw error;
          }

          const summary={source:'drive:r6-live-20260822-003343/inventory-before.json',targetStore:target,canonicalPath:canonical,revision:state.revision,publicInventoryCount:vehicles.length,stateSha256:sha256,seeded,sensitiveUsersCopied:false,customerDataCopied:false,productionStoreModified:false,productionRoutingModified:false};
          fs.writeFileSync('recovery-state-summary.json',JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify(summary));
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID npx --yes "vercel@${VERCEL_CLI_VERSION}" env run --environment=production --token="$VERCEL_TOKEN" --scope=cpxagency -- node .wdcc-preview-repair.mjs

      - name: Deploy exactly one isolated preview using recovered store
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -uo pipefail
          log="$PWD/phoenix-preview-deploy.log"
          : > "$log"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --yes \
            --token="$VERCEL_TOKEN" \
            --scope=cpxagency \
            --env "BLOB_READ_WRITE_TOKEN=" \
            --env "BLOB_STORE_ID=$TARGET_STORE_ID" \
            --build-env "BLOB_READ_WRITE_TOKEN=" \
            --build-env "BLOB_STORE_ID=$TARGET_STORE_ID" \
            2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          clean="$(sed -r 's/\x1B\[[0-9;]*[mK]//g' "$log")"
          url="$(printf '%s\n' "$clean" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -1 || true)"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          if [ -z "$url" ]; then echo 'No immutable preview URL returned' >&2; exit 1; fi
          case "$url" in
            https://wdcc-cpx-launch.vercel.app|https://wedontcarecars.com|https://www.wedontcarecars.com)
              echo 'Refusing mutable/production domain' >&2; exit 1;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > phoenix-preview-url.txt

      - name: Health gate — one request only
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          code="$(curl -sS -L --connect-timeout 15 --max-time 30 -o health.json -w '%{http_code}' "$URL/api/health" || true)"
          code="${code:-000}"
          jq . health.json 2>/dev/null || cat health.json || true
          if [ "$code" != 200 ] || ! jq -e '.ok==true and .state=="readable"' health.json >/dev/null 2>&1; then
            jq -n --arg code "$code" '{classification:"health-blocked",http:$code,inventoryQueried:false}' > recovery-result.json
            exit 1
          fi

      - name: Inventory gate — only after readable health
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          code="$(curl -sS -L --connect-timeout 15 --max-time 30 -o inventory.json -w '%{http_code}' "$URL/api/inventory" || true)"
          code="${code:-000}"
          jq '{ok,count,error,revision}' inventory.json 2>/dev/null || cat inventory.json || true
          if [ "$code" != 200 ] || ! jq -e '.ok==true and (.items|type=="array") and (.items|length==5) and ([.items[]|select((.stock//"")|test("^R36TEST[-_]";"i"))]|length==0)' inventory.json >/dev/null 2>&1; then
            jq -n --arg code "$code" '{classification:"inventory-blocked",http:$code,inventoryQueried:true}' > recovery-result.json
            exit 1
          fi
          jq -n --arg url "$URL" --arg sha "$GITHUB_SHA" --argjson count "$(jq '.items|length' inventory.json)" '{classification:"preview-recovered",sha:$sha,url:$url,inventoryCount:$count,productionTouched:false,authCertified:false}' > recovery-result.json

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wdcc-preview-blocker-repair-${{ github.sha }}
          path: |
            recovery-target-diagnostic.json
            recovery-state-summary.json
            recovery-result.json
            phoenix-preview-deploy.log
            phoenix-preview-url.txt
            health.json
            inventory.json
          if-no-files-found: warn
          retention-days: 7
