name: Probe WDCC Backend Session Secret
on:
  push:
    branches: [release/dealer-cloudflare-v1]
    paths:
      - '.github/workflows/probe-backend-session-secret.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM: cpxagency
      TEAM_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      PROJECT_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global vercel@59.3.0 >/dev/null
      - name: Pull production env and report only secret metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/probe/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$TEAM_ID" "$PROJECT_ID" >/tmp/probe/.vercel/project.json
          (cd /tmp/probe && env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env pull /tmp/backend.env --yes --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" >/dev/null)
          node <<'NODE'
          const fs=require('fs');
          const raw=fs.readFileSync('/tmp/backend.env','utf8');
          const line=raw.split(/\r?\n/).find(x=>x.startsWith('SESSION_SECRET='));
          if(!line){console.log('SESSION_SECRET_PRESENT=false');process.exit(2)}
          let value=line.slice('SESSION_SECRET='.length).trim();
          if((value.startsWith('"')&&value.endsWith('"'))||(value.startsWith("'")&&value.endsWith("'")))value=value.slice(1,-1);
          console.log('SESSION_SECRET_PRESENT=true');
          console.log('SESSION_SECRET_LENGTH='+value.length);
          console.log('SESSION_SECRET_PLACEHOLDER='+String(/^\*+$/.test(value)||value.includes('Encrypted')||value.includes('Sensitive')));
          if(value.length<32||/^\*+$/.test(value)||value.includes('Encrypted')||value.includes('Sensitive'))process.exit(3);
          NODE
          rm -f /tmp/backend.env
