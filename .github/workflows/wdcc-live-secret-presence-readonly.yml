name: WDCC Live Secret Presence Readonly

on:
  push:
    branches: [proof/wdcc-522-immutable-parser-20260829]
    paths:
      - '.github/workflows/wdcc-live-secret-presence-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      S_WDCC_DATABASE_URL: ${{ secrets.WDCC_DATABASE_URL }}
      S_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      S_POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      S_NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      S_WDCC_NEON_AUTH_URL: ${{ secrets.WDCC_NEON_AUTH_URL }}
      S_NEON_AUTH_URL: ${{ secrets.NEON_AUTH_URL }}
      S_CRON_SECRET: ${{ secrets.CRON_SECRET }}
      S_WDCC_CRON_SECRET: ${{ secrets.WDCC_CRON_SECRET }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          for n in WDCC_DATABASE_URL DATABASE_URL POSTGRES_URL NEON_DATABASE_URL WDCC_NEON_AUTH_URL NEON_AUTH_URL CRON_SECRET WDCC_CRON_SECRET; do
            v="S_${n}"; if [ -n "${!v:-}" ]; then echo "$n=PRESENT"; else echo "$n=MISSING"; fi
          done
          echo 'SECRET_VALUES_PRINTED=NO'
          echo 'READ_ONLY=YES'
