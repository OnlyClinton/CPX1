name: WDCC Cloudflare Dealer Capability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-cloudflare-dealer-capability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEON_AUTH: https://ep-curly-breeze-ay2iih1f.neonauth.c-5.us-east-2.aws.neon.tech/neondb/auth
      NEON_DATA: https://ep-curly-breeze-ay2iih1f.apirest.c-5.us-east-2.aws.neon.tech/neondb/rest/v1
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Wrangler
        run: npm install --global wrangler@4.90.0
      - name: Probe R2 authority read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          set +e
          wrangler r2 bucket list > /tmp/r2.out 2>/tmp/r2.err
          rc=$?
          set -e
          echo "R2_LIST_RC=$rc"
          if [ "$rc" = 0 ]; then
            echo 'R2_AUTHORITY=AVAILABLE' >> "$GITHUB_STEP_SUMMARY"
          else
            sed -E 's/[A-Za-z0-9_-]{30,}/[redacted]/g' /tmp/r2.err | tail -20
            echo 'R2_AUTHORITY=UNAVAILABLE' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Probe Neon Auth API without credentials
        shell: bash
        run: |
          set -euo pipefail
          session_code="$(curl -sS -o /tmp/session.json -w '%{http_code}' "$NEON_AUTH/get-session" || true)"
          signin_code="$(curl -sS -o /tmp/signin.json -w '%{http_code}' -X POST "$NEON_AUTH/sign-in/email" -H 'content-type: application/json' --data '{"email":"dealer@internal.wedontcarecars.com","password":"__definitely_invalid__"}' || true)"
          echo "NEON_GET_SESSION_HTTP=$session_code"
          echo "NEON_INVALID_SIGNIN_HTTP=$signin_code"
          jq '{user:(.user|if . then "present" else null end),session:(.session|if . then "present" else null end),error:(.error//.message//null)}' /tmp/session.json 2>/dev/null || true
          jq '{code:(.code//null),error:(.error//.message//null)}' /tmp/signin.json 2>/dev/null || true
          if [[ "$session_code" =~ ^(200|401)$ ]] && [[ "$signin_code" =~ ^(400|401|422)$ ]]; then
            echo 'NEON_AUTH_ENDPOINTS=AVAILABLE' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'NEON_AUTH_ENDPOINTS=UNKNOWN' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Probe Neon Data API auth enforcement
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/data.json -w '%{http_code}' "$NEON_DATA/vehicles?select=id&limit=1" || true)"
          echo "NEON_DATA_ANON_HTTP=$code"
          if [ "$code" = 401 ] || [ "$code" = 403 ]; then
            echo 'NEON_DATA_REQUIRES_AUTH=PASS' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'NEON_DATA_REQUIRES_AUTH=CHECK' >> "$GITHUB_STEP_SUMMARY"
          fi
