name: WDCC Trigger Frozen Acceptance 188392c
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-trigger-frozen-acceptance-188392c.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch frozen candidate acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wdcc-frozen-candidate-acceptance-188392c.yml --repo "$GITHUB_REPOSITORY" --ref main
