name: WDCC Immutable Visual Acceptance V2

on:
  push:
    branches:
      - fix/wdcc-locked-contract-20260826
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-immutable-visual-v2-${{ github.sha }}
  cancel-in-progress: false

jobs:
  visual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate supplied-board visual source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -s public/wdcc-hero-v2.webp
          test -s public/wdcc-logo-transparent.webp
          test -s app/LockedIntro.tsx
          test -s app/WdccPublicChrome.tsx
          test -s app/wdcc-owner-logo/route.ts
          test -s app/wdcc-owner-board-final.css
          test -s app/wdcc-round-header-contract.css
          test -s .github/support/wdcc-owner-board-rebuild-proof.mjs
          grep -Fq 'data-wdcc-intro-badge-art="owner-approved"' app/LockedIntro.tsx
          grep -Fq 'li-smoke' app/LockedIntro.tsx
          grep -Fq '@keyframes liSmokeClear' app/LockedIntro.tsx
          grep -Fq 'data-wdcc-logo-art="owner-wordmark"' app/WdccPublicChrome.tsx
          grep -Fq '/wdcc-logo-transparent.webp' app/WdccPublicChrome.tsx
          ! grep -Fq 'data-wdcc-logo-art="owner-approved"' app/WdccPublicChrome.tsx
          grep -Fq 'X-WDCC-Logo' app/wdcc-owner-logo/route.ts
          grep -Fq 'OWNER-SUPPLIED BOARD CLOSEOUT' app/wdcc-round-header-contract.css
          grep -Fq 'new-vehicle' app/dealer/inventory/new/page.tsx
          grep -Fq 'wdcc-round-header-contract.css' app/layout.tsx
          ! grep -Fq 'wdcc-system-v2.css' app/layout.tsx
          last_wdcc_css="$(grep -o 'import"\./wdcc-[^"]*\.css"' app/layout.tsx | tail -1 | sed 's/^import"\.\///;s/"$//')"
          test "$last_wdcc_css" = 'wdcc-round-header-contract.css'

      - name: Build exact Cloudflare candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0 playwright@1.55.0
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets
          test -s .next/BUILD_ID
          npx playwright install --with-deps chromium >/dev/null

      - name: Create SHA-specific no-route worker
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          cfg.name=`wiva-${process.env.GITHUB_SHA}`;
          cfg.workers_dev=true;
          cfg.preview_urls=true;
          delete cfg.route;
          delete cfg.routes;
          fs.writeFileSync('wrangler.immutable-visual.jsonc',JSON.stringify(cfg,null,2)+'\n');
          NODE
          ! grep -qi 'wedontcarecars.com' wrangler.immutable-visual.jsonc
          grep -Fq "$GITHUB_SHA" wrangler.immutable-visual.jsonc

      - name: Deploy immutable isolated preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.immutable-visual.jsonc 2>&1 | tee /tmp/wiva.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wiva.log | tail -1)"
          test -n "$url"
          case "$url" in *"$GITHUB_SHA"*) ;; *) echo "Immutable preview is not SHA-specific: $url" >&2; exit 1;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > immutable-preview-url.txt

      - name: Prove immutable remote integrity
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          code=000
          for i in $(seq 1 30); do
            code="$(curl --http1.1 -sS -L -o /tmp/wiva-home.html -w '%{http_code}' "$URL/?wiva-warm=$GITHUB_RUN_ID-$i" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          test "$code" = 200
          local_build="$(tr -d '\r\n' < .next/BUILD_ID)"
          grep -Fq "$local_build" /tmp/wiva-home.html
          grep -Fq 'data-wdcc-logo-art="owner-wordmark"' /tmp/wiva-home.html
          test "$(curl --http1.1 -sS -L -o /tmp/wiva-wordmark.webp -w '%{http_code}' "$URL/wdcc-logo-transparent.webp?asset=$GITHUB_RUN_ID")" = 200
          test "$(sha256sum /tmp/wiva-wordmark.webp | awk '{print $1}')" = "$(sha256sum public/wdcc-logo-transparent.webp | awk '{print $1}')"
          test "$(curl --http1.1 -sS -L -o /tmp/wiva-hero.webp -w '%{http_code}' "$URL/wdcc-hero-v2.webp?asset=$GITHUB_RUN_ID")" = 200
          test "$(sha256sum /tmp/wiva-hero.webp | awk '{print $1}')" = "$(sha256sum public/wdcc-hero-v2.webp | awk '{print $1}')"
          test "$(curl --http1.1 -sS -D /tmp/wiva-logo.headers -L -o /tmp/wiva-logo.webp -w '%{http_code}' "$URL/wdcc-owner-logo?asset=$GITHUB_RUN_ID")" = 200
          grep -qi '^x-wdcc-logo: owner-approved' /tmp/wiva-logo.headers
          printf 'sha=%s\nbuild=%s\nurl=%s\n' "$GITHUB_SHA" "$local_build" "$URL" > immutable-remote-integrity.txt

      - name: Prove intro smoke-to-clear contract
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p immutable-visual-proof
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {chromium} from 'playwright';
          const base=process.env.URL,sha=process.env.GITHUB_SHA;
          if(!base||!base.includes(sha))throw new Error(`INTRO_NOT_EXACT_SHA_${base||''}_${sha||''}`);
          const browser=await chromium.launch({headless:true});
          try{
            const ctx=await browser.newContext({viewport:{width:390,height:844},screen:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
            const page=await ctx.newPage();
            const response=await page.goto(`${base}/?visual-mobile=1&intro-proof=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
            if(!response||response.status()!==200)throw new Error(`INTRO_HTTP_${response?.status()||0}`);
            await page.locator('.li-smoke').waitFor({state:'visible',timeout:10000});
            await page.locator('.li-badge img[data-wdcc-intro-badge-art="owner-approved"]').waitFor({state:'visible',timeout:10000});
            const snap=()=>page.evaluate(()=>{const smoke=document.querySelector('.li-smoke'),badge=document.querySelector('.li-badge'),scene=document.querySelector('.li-scene img'),art=document.querySelector('.li-badge img[data-wdcc-intro-badge-art="owner-approved"]');const sr=getComputedStyle(smoke),b=badge.getBoundingClientRect(),s=scene.getBoundingClientRect();return{smokeOpacity:Number(sr.opacity),badge:{x:b.x,y:b.y,w:b.width,h:b.height,cx:b.x+b.width/2},scene:{x:s.x,y:s.y,w:s.width,h:s.height},art:{src:art.getAttribute('src')||'',naturalWidth:art.naturalWidth,naturalHeight:art.naturalHeight},winW:innerWidth}});
            const start=await snap();
            await page.screenshot({path:'immutable-visual-proof/intro-start.png'});
            await page.waitForTimeout(1450);
            const end=await snap();
            await page.screenshot({path:'immutable-visual-proof/intro-clear.png'});
            const badgeDelta=Math.hypot(end.badge.x-start.badge.x,end.badge.y-start.badge.y);
            const sceneDelta=Math.hypot(end.scene.x-start.scene.x,end.scene.y-start.scene.y);
            if(start.smokeOpacity<.35||end.smokeOpacity>.08||Math.abs(start.badge.cx-start.winW/2)>4||start.badge.w<230||badgeDelta>1||sceneDelta>1||!start.art.src.startsWith('data:image/')||start.art.naturalWidth<20||start.art.naturalHeight<20)throw new Error(`INTRO_CONTRACT_${JSON.stringify({start,end,badgeDelta,sceneDelta})}`);
            fs.writeFileSync('immutable-visual-proof/intro-result.json',JSON.stringify({sha,url:base,start,end,badgeDelta,sceneDelta,pass:true},null,2)+'\n');
            await ctx.close();
          }finally{await browser.close()}
          NODE

      - name: Prove supplied storefront and dealer boards
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          node .github/support/wdcc-owner-board-rebuild-proof.mjs
          test -s owner-board-proof/result.json
          node -e "const r=require('./owner-board-proof/result.json');if(!r.pass||r.writes.length)process.exit(1)"

      - name: Require current branch head before owner handoff
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test -n "$current"
          test "$current" = "$GITHUB_SHA"

      - name: Publish visual acceptance summary
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          echo '### WDCC immutable visual acceptance V2' >> "$GITHUB_STEP_SUMMARY"
          echo "Exact SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Immutable owner preview: ${URL:-not-created}" >> "$GITHUB_STEP_SUMMARY"
          if [ -s immutable-visual-proof/intro-result.json ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const p=require('./immutable-visual-proof/intro-result.json');
          console.log(`Intro round badge smoke → clear: ${p.start.smokeOpacity.toFixed(2)} → ${p.end.smokeOpacity.toFixed(2)} · badge movement ${p.badgeDelta.toFixed(2)} px · scene movement ${p.sceneDelta.toFixed(2)} px`);
          NODE
          fi
          if [ -s owner-board-proof/result.json ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const p=require('./owner-board-proof/result.json');
          console.log(`Owner supplied boards: pass=${p.pass} · board families=${Object.keys(p.boards||{}).length} · writes=${p.writes.length}`);
          NODE
          fi
          echo 'Visual success does not authorize merge or production promotion.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-immutable-visual-v2-${{ github.sha }}
          path: |
            immutable-preview-url.txt
            immutable-remote-integrity.txt
            immutable-visual-proof/
            owner-board-proof/
          if-no-files-found: warn
          retention-days: 7
