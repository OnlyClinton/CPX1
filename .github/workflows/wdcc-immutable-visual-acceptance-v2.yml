name: WDCC Immutable Visual Acceptance V2

on:
  push:
    branches:
      - fix/wdcc-locked-contract-20260826
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-immutable-visual-acceptance-v2-${{ github.sha }}
  cancel-in-progress: false

jobs:
  visual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate controlling visual source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -s public/wdcc-hero-v2.webp
          test -s public/wdcc-official-logo.webp
          test -s app/LockedIntro.tsx
          test -s app/ReferenceCloneHome.tsx
          test -s app/owner-device-final.css
          test -s scripts/wdcc-immutable-visual-proof.mjs
          grep -q 'href="/get-approved" aria-label="GET PRE-APPROVED">GET PRE-APPROVED<' app/ReferenceCloneHome.tsx
          grep -q 'href="/inventory" aria-label="BROWSE INVENTORY">BROWSE INVENTORY<' app/ReferenceCloneHome.tsx
          grep -q 'owner-device-final.css' app/layout.tsx
          grep -q 'li-smoke' app/LockedIntro.tsx
          grep -q '@keyframes liSmokeClear' app/LockedIntro.tsx
          ! grep -q 'li-dock' app/LockedIntro.tsx

      - name: Build exact Cloudflare candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0 playwright@1.55.0
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets
          test -s .next/BUILD_ID
          npx playwright install --with-deps chromium >/dev/null

      - name: Create SHA-specific no-route worker
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          cfg.name=`wdcc-proof-${process.env.GITHUB_SHA}`;
          cfg.workers_dev=true;
          cfg.preview_urls=true;
          delete cfg.route;
          delete cfg.routes;
          fs.writeFileSync('wrangler.immutable-visual.jsonc',JSON.stringify(cfg,null,2)+'\n');
          NODE
          ! grep -qi 'wedontcarecars.com' wrangler.immutable-visual.jsonc
          grep -q "$GITHUB_SHA" wrangler.immutable-visual.jsonc

      - name: Deploy immutable isolated preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.immutable-visual.jsonc 2>&1 | tee /tmp/wdcc-immutable-visual.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wdcc-immutable-visual.log | tail -1)"
          test -n "$url"
          case "$url" in *"$GITHUB_SHA"*) ;; *) echo "Preview is not SHA-specific: $url" >&2; exit 1;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > immutable-preview-url.txt

      - name: Prove immutable remote integrity
        id: remote_integrity
        env:
          REMOTE_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          code=000
          for i in $(seq 1 15); do
            code="$(curl --http1.1 -sS -L -o /tmp/wdcc-remote-root.html -w '%{http_code}' "$REMOTE_URL/?visual-mobile=warm-$GITHUB_SHA-$i" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          test "$code" = 200
          grep -qi 'bad credit' /tmp/wdcc-remote-root.html
          grep -q 'GET PRE-APPROVED' /tmp/wdcc-remote-root.html
          dealer_code="$(curl --http1.1 -sS -L -o /tmp/wdcc-remote-dealer.html -w '%{http_code}' "$REMOTE_URL/dealer?visual=remote-$GITHUB_SHA")"
          test "$dealer_code" = 200
          grep -q 'Dealer' /tmp/wdcc-remote-dealer.html
          remote_build="$(curl --http1.1 -fsSL "$REMOTE_URL/BUILD_ID" | tr -d '\r\n')"
          local_build="$(tr -d '\r\n' < .next/BUILD_ID)"
          test -n "$remote_build"
          test "$remote_build" = "$local_build"
          for asset in wdcc-hero-v2.webp wdcc-official-logo.webp; do
            curl --http1.1 -fsSL "$REMOTE_URL/$asset" -o "/tmp/remote-$asset"
            remote_sha="$(sha256sum "/tmp/remote-$asset" | awk '{print $1}')"
            local_sha="$(sha256sum "public/$asset" | awk '{print $1}')"
            test "$remote_sha" = "$local_sha"
          done
          echo "build_id=$local_build" >> "$GITHUB_OUTPUT"

      - name: Start exact-build browser harness
        id: browser_harness
        shell: bash
        run: |
          set -euo pipefail
          nohup npx next start -H 127.0.0.1 -p 4173 >/tmp/wdcc-exact-browser.log 2>&1 &
          echo $! >/tmp/wdcc-exact-browser.pid
          code=000
          for i in $(seq 1 30); do
            code="$(curl -sS -o /tmp/wdcc-local-root.html -w '%{http_code}' "http://127.0.0.1:4173/?visual-mobile=local-$GITHUB_SHA-$i" || true)"
            [ "$code" = 200 ] && break
            sleep 1
          done
          if [ "$code" != 200 ]; then
            cat /tmp/wdcc-exact-browser.log >&2 || true
            exit 1
          fi
          grep -qi 'bad credit' /tmp/wdcc-local-root.html
          grep -q 'GET PRE-APPROVED' /tmp/wdcc-local-root.html
          echo 'url=http://127.0.0.1:4173' >> "$GITHUB_OUTPUT"

      - name: Prove intro smoke-to-clear contract
        id: intro_proof
        env:
          URL: ${{ steps.browser_harness.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {chromium} from 'playwright';
          const base=process.env.URL;
          if(!base)throw new Error('BROWSER_HARNESS_URL_MISSING');
          const out='immutable-visual-proof';
          fs.mkdirSync(out,{recursive:true});
          const browser=await chromium.launch({headless:true});
          try{
            const ctx=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true,reducedMotion:'no-preference'});
            const page=await ctx.newPage();
            const response=await page.goto(`${base}/?visual-mobile=smoke-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:15000});
            if(!response||response.status()!==200)throw new Error(`INTRO_HARNESS_HTTP_${response?.status()||0}`);
            await page.locator('.li').waitFor({state:'attached',timeout:10000});
            await page.locator('.li-smoke').waitFor({state:'attached',timeout:5000});
            await page.locator('.li-badge img').waitFor({state:'visible',timeout:5000});
            await page.locator('.li-scene img').waitFor({state:'visible',timeout:5000});
            await page.waitForFunction(()=>[document.querySelector('.li-badge img'),document.querySelector('.li-scene img')].every(x=>x&&x.complete&&x.naturalWidth>0),null,{timeout:5000});
            const anim=await page.evaluate(()=>{
              const smoke=document.querySelector('.li-smoke');
              const a=smoke?.getAnimations()[0];
              if(!a)return null;
              a.pause();
              a.currentTime=250;
              return getComputedStyle(smoke).animationName;
            });
            if(anim!=='liSmokeClear')throw new Error(`INTRO_SMOKE_ANIMATION_MISSING_${anim}`);
            const settle=()=>page.evaluate(()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r))));
            const sample=()=>page.evaluate(()=>{
              const rect=e=>{const r=e.getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height,cx:r.x+r.width/2,cy:r.y+r.height/2}};
              const badge=document.querySelector('.li-badge');
              const scene=document.querySelector('.li-scene img');
              const smoke=document.querySelector('.li-smoke');
              const tag=document.querySelector('.li-tag');
              const ss=getComputedStyle(smoke),is=getComputedStyle(scene),ts=getComputedStyle(tag);
              const blur=Number((ss.backdropFilter.match(/blur\(([\d.]+)px\)/)||[])[1]||0);
              const brightness=Number((is.filter.match(/brightness\(([\d.]+)\)/)||[])[1]||1);
              return{badge:rect(badge),scene:rect(scene),smokeOpacity:Number(ss.opacity),smokeBlur:blur,sceneBrightness:brightness,tagText:(tag.textContent||'').trim(),tagFont:Number.parseFloat(ts.fontSize)||0,winW:innerWidth};
            });
            await settle();
            const start=await sample();
            if(start.badge.w<230||Math.abs(start.badge.cx-start.winW/2)>3)throw new Error(`INTRO_BADGE_NOT_DOMINANT_CENTERED ${JSON.stringify(start.badge)}`);
            if(!/tampa bay/i.test(start.tagText)||start.tagFont<12)throw new Error(`INTRO_TAGLINE_BAD ${JSON.stringify({text:start.tagText,font:start.tagFont})}`);
            if(start.sceneBrightness<1.2)throw new Error(`INTRO_SCENE_TOO_DARK ${start.sceneBrightness}`);
            if(start.smokeOpacity<.55||start.smokeBlur<4)throw new Error(`INTRO_SOFT_REVEAL_MISSING ${JSON.stringify({opacity:start.smokeOpacity,blur:start.smokeBlur})}`);
            await page.screenshot({path:`${out}/mobile-intro-smoke.png`});
            await page.evaluate(()=>{const a=document.querySelector('.li-smoke')?.getAnimations()[0];if(!a)throw new Error('INTRO_SMOKE_ANIMATION_LOST');a.pause();a.currentTime=1250});
            await settle();
            const end=await sample();
            if(end.smokeOpacity>.06||end.smokeBlur>.5)throw new Error(`INTRO_DID_NOT_CLEAR_CRISP ${JSON.stringify({opacity:end.smokeOpacity,blur:end.smokeBlur})}`);
            const delta=(a,b)=>Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y),Math.abs(a.w-b.w),Math.abs(a.h-b.h));
            const badgeDelta=delta(start.badge,end.badge),sceneDelta=delta(start.scene,end.scene);
            if(badgeDelta>.75||sceneDelta>.75)throw new Error(`INTRO_OBJECT_MOVEMENT ${JSON.stringify({badgeDelta,sceneDelta})}`);
            await page.screenshot({path:`${out}/mobile-intro-crisp.png`});
            fs.writeFileSync(`${out}/intro-reveal.json`,JSON.stringify({start,end,badgeDelta,sceneDelta,pass:true},null,2)+'\n');
            await ctx.close();
          }finally{await browser.close()}
          NODE

      - name: Prove storefront and dealer visual contract
        id: visual_contract
        env:
          URL: ${{ steps.browser_harness.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/wdcc-immutable-visual-proof.mjs

      - name: Require current branch head before owner handoff
        id: head_gate
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test -n "$current"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "STALE_HEAD expected=$GITHUB_SHA current=$current" >&2
            exit 1
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"

      - name: Publish visual acceptance summary
        if: always()
        env:
          REMOTE_URL: ${{ steps.deploy.outputs.url }}
          REMOTE_OUTCOME: ${{ steps.remote_integrity.outcome }}
          INTRO_OUTCOME: ${{ steps.intro_proof.outcome }}
          VISUAL_OUTCOME: ${{ steps.visual_contract.outcome }}
          HEAD_GATE_OUTCOME: ${{ steps.head_gate.outcome }}
          BUILD_ID: ${{ steps.remote_integrity.outputs.build_id }}
        shell: bash
        run: |
          echo '### WDCC immutable visual acceptance V2' >> "$GITHUB_STEP_SUMMARY"
          echo "Exact SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Immutable owner preview: ${REMOTE_URL:-not-created}" >> "$GITHUB_STEP_SUMMARY"
          echo "Remote integrity: ${REMOTE_OUTCOME:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact build ID: ${BUILD_ID:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Browser transport: local production server built from the same exact SHA; remote Worker integrity independently verified.' >> "$GITHUB_STEP_SUMMARY"
          echo "Intro proof: ${INTRO_OUTCOME:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "Storefront/dealer proof: ${VISUAL_OUTCOME:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "Current-head gate: ${HEAD_GATE_OUTCOME:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${REMOTE_OUTCOME:-}" = success ] && [ "${INTRO_OUTCOME:-}" = success ] && [ "${VISUAL_OUTCOME:-}" = success ] && [ "${HEAD_GATE_OUTCOME:-}" = success ]; then
            echo 'OWNER_REVIEW_ELIGIBLE: YES' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'OWNER_REVIEW_ELIGIBLE: NO' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s immutable-visual-proof/intro-reveal.json ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const p=require('./immutable-visual-proof/intro-reveal.json');
          console.log(`Intro smoke → crisp: PASS · blur ${p.start.smokeBlur.toFixed(1)}px → ${p.end.smokeBlur.toFixed(1)}px · badge movement ${p.badgeDelta.toFixed(2)}px · scene movement ${p.sceneDelta.toFixed(2)}px.`);
          NODE
          fi
          if [ -s immutable-visual-proof/metrics.json ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const p=require('./immutable-visual-proof/metrics.json');
          console.log(`Canonical inventory probe: HTTP ${p.provider.status||0} · ${p.provider.mode}`);
          console.log(p.provider.ok?'Live inventory UI verified against canonical read-only data.':'Canonical inventory provider blocked; honest no-demo storefront fallback and empty dealer visual shell verified.');
          console.log(`Browser write requests: ${p.writeRequests.length}`);
          NODE
          fi
          echo 'Visual success does not authorize merge or production promotion. Owner approval and functional/provider acceptance remain separate.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-immutable-visual-v2-${{ github.sha }}
          path: |
            immutable-preview-url.txt
            immutable-visual-proof/
          if-no-files-found: warn
          retention-days: 7
