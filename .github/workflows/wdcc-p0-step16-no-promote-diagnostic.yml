name: WDCC P0 Step16 No-Promote Diagnostic

on:
  push:
    branches:
      - diag/wdcc-p0-step16-no-promote-20260829
    paths:
      - '.github/workflows/wdcc-p0-step16-no-promote-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PREVIEW: https://5714ffed-wdcc-dealer-frontdoor.clico-global.workers.dev
      DIRECT: https://wdcc-proof-04c5d526.clico-global.workers.dev
      WDCC_DEALER_E2E_PASSWORD: ${{ secrets.WDCC_DEALER_E2E_PASSWORD }}
    steps:
      - name: Compare direct app and immutable frontdoor authorization without writes
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WDCC_DEALER_E2E_PASSWORD:-}"
          printf '::add-mask::%s\n' "$WDCC_DEALER_E2E_PASSWORD"
          jq -nc --arg p "$WDCC_DEALER_E2E_PASSWORD" '{username:"dealer",password:$p}' > /tmp/login-body.json

          check_base(){
            label="$1"; base="$2"; jar="/tmp/${label}.jar"
            health="$(curl --http1.1 -sS -D "/tmp/${label}-health.h" -o "/tmp/${label}-health.json" -w '%{http_code}' "$base/api/health?diag=$GITHUB_RUN_ID" || true)"
            echo "${label}_HEALTH HTTP=$health"
            grep -iE '^(x-wdcc-dealer-frontdoor|x-wdcc-dealer-app-sha):' "/tmp/${label}-health.h" || true

            login="$(curl --http1.1 -sS -D "/tmp/${label}-login.h" -c "$jar" -X POST -H 'Content-Type: application/json' --data-binary @/tmp/login-body.json -o "/tmp/${label}-login.json" -w '%{http_code}' "$base/api/auth/login")"
            echo "${label}_LOGIN HTTP=$login"
            jq -c '{ok:(.ok//false),role:(.role//null),error:(.error//null)}' "/tmp/${label}-login.json" || true
            awk -v p="${label}_COOKIE=" 'BEGIN{IGNORECASE=1} /^set-cookie:/{line=$0;sub(/\r$/, "",line);split(line,a,"=");name=a[1];sub(/^set-cookie:[[:space:]]*/,"",name);print p name}' "/tmp/${label}-login.h" || true

            session="$(curl --http1.1 -sS -b "$jar" -o "/tmp/${label}-session.json" -w '%{http_code}' "$base/api/auth/session")"
            echo "${label}_SESSION HTTP=$session"
            jq -c '{authenticated:(.authenticated//false),email:(.user.email//null),role:(.user.role//null),error:(.error//null)}' "/tmp/${label}-session.json" || true

            protected="$(curl --http1.1 -sS -b "$jar" -o "/tmp/${label}-protected.json" -w '%{http_code}' "$base/api/dealer/vehicle-logs")"
            echo "${label}_PROTECTED HTTP=$protected"
            jq -c '{ok:(.ok//false),error:(.error//null),revision:(.revision//null)}' "/tmp/${label}-protected.json" || true
          }

          check_base DIRECT "$DIRECT"
          check_base PREVIEW "$PREVIEW"
          echo 'NO_PROMOTION=YES'
          echo 'NO_STATE_OR_MEDIA_WRITE=YES'
          rm -f /tmp/login-body.json /tmp/DIRECT.jar /tmp/PREVIEW.jar
