name: WDCC Owner Approved P0 Dealer Upload

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

concurrency:
  group: wdcc-owner-approved-p0-dealer-upload
  cancel-in-progress: false

env:
  P0_SHA: c811687bd30a9cf212b95d75dc3cf03a9ffdc2fd
  APPROVED_VISUAL_SHA: 3d255fa8f1d65e4307e7c3ee474a996dd68ba3e1
  STATE_WORKER: wdcc-v53-1-staging
  MEDIA_WORKER: wdcc-v53-staging
  APP_WORKER: wdcc-proof-04c5d526
  FRONTDOOR_WORKER: wdcc-dealer-frontdoor
  STATE_URL: https://wdcc-v53-1-staging.clico-global.workers.dev
  MEDIA_URL: https://wdcc-v53-staging.clico-global.workers.dev
  APP_URL: https://wdcc-proof-04c5d526.clico-global.workers.dev
  DEALER_ROOT: https://dealer.wedontcarecars.com

jobs:
  recover:
    if: >-
      github.event.issue.number == 205 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == 'PROMOTE-WDCC-P0-DEALER-UPLOAD-REUSE-C811687B-DO-COMPAT-W2W-LOGIN-REDIRECT'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WDCC_DEALER_E2E_PASSWORD: ${{ secrets.WDCC_DEALER_E2E_PASSWORD }}
    steps:
      - name: Fail-closed P0 owner and release-control gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY_OWNER" = "${{ github.event.comment.user.login }}"
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID WDCC_DEALER_E2E_PASSWORD; do
            test -n "${!v:-}" || { echo "missing $v" >&2; exit 20; }
          done
          curl -fsS "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/205" \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' > /tmp/issue205.json
          jq -e '.number==205 and .state=="open"' /tmp/issue205.json >/dev/null
          body="$(jq -r '.body // ""' /tmp/issue205.json)"
          grep -Fq 'OWNER-APPROVED P0 LIVE PRIORITY — MAIN + DEALER + VEHICLE UPLOAD' <<<"$body"
          grep -Fq 'Vehicle Add/Edit + Photos' <<<"$body"
          grep -Fq 'Cloudflare Durable Object state/media seams' <<<"$body"
          grep -Fq 'Neon Auth' <<<"$body"
          grep -Fq 'routes/DNS left attached exactly as they are now' <<<"$body"
          grep -Fq 'Full release remains NO-GO outside this P0 exception.' <<<"$body"
          echo 'P0_DEALER_RELEASE_CONTROL=PASS'

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.P0_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate exact child lineage and install tooling
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$P0_SHA"
          git merge-base --is-ancestor "$APPROVED_VISUAL_SHA" HEAD || { git fetch --depth=20 origin "$APPROVED_VISUAL_SHA"; git merge-base --is-ancestor "$APPROVED_VISUAL_SHA" HEAD; }
          grep -Fq 'ep-curly-breeze-ay2iih1f.neonauth.c-5.us-east-2.aws.neon.tech/neondb/auth' app/api/auth/login/route.ts
          grep -Fq 'return neonCurrentUser();' lib/auth.ts
          grep -Fq 'sessionAuthority()' app/api/health/route.ts
          ! grep -Fq 'sessionCookieHeader(user)' app/api/auth/login/route.ts
          grep -Fq 'uploadVehiclePhoto' app/dealer/inventory/VehicleEditor.tsx
          grep -Fq 'WDCC_STATE_SERVICE_URL' lib/wdccAuthority.ts
          grep -Fq 'WDCC_MEDIA_SERVICE_URL' lib/wdccAuthority.ts
          grep -Fq 'redirect("/login")' app/dealer/login/page.tsx
          node --check cloudflare/wdcc-media-worker.mjs
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets

      - name: Generate run-scoped internal state and media authority
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl rand -hex 32 > /tmp/state.token
          openssl rand -hex 32 > /tmp/media.token
          test "$(wc -c < /tmp/state.token)" -ge 64
          test "$(wc -c < /tmp/media.token)" -ge 64
          echo 'P0_INTERNAL_SERVICE_AUTHORITY=GENERATED'

      - name: Generate workers.dev-only Durable Object configs
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const common={compatibility_date:'2026-08-25',compatibility_flags:['nodejs_compat'],workers_dev:true,preview_urls:true,observability:{enabled:true}};
          fs.writeFileSync('wdcc-p0-media-compat.mjs',[
            'import mediaDefault,{WDCCMedia} from "./cloudflare/wdcc-media-worker.mjs";',
            'import {WDCCState} from "./cloudflare/wdcc-state-worker.mjs";',
            'export {WDCCState,WDCCMedia};',
            'export default mediaDefault;',
            ''
          ].join('\n'));
          fs.writeFileSync('wrangler.p0-state.jsonc',JSON.stringify({...common,name:process.env.STATE_WORKER,main:'cloudflare/wdcc-state-worker.mjs',durable_objects:{bindings:[{name:'WDCC_STATE',class_name:'WDCCState'}]},migrations:[{tag:'v1',new_sqlite_classes:['WDCCState']}]},null,2)+'\n');
          fs.writeFileSync('wrangler.p0-media.jsonc',JSON.stringify({...common,name:process.env.MEDIA_WORKER,main:'wdcc-p0-media-compat.mjs',durable_objects:{bindings:[{name:'WDCC_MEDIA',class_name:'WDCCMedia'}]},migrations:[{tag:'v1',new_sqlite_classes:['WDCCState']},{tag:'p0-media-v2',new_sqlite_classes:['WDCCMedia']}]},null,2)+'\n');
          fs.writeFileSync('wrangler.p0-app.jsonc',JSON.stringify({...common,compatibility_flags:['nodejs_compat','global_fetch_strictly_public'],name:process.env.APP_WORKER,main:'.open-next/worker.js',assets:{directory:'.open-next/assets',binding:'ASSETS',run_worker_first:false},vars:{WDCC_RUNTIME_ROLE:'canonical',WDCC_STATE_SERVICE_URL:process.env.STATE_URL,WDCC_MEDIA_SERVICE_URL:process.env.MEDIA_URL}},null,2)+'\n');
          NODE
          node --check wdcc-p0-media-compat.mjs
          grep -Fq '"global_fetch_strictly_public"' wrangler.p0-app.jsonc
          for f in wrangler.p0-state.jsonc wrangler.p0-media.jsonc wrangler.p0-app.jsonc; do
            ! grep -Eq '"routes?"|"custom_domains?"' "$f"
          done

      - name: Fail closed unless exact reuse workers exist and are unattached
        shell: bash
        run: |
          set -euo pipefail
          targets=("$STATE_WORKER" "$MEDIA_WORKER" "$APP_WORKER")
          test "$STATE_WORKER" = 'wdcc-v53-1-staging'
          test "$MEDIA_WORKER" = 'wdcc-v53-staging'
          test "$APP_WORKER" = 'wdcc-proof-04c5d526'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" "${auth[@]}" > /tmp/reuse-scripts.json
          curl -fsS "https://api.cloudflare.com/client/v4/zones?name=wedontcarecars.com" "${auth[@]}" > /tmp/reuse-zones.json
          zone="$(jq -r '.result[0].id // empty' /tmp/reuse-zones.json)"; test -n "$zone"
          routes_api="https://api.cloudflare.com/client/v4/zones/$zone/workers"
          curl -fsS "$routes_api/routes" "${auth[@]}" > /tmp/reuse-routes.json
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" "${auth[@]}" > /tmp/reuse-domains.json
          jq -e '.success==true' /tmp/reuse-domains.json >/dev/null
          for name in "${targets[@]}"; do
            jq -e --arg n "$name" 'any(.result[]?; ((.id // .name // .script // "") == $n))' /tmp/reuse-scripts.json >/dev/null
            jq -e --arg n "$name" 'all(.result[]?; ((.script // .script_name // "") != $n))' /tmp/reuse-routes.json >/dev/null
            jq -e --arg n "$name" 'all(.result[]?; ((.service // .script // .script_name // "") != $n))' /tmp/reuse-domains.json >/dev/null
          done
          echo 'P0_EXACT_UNROUTED_REUSE_PREFLIGHT=PASS'

      - name: Deploy isolated state and media authorities
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.p0-state.jsonc 2>&1 | tee /tmp/state-deploy.log
          grep -Fq "$STATE_URL" /tmp/state-deploy.log
          cat /tmp/state.token | npx wrangler secret put WDCC_STATE_SERVICE_TOKEN --name "$STATE_WORKER" >/dev/null
          state_token="$(cat /tmp/state.token)"
          state_secret_ready=0
          for i in $(seq 1 20); do
            state_code="$(curl --http1.1 -sS -H "Authorization: Bearer $state_token" -o /tmp/state-secret-ready.json -w '%{http_code}' "$STATE_URL/state?secret_ready=$GITHUB_RUN_ID-$i" || true)"
            if [ "$state_code" = 200 ] || [ "$state_code" = 503 ]; then state_secret_ready=1; break; fi
            if [ "$state_code" != 401 ]; then echo "unexpected state secret readiness status $state_code" >&2; cat /tmp/state-secret-ready.json >&2 || true; exit 1; fi
            sleep 2
          done
          test "$state_secret_ready" = 1

          npx wrangler deploy --config wrangler.p0-media.jsonc 2>&1 | tee /tmp/media-deploy.log
          grep -Fq "$MEDIA_URL" /tmp/media-deploy.log
          cat /tmp/media.token | npx wrangler secret put WDCC_MEDIA_SERVICE_TOKEN --name "$MEDIA_WORKER" >/dev/null
          media_token="$(cat /tmp/media.token)"
          media_secret_ready=0
          media_probe="media/wdcc/p0-secret-ready/$GITHUB_RUN_ID.webp"
          for i in $(seq 1 20); do
            media_code="$(curl --http1.1 -sS -H "Authorization: Bearer $media_token" -o /tmp/media-secret-ready -w '%{http_code}' "$MEDIA_URL/media?p=$media_probe&secret_ready=$i" || true)"
            if [ "$media_code" = 404 ]; then media_secret_ready=1; break; fi
            if [ "$media_code" != 401 ]; then echo "unexpected media secret readiness status $media_code" >&2; exit 1; fi
            sleep 2
          done
          test "$media_secret_ready" = 1

          test "$(curl --http1.1 -sS -o /tmp/state-health -w '%{http_code}' "$STATE_URL/health")" = 503 || true
          test "$(curl --http1.1 -sS -o /tmp/media-health -w '%{http_code}' "$MEDIA_URL/health")" = 200
          jq -e '.ok==true and .storage=="durable-object-sqlite-chunked"' /tmp/media-health >/dev/null
          echo 'P0_INTERNAL_SECRET_READINESS=PASS'

      - name: Bootstrap or merge verified P0 state without copying historical PII
        shell: bash
        run: |
          set -euo pipefail
          state_token="$(cat /tmp/state.token)"
          code="$(curl --http1.1 -sS -H "Authorization: Bearer $state_token" -o /tmp/current-state.json -w '%{http_code}' "$STATE_URL/state" || true)"
          if [ "$code" != 200 ] && [ "$code" != 503 ]; then
            echo "unexpected state read status $code" >&2; exit 1
          fi
          STATE_CODE="$code" node - <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('lib/recoveryInventory.ts','utf8');
          const m=src.match(/export const WDCC_RECOVERY_INVENTORY=\[([\s\S]*?)\]\s+as const;/);
          if(!m||!src.includes('WDCC_RECOVERY_INVENTORY_EVIDENCE="2vfd-stable-public-five"'))throw new Error('RECOVERY_EVIDENCE_DRIFT');
          const recovered=Function('"use strict";return ['+m[1]+']')();
          if(recovered.length!==5)throw new Error('RECOVERY_COUNT_INVALID');
          let state={revision:0,tenants:[],users:[],vehicles:[],leads:[],audit:[]};
          if(process.env.STATE_CODE==='200')state=JSON.parse(fs.readFileSync('/tmp/current-state.json','utf8'));
          state.tenants=Array.isArray(state.tenants)?state.tenants:[];
          state.users=Array.isArray(state.users)?state.users:[];
          state.vehicles=Array.isArray(state.vehicles)?state.vehicles:[];
          state.leads=Array.isArray(state.leads)?state.leads:[];
          state.audit=Array.isArray(state.audit)?state.audit:[];
          let changed=process.env.STATE_CODE!=='200';
          if(!state.tenants.some(t=>String(t?.id)==='wdcc')){state.tenants.push({id:'wdcc',name:'We Don’t Care Cars',status:'active'});changed=true;}
          const bridge=[
            {id:'wdcc-admin-neon-bridge',tenantId:'wdcc',email:'admin@internal.wedontcarecars.com',username:'admin',loginAlias:'admin',aliases:['admin'],displayName:'WDCC Admin',role:'platform_admin',status:'active'},
            {id:'wdcc-dealer-neon-bridge',tenantId:'wdcc',email:'dealer@internal.wedontcarecars.com',username:'dealer',loginAlias:'dealer',aliases:['dealer'],displayName:'WDCC Dealer',role:'dealer_agent',status:'active'}
          ];
          for(const u of bridge)if(!state.users.some(x=>String(x?.id)===u.id)){state.users.push(u);changed=true;}
          const now=new Date().toISOString();
          for(const r of recovered){
            const id=String(r.id||r.slug||''); if(!id)throw new Error('RECOVERY_ID_MISSING');
            if(!state.vehicles.some(v=>String(v?.id)===id)){
              state.vehicles.push({...r,id,tenantId:'wdcc',status:'published',visibility:'public',internalOnly:false,qa:false,photoPathnames:Array.isArray(r.photoPathnames)?r.photoPathnames:[],primaryPhotoPathname:r.primaryPhotoPathname||null,createdAt:r.createdAt||now,updatedAt:r.updatedAt||now,uploadSource:'verified-recovery'}); changed=true;
            }
          }
          if(changed){state.revision=Math.max(0,Number(state.revision||0))+1;state.updatedAt=now;}
          fs.writeFileSync('/tmp/next-state.json',JSON.stringify(state,null,2)+'\n');
          fs.writeFileSync('/tmp/state-changed',changed?'1':'0');
          NODE
          if [ "$(cat /tmp/state-changed)" = 1 ]; then
            test "$(curl --http1.1 -sS -X PUT -H "Authorization: Bearer $state_token" -H 'Content-Type: application/json' --data-binary @/tmp/next-state.json -o /tmp/state-put.json -w '%{http_code}' "$STATE_URL/state")" = 200
            jq -e '.ok==true' /tmp/state-put.json >/dev/null
          fi
          test "$(curl --http1.1 -sS -H "Authorization: Bearer $state_token" -o /tmp/state-readback.json -w '%{http_code}' "$STATE_URL/state")" = 200
          jq -e '(.vehicles|length)>=5 and ([.users[].id]|index("wdcc-dealer-neon-bridge")!=null) and ([.users[].id]|index("wdcc-admin-neon-bridge")!=null)' /tmp/state-readback.json >/dev/null
          test "$(curl --http1.1 -sS -o /tmp/state-health2 -w '%{http_code}' "$STATE_URL/health")" = 200
          jq -e '.ok==true and .state=="readable"' /tmp/state-health2 >/dev/null
          echo 'P0_STATE_AUTHORITY=PASS'

      - name: Prove media authority write/read/delete before application use
        shell: bash
        run: |
          set -euo pipefail
          media_token="$(cat /tmp/media.token)"
          path="media/wdcc/p0-authority-selftest/$GITHUB_RUN_ID.webp"
          src=public/wdcc-logo-transparent.webp
          test -s "$src"
          test "$(curl --http1.1 -sS -X PUT -H "Authorization: Bearer $media_token" -H 'Content-Type: image/webp' --data-binary @"$src" -o /tmp/media-put -w '%{http_code}' "$MEDIA_URL/media?p=$path")" = 200
          jq -e '.ok==true and .bytes>0 and .sha256' /tmp/media-put >/dev/null
          test "$(curl --http1.1 -sS -H "Authorization: Bearer $media_token" -o /tmp/media-read -w '%{http_code}' "$MEDIA_URL/media?p=$path")" = 200
          test "$(sha256sum /tmp/media-read|awk '{print $1}')" = "$(sha256sum "$src"|awk '{print $1}')"
          test "$(curl --http1.1 -sS -X DELETE -H "Authorization: Bearer $media_token" -o /tmp/media-del -w '%{http_code}' "$MEDIA_URL/media?p=$path")" = 200
          jq -e '.ok==true' /tmp/media-del >/dev/null
          echo 'P0_MEDIA_AUTHORITY=PASS'

      - name: Deploy isolated exact dealer application and inject internal service secrets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          state=open('/tmp/state.token','r',encoding='utf-8').read().strip()
          media=open('/tmp/media.token','r',encoding='utf-8').read().strip()
          with open('/tmp/app-secrets.json','w',encoding='utf-8') as f:
              json.dump({'WDCC_STATE_SERVICE_TOKEN':state,'WDCC_MEDIA_SERVICE_TOKEN':media},f)
          PY
          chmod 600 /tmp/app-secrets.json
          jq -e 'keys|sort==["WDCC_MEDIA_SERVICE_TOKEN","WDCC_STATE_SERVICE_TOKEN"]' /tmp/app-secrets.json >/dev/null
          npx wrangler deploy --config wrangler.p0-app.jsonc --secrets-file /tmp/app-secrets.json 2>&1 | tee /tmp/app-deploy.log
          rm -f /tmp/app-secrets.json
          grep -Fq "$APP_URL" /tmp/app-deploy.log
          ok=0
          for i in $(seq 1 20); do
            code="$(curl --http1.1 -sS -o /tmp/app-health -w '%{http_code}' "$APP_URL/api/health?p0=$GITHUB_RUN_ID-$i" || true)"
            if [ "$code" = 200 ] && jq -e '.ok==true and .state=="readable" and .storage=="cloudflare-do"' /tmp/app-health >/dev/null; then ok=1;break;fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then echo 'isolated dealer app health contract did not become ready' >&2; cat /tmp/app-health >&2 || true; exit 1; fi
          stage_login_code="$(curl --http1.1 -sS -D /tmp/dealer-login-headers -o /tmp/dealer-login-page -w '%{http_code}' "$APP_URL/dealer/login?p0=$GITHUB_RUN_ID")"
          test "$stage_login_code" = 307
          stage_login_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/,"");sub(/^location:[[:space:]]*/,"");print;exit}' /tmp/dealer-login-headers)"
          case "$stage_login_location" in "/login"|"$APP_URL/login") ;; *) echo "unexpected isolated dealer login redirect: $stage_login_location" >&2; exit 1;; esac
          test "$(curl --http1.1 -sS -o /tmp/dealer-new-page -w '%{http_code}' "$APP_URL/dealer/inventory/new?p0=$GITHUB_RUN_ID")" = 200
          invalid="$(curl --http1.1 -sS -X POST -H 'Content-Type: application/json' --data '{"username":"dealer","password":"__wdcc_invalid_probe__"}' -o /tmp/invalid-login -w '%{http_code}' "$APP_URL/api/auth/login")"
          test "$invalid" = 401 || test "$invalid" = 429
          echo 'P0_DEALER_APP=PASS'

      - name: Stage exact vehicle create photo checkpoint publish isolation and cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          state_token="$(cat /tmp/state.token)"; media_token="$(cat /tmp/media.token)"
          qa_id=''; media_path=''
          cleanup(){
            set +e
            if [ -n "$qa_id" ]; then
              curl --http1.1 -sS -H "Authorization: Bearer $state_token" "$STATE_URL/state" -o /tmp/cleanup-state.json
              QA_ID="$qa_id" node - <<'NODE'
              const fs=require('fs');let s=JSON.parse(fs.readFileSync('/tmp/cleanup-state.json','utf8'));const id=process.env.QA_ID;
              s.vehicles=(s.vehicles||[]).filter(v=>String(v?.id)!==id);
              s.audit=(s.audit||[]).filter(a=>String(a?.vehicleId||'')!==id);
              s.revision=Number(s.revision||0)+1;s.updatedAt=new Date().toISOString();fs.writeFileSync('/tmp/cleanup-next.json',JSON.stringify(s,null,2)+'\n');
          NODE
              curl --http1.1 -sS -X PUT -H "Authorization: Bearer $state_token" -H 'Content-Type: application/json' --data-binary @/tmp/cleanup-next.json "$STATE_URL/state" -o /tmp/cleanup-put.json
            fi
            if [ -n "$media_path" ]; then enc="$(P="$media_path" python -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["P"]))')"; curl --http1.1 -sS -X DELETE -H "Authorization: Bearer $media_token" "$MEDIA_URL/media?p=$enc" -o /tmp/cleanup-media.json; fi
          }
          trap cleanup EXIT INT TERM ERR

          printf '::add-mask::%s\n' "$WDCC_DEALER_E2E_PASSWORD"
          jq -nc --arg p "$WDCC_DEALER_E2E_PASSWORD" '{username:"dealer",password:$p}' > /tmp/stage-login-body.json
          test "$(curl --http1.1 -sS -c /tmp/dealer.jar -X POST -H 'Content-Type: application/json' --data-binary @/tmp/stage-login-body.json -o /tmp/stage-login.json -w '%{http_code}' "$APP_URL/api/auth/login")" = 200
          jq -e '.ok==true and (.role=="dealer_agent" or .role=="dealer")' /tmp/stage-login.json >/dev/null
          test "$(curl --http1.1 -sS -b /tmp/dealer.jar -o /tmp/stage-session.json -w '%{http_code}' "$APP_URL/api/auth/session")" = 200
          jq -e '.authenticated==true and (.user.role=="dealer_agent" or .user.role=="dealer")' /tmp/stage-session.json >/dev/null
          stock="WDCC-QA-P0-$GITHUB_RUN_ID"
          create="$(curl --http1.1 -sS -X POST -b /tmp/dealer.jar -H 'Content-Type: application/json' --data "{\"year\":2021,\"make\":\"WDCC\",\"model\":\"P0 Upload Proof\",\"price\":19999,\"downPayment\":1000,\"mileage\":100,\"stock\":\"$stock\",\"internalOnly\":true,\"description\":\"automated temporary qa vehicle\"}" -o /tmp/create.json -w '%{http_code}' "$APP_URL/api/inventory")"
          test "$create" = 201
          qa_id="$(jq -r '.item.id // empty' /tmp/create.json)"; test -n "$qa_id"

          upload="$(curl --http1.1 -sS -X POST -b /tmp/dealer.jar -F "vehicleId=$qa_id" -F "requestId=p0-$GITHUB_RUN_ID" -F 'file=@public/wdcc-logo-transparent.webp;type=image/webp' -o /tmp/upload.json -w '%{http_code}' "$APP_URL/api/upload")"
          test "$upload" = 200
          media_path="$(jq -r '.pathname // empty' /tmp/upload.json)"; test -n "$media_path"
          jq -e '.ok==true and .provider=="cloudflare" and .sha256' /tmp/upload.json >/dev/null

          patch_payload="$(jq -nc --arg p "$media_path" '{photoPathnames:[$p],primaryPhotoPathname:$p}')"
          test "$(curl --http1.1 -sS -X PATCH -b /tmp/dealer.jar -H 'Content-Type: application/json' --data "$patch_payload" -o /tmp/checkpoint.json -w '%{http_code}' "$APP_URL/api/inventory/$qa_id")" = 200
          jq -e --arg p "$media_path" '.ok==true and .item.primaryPhotoPathname==$p and (.item.photoPathnames|index($p)!=null)' /tmp/checkpoint.json >/dev/null

          test "$(curl --http1.1 -sS -X PATCH -b /tmp/dealer.jar -H 'Content-Type: application/json' --data '{"status":"published"}' -o /tmp/publish.json -w '%{http_code}' "$APP_URL/api/inventory/$qa_id")" = 200
          jq -e '.ok==true and .item.status=="published"' /tmp/publish.json >/dev/null
          test "$(curl --http1.1 -sS -b /tmp/dealer.jar -o /tmp/readback.json -w '%{http_code}' "$APP_URL/api/inventory/$qa_id")" = 200
          jq -e --arg id "$qa_id" '.ok==true and .item.id==$id and .item.status=="published"' /tmp/readback.json >/dev/null

          test "$(curl --http1.1 -sS -o /tmp/public.json -w '%{http_code}' "$APP_URL/api/inventory?public=$GITHUB_RUN_ID")" = 200
          jq -e --arg id "$qa_id" '[.items[]?.id]|index($id)==null' /tmp/public.json >/dev/null

          encoded="$(P="$media_path" python - <<'PY'
          import os,urllib.parse;print(urllib.parse.quote(os.environ['P']))
          PY
          )"
          test "$(curl --http1.1 -sS -o /tmp/media-app-read -w '%{http_code}' "$APP_URL/api/media?p=$encoded")" = 200
          test "$(sha256sum /tmp/media-app-read|awk '{print $1}')" = "$(sha256sum public/wdcc-logo-transparent.webp|awk '{print $1}')"

          cleanup
          trap - EXIT INT TERM ERR
          test "$(curl --http1.1 -sS -H "Authorization: Bearer $state_token" -o /tmp/post-clean.json -w '%{http_code}' "$STATE_URL/state")" = 200
          jq -e --arg id "$qa_id" '[.vehicles[]?.id]|index($id)==null' /tmp/post-clean.json >/dev/null
          test "$(curl --http1.1 -sS -H "Authorization: Bearer $media_token" -o /tmp/post-media -w '%{http_code}' "$MEDIA_URL/media?p=$encoded")" = 404
          echo 'P0_STAGE_CREATE_UPLOAD_PUBLISH_CLEANUP=PASS'

      - name: Capture dealer front-door rollback version
        id: rollback
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments status --name "$FRONTDOOR_WORKER" --json > /tmp/front-before.json
          old="$(python - <<'PY'
          import json
          d=json.load(open('/tmp/front-before.json')); rows=[]
          def walk(x):
            if isinstance(x,dict):
              v=x.get('version_id') or x.get('versionId'); p=x.get('percentage')
              if v: rows.append((p,str(v)))
              for y in x.values(): walk(y)
            elif isinstance(x,list):
              for y in x: walk(y)
          walk(d)
          print(next((v for p,v in rows if p in (100,100.0,'100','100.0',1,1.0,'1','1.0')), rows[0][1] if rows else ''))
          PY
          )"
          test -n "$old"
          echo "old=$old" >> "$GITHUB_OUTPUT"

      - name: Upload narrow dealer front-door proxy version
        id: proxy
        shell: bash
        run: |
          set -euo pipefail
          cat > wdcc-p0-dealer-frontdoor.mjs <<JS
          const TARGET="$APP_URL";
          export default{async fetch(request){const incoming=new URL(request.url),target=new URL(incoming.pathname+incoming.search,TARGET);const h=new Headers(request.headers);h.set("x-forwarded-host",incoming.host);h.set("x-forwarded-proto","https");h.set("x-wdcc-p0-frontdoor","dealer-upload");h.delete("host");const init={method:request.method,headers:h,redirect:"manual"};if(request.method!=="GET"&&request.method!=="HEAD")init.body=request.body;const r=await fetch(new Request(target,init));const rh=new Headers(r.headers);const loc=rh.get("location");if(loc){const u=new URL(loc,target);if(u.origin===new URL(TARGET).origin)rh.set("location",incoming.origin+u.pathname+u.search+u.hash);}rh.set("x-wdcc-dealer-frontdoor","p0-do");rh.set("x-wdcc-dealer-app-sha","$P0_SHA");return new Response(r.body,{status:r.status,statusText:r.statusText,headers:rh});}};
          JS
          cat > wrangler.p0-frontdoor.jsonc <<'JSON'
          {"name":"wdcc-dealer-frontdoor","main":"wdcc-p0-dealer-frontdoor.mjs","compatibility_date":"2026-08-25","compatibility_flags":["nodejs_compat","global_fetch_strictly_public"],"workers_dev":false,"preview_urls":false,"observability":{"enabled":true}}
          JSON
          ! grep -Eq '"routes?"|"custom_domains?"' wrangler.p0-frontdoor.jsonc
          grep -Fq '"global_fetch_strictly_public"' wrangler.p0-frontdoor.jsonc
          npx wrangler versions upload --config wrangler.p0-frontdoor.jsonc --message "Owner-approved P0 dealer upload $P0_SHA" 2>&1 | tee /tmp/proxy-upload.log
          new="$(grep -Eo 'Worker Version ID: [0-9a-f-]+' /tmp/proxy-upload.log | tail -1 | awk '{print $4}')"; test -n "$new"
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: Promote dealer front door and prove live end to end or rollback
        shell: bash
        env:
          OLD_VERSION: ${{ steps.rollback.outputs.old }}
          NEW_VERSION: ${{ steps.proxy.outputs.new }}
        run: |
          set -Eeuo pipefail
          state_token="$(cat /tmp/state.token)"; media_token="$(cat /tmp/media.token)"
          promoted=0; qa_id=''; media_path=''
          cleanup(){
            set +e
            if [ -n "$qa_id" ]; then
              curl --http1.1 -sS -H "Authorization: Bearer $state_token" "$STATE_URL/state" -o /tmp/live-clean-state.json
              QA_ID="$qa_id" node - <<'NODE'
              const fs=require('fs');let s=JSON.parse(fs.readFileSync('/tmp/live-clean-state.json','utf8'));const id=process.env.QA_ID;s.vehicles=(s.vehicles||[]).filter(v=>String(v?.id)!==id);s.audit=(s.audit||[]).filter(a=>String(a?.vehicleId||'')!==id);s.revision=Number(s.revision||0)+1;s.updatedAt=new Date().toISOString();fs.writeFileSync('/tmp/live-clean-next.json',JSON.stringify(s,null,2)+'\n');
          NODE
              curl --http1.1 -sS -X PUT -H "Authorization: Bearer $state_token" -H 'Content-Type: application/json' --data-binary @/tmp/live-clean-next.json "$STATE_URL/state" -o /tmp/live-clean-put.json
            fi
            if [ -n "$media_path" ]; then enc="$(P="$media_path" python -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["P"]))')"; curl --http1.1 -sS -X DELETE -H "Authorization: Bearer $media_token" "$MEDIA_URL/media?p=$enc" -o /tmp/live-clean-media.json; fi
          }
          rollback(){ rc=$?; trap - ERR INT TERM; cleanup; if [ "$promoted" = 1 ]; then npx wrangler versions deploy "$OLD_VERSION@100%" --name "$FRONTDOOR_WORKER" -y --message "P0 DEALER AUTO-ROLLBACK $GITHUB_RUN_ID" || true; fi; exit "$rc"; }
          trap rollback ERR INT TERM

          npx wrangler versions deploy "$NEW_VERSION@100%" --name "$FRONTDOOR_WORKER" -y --message "Owner-approved P0 dealer upload $P0_SHA"
          promoted=1
          ok=0
          for i in $(seq 1 20); do
            code="$(curl --http1.1 -sS -D /tmp/live-dh -o /tmp/live-health -w '%{http_code}' "$DEALER_ROOT/api/health?p0=$GITHUB_RUN_ID-$i" || true)"
            if [ "$code" = 200 ] && grep -qi '^x-wdcc-dealer-frontdoor: p0-do' /tmp/live-dh && jq -e '.ok==true and .state=="readable" and .storage=="cloudflare-do"' /tmp/live-health >/dev/null; then ok=1;break;fi
            sleep 2
          done
          test "$ok" = 1
          live_login_code="$(curl --http1.1 -sS -D /tmp/live-login-headers -o /tmp/live-login-page -w '%{http_code}' "$DEALER_ROOT/dealer/login?p0=$GITHUB_RUN_ID")"
          test "$live_login_code" = 307
          live_login_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/,"");sub(/^location:[[:space:]]*/,"");print;exit}' /tmp/live-login-headers)"
          case "$live_login_location" in "/login"|"$DEALER_ROOT/login") ;; *) echo "unexpected live dealer login redirect: $live_login_location" >&2; exit 1;; esac
          test "$(curl --http1.1 -sS -o /tmp/live-new-page -w '%{http_code}' "$DEALER_ROOT/dealer/inventory/new?p0=$GITHUB_RUN_ID")" = 200

          printf '::add-mask::%s\n' "$WDCC_DEALER_E2E_PASSWORD"
          jq -nc --arg p "$WDCC_DEALER_E2E_PASSWORD" '{username:"dealer",password:$p}' > /tmp/live-login-body.json
          test "$(curl --http1.1 -sS -c /tmp/live.jar -X POST -H 'Content-Type: application/json' --data-binary @/tmp/live-login-body.json -o /tmp/live-login.json -w '%{http_code}' "$DEALER_ROOT/api/auth/login")" = 200
          jq -e '.ok==true and (.role=="dealer_agent" or .role=="dealer")' /tmp/live-login.json >/dev/null
          test "$(curl --http1.1 -sS -b /tmp/live.jar -o /tmp/live-session.json -w '%{http_code}' "$DEALER_ROOT/api/auth/session")" = 200
          jq -e '.authenticated==true and (.user.role=="dealer_agent" or .user.role=="dealer")' /tmp/live-session.json >/dev/null
          stock="WDCC-QA-P0-LIVE-$GITHUB_RUN_ID"
          test "$(curl --http1.1 -sS -X POST -b /tmp/live.jar -H 'Content-Type: application/json' --data "{\"year\":2021,\"make\":\"WDCC\",\"model\":\"Live P0 Upload Proof\",\"price\":19999,\"downPayment\":1000,\"mileage\":101,\"stock\":\"$stock\",\"internalOnly\":true,\"description\":\"automated temporary qa vehicle\"}" -o /tmp/live-create.json -w '%{http_code}' "$DEALER_ROOT/api/inventory")" = 201
          qa_id="$(jq -r '.item.id // empty' /tmp/live-create.json)"; test -n "$qa_id"
          test "$(curl --http1.1 -sS -X POST -b /tmp/live.jar -F "vehicleId=$qa_id" -F "requestId=p0-live-$GITHUB_RUN_ID" -F 'file=@public/wdcc-logo-transparent.webp;type=image/webp' -o /tmp/live-upload.json -w '%{http_code}' "$DEALER_ROOT/api/upload")" = 200
          media_path="$(jq -r '.pathname // empty' /tmp/live-upload.json)"; test -n "$media_path"
          payload="$(jq -nc --arg p "$media_path" '{photoPathnames:[$p],primaryPhotoPathname:$p}')"
          test "$(curl --http1.1 -sS -X PATCH -b /tmp/live.jar -H 'Content-Type: application/json' --data "$payload" -o /tmp/live-checkpoint.json -w '%{http_code}' "$DEALER_ROOT/api/inventory/$qa_id")" = 200
          test "$(curl --http1.1 -sS -X PATCH -b /tmp/live.jar -H 'Content-Type: application/json' --data '{"status":"published"}' -o /tmp/live-publish.json -w '%{http_code}' "$DEALER_ROOT/api/inventory/$qa_id")" = 200
          jq -e '.ok==true and .item.status=="published"' /tmp/live-publish.json >/dev/null
          test "$(curl --http1.1 -sS -b /tmp/live.jar -o /tmp/live-readback.json -w '%{http_code}' "$DEALER_ROOT/api/inventory/$qa_id")" = 200
          jq -e --arg id "$qa_id" '.ok==true and .item.id==$id' /tmp/live-readback.json >/dev/null
          test "$(curl --http1.1 -sS -o /tmp/live-public.json -w '%{http_code}' "$DEALER_ROOT/api/inventory?public=$GITHUB_RUN_ID")" = 200
          jq -e --arg id "$qa_id" '[.items[]?.id]|index($id)==null' /tmp/live-public.json >/dev/null
          enc="$(P="$media_path" python -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["P"]))')"
          test "$(curl --http1.1 -sS -o /tmp/live-media-read -w '%{http_code}' "$DEALER_ROOT/api/media?p=$enc")" = 200
          test "$(sha256sum /tmp/live-media-read|awk '{print $1}')" = "$(sha256sum public/wdcc-logo-transparent.webp|awk '{print $1}')"

          cleanup
          qa_id=''; media_path=''
          trap - ERR INT TERM
          {
            echo '### WDCC P0 DEALER + VEHICLE UPLOAD — PASS'
            echo "Dealer child SHA: $P0_SHA"
            echo 'Dealer portal: LIVE / healthy'
            echo 'Existing Neon credential authority: PRESERVED'
            echo 'Add/Edit vehicle create: PASS'
            echo 'Cloudflare photo upload + media readback: PASS'
            echo 'Photo checkpoint + publish: PASS'
            echo 'Public QA isolation: PASS'
            echo 'Exact QA cleanup: PASS'
            echo 'DNS/routes/Vercel aliases: UNCHANGED'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f /tmp/state.token /tmp/media.token /tmp/dealer.jar /tmp/live.jar /tmp/stage-login-body.json /tmp/live-login-body.json
