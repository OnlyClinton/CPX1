name: WDCC P0 Lineage Fetch Patcher

on:
  push:
    branches: [fix/wdcc-p0-lineage-fetch-20260827]
    paths:
      - '.github/workflows/wdcc-p0-lineage-fetch-patcher.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wdcc-p0-lineage-fetch-20260827
          fetch-depth: 1
      - name: Apply one-line lineage fix and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/wdcc-owner-approved-p0-dealer-upload.yml')
          lines=p.read_text().splitlines()
          hits=[]
          for i,line in enumerate(lines[:-1]):
              if line.strip().startswith('ref:') and 'P0_SHA' in line and lines[i+1].strip()=='fetch-depth: 1':
                  hits.append(i+1)
          if len(hits)!=1:
              raise SystemExit(f'expected one P0 shallow checkout, found {len(hits)}')
          i=hits[0]
          indent=lines[i][:-len(lines[i].lstrip())]
          lines[i]=indent+'fetch-depth: 0'
          p.write_text('\n'.join(lines)+'\n')
          PY
          rm .github/workflows/wdcc-p0-lineage-fetch-patcher.yml
          git diff --check
          test "$(git diff --numstat .github/workflows/wdcc-owner-approved-p0-dealer-upload.yml | awk '{print $1":"$2}')" = '1:1'
          git config user.name 'WDCC Control Proof Bot'
          git config user.email '120651995+OnlyClinton@users.noreply.github.com'
          git add -A
          git commit -m 'fix(wdcc): fetch full P0 lineage before promotion gate'
          git push origin HEAD:fix/wdcc-p0-lineage-fetch-20260827
