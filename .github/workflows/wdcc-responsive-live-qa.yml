name: WDCC Responsive Live QA
on:
  push:
    branches: [wdcc-responsive-live-qa]
    paths:
      - '.github/workflows/wdcc-responsive-live-qa.yml'
  workflow_dispatch:

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install playwright@1.54.2 --no-save
          npx playwright install --with-deps chromium
      - name: Run responsive live QA
        env:
          BASE: https://wedontcarecars.com
        run: |
          mkdir -p qa-artifacts/screenshots
          cat > /tmp/wdcc-qa.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const base=process.env.BASE;
          const routes=[
            '/', '/inventory', '/get-approved', '/schedule-test-drive', '/contact',
            '/dealer/login', '/admin/login', '/dealer', '/dealer/inventory/new', '/admin/dashboard'
          ];
          const viewports={mobile:{width:390,height:844},desktop:{width:1440,height:900}};
          const report={base,generatedAt:new Date().toISOString(),pages:[],api:[]};
          const browser=await chromium.launch({headless:true});

          for(const [device,viewport] of Object.entries(viewports)){
            const context=await browser.newContext({viewport,deviceScaleFactor:1});
            for(const route of routes){
              const page=await context.newPage();
              const consoleErrors=[];
              const pageErrors=[];
              const failedRequests=[];
              page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
              page.on('pageerror',e=>pageErrors.push(String(e)));
              page.on('requestfailed',r=>failedRequests.push({url:r.url(),failure:r.failure()?.errorText||''}));
              let status=0,finalUrl='';
              try{
                const res=await page.goto(base+route,{waitUntil:'networkidle',timeout:30000});
                status=res?.status()||0; finalUrl=page.url();
              }catch(e){pageErrors.push('NAV '+String(e));}
              await page.waitForTimeout(500);
              const metrics=await page.evaluate(()=>{
                const de=document.documentElement, body=document.body;
                const imgs=[...document.images];
                const inputs=[...document.querySelectorAll('input,select,textarea,button')];
                const anchors=[...document.querySelectorAll('a[href]')];
                return {
                  title:document.title,
                  bodyText:(body?.innerText||'').slice(0,500),
                  scrollWidth:Math.max(de.scrollWidth,body?.scrollWidth||0),
                  clientWidth:de.clientWidth,
                  overflowX:Math.max(de.scrollWidth,body?.scrollWidth||0)>de.clientWidth+2,
                  brokenImages:imgs.filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.currentSrc||i.src),
                  imageCount:imgs.length,
                  controls:inputs.length,
                  links:anchors.length,
                  tinyText:[...document.querySelectorAll('body *')].filter(el=>{const s=getComputedStyle(el); const n=parseFloat(s.fontSize||'0'); return n>0&&n<10&&el.textContent?.trim()}).slice(0,20).map(el=>({text:el.textContent?.trim().slice(0,80),size:getComputedStyle(el).fontSize})),
                  clipped:[...document.querySelectorAll('input,select,textarea,button,a')].filter(el=>{const r=el.getBoundingClientRect();return r.width>0&&(r.right>innerWidth+2||r.left<-2)}).slice(0,30).map(el=>({tag:el.tagName,text:(el.textContent||el.getAttribute('placeholder')||'').trim().slice(0,80),left:el.getBoundingClientRect().left,right:el.getBoundingClientRect().right}))
                };
              });
              const name=(route==='/'?'home':route.replace(/^\//,'').replaceAll('/','-'))+'-'+device+'.png';
              await page.screenshot({path:'qa-artifacts/screenshots/'+name,fullPage:true});
              report.pages.push({device,viewport,route,status,finalUrl,...metrics,consoleErrors:consoleErrors.slice(0,20),pageErrors:pageErrors.slice(0,20),failedRequests:failedRequests.slice(0,30)});
              await page.close();
            }
            await context.close();
          }

          const apiContext=await browser.newContext();
          const p=await apiContext.newPage();
          const checks=[
            ['health','GET','/api/health'],
            ['inventory','GET','/api/inventory'],
            ['session','GET','/api/auth/session'],
          ];
          for(const [name,method,path] of checks){
            const r=await p.request.fetch(base+path,{method});
            report.api.push({name,method,path,status:r.status(),body:(await r.text()).slice(0,3000)});
          }
          let r=await p.request.post(base+'/api/auth/login',{data:{email:'wdcc-invalid-qa-user',password:'definitely-wrong-password'}});
          report.api.push({name:'invalid-login',method:'POST',path:'/api/auth/login',status:r.status(),body:(await r.text()).slice(0,1200)});
          r=await p.request.post(base+'/api/inventory',{data:{year:2020,make:'QA',model:'Blocked',price:1,mileage:1}});
          report.api.push({name:'anonymous-inventory-write',method:'POST',path:'/api/inventory',status:r.status(),body:(await r.text()).slice(0,1200)});
          r=await p.request.post(base+'/api/leads',{data:{kind:'contact',name:'WDCC QA VALIDATION',email:'qa@invalid.example',consent:false}});
          report.api.push({name:'lead-consent-validation',method:'POST',path:'/api/leads',status:r.status(),body:(await r.text()).slice(0,1200)});
          await apiContext.close();
          await browser.close();

          fs.writeFileSync('qa-artifacts/report.json',JSON.stringify(report,null,2));
          const severe=[];
          for(const x of report.pages){
            if(x.status>=400) severe.push(`${x.device} ${x.route}: HTTP ${x.status}`);
            if(x.overflowX) severe.push(`${x.device} ${x.route}: horizontal overflow ${x.scrollWidth}>${x.clientWidth}`);
            if(x.brokenImages.length) severe.push(`${x.device} ${x.route}: ${x.brokenImages.length} broken images`);
            if(x.pageErrors.length) severe.push(`${x.device} ${x.route}: page errors ${x.pageErrors.join(' | ')}`);
          }
          fs.writeFileSync('qa-artifacts/summary.txt',severe.length?severe.join('\n'):'No severe browser-layout failures detected.');
          console.log(JSON.stringify({pages:report.pages.length,api:report.api.map(x=>({name:x.name,status:x.status})),severe},null,2));
          NODE
          node /tmp/wdcc-qa.mjs
      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wdcc-responsive-live-qa
          path: qa-artifacts
          retention-days: 7
