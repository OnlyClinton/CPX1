name: WDCC Pixel Review

on:
  push:
    branches: [qa/wdcc-pixel-review-20260826]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      URL: https://wdcc-preview.clico-global.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Capture corrected Worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-proof
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const URL = process.env.URL;
          async function home(browser,name,viewport){
            const context=await browser.newContext({viewport,deviceScaleFactor:1});
            const page=await context.newPage();
            const errors=[];
            page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
            page.on('pageerror',e=>errors.push('page:'+e.message));
            const r=await page.goto(URL+'/?pixel-review='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
            if(!r||r.status()!==200)throw new Error(name+'_HTTP_'+(r&&r.status()));
            await page.waitForTimeout(700);
            await page.screenshot({path:`visual-proof/${name}-intro.png`,fullPage:false});
            const intro=await page.evaluate(()=>({intro:!!document.querySelector('.li'),sceneSrc:document.querySelector('.li-scene img')?.getAttribute('src')||null,sceneWidth:document.querySelector('.li-scene img')?.naturalWidth||0,badgeWidth:document.querySelector('.li-badge img')?.naturalWidth||0}));
            await page.waitForTimeout(2600);
            const metrics=await page.evaluate(()=>{
              const rect=s=>{const e=document.querySelector(s);if(!e)return null;const r=e.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height,bottom:r.bottom,right:r.right}};
              const img=document.querySelector('.rh-hero-art');
              const h1=document.querySelector('.rh-copy h1');
              return {viewport:{width:innerWidth,height:innerHeight},hero:rect('.rh-hero'),copy:rect('.rh-copy'),headline:rect('.rh-copy h1'),actions:rect('.rh-hero-actions'),logo:rect('.rh-logo img'),benefits:rect('.rh-benefit-wrap'),headlineText:h1?.innerText||'',heroSrc:img?.getAttribute('src')||null,heroNaturalWidth:img?.naturalWidth||0,heroNaturalHeight:img?.naturalHeight||0,heroObjectPosition:img?getComputedStyle(img).objectPosition:null,errors};
            });
            metrics.intro=intro;
            fs.writeFileSync(`visual-proof/${name}-metrics.json`,JSON.stringify(metrics,null,2));
            await page.screenshot({path:`visual-proof/${name}-hero.png`,fullPage:false});
            await page.screenshot({path:`visual-proof/${name}-full.png`,fullPage:true});
            if(metrics.heroNaturalWidth<=0||metrics.headlineText.replace(/\s+/g,' ').trim().toLowerCase()!=="bad credit? no credit? we don't care.")throw new Error(name+'_VISUAL_MARKER_FAIL');
            await context.close();
          }
          async function dealer(browser,name,viewport){
            const context=await browser.newContext({viewport,deviceScaleFactor:1});
            const page=await context.newPage();
            const r=await page.goto(URL+'/dealer?pixel-review='+Date.now(),{waitUntil:'networkidle',timeout:30000});
            if(!r||r.status()!==200)throw new Error(name+'_HTTP_'+(r&&r.status()));
            await page.screenshot({path:`visual-proof/${name}.png`,fullPage:true});
            await context.close();
          }
          (async()=>{const b=await chromium.launch({headless:true});await home(b,'mobile',{width:390,height:844});await home(b,'desktop',{width:1440,height:1000});await dealer(b,'dealer-mobile',{width:390,height:844});await dealer(b,'dealer-desktop',{width:1440,height:1000});await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-corrected-visual-proof
          path: visual-proof
          retention-days: 7
