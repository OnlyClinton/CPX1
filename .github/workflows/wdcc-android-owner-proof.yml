name: WDCC Android Owner Visual Proof

on:
  push:
    branches:
      - fix/wdcc-locked-contract-20260826
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-android-owner-proof-${{ github.sha }}
  cancel-in-progress: false

jobs:
  android-owner-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Lock exact round-emblem owner source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -s public/wdcc-hero-v2.webp
          test -s app/wdccCorrectLogoData.ts
          test -s app/wdcc-owner-logo/route.ts
          test -s app/wdcc-owner-board-final.css
          test -s app/wdcc-round-header-contract.css
          grep -Fq 'WDCC_CORRECT_LOGO_DATA_URI' app/LockedIntro.tsx
          grep -Fq 'data-wdcc-intro-badge-art="owner-approved"' app/LockedIntro.tsx
          grep -Fq '/wdcc-owner-logo' app/WdccPublicChrome.tsx
          grep -Fq 'data-wdcc-logo-art="owner-approved"' app/WdccPublicChrome.tsx
          grep -Fq 'X-WDCC-Logo' app/wdcc-owner-logo/route.ts
          grep -Fq 'wdcc-round-header-contract.css' app/layout.tsx
          grep -Fq 'owner-approved' app/wdcc-round-header-contract.css
          last_wdcc_css="$(grep -o 'import"\./wdcc-[^"]*\.css"' app/layout.tsx | tail -1 | sed 's/^import"\.\///;s/"$//')"
          test "$last_wdcc_css" = 'wdcc-round-header-contract.css'

      - name: Build exact Cloudflare candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0 playwright@1.55.0
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets
          test -s .next/BUILD_ID
          npx playwright install --with-deps chromium >/dev/null

      - name: Create exact-SHA no-route Worker
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          cfg.name=`wdcc-android-${process.env.GITHUB_SHA}`;
          cfg.workers_dev=true;
          cfg.preview_urls=true;
          delete cfg.route;
          delete cfg.routes;
          fs.writeFileSync('wrangler.android-owner.jsonc',JSON.stringify(cfg,null,2)+'\n');
          NODE
          ! grep -qi 'wedontcarecars.com' wrangler.android-owner.jsonc
          grep -Fq "$GITHUB_SHA" wrangler.android-owner.jsonc

      - name: Deploy immutable isolated Android preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.android-owner.jsonc 2>&1 | tee /tmp/wdcc-android-owner.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wdcc-android-owner.log | tail -1)"
          test -n "$url"
          case "$url" in *"$GITHUB_SHA"*) ;; *) echo "Android preview is not SHA-specific: $url" >&2; exit 1;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > android-owner-preview-url.txt

      - name: Verify deployed exact build and owner assets
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-owner-proof
          code=000
          for i in $(seq 1 30); do
            code="$(curl --http1.1 -sS -L -o /tmp/android-home.html -w '%{http_code}' "$URL/?android-warm=$GITHUB_RUN_ID-$i" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          test "$code" = 200
          local_build="$(tr -d '\r\n' < .next/BUILD_ID)"
          grep -Fq -- "$local_build" /tmp/android-home.html
          grep -Fq 'data-wdcc-logo-art="owner-approved"' /tmp/android-home.html
          test "$(curl --http1.1 -sS -D /tmp/owner-logo.headers -L -o /tmp/owner-logo.webp -w '%{http_code}' "$URL/wdcc-owner-logo?android-logo=$GITHUB_RUN_ID")" = 200
          test -s /tmp/owner-logo.webp
          grep -qi '^x-wdcc-logo: owner-approved' /tmp/owner-logo.headers

      - name: Prove Android owner contract and hit targets
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {chromium} from 'playwright';
          const base=process.env.URL;
          const sha=process.env.GITHUB_SHA;
          if(!base||!base.includes(sha))throw new Error(`ANDROID_NOT_EXACT_SHA_${base||''}_${sha||''}`);
          const out='android-owner-proof';
          fs.mkdirSync(out,{recursive:true});
          const browser=await chromium.launch({headless:true});
          const writes=[];
          const watch=p=>p.on('request',r=>{if(['POST','PUT','PATCH','DELETE'].includes(r.method()))writes.push({method:r.method(),url:r.url()})});
          const rect=e=>{const r=e?.getBoundingClientRect();return r?{x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom,cx:r.x+r.width/2,cy:r.y+r.height/2}:null};
          async function skipIntro(page){const b=page.getByRole('button',{name:/skip intro/i});if(await b.count())await b.click().catch(()=>{});await page.locator('.li').waitFor({state:'detached',timeout:7000}).catch(()=>{});}
          try{
            const mobile=await browser.newContext({viewport:{width:390,height:844},screen:{width:390,height:844},deviceScaleFactor:2.75,isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (Linux; Android 16; SM-S166V) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Mobile Safari/537.36'});
            const page=await mobile.newPage();watch(page);
            let response=await page.goto(`${base}/?android-owner=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
            if(!response||response.status()!==200)throw new Error(`ANDROID_HOME_HTTP_${response?.status()||0}`);
            const introArt=page.locator('.li-badge img[data-wdcc-intro-badge-art="owner-approved"]');
            await introArt.waitFor({state:'visible',timeout:10000});
            const intro=await page.evaluate(()=>{const b=document.querySelector('.li-badge'),a=document.querySelector('.li-badge img[data-wdcc-intro-badge-art="owner-approved"]'),br=b?.getBoundingClientRect(),ar=a?.getBoundingClientRect();return{badge:br?{w:br.width,h:br.height,cx:br.x+br.width/2}:null,art:ar?{w:ar.width,h:ar.height,naturalWidth:a.naturalWidth,naturalHeight:a.naturalHeight}:null,winW:innerWidth}});
            if(!intro.badge||intro.badge.w<230||Math.abs(intro.badge.cx-intro.winW/2)>4||!intro.art||intro.art.naturalWidth<20||intro.art.naturalHeight<20)throw new Error(`ANDROID_INTRO_BAD_${JSON.stringify(intro)}`);
            await page.screenshot({path:`${out}/android-intro.png`});
            await skipIntro(page);
            await page.locator('[data-wdcc-public-chrome="header"] img[data-wdcc-logo-art="owner-approved"]').waitFor({state:'visible',timeout:10000});
            await page.locator('.rh-grid>article').first().waitFor({state:'visible',timeout:10000});
            const home=await page.evaluate(()=>{
              const q=s=>document.querySelector(s),R=e=>{const r=e?.getBoundingClientRect();return r?{x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom,cx:r.x+r.width/2,cy:r.y+r.height/2}:null};
              const header=q('[data-wdcc-public-chrome="header"]'),logo=q('[data-wdcc-public-chrome="header"] img[data-wdcc-logo-art="owner-approved"]'),menu=q('.rh-menu'),call=q('.rh-call'),grid=q('.rh-grid');
              const mr=R(menu),cr=R(call);
              const mh=mr?document.elementFromPoint(mr.cx,mr.cy):null,ch=cr?document.elementFromPoint(cr.cx,cr.cy):null;
              const cards=[...grid.children].map(R);
              return{header:R(header),logo:R(logo),menu:mr,call:cr,menuHit:Boolean(menu&&mh&&(menu===mh||menu.contains(mh))),callHit:Boolean(call&&ch&&(call===ch||call.contains(ch))),utility:getComputedStyle(q('[data-wdcc-public-chrome="utility"]')).display,gridDisplay:getComputedStyle(grid).display,cards,overflow:document.documentElement.scrollWidth-innerWidth};
            });
            if(!home.header||home.header.h<64||home.header.h>72||!home.logo||Math.abs(home.logo.cx-195)>5||home.logo.w<60||home.logo.h<60||!home.menu||home.menu.w<38||!home.call||home.call.w<38||!home.menuHit||!home.callHit||home.utility!=='none'||home.gridDisplay!=='flex'||home.cards.length!==5||!home.cards[2]||home.cards[2].right>390||home.overflow>2)throw new Error(`ANDROID_HOME_CONTRACT_${JSON.stringify(home)}`);
            await page.locator('.rh-menu').click();
            if(await page.locator('.rh-menu').getAttribute('aria-expanded')!=='true'||!await page.locator('.rh-nav.open').count())throw new Error('ANDROID_MENU_NOT_USABLE');
            await page.locator('.rh-menu').click();
            await page.screenshot({path:`${out}/android-home.png`,fullPage:true});

            response=await page.goto(`${base}/inventory?owner-review=1&android-owner=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
            if(!response||response.status()!==200)throw new Error(`ANDROID_INVENTORY_HTTP_${response?.status()||0}`);
            await page.locator('.wdccVehicleGrid>article').first().waitFor({state:'visible',timeout:10000});
            const inv=await page.evaluate(()=>{const g=document.querySelector('.wdccVehicleGrid'),a=g.querySelector('article>a');return{tracks:getComputedStyle(g).gridTemplateColumns.split(/\s+/).filter(Boolean).length,cards:g.children.length,mediaH:a?.getBoundingClientRect().height||0,overflow:document.documentElement.scrollWidth-innerWidth}});
            if(inv.tracks!==1||inv.cards!==5||inv.mediaH>205||inv.overflow>2)throw new Error(`ANDROID_INVENTORY_CONTRACT_${JSON.stringify(inv)}`);
            await page.screenshot({path:`${out}/android-inventory.png`,fullPage:true});
            await mobile.close();

            const desktopSite=await browser.newContext({viewport:{width:980,height:844},screen:{width:980,height:844},deviceScaleFactor:1,isMobile:false,hasTouch:true,userAgent:'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36'});
            const dpage=await desktopSite.newPage();watch(dpage);
            response=await dpage.goto(`${base}/?owner-review=1&desktop-site=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
            if(!response||response.status()!==200)throw new Error(`ANDROID_DESKTOP_SITE_HTTP_${response?.status()||0}`);
            await skipIntro(dpage);
            await dpage.locator('[data-wdcc-public-chrome="header"] img[data-wdcc-logo-art="owner-approved"]').waitFor({state:'visible',timeout:10000});
            await dpage.locator('.rh-grid>article').first().waitFor({state:'visible',timeout:10000});
            const desk=await dpage.evaluate(()=>{const q=s=>document.querySelector(s),R=e=>{const r=e?.getBoundingClientRect();return r?{x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom}:null};const g=q('.rh-grid');return{utility:R(q('[data-wdcc-public-chrome="utility"]')),header:R(q('[data-wdcc-public-chrome="header"]')),logo:R(q('[data-wdcc-public-chrome="header"] img[data-wdcc-logo-art="owner-approved"]')),nav:getComputedStyle(q('.rh-nav')).display,tracks:getComputedStyle(g).gridTemplateColumns.split(/\s+/).filter(Boolean).length,cards:g.children.length,overflow:document.documentElement.scrollWidth-innerWidth}});
            if(!desk.utility||desk.utility.h<28||!desk.header||desk.header.h<82||desk.header.h>90||!desk.logo||desk.logo.w<80||desk.logo.h<80||desk.nav==='none'||desk.tracks!==4||desk.cards!==5||desk.overflow>2)throw new Error(`ANDROID_DESKTOP_SITE_CONTRACT_${JSON.stringify(desk)}`);
            await dpage.screenshot({path:`${out}/android-desktop-site.png`,fullPage:true});
            await desktopSite.close();
            if(writes.length)throw new Error(`ANDROID_BROWSER_WRITES_${JSON.stringify(writes)}`);
            fs.writeFileSync(`${out}/result.json`,JSON.stringify({sha,url:base,intro,home,inventory:inv,desktopSite:desk,writes,pass:true},null,2)+'\n');
            console.log('WDCC_ANDROID_OWNER_PASS',JSON.stringify({logo:home.logo,menuHit:home.menuHit,callHit:home.callHit,thirdRight:home.cards[2].right,inventoryTracks:inv.tracks,desktopTracks:desk.tracks,writes:writes.length}));
          }finally{await browser.close()}
          NODE

      - name: Require exact current head
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test -n "$current"
          test "$current" = "$GITHUB_SHA"

      - name: Publish Android owner summary
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          echo '### WDCC Android owner visual proof' >> "$GITHUB_STEP_SUMMARY"
          echo "Exact SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Isolated Worker: ${URL:-not-created}" >> "$GITHUB_STEP_SUMMARY"
          if [ -s android-owner-proof/result.json ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const r=require('./android-owner-proof/result.json');
          console.log(`Round header emblem: ${r.home.logo.w.toFixed(1)} × ${r.home.logo.h.toFixed(1)} px · centered`);
          console.log(`Hit targets: menu=${r.home.menuHit} · call=${r.home.callHit}`);
          console.log(`Mobile featured third-card right edge: ${r.home.cards[2].right.toFixed(1)} px`);
          console.log(`Android Desktop-site featured tracks: ${r.desktopSite.tracks}`);
          console.log(`Browser writes: ${r.writes.length}`);
          NODE
          else
            echo 'ANDROID_OWNER_REVIEW_ELIGIBLE: NO' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-android-owner-proof-${{ github.sha }}
          path: |
            android-owner-preview-url.txt
            android-owner-proof/
          if-no-files-found: warn
          retention-days: 7
