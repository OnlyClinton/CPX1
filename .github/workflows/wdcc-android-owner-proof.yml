name: WDCC Android Owner Visual Proof

on:
  push:
    branches:
      - fix/wdcc-locked-contract-20260826
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-android-owner-proof-${{ github.sha }}
  cancel-in-progress: false

jobs:
  android-owner-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Lock supplied-board Android source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -s public/wdcc-hero-v2.webp
          test -s public/wdcc-logo-transparent.webp
          test -s app/wdccCorrectLogoData.ts
          test -s app/wdcc-owner-logo/route.ts
          test -s app/wdcc-round-header-contract.css
          test -s .github/support/wdcc-owner-board-rebuild-proof-latest.mjs
          grep -Fq 'WDCC_CORRECT_LOGO_DATA_URI' app/LockedIntro.tsx
          grep -Fq 'data-wdcc-intro-badge-art="owner-approved"' app/LockedIntro.tsx
          grep -Fq 'data-wdcc-logo-art="owner-wordmark"' app/WdccPublicChrome.tsx
          grep -Fq '/wdcc-logo-transparent.webp' app/WdccPublicChrome.tsx
          grep -Fq '51546 mobile is split' app/wdcc-round-header-contract.css
          grep -Fq '51543 mobile inventory rows' app/wdcc-round-header-contract.css
          grep -Fq 'Vehicles ready now.' app/ReferenceCloneHome.tsx
          grep -Fq 'new-vehicle' app/dealer/inventory/new/page.tsx
          last_wdcc_css="$(grep -o 'import"\./wdcc-[^"]*\.css"' app/layout.tsx | tail -1 | sed 's/^import"\.\///;s/"$//')"
          test "$last_wdcc_css" = 'wdcc-round-header-contract.css'

      - name: Build exact Cloudflare candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0 playwright@1.55.0
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets
          test -s .next/BUILD_ID
          npx playwright install --with-deps chromium >/dev/null

      - name: Create exact-SHA no-route Worker
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          cfg.name=`wdcc-android-${process.env.GITHUB_SHA}`;
          cfg.workers_dev=true;
          cfg.preview_urls=true;
          delete cfg.route;
          delete cfg.routes;
          fs.writeFileSync('wrangler.android-owner.jsonc',JSON.stringify(cfg,null,2)+'\n');
          NODE
          ! grep -qi 'wedontcarecars.com' wrangler.android-owner.jsonc
          grep -Fq "$GITHUB_SHA" wrangler.android-owner.jsonc

      - name: Deploy immutable isolated Android preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.android-owner.jsonc 2>&1 | tee /tmp/wdcc-android-owner.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wdcc-android-owner.log | tail -1)"
          test -n "$url"
          case "$url" in *"$GITHUB_SHA"*) ;; *) echo "Android preview is not SHA-specific: $url" >&2; exit 1;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > android-owner-preview-url.txt

      - name: Verify deployed exact build and supplied-board assets
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          code=000
          for i in $(seq 1 30); do
            code="$(curl --http1.1 -sS -L -o /tmp/android-home.html -w '%{http_code}' "$URL/?android-warm=$GITHUB_RUN_ID-$i" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          test "$code" = 200
          local_build="$(tr -d '\r\n' < .next/BUILD_ID)"
          grep -Fq -- "$local_build" /tmp/android-home.html
          grep -Fq 'data-wdcc-logo-art="owner-wordmark"' /tmp/android-home.html
          test "$(curl --http1.1 -sS -L -o /tmp/android-wordmark.webp -w '%{http_code}' "$URL/wdcc-logo-transparent.webp?asset=$GITHUB_RUN_ID")" = 200
          test "$(sha256sum /tmp/android-wordmark.webp | awk '{print $1}')" = "$(sha256sum public/wdcc-logo-transparent.webp | awk '{print $1}')"
          test "$(curl --http1.1 -sS -L -o /tmp/android-hero.webp -w '%{http_code}' "$URL/wdcc-hero-v2.webp?asset=$GITHUB_RUN_ID")" = 200
          test "$(sha256sum /tmp/android-hero.webp | awk '{print $1}')" = "$(sha256sum public/wdcc-hero-v2.webp | awk '{print $1}')"

      - name: Prove Android and supplied owner boards
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          node .github/support/wdcc-owner-board-rebuild-proof-latest.mjs
          test -s owner-board-proof/result.json
          node -e "const r=require('./owner-board-proof/result.json');const required=['homeMobile','inventoryMobile','approvalMobile','dealerMobile','dealerInventoryMobile','editorMobile','androidDesktopSite'];if(!r.pass||r.writes.length||required.some(k=>!r.boards?.[k]))process.exit(1)"

      - name: Require exact current head
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test -n "$current"
          test "$current" = "$GITHUB_SHA"

      - name: Publish Android owner summary
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          echo '### WDCC Android supplied-board visual proof' >> "$GITHUB_STEP_SUMMARY"
          echo "Exact SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Isolated Worker: ${URL:-not-created}" >> "$GITHUB_STEP_SUMMARY"
          if [ -s owner-board-proof/result.json ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const r=require('./owner-board-proof/result.json');
          console.log(`PASS: ${r.pass}`);
          console.log(`Mobile benefit columns: ${r.boards?.homeMobile?.benefits ?? 'n/a'} · featured card width: ${r.boards?.homeMobile?.cards?.[0]?.w ?? 'n/a'} px`);
          console.log(`Android Desktop-site tracks: ${r.boards?.androidDesktopSite?.featured ?? 'n/a'}`);
          console.log(`Browser writes: ${r.writes.length}`);
          console.log(`Proof surfaces: ${Object.keys(r.boards||{}).length}`);
          console.log('ANDROID_OWNER_REVIEW_ELIGIBLE: YES');
          NODE
          else
            echo 'ANDROID_OWNER_REVIEW_ELIGIBLE: NO' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-android-owner-proof-${{ github.sha }}
          path: |
            android-owner-preview-url.txt
            owner-board-proof/
          if-no-files-found: warn
          retention-days: 7
