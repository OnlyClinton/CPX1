name: WDCC Android Owner Visual Proof

on:
  push:
    branches:
      - proof/wdcc-owner-center-20260827
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-android-owner-proof-${{ github.sha }}
  cancel-in-progress: false

jobs:
  android-owner-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Lock frozen owner-emblem source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -s public/wdcc-hero-v2.webp
          test -s app/wdccCorrectLogoData.ts
          grep -Fq 'WDCC_CORRECT_LOGO_DATA_URI' app/LockedIntro.tsx
          grep -Fq 'WDCC_CORRECT_LOGO_DATA_URI' app/WdccPublicChrome.tsx
          grep -Fq 'data-wdcc-intro-badge-art="owner-approved"' app/LockedIntro.tsx
          grep -Fq 'data-wdcc-logo-art="owner-approved"' app/WdccPublicChrome.tsx
          grep -Fq 'Specificity bridge' app/wdcc-owner-approved-logo-final.css
          grep -Fq 'header[data-wdcc-public-chrome="header"].rh-header.wdcc-public-header .rh-logo' app/wdcc-owner-approved-logo-final.css
          ! grep -Fq 'content:url(' app/wdcc-owner-approved-logo-final.css

      - name: Build exact Cloudflare candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0 playwright@1.55.0
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets
          test -s .next/BUILD_ID
          npx playwright install --with-deps chromium >/dev/null

      - name: Create exact-SHA no-route Worker
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          cfg.name=`wdcc-owner-center-${process.env.GITHUB_SHA}`;
          cfg.workers_dev=true;
          cfg.preview_urls=true;
          delete cfg.route;
          delete cfg.routes;
          fs.writeFileSync('wrangler.owner-center.jsonc',JSON.stringify(cfg,null,2)+'\n');
          NODE
          ! grep -qi 'wedontcarecars.com' wrangler.owner-center.jsonc
          grep -Fq "$GITHUB_SHA" wrangler.owner-center.jsonc

      - name: Deploy frozen Android review Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.owner-center.jsonc 2>&1 | tee /tmp/wdcc-owner-center.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wdcc-owner-center.log | tail -1)"
          test -n "$url"
          case "$url" in *"$GITHUB_SHA"*) ;; *) echo "Not exact SHA: $url" >&2; exit 1;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > owner-center-preview-url.txt

      - name: Verify deployed exact build
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p owner-center-proof
          code=000
          for i in $(seq 1 20); do
            code="$(curl --http1.1 -sS -L -o /tmp/home.html -w '%{http_code}' "$URL/?android-warm=$i" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          test "$code" = 200
          build="$(tr -d '\r\n' < .next/BUILD_ID)"
          grep -Fq -- "$build" /tmp/home.html
          grep -Fq 'data-wdcc-logo-art="owner-approved"' /tmp/home.html

      - name: Prove Android-rendered owner contract
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {chromium} from 'playwright';
          const base=process.env.URL;
          const out='owner-center-proof';
          fs.mkdirSync(out,{recursive:true});
          const ua='Mozilla/5.0 (Linux; Android 16; moto g play - 2026) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Mobile Safari/537.36';
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:390,height:844},screen:{width:390,height:844},deviceScaleFactor:2.75,isMobile:true,hasTouch:true,userAgent:ua,reducedMotion:'no-preference'});
          const page=await ctx.newPage();
          const writes=[];
          page.on('request',r=>{if(['POST','PUT','PATCH','DELETE'].includes(r.method()))writes.push({method:r.method(),url:r.url()})});
          try{
            let r=await page.goto(`${base}/?visual-mobile=frozen-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
            if(!r||r.status()!==200)throw new Error(`HOME_HTTP_${r?.status()||0}`);
            const introArt=page.locator('.li-badge img[data-wdcc-intro-badge-art="owner-approved"]');
            await introArt.waitFor({state:'visible',timeout:10000});
            await page.waitForFunction(()=>{const x=document.querySelector('.li-badge img[data-wdcc-intro-badge-art="owner-approved"]');return x&&x.complete&&x.naturalWidth>0},null,{timeout:10000});
            const intro=await page.evaluate(()=>{const b=document.querySelector('.li-badge'),a=document.querySelector('.li-badge img[data-wdcc-intro-badge-art="owner-approved"]'),br=b.getBoundingClientRect(),ar=a.getBoundingClientRect(),as=getComputedStyle(a);return{winW:innerWidth,badge:{x:br.x,y:br.y,w:br.width,h:br.height,cx:br.x+br.width/2,cy:br.y+br.height/2},art:{w:ar.width,h:ar.height,opacity:Number(as.opacity),content:as.content,clipPath:as.clipPath,src:a.getAttribute('src')||''}}});
            if(intro.badge.w<236||Math.abs(intro.badge.cx-intro.winW/2)>3||intro.art.opacity<.99||intro.art.content!=='normal'||intro.art.clipPath!=='none'||!intro.art.src.startsWith('data:image/'))throw new Error(`INTRO_BAD_${JSON.stringify(intro)}`);
            await page.screenshot({path:`${out}/android-intro.png`});

            await page.getByRole('button',{name:/skip intro/i}).click();
            await page.locator('.li').waitFor({state:'detached',timeout:5000});
            const headerArt=page.locator('header[data-wdcc-public-chrome="header"] img[data-wdcc-logo-art="owner-approved"]');
            await headerArt.waitFor({state:'visible',timeout:10000});
            await page.waitForFunction(()=>{const x=document.querySelector('header[data-wdcc-public-chrome="header"] img[data-wdcc-logo-art="owner-approved"]');return x&&x.complete&&x.naturalWidth>0},null,{timeout:10000});
            const header=await page.evaluate(()=>{
              const h=document.querySelector('header[data-wdcc-public-chrome="header"]');
              const inner=h.querySelector('.rh-header-inner');
              const link=h.querySelector('.rh-logo');
              const a=h.querySelector('img[data-wdcc-logo-art="owner-approved"]');
              const rect=x=>{const r=x.getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height,cx:r.x+r.width/2,cy:r.y+r.height/2}};
              const ls=getComputedStyle(link),as=getComputedStyle(a),ins=getComputedStyle(inner);
              return{winW:innerWidth,header:rect(h),inner:rect(inner),link:rect(link),logo:rect(a),linkDisplay:ls.display,linkJustify:ls.justifyContent,linkPlaceItems:ls.placeItems,innerPosition:ins.position,logoContent:as.content,logoClip:as.clipPath,logoOpacity:Number(as.opacity),src:a.getAttribute('src')||''};
            });
            if(Math.abs(header.logo.cx-header.winW/2)>2||Math.abs(header.link.cx-header.winW/2)>2||header.logo.w!==96||header.logo.h!==96||header.link.w!==104||header.linkDisplay!=='grid'||header.logoContent!=='normal'||header.logoClip!=='none'||header.logoOpacity<.99||!header.src.startsWith('data:image/'))throw new Error(`HEADER_BAD_${JSON.stringify(header)}`);
            await page.locator('header[data-wdcc-public-chrome="header"]').screenshot({path:`${out}/android-header.png`});

            r=await page.goto(`${base}/?owner-review=1&frozen=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
            if(!r||r.status()!==200)throw new Error(`OWNER_REVIEW_HTTP_${r?.status()||0}`);
            const skip=page.getByRole('button',{name:/skip intro/i});if(await skip.count())await skip.click().catch(()=>{});
            await page.locator('.wdccOwnerReviewBanner').waitFor({state:'visible',timeout:10000});
            await page.locator('.rh-grid').waitFor({state:'visible',timeout:10000});
            const inventory=await page.evaluate(()=>{const g=document.querySelector('.rh-grid'),s=getComputedStyle(g);return{label:(document.querySelector('.wdccOwnerReviewBanner')?.textContent||'').trim(),count:g.children.length,overflowX:s.overflowX,first:g.children[0]?.getBoundingClientRect().width||0}});
            if(!/NOT LIVE/i.test(inventory.label)||inventory.count!==5||!['auto','scroll'].includes(inventory.overflowX)||inventory.first<250||inventory.first>360)throw new Error(`OWNER_INVENTORY_BAD_${JSON.stringify(inventory)}`);
            await page.screenshot({path:`${out}/android-owner-home.png`,fullPage:true});
            if(writes.length)throw new Error(`WRITE_REQUESTS_${JSON.stringify(writes)}`);
            const result={sha:process.env.GITHUB_SHA,url:base,intro,header,inventory,writes,pass:true};
            fs.writeFileSync(`${out}/result.json`,JSON.stringify(result,null,2)+'\n');
            console.log('WDCC_FROZEN_ANDROID_PASS',JSON.stringify({introCenter:intro.badge.cx,headerLinkCenter:header.link.cx,headerLogoCenter:header.logo.cx,headerSize:[header.logo.w,header.logo.h],cards:inventory.count,writes:writes.length}));
          }finally{await ctx.close();await browser.close()}
          NODE

      - name: Require frozen branch head
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin 'refs/heads/proof/wdcc-owner-center-20260827' | awk '{print $1}')"
          test -n "$current"
          test "$current" = "$GITHUB_SHA"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-frozen-android-owner-${{ github.sha }}
          path: |
            owner-center-preview-url.txt
            owner-center-proof/
          if-no-files-found: warn
          retention-days: 7
