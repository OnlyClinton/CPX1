name: WDCC Owner Approved P0 Storefront Recovery V2

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

concurrency:
  group: wdcc-owner-approved-p0-storefront
  cancel-in-progress: false

env:
  APPROVED_SHA: 3d255fa8f1d65e4307e7c3ee474a996dd68ba3e1
  PROD_ROOT: https://wedontcarecars.com
  PROD_WWW: https://www.wedontcarecars.com
  LIVE_WORKER: wdcc-reference-root
  STAGE_WORKER: wdcc-storefront

jobs:
  promote:
    if: >-
      github.event.issue.number == 205 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == 'PROMOTE-WDCC-P0-STOREFRONT-V2-3D255FA8'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Fail-closed P0 release-control gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY_OWNER" = "${{ github.event.comment.user.login }}"
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            test -n "${!v:-}" || { echo "missing $v" >&2; exit 20; }
          done
          curl -fsS "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/205" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' > /tmp/issue205.json
          jq -e '.number == 205 and .state == "open"' /tmp/issue205.json >/dev/null
          body="$(jq -r '.body // ""' /tmp/issue205.json)"
          grep -Fq 'OWNER-APPROVED P0 LIVE PRIORITY — MAIN + DEALER + VEHICLE UPLOAD' <<<"$body"
          grep -Fq "exact owner-approved visual source SHA \`$APPROVED_SHA\`" <<<"$body"
          grep -Fq '`wdcc-reference-root`' <<<"$body"
          grep -Fq 'routes/DNS left attached exactly as they are now' <<<"$body"
          grep -Fq 'Full release remains NO-GO outside this P0 exception.' <<<"$body"
          echo 'P0_RELEASE_CONTROL=PASS'

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_SHA }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate exact recovery evidence and build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          node - <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('lib/recoveryInventory.ts','utf8');
          if(!src.includes('WDCC_RECOVERY_INVENTORY_EVIDENCE="2vfd-stable-public-five"')) throw new Error('RECOVERY_EVIDENCE_DRIFT');
          const m=src.match(/export const WDCC_RECOVERY_INVENTORY=\[([\s\S]*?)\]\s+as const;/);
          if(!m) throw new Error('RECOVERY_ARRAY_NOT_FOUND');
          const items=Function('"use strict";return ['+m[1]+']')();
          if(!Array.isArray(items)||items.length!==5) throw new Error(`RECOVERY_COUNT_${items?.length??'missing'}`);
          for(const v of items){
            const id=String(v?.id??v?.slug??'').trim();
            const year=Number(v?.year||0), make=String(v?.make||'').trim(), model=String(v?.model||'').trim(), price=Number(v?.price??v?.cashPrice??0);
            const stock=String(v?.stock??v?.stock_id??'').toUpperCase();
            if(!id||year<1901||!make||!model||!(price>0)) throw new Error(`INVALID_PUBLIC_RECOVERY_RECORD_${id||'missing-id'}`);
            if(/^(R36TEST|WDCC[-_]QA|QA|TEST)[-_]/i.test(stock)) throw new Error(`QA_RECORD_${stock}`);
          }
          const payload={ok:true,live:false,readOnly:true,blobHealthy:false,count:items.length,items,recoveryFallback:true,inventorySource:'verified-recovery-readonly',sourceEvidence:'2vfd-stable-public-five',availabilityNotice:'Verified recovery inventory. Confirm current availability with Sean at 813-516-4752.'};
          fs.writeFileSync('/tmp/recovery.json',JSON.stringify(payload));
          NODE
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets
          test -s .next/BUILD_ID

      - name: Build front-door wrapper without route mutation
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/recovery.json .wdcc-recovery.json
          node - <<'NODE'
          const fs=require('fs');
          const recovery=JSON.parse(fs.readFileSync('.wdcc-recovery.json','utf8'));
          const approved=process.env.APPROVED_SHA;
          const code=`import app from "./.open-next/worker.js";
          const RECOVERY=${JSON.stringify(recovery)};
          const APPROVED_SHA=${JSON.stringify(approved)};
          function headers(extra={}){return {"content-type":"application/json; charset=utf-8","cache-control":"public, max-age=30, stale-while-revalidate=120","x-wdcc-cloudflare-public":"owner-approved-${approved.slice(0,8)}","x-wdcc-inventory-source":"verified-real-edge-recovery","x-wdcc-visual-sha":APPROVED_SHA,...extra}}
          function items(){return Array.isArray(RECOVERY.items)?RECOVERY.items:[]}
          export default {async fetch(request,env,ctx){
            const u=new URL(request.url);
            if(request.method==="GET"&&u.pathname==="/api/inventory") return new Response(JSON.stringify(RECOVERY),{status:200,headers:headers()});
            const m=u.pathname.match(/^\\/api\\/inventory\\/([^/]+)$/);
            if(request.method==="GET"&&m){
              const id=decodeURIComponent(m[1]);
              const item=items().find(v=>String(v?.id??v?.slug??"")===id);
              if(!item) return new Response(JSON.stringify({ok:false,error:"Not found",readOnly:true,live:false}),{status:404,headers:headers()});
              return new Response(JSON.stringify({ok:true,item,readOnly:true,live:false,inventorySource:"verified-recovery-readonly"}),{status:200,headers:headers({"cache-control":"public, max-age=30"})});
            }
            const response=await app.fetch(request,env,ctx);
            const h=new Headers(response.headers);
            h.set("x-wdcc-visual-sha",APPROVED_SHA);
            h.set("x-wdcc-frontdoor","owner-approved-p0");
            return new Response(response.body,{status:response.status,statusText:response.statusText,headers:h});
          }};`;
          fs.writeFileSync('wdcc-reference-wrapper.mjs',code);
          const base={"$schema":"./node_modules/wrangler/config-schema.json",main:"wdcc-reference-wrapper.mjs",compatibility_date:"2026-08-25",compatibility_flags:["nodejs_compat","global_fetch_strictly_public"],assets:{directory:".open-next/assets",binding:"ASSETS",run_worker_first:false},observability:{enabled:true},vars:{WDCC_RUNTIME_ROLE:"frontend",WDCC_DEALER_BACKEND_URL:"https://wdcc-cpx-launch-cpxagency.vercel.app"}};
          fs.writeFileSync('wrangler.p0-stage.jsonc',JSON.stringify({...base,name:process.env.STAGE_WORKER,workers_dev:true,preview_urls:true},null,2)+'\n');
          fs.writeFileSync('wrangler.p0-live.jsonc',JSON.stringify({...base,name:process.env.LIVE_WORKER,workers_dev:false,preview_urls:false},null,2)+'\n');
          NODE
          ! grep -Eq '"routes?"|"custom_domains?"' wrangler.p0-live.jsonc

      - name: Stage and verify exact version-preview URL
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler versions upload --config wrangler.p0-stage.jsonc --message "P0 storefront V2 staging $APPROVED_SHA" 2>&1 | tee /tmp/stage-upload.log
          stage_version="$(grep -Eo 'Worker Version ID: [0-9a-f-]+' /tmp/stage-upload.log | tail -1 | awk '{print $4}')"
          test -n "$stage_version"
          npx wrangler versions deploy "$stage_version@100%" --name "$STAGE_WORKER" -y --message "P0 storefront V2 stage $APPROVED_SHA" 2>&1 | tee /tmp/stage-deploy.log
          direct="$(grep -Eo 'https://[0-9a-f-]+-wdcc-storefront\.clico-global\.workers\.dev' /tmp/stage-deploy.log | tail -1)"
          if [ -z "$direct" ]; then direct="https://${stage_version}-${STAGE_WORKER}.clico-global.workers.dev"; fi
          test -n "$direct"
          echo "STAGE_PREVIEW=$direct"
          build="$(tr -d '\r\n' < .next/BUILD_ID)"
          ok=0
          for i in $(seq 1 20); do
            code="$(curl --http1.1 -sS -D /tmp/stage-home.headers -o /tmp/stage-home.html -w '%{http_code}' "$direct/?p0v2=$GITHUB_RUN_ID-$i" || true)"
            if [ "$code" = 200 ] && grep -Fq "$build" /tmp/stage-home.html && grep -qi "^x-wdcc-visual-sha: $APPROVED_SHA" /tmp/stage-home.headers; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          api="$(curl --http1.1 -sS -D /tmp/stage-api.headers -o /tmp/stage-api.json -w '%{http_code}' "$direct/api/inventory?p0v2=$GITHUB_RUN_ID" || true)"
          test "$api" = 200
          grep -qi '^x-wdcc-inventory-source: verified-real-edge-recovery' /tmp/stage-api.headers
          jq -e '.ok==true and .readOnly==true and .blobHealthy==false and .count==5 and (.items|length)==5 and .sourceEvidence=="2vfd-stable-public-five"' /tmp/stage-api.json >/dev/null
          echo 'P0_STAGE=PASS'

      - name: Capture exact rollback version
        id: rollback
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments status --name "$LIVE_WORKER" --json > /tmp/live-deployments.json
          old="$(python - <<'PY'
          import json
          d=json.load(open('/tmp/live-deployments.json')); rows=[]
          def walk(x):
            if isinstance(x,dict):
              v=x.get('version_id') or x.get('versionId'); p=x.get('percentage')
              if v: rows.append((p,str(v)))
              for y in x.values(): walk(y)
            elif isinstance(x,list):
              for y in x: walk(y)
          walk(d)
          out=''
          for p,v in rows:
            if p in (100,100.0,'100','100.0',1,1.0,'1','1.0'):
              out=v; break
          if not out and rows: out=rows[0][1]
          print(out)
          PY
          )"
          test -n "$old"
          echo "old=$old" >> "$GITHUB_OUTPUT"

      - name: Upload exact version to existing live Worker
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler versions upload --config wrangler.p0-live.jsonc --message "Owner-approved P0 storefront V2 $APPROVED_SHA" 2>&1 | tee /tmp/live-upload.log
          new="$(grep -Eo 'Worker Version ID: [0-9a-f-]+' /tmp/live-upload.log | tail -1 | awk '{print $4}')"
          test -n "$new"
          test "$new" != "${{ steps.rollback.outputs.old }}"
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: Promote and live-verify or auto-rollback
        shell: bash
        env:
          OLD_VERSION: ${{ steps.rollback.outputs.old }}
          NEW_VERSION: ${{ steps.upload.outputs.new }}
        run: |
          set -Eeuo pipefail
          promoted=0
          rollback(){
            rc=$?
            trap - ERR INT TERM
            if [ "$promoted" = 1 ]; then
              echo 'P0 V2 live verification failed; restoring captured Worker version.' >&2
              npx wrangler versions deploy "$OLD_VERSION@100%" --name "$LIVE_WORKER" -y --message "P0 V2 AUTO-ROLLBACK $GITHUB_RUN_ID" || true
            fi
            exit "$rc"
          }
          trap rollback ERR INT TERM
          npx wrangler versions deploy "$NEW_VERSION@100%" --name "$LIVE_WORKER" -y --message "Owner-approved P0 storefront V2 $APPROVED_SHA"
          promoted=1
          build="$(tr -d '\r\n' < .next/BUILD_ID)"
          ok=0
          for i in $(seq 1 30); do
            code="$(curl --http1.1 -sS -D /tmp/live-home.headers -o /tmp/live-home.html -w '%{http_code}' "$PROD_ROOT/?p0v2=$APPROVED_SHA-$i" || true)"
            if [ "$code" = 200 ] && grep -Fq "$build" /tmp/live-home.html && grep -qi "^x-wdcc-visual-sha: $APPROVED_SHA" /tmp/live-home.headers; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          test "$(curl --http1.1 -sS -o /tmp/live-inventory.html -w '%{http_code}' "$PROD_ROOT/inventory?p0v2=$APPROVED_SHA")" = 200
          grep -Fq "$build" /tmp/live-inventory.html
          test "$(curl --http1.1 -sS -D /tmp/live-api.headers -o /tmp/live-api.json -w '%{http_code}' "$PROD_ROOT/api/inventory?p0v2=$APPROVED_SHA")" = 200
          grep -qi '^x-wdcc-inventory-source: verified-real-edge-recovery' /tmp/live-api.headers
          jq -e '.ok==true and .readOnly==true and .blobHealthy==false and .count==5 and (.items|length)==5 and .sourceEvidence=="2vfd-stable-public-five"' /tmp/live-api.json >/dev/null
          first_id="$(jq -r '.items[0].id // empty' /tmp/live-api.json)"
          test -n "$first_id"
          test "$(curl --http1.1 -sS -o /tmp/live-detail.json -w '%{http_code}' "$PROD_ROOT/api/inventory/$first_id?p0v2=$APPROVED_SHA")" = 200
          jq -e '.ok==true and .item' /tmp/live-detail.json >/dev/null
          test "$(curl --http1.1 -sS -o /tmp/live-www.html -w '%{http_code}' "$PROD_WWW/?p0v2=$APPROVED_SHA")" = 200
          grep -Fq "$build" /tmp/live-www.html
          curl --http1.1 -fsSL "$PROD_ROOT/wdcc-hero-v2.webp?p0v2=$APPROVED_SHA" -o /tmp/live-hero.webp
          test "$(sha256sum /tmp/live-hero.webp | awk '{print $1}')" = "$(sha256sum public/wdcc-hero-v2.webp | awk '{print $1}')"
          trap - ERR INT TERM
          {
            echo '### WDCC P0 STOREFRONT V2 — PASS'
            echo "Approved SHA: $APPROVED_SHA"
            echo "Live Worker: $LIVE_WORKER"
            echo "Live version: $NEW_VERSION"
            echo 'Main page: PASS'
            echo 'Inventory page/API: PASS (5 verified recovery records)'
            echo 'WWW + hero parity: PASS'
            echo 'DNS/routes/Vercel aliases: UNCHANGED'
          } >> "$GITHUB_STEP_SUMMARY"
