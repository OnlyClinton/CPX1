name: WDCC Owner V5 Preview

on:
  push:
    branches:
      - freeze/wdcc-owner-v5-20260826
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-owner-v5-preview
  cancel-in-progress: false

env:
  EXPECTED_HERO_SIZE: '145504'
  EXPECTED_HERO_SHA256: 1d7a0e4fced7450f2bbc66443d44b1f35bd9e24a6366308362aafa65576d3eb2

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Guard V5 source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test "$(wc -c < public/wdcc-hero-v2.webp | tr -d ' ')" = "$EXPECTED_HERO_SIZE"
          printf '%s  %s\n' "$EXPECTED_HERO_SHA256" public/wdcc-hero-v2.webp | sha256sum -c -
          test -s app/owner-review-v5.css
          grep -q 'owner-review-v5.css' app/layout.tsx
          ! grep -q 'owner-review-v4.css' app/layout.tsx
          ! grep -q 'owner-review-v4-final.css' app/layout.tsx
          grep -q 'wdccV5ScenePush' app/owner-review-v5.css
          grep -q 'wdccV5BadgePop' app/owner-review-v5.css
          grep -q 'vdp-page' 'app/vehicle/[id]/page.tsx'
          test "$(grep -o 'wdcc-hero-v2.webp' app/LockedIntro.tsx | wc -l | tr -d ' ')" = 1
          ! grep -Eqi 'WebGPU|requestAdapter|getContext\("webgpu"\)|createRenderPipeline|<canvas|\.animate\(' app/LockedIntro.tsx

      - name: Build exact source
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0 playwright@1.55.0
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets
          npx playwright install --with-deps chromium >/dev/null

      - name: Create isolated config
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          cfg.name='wdcc-owner-v5';
          cfg.workers_dev=true;
          cfg.preview_urls=true;
          delete cfg.route;
          delete cfg.routes;
          fs.writeFileSync('wrangler.v5.jsonc',JSON.stringify(cfg,null,2)+'\n');
          NODE
          ! grep -qi 'wedontcarecars.com' wrangler.v5.jsonc

      - name: Deploy isolated V5 preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.v5.jsonc 2>&1 | tee /tmp/v5.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/v5.log | tail -1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" | tee preview-url.txt

      - name: Smoke preview
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          code=000
          for i in $(seq 1 30); do
            code="$(curl -sS -L -o /tmp/home.html -w '%{http_code}' "$URL/?v5=$GITHUB_RUN_ID-$i" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          test "$code" = 200
          grep -qi "we don.t care" /tmp/home.html
          test "$(curl -sS -L -o /tmp/hero.webp -w '%{http_code}' "$URL/wdcc-hero-v2.webp?v5=$GITHUB_RUN_ID")" = 200
          test "$(wc -c < /tmp/hero.webp | tr -d ' ')" = "$EXPECTED_HERO_SIZE"
          printf '%s  %s\n' "$EXPECTED_HERO_SHA256" /tmp/hero.webp | sha256sum -c -
          test "$(curl -sS -L -o /tmp/inventory.json -w '%{http_code}' "$URL/api/inventory?v5=$GITHUB_RUN_ID")" = 200
          jq -e '((.items // .inventory // []) | length) >= 1' /tmp/inventory.json >/dev/null

      - name: Browser proof storefront and VDP scale
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-proof
          node - <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const url=process.env.URL;
            const browser=await chromium.launch({headless:true});
            const proof={url,sha:process.env.GITHUB_SHA,mobile:{},desktop:{},vdp:{}};
            const waitImg=async(p,s,w=100)=>{await p.locator(s).waitFor({state:'visible',timeout:12000});await p.waitForFunction(({s,w})=>{const i=document.querySelector(s);return i&&i.complete&&i.naturalWidth>=w},{s,w},{timeout:12000});};
            const waitIntroDone=async p=>{const i=p.locator('.li');if(await i.count())await i.waitFor({state:'detached',timeout:5000});await p.locator('.rh-hero-art').waitFor({state:'visible',timeout:5000});};
            try{
              const m=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
              const p=await m.newPage(); const errs=[];
              p.on('console',msg=>{if(msg.type()==='error')errs.push(msg.text())});p.on('pageerror',e=>errs.push(String(e)));
              await p.goto(`${url}/?mobile=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
              await waitImg(p,'.li-scene img',1000);await waitImg(p,'.li-badge img',200);
              const intro=await p.evaluate(()=>{const b=document.querySelector('.li-badge'),s=document.querySelector('.li-scene img'),bs=getComputedStyle(b),ss=getComputedStyle(s);return{sceneCount:document.querySelectorAll('.li-scene img').length,canvas:document.querySelectorAll('canvas').length,badgeAnimation:bs.animationName,badgeDuration:parseFloat(bs.animationDuration),sceneAnimation:ss.animationName,sceneDuration:parseFloat(ss.animationDuration)}});
              if(intro.sceneCount!==1||intro.canvas!==0||!String(intro.badgeAnimation).includes('wdccV5BadgePop')||intro.badgeDuration<.85||!String(intro.sceneAnimation).includes('wdccV5ScenePush')||intro.sceneDuration<1.65)throw Error(`INTRO_BAD ${JSON.stringify(intro)}`);
              await p.waitForTimeout(560);await p.screenshot({path:'visual-proof/mobile-intro.png'});
              await waitIntroDone(p);await waitImg(p,'.rh-logo img',200);
              const mob=await p.evaluate(()=>{const q=s=>document.querySelector(s),st=s=>getComputedStyle(q(s)),r=s=>q(s).getBoundingClientRect();return{utilityH:r('.rh-utility').height,headerH:r('.rh-header').height,logoW:r('.rh-logo img').width,menu:st('.rh-menu').display,heroH:r('.rh-hero-art').height,h1:parseFloat(st('.rh-copy h1').fontSize),whiteRight:r('.rh-copy h1 .white').right,benefitH:r('.rh-benefit').height,sectionH2:parseFloat(st('.rh-section-head h2').fontSize),grid:st('.rh-grid').display,cardW:r('.rh-card').width,financeH2:parseFloat(st('.finance-heading h2').fontSize),stepH:r('.rh-step').height,trustH:r('.rh-trust-grid article').height,utilityPos:st('.rh-utility').position,headerPos:st('.rh-header').position,scrollW:document.documentElement.scrollWidth,innerW:innerWidth}});
              if(mob.utilityH>24||mob.headerH>72||mob.logoW<78||mob.logoW>90||mob.menu==='none')throw Error(`MOBILE_HEADER_BAD ${JSON.stringify(mob)}`);
              if(mob.heroH<300||mob.heroH>330||mob.h1<39||mob.h1>43||mob.whiteRight>390)throw Error(`MOBILE_HERO_BAD ${JSON.stringify(mob)}`);
              if(mob.benefitH>84||mob.sectionH2<27||mob.sectionH2>31||mob.grid!=='flex'||mob.cardW<280||mob.cardW>305)throw Error(`MOBILE_SECTION_BAD ${JSON.stringify(mob)}`);
              if(mob.financeH2<25||mob.financeH2>30||mob.stepH>82||mob.trustH>68)throw Error(`MOBILE_LOWER_BAD ${JSON.stringify(mob)}`);
              if(mob.scrollW>mob.innerW+2)throw Error(`MOBILE_HORIZONTAL_OVERFLOW ${JSON.stringify(mob)}`);
              if(!['fixed','sticky'].includes(mob.utilityPos)||!['fixed','sticky'].includes(mob.headerPos))throw Error(`MOBILE_PIN_MODE ${JSON.stringify(mob)}`);
              await p.evaluate(()=>scrollTo(0,700));await p.waitForTimeout(150);
              const pin=await p.evaluate(()=>{const u=document.querySelector('.rh-utility').getBoundingClientRect(),h=document.querySelector('.rh-header').getBoundingClientRect();return{uTop:u.top,uH:u.height,hTop:h.top}});
              if(Math.abs(pin.uTop)>2||Math.abs(pin.hTop-pin.uH)>3)throw Error(`MOBILE_NOT_PINNED ${JSON.stringify(pin)}`);
              await p.evaluate(()=>scrollTo(0,0));await p.waitForTimeout(80);if(errs.length)throw Error(`MOBILE_ERRORS ${JSON.stringify(errs)}`);
              await p.screenshot({path:'visual-proof/mobile-hero.png'});await p.screenshot({path:'visual-proof/mobile-full.png',fullPage:true});proof.mobile={intro,mob,pin,errs};

              const inv=await p.evaluate(async()=>await fetch('/api/inventory').then(r=>r.json()));
              const items=inv.items||inv.inventory||[];const id=String(items[0]?.id||items[0]?.slug||'');if(!id)throw Error('NO_VDP_ID');
              const v=await m.newPage();await v.goto(`${url}/vehicle/${encodeURIComponent(id)}?v5=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});await v.locator('.vdp-title').waitFor({state:'visible',timeout:10000});
              const vdp=await v.evaluate(()=>{const q=s=>document.querySelector(s),st=s=>getComputedStyle(q(s)),r=s=>q(s).getBoundingClientRect();return{commandH:r('.commandStrip').height,headerH:r('.premiumHeader').height,logoW:r('.logoBrand img').width,title:parseFloat(st('.vdp-title').fontSize),photoW:r('.vdp-photo').width,photoH:r('.vdp-photo').height,price:parseFloat(st('.vdp-price').fontSize),stickyH:r('.stickyCtaBar').height,actions:st('.vdp-actions').display,scrollW:document.documentElement.scrollWidth,innerW:innerWidth}});
              if(vdp.commandH>24||vdp.headerH>72||vdp.logoW<74||vdp.logoW>86||vdp.title<35||vdp.title>41)throw Error(`VDP_HEADER_TITLE_BAD ${JSON.stringify(vdp)}`);
              const ratio=vdp.photoW/vdp.photoH;if(ratio<1.5||ratio>1.75||vdp.price<34||vdp.price>42||vdp.stickyH>56||vdp.actions!=='none'||vdp.scrollW>vdp.innerW+2)throw Error(`VDP_SCALE_BAD ${JSON.stringify({vdp,ratio})}`);
              await v.screenshot({path:'visual-proof/mobile-vdp.png',fullPage:true});proof.vdp=vdp;await m.close();

              const d=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});const q=await d.newPage();
              await q.goto(`${url}/?desktop=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});await waitImg(q,'.li-scene img',1000);await waitIntroDone(q);await waitImg(q,'.rh-logo img',200);
              const desk=await q.evaluate(()=>{const st=s=>getComputedStyle(document.querySelector(s)),r=s=>document.querySelector(s).getBoundingClientRect();return{nav:st('.rh-nav').display,menu:st('.rh-menu').display,grid:st('.rh-grid').display,h1:parseFloat(st('.rh-copy h1').fontSize),logoW:r('.rh-logo img').width}});
              if(desk.nav!=='flex'||desk.menu!=='none'||desk.grid!=='grid'||desk.h1<60||desk.logoW<88)throw Error(`DESKTOP_BAD ${JSON.stringify(desk)}`);
              await q.screenshot({path:'visual-proof/desktop-full.png',fullPage:true});proof.desktop=desk;await d.close();
            }finally{await browser.close()}
            fs.writeFileSync('visual-proof/metrics.json',JSON.stringify(proof,null,2)+'\n');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Summary
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo '### WDCC Owner V5 visual proof' >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: ${URL:-not-created}" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Compact sticky stack, balanced storefront scale, swipe carousel, compact finance/trust and normalized VDP measured.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production untouched.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-owner-v5-proof
          path: |
            preview-url.txt
            visual-proof/
          if-no-files-found: warn
          retention-days: 7
