name: WDCC Read-Only Release Acceptance

# No production mutations. Prior workflow that sent synthetic customer leads
# and published proof vehicles remains retrievable from Git history only.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'scripts/wdcc-release-static-check.mjs'
      - 'scripts/wdcc-live-readonly-audit.mjs'
      - '.github/workflows/wdcc-acceptance.yml'
  schedule:
    - cron: '19 13 * * *'

permissions:
  contents: read

concurrency:
  group: wdcc-readonly-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-acceptance:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Static product acceptance and route gates
        run: |
          node --check scripts/wdcc-release-static-check.mjs
          node scripts/wdcc-release-static-check.mjs
      - name: Install reproducibly without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Verify immutable media assets
        run: node scripts/wdcc-media-integrity.mjs
      - name: Compile release candidate without production secrets
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Local read-only route smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3197 >/tmp/wdcc-next-local.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 24); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:3197/about -o /dev/null; then break; fi
            sleep 1
          done
          for route in / /inventory /about /login /forgot-password /reset-password /robots.txt /sitemap.xml; do
            code="$(curl -s -o /tmp/wdcc-route -w '%{http_code}' --max-time 6 "http://127.0.0.1:3197$route")"
            echo "$route => $code"
            test "$code" = '200'
          done
          curl -fsS --max-time 6 http://127.0.0.1:3197/login | grep -F -q '/forgot-password'
          curl -fsS --max-time 6 http://127.0.0.1:3197/sitemap.xml | grep -F -q 'wedontcarecars.com/about'

      - name: Local browser acceptance with screenshot evidence
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then echo 'Browser unavailable in this runner; cannot certify visual QA'; exit 1; fi
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
          npm run start -- -p 3197 >/tmp/wdcc-visual-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:3197/about -o /dev/null; then break; fi
            sleep 1
          done
          CHROME_BIN="$CHROME_BIN" WDCC_VISUAL_DIR=wdcc-browser-evidence node scripts/wdcc-local-browser-acceptance.mjs
          CHROME_BIN="$CHROME_BIN" node scripts/wdcc-local-conversion-acceptance.mjs
      - name: Archive browser screenshots and acceptance output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wdcc-local-visual-evidence-${{ github.run_id }}
          path: wdcc-browser-evidence/
          retention-days: 30
          if-no-files-found: warn

  read-only-production-observation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Bounded GET-only production evidence check
        env:
          WDCC_AUDIT_OUTPUT: wdcc-observation.json
        run: |
          node --check scripts/wdcc-live-readonly-audit.mjs
          node scripts/wdcc-live-readonly-audit.mjs
      - name: Preserve dated read-only observation artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wdcc-readonly-evidence-${{ github.run_id }}
          path: wdcc-observation.json
          retention-days: 30
          if-no-files-found: warn
