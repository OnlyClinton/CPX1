name: WDCC Owner Visual Acceptance Gate

on:
  # Intentionally unfiltered so this check always reports and can be required
  # by main branch protection. Non-visual changes pass without approval.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  visual-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APPROVED_SHA: ${{ vars.WDCC_OWNER_VISUAL_APPROVED_SHA }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine whether owner-visible WDCC output changed
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          visual=false
          if [ -n "${BASE_SHA:-}" ]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed.txt
          else
            git show --pretty='' --name-only "$HEAD_SHA" > /tmp/changed.txt
          fi
          cat /tmp/changed.txt
          # Only application/rendering code and shipped assets require owner
          # visual approval. Control-plane workflow changes are governed by
          # the separate production-control audit and PR review policy.
          if grep -Eq '^(app/|public/|styles/|next\.config\.|package(-lock)?\.json$)' /tmp/changed.txt; then
            visual=true
          fi
          echo "visual=$visual" >> "$GITHUB_OUTPUT"

      - name: Require exact-head owner visual approval
        if: steps.scope.outputs.visual == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${APPROVED_SHA:-}" ] && [ "$APPROVED_SHA" = "$HEAD_SHA" ]; then
            echo "WDCC_OWNER_VISUAL_ACCEPTANCE=PASS exact_sha=$HEAD_SHA source=repository-variable"
            exit 0
          fi

          # Fail-closed fallback: accept only an exact-SHA approval recorded by
          # the repository owner in the canonical release-control issue #205.
          curl -fsS "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/205/comments?per_page=100" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' > /tmp/issue205-comments.json
          token="WDCC_OWNER_VISUAL_APPROVAL $HEAD_SHA"
          if jq -e --arg owner "$GITHUB_REPOSITORY_OWNER" --arg token "$token" \
            'any(.[]; .user.login == $owner and .author_association == "OWNER" and (((.body // "") | split("\n")[0]) == $token))' \
            /tmp/issue205-comments.json >/dev/null; then
            echo "WDCC_OWNER_VISUAL_ACCEPTANCE=PASS exact_sha=$HEAD_SHA source=issue-205-owner-comment"
            exit 0
          fi

          echo "OWNER VISUAL ACCEPTANCE REQUIRED: no exact-head owner approval was found." >&2
          echo "repository_variable=${APPROVED_SHA:-unset}" >&2
          echo "required_issue205_token=$token" >&2
          exit 1

      - name: Record no-op for non-visual changes
        if: steps.scope.outputs.visual != 'true'
        shell: bash
        run: echo 'WDCC_OWNER_VISUAL_ACCEPTANCE=NOT_REQUIRED non-visual change set'

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '### WDCC owner visual acceptance gate'
            echo "Head SHA: $HEAD_SHA"
            echo "Visual-sensitive change: ${{ steps.scope.outputs.visual }}"
            if [ "${{ steps.scope.outputs.visual }}" = true ]; then
              echo 'Machine/E2E success is not visual approval. This gate stays fail-closed until the owner approves the exact head through the repository variable or an exact owner-authored token in release-control issue #205.'
            else
              echo 'No owner-visible WDCC application/asset change detected; visual approval is not required for this PR.'
            fi
            echo 'This workflow has read-only repository permissions and performs no deployment, alias, DNS, provider, database, schema, or application-state mutation.'
          } >> "$GITHUB_STEP_SUMMARY"
