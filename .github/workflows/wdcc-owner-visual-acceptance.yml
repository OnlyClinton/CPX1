name: WDCC Owner Visual Acceptance Gate

on:
  # Intentionally unfiltered so the check always reports and can be required
  # by main branch protection. Non-visual changes pass without approval.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  visual-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APPROVED_SHA: ${{ vars.WDCC_OWNER_VISUAL_APPROVED_SHA }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine whether owner-visible WDCC output changed
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          visual=false
          if [ -n "${BASE_SHA:-}" ]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed.txt
          else
            git show --pretty='' --name-only "$HEAD_SHA" > /tmp/changed.txt
          fi
          cat /tmp/changed.txt
          # Only owner-visible application/rendering code and shipped assets
          # require owner visual approval. API routes are server-side and do
          # not change rendered WDCC output. Control-plane workflow changes are
          # governed by the separate production-control audit and PR review policy.
          while IFS= read -r path; do
            case "$path" in
              app/api/*)
                ;;
              app/*|public/*|styles/*|next.config.*|package.json|package-lock.json)
                visual=true
                ;;
            esac
          done < /tmp/changed.txt
          echo "visual=$visual" >> "$GITHUB_OUTPUT"

      - name: Require exact-head owner visual approval
        if: steps.scope.outputs.visual == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${APPROVED_SHA:-}" = "$HEAD_SHA" ]; then
            echo "WDCC_OWNER_VISUAL_ACCEPTANCE=PASS exact_sha=$HEAD_SHA source=repository-variable"
            exit 0
          fi
          printf '[]\n' > /tmp/visual-comments.json
          page=1
          while :; do
            curl -fsS "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/205/comments?per_page=100&page=$page" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' > /tmp/visual-comments-page.json
            count="$(jq 'length' /tmp/visual-comments-page.json)"
            jq -s 'add' /tmp/visual-comments.json /tmp/visual-comments-page.json > /tmp/visual-comments-next.json
            mv /tmp/visual-comments-next.json /tmp/visual-comments.json
            test "$count" -lt 100 && break
            page=$((page + 1))
          done
          jq -e \
            --arg owner "$GITHUB_REPOSITORY_OWNER" \
            --arg marker "WDCC_OWNER_VISUAL_APPROVAL $HEAD_SHA" \
            'any(.[]; .user.login==$owner and .author_association=="OWNER" and (.body // "")==$marker)' \
            /tmp/visual-comments.json >/dev/null || {
              echo "OWNER VISUAL ACCEPTANCE REQUIRED for exact head: $HEAD_SHA" >&2
              exit 1
            }
          echo "WDCC_OWNER_VISUAL_ACCEPTANCE=PASS exact_sha=$HEAD_SHA source=owner-issue-marker"

      - name: Record no-op for non-visual changes
        if: steps.scope.outputs.visual != 'true'
        shell: bash
        run: echo 'WDCC_OWNER_VISUAL_ACCEPTANCE=NOT_REQUIRED non-visual change set'

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '### WDCC owner visual acceptance gate'
            echo "Head SHA: $HEAD_SHA"
            echo "Visual-sensitive change: ${{ steps.scope.outputs.visual }}"
            if [ "${{ steps.scope.outputs.visual }}" = true ]; then
              echo 'Machine/E2E success is not visual approval. This gate stays fail-closed until the owner approves the exact head after reviewing its captured photography and animation.'
            else
              echo 'No owner-visible WDCC application/asset change detected; visual approval is not required for this PR.'
            fi
            echo 'This workflow has read-only repository permissions and performs no deployment, alias, DNS, provider, database, schema, or application-state mutation.'
          } >> "$GITHUB_STEP_SUMMARY"
