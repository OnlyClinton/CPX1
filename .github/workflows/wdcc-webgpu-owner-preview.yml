name: WDCC WebGPU Owner Preview

on:
  push:
    branches: [feat/wdcc-webgpu-intro-owner-override-20260827]
    paths:
      - 'app/LockedIntro.tsx'
      - 'app/WdccThreeRuntime.tsx'
      - 'app/three-shim.d.ts'
      - 'app/wdcc-webgpu-intro-fix.css'
      - 'app/layout.tsx'
      - 'app/ReferenceCloneHome.tsx'
      - 'public/wdcc-hero-v2.webp'
      - 'OWNER_WEBGPU_THREE_INTRO_OVERRIDE_20260827.md'
      - '.github/workflows/wdcc-webgpu-owner-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-webgpu-owner-${{ github.sha }}
  cancel-in-progress: false

jobs:
  owner-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate isolated owner lane
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -s app/LockedIntro.tsx
          test -s app/WdccThreeRuntime.tsx
          test -s app/wdcc-webgpu-intro-fix.css
          grep -q 'import("three/webgpu")' app/WdccThreeRuntime.tsx
          grep -q 'WebGPURenderer' app/WdccThreeRuntime.tsx
          grep -q 'WebGLRenderer' app/WdccThreeRuntime.tsx
          grep -q 'li-wheel-front' app/LockedIntro.tsx
          grep -q 'TAP FOR DEEP SOUND' app/LockedIntro.tsx
          grep -q 'data-wdcc-intro-badge-art="owner-approved"' app/LockedIntro.tsx

      - name: Build exact candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false three@0.185.1 @opennextjs/cloudflare@1.19.9 wrangler@4.90.0 playwright@1.55.0
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets
          test -s .next/BUILD_ID
          npx playwright install --with-deps chromium >/dev/null

      - name: Create SHA-specific no-route worker
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          c.name=`wdcc-webgpu-${process.env.GITHUB_SHA}`;
          c.workers_dev=true;
          c.preview_urls=true;
          delete c.route;
          delete c.routes;
          fs.writeFileSync('wrangler.webgpu-owner.jsonc',JSON.stringify(c,null,2)+'\n');
          NODE
          ! grep -qi 'wedontcarecars.com' wrangler.webgpu-owner.jsonc

      - name: Deploy immutable owner preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.webgpu-owner.jsonc 2>&1 | tee /tmp/deploy.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/deploy.log | tail -1)"
          test -n "$url"
          case "$url" in *"$GITHUB_SHA"*) ;; *) echo "not immutable: $url" >&2; exit 1;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > webgpu-owner-preview-url.txt

      - name: Prove remote integrity
        shell: bash
        env:
          REMOTE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          code=000
          for i in $(seq 1 15); do
            code="$(curl --http1.1 -sS -L -o /tmp/root.html -w '%{http_code}' "$REMOTE_URL/?owner-webgpu=warm-$i" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          [ "$code" = 200 ]
          build="$(tr -d '\r\n' < .next/BUILD_ID)"
          grep -Fq "$build" /tmp/root.html
          curl --http1.1 -fsSL "$REMOTE_URL/wdcc-hero-v2.webp" -o /tmp/hero.webp
          [ "$(sha256sum /tmp/hero.webp|awk '{print $1}')" = "$(sha256sum public/wdcc-hero-v2.webp|awk '{print $1}')" ]
          printf 'remote_url=%s\nbuild_id=%s\nroot_http=%s\n' "$REMOTE_URL" "$build" "$code" > webgpu-owner-integrity.txt

      - name: Prove motion sound renderer and handoff
        shell: bash
        env:
          REMOTE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {chromium} from 'playwright';
          const out='webgpu-owner-proof'; fs.mkdirSync(out,{recursive:true});
          const browser=await chromium.launch({headless:true});
          const metrics={sha:process.env.GITHUB_SHA,url:process.env.REMOTE_URL,consoleErrors:[]};
          let ctx=null;
          try{
            ctx=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true,reducedMotion:'no-preference',recordVideo:{dir:out,size:{width:390,height:844}}});
            const page=await ctx.newPage();
            const video=page.video();
            page.on('console',m=>{if(m.type()==='error')metrics.consoleErrors.push(m.text())});
            page.on('pageerror',e=>metrics.consoleErrors.push(String(e)));
            const response=await page.goto(`${process.env.REMOTE_URL}/?owner-webgpu=1&proof=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:20000});
            if(!response||response.status()!==200)throw new Error(`HTTP_${response?.status()||0}`);
            await page.locator('.li').waitFor({state:'visible',timeout:8000});
            await page.waitForFunction(()=>{const x=document.querySelector('.li-scene img');return x&&x.complete&&x.naturalWidth>0},null,{timeout:5000});
            const initial=await page.evaluate(()=>{const root=document.querySelector('.li'),c=document.createElement('canvas');let webgl=false;try{webgl=!!(c.getContext('webgl2')||c.getContext('webgl'))}catch{};window.__wdccOwnerProof={handoffSeen:false,handoff:null,renderMode:root?.getAttribute('data-three-runtime-mode')||null,introRemoved:false};const tick=()=>{const p=window.__wdccOwnerProof,r=document.querySelector('.li'),ui=document.querySelector('.rh-hero-inner'),m=r?.getAttribute('data-three-runtime-mode');if(m==='webgpu'||m==='webgl')p.renderMode=m;if(document.documentElement.classList.contains('wdcc-intro-handoff')){p.handoffSeen=true;const sample={rootOpacity:r?Number(getComputedStyle(r).opacity):0,uiOpacity:ui?Number(getComputedStyle(ui).opacity):0,docHandoff:true};if(!p.handoff||sample.uiOpacity>p.handoff.uiOpacity)p.handoff=sample};if(r)requestAnimationFrame(tick);else p.introRemoved=true};requestAnimationFrame(tick);return{declaredMode:root?.getAttribute('data-render-mode')||null,capabilities:{webgpuApi:'gpu' in navigator,webgl}}});
            Object.assign(metrics,initial);
            const wheel=page.locator('.li-wheel-front'),sound=page.locator('.li-sound');
            await page.waitForTimeout(70);
            const transformA=await wheel.evaluate(el=>getComputedStyle(el).transform);
            await sound.click({force:true});
            const soundPressed=await sound.getAttribute('aria-pressed');
            await page.waitForTimeout(260);
            const transformB=await wheel.evaluate(el=>getComputedStyle(el).transform);
            if(transformA===transformB)throw new Error(`WHEEL_NOT_SPINNING_${transformA}`);
            const wheelBlur=await wheel.evaluate(el=>getComputedStyle(el).filter);
            await page.screenshot({path:`${out}/mobile-02-wheel-spin.png`});
            await page.waitForFunction(()=>!document.querySelector('.li'),null,{timeout:2500});
            await page.waitForFunction(()=>{const ui=document.querySelector('.rh-hero-inner');return ui&&Number(getComputedStyle(ui).opacity)>=.95},null,{timeout:1200});
            const telemetry=await page.evaluate(()=>window.__wdccOwnerProof);
            const finalUi=await page.locator('.rh-hero-inner').evaluate(el=>Number(getComputedStyle(el).opacity));
            await page.screenshot({path:`${out}/mobile-06-site.png`});
            if(initial.capabilities.webgl&&telemetry.renderMode!=='webgpu'&&telemetry.renderMode!=='webgl')throw new Error(`GPU_RUNTIME_MISSING_${telemetry.renderMode}`);
            if(!initial.capabilities.webgl&&!telemetry.renderMode&&initial.declaredMode!=='static')throw new Error(`STATIC_FALLBACK_MISSING_${initial.declaredMode}`);
            if(!telemetry.handoffSeen||!telemetry.handoff||telemetry.handoff.uiOpacity<=0)throw new Error(`HANDOFF_NOT_SEEN_${JSON.stringify(telemetry.handoff)}`);
            if(!telemetry.introRemoved)throw new Error('INTRO_NOT_DISPOSED');
            if(finalUi<.95)throw new Error(`SITE_UI_NOT_VISIBLE_${finalUi}`);
            if(soundPressed!=='true')throw new Error(`SOUND_NOT_ACTIVATED_${soundPressed}`);
            Object.assign(metrics,{renderMode:telemetry.renderMode,transformA,transformB,wheelBlur,soundPressed,handoff:telemetry.handoff,introRemoved:telemetry.introRemoved,finalUi});
            await ctx.close(); ctx=null;
            if(video)await video.saveAs(`${out}/mobile-intro-motion.webm`);
            fs.writeFileSync(`${out}/metrics.json`,JSON.stringify(metrics,null,2)+'\n');
          }catch(e){metrics.failure=String(e);fs.writeFileSync(`${out}/metrics.json`,JSON.stringify(metrics,null,2)+'\n');throw e}finally{if(ctx)await ctx.close().catch(()=>{});await browser.close()}
          NODE

      - name: Summary
        if: always()
        shell: bash
        env:
          REMOTE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo '### WDCC WebGPU owner preview' >> "$GITHUB_STEP_SUMMARY"
          echo "Exact SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Immutable preview: ${REMOTE_URL:-not-created}" >> "$GITHUB_STEP_SUMMARY"
          [ ! -s webgpu-owner-proof/metrics.json ] || cat webgpu-owner-proof/metrics.json >> "$GITHUB_STEP_SUMMARY"
          echo 'Preview only; production untouched.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-webgpu-owner-${{ github.sha }}
          path: |
            webgpu-owner-preview-url.txt
            webgpu-owner-integrity.txt
            webgpu-owner-proof/
          if-no-files-found: warn
          retention-days: 7
