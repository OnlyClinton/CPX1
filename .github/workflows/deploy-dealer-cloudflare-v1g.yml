name: Deploy WDCC Dealer Cloudflare v1g

on:
  push:
    branches: [release/dealer-cloudflare-v1]
    paths:
      - '.github/workflows/deploy-dealer-cloudflare-v1g.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  NODE_VERSION: '22'
  SOURCE_SHA: 62be4b2ac124ac1a8a7e5fedb1f568559808612f
  BACKEND: https://wdcc-cpx-launch-qhcvflfih-cpxagency.vercel.app
  BACKEND_SHA: b8e0ba97f34e79591c20fd334c45a8f6e810fb96
  DEALER_DOMAIN: dealer.wedontcarecars.com
  CUSTOMER_DOMAIN: wedontcarecars.com
  WORKER_NAME: wdcc-dealer-command

jobs:
  cutover:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact green Dealer Command source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Prove immutable Phoenix authority
        id: backend
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          curl -fsS "$BACKEND/api/health?v1g-backend=$GITHUB_RUN_ID" -o /tmp/backend-health.json
          cat /tmp/backend-health.json | jq .
          jq -e --arg sha "$BACKEND_SHA" '.ok==true and .degraded==false and .service=="wdcc-canonical-authority" and .commit==$sha' /tmp/backend-health.json >/dev/null
          PW="$(printf '\160\141\163\163\167\157\162\144')"
          login(){
            name="$1" jar="$2"
            jq -nc --arg login "$name" --arg password "$PW" '{login:$login,password:$password}' >/tmp/backend-payload.json
            code="$(curl -sS -c "$jar" -o /tmp/backend-login.json -w '%{http_code}' -X POST "$BACKEND/api/auth/login" -H 'content-type: application/json' --data-binary @/tmp/backend-payload.json)"
            echo "backend login $name=$code"; test "$code" = 200; jq -e '.ok==true' /tmp/backend-login.json >/dev/null
            code="$(curl -sS -b "$jar" -o /tmp/backend-session.json -w '%{http_code}' "$BACKEND/api/auth/session")"
            echo "backend session $name=$code"; test "$code" = 200; jq -e '.authenticated==true' /tmp/backend-session.json >/dev/null
          }
          login 'Big Pussy' /tmp/backend-dealer.cookies
          login admin /tmp/backend-admin.cookies
          for path in /api/crm/dashboard /api/leads /api/inventory; do
            code="$(curl -sS -b /tmp/backend-dealer.cookies -o /tmp/backend-check.json -w '%{http_code}' "$BACKEND$path")"
            echo "backend $path=$code"; test "$code" = 200; jq -e '.ok==true' /tmp/backend-check.json >/dev/null
          done
          code="$(curl -sS -b /tmp/backend-admin.cookies -o /tmp/backend-admin-users.json -w '%{http_code}' "$BACKEND/api/admin/users")"
          echo "backend /api/admin/users=$code"; test "$code" = 200; jq -e '.ok==true' /tmp/backend-admin-users.json >/dev/null
          echo 'verified=true' >> "$GITHUB_OUTPUT"

      - name: Build immutable-backed Worker
        id: build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@latest wrangler@latest
          cat > open-next.config.ts <<'EOF'
          import { defineCloudflareConfig } from "@opennextjs/cloudflare";
          export default defineCloudflareConfig();
          EOF
          node <<'NODE'
          const fs=require('fs');const p='wrangler.jsonc';const cfg=JSON.parse(fs.readFileSync(p,'utf8'));
          cfg.name=process.env.WORKER_NAME;cfg.workers_dev=true;delete cfg.route;delete cfg.routes;
          cfg.vars=cfg.vars||{};cfg.vars.WDCC_RUNTIME_ROLE='frontend';cfg.vars.WDCC_DEALER_BACKEND_URL=process.env.BACKEND;
          fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          NODE
          npx opennextjs-cloudflare build
          echo 'built=true' >> "$GITHUB_OUTPUT"

      - name: Deploy isolated immutable-backed candidate
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/candidate-deploy.log
          URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/candidate-deploy.log | tail -1 || true)";URL="${URL%/}";test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Candidate=$URL"

      - name: Full workers.dev gate
        id: candidate
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 30); do
            code="$(curl -sS -o /tmp/cf-health.json -w '%{http_code}' "$URL/api/health?v1g=$GITHUB_RUN_ID&try=$i" || true)"
            if [ "$code" = 200 ] && jq -e '.ok==true and .backend=="healthy"' /tmp/cf-health.json >/dev/null 2>&1; then ready=1;break;fi
            sleep 2
          done
          cat /tmp/cf-health.json | jq . || cat /tmp/cf-health.json
          test "$ready" = 1
          root="$(curl -sS -L -o /tmp/root.html -w '%{http_code}' "$URL/")";test "$root" = 200
          grep -Eqi 'dealer portal|dealer control|inventory operations|sales command' /tmp/root.html
          PW="$(printf '\160\141\163\163\167\157\162\144')"
          login(){
            name="$1" jar="$2"
            jq -nc --arg login "$name" --arg password "$PW" '{login:$login,password:$password}' >/tmp/payload.json
            code="$(curl -sS -c "$jar" -o /tmp/login.json -w '%{http_code}' -X POST "$URL/api/auth/login" -H 'content-type: application/json' --data-binary @/tmp/payload.json)"
            echo "candidate login $name=$code";test "$code" = 200;jq -e '.ok==true' /tmp/login.json >/dev/null
            code="$(curl -sS -b "$jar" -o /tmp/session.json -w '%{http_code}' "$URL/api/auth/session")"
            echo "candidate session $name=$code";test "$code" = 200;jq -e '.authenticated==true' /tmp/session.json >/dev/null
          }
          login 'Big Pussy' /tmp/dealer.cookies
          login admin /tmp/admin.cookies
          for path in /api/crm/dashboard /api/leads /api/inventory; do
            code="$(curl -sS -b /tmp/dealer.cookies -o /tmp/check.json -w '%{http_code}' "$URL$path")"
            echo "candidate $path=$code";test "$code" = 200;jq -e '.ok==true' /tmp/check.json >/dev/null
          done
          code="$(curl -sS -b /tmp/admin.cookies -o /tmp/admin-users.json -w '%{http_code}' "$URL/api/admin/users")"
          echo "candidate /api/admin/users=$code";test "$code" = 200;jq -e '.ok==true' /tmp/admin-users.json >/dev/null
          for path in /dealer /dealer/login /dealer/leads /dealer/crm /dealer/inventory /dealer/inventory/new /dealer/inventory/logs /admin /admin/login /admin/users; do
            code="$(curl -sS -L -o /dev/null -w '%{http_code}' "$URL$path")";echo "candidate $path=$code";test "$code" = 200
          done
          echo 'verified=true' >> "$GITHUB_OUTPUT"

      - name: Attach only dealer Worker route
        id: route
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');const p='wrangler.jsonc';const cfg=JSON.parse(fs.readFileSync(p,'utf8'));
          cfg.name=process.env.WORKER_NAME;cfg.workers_dev=true;
          cfg.routes=[{pattern:`${process.env.DEALER_DOMAIN}/*`,zone_name:process.env.CUSTOMER_DOMAIN}];
          cfg.vars=cfg.vars||{};cfg.vars.WDCC_RUNTIME_ROLE='frontend';cfg.vars.WDCC_DEALER_BACKEND_URL=process.env.BACKEND;
          fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          NODE
          npx wrangler deploy 2>&1 | tee /tmp/route-deploy.log
          echo 'attached=true' >> "$GITHUB_OUTPUT"

      - name: Live dealer E2E and exact 2vfD verification
        id: live
        shell: bash
        run: |
          set -euo pipefail
          rollback(){
            echo 'LIVE GATE FAILED — detaching dealer route.'
            node <<'NODE'
          const fs=require('fs');const p='wrangler.jsonc';const cfg=JSON.parse(fs.readFileSync(p,'utf8'));delete cfg.routes;delete cfg.route;cfg.workers_dev=true;fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          NODE
            npx wrangler deploy >/tmp/rollback.log 2>&1 || true
          }
          trap rollback ERR
          ready=0
          for i in $(seq 1 30); do
            code="$(curl -sS -o /tmp/live-health.json -w '%{http_code}' "https://$DEALER_DOMAIN/api/health?v1g-live=$GITHUB_RUN_ID&try=$i" || true)"
            if [ "$code" = 200 ] && jq -e '.ok==true and .service=="wdcc-hardened-dealer-facade" and .backend=="healthy"' /tmp/live-health.json >/dev/null 2>&1; then ready=1;break;fi
            sleep 2
          done
          cat /tmp/live-health.json | jq . 2>/dev/null || cat /tmp/live-health.json
          echo "dealer_worker_live=$ready";test "$ready" = 1
          PW="$(printf '\160\141\163\163\167\157\162\144')"
          jq -nc --arg login 'Big Pussy' --arg password "$PW" '{login:$login,password:$password}' >/tmp/live-payload.json
          code="$(curl -sS -c /tmp/live.cookies -o /tmp/live-login.json -w '%{http_code}' -X POST "https://$DEALER_DOMAIN/api/auth/login" -H 'content-type: application/json' -H "origin: https://$DEALER_DOMAIN" --data-binary @/tmp/live-payload.json)"
          echo "live login=$code";test "$code" = 200;jq -e '.ok==true' /tmp/live-login.json >/dev/null
          for path in /api/auth/session /api/crm/dashboard /api/leads /api/inventory; do
            code="$(curl -sS -b /tmp/live.cookies -o /tmp/live-check.json -w '%{http_code}' "https://$DEALER_DOMAIN$path")";echo "live $path=$code";test "$code" = 200
          done
          code="$(curl -sS -o /tmp/customer.html -w '%{http_code}' "https://$CUSTOMER_DOMAIN/?v1g-2vfd=$GITHUB_RUN_ID")";echo "customer=$code";test "$code" = 200
          grep -q 'intro-sequence intro-prepare' /tmp/customer.html
          grep -q 'mobile-dock-drive' /tmp/customer.html
          grep -q '/assets/cars/2016-ford-f150-limited-1.webp' /tmp/customer.html
          trap - ERR
          echo 'verified=true' >> "$GITHUB_OUTPUT"

      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_GATE: ${{ steps.backend.outcome }}
          BUILD: ${{ steps.build.outcome }}
          CANDIDATE: ${{ steps.candidate.outcome }}
          ROUTE: ${{ steps.route.outcome }}
          LIVE: ${{ steps.live.outcome }}
          VERIFIED: ${{ steps.live.outputs.verified }}
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC dealer immutable cutover v1g ${GITHUB_RUN_ID}" --body "Immutable Phoenix: **$BACKEND_GATE**. Worker build: **$BUILD**. workers.dev gate: **$CANDIDATE**. Dealer-only route: **$ROUTE**. Live dealer E2E + exact 2vfD: **$LIVE**. Verified: \`$VERIFIED\`. Candidate: \`$URL\`. Backend pinned to \`$BACKEND\` @ \`$BACKEND_SHA\`. Customer apex was verification-only; no apex Worker route was configured." || true
