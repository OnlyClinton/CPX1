name: WDCC Cloudflare Reuse V53 Staging

on:
  push:
    branches: [emergency/wdcc-cloudflare-r2-20260827]
    paths:
      - '.github/workflows/wdcc-cloudflare-reuse-v53-staging.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wdcc-cloudflare-reuse-v53-staging
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM: cpxagency
      TEAM_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      PHOENIX_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
      WORKER: wdcc-v53-staging
      WORKER_URL: https://wdcc-v53-staging.clico-global.workers.dev
      STATE_URL: https://wdcc-v53-staging.clico-global.workers.dev/__wdcc_state
      BOOTSTRAP_SHA256: 364a7acba7a7be8af5ad9e9ef54e0bc11fed0d6601ba6975f6cd58700f1dd7d7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require existing provider credentials
        shell: bash
        run: |
          set -euo pipefail
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VERCEL_TOKEN; do test -n "${!v:-}" || exit 20; done

      - name: Install Cloudflare and Vercel tooling
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0
          npm install --global vercel@59.5.0 >/dev/null
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$TEAM_ID" "$PHOENIX_ID" > .vercel/project.json

      - name: Reuse existing isolated Worker slot for durable state
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler.cf-state.jsonc <<EOF
          {
            "name":"$WORKER",
            "main":"cloudflare/wdcc-state-worker.mjs",
            "compatibility_date":"2026-08-27",
            "workers_dev":true,
            "preview_urls":true,
            "observability":{"enabled":true},
            "vars":{"WDCC_BOOTSTRAP_SHA256":"$BOOTSTRAP_SHA256"},
            "durable_objects":{"bindings":[{"name":"WDCC_STATE","class_name":"WDCCState"}]},
            "migrations":[{"tag":"v1","new_sqlite_classes":["WDCCState"]}]
          }
          EOF
          npx wrangler deploy --config wrangler.cf-state.jsonc 2>&1 | tee /tmp/state-deploy.log
          grep -q "$WORKER_URL" /tmp/state-deploy.log
          INTERNAL_TOKEN="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$INTERNAL_TOKEN"
          printf '%s' "$INTERNAL_TOKEN" >/tmp/internal-token
          printf '%s' "$INTERNAL_TOKEN" | npx wrangler secret put WDCC_STATE_SERVICE_TOKEN --config wrangler.cf-state.jsonc >/dev/null

      - name: Prove durable storage and seed synthetic isolated state
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat /tmp/internal-token)"
          test "$(curl -sS -o /tmp/self.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -X POST "$WORKER_URL/self-test")" = 200
          jq -e '.ok==true and .write==true and .read==true and .delete==true' /tmp/self.json >/dev/null
          cat > /tmp/synthetic-state.json <<'JSON'
          {
            "revision": 1,
            "tenants": [{"id":"wdcc","slug":"wdcc","name":"We Don't Care Cars","status":"recovery-proof"}],
            "users": [],
            "vehicles": [],
            "leads": [],
            "audit": [{"id":"cloudflare-recovery-proof","at":"2026-08-27T00:00:00Z","actor":"recovery","action":"cloudflare.synthetic.bootstrap","details":{"production":false,"source":"synthetic"}}],
            "updatedAt": "2026-08-27T00:00:00Z"
          }
          JSON
          code="$(curl -sS -o /tmp/seed.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -X PUT "$WORKER_URL/state" --data-binary @/tmp/synthetic-state.json)"
          test "$code" = 200
          jq -e '.ok==true and .revision==1' /tmp/seed.json >/dev/null
          test "$(curl -sS -o /tmp/state-health.json -w '%{http_code}' "$WORKER_URL/health?proof=$GITHUB_RUN_ID")" = 200
          jq -e '.ok==true and .provider=="cloudflare" and .storage=="durable-object-sqlite" and .state=="readable" and .revision==1' /tmp/state-health.json >/dev/null

      - name: Build WDCC application for Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets
          test -s cloudflare/wdcc-combined-worker.mjs

      - name: Replace same isolated Worker with combined backend plus durable state
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const source=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          source.name=process.env.WORKER;
          source.main='cloudflare/wdcc-combined-worker.mjs';
          source.workers_dev=true;
          source.preview_urls=true;
          delete source.route; delete source.routes;
          source.vars={...(source.vars||{}),WDCC_RUNTIME_ROLE:'backend',WDCC_PROVIDER:'cloudflare',WDCC_STATE_SERVICE_URL:process.env.STATE_URL,WDCC_BOOTSTRAP_SHA256:process.env.BOOTSTRAP_SHA256};
          delete source.vars.WDCC_DEALER_BACKEND_URL;
          source.durable_objects={bindings:[{name:'WDCC_STATE',class_name:'WDCCState'}]};
          source.migrations=[{tag:'v1',new_sqlite_classes:['WDCCState']}];
          fs.writeFileSync('wrangler.cf-combined.jsonc',JSON.stringify(source,null,2)+'\n');
          NODE
          npx wrangler deploy --config wrangler.cf-combined.jsonc 2>&1 | tee /tmp/app-deploy.log
          grep -q "$WORKER_URL" /tmp/app-deploy.log
          TOKEN="$(cat /tmp/internal-token)"
          printf '%s' "$TOKEN" | npx wrangler secret put WDCC_STATE_SERVICE_TOKEN --config wrangler.cf-combined.jsonc >/dev/null
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- bash -lc 'test -n "${SESSION_SECRET:-}"; printf "%s" "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET --config wrangler.cf-combined.jsonc >/dev/null'

      - name: Prove full Cloudflare stack on isolated synthetic state
        shell: bash
        run: |
          set -euo pipefail
          code=000
          for i in $(seq 1 20); do
            code="$(curl -sS -L -o /tmp/app-health.json -w '%{http_code}' "$WORKER_URL/api/health?full=$GITHUB_RUN_ID-$i" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          test "$code" = 200
          jq -e '.ok==true and .degraded==false and .backend=="local" and .storage=="cloudflare-do" and .state=="readable" and .provider=="cloudflare" and .session=="configured" and .revision==1' /tmp/app-health.json >/dev/null
          test "$(curl -sS -L -o /tmp/inventory.json -w '%{http_code}' "$WORKER_URL/api/inventory?full=$GITHUB_RUN_ID")" = 200
          jq -e '.ok==true and (.items|type)=="array" and (.items|length)==0' /tmp/inventory.json >/dev/null
          test "$(curl -sS -L -o /tmp/dealer.html -w '%{http_code}' "$WORKER_URL/dealer?full=$GITHUB_RUN_ID")" = 200
          grep -qi 'dealer' /tmp/dealer.html
          test "$(curl -sS -o /tmp/state-health-final.json -w '%{http_code}' "$STATE_URL/health?full=$GITHUB_RUN_ID")" = 200
          jq -e '.ok==true and .revision==1 and .storage=="durable-object-sqlite"' /tmp/state-health-final.json >/dev/null

      - name: Record isolated proof
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 205 --repo "$GITHUB_REPOSITORY" --body "Emergency Cloudflare recovery proof run $GITHUB_RUN_ID is GREEN in isolation using the existing \`wdcc-v53-staging\` Worker slot, so the 100-Worker cap was bypassed without creating or deleting a Worker. SQLite-backed Durable Object write/read/delete passed; combined WDCC backend health=200 with provider=cloudflare, storage=cloudflare-do, state=readable, session=configured; inventory=200 and dealer page=200. The seeded ledger is deliberately synthetic revision 1 and contains no production business data. No production Worker route, DNS, Vercel alias, apex, or dealer traffic was changed. Live cutover remains blocked until the post-cleanup production ledger (revision 654) is recovered or independently reconstructed and verified." || true

      - name: Failure record
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 205 --repo "$GITHUB_REPOSITORY" --body "Emergency Cloudflare reuse proof run $GITHUB_RUN_ID failed on the isolated \`wdcc-v53-staging\` Worker. No production Worker route, DNS, Vercel alias, apex, or dealer traffic was changed." || true
