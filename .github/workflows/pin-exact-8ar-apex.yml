name: Pin stable 2vfD plus 8AR apex
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pin-exact-8ar-apex.yml'
  workflow_dispatch:

jobs:
  pin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM: cpxagency
      DONOR: wdcc-v32-storefront-dt496r4il-cpxagency.vercel.app
      APEX: wedontcarecars.com
      WWW: www.wedontcarecars.com
    steps:
      - name: Require token
        run: test -n "$VERCEL_TOKEN"

      - name: Verify immutable 2vfD plus 8AR donor
        id: donor
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://$DONOR/?intro=1" -o /tmp/donor.html
          grep -q 'intro-sequence' /tmp/donor.html
          grep -q 'wdcc-logo-transparent.webp' /tmp/donor.html
          grep -q 'SCHEDULE A TEST DRIVE' /tmp/donor.html

      - name: Install Vercel CLI
        run: npm install --global vercel@59.3.0 >/dev/null

      - name: Pin apex and www to stable artifact
        id: alias
        shell: bash
        run: |
          set -euo pipefail
          vercel alias set "$DONOR" "$APEX" --token="$VERCEL_TOKEN" --scope="$TEAM"
          vercel alias set "$DONOR" "$WWW" --token="$VERCEL_TOKEN" --scope="$TEAM"

      - name: Verify public rollback
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          for host in "$APEX" "$WWW"; do
            ok=0
            for i in $(seq 1 20); do
              curl -sS "https://$host/?intro=1&pin=${GITHUB_RUN_ID}" -o /tmp/live.html || true
              if grep -q 'intro-sequence' /tmp/live.html \
                && grep -q 'wdcc-logo-transparent.webp' /tmp/live.html \
                && grep -q 'SCHEDULE A TEST DRIVE' /tmp/live.html; then
                ok=1; break
              fi
              sleep 2
            done
            test "$ok" = '1'
            code="$(curl -sS -o /tmp/live-inv.json -w '%{http_code}' "https://$host/api/inventory")"
            test "$code" = '200'
            jq -e '.ok == true' /tmp/live-inv.json >/dev/null
          done
          echo 'pinned=true' >> "$GITHUB_OUTPUT"

      - name: Report rollback pin
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DONOR_STATUS: ${{ steps.donor.outcome }}
          ALIAS_STATUS: ${{ steps.alias.outcome }}
          VERIFY_STATUS: ${{ steps.verify.outcome }}
          PINNED: ${{ steps.verify.outputs.pinned }}
        shell: bash
        run: |
          body=$(printf '2vfD + 8AR donor checks: **%s**\nAlias pin: **%s**\nPublic rollback verification: **%s**\nPinned: `%s`\n\nApex: https://wedontcarecars.com/?intro=1\nPinned donor: `%s`\nDealer/backend and Neon were not changed.' "$DONOR_STATUS" "$ALIAS_STATUS" "$VERIFY_STATUS" "$PINNED" "$DONOR")
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC stable 2vfD + 8AR live pin ${GITHUB_SHA:0:7}" --body "$body" || true
