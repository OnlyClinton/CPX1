name: R31 Local Visual QA

on:
  push:
    branches: [preview/r31-exact-live-base]
    paths:
      - 'app/r31-preview/**'
      - 'app/components.tsx'
      - 'app/assets/cars/**'
      - 'public/assets/cars/**'
      - 'public/wdcc-logo-transparent.webp'
      - 'public/wdcc-hero-v2.webp'
      - 'scripts/r31-local-visual-qa.mjs'
      - '.github/workflows/r31-local-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify exact donor branding wiring
        run: |
          grep -q 'img src="/wdcc-logo-transparent.webp"' app/r31-preview/R31Chrome.tsx
          ! grep -q 'wdcc-official-logo.webp' app/r31-preview/R31Chrome.tsx
          grep -q "url('/wdcc-hero-v2.webp')" app/r31-preview/r31-preview.module.css
      - name: Install app dependencies
        run: npm ci
      - name: Build Next app locally
        run: npm run build
      - name: Install Playwright browser for QA only
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local production server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/r31-next.log 2>&1 &
          echo $! > /tmp/r31-next.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/r31-preview >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/r31-next.log
          exit 1
      - name: Run desktop, tablet, mobile and failure-state QA
        run: node scripts/r31-local-visual-qa.mjs
      - name: Print local server log on failure
        if: failure()
        run: cat /tmp/r31-next.log || true
      - name: Upload rendered visual QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r31-local-visual-qa
          path: artifacts/r31-local-visual/
          if-no-files-found: warn
          retention-days: 7
