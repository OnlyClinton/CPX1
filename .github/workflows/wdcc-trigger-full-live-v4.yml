name: WDCC Trigger Full Live V4
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-trigger-full-live-v4.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch full live acceptance V4
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wdcc-full-live-acceptance-v4.yml --repo "$GITHUB_REPOSITORY" --ref main
