name: WDCC Attribution Preview
on:
  push:
    branches: [fix/attribution-no-void]
  workflow_dispatch:

concurrency:
  group: wdcc-attribution-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      VERCEL_ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      VERCEL_PROJECT_ID: prj_We7xkAkB5Qy31Pt17USSkQFE0u7h
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require Vercel token
        run: test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN missing" >&2; exit 78; }
      - name: Link WDCC storefront project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
      - run: npm install --global vercel@59.3.0
      - name: Pull preview environment
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" --scope=cpxagency
      - name: Build preview
        run: vercel build --token="$VERCEL_TOKEN" --scope=cpxagency
      - name: Deploy preview only
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" --scope=cpxagency | tail -n 1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $url"
      - name: Smoke preview
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          code="$(curl -sS -L -o /tmp/home.html -w '%{http_code}' "$URL/?utm_source=preview_test&utm_medium=qa&utm_campaign=attribution")"
          test "$code" = "200"
          grep -qi "BAD CREDIT" /tmp/home.html
      - name: Report preview
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
        run: gh issue comment 137 --repo "$GITHUB_REPOSITORY" --body "Attribution preview: ${URL:-not-created}" || true
