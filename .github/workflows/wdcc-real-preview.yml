name: WDCC REAL PREVIEW

on:
  push:
    branches: [preview/wdcc-real-v1]
  workflow_dispatch:

concurrency:
  group: wdcc-real-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: cpxagency
      VERCEL_PROJECT: wdcc-v32-storefront
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Build source
        run: npm ci && npm run build
      - name: Install Vercel CLI
        run: npm install --global vercel@59.3.0
      - name: Link preview project
        run: vercel link --yes --project="$VERCEL_PROJECT" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
      - name: Pull preview environment
        run: vercel pull --yes --environment=preview --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
      - name: Build Vercel preview
        run: vercel build --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
      - name: Deploy no-alias preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          vercel deploy --prebuilt --yes --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" > /tmp/deploy.log 2>&1
          cat /tmp/deploy.log
          url="$(grep -Eo 'https://wdcc-v32-storefront-[a-z0-9-]+-cpxagency\.vercel\.app' /tmp/deploy.log | tail -n 1 || true)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke preview
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          test -n "$URL"
          curl -fsS "$URL" >/tmp/home.html
          grep -qi "Bad credit" /tmp/home.html
          curl -fsS "$URL/get-approved" >/tmp/approval.html
          curl -fsS "$URL/schedule-test-drive" >/tmp/testdrive.html
          curl -fsS "$URL/contact" >/tmp/contact.html
          echo "Preview: $URL"
      - name: Report preview
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC real preview ${GITHUB_RUN_ID}" --body "Branch: \`preview/wdcc-real-v1\`\nSource: \`${GITHUB_SHA}\`\nPreview: \`${URL:-not-created}\`\nProduction aliases changed: **no**\nReal 5-step dealer wizard: **included**" || true
