name: WDCC Locked Contract Cloudflare Preview

on:
  push:
    branches: [fix/wdcc-locked-contract-20260826]
    paths:
      - '.github/workflows/wdcc-locked-contract-build.yml'
      - '.github/workflows/wdcc-android-owner-proof.yml'
      - '.github/workflows/wdcc-immutable-visual-acceptance-v2.yml'
      - '.github/workflows/wdcc-owner-board-rebuild-proof.yml'
      - '.github/support/wdcc-owner-board-rebuild-proof.mjs'
      - 'WDCC_LOCKED_CONTRACT.md'
      - 'app/**'
      - 'lib/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-locked-contract-${{ github.sha }}
  cancel-in-progress: false

env:
  EXPECTED_HERO_SIZE: '145504'
  EXPECTED_HERO_SHA256: 1d7a0e4fced7450f2bbc66443d44b1f35bd9e24a6366308362aafa65576d3eb2

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require canonical visual and functional contract
        shell: bash
        run: |
          set -euo pipefail
          test -s WDCC_LOCKED_CONTRACT.md
          test "$(wc -c < public/wdcc-hero-v2.webp | tr -d ' ')" = "$EXPECTED_HERO_SIZE"
          printf '%s  %s\n' "$EXPECTED_HERO_SHA256" public/wdcc-hero-v2.webp | sha256sum -c -
          test -s app/LockedIntro.tsx
          test -s app/WdccPublicChrome.tsx
          test -s app/wdcc-owner-logo/route.ts
          test -s app/wdcc-owner-board-final.css
          test -s app/wdcc-round-header-contract.css
          grep -Fq 'data-wdcc-intro-badge-art="owner-approved"' app/LockedIntro.tsx
          grep -Fq '/wdcc-hero-v2.webp' app/LockedIntro.tsx
          grep -Fq 'data-wdcc-logo-art="owner-approved"' app/WdccPublicChrome.tsx
          grep -Fq 'src="/wdcc-owner-logo"' app/WdccPublicChrome.tsx
          ! grep -Fq 'wdcc-wordmark' app/WdccPublicChrome.tsx
          grep -Fq 'X-WDCC-Logo' app/wdcc-owner-logo/route.ts
          grep -Fq 'wdcc-round-header-contract.css' app/layout.tsx
          last_wdcc_css="$(grep -o 'import"\./wdcc-[^"]*\.css"' app/layout.tsx | tail -1 | sed 's/^import"\.\///;s/"$//')"
          test "$last_wdcc_css" = 'wdcc-round-header-contract.css'
          grep -Fq 'large round owner-approved WDCC emblem' WDCC_LOCKED_CONTRACT.md
          grep -Fq 'mobile menu/call controls remain usable without overlap' WDCC_LOCKED_CONTRACT.md
          test -s app/WdccVehicleCard.tsx
          test -s app/WdccVehicleCard.module.css
          for page in app/inventory/page.tsx app/get-approved/page.tsx app/contact/page.tsx app/schedule-test-drive/page.tsx app/privacy/page.tsx app/terms/page.tsx 'app/vehicle/[id]/page.tsx'; do
            grep -Fq 'WdccPublicHeader' "$page"
            grep -Fq 'WdccPublicFooter' "$page"
          done
          grep -Fq 'Import Vehicles' app/dealer/inventory/import/page.tsx
          grep -Fq 'useSearchParams' app/dealer/inventory/VehicleEditor.tsx
          grep -Fq 'uploadVehiclePhoto' app/dealer/inventory/VehicleEditor.tsx
          grep -Fq 'method:"PATCH"' app/dealer/inventory/VehicleEditor.tsx
          grep -Fq 'Listing Readiness' app/dealer/inventory/VehicleEditor.tsx
          grep -Fq 'previewModal' app/dealer/inventory/VehicleEditor.tsx
          echo 'WDCC_LOCKED_CONTRACT_SOURCE=PASS'

      - name: Build exact application candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -s .next/BUILD_ID

      - name: Require Cloudflare preview credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Build exact Cloudflare worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets

      - name: Create isolated exact-SHA Worker config
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          cfg.name=`wdcc-lock-${process.env.GITHUB_SHA}`;
          cfg.workers_dev=true;
          cfg.preview_urls=true;
          delete cfg.route;
          delete cfg.routes;
          fs.writeFileSync('wrangler.locked-preview.jsonc',JSON.stringify(cfg,null,2)+'\n');
          NODE
          ! grep -qi 'wedontcarecars.com' wrangler.locked-preview.jsonc
          grep -Fq "$GITHUB_SHA" wrangler.locked-preview.jsonc

      - name: Deploy immutable isolated exact-SHA preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.locked-preview.jsonc 2>&1 | tee /tmp/wdcc-locked-preview.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wdcc-locked-preview.log | tail -1)"
          test -n "$url"
          case "$url" in *"$GITHUB_SHA"*) ;; *) echo "Locked preview is not exact SHA: $url" >&2; exit 1;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > preview-url.txt
          printf '%s\n' "$GITHUB_SHA" > preview-sha.txt

      - name: Smoke exact preview and immutable assets
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          code=000
          for i in $(seq 1 30); do
            code="$(curl --http1.1 -sS -L -o /tmp/home.html -w '%{http_code}' "$URL/?preview=$GITHUB_RUN_ID-$i" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          test "$code" = 200
          local_build="$(tr -d '\r\n' < .next/BUILD_ID)"
          grep -Fq "$local_build" /tmp/home.html
          grep -Fq 'data-wdcc-logo-art="owner-approved"' /tmp/home.html
          grep -Fq 'wdcc-hero-v2.webp' /tmp/home.html

          test "$(curl --http1.1 -sS -L -o /tmp/hero.webp -w '%{http_code}' "$URL/wdcc-hero-v2.webp?asset=$GITHUB_RUN_ID")" = 200
          test "$(wc -c < /tmp/hero.webp | tr -d ' ')" = "$EXPECTED_HERO_SIZE"
          printf '%s  %s\n' "$EXPECTED_HERO_SHA256" /tmp/hero.webp | sha256sum -c -

          test "$(curl --http1.1 -sS -D /tmp/owner-logo.headers -L -o /tmp/owner-logo.webp -w '%{http_code}' "$URL/wdcc-owner-logo?asset=$GITHUB_RUN_ID")" = 200
          test -s /tmp/owner-logo.webp
          grep -qi '^x-wdcc-logo: owner-approved' /tmp/owner-logo.headers

          inv="$(curl --http1.1 -sS -L -o /tmp/inventory.html -w '%{http_code}' "$URL/inventory?preview=$GITHUB_RUN_ID" || true)"
          test "$inv" = 200
          dealer="$(curl --http1.1 -sS -L -o /tmp/dealer.html -w '%{http_code}' "$URL/dealer?preview=$GITHUB_RUN_ID" || true)"
          test "$dealer" = 200

      - name: Require exact current head
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test -n "$current"
          test "$current" = "$GITHUB_SHA"

      - name: Publish locked-preview summary
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          echo '### WDCC locked contract Cloudflare preview' >> "$GITHUB_STEP_SUMMARY"
          echo "Exact SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Isolated Worker: ${URL:-not-created}" >> "$GITHUB_STEP_SUMMARY"
          echo 'No production route, alias or DNS change is authorized by this proof.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-locked-cloudflare-preview-${{ github.sha }}
          path: |
            preview-url.txt
            preview-sha.txt
          if-no-files-found: warn
          retention-days: 7
