name: WDCC Locked Contract Cloudflare Preview

on:
  push:
    branches: [fix/wdcc-locked-contract-20260826]
    paths:
      - '.github/workflows/wdcc-locked-contract-build.yml'
      - '.github/workflows/wdcc-recover-8ar-hero.yml'
      - 'scripts/wdcc-hydrate-8ar-hero.mjs'
      - 'app/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-locked-contract-cloudflare-preview
  cancel-in-progress: true

env:
  EXPECTED_HERO_SIZE: '145504'
  EXPECTED_HERO_SHA256: 1d7a0e4fced7450f2bbc66443d44b1f35bd9e24a6366308362aafa65576d3eb2

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Require canonical 8AR visual source
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < public/wdcc-hero-v2.webp | tr -d ' ')" = "$EXPECTED_HERO_SIZE"
          printf '%s  %s\n' "$EXPECTED_HERO_SHA256" public/wdcc-hero-v2.webp | sha256sum -c -
          grep -q 'import LockedIntro from "./LockedIntro"' app/ReferenceCloneHome.tsx
          test -s public/wdcc-official-logo.webp
          grep -q 'wdcc-official-logo.webp' app/LockedIntro.tsx
          grep -q 'wdcc-official-logo.webp' app/ReferenceCloneHome.tsx
          grep -q 'wdcc-official-logo.webp' app/mobile-visual-lock.css
          grep -q 'clip-path:circle' app/LockedIntro.tsx
          grep -q 'clip-path:circle' app/mobile-visual-lock.css

      - name: Build exact visual candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Verify locked visual/function routes
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<LockedIntro/>' app/ReferenceCloneHome.tsx
          grep -qi 'Get pre-approved' app/ReferenceCloneHome.tsx
          grep -qi 'Browse inventory' app/ReferenceCloneHome.tsx
          grep -q 'rh-hero-art' app/ReferenceCloneHome.tsx
          grep -q '/vehicle/' app/ReferenceCloneHome.tsx
          test -f 'app/vehicle/[id]/page.tsx'
          grep -q 'Import Vehicles' app/dealer/inventory/import/page.tsx
          grep -q 'Suspense' app/dealer/inventory/new/page.tsx
          grep -q 'useSearchParams' app/dealer/inventory/VehicleEditor.tsx
          grep -q 'handleUploadUrl:"/api/upload"' app/dealer/inventory/VehicleEditor.tsx
          grep -q 'method:"PATCH"' app/dealer/inventory/VehicleEditor.tsx
          echo 'LOCKED_CONTRACT_STATIC_GATE=PASS'

      - name: Require Cloudflare preview credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Build Cloudflare worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets

      - name: Create isolated workers.dev config
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const source=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          source.name='wdcc-locked-preview';
          source.workers_dev=true;
          source.preview_urls=true;
          delete source.route;
          delete source.routes;
          fs.writeFileSync('wrangler.locked-preview.jsonc',JSON.stringify(source,null,2)+'\n');
          NODE
          ! grep -q 'wedontcarecars.com' wrangler.locked-preview.jsonc || { echo 'Production route leaked into preview config' >&2; exit 1; }

      - name: Deploy Cloudflare preview only
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.locked-preview.jsonc 2>&1 | tee /tmp/wdcc-locked-preview.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wdcc-locked-preview.log | tail -1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > preview-url.txt

      - name: Smoke Cloudflare visual preview and exact asset bytes
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          code=000
          for i in $(seq 1 20); do
            code="$(curl -sS -L -o /tmp/home.html -w '%{http_code}' "$URL/?preview=$GITHUB_RUN_ID-$i" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          test "$code" = 200
          grep -qi "we don.t care" /tmp/home.html
          grep -q "wdcc-official-logo.webp" /tmp/home.html
          grep -q "wdcc-hero-v2.webp" /tmp/home.html

          test "$(curl -sS -L -o /tmp/hero.webp -w '%{http_code}' "$URL/wdcc-hero-v2.webp?asset=$GITHUB_RUN_ID")" = 200
          test "$(wc -c < /tmp/hero.webp | tr -d ' ')" = "$EXPECTED_HERO_SIZE"
          printf '%s  %s\n' "$EXPECTED_HERO_SHA256" /tmp/hero.webp | sha256sum -c -

          test "$(curl -sS -L -o /tmp/logo.webp -w '%{http_code}' "$URL/wdcc-official-logo.webp?asset=$GITHUB_RUN_ID")" = 200
          test -s /tmp/logo.webp

          test "$(curl -sS -L -o /tmp/fallback.webp -w '%{http_code}' "$URL/assets/cars/2004-nissan-350z-1.webp?asset=$GITHUB_RUN_ID")" = 200
          printf '%s  %s\n' "$EXPECTED_HERO_SHA256" /tmp/fallback.webp | sha256sum -c -

          test "$(curl -sS -L -o /tmp/inventory.json -w '%{http_code}' "$URL/api/inventory?preview=$GITHUB_RUN_ID")" = 200
          grep -qi 'items\|inventory' /tmp/inventory.json

          dealer="$(curl -sS -L -o /tmp/dealer.html -w '%{http_code}' "$URL/dealer?preview=$GITHUB_RUN_ID" || true)"
          test "$dealer" = 200
          grep -qi "dealer" /tmp/dealer.html
          {
            echo '### WDCC locked Cloudflare preview — PASS'
            echo
            echo "Preview: $URL"
            echo "Candidate SHA: $GITHUB_SHA"
            echo "Canonical 8AR hero SHA-256: $EXPECTED_HERO_SHA256"
            echo 'Canonical hero served by Worker: PASS.'
            echo 'Official round badge served by Worker: PASS.'
            echo 'Inventory media fallback: PASS.'
            echo 'Vehicle detail route contract: PASS.'
            echo 'Production routes, aliases and domains were not changed.'
            echo 'Owner visual approval is required before any production move.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: wdcc-locked-cloudflare-preview-url
          path: preview-url.txt
          retention-days: 7
