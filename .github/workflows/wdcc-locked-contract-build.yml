name: WDCC Locked Contract Cloudflare Preview

on:
  push:
    branches: [fix/wdcc-locked-contract-20260826]
    paths:
      - '.github/workflows/wdcc-locked-contract-build.yml'
      - 'app/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-locked-contract-cloudflare-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build exact visual candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Verify locked visual/function routes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'from "./components"' app/ReferenceCloneHome.tsx
          grep -q 'Get pre-approved' app/ReferenceCloneHome.tsx
          grep -q 'Browse inventory' app/ReferenceCloneHome.tsx
          grep -q 'Import Vehicles' app/dealer/inventory/import/page.tsx
          grep -q 'Suspense' app/dealer/inventory/new/page.tsx
          grep -q 'useSearchParams' app/dealer/inventory/VehicleEditor.tsx
          grep -q 'handleUploadUrl:"/api/upload"' app/dealer/inventory/VehicleEditor.tsx
          grep -q 'method:"PATCH"' app/dealer/inventory/VehicleEditor.tsx
          echo 'LOCKED_CONTRACT_STATIC_GATE=PASS'

      - name: Require Cloudflare preview credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Build Cloudflare worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets

      - name: Create isolated workers.dev config
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const source=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          source.name='wdcc-locked-preview';
          source.workers_dev=true;
          source.preview_urls=true;
          delete source.route;
          delete source.routes;
          fs.writeFileSync('wrangler.locked-preview.jsonc',JSON.stringify(source,null,2)+'\n');
          NODE
          ! grep -q 'wedontcarecars.com' wrangler.locked-preview.jsonc || { echo 'Production route leaked into preview config' >&2; exit 1; }

      - name: Deploy Cloudflare preview only
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.locked-preview.jsonc 2>&1 | tee /tmp/wdcc-locked-preview.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wdcc-locked-preview.log | tail -1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > preview-url.txt

      - name: Smoke Cloudflare visual preview
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          code=000
          for i in $(seq 1 20); do
            code="$(curl -sS -L -o /tmp/home.html -w '%{http_code}' "$URL/?preview=$GITHUB_RUN_ID-$i" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          test "$code" = 200
          grep -qi "we don.t care" /tmp/home.html
          grep -q "wdcc-logo-transparent.webp" /tmp/home.html
          grep -q "wdcc-hero-v2.webp" /tmp/home.html
          dealer="$(curl -sS -L -o /tmp/dealer.html -w '%{http_code}' "$URL/dealer?preview=$GITHUB_RUN_ID" || true)"
          test "$dealer" = 200
          grep -qi "dealer" /tmp/dealer.html
          {
            echo '### WDCC locked Cloudflare preview — PASS'
            echo
            echo "Preview: $URL"
            echo "Candidate SHA: $GITHUB_SHA"
            echo 'Production routes, aliases and domains were not changed.'
            echo 'Owner visual approval is required before any production move.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: wdcc-locked-cloudflare-preview-url
          path: preview-url.txt
          retention-days: 7
