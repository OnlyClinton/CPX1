name: WDCC 8AR Working Release
on:
  push:
    branches: [wdcc-release-8ar-working]
    paths-ignore:
      - 'release/WDCC-RELEASE-RESULT.txt'
  workflow_dispatch:

concurrency:
  group: wdcc-8ar-working-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  VERCEL_ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
  VERCEL_PROJECT_ID: prj_We7xkAkB5Qy31Pt17USSkQFE0u7h
  VERCEL_SCOPE: cpxagency

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wdcc-release-8ar-working
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies and verify source build
        run: |
          npm ci
          npm run build
      - name: Require Vercel credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo 'VERCEL_TOKEN repository secret is missing'; exit 78; }
      - name: Install pinned Vercel CLI and link canonical project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install --global vercel@59.3.0
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          vercel whoami --token="$VERCEL_TOKEN" >/dev/null
      - name: Build and deploy protected preview
        id: preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
          vercel build --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
          OUT="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE")"
          PREVIEW="$(printf '%s\n' "$OUT" | grep -Eo 'https://[^ ]+\.vercel\.app' | tail -1)"
          test -n "$PREVIEW"
          echo "url=$PREVIEW" >> "$GITHUB_OUTPUT"
          echo "PREVIEW=$PREVIEW"
      - name: Gate preview visual contract and persistence
        id: qa
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREVIEW: ${{ steps.preview.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          vercel curl "$PREVIEW/" > /tmp/home.html
          grep -q 'wdcc-official-logo.webp' /tmp/home.html
          grep -q "SCHEDULE A TEST DRIVE" /tmp/home.html
          grep -q "WE DON&apos;T CARE\|WE DON.T CARE" /tmp/home.html || grep -q "WE DON'T CARE" /tmp/home.html
          vercel curl "$PREVIEW/api/health" > /tmp/health-before.json
          node -e 'const j=require("/tmp/health-before.json"); if(!j.storage?.ok||j.leadRouting?.persistence!==true) process.exit(1)'
          BEFORE="$(node -e 'const j=require("/tmp/health-before.json"); process.stdout.write(String(j.storage.counts.leads||0))')"
          KEY="wdcc-release-${GITHUB_SHA}"
          vercel curl "$PREVIEW/api/leads" -- --request POST --header 'Content-Type: application/json' --header "Idempotency-Key: $KEY" --data "{\"kind\":\"contact\",\"name\":\"WDCC Release QA ${GITHUB_SHA::7}\",\"phone\":\"8135550199\",\"email\":\"release-qa@invalid.example\",\"message\":\"Automated 8AR working preview persistence gate\",\"consent\":true,\"source\":\"github-release-gate\"}" > /tmp/lead.json
          node -e 'const j=require("/tmp/lead.json"); if(!j.ok||j.persisted!==true||!j.item?.id) process.exit(1)'
          PREVIEW_LEAD="$(node -e 'const j=require("/tmp/lead.json"); process.stdout.write(j.item.id)')"
          vercel curl "$PREVIEW/api/health" > /tmp/health-after.json
          AFTER="$(node -e 'const j=require("/tmp/health-after.json"); process.stdout.write(String(j.storage.counts.leads||0))')"
          test "$AFTER" -ge "$BEFORE"
          echo "preview_lead=$PREVIEW_LEAD" >> "$GITHUB_OUTPUT"
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "after=$AFTER" >> "$GITHUB_OUTPUT"
      - name: Build production bundle and deploy
        id: prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel/output
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
          vercel build --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
          OUT="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE")"
          PROD="$(printf '%s\n' "$OUT" | grep -Eo 'https://[^ ]+\.vercel\.app' | tail -1)"
          test -n "$PROD"
          echo "url=$PROD" >> "$GITHUB_OUTPUT"
          echo "PRODUCTION=$PROD"
      - name: Verify live WDCC and persist live QA lead
        id: live
        shell: bash
        run: |
          set -euo pipefail
          for n in 1 2 3 4 5; do curl -fsS --retry 2 https://wedontcarecars.com/api/health -o /tmp/live-health.json && break || sleep 2; done
          node -e 'const j=require("/tmp/live-health.json"); if(!j.storage?.ok||j.leadRouting?.persistence!==true) process.exit(1)'
          curl -fsS --retry 2 https://wedontcarecars.com/ -o /tmp/live-home.html
          grep -q 'wdcc-official-logo.webp' /tmp/live-home.html
          LIVE_BEFORE="$(node -e 'const j=require("/tmp/live-health.json"); process.stdout.write(String(j.storage.counts.leads||0))')"
          curl -fsS -X POST https://wedontcarecars.com/api/leads -H 'Content-Type: application/json' -H "Idempotency-Key: wdcc-live-${GITHUB_SHA}" --data "{\"kind\":\"contact\",\"name\":\"WDCC Live Release QA ${GITHUB_SHA::7}\",\"phone\":\"8135550199\",\"email\":\"release-qa@invalid.example\",\"message\":\"Automated live persistence verification after 8AR working cutover\",\"consent\":true,\"source\":\"github-live-release-gate\"}" -o /tmp/live-lead.json
          node -e 'const j=require("/tmp/live-lead.json"); if(!j.ok||j.persisted!==true||!j.item?.id) process.exit(1)'
          LIVE_LEAD="$(node -e 'const j=require("/tmp/live-lead.json"); process.stdout.write(j.item.id)')"
          curl -fsS --retry 2 https://wedontcarecars.com/api/health -o /tmp/live-health-after.json
          LIVE_AFTER="$(node -e 'const j=require("/tmp/live-health-after.json"); process.stdout.write(String(j.storage.counts.leads||0))')"
          test "$LIVE_AFTER" -ge "$LIVE_BEFORE"
          echo "live_lead=$LIVE_LEAD" >> "$GITHUB_OUTPUT"
          echo "before=$LIVE_BEFORE" >> "$GITHUB_OUTPUT"
          echo "after=$LIVE_AFTER" >> "$GITHUB_OUTPUT"
      - name: Write release proof
        if: success()
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          PROD_URL: ${{ steps.prod.outputs.url }}
          PREVIEW_LEAD: ${{ steps.qa.outputs.preview_lead }}
          LIVE_LEAD: ${{ steps.live.outputs.live_lead }}
          PREVIEW_BEFORE: ${{ steps.qa.outputs.before }}
          PREVIEW_AFTER: ${{ steps.qa.outputs.after }}
          LIVE_BEFORE: ${{ steps.live.outputs.before }}
          LIVE_AFTER: ${{ steps.live.outputs.after }}
        shell: bash
        run: |
          mkdir -p release
          cat > release/WDCC-RELEASE-RESULT.txt <<EOF
          status=SUCCESS
          source_commit=$GITHUB_SHA
          source_branch=wdcc-release-8ar-working
          visual_contract=8AR-converged CPX1 source
          preview_url=$PREVIEW_URL
          production_deployment=$PROD_URL
          production_domain=https://wedontcarecars.com
          preview_lead_id=$PREVIEW_LEAD
          preview_lead_count_before=$PREVIEW_BEFORE
          preview_lead_count_after=$PREVIEW_AFTER
          live_lead_id=$LIVE_LEAD
          live_lead_count_before=$LIVE_BEFORE
          live_lead_count_after=$LIVE_AFTER
          completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add release/WDCC-RELEASE-RESULT.txt
          git commit -m 'Record successful WDCC 8AR working release'
          git push origin HEAD:wdcc-release-8ar-working
