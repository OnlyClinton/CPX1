name: WDCC CLOUDFLARE FRONTDOOR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/dealer/**'
      - 'app/api/auth/**'
      - 'lib/legacyAuthProxy.ts'
      - 'lib/dealerProxy.ts'
      - 'lib/wdccAuthority.ts'
      - '.github/workflows/wdcc-cloudflare-frontdoor.yml'

concurrency:
  group: wdcc-cloudflare-frontdoor
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  CANONICAL_BACKEND: https://wdcc-cpx-launch-cpxagency.vercel.app

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Prove frontend is provider-portable
        shell: bash
        run: |
          set -euo pipefail
          test -f wrangler.jsonc
          grep -q 'WDCC_RUNTIME_ROLE' lib/dealerRuntime.ts
          grep -q 'WDCC_DEALER_BACKEND_URL' lib/wdccAuthority.ts
          test -s public/wdcc-logo-transparent.webp
          test -s public/wdcc-hero-v2.webp
          npm ci
          npm run build
          echo 'WDCC_CLOUDFLARE_PREFLIGHT=PASS'

  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.verify.outputs.url }}
      deployed: ${{ steps.verify.outputs.deployed }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKERS_URL: ${{ secrets.CLOUDFLARE_WORKERS_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verify current Vercel backend before frontend deploy
        id: backend
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$CANONICAL_BACKEND/api/health?cloudflare-frontdoor=$GITHUB_RUN_ID" -o /tmp/backend-health.json
          jq -e '.ok == true' /tmp/backend-health.json >/dev/null
          curl -fsS -D /tmp/backend-inventory.headers -o /tmp/backend-inventory.json "$CANONICAL_BACKEND/api/inventory?cloudflare-frontdoor=$GITHUB_RUN_ID"
          content_type="$(tr -d '\r' </tmp/backend-inventory.headers | awk -F': ' 'tolower($1)=="content-type"{print tolower($2)}' | tail -1)"
          case "$content_type" in application/json*) ;; *) echo "Canonical inventory endpoint is not JSON: $content_type" >&2; exit 1;; esac
          jq -e '.ok == true and (.items | type == "array")' /tmp/backend-inventory.json >/dev/null
          echo 'BACKEND_GATE=PASS'

      - name: Check Cloudflare authorization
        id: creds
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            printf 'Cloudflare deployment staged; missing GitHub secrets: %s\n' "${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Install Cloudflare Next.js adapter
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@latest wrangler@latest
          cat > open-next.config.ts <<'EOF'
          import { defineCloudflareConfig } from "@opennextjs/cloudflare";
          export default defineCloudflareConfig();
          EOF

      - name: Bind frontend to canonical Vercel backend
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const path='wrangler.jsonc';
          const cfg=JSON.parse(fs.readFileSync(path,'utf8'));
          cfg.vars=cfg.vars||{};
          cfg.vars.WDCC_RUNTIME_ROLE='frontend';
          cfg.vars.WDCC_DEALER_BACKEND_URL=process.env.CANONICAL_BACKEND;
          fs.writeFileSync(path,JSON.stringify(cfg,null,2)+'\n');
          NODE

      - name: Build Cloudflare Worker
        if: steps.creds.outputs.ready == 'true'
        run: npx opennextjs-cloudflare build

      - name: Deploy Cloudflare Worker
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/cloudflare-deploy.log

      - name: Verify deployed Cloudflare frontend
        if: steps.creds.outputs.ready == 'true'
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          URL="${CLOUDFLARE_WORKERS_URL:-}"
          if [ -z "$URL" ]; then
            URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/cloudflare-deploy.log | tail -1 || true)"
          fi
          URL="${URL%/}"
          [ -n "$URL" ] || { echo 'Cloudflare deployed but URL could not be resolved' >&2; exit 1; }
          echo "VERIFY_URL=$URL"
          ready=false
          for attempt in $(seq 1 30); do
            status="$(curl -sS -o /tmp/cf-health.json -w '%{http_code}' "$URL/api/health?cloudflare-frontdoor=$GITHUB_RUN_ID&attempt=$attempt" || true)"
            if [ "$status" = "200" ] && jq -e '.ok == true and .backend == "healthy"' /tmp/cf-health.json >/dev/null 2>&1; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          curl -fsS -D /tmp/cf-inventory.headers -o /tmp/cf-inventory.json "$URL/api/inventory?cloudflare-frontdoor=$GITHUB_RUN_ID"
          jq -e '.ok == true and (.items | type == "array")' /tmp/cf-inventory.json >/dev/null
          home_status="$(curl -sS -o /tmp/home.html -w '%{http_code}' "$URL/")"
          test "$home_status" = 200
          for path in /dealer /dealer/inventory /dealer/inventory/new /dealer/leads; do
            out="/tmp/wdcc$(echo "$path" | tr '/' '_').html"
            code="$(curl -sS -o "$out" -w '%{http_code}' "$URL$path")"
            test "$code" = 200 || { echo "$path returned HTTP $code" >&2; exit 1; }
          done
          grep -Eq 'Dealer Sign In|DEALER PORTAL|Dashboard' /tmp/wdcc_dealer.html
          grep -Eq 'All Vehicles|Manage your dealership inventory' /tmp/wdcc_dealer_inventory.html
          grep -Eq 'Add / Edit Vehicle|Listing Readiness|Publish / Submit' /tmp/wdcc_dealer_inventory_new.html
          grep -Eq 'Leads|Track and manage every customer opportunity' /tmp/wdcc_dealer_leads.html
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo 'deployed=true' >> "$GITHUB_OUTPUT"
          echo "Dealer login: $URL/dealer" >> "$GITHUB_STEP_SUMMARY"
          echo "Dealer dashboard: $URL/dealer" >> "$GITHUB_STEP_SUMMARY"
          echo "Vehicle inventory: $URL/dealer/inventory" >> "$GITHUB_STEP_SUMMARY"
          echo "Vehicle upload: $URL/dealer/inventory/new" >> "$GITHUB_STEP_SUMMARY"

  status:
    needs: [preflight, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Front-door status
        env:
          DEPLOYED: ${{ needs.deploy.outputs.deployed }}
          URL: ${{ needs.deploy.outputs.url }}
        run: |
          echo "Cloudflare deployed: ${DEPLOYED:-false}" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare URL: ${URL:-not-created}" >> "$GITHUB_STEP_SUMMARY"
          echo "Customer domain cutover is intentionally manual. Exact 2vfD remains locked on Vercel." >> "$GITHUB_STEP_SUMMARY"
