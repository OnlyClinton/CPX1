name: WDCC Dealer KPI Preview

on:
  push:
    branches:
      - fix/dealer-kpi-drilldowns-thumbnails
    paths:
      - 'app/dealer/page.tsx'
      - 'app/dealer/leads/page.tsx'
      - 'app/dealer/inventory/page.tsx'
      - '.github/workflows/wdcc-dealer-kpi-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wdcc-dealer-kpi-preview
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
  VERCEL_PROJECT_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Require Vercel credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: test -n "$VERCEL_TOKEN"
      - name: Install Vercel CLI
        run: npm install --global vercel@59.3.0
      - name: Link dealer origin project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
      - name: Pull preview environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" --scope=cpxagency
      - name: Build preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --token="$VERCEL_TOKEN" --scope=cpxagency
      - name: Deploy preview and capture result
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set +e
          mkdir -p ops/qa
          vercel deploy --prebuilt --token="$VERCEL_TOKEN" --scope=cpxagency > ops/qa/dealer-kpi-vercel-deploy.log 2>&1
          CODE=$?
          cat ops/qa/dealer-kpi-vercel-deploy.log
          URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.vercel\.app' ops/qa/dealer-kpi-vercel-deploy.log | tail -1 || true)"
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          if [ -n "$URL" ]; then echo "WDCC_DEALER_KPI_PREVIEW=$URL"; fi
          exit 0
      - name: Persist deploy diagnostic on failure
        if: steps.deploy.outputs.exit_code != '0'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/qa/dealer-kpi-vercel-deploy.log
          git commit -m 'Record dealer KPI preview deploy failure' || exit 0
          git push origin HEAD:fix/dealer-kpi-drilldowns-thumbnails
      - name: Require preview deployment
        shell: bash
        run: |
          test "${{ steps.deploy.outputs.exit_code }}" = "0"
          test -n "${{ steps.deploy.outputs.url }}"
