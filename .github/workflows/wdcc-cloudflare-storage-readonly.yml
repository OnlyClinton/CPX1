name: WDCC Cloudflare Storage Readonly

on:
  push:
    branches: [ops/wdcc-blob-recovery-20260827]
    paths:
      - '.github/workflows/wdcc-cloudflare-storage-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Wrangler
        run: npm install --global wrangler@4.90.0 >/dev/null
      - name: Read-only storage inventory
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          {
            echo '=== D1 ==='
            wrangler d1 list --json || true
            echo '=== R2 ==='
            wrangler r2 bucket list || true
            echo '=== KV ==='
            wrangler kv namespace list || true
          } | tee cloudflare-storage.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wdcc-cloudflare-storage-readonly-${{ github.sha }}
          path: cloudflare-storage.txt
          retention-days: 3
