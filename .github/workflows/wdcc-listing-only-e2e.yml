name: WDCC Listing Only Live E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-listing-only-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wdcc-listing-only-live-e2e
  cancel-in-progress: true

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM: cpxagency
      ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      PHOENIX_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
      DEALER: https://dealer.wedontcarecars.com
      STOREFRONT: https://wedontcarecars.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install acceptance dependencies
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --global vercel@59.3.0 >/dev/null
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$PHOENIX_ID" > .vercel/project.json

      - name: Create exact-run dealer identity via Phoenix OIDC
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          export RUN_TAG="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > .wdcc-listing-user.mjs <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import {get,head,put,BlobPreconditionFailedError} from '@vercel/blob';
          const path='private/state/platform-v3.json',run=process.env.RUN_TAG;
          async function stable(){for(let i=0;i<5;i++){const a=await head(path);const r=await get(path,{access:'private',useCache:false});if(!r||r.statusCode!==200||!r.stream)throw Error('STATE_READ_FAILED');const chunks=[];for await(const x of r.stream)chunks.push(x);const raw=Buffer.concat(chunks),b=await head(path);if(a.etag===b.etag)return{raw,etag:b.etag,state:JSON.parse(raw.toString('utf8'))}}throw Error('STATE_TOO_HOT')}
          for(let attempt=1;attempt<=4;attempt++){
            const before=await stable(),s=before.state,now=new Date().toISOString();
            const password=`WdccListing-${crypto.randomBytes(18).toString('base64url')}!`,salt=crypto.randomBytes(24),digest=crypto.scryptSync(password,salt,64),passwordHash=`scrypt$${salt.toString('base64url')}$${digest.toString('base64url')}`;
            const dealerId=`listing-dealer-${crypto.randomUUID()}`,email=`listing-${run}@invalid.example`;
            s.users=Array.isArray(s.users)?s.users:[];s.audit=Array.isArray(s.audit)?s.audit:[];
            s.users.push({id:dealerId,email,username:email,displayName:`WDCC Listing Verification ${run}`,role:'dealer_agent',tenantId:'wdcc',status:'active',disabled:false,passwordHash});
            const backup=`private/state/backups/platform-v3-pre-listing-r${Number(s.revision||0)}-${crypto.randomUUID()}.json`;
            await put(backup,before.raw,{access:'private',addRandomSuffix:false,allowOverwrite:false,contentType:'application/json'});
            s.audit.push({id:crypto.randomUUID(),at:now,action:'qa.listing_only.user_create',actor:'github-actions',run,dealerId,backup});s.revision=Number(s.revision||0)+1;s.updatedAt=now;
            try{await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:before.etag});fs.writeFileSync('/tmp/listing.env',`RUN_TAG=${run}\nQA_PASSWORD=${password}\nDEALER_ID=${dealerId}\nDEALER_EMAIL=${email}\nSTOCK=PUBVERIFY-${run}\n`);console.log(JSON.stringify({ok:true,run,dealerId,backup}));process.exit(0)}catch(e){if(e instanceof BlobPreconditionFailedError&&attempt<4)continue;throw e}
          }
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- node .wdcc-listing-user.mjs
          set -a; . /tmp/listing.env; set +a
          printf '::add-mask::%s\n' "$QA_PASSWORD"

      - name: Prove real dealer login and session
        id: login
        shell: bash
        run: |
          set -euo pipefail
          set -a; . /tmp/listing.env; set +a
          printf '::add-mask::%s\n' "$QA_PASSWORD"
          payload="$(jq -nc --arg e "$DEALER_EMAIL" --arg p "$QA_PASSWORD" '{email:$e,password:$p}')"
          code="$(curl -sS -c /tmp/dealer.cookies -o /tmp/login.json -w '%{http_code}' -H "Origin: $DEALER" -H 'content-type: application/json' -X POST "$DEALER/api/auth/login" --data "$payload")"
          test "$code" = 200
          session="$(curl -sS -b /tmp/dealer.cookies -o /tmp/session.json -w '%{http_code}' "$DEALER/api/auth/session")"
          test "$session" = 200
          jq -e '.authenticated==true and ((.user.role|ascii_downcase)=="dealer_agent")' /tmp/session.json >/dev/null
          echo "login_http=$code" >> "$GITHUB_OUTPUT"
          echo "session_http=$session" >> "$GITHUB_OUTPUT"

      - name: Prove browser login add photo publish and public visibility
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          set -a; . /tmp/listing.env; set +a
          printf '::add-mask::%s\n' "$QA_PASSWORD"
          node <<'NODE'
          const fs=require('fs');const{chromium}=require('playwright');
          (async()=>{const run=process.env.RUN_TAG,dealer=process.env.DEALER,store=process.env.STOREFRONT,stock=process.env.STOCK;
          fs.writeFileSync('/tmp/listing.png',Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9WlV1GQAAAAASUVORK5CYII=','base64'));
          const b=await chromium.launch({headless:true});const c=await b.newContext({viewport:{width:390,height:844}});const p=await c.newPage();
          await p.goto(`${dealer}/dealer/login`,{waitUntil:'networkidle'});await p.getByPlaceholder(/email or username/i).fill(process.env.DEALER_EMAIL);await p.getByPlaceholder('Password').fill(process.env.QA_PASSWORD);await p.getByRole('button',{name:'SIGN IN'}).click();await p.waitForURL(/\/dealer(?:$|\?)/,{timeout:30000});
          const sr=await c.request.get(`${dealer}/api/auth/session`);if(!sr.ok())throw Error(`BROWSER_SESSION_${sr.status()}`);const sj=await sr.json();if(!sj.authenticated||String(sj?.user?.role||'').toLowerCase()!=='dealer_agent')throw Error('BROWSER_SESSION_NOT_DEALER');
          await p.goto(`${dealer}/dealer/inventory/new`,{waitUntil:'networkidle'});if(p.url().includes('/login'))throw Error('SESSION_REDIRECTED_TO_LOGIN');
          await p.getByLabel('Year').fill('2019');await p.getByLabel('Make').fill('Toyota');await p.getByLabel('Model').fill('Corolla');await p.getByLabel('Trim').fill(`Listing Verification ${run}`);await p.getByLabel('Cash Price').fill('12345');await p.getByLabel('Estimated Down Payment').fill('1500');await p.getByLabel('Mileage').fill('54321');await p.getByLabel('Stock #').fill(stock);await p.getByLabel('Description').fill(`Temporary publication verification record ${run}. Remove after verification.`);await p.locator('input[type=file][multiple]').first().setInputFiles('/tmp/listing.png');
          await p.getByRole('button',{name:'PUBLISH VEHICLE'}).click();await p.waitForURL(/\/dealer\?saved=published/,{timeout:60000});
          const ir=await c.request.get(`${dealer}/api/inventory`);if(!ir.ok())throw Error(`DEALER_INVENTORY_${ir.status()}`);const ij=await ir.json(),item=(ij.items||[]).find(v=>v.stock===stock);if(!item)throw Error('PUBLISHED_VEHICLE_NOT_IN_DEALER_INVENTORY');if(!(item.photoPathnames||[]).length)throw Error('PUBLISHED_VEHICLE_PHOTO_MISSING');
          const pr=await c.request.get(`${store}/api/inventory?listing_verify=${Date.now()}`);if(!pr.ok())throw Error(`PUBLIC_INVENTORY_${pr.status()}`);const pj=await pr.json();if(!(pj.items||[]).some(v=>v.id===item.id||v.stock===stock))throw Error('PUBLISHED_VEHICLE_NOT_VISIBLE_ON_STOREFRONT');
          const hide=await c.request.patch(`${dealer}/api/inventory/${encodeURIComponent(item.id)}`,{headers:{'content-type':'application/json'},data:{status:'draft',stock:`R36TEST-${stock}`}});if(!hide.ok())throw Error(`QA_HIDE_FAILED_${hide.status()}`);
          fs.writeFileSync('/tmp/listing-result.json',JSON.stringify({ok:true,id:item.id,photoPathnames:item.photoPathnames||[],photoCount:(item.photoPathnames||[]).length,publicVisible:true,stock},null,2));await b.close()})().catch(e=>{fs.writeFileSync('/tmp/listing-result.json',JSON.stringify({ok:false,error:String(e.message||e)},null,2));console.error(e);process.exit(1)})
          NODE
          cat /tmp/listing-result.json
          echo "vehicle_id=$(jq -r '.id // ""' /tmp/listing-result.json)" >> "$GITHUB_OUTPUT"
          echo "photo_count=$(jq -r '.photoCount // 0' /tmp/listing-result.json)" >> "$GITHUB_OUTPUT"
          echo "public_visible=$(jq -r '.publicVisible // false' /tmp/listing-result.json)" >> "$GITHUB_OUTPUT"

      - name: Cleanup only exact-run identity vehicle and media
        id: cleanup
        if: always() && steps.identity.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          set -a; . /tmp/listing.env; set +a
          cat > .wdcc-listing-cleanup.mjs <<'NODE'
          import crypto from 'node:crypto';import {get,head,put,del,BlobPreconditionFailedError} from '@vercel/blob';
          const path='private/state/platform-v3.json',run=process.env.RUN_TAG,dealerId=process.env.DEALER_ID,stock=process.env.STOCK;
          async function stable(){for(let i=0;i<5;i++){const a=await head(path);const r=await get(path,{access:'private',useCache:false});if(!r||r.statusCode!==200||!r.stream)throw Error('STATE_READ_FAILED');const chunks=[];for await(const x of r.stream)chunks.push(x);const raw=Buffer.concat(chunks),b=await head(path);if(a.etag===b.etag)return{raw,etag:b.etag,state:JSON.parse(raw.toString('utf8'))}}throw Error('STATE_TOO_HOT')}
          for(let attempt=1;attempt<=4;attempt++){
            const before=await stable(),s=before.state,vehicles=Array.isArray(s.vehicles)?s.vehicles:[],users=Array.isArray(s.users)?s.users:[];
            const exact=vehicles.filter(v=>String(v.stock||'')===stock||String(v.stock||'')===`R36TEST-${stock}`);const media=[...new Set(exact.flatMap(v=>Array.isArray(v.photoPathnames)?v.photoPathnames:[]).filter(Boolean))];
            s.vehicles=vehicles.filter(v=>!exact.some(x=>x.id===v.id));s.users=users.filter(u=>u.id!==dealerId);s.audit=Array.isArray(s.audit)?s.audit:[];s.audit.push({id:crypto.randomUUID(),at:new Date().toISOString(),action:'qa.listing_only.cleanup',actor:'github-actions',run,dealerId,vehicleIds:exact.map(v=>v.id),media});s.revision=Number(s.revision||0)+1;s.updatedAt=new Date().toISOString();
            try{await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:before.etag});if(media.length)await del(media);console.log(JSON.stringify({ok:true,removedUsers:users.length-s.users.length,removedVehicles:exact.length,removedMedia:media.length}));process.exit(0)}catch(e){if(e instanceof BlobPreconditionFailedError&&attempt<4)continue;throw e}
          }
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- node .wdcc-listing-cleanup.mjs | tee /tmp/cleanup.log
          grep -q '"ok":true' /tmp/cleanup.log

      - name: Report listing-only acceptance
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          LOGIN: ${{ steps.login.outcome }}
          LOGIN_HTTP: ${{ steps.login.outputs.login_http }}
          SESSION_HTTP: ${{ steps.login.outputs.session_http }}
          BROWSER: ${{ steps.browser.outcome }}
          VEHICLE: ${{ steps.browser.outputs.vehicle_id }}
          PHOTOS: ${{ steps.browser.outputs.photo_count }}
          PUBLIC: ${{ steps.browser.outputs.public_visible }}
          CLEANUP: ${{ steps.cleanup.outcome }}
        shell: bash
        run: |
          err=''
          [ -f /tmp/listing-result.json ] && err="$(jq -r '.error // ""' /tmp/listing-result.json)"
          body=$(printf 'Status: **%s**\nReal dealer login: `%s` HTTP `%s` session `%s`\nDealer UI listing flow: `%s`\nVehicle: `%s`\nPhotos: `%s`\nPublic visible before exact-run cleanup: `%s`\nCleanup: `%s`\nError: `%s`' "$STATUS" "$LOGIN" "$LOGIN_HTTP" "$SESSION_HTTP" "$BROWSER" "$VEHICLE" "$PHOTOS" "$PUBLIC" "$CLEANUP" "$err")
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC listing-only live acceptance ${GITHUB_RUN_ID}" --body "$body" || true
