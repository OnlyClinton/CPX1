name: WDCC Listing Only Live E2E

on:
  push:
    branches: [main]
    paths: ['.github/workflows/wdcc-listing-only-e2e.yml']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wdcc-listing-only-live-e2e
  cancel-in-progress: true

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM: cpxagency
      ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      PHOENIX_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
      DEALER: https://dealer.wedontcarecars.com
      STOREFRONT: https://wedontcarecars.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install test dependencies
        run: |
          set -euo pipefail
          npm ci
          npm install --global vercel@59.3.0 >/dev/null
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$PHOENIX_ID" > .vercel/project.json
      - name: Create disposable dealer identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          export RUN_TAG="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > .wdcc-identity.mjs <<'NODE'
          import crypto from 'node:crypto';import fs from 'node:fs';import {get,head,put,BlobPreconditionFailedError} from '@vercel/blob';
          const path='private/state/platform-v3.json',run=process.env.RUN_TAG;
          async function stable(){for(let i=0;i<5;i++){const a=await head(path),r=await get(path,{access:'private',useCache:false});if(!r?.stream)throw Error('STATE_READ_FAILED');const c=[];for await(const x of r.stream)c.push(x);const b=await head(path);if(a.etag===b.etag)return{etag:b.etag,state:JSON.parse(Buffer.concat(c).toString())}}throw Error('STATE_TOO_HOT')}
          for(let attempt=1;attempt<=4;attempt++){const before=await stable(),s=before.state,now=new Date().toISOString(),password=`WdccListing-${crypto.randomBytes(18).toString('base64url')}!`,salt=crypto.randomBytes(24),digest=crypto.scryptSync(password,salt,64),passwordHash=`scrypt$${salt.toString('base64url')}$${digest.toString('base64url')}`,dealerId=`listing-dealer-${crypto.randomUUID()}`,email=`listing-${run}@invalid.example`;s.users=Array.isArray(s.users)?s.users:[];s.users.push({id:dealerId,email,username:email,displayName:`WDCC Listing Verification ${run}`,role:'dealer_agent',tenantId:'wdcc',status:'active',disabled:false,passwordHash});s.revision=Number(s.revision||0)+1;s.updatedAt=now;try{await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:before.etag});fs.writeFileSync('/tmp/listing.env',`RUN_TAG=${run}\nQA_PASSWORD=${password}\nDEALER_ID=${dealerId}\nDEALER_EMAIL=${email}\nSTOCK=PUBVERIFY-${run}\n`);console.log(JSON.stringify({ok:true,dealerId}));process.exit(0)}catch(e){if(e instanceof BlobPreconditionFailedError&&attempt<4)continue;throw e}}
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- node .wdcc-identity.mjs
          set -a; . /tmp/listing.env; set +a
          printf '::add-mask::%s\n' "$QA_PASSWORD"
      - name: Capture exact upload response
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          set -a; . /tmp/listing.env; set +a
          printf '::add-mask::%s\n' "$QA_PASSWORD"
          node <<'NODE'
          const fs=require('fs');const{chromium}=require('playwright');
          (async()=>{const dealer=process.env.DEALER,run=process.env.RUN_TAG,stock=process.env.STOCK;fs.writeFileSync('/tmp/listing.png',Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9WlV1GQAAAAASUVORK5CYII=','base64'));const b=await chromium.launch({headless:true}),c=await b.newContext({viewport:{width:390,height:844}}),p=await c.newPage();await p.goto(`${dealer}/dealer/login`,{waitUntil:'networkidle'});await p.locator('input[autocomplete="username"]').first().fill(process.env.DEALER_EMAIL);await p.locator('input[autocomplete="current-password"]').first().fill(process.env.QA_PASSWORD);await p.getByRole('button',{name:'SIGN IN'}).click();await p.waitForURL(/\/dealer(?:$|\?)/,{timeout:30000});await p.goto(`${dealer}/dealer/inventory/new`,{waitUntil:'networkidle'});async function fill(name,value){const x=p.locator(`input[name="${name}"],textarea[name="${name}"]`).first();if(!await x.count())throw Error(`FIELD_${name}_MISSING`);await x.fill(value,{force:true})}await fill('year','2019');await fill('make','Toyota');await fill('model','Corolla');await fill('trim',`Upload Probe ${run}`);await fill('price','12345');await fill('downPayment','1500');await fill('mileage','54321');await fill('stock',stock);await fill('description',`Temporary upload probe ${run}`);await p.locator('input[type=file][multiple]').first().setInputFiles('/tmp/listing.png');const uploadResponse=p.waitForResponse(r=>r.url().includes('/api/upload')&&r.request().method()==='POST',{timeout:30000});await p.getByRole('button',{name:/publish/i}).last().click();const response=await uploadResponse;const body=await response.text().catch(()=> '');console.log('UPLOAD_DIAGNOSTIC='+JSON.stringify({status:response.status(),body}));fs.writeFileSync('/tmp/upload.json',JSON.stringify({status:response.status(),body},null,2));if(!response.ok())throw Error(`UPLOAD_HTTP_${response.status()}_${body}`);await b.close()})().catch(e=>{console.error(e);process.exit(1)})
          NODE
      - name: Cleanup disposable records
        if: always() && steps.identity.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          set -a; . /tmp/listing.env; set +a
          cat > .wdcc-cleanup.mjs <<'NODE'
          import {get,head,put,del,BlobPreconditionFailedError} from '@vercel/blob';
          const path='private/state/platform-v3.json',dealerId=process.env.DEALER_ID,stock=process.env.STOCK;
          async function stable(){for(let i=0;i<5;i++){const a=await head(path),r=await get(path,{access:'private',useCache:false});if(!r?.stream)throw Error('STATE_READ_FAILED');const c=[];for await(const x of r.stream)c.push(x);const b=await head(path);if(a.etag===b.etag)return{etag:b.etag,state:JSON.parse(Buffer.concat(c).toString())}}throw Error('STATE_TOO_HOT')}
          for(let attempt=1;attempt<=4;attempt++){const before=await stable(),s=before.state,vehicles=Array.isArray(s.vehicles)?s.vehicles:[],users=Array.isArray(s.users)?s.users:[],exact=vehicles.filter(v=>String(v.stock||'')===stock||String(v.stock||'')===`R36TEST-${stock}`),media=[...new Set(exact.flatMap(v=>Array.isArray(v.photoPathnames)?v.photoPathnames:[]).filter(Boolean))];s.vehicles=vehicles.filter(v=>!exact.some(x=>x.id===v.id));s.users=users.filter(u=>u.id!==dealerId);s.revision=Number(s.revision||0)+1;s.updatedAt=new Date().toISOString();try{await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:before.etag});if(media.length)await del(media);console.log(JSON.stringify({ok:true,removedUsers:users.length-s.users.length,removedVehicles:exact.length,removedMedia:media.length}));process.exit(0)}catch(e){if(e instanceof BlobPreconditionFailedError&&attempt<4)continue;throw e}}
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- node .wdcc-cleanup.mjs
      - name: Report diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body='No upload body captured.'
          [ -f /tmp/upload.json ] && body="$(cat /tmp/upload.json)"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC upload diagnostic ${GITHUB_RUN_ID}" --body "\`\`\`json\n${body}\n\`\`\`" || true
