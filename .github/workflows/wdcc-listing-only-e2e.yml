name: WDCC Listing Only Live E2E

on:
  push:
    branches: [main]
    paths: ['.github/workflows/wdcc-listing-only-e2e.yml']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wdcc-listing-only-live-e2e
  cancel-in-progress: true

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM: cpxagency
      ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      PHOENIX_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
      DEALER: https://dealer.wedontcarecars.com
      STOREFRONT: https://wedontcarecars.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install isolated proof tooling
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --global vercel@59.5.0 >/dev/null
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$PHOENIX_ID" > .vercel/project.json

      - name: Create disposable dealer identity with backup
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          export RUN_TAG="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > .wdcc-identity.mjs <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import {get,head,put,BlobPreconditionFailedError} from '@vercel/blob';

          const path='private/state/platform-v3.json';
          const run=process.env.RUN_TAG;

          async function stable(){
            for(let i=0;i<5;i++){
              const a=await head(path);
              const r=await get(path,{access:'private',useCache:false});
              if(!r?.stream) throw Error('STATE_READ_FAILED');
              const chunks=[];
              for await(const x of r.stream) chunks.push(x);
              const raw=Buffer.concat(chunks);
              const b=await head(path);
              if(a.etag===b.etag) return {raw,etag:b.etag,state:JSON.parse(raw.toString())};
            }
            throw Error('STATE_TOO_HOT');
          }

          for(let attempt=1;attempt<=4;attempt++){
            const before=await stable();
            const s=before.state;
            const now=new Date().toISOString();
            const password=`WdccListing-${crypto.randomBytes(18).toString('base64url')}!`;
            const salt=crypto.randomBytes(24);
            const digest=crypto.scryptSync(password,salt,64);
            const passwordHash=`scrypt$${salt.toString('base64url')}$${digest.toString('base64url')}`;
            const dealerId=`listing-dealer-${crypto.randomUUID()}`;
            const email=`listing-${run}@invalid.example`;
            const stock=`R36TEST-PUBVERIFY-${run}`;
            const backup=`private/state/backups/platform-v3-pre-listing-${run}-r${Number(s.revision||0)}-${crypto.randomUUID()}.json`;

            await put(backup,before.raw,{access:'private',addRandomSuffix:false,allowOverwrite:false,contentType:'application/json'});
            s.users=Array.isArray(s.users)?s.users:[];
            s.users.push({id:dealerId,email,username:email,displayName:`WDCC Listing Verification ${run}`,role:'dealer_agent',tenantId:'wdcc',status:'active',disabled:false,passwordHash});
            s.revision=Number(s.revision||0)+1;
            s.updatedAt=now;

            try{
              await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:before.etag});
              fs.writeFileSync('/tmp/listing.env',`RUN_TAG=${run}\nQA_PASSWORD=${password}\nDEALER_ID=${dealerId}\nDEALER_EMAIL=${email}\nSTOCK=${stock}\nBACKUP=${backup}\n`);
              console.log(JSON.stringify({ok:true,dealerId,stock,backup}));
              process.exit(0);
            }catch(e){
              if(e instanceof BlobPreconditionFailedError && attempt<4) continue;
              throw e;
            }
          }
          NODE

          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- node .wdcc-identity.mjs
          set -a; . /tmp/listing.env; set +a
          printf '::add-mask::%s\n' "$QA_PASSWORD"

      - name: Prove live draft upload publish readback and QA isolation
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          set -a; . /tmp/listing.env; set +a
          printf '::add-mask::%s\n' "$QA_PASSWORD"

          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');

          const cleanUrl=u=>{try{const x=new URL(u);return x.pathname+x.search}catch{return u}};
          async function bodyOf(r){try{return (await r.text()).slice(0,3000)}catch{return ''}}

          (async()=>{
            const dealer=process.env.DEALER;
            const store=process.env.STOREFRONT;
            const run=process.env.RUN_TAG;
            const stock=process.env.STOCK;
            fs.writeFileSync('/tmp/listing.png',Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9WlV1GQAAAAASUVORK5CYII=','base64'));

            const result={ok:false,run,stock,stages:{},trace:[]};
            const browser=await chromium.launch({headless:true});

            try{
              const context=await browser.newContext({viewport:{width:390,height:844}});
              const page=await context.newPage();

              page.on('request',r=>{
                if(/\/api\/(?:upload|inventory)/.test(r.url())) result.trace.push({event:'request',method:r.method(),url:cleanUrl(r.url())});
              });
              page.on('response',r=>{
                if(/\/api\/(?:upload|inventory)/.test(r.url())) result.trace.push({event:'response',method:r.request().method(),url:cleanUrl(r.url()),status:r.status()});
              });
              page.on('requestfailed',r=>{
                if(/\/api\/(?:upload|inventory)/.test(r.url())) result.trace.push({event:'failed',method:r.method(),url:cleanUrl(r.url()),failure:r.failure()?.errorText||''});
              });

              await page.goto(`${dealer}/dealer/login`,{waitUntil:'domcontentloaded',timeout:30000});
              const username=page.locator('input[autocomplete="username"]').first();
              const password=page.locator('input[autocomplete="current-password"]').first();
              await username.waitFor({state:'visible',timeout:20000});
              await password.waitFor({state:'visible',timeout:20000});
              await username.fill(process.env.DEALER_EMAIL);
              await password.fill(process.env.QA_PASSWORD);
              await page.getByRole('button',{name:'SIGN IN'}).click();
              await page.waitForURL(/\/dealer(?:$|\?)/,{timeout:30000});

              const session=await page.evaluate(async()=>{
                const r=await fetch('/api/auth/session',{cache:'no-store',credentials:'include'});
                return {status:r.status,body:await r.text()};
              });
              result.stages.login={ok:true,url:page.url(),sessionStatus:session.status};
              if(session.status!==200 || !JSON.parse(session.body).authenticated) throw Error(`SESSION_NOT_AUTHENTICATED_${session.status}_${session.body}`);

              await page.goto(`${dealer}/dealer/inventory/new`,{waitUntil:'domcontentloaded',timeout:30000});

              async function fill(name,value){
                let x=page.locator(`input[name="${name}"]`).first();
                if(name==='description') x=page.locator('label.description textarea, textarea').first();
                await x.waitFor({state:'visible',timeout:20000});
                await x.fill(value,{force:true});
              }

              await fill('year','2019');
              await fill('make','Toyota');
              await fill('model','Corolla');
              await fill('trim',`Upload Probe ${run}`);
              await fill('price','12345');
              await fill('downPayment','1500');
              await fill('mileage','54321');
              await fill('stock',stock);
              await fill('description',`Temporary QA-isolated upload probe ${run}`);
              result.stages.form={ok:true,descriptionSelector:'label.description textarea, textarea'};

              const fileInput=page.locator('input[type=file][multiple]').first();
              if(!await fileInput.count()) throw Error('MULTI_FILE_INPUT_MISSING');
              await fileInput.setInputFiles('/tmp/listing.png');

              const publish=page.locator('button[type="submit"][name="intent"][value="published"]:visible').first();
              if(!await publish.count()) throw Error('VISIBLE_PUBLISH_BUTTON_MISSING');
              result.stages.publishButton={ok:true,count:await page.locator('button[type="submit"][name="intent"][value="published"]').count()};

              const draftPromise=page.waitForResponse(r=>cleanUrl(r.url()).split('?')[0]==='/api/inventory' && r.request().method()==='POST',{timeout:20000});
              const uploadPromise=page.waitForResponse(r=>cleanUrl(r.url()).split('?')[0]==='/api/upload' && r.request().method()==='POST',{timeout:40000}).catch(()=>null);

              await publish.click();

              const draft=await draftPromise;
              const draftBody=await bodyOf(draft);
              result.stages.draft={status:draft.status(),body:draftBody};
              if(!draft.ok()) throw Error(`DRAFT_HTTP_${draft.status()}_${draftBody}`);

              let draftJson={};
              try{draftJson=JSON.parse(draftBody)}catch{}
              const vehicleId=String(draftJson?.item?.id||'');
              if(!vehicleId) throw Error('DRAFT_ID_MISSING');
              result.vehicleId=vehicleId;

              const upload=await uploadPromise;
              if(!upload){
                const status=String(await page.locator('.statusMessage').first().textContent().catch(()=>''));
                result.stages.upload={status:null,statusMessage:status};
                throw Error(`UPLOAD_REQUEST_NOT_OBSERVED_${status}`);
              }

              const uploadBody=await bodyOf(upload);
              result.stages.upload={status:upload.status(),body:uploadBody};
              if(!upload.ok()) throw Error(`UPLOAD_HTTP_${upload.status()}_${uploadBody}`);

              const nav=await Promise.race([
                page.waitForURL(/\/dealer\/inventory\?saved=published(?:&|$)/,{timeout:40000}).then(()=>true).catch(()=>false),
                page.waitForTimeout(40000).then(()=>false)
              ]);
              if(!nav){
                const status=String(await page.locator('.statusMessage').first().textContent().catch(()=>''));
                result.stages.navigation={ok:false,statusMessage:status,url:page.url()};
                throw Error(`PUBLISH_NAVIGATION_TIMEOUT_${status}`);
              }
              result.stages.navigation={ok:true,url:page.url()};

              const dealerInv=await page.evaluate(async()=>{
                const r=await fetch(`/api/inventory?listing_readback=${Date.now()}`,{cache:'no-store',credentials:'include'});
                return {status:r.status,ok:r.ok,text:await r.text()};
              });
              result.stages.dealerInventory={status:dealerInv.status};
              if(!dealerInv.ok) throw Error(`DEALER_INVENTORY_${dealerInv.status}_${dealerInv.text.slice(0,1000)}`);

              const dealerJson=JSON.parse(dealerInv.text);
              const item=(dealerJson.items||[]).find(v=>v.id===vehicleId || v.stock===stock);
              if(!item) throw Error(`VEHICLE_NOT_IN_AUTHENTICATED_DEALER_INVENTORY_${dealerInv.text.slice(0,1000)}`);

              result.vehicle={id:item.id,stock:item.stock,status:item.status,photoPathnames:item.photoPathnames||[],primaryPhotoPathname:item.primaryPhotoPathname||null};
              if(String(item.status).toLowerCase()!=='published') throw Error(`VEHICLE_STATUS_${item.status}`);
              if(!(item.photoPathnames||[]).length) throw Error('VEHICLE_PHOTO_PATH_MISSING');

              const publicResp=await fetch(`${store}/api/inventory?qa_upload_verify=${Date.now()}`,{cache:'no-store'});
              const publicText=await publicResp.text();
              result.stages.publicInventory={status:publicResp.status};
              if(!publicResp.ok) throw Error(`PUBLIC_INVENTORY_${publicResp.status}_${publicText.slice(0,1000)}`);
              const publicJson=JSON.parse(publicText);
              if((publicJson.items||[]).some(v=>v.id===item.id || v.stock===stock)) throw Error('QA_VEHICLE_VISIBLE_PUBLICLY');
              result.qaHiddenPublic=true;

              await page.goto(`${dealer}/dealer/inventory`,{waitUntil:'domcontentloaded',timeout:30000});
              await page.locator('body').waitFor({state:'visible',timeout:10000});
              await page.screenshot({path:'/tmp/dealer-listing.png',fullPage:true});
              result.stages.screenshot={ok:true};
              result.ok=true;
              fs.writeFileSync('/tmp/listing-result.json',JSON.stringify(result,null,2));
            }catch(e){
              result.error=String(e?.message||e);
              fs.writeFileSync('/tmp/listing-result.json',JSON.stringify(result,null,2));
              console.error(e);
              process.exitCode=1;
            }finally{
              await browser.close();
            }
          })();
          NODE

      - name: Cleanup disposable records and media
        if: always() && steps.identity.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          set -a; . /tmp/listing.env; set +a

          cat > .wdcc-cleanup.mjs <<'NODE'
          import {get,head,put,del,BlobPreconditionFailedError} from '@vercel/blob';

          const path='private/state/platform-v3.json';
          const dealerId=process.env.DEALER_ID;
          const stock=process.env.STOCK;

          async function stable(){
            for(let i=0;i<5;i++){
              const a=await head(path);
              const r=await get(path,{access:'private',useCache:false});
              if(!r?.stream) throw Error('STATE_READ_FAILED');
              const chunks=[];
              for await(const x of r.stream) chunks.push(x);
              const b=await head(path);
              if(a.etag===b.etag) return {etag:b.etag,state:JSON.parse(Buffer.concat(chunks).toString())};
            }
            throw Error('STATE_TOO_HOT');
          }

          for(let attempt=1;attempt<=4;attempt++){
            const before=await stable();
            const s=before.state;
            const vehicles=Array.isArray(s.vehicles)?s.vehicles:[];
            const users=Array.isArray(s.users)?s.users:[];
            const exact=vehicles.filter(v=>String(v.stock||'')===stock);
            const media=[...new Set(exact.flatMap(v=>Array.isArray(v.photoPathnames)?v.photoPathnames:[]).filter(Boolean))];
            s.vehicles=vehicles.filter(v=>!exact.some(x=>x.id===v.id));
            s.users=users.filter(u=>u.id!==dealerId);
            s.revision=Number(s.revision||0)+1;
            s.updatedAt=new Date().toISOString();

            try{
              await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:before.etag});
              if(media.length) await del(media);
              console.log(JSON.stringify({ok:true,revision:s.revision,removedUsers:users.length-s.users.length,removedVehicles:exact.length,removedMedia:media.length,stock}));
              process.exit(0);
            }catch(e){
              if(e instanceof BlobPreconditionFailedError && attempt<4) continue;
              throw e;
            }
          }
          NODE

          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- node .wdcc-cleanup.mjs | tee /tmp/listing-cleanup.json

      - name: Publish isolated evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        shell: bash
        run: |
          result='not captured'; [ -f /tmp/listing-result.json ] && result="$(cat /tmp/listing-result.json)"
          cleanup='not captured'; [ -f /tmp/listing-cleanup.json ] && cleanup="$(tail -1 /tmp/listing-cleanup.json)"
          body=$(cat <<EOF
          Status: **$STATUS**

          Test-harness-only change. No Vercel alias, DNS, Cloudflare route, apex/www, or dealer routing mutation.

          Result:
          \`\`\`json
          $result
          \`\`\`

          Cleanup:
          \`\`\`json
          $cleanup
          \`\`\`
          EOF
          )
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC isolated listing upload ${GITHUB_RUN_ID}" --body "$body" || true

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wdcc-isolated-listing-${{ github.run_id }}
          path: |
            /tmp/listing-result.json
            /tmp/dealer-listing.png
          if-no-files-found: ignore
          retention-days: 3
