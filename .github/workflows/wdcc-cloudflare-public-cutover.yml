name: WDCC Cloudflare Public Cutover [FROZEN by #205]

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Production writes are frozen while issue #205 is NO-GO
        required: true
        default: verify-only
        type: choice
        options:
          - verify-only
      release_control_issue:
        description: Controlling WDCC release-control issue
        required: true
        default: '205'
        type: string

permissions:
  contents: read
  issues: read

jobs:
  freeze:
    uses: ./.github/workflows/wdcc-production-freeze-check.yml
    with:
      lane: cloudflare-public-cutover
      release_control_issue: ${{ inputs.release_control_issue }}
