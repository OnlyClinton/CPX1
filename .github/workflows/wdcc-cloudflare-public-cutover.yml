name: WDCC Cloudflare Public Cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-cloudflare-public-cutover.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-cloudflare-public-cutover
  cancel-in-progress: false

env:
  CF_API: https://api.cloudflare.com/client/v4
  ZONE_ID: 53f5a816cfbba0c31d6d12fe46af05a1
  APEX: https://wedontcarecars.com
  WWW: https://www.wedontcarecars.com
  ORIGIN_A: https://wdcc-v32-storefront.vercel.app
  ORIGIN_B: https://wdcc-v32-storefront-cpxagency.vercel.app
  WORKER: wdcc-reference-root

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require Cloudflare authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_TOKEN:-}"
          test -n "${CF_ACCOUNT:-}"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Wrangler
        run: npm install --global wrangler@4.90.0

      - name: Select public exact-2vfD origin
        id: origin
        shell: bash
        run: |
          set -euo pipefail
          chosen=''
          for origin in "$ORIGIN_A" "$ORIGIN_B"; do
            code="$(curl -sS -L --max-time 25 -o /tmp/origin.html -w '%{http_code}' "$origin/?cf-preflight=$GITHUB_RUN_ID" || true)"
            if [ "$code" = 200 ] && grep -qi "we don.t care" /tmp/origin.html && grep -q 'wdcc-logo-transparent.webp' /tmp/origin.html && grep -q 'wdcc-hero-v2.webp' /tmp/origin.html; then
              chosen="$origin"
              break
            fi
          done
          test -n "$chosen"
          curl -fsS "$chosen/wdcc-logo-transparent.webp?cf-preflight=$GITHUB_RUN_ID" -o /tmp/origin-logo.webp
          curl -fsS "$chosen/wdcc-hero-v2.webp?cf-preflight=$GITHUB_RUN_ID" -o /tmp/origin-hero.webp
          test -s /tmp/origin-logo.webp
          test -s /tmp/origin-hero.webp
          echo "url=$chosen" >> "$GITHUB_OUTPUT"
          echo "Selected exact 2vfD public origin: $chosen"

      - name: Snapshot Cloudflare routes and preserve dealer isolation
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$CF_API/zones/$ZONE_ID/workers/routes" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H 'Content-Type: application/json' > /tmp/routes-before.json
          jq -e '.success==true' /tmp/routes-before.json >/dev/null
          jq -e '.result[] | select(.pattern=="dealer.wedontcarecars.com/*" and .script=="wdcc-dealer-frontdoor")' /tmp/routes-before.json >/dev/null
          jq -r '.result[] | [.id,.pattern,(.script//"-")] | @tsv' /tmp/routes-before.json | sort

      - name: Update existing public Worker only
        env:
          ORIGIN: ${{ steps.origin.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wdcc-cloudflare-public
          cat > /tmp/wdcc-cloudflare-public/worker.js <<'EOF'
          const ORIGIN=__ORIGIN__;
          export default {async fetch(request){
            const incoming=new URL(request.url);
            const target=new URL(ORIGIN);
            target.pathname=incoming.pathname;
            target.search=incoming.search;
            const headers=new Headers(request.headers);
            headers.delete('host');
            headers.set('x-forwarded-host',incoming.host);
            headers.set('x-forwarded-proto','https');
            const upstream=await fetch(new Request(target.toString(),{
              method:request.method,
              headers,
              body:['GET','HEAD'].includes(request.method)?undefined:request.body,
              redirect:'manual'
            }));
            const out=new Headers(upstream.headers);
            out.set('x-wdcc-cloudflare-public','exact-2vfd');
            out.set('x-wdcc-cloudflare-worker','wdcc-reference-root');
            const location=out.get('location');
            if(location){
              try{
                const next=new URL(location,target);
                if(next.hostname===new URL(ORIGIN).hostname){next.protocol='https:';next.host=incoming.host;out.set('location',next.toString())}
              }catch{}
            }
            if((out.get('content-type')||'').includes('text/html'))out.set('cache-control','no-store, max-age=0');
            return new Response(upstream.body,{status:upstream.status,statusText:upstream.statusText,headers:out});
          }};
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          p=Path('/tmp/wdcc-cloudflare-public/worker.js')
          p.write_text(p.read_text().replace('__ORIGIN__',json.dumps(os.environ['ORIGIN'])))
          PY
          cat > /tmp/wdcc-cloudflare-public/wrangler.jsonc <<'EOF'
          {
            "name":"wdcc-reference-root",
            "main":"worker.js",
            "compatibility_date":"2026-08-27",
            "workers_dev":true,
            "routes":[
              {"pattern":"wedontcarecars.com/*","zone_name":"wedontcarecars.com"},
              {"pattern":"www.wedontcarecars.com/*","zone_name":"wedontcarecars.com"}
            ]
          }
          EOF
          cd /tmp/wdcc-cloudflare-public
          wrangler deploy --config wrangler.jsonc

      - name: Prove Cloudflare customer cutover and dealer isolation
        env:
          ORIGIN: ${{ steps.origin.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$CF_API/zones/$ZONE_ID/workers/routes" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H 'Content-Type: application/json' > /tmp/routes-after.json
          jq -e '.success==true' /tmp/routes-after.json >/dev/null
          jq -e '.result[] | select(.pattern=="wedontcarecars.com/*" and .script=="wdcc-reference-root")' /tmp/routes-after.json >/dev/null
          jq -e '.result[] | select(.pattern=="www.wedontcarecars.com/*" and .script=="wdcc-reference-root")' /tmp/routes-after.json >/dev/null
          jq -e '.result[] | select(.pattern=="dealer.wedontcarecars.com/*" and .script=="wdcc-dealer-frontdoor")' /tmp/routes-after.json >/dev/null

          origin_logo="$(sha256sum /tmp/origin-logo.webp | awk '{print $1}')"
          origin_hero="$(sha256sum /tmp/origin-hero.webp | awk '{print $1}')"
          for host in "$APEX" "$WWW"; do
            code=000
            for i in $(seq 1 30); do
              code="$(curl -sS -D /tmp/live.h -L --max-time 25 -o /tmp/live.html -w '%{http_code}' "$host/?cf-cutover=$GITHUB_RUN_ID-$i" || true)"
              if [ "$code" = 200 ] && grep -qi '^x-wdcc-cloudflare-public: exact-2vfd' /tmp/live.h; then break; fi
              sleep 2
            done
            test "$code" = 200
            grep -qi '^x-wdcc-cloudflare-public: exact-2vfd' /tmp/live.h
            grep -qi "we don.t care" /tmp/live.html
            grep -q 'wdcc-logo-transparent.webp' /tmp/live.html
            grep -q 'wdcc-hero-v2.webp' /tmp/live.html
            for car in '2004-nissan-350z' '2016-ford-f150-limited' '2019-honda-pilot' '2019-kia-sportage' '2019-toyota-rav4'; do grep -q "$car" /tmp/live.html; done
            curl -fsS "$host/wdcc-logo-transparent.webp?cf-cutover=$GITHUB_RUN_ID" -o /tmp/live-logo.webp
            curl -fsS "$host/wdcc-hero-v2.webp?cf-cutover=$GITHUB_RUN_ID" -o /tmp/live-hero.webp
            test "$(sha256sum /tmp/live-logo.webp | awk '{print $1}')" = "$origin_logo"
            test "$(sha256sum /tmp/live-hero.webp | awk '{print $1}')" = "$origin_hero"
            test "$(curl -sS -L -o /tmp/inventory.html -w '%{http_code}' "$host/inventory")" = 200
          done

          dealer_code="$(curl -sS -L --max-time 25 -o /tmp/dealer.html -w '%{http_code}' https://dealer.wedontcarecars.com/dealer || true)"
          echo "$dealer_code" | grep -Eq '^(200|302|307|308)$'
          grep -qi 'dealer sign in\|dealer portal' /tmp/dealer.html
          upload_code="$(curl -sS -L --max-time 25 -o /tmp/upload.html -w '%{http_code}' https://dealer.wedontcarecars.com/dealer/inventory/new || true)"
          echo "$upload_code" | grep -Eq '^(200|302|307|308)$'
          echo 'CLOUDFLARE_PUBLIC_CUTOVER=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'EXACT_2VFD_FIVE_CAR_STOREFRONT=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'HERO_LOGO_PARITY=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'DEALER_CLOUDFLARE_ROUTE_PRESERVED=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'DEALER_UPLOAD_ROUTE_REACHABLE=PASS' >> "$GITHUB_STEP_SUMMARY"
