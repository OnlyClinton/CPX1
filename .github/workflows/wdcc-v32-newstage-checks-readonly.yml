name: WDCC V32 New Stage Checks Readonly

on:
  push:
    branches: [proof/wdcc-522-immutable-parser-20260829]
    paths:
      - '.github/workflows/wdcc-v32-newstage-checks-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      PROJECT_ID: prj_We7xkAkB5Qy31Pt17USSkQFE0u7h
      DEPLOYMENT_ID: dpl_35txfB6P2cE4sH9S7wb88X4F4Rd9
    steps:
      - name: Inspect deployment check runs only
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $VERCEL_TOKEN")
          curl -fsS "https://api.vercel.com/v2/deployments/$DEPLOYMENT_ID/check-runs?teamId=$TEAM_ID" "${auth[@]}" >/tmp/runs.json
          jq -c '[.runs[]? | {id,checkId,name,status,conclusion,startedAt,completedAt,detailsUrl}]' /tmp/runs.json
          echo "TYPECHECK=$(jq -r '[.runs[]? | select(.name=="Typecheck")][0] | (.status+":"+(.conclusion//"")) // "missing"' /tmp/runs.json)"
          echo "LINT=$(jq -r '[.runs[]? | select(.name=="Lint")][0] | (.status+":"+(.conclusion//"")) // "missing"' /tmp/runs.json)"
          echo "MFE=$(jq -r '[.runs[]? | select(.name=="Microfrontends Config Present")][0] | if .==null then "ABSENT" else (.status+":"+(.conclusion//"")) end' /tmp/runs.json)"
          echo 'READ_ONLY=YES'
          echo 'PRODUCTION_CHANGED=NO'
