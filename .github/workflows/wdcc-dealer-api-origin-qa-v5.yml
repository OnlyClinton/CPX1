name: WDCC Dealer API Origin QA V5

on:
  push:
    branches: ['qa/wdcc-dealer-api-origin-fix-20260825']
    paths: ['.github/workflows/wdcc-dealer-api-origin-qa-v5.yml']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wdcc-dealer-api-origin-qa-v5
  cancel-in-progress: true

env:
  API_ORIGIN: https://wdcc-cpx-launch-qhcvflfih-cpxagency.vercel.app
  TEAM: cpxagency
  ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
  PHOENIX_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify direct canonical authority
        run: |
          set -euo pipefail
          curl -fsS "$API_ORIGIN/api/health?v5=$GITHUB_RUN_ID" -o /tmp/direct.json
          jq -e '.ok==true and .degraded==false and .service=="wdcc-canonical-authority" and (.storage.counts.vehicles > 5)' /tmp/direct.json >/dev/null

      - name: Install QA tools
        run: |
          set -euo pipefail
          npm ci
          npm install --global vercel@59.5.0 wrangler@4.90.0 >/dev/null
          mkdir -p .vercel /tmp/wdcc-apiqa5
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$PHOENIX_ID" > .vercel/project.json

      - name: Build Worker with same-zone public fetch compatibility
        run: |
          set -euo pipefail
          cat > /tmp/wdcc-apiqa5/worker.js <<'EOF'
          const API="https://wdcc-cpx-launch-qhcvflfih-cpxagency.vercel.app";
          const TRUSTED="https://dealer.wedontcarecars.com";
          function upstreamHeaders(request){
            const h=new Headers();
            for(const name of ['accept','accept-language','content-type','cookie','user-agent','x-wdcc-request-id']){
              const v=request.headers.get(name); if(v) h.set(name,v);
            }
            h.set('x-forwarded-host','dealer.wedontcarecars.com');
            h.set('x-forwarded-proto','https');
            h.set('x-wdcc-frontdoor','dealer-api-origin-qa-v5');
            if(!['GET','HEAD'].includes(request.method)) h.set('origin',TRUSTED);
            return h;
          }
          export default {async fetch(request){
            const incoming=new URL(request.url);
            if(!incoming.pathname.startsWith('/api/')) return new Response('QA API only',{status:404});
            const target=new URL(API); target.pathname=incoming.pathname; target.search=incoming.search;
            const init={method:request.method,headers:upstreamHeaders(request),redirect:'manual'};
            if(!['GET','HEAD'].includes(request.method)) init.body=request.body;
            const response=await fetch(target.toString(),init);
            const out=new Headers(response.headers);
            out.set('x-wdcc-edge','dealer-api-origin-qa-v5');
            out.set('x-wdcc-origin',target.hostname);
            out.set('cache-control','private, no-store, max-age=0');
            return new Response(response.body,{status:response.status,statusText:response.statusText,headers:out});
          }};
          EOF
          cat > /tmp/wdcc-apiqa5/wrangler.jsonc <<'EOF'
          {
            "name":"wdcc-dealer-api-origin-qa-v5",
            "main":"worker.js",
            "compatibility_date":"2026-08-25",
            "compatibility_flags":["global_fetch_strictly_public"],
            "workers_dev":true,
            "preview_urls":true,
            "observability":{"enabled":true}
          }
          EOF

      - name: Deploy and prove canonical health through Worker
        id: candidate
        working-directory: /tmp/wdcc-apiqa5
        run: |
          set -euo pipefail
          wrangler deploy 2>&1 | tee /tmp/wrangler.log
          URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wrangler.log | tail -1 || true)"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          code="$(curl -sS -D /tmp/h -o /tmp/health.json -w '%{http_code}' "$URL/api/health?v5=$GITHUB_RUN_ID")"
          echo "candidate_health_http=$code"
          cat /tmp/health.json
          test "$code" = 200
          jq -e '.ok==true and .degraded==false and .service=="wdcc-canonical-authority" and (.storage.counts.vehicles > 5)' /tmp/health.json >/dev/null
          grep -qi '^x-wdcc-origin: wdcc-cpx-launch-qhcvflfih-cpxagency.vercel.app' /tmp/h

      - name: Create disposable dealer identity
        id: identity
        run: |
          set -euo pipefail
          export RUN_TAG="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > .wdcc-apiqa5-user.mjs <<'NODE'
          import crypto from'node:crypto';import fs from'node:fs';import{get,head,put,BlobPreconditionFailedError}from'@vercel/blob';
          const path='private/state/platform-v3.json',run=process.env.RUN_TAG;async function stable(){for(let i=0;i<5;i++){const a=await head(path),r=await get(path,{access:'private',useCache:false});if(!r?.stream)throw Error('STATE_READ_FAILED');const c=[];for await(const x of r.stream)c.push(x);const raw=Buffer.concat(c),b=await head(path);if(a.etag===b.etag)return{etag:b.etag,s:JSON.parse(raw.toString())}}throw Error('STATE_TOO_HOT')}
          for(let n=1;n<=4;n++){const before=await stable(),s=before.s,password=`ApiQa5-${crypto.randomBytes(18).toString('base64url')}!`,salt=crypto.randomBytes(24),digest=crypto.scryptSync(password,salt,64),hash=`scrypt$${salt.toString('base64url')}$${digest.toString('base64url')}`,id=`apiqa5-${crypto.randomUUID()}`,email=`apiqa5-${run}@invalid.example`;s.users=Array.isArray(s.users)?s.users:[];s.users.push({id,email,username:email,displayName:`API Origin QA5 ${run}`,role:'dealer_agent',tenantId:'wdcc',status:'active',disabled:false,passwordHash:hash});s.revision=Number(s.revision||0)+1;s.updatedAt=new Date().toISOString();try{await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:before.etag});fs.writeFileSync('/tmp/apiqa5.env',`QA_ID=${id}\nQA_EMAIL=${email}\nQA_PASSWORD=${password}\n`);console.log(JSON.stringify({ok:true,id}));process.exit(0)}catch(e){if(e instanceof BlobPreconditionFailedError&&n<4)continue;throw e}}
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- node .wdcc-apiqa5-user.mjs
          set -a; . /tmp/apiqa5.env; set +a; printf '::add-mask::%s\n' "$QA_PASSWORD"

      - name: Prove login session and full dealer inventory through Worker
        id: proof
        env:
          QA_URL: ${{ steps.candidate.outputs.url }}
        run: |
          set -euo pipefail
          set -a; . /tmp/apiqa5.env; set +a; printf '::add-mask::%s\n' "$QA_PASSWORD"
          payload="$(jq -nc --arg u "$QA_EMAIL" --arg p "$QA_PASSWORD" '{username:$u,email:$u,password:$p}')"
          LOGIN="$(curl -sS -c /tmp/cookies -o /tmp/login.json -w '%{http_code}' -H 'content-type: application/json' -X POST "$QA_URL/api/auth/login" --data "$payload")"
          test "$LOGIN" = 200
          jq -e '.ok==true' /tmp/login.json >/dev/null
          SESSION="$(curl -sS -b /tmp/cookies -o /tmp/session.json -w '%{http_code}' "$QA_URL/api/auth/session")"
          test "$SESSION" = 200
          jq -e '.authenticated==true' /tmp/session.json >/dev/null
          INV="$(curl -sS -b /tmp/cookies -o /tmp/inv.json -w '%{http_code}' "$QA_URL/api/inventory?v5=$GITHUB_RUN_ID")"
          test "$INV" = 200
          COUNT="$(jq '.items|length' /tmp/inv.json)"
          echo "authenticated_inventory_count=$COUNT"
          test "$COUNT" -gt 5
          jq -n --argjson count "$COUNT" '{ok:true,authenticated:true,fullInventoryCount:$count}' | tee /tmp/result.json

      - name: Cleanup disposable dealer identity
        if: always() && steps.identity.outcome == 'success'
        run: |
          set -euo pipefail
          set -a; . /tmp/apiqa5.env; set +a
          cat > .wdcc-apiqa5-clean.mjs <<'NODE'
          import{get,head,put,BlobPreconditionFailedError}from'@vercel/blob';const path='private/state/platform-v3.json',id=process.env.QA_ID;async function stable(){for(let i=0;i<5;i++){const a=await head(path),r=await get(path,{access:'private',useCache:false});if(!r?.stream)throw Error('READ');const c=[];for await(const x of r.stream)c.push(x);const b=await head(path);if(a.etag===b.etag)return{etag:b.etag,s:JSON.parse(Buffer.concat(c).toString())}}throw Error('HOT')}for(let n=1;n<=4;n++){const before=await stable(),s=before.s,users=s.users||[];s.users=users.filter(x=>x.id!==id);s.revision=Number(s.revision||0)+1;s.updatedAt=new Date().toISOString();try{await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:before.etag});console.log(JSON.stringify({ok:true,removedUsers:users.length-s.users.length,revision:s.revision}));process.exit(0)}catch(e){if(e instanceof BlobPreconditionFailedError&&n<4)continue;throw e}}
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- node .wdcc-apiqa5-clean.mjs | tee /tmp/cleanup.json

      - name: Publish evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          QA_URL: ${{ steps.candidate.outputs.url }}
        run: |
          result='not captured'; [ -f /tmp/result.json ] && result="$(cat /tmp/result.json)"
          cleanup='not captured'; [ -f /tmp/cleanup.json ] && cleanup="$(tail -1 /tmp/cleanup.json)"
          body=$(cat <<EOF
          Status: **$STATUS**
          Candidate: \`${QA_URL:-not-created}\`
          Compatibility flag: \`global_fetch_strictly_public\`
          API origin: \`$API_ORIGIN\`

          Staging only. No live route binding, DNS change, Vercel alias movement, or storefront mutation.

          Result:
          \`\`\`json
          $result
          \`\`\`

          Cleanup:
          \`\`\`json
          $cleanup
          \`\`\`
          EOF
          )
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC dealer API origin QA V5 ${GITHUB_RUN_ID}" --body "$body" || true
