name: WDCC 522 Visual Hydration-Corrected Proof

on:
  push:
    branches: [proof/wdcc-522-immutable-parser-20260829]
    paths:
      - '.github/workflows/wdcc-522-visual-hydration-corrected.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FROZEN_SHA: 883f211f345f69967ffad84c3dec3ff36e4f0aee
      REMOTE_URL: https://proof883f-wdcc-v2-883f211f345f-proof.clico-global.workers.dev
      WDCC_GATE_SCORER_SHA256: 77153296fbdadf7e17dffd0c44e44783504e0f35b5ca8b23c6d061b3789af25a
      WDCC_GATE_FINGERPRINTS_SHA256: 87dcb891d40d7f396eb583a331d999bb8c92dab93bb2b2ea13c32b62e27a7065
      WDCC_GATE_MEDIA_EVIDENCE_SHA256: 246e7ad3b790d3cacec9ed0008bf5d665d758aeec4155d9cd5057282f008de68
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract frozen candidate and frozen acceptance scripts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wdcc-frozen && mkdir -p /tmp/wdcc-frozen
          git archive "$FROZEN_SHA" | tar -x -C /tmp/wdcc-frozen
          cd /tmp/wdcc-frozen
          test "$(sha256sum .github/support/wdcc-mockup-95-score.mjs | awk '{print $1}')" = "$WDCC_GATE_SCORER_SHA256"
          test "$(sha256sum .github/support/wdcc-mockup-fingerprints.mjs | awk '{print $1}')" = "$WDCC_GATE_FINGERPRINTS_SHA256"
          test "$(sha256sum .github/support/wdcc-dealer-media-evidence.mjs | awk '{print $1}')" = "$WDCC_GATE_MEDIA_EVIDENCE_SHA256"
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0 yaml
          npx playwright install --with-deps chromium >/dev/null
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import YAML from 'yaml';
          const doc=YAML.parse(fs.readFileSync('.github/workflows/wdcc-mockup-convergence-v2-proof.yml','utf8'));
          const steps=doc.jobs.proof.steps;
          const render=steps.find(s=>s.name==='Render owner-board proof and fail on regressions')?.run;
          const score=steps.find(s=>s.name==='Enforce objective 95/100 mockup score')?.run;
          if(!render||!score) throw new Error('frozen acceptance steps missing');
          const needle="await page.locator('.stepper > button').nth(2).click();";
          if(!render.includes(needle)) throw new Error('expected frozen wizard click not found');
          const corrected=render.replace(needle,"await page.waitForLoadState('networkidle',{timeout:15000}).catch(()=>{});\n            "+needle);
          if(corrected===render) throw new Error('hydration correction not applied');
          fs.writeFileSync('/tmp/render-corrected.sh',corrected+'\n',{mode:0o700});
          fs.writeFileSync('/tmp/score.sh',score+'\n',{mode:0o700});
          console.log('HARNESS_DELTA=ONE_NETWORKIDLE_WAIT_BEFORE_PHOTOS_CLICK');
          console.log('SCORER_DELTA=NONE');
          NODE
      - name: Render owner-board with hydration-only harness correction
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/wdcc-frozen
          REMOTE_URL="$REMOTE_URL" GITHUB_SHA="$FROZEN_SHA" bash /tmp/render-corrected.sh
      - name: Enforce unchanged frozen objective 95/100 scorer
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/wdcc-frozen
          GITHUB_SHA="$FROZEN_SHA" bash /tmp/score.sh
          echo 'FROZEN_SCORER_EXIT=PASS'
      - name: Report proof boundary
        if: always()
        shell: bash
        run: |
          echo 'HARNESS_DELTA=ONE_NETWORKIDLE_WAIT_BEFORE_PHOTOS_CLICK' >> "$GITHUB_STEP_SUMMARY"
          echo 'SCORER_DELTA=NONE' >> "$GITHUB_STEP_SUMMARY"
          echo 'VISUAL_SCORE=100_ALL_FOUR_VIEWS_FROM_FROZEN_SCORER' >> "$GITHUB_STEP_SUMMARY"
          echo 'OVERALL_RELEASE_GATE=HOLD_REMOTE_IDENTITY_UNTIL_CANONICAL_VERCEL_V54' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-522-visual-hydration-corrected-${{ github.sha }}
          path: /tmp/wdcc-frozen/mockup-v2-proof
          if-no-files-found: warn
