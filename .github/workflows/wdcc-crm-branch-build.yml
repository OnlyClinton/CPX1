name: WDCC CRM Branch Build
on:
  push:
    branches: [wdcc-crm-inventory-8ar]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  dispatch-safe-repair:
    if: github.event_name == 'pull_request' && github.event.pull_request.title == 'Run deterministic WDCC safe repair gate' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch registered frozen-candidate safe repair workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run wdcc-phoenix-oidc-repair-188392c.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'SAFE_REPAIR_DISPATCHED=true'
