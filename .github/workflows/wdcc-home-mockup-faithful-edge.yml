name: WDCC HOME MOCKUP FAITHFUL EDGE

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-home-mockup-faithful-edge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-home-mockup-faithful-edge
  cancel-in-progress: false

env:
  ORIGIN: https://www.wedontcarecars.com
  APEX: https://wedontcarecars.com
  BRAND_HERO: https://xgbsyv0ovelnac0u.public.blob.vercel-storage.com/wdcc/brand/hero.jpg

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require Cloudflare authorization
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Prove storefront origin and visual assets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$ORIGIN/?mockup_preflight=$GITHUB_RUN_ID" -o /tmp/origin.html
          grep -q 'intro-sequence' /tmp/origin.html
          grep -q 'hero-copy' /tmp/origin.html
          grep -q 'benefit-strip' /tmp/origin.html
          grep -q 'inventory-showcase' /tmp/origin.html
          curl -fsS "$ORIGIN/wdcc-logo-transparent.webp" -o /tmp/logo.webp
          curl -fsS "$BRAND_HERO" -o /tmp/brand-hero.jpg
          test -s /tmp/logo.webp
          test -s /tmp/brand-hero.jpg

      - name: Install Wrangler
        run: npm install --global wrangler@4.90.0 >/dev/null

      - name: Build mockup-faithful storefront Worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wdcc-home-mockup
          cat > /tmp/wdcc-home-mockup/worker.js <<'EOF'
          const ORIGIN = "https://www.wedontcarecars.com";
          const HERO = "https://xgbsyv0ovelnac0u.public.blob.vercel-storage.com/wdcc/brand/hero.jpg";
          const CSS = `
          <style id="wdcc-mockup-faithful-edge">
            :root{--wdcc-red:#ef202f;--wdcc-blue:#168af4;--wdcc-ink:#02060a;--wdcc-paper:#f4f4f2}
            body{background:var(--wdcc-ink)!important}
            .header-shell{background:#03080df2!important;border-bottom:1px solid #ffffff18!important;backdrop-filter:blur(16px)!important}
            .utility-bar{height:30px!important;min-height:30px!important;padding:0 24px!important;display:flex!important;align-items:center!important;justify-content:space-between!important;background:#020609!important;border-bottom:1px solid #ffffff10!important;color:#f4f7fa!important;font-size:9px!important;letter-spacing:.07em!important}
            .site-header{height:78px!important;min-height:78px!important;padding:0 24px!important;display:grid!important;grid-template-columns:118px minmax(0,1fr) auto!important;align-items:center!important;gap:24px!important;background:#03080df4!important}
            .logo-button{width:108px!important;height:76px!important;background:url('/wdcc-logo-transparent.webp') center/contain no-repeat!important;display:block!important;justify-self:start!important}
            .logo-button>span{visibility:hidden!important}
            .main-nav{display:flex!important;align-items:center!important;justify-content:center!important;gap:26px!important;color:#fff!important;font-size:11px!important;font-weight:900!important;text-transform:uppercase!important;letter-spacing:.025em!important}
            .mobile-menu,.mobile-call{display:none!important}

            .intro-scene{background-image:url('${HERO}')!important;background-position:64% center!important;background-size:cover!important;filter:saturate(1.08) contrast(1.06) brightness(.62)!important}
            .intro-sequence:after{background:linear-gradient(90deg,#02060ae8 0,#02060a9c 37%,#02060a1f 72%),linear-gradient(0deg,#02060ab8 0,#0000 45%)!important}
            .intro-badge{width:min(25vw,280px)!important}

            .hero{min-height:640px!important;background-image:linear-gradient(90deg,#02060af2 0,#02060ad8 34%,#02060a5f 55%,#0000 75%),linear-gradient(0deg,#02060ac9 0,#0000 36%),url('${HERO}')!important;background-position:62% center!important;background-size:cover!important;background-repeat:no-repeat!important;display:block!important;position:relative!important}
            .hero:after{background:linear-gradient(0deg,#02060abf 0,#0000 28%)!important;pointer-events:none!important}
            .hero-copy{position:relative!important;z-index:3!important;width:min(660px,52vw)!important;padding:94px 0 64px 32px!important;margin-left:max(0px,calc((100vw - 1500px)/2))!important}
            .hero-kicker{color:#56a8ee!important;letter-spacing:.13em!important;text-transform:uppercase!important;font-size:10px!important;font-weight:900!important;margin:0 0 14px!important}
            .hero-kicker:before{content:'';display:inline-block;width:34px;height:2px;background:#d7a72d;margin-right:10px;vertical-align:middle}
            .hero h1{color:var(--wdcc-red)!important;text-transform:uppercase!important;letter-spacing:-.055em!important;font-size:clamp(54px,6vw,90px)!important;line-height:.88!important;margin:0 0 18px!important;text-shadow:0 6px 24px #000c!important}
            .hero h1 em{color:var(--wdcc-blue)!important;font-style:normal!important}
            .hero h1 strong{color:#fff!important}
            .hero-lead{color:#eef3f7!important;font-size:16px!important;line-height:1.5!important;max-width:520px!important;text-shadow:0 3px 14px #000!important}
            .hero-actions{display:grid!important;grid-template-columns:1.12fr 1fr!important;gap:12px!important;max-width:560px!important;margin-top:24px!important}
            .hero-actions .hero-cta-contact{display:none!important}
            .hero-actions .hero-cta-test,.hero-actions .hero-cta-qualify{display:flex!important;align-items:center!important;justify-content:center!important;min-height:48px!important;border-radius:5px!important;font-size:11px!important;font-weight:950!important;text-transform:uppercase!important;letter-spacing:.035em!important}
            .hero-actions .hero-cta-test{background:var(--wdcc-red)!important;color:#fff!important;border:1px solid var(--wdcc-red)!important}
            .hero-actions .hero-cta-qualify{background:#09131dcc!important;color:#fff!important;border:1px solid #8da0b2!important}

            .benefit-strip{position:relative!important;z-index:8!important;margin:-20px 16px 0!important;background:#fff!important;color:#101820!important;border:1px solid #dfe3e7!important;border-radius:10px!important;display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;overflow:hidden!important;box-shadow:0 14px 36px #0003!important}
            .benefit-strip article{min-height:94px!important;padding:18px 16px!important;display:grid!important;grid-template-columns:42px 1fr!important;align-items:center!important;gap:10px!important;border-right:1px solid #e0e4e8!important;background:#fff!important}
            .benefit-strip article:last-child{border-right:0!important}
            .benefit-strip .icon{width:36px!important;height:36px!important;border:2px solid var(--wdcc-red)!important;border-radius:50%!important;display:grid!important;place-items:center!important;color:var(--wdcc-red)!important;font-size:17px!important}
            .benefit-strip strong{display:block!important;color:#111820!important;font-size:10px!important;font-weight:950!important;text-transform:uppercase!important}
            .benefit-strip article span:not(.icon){display:block!important;color:#5f6973!important;font-size:9px!important;line-height:1.35!important;margin-top:3px!important}

            .inventory-showcase{background:var(--wdcc-paper)!important;color:#101820!important;padding:46px 18px 54px!important}
            .inventory-showcase .section-heading{max-width:1500px!important;margin:0 auto 20px!important}
            .inventory-showcase .section-kicker{color:#636e79!important;text-transform:uppercase!important;font-size:10px!important;font-weight:900!important;letter-spacing:.08em!important}
            .inventory-showcase h2{color:#101820!important;font-size:clamp(30px,4vw,48px)!important;letter-spacing:-.045em!important;margin:4px 0!important}
            .inventory-showcase .section-deck,.inventory-showcase .text-link{color:#58616b!important}
            .featured-carousel{max-width:1500px!important;margin:auto!important}
            .featured-grid{display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:12px!important}
            .featured-slide{display:block!important}
            .vehicle-card{background:#fff!important;color:#101820!important;border:1px solid #d6dde3!important;border-radius:8px!important;overflow:hidden!important;box-shadow:0 6px 18px #11182718!important}
            .vehicle-image{display:block!important;aspect-ratio:4/3!important;background:#101820!important;overflow:hidden!important}
            .vehicle-image img{width:100%!important;height:100%!important;object-fit:cover!important}
            .vehicle-card-body{padding:12px!important;background:#fff!important}
            .vehicle-card-body .eyebrow{color:#68727d!important;font-size:9px!important;letter-spacing:.08em!important}
            .vehicle-title{color:#101820!important;font-size:14px!important;font-weight:950!important}
            .vehicle-price{display:block!important;color:#101820!important;font-size:22px!important;margin-top:7px!important}
            .vehicle-payment{color:#49545f!important;font-size:10px!important}
            .spec-pills span{color:#3f4953!important;background:#f0f2f4!important;font-size:8px!important}
            .carousel-arrow{background:#071522!important;color:#fff!important;border:0!important;border-radius:50%!important}

            .how-section{background:#07131e!important;color:#fff!important;padding:52px 20px!important}
            .how-section .section-heading,.how-section .steps-grid{max-width:1500px!important;margin-left:auto!important;margin-right:auto!important}
            .how-section h2{color:#fff!important}.how-section h2 strong{color:var(--wdcc-red)!important}
            .how-section .steps-grid article{background:#0d1b28!important;border:1px solid #263746!important;border-radius:8px!important}
            .site-footer{background:#02060a!important}
            .mobile-action-bar{display:none!important}

            @media(max-width:900px){
              .utility-bar{display:none!important}
              .site-header{height:74px!important;min-height:74px!important;padding:0 14px!important;grid-template-columns:48px 1fr 48px!important;gap:8px!important}
              .mobile-menu{grid-column:1!important;grid-row:1!important;display:grid!important;place-items:center!important;justify-self:start!important;width:44px!important;height:44px!important;border:0!important;background:transparent!important;color:#fff!important}
              .mobile-menu>span{display:grid!important;width:22px!important;height:16px!important;align-content:space-between!important}.mobile-menu i{display:block!important;width:22px!important;height:2px!important;background:#fff!important;border-radius:2px!important}
              .logo-button{grid-column:2!important;grid-row:1!important;justify-self:center!important;width:84px!important;height:68px!important}
              .mobile-call{grid-column:3!important;grid-row:1!important;display:grid!important;place-items:center!important;justify-self:end!important;width:44px!important;height:44px!important;border-radius:50%!important;background:var(--wdcc-red)!important;color:#fff!important}
              .mobile-call svg{width:22px!important;height:22px!important;fill:#fff!important}
              .main-nav{position:absolute!important;z-index:520!important;top:74px!important;left:10px!important;right:10px!important;display:none!important;grid-template-columns:1fr 1fr!important;gap:2px!important;padding:8px!important;background:#07131ff8!important;border:1px solid #ffffff20!important;border-radius:12px!important;box-shadow:0 20px 50px #000d!important}.main-nav.open{display:grid!important}.main-nav a{min-height:44px!important;padding:0 12px!important;display:flex!important;align-items:center!important;color:#fff!important;font-size:10px!important}
              .hero{min-height:650px!important;background-position:72% top!important;background-size:auto 650px!important}
              .hero-copy{width:100%!important;margin:0!important;padding:300px 18px 30px!important;background:linear-gradient(0deg,#02060a 8%,#02060adb 55%,#02060a00 100%)!important}
              .hero-kicker{font-size:9px!important;margin-bottom:10px!important}
              .hero h1{font-size:clamp(45px,12.8vw,62px)!important;line-height:.9!important;margin-bottom:14px!important}
              .hero-lead{font-size:14px!important;line-height:1.42!important}
              .hero-actions{grid-template-columns:1fr!important;gap:9px!important;max-width:none!important;margin-top:18px!important}
              .hero-actions .hero-cta-test,.hero-actions .hero-cta-qualify{min-height:46px!important}
              .benefit-strip{margin:0!important;border-radius:0!important;grid-template-columns:1fr 1fr!important;box-shadow:none!important}
              .benefit-strip article{min-height:92px!important;padding:13px 10px!important;border-bottom:1px solid #e0e4e8!important}
              .benefit-strip article:nth-child(2){border-right:0!important}
              .inventory-showcase{padding:28px 12px 36px!important}
              .featured-grid{display:flex!important;gap:12px!important;overflow-x:auto!important;scroll-snap-type:x mandatory!important}.featured-slide{min-width:78%!important;scroll-snap-align:start!important}.carousel-arrow{display:none!important}
              .how-section{padding:40px 14px!important}.steps-grid{grid-template-columns:1fr 1fr!important}
              .mobile-action-bar{z-index:650!important;position:fixed!important;bottom:0!important;left:0!important;right:0!important;display:grid!important;grid-template-columns:1fr 1fr!important;background:#050b11f8!important;border-top:1px solid #ffffff1c!important}.mobile-action-bar a{min-height:58px!important;display:flex!important;align-items:center!important;justify-content:center!important;color:#fff!important;font-size:10px!important;font-weight:950!important;text-transform:uppercase!important}.mobile-action-bar a:first-child{background:var(--wdcc-red)!important}.mobile-action-bar a:nth-child(2){background:#0d1b28!important}.mobile-action-bar a:nth-child(3){display:none!important}
              body{padding-bottom:58px!important}
            }
            @media(max-width:560px){
              .site-header{height:70px!important;min-height:70px!important;padding:0 10px!important}.main-nav{top:70px!important}
              .hero{min-height:620px!important;background-position:72% top!important;background-size:auto 620px!important}
              .hero-copy{padding:285px 14px 26px!important}
              .hero h1{font-size:clamp(43px,13.4vw,58px)!important}
              .benefit-strip strong{font-size:9px!important}.benefit-strip article span:not(.icon){font-size:8px!important}.benefit-strip article{grid-template-columns:36px 1fr!important}.benefit-strip .icon{width:32px!important;height:32px!important}
              .featured-slide{min-width:84%!important}.steps-grid{grid-template-columns:1fr!important}
            }
          </style>`;

          function target(request){const incoming=new URL(request.url);const out=new URL(ORIGIN);out.pathname=incoming.pathname;out.search=incoming.search;return out;}
          function rewriteLocation(headers,incoming){const location=headers.get('location');if(!location)return;try{const loc=new URL(location,ORIGIN);if(loc.hostname==='www.wedontcarecars.com'){loc.protocol='https:';loc.hostname=incoming.hostname;loc.port='';headers.set('location',loc.toString());}}catch{}}
          async function originFetch(request){const incoming=new URL(request.url),headers=new Headers(request.headers);headers.set('x-forwarded-host',incoming.host);headers.set('x-forwarded-proto','https');headers.delete('cf-worker');const init={method:request.method,headers,redirect:'manual'};if(!['GET','HEAD'].includes(request.method))init.body=request.body;const response=await fetch(new Request(target(request).toString(),init));const outHeaders=new Headers(response.headers);rewriteLocation(outHeaders,incoming);return {response,outHeaders};}
          class HeadInjector{element(el){el.append(CSS,{html:true});}}
          export default{async fetch(request){const incoming=new URL(request.url);const {response,outHeaders}=await originFetch(request);if(incoming.pathname!=='/')return new Response(response.body,{status:response.status,statusText:response.statusText,headers:outHeaders});const type=response.headers.get('content-type')||'';if(!type.includes('text/html'))return new Response(response.body,{status:response.status,statusText:response.statusText,headers:outHeaders});const transformed=new HTMLRewriter().on('head',new HeadInjector()).transform(response);const rootHeaders=new Headers(transformed.headers);rewriteLocation(rootHeaders,incoming);rootHeaders.set('x-wdcc-edge','cloudflare-home-mockup-faithful');rootHeaders.set('x-wdcc-origin','www.wedontcarecars.com');rootHeaders.set('cache-control','no-store');return new Response(transformed.body,{status:transformed.status,statusText:transformed.statusText,headers:rootHeaders});}};
          EOF
          cat > /tmp/wdcc-home-mockup/wrangler.jsonc <<'EOF'
          {
            "$schema":"node_modules/wrangler/config-schema.json",
            "name":"wdcc-home-sleek-edge",
            "main":"worker.js",
            "compatibility_date":"2026-08-25",
            "workers_dev":true,
            "observability":{"enabled":true}
          }
          EOF

      - name: Deploy and verify candidate
        id: stage
        working-directory: /tmp/wdcc-home-mockup
        shell: bash
        run: |
          set -euo pipefail
          wrangler deploy 2>&1 | tee /tmp/wrangler.log
          URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wrangler.log | tail -1 || true)"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 20); do
            code="$(curl -sS -D /tmp/candidate.h -o /tmp/candidate.html -w '%{http_code}' "$URL/?mockup=$GITHUB_RUN_ID&attempt=$attempt" || true)"
            if [ "$code" = 200 ] && grep -q 'id="wdcc-mockup-faithful-edge"' /tmp/candidate.html && grep -q 'wdcc/brand/hero.jpg' /tmp/candidate.html && grep -qi '^x-wdcc-edge: cloudflare-home-mockup-faithful' /tmp/candidate.h; then break; fi
            sleep 2
          done
          test "$code" = 200
          grep -q 'id="wdcc-mockup-faithful-edge"' /tmp/candidate.html
          grep -q 'wdcc/brand/hero.jpg' /tmp/candidate.html

      - name: Bind apex route
        working-directory: /tmp/wdcc-home-mockup
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');const p='wrangler.jsonc';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.routes=[{pattern:'wedontcarecars.com/*',zone_name:'wedontcarecars.com'}];fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');
          NODE
          wrangler deploy
          sleep 5

      - name: Double verify live apex
        shell: bash
        run: |
          set -euo pipefail
          for round in 1 2; do
            curl -fsS -D "/tmp/live-$round.h" -o "/tmp/live-$round.html" "$APEX/?intro=1&mockup=$GITHUB_RUN_ID&round=$round"
            grep -qi '^x-wdcc-edge: cloudflare-home-mockup-faithful' "/tmp/live-$round.h"
            grep -q 'id="wdcc-mockup-faithful-edge"' "/tmp/live-$round.html"
            grep -q 'wdcc/brand/hero.jpg' "/tmp/live-$round.html"
            grep -q 'intro-sequence' "/tmp/live-$round.html"
            sleep 2
          done
          echo 'WDCC_HOME_MOCKUP_FAITHFUL=PASS'
