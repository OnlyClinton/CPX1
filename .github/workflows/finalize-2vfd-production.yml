name: Promote WDCC canonical production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-2vfd-production.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: wdcc-canonical-production
  cancel-in-progress: false

env:
  VERCEL_TEAM_ID: team_G6jmETRRl8fV3KfivPOdj8JM
  VERCEL_PROJECT_ID: prj_We7xkAkB5Qy31Pt17USSkQFE0u7h
  CANDIDATE_URL: wdcc-v32-storefront-dt496r4il-cpxagency.vercel.app
  CANDIDATE_ID: dpl_MPK5UEsE5YN3vupz45Ac8kkBphBu
  EXPECTED_COMMIT: 6baa059e9cedff991c1bcf32dec1ceed40174ddc

jobs:
  validate-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: test -n "$VERCEL_TOKEN" || { echo 'VERCEL_TOKEN missing' >&2; exit 78; }

      - name: Confirm immutable candidate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$CANDIDATE_ID?teamId=$VERCEL_TEAM_ID" \
            -o /tmp/deployment.json
          jq -e --arg id "$CANDIDATE_ID" --arg sha "$EXPECTED_COMMIT" '
            .id == $id and
            .readyState == "READY" and
            .meta.githubCommitSha == $sha
          ' /tmp/deployment.json >/dev/null

      - name: Validate 8AR plus 2vfD contract before promotion
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@59.3.0 --token "$VERCEL_TOKEN" --scope cpxagency \
            curl / --deployment "$CANDIDATE_URL" > /tmp/home.html
          grep -q 'intro-sequence' /tmp/home.html
          grep -q 'intro-smoke' /tmp/home.html
          grep -q 'wdcc-logo-transparent.webp' /tmp/home.html
          grep -q 'wdcc-hero-v2.webp' /tmp/home.html
          grep -qi 'schedule a test drive' /tmp/home.html
          grep -qi 'get qualified\|get pre-approved\|get approved' /tmp/home.html
          grep -qi 'contact us\|call sean' /tmp/home.html
          npx --yes vercel@59.3.0 --token "$VERCEL_TOKEN" --scope cpxagency \
            curl /api/health --deployment "$CANDIDATE_URL" > /tmp/health.json
          jq -e '.ok == true' /tmp/health.json >/dev/null

      - name: Capture current production rollback target
        id: previous
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_TEAM_ID&target=production&state=READY&limit=1" \
            -o /tmp/production.json
          PREV="$(jq -r '.deployments[0].url // empty' /tmp/production.json)"
          test -n "$PREV"
          echo "url=$PREV" >> "$GITHUB_OUTPUT"
          echo "Rollback target: $PREV"

      - name: Promote combined canonical artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@59.3.0 promote "$CANDIDATE_URL" --yes --token "$VERCEL_TOKEN" --scope cpxagency

      - name: Verify production apex
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl -fsS https://wedontcarecars.com/ -o /tmp/live.html \
              && grep -q 'intro-sequence' /tmp/live.html \
              && grep -q 'wdcc-logo-transparent.webp' /tmp/live.html \
              && grep -q 'wdcc-hero-v2.webp' /tmp/live.html \
              && grep -qi 'schedule a test drive' /tmp/live.html \
              && curl -fsS https://wedontcarecars.com/api/health -o /tmp/live-health.json \
              && jq -e '.ok == true' /tmp/live-health.json >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Roll back automatically if live verification fails
        if: steps.verify.outcome != 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREVIOUS_URL: ${{ steps.previous.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Production verification failed; restoring $PREVIOUS_URL"
          npx --yes vercel@59.3.0 promote "$PREVIOUS_URL" --yes --token "$VERCEL_TOKEN" --scope cpxagency
          exit 1

      - name: Publish automation proof
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          if [ "$VERIFY_OUTCOME" = "success" ]; then
            TITLE="WDCC 8AR + 2vfD production promotion passed"
            BODY="Candidate: \`$CANDIDATE_ID\` (\`$CANDIDATE_URL\`)\nCommit: \`$EXPECTED_COMMIT\`\nResult: candidate contract passed, promoted, and public apex verification passed."
          else
            TITLE="WDCC 8AR + 2vfD production promotion blocked or rolled back"
            BODY="Candidate: \`$CANDIDATE_ID\` (\`$CANDIDATE_URL\`)\nCommit: \`$EXPECTED_COMMIT\`\nResult: the gated promotion did not complete cleanly. Review this workflow run before another promotion."
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" || true

# Canonical composite: exact 2vfD storefront structure + exact 8AR intro.
# This workflow validates the immutable candidate before promotion and restores
# the previous production deployment automatically if post-promotion checks fail.
# Manual retrigger marker: 2026-08-24 production recovery.
