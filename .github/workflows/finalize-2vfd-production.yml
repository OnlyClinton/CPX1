name: Finalize WDCC 2vfD Production
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-2vfd-production.yml'
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: test -n "$VERCEL_TOKEN"
      - name: Allow Git-triggered production build to settle
        run: sleep 45
      - name: Promote exact 2vfD deployment last
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest promote wdcc-v32-storefront-a2wntmnnn-cpxagency.vercel.app --yes --token "$VERCEL_TOKEN" --scope cpxagency

# exact 2vfD baseline repin; path-scoped so future main improvements are not auto-overwritten
