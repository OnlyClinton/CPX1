name: Promote WDCC canonical production
on:
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: test -n "$VERCEL_TOKEN"
      - name: Promote validated 2vfD plus 8AR artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@59.3.0 promote wdcc-v32-storefront-dt496r4il-cpxagency.vercel.app --yes --token "$VERCEL_TOKEN" --scope cpxagency
      - name: Verify public apex
        run: |
          set -euo pipefail
          curl -fsS https://wedontcarecars.com/ -o /tmp/home.html
          grep -q 'wdcc-logo-transparent.webp' /tmp/home.html
          grep -q 'intro-sequence' /tmp/home.html
          grep -q 'SCHEDULE A TEST DRIVE' /tmp/home.html
          curl -fsS https://wedontcarecars.com/api/health | grep -q '"ok":true'

# Existing READY artifact only. Manual dispatch prevents quota churn.
