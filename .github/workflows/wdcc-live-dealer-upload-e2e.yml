name: WDCC Live Dealer Upload E2E
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-live-dealer-upload-e2e.yml'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      DEALER_PROJECT_ID: prj_fz5mN7Q5gImZ9UGpv1GDpHxPtLNB
      DEALER: https://dealer.wedontcarecars.com
      STOREFRONT: https://wedontcarecars.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - id: deps
        run: npm ci
      - name: Pull dealer production bindings
        id: bindings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          npm install --global vercel@59.3.0 >/dev/null
          mkdir -p /tmp/dealer/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$DEALER_PROJECT_ID" > /tmp/dealer/.vercel/project.json
          cd /tmp/dealer
          vercel env pull /tmp/dealer.env --yes --environment=production --token="$VERCEL_TOKEN" --scope=cpxagency >/dev/null
          grep -q '^BLOB_READ_WRITE_TOKEN=' /tmp/dealer.env
          grep -q '^SESSION_SECRET=' /tmp/dealer.env
      - name: Create short-lived signed dealer session
        id: session
        shell: bash
        run: |
          set -euo pipefail
          set -a; . /tmp/dealer.env; set +a
          node <<'NODE' > /tmp/session.env
          const crypto=require('crypto'); const {get}=require('@vercel/blob');
          (async()=>{const r=await get('private/state/platform-v3.json',{access:'private',useCache:false,token:process.env.BLOB_READ_WRITE_TOKEN});if(!r||r.statusCode!==200||!r.stream)throw Error('STATE_READ_FAILED');const chunks=[];for await(const c of r.stream)chunks.push(c);const s=JSON.parse(Buffer.concat(chunks).toString('utf8'));const roles=new Set(['dealer_agent','tenant_admin','platform_admin']);const u=(s.users||[]).find(x=>roles.has(String(x.role||'').toLowerCase())&&x.status!=='disabled'&&!x.disabled);if(!u)throw Error('NO_ACTIVE_DEALER_USER');const raw=Buffer.from(JSON.stringify({id:u.id,role:u.role,exp:Date.now()+1800000})).toString('base64url');const sig=crypto.createHmac('sha256',process.env.SESSION_SECRET).update(raw).digest('base64url');console.log(`QA_COOKIE=${raw}.${sig}`);console.log(`QA_USER_ID=${u.id}`)})().catch(e=>{console.error(e);process.exit(1)})
          NODE
          cat /tmp/session.env >> "$GITHUB_ENV"
      - name: Verify signed session through live dealer facade
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/session.json -w '%{http_code}' "$DEALER/api/auth/session" -H "Cookie: __Host-wdcc_session=$QA_COOKIE")"
          test "$code" = '200'
          jq -e '.authenticated==true' /tmp/session.json >/dev/null
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Install browser
        id: browserdeps
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Run exact dealer add-photo-publish flow
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          export RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node <<'NODE'
          const fs=require('fs');const{chromium}=require('playwright');
          (async()=>{const run=process.env.RUN_ID,dealer=process.env.DEALER,storefront=process.env.STOREFRONT,stock=`WDCC-QA-${run}`;fs.writeFileSync('/tmp/wdcc-qa.png',Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9WlV1GQAAAAASUVORK5CYII=','base64'));const b=await chromium.launch({headless:true});const c=await b.newContext({viewport:{width:390,height:844}});await c.addCookies([{name:'__Host-wdcc_session',value:process.env.QA_COOKIE,domain:'dealer.wedontcarecars.com',path:'/',httpOnly:true,secure:true,sameSite:'Strict'}]);const p=await c.newPage();await p.goto(`${dealer}/dealer/inventory/new`,{waitUntil:'networkidle'});if(p.url().includes('/dealer/login'))throw Error('SESSION_REDIRECTED_TO_LOGIN');await p.getByLabel('Year').fill('2019');await p.getByLabel('Make').fill('Toyota');await p.getByLabel('Model').fill(`E2E-${run}`);await p.getByLabel('Trim').fill('WDCC QA');await p.getByLabel('Cash Price').fill('12345');await p.getByLabel('Estimated Down Payment').fill('1500');await p.getByLabel('Mileage').fill('54321');await p.getByLabel('Stock #').fill(stock);await p.getByLabel('Description').fill('Automated WDCC production dealer upload verification. QA only.');await p.locator('input[type=file][multiple]').first().setInputFiles('/tmp/wdcc-qa.png');await p.getByRole('button',{name:'PUBLISH VEHICLE'}).click();await p.waitForURL(/\/dealer\?saved=published/,{timeout:60000});const r=await c.request.get(`${dealer}/api/inventory`,{headers:{Cookie:`__Host-wdcc_session=${process.env.QA_COOKIE}`}});const j=await r.json();const item=(j.items||[]).find(v=>v.stock===stock);if(!item)throw Error('PUBLISHED_VEHICLE_NOT_IN_DEALER_INVENTORY');const pi=await c.request.get(`${storefront}/api/inventory`);const pj=await pi.json();if(!(pj.items||[]).some(v=>v.stock===stock))throw Error('PUBLISHED_VEHICLE_NOT_VISIBLE_ON_STOREFRONT');const h=await c.request.patch(`${dealer}/api/inventory/${encodeURIComponent(item.id)}`,{headers:{Cookie:`__Host-wdcc_session=${process.env.QA_COOKIE}`,'content-type':'application/json'},data:{status:'draft',stock:`R36TEST-${stock}`}});if(!h.ok())throw Error(`QA_HIDE_FAILED_${h.status()}`);fs.writeFileSync('/tmp/result.json',JSON.stringify({ok:true,id:item.id,photoCount:(item.photoPathnames||[]).length||1,publicVisible:true},null,2));await b.close()})().catch(e=>{fs.writeFileSync('/tmp/result.json',JSON.stringify({ok:false,error:String(e.message||e)},null,2));console.error(e);process.exit(1)})
          NODE
          cat /tmp/result.json
          echo "vehicle_id=$(jq -r '.id // ""' /tmp/result.json)" >> "$GITHUB_OUTPUT"
          echo "photo_count=$(jq -r '.photoCount // 0' /tmp/result.json)" >> "$GITHUB_OUTPUT"
          echo "public_visible=$(jq -r '.publicVisible // false' /tmp/result.json)" >> "$GITHUB_OUTPUT"
      - name: Report dealer upload acceptance
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          DEPS: ${{ steps.deps.outcome }}
          BINDINGS: ${{ steps.bindings.outcome }}
          SESSION: ${{ steps.session.outcome }}
          AUTH: ${{ steps.auth.outcome }}
          AUTH_CODE: ${{ steps.auth.outputs.code }}
          BROWSERDEPS: ${{ steps.browserdeps.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          VEHICLE: ${{ steps.browser.outputs.vehicle_id }}
          PHOTOS: ${{ steps.browser.outputs.photo_count }}
          PUBLIC: ${{ steps.browser.outputs.public_visible }}
        shell: bash
        run: |
          err=''
          [ -f /tmp/result.json ] && err="$(jq -r '.error // ""' /tmp/result.json)"
          body=$(printf 'Status: **%s**\nDependencies: `%s`\nBindings: `%s`\nSigned-session creation: `%s`\nLive auth check: `%s` HTTP `%s`\nBrowser install: `%s`\nDealer UI publish flow: `%s`\nVehicle: `%s`\nPhotos: `%s`\nPublic visible: `%s`\nError: `%s`' "$STATUS" "$DEPS" "$BINDINGS" "$SESSION" "$AUTH" "$AUTH_CODE" "$BROWSERDEPS" "$BROWSER" "$VEHICLE" "$PHOTOS" "$PUBLIC" "$err")
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC dealer upload diagnostic ${GITHUB_SHA:0:7}" --body "$body" || true
