name: Repair WDCC QA Harness Bindings
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-qa-harness-repair.yml'
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove Vercel env-name collision from QA workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          for name in ['.github/workflows/wdcc-live-dealer-upload-e2e.yml','.github/workflows/wdcc-ledger-reset.yml']:
              p=Path(name)
              s=p.read_text()
              old='vercel env pull /tmp/dealer.env --yes --environment=production --token="$VERCEL_TOKEN" --scope=cpxagency >/dev/null'
              new='env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env pull /tmp/dealer.env --yes --environment=production --token="$VERCEL_TOKEN" --scope=cpxagency >/dev/null'
              if old not in s:
                  raise SystemExit(f'expected binding command not found in {name}')
              p.write_text(s.replace(old,new))
          PY
      - name: Commit QA harness repair
        run: |
          git config user.name "WDCC QA Bot"
          git config user.email "wdcc-qa@users.noreply.github.com"
          git add .github/workflows/wdcc-live-dealer-upload-e2e.yml .github/workflows/wdcc-ledger-reset.yml
          git commit -m "Fix QA dealer binding environment collision"
          git push origin HEAD:main

# One-shot harness repair. The resulting commit intentionally retriggers the two path-scoped QA workflows.
