name: WDCC One Shot Source Corrector

on:
  push:
    branches:
      - fix/wdcc-locked-contract-20260826

permissions:
  contents: write

concurrency:
  group: wdcc-one-shot-source-corrector
  cancel-in-progress: true

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Enforce owner source and proof contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def ensure_replace(path, old, new, label):
              p=Path(path)
              s=p.read_text()
              if old in s:
                  p.write_text(s.replace(old,new,1))
                  return
              if new not in s:
                  raise SystemExit(f'{label}_PATTERN_NOT_FOUND')

          p=Path('app/ReferenceCloneHome.tsx')
          s=p.read_text()
          old='<div className="rh-hero-actions"><Link className="rh-btn red" href="/inventory">Browse cars →</Link><Link className="rh-btn dark" href="/get-approved?source=hero-get-approved">Get approved →</Link></div>'
          new='<div className="rh-hero-actions"><Link className="rh-btn red" href="/get-approved" aria-label="GET PRE-APPROVED">GET PRE-APPROVED</Link><Link className="rh-btn dark" href="/inventory" aria-label="BROWSE INVENTORY">BROWSE INVENTORY</Link></div>'
          if old in s:
              p.write_text(s.replace(old,new,1))
          elif new not in s:
              raise SystemExit('CTA_SOURCE_PATTERN_NOT_FOUND')

          ensure_replace(
              '.github/workflows/wdcc-strict-visual-gate.yml',
              """              await m.goto(`${base}/?strict=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
              await m.locator('.li-badge img').waitFor({state:'visible',timeout:12000});""",
              """              await m.goto(`${base}/?strict=${Date.now()}`,{waitUntil:'commit',timeout:30000});
              await m.locator('.li').waitFor({state:'attached',timeout:5000});
              await m.locator('.li-badge img').waitFor({state:'visible',timeout:5000});""",
              'STRICT_INTRO_CAPTURE'
          )

          ensure_replace(
              '.github/workflows/wdcc-immutable-device-proof.yml',
              """              await p.goto(`${url}/?device=${name}&t=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
              await waitImg(p,'.li-scene img',1000); await waitImg(p,'.li-badge img',200); await p.waitForTimeout(350);""",
              """              await p.goto(`${url}/?device=${name}&t=${Date.now()}`,{waitUntil:'commit',timeout:30000});
              await p.locator('.li').waitFor({state:'attached',timeout:5000});
              await waitImg(p,'.li-scene img',1000); await waitImg(p,'.li-badge img',200); await p.waitForTimeout(350);""",
              'IMMUTABLE_MOBILE_INTRO_CAPTURE'
          )

          ensure_replace(
              '.github/workflows/wdcc-immutable-device-proof.yml',
              """              await p.goto(`${url}/?desktop=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
              await waitImg(p,'.li-scene img',1000); await finishIntro(p); await waitInventory(p);""",
              """              await p.goto(`${url}/?desktop=${Date.now()}`,{waitUntil:'commit',timeout:30000});
              await p.locator('.li').waitFor({state:'attached',timeout:5000});
              await waitImg(p,'.li-scene img',1000); await finishIntro(p); await waitInventory(p);""",
              'IMMUTABLE_DESKTOP_INTRO_CAPTURE'
          )
          PY
          grep -q 'href="/get-approved" aria-label="GET PRE-APPROVED">GET PRE-APPROVED<' app/ReferenceCloneHome.tsx
          grep -q "waitUntil:'commit'" .github/workflows/wdcc-strict-visual-gate.yml
          test "$(grep -c "waitUntil:'commit'" .github/workflows/wdcc-immutable-device-proof.yml)" -ge 2
      - name: Commit correction only when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/ReferenceCloneHome.tsx .github/workflows/wdcc-strict-visual-gate.yml .github/workflows/wdcc-immutable-device-proof.yml; then
            echo 'Owner source and proof contracts already correct.'
            exit 0
          fi
          git config user.name 'wdcc-visual-gate'
          git config user.email '120651995+OnlyClinton@users.noreply.github.com'
          git add app/ReferenceCloneHome.tsx .github/workflows/wdcc-strict-visual-gate.yml .github/workflows/wdcc-immutable-device-proof.yml
          git commit -m 'fix(wdcc): make exact visual proof race-safe'
          git push origin HEAD:fix/wdcc-locked-contract-20260826
