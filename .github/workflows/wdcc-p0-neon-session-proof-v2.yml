name: WDCC P0 Neon Native Session Proof V2

on:
  push:
    branches: [proof/wdcc-p0-neon-session-e3332fea]
    paths:
      - '.github/workflows/wdcc-p0-neon-session-proof-v2.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: e3332fea49587f41cfd15cb041ebba6eb6db68d4
      STATE_WORKER: wdcc-neon-session-proof-v2-state
      APP_WORKER: wdcc-neon-session-proof-v2-app
      STATE_URL: https://wdcc-neon-session-proof-v2-state.clico-global.workers.dev
      APP_URL: https://wdcc-neon-session-proof-v2-app.clico-global.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WDCC_DEALER_E2E_PASSWORD: ${{ secrets.WDCC_DEALER_E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate exact app source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"; test -n "${CLOUDFLARE_ACCOUNT_ID:-}"; test -n "${WDCC_DEALER_E2E_PASSWORD:-}"
          git cat-file -e "$SOURCE_SHA^{commit}"
          test "$(git merge-base HEAD "$SOURCE_SHA")" = "$SOURCE_SHA"
          test -z "$(git diff --name-only "$SOURCE_SHA..HEAD" -- app lib public package.json package-lock.json next.config.ts tsconfig.json)"
          grep -Fq 'return neonCurrentUser();' lib/auth.ts
          grep -Fq 'sessionAuthority()' app/api/health/route.ts
          ! grep -Fq 'sessionCookieHeader(user)' app/api/auth/login/route.ts
      - name: Build exact candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0 >/dev/null
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
      - name: Deploy isolated no-route state and app
        shell: bash
        run: |
          set -euo pipefail
          umask 077; openssl rand -hex 32 > /tmp/state.token
          node - <<'NODE'
          const fs=require('fs');const common={compatibility_date:'2026-08-25',compatibility_flags:['nodejs_compat'],workers_dev:true,preview_urls:true,observability:{enabled:true}};
          fs.writeFileSync('wrangler.proof-state.jsonc',JSON.stringify({...common,name:process.env.STATE_WORKER,main:'cloudflare/wdcc-state-worker.mjs',durable_objects:{bindings:[{name:'WDCC_STATE',class_name:'WDCCState'}]},migrations:[{tag:'v1',new_sqlite_classes:['WDCCState']}]},null,2));
          fs.writeFileSync('wrangler.proof-app.jsonc',JSON.stringify({...common,name:process.env.APP_WORKER,main:'.open-next/worker.js',assets:{directory:'.open-next/assets',binding:'ASSETS',run_worker_first:false},vars:{WDCC_RUNTIME_ROLE:'canonical',WDCC_STATE_SERVICE_URL:process.env.STATE_URL}},null,2));
          NODE
          ! grep -Eq '"routes?"|"custom_domains?"' wrangler.proof-state.jsonc
          ! grep -Eq '"routes?"|"custom_domains?"' wrangler.proof-app.jsonc
          npx wrangler deploy --config wrangler.proof-state.jsonc 2>&1 | tee /tmp/state.log
          grep -Fq "$STATE_URL" /tmp/state.log
          cat /tmp/state.token | npx wrangler secret put WDCC_STATE_SERVICE_TOKEN --name "$STATE_WORKER" >/dev/null
          cat > /tmp/state.json <<'JSON'
          {"revision":1,"tenants":[{"id":"wdcc","name":"We Don’t Care Cars","status":"active"}],"users":[{"id":"wdcc-admin-neon-bridge","tenantId":"wdcc","email":"admin@internal.wedontcarecars.com","username":"admin","loginAlias":"admin","aliases":["admin"],"displayName":"WDCC Admin","role":"platform_admin","status":"active"},{"id":"wdcc-dealer-neon-bridge","tenantId":"wdcc","email":"dealer@internal.wedontcarecars.com","username":"dealer","loginAlias":"dealer","aliases":["dealer"],"displayName":"WDCC Dealer","role":"dealer_agent","status":"active"}],"vehicles":[],"leads":[],"audit":[]}
          JSON
          token="$(cat /tmp/state.token)"
          test "$(curl --http1.1 -sS -X PUT -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data-binary @/tmp/state.json -o /tmp/put.json -w '%{http_code}' "$STATE_URL/state")" = 200
          npx wrangler deploy --config wrangler.proof-app.jsonc 2>&1 | tee /tmp/app.log
          grep -Fq "$APP_URL" /tmp/app.log
          cat /tmp/state.token | npx wrangler secret put WDCC_STATE_SERVICE_TOKEN --name "$APP_WORKER" >/dev/null
          ok=0
          for i in $(seq 1 20); do
            c="$(curl --http1.1 -sS -o /tmp/health.json -w '%{http_code}' "$APP_URL/api/health?proof=$GITHUB_RUN_ID-$i" || true)"
            if [ "$c" = 200 ] && jq -e '.ok==true and .state=="readable" and .storage=="cloudflare-do" and .session=="neon"' /tmp/health.json >/dev/null; then ok=1;break;fi
            sleep 2
          done
          test "$ok" = 1
      - name: Real Neon login then protected create and exact cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '::add-mask::%s\n' "$WDCC_DEALER_E2E_PASSWORD"
          state_token="$(cat /tmp/state.token)"; qa_id=''
          cleanup(){ set +e; if [ -n "$qa_id" ]; then curl --http1.1 -sS -H "Authorization: Bearer $state_token" "$STATE_URL/state" -o /tmp/cstate.json; QA_ID="$qa_id" node - <<'NODE'
          const fs=require('fs');const s=JSON.parse(fs.readFileSync('/tmp/cstate.json'));const id=process.env.QA_ID;s.vehicles=(s.vehicles||[]).filter(v=>String(v?.id)!==id);s.audit=(s.audit||[]).filter(a=>String(a?.vehicleId||'')!==id);s.revision=Number(s.revision||0)+1;fs.writeFileSync('/tmp/cnext.json',JSON.stringify(s));
          NODE
          curl --http1.1 -sS -X PUT -H "Authorization: Bearer $state_token" -H 'Content-Type: application/json' --data-binary @/tmp/cnext.json "$STATE_URL/state" -o /tmp/cput.json; fi; }
          trap cleanup EXIT INT TERM ERR
          jq -nc --arg p "$WDCC_DEALER_E2E_PASSWORD" '{username:"dealer",password:$p}' > /tmp/login.json
          test "$(curl --http1.1 -sS -c /tmp/dealer.jar -X POST -H 'Content-Type: application/json' --data-binary @/tmp/login.json -o /tmp/login-out.json -w '%{http_code}' "$APP_URL/api/auth/login")" = 200
          jq -e '.ok==true' /tmp/login-out.json >/dev/null
          test "$(curl --http1.1 -sS -b /tmp/dealer.jar -o /tmp/session.json -w '%{http_code}' "$APP_URL/api/auth/session")" = 200
          jq -e '.authenticated==true and (.user.role=="dealer_agent" or .user.role=="dealer")' /tmp/session.json >/dev/null
          stock="WDCC-QA-NEON-$GITHUB_RUN_ID"; payload="$(jq -nc --arg stock "$stock" '{year:2021,make:"WDCC",model:"Neon Proof",price:19999,downPayment:1000,mileage:111,stock:$stock,internalOnly:true}')"
          test "$(curl --http1.1 -sS -b /tmp/dealer.jar -X POST -H 'Content-Type: application/json' --data "$payload" -o /tmp/create.json -w '%{http_code}' "$APP_URL/api/inventory")" = 201
          qa_id="$(jq -r '.item.id // empty' /tmp/create.json)"; test -n "$qa_id"
          test "$(curl --http1.1 -sS -b /tmp/dealer.jar -o /tmp/readback.json -w '%{http_code}' "$APP_URL/api/inventory/$qa_id")" = 200
          cleanup; qa_id=''; trap - EXIT INT TERM ERR
          echo 'NEON_NATIVE_SESSION_MUTATION=PASS'
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '## Neon-native P0 proof: production routes/DNS/aliases untouched; SESSION_SECRET not injected.' >> "$GITHUB_STEP_SUMMARY"
          rm -f /tmp/state.token /tmp/dealer.jar /tmp/login.json
