name: WDCC Execute Frozen Release 188392c

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-release-execute-188392c.yml'
  workflow_dispatch:

concurrency:
  group: wdcc-execute-frozen-188392c
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  TEAM: cpxagency
  ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
  CANDIDATE_SHA: 188392c81696da5d0d61f5c6f0bec45f490a232d
  PHOENIX_PROJECT: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
  STOREFRONT_PROJECT: prj_We7xkAkB5Qy31Pt17USSkQFE0u7h
  CANONICAL_BACKEND: https://wdcc-cpx-launch-cpxagency.vercel.app
  DEALER_DOMAIN: dealer.wedontcarecars.com
  STOREFRONT_DOMAIN: wedontcarecars.com
  WWW_DOMAIN: www.wedontcarecars.com
  DEALER_SAFE_FALLBACK: wdcc-cpx-launch-b01un0onc-cpxagency.vercel.app

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@v4
        with:
          ref: 188392c81696da5d0d61f5c6f0bec45f490a232d
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prove candidate and install tooling
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -n "$VERCEL_TOKEN"
          npm ci
          npm install --global vercel@59.3.0 >/dev/null
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          echo "FROZEN_CANDIDATE=PASS"

      - name: Capture current production rollback targets
        shell: bash
        run: |
          set -euo pipefail
          get_prev(){
            project="$1"
            curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v6/deployments?projectId=${project}&target=production&state=READY&limit=1&teamId=${ORG_ID}" | jq -r '.deployments[0].url // empty'
          }
          PREV_PHOENIX="$(get_prev "$PHOENIX_PROJECT")"
          PREV_STOREFRONT="$(get_prev "$STOREFRONT_PROJECT")"
          test -n "$PREV_PHOENIX"
          test -n "$PREV_STOREFRONT"
          echo "PREV_PHOENIX=https://$PREV_PHOENIX" >> "$GITHUB_ENV"
          echo "PREV_STOREFRONT=https://$PREV_STOREFRONT" >> "$GITHUB_ENV"
          echo "ROLLBACK_TARGETS=CAPTURED"

      - name: Deploy frozen candidate to Phoenix without domain movement
        id: phoenix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel .next
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$PHOENIX_PROJECT" > .vercel/project.json
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" >/dev/null
          vercel build --prod --token="$VERCEL_TOKEN" --scope="$TEAM"
          url="$(vercel deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN" --scope="$TEAM" | tail -n1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "PHOENIX_CANDIDATE_URL=$url" >> "$GITHUB_ENV"

      - name: Verify Phoenix candidate contract
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 15); do
            code="$(curl -sS -o /tmp/phx-health.json -w '%{http_code}' "$PHOENIX_CANDIDATE_URL/api/health" || true)"
            if [ "$code" = 200 ] && jq -e '.ok==true' /tmp/phx-health.json >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1 || { cat /tmp/phx-health.json || true; exit 1; }
          code="$(curl -sS -o /tmp/phx-inventory.json -w '%{http_code}' "$PHOENIX_CANDIDATE_URL/api/inventory")"
          test "$code" = 200
          jq -e '.ok==true and (.items|type=="array")' /tmp/phx-inventory.json >/dev/null
          echo "PHOENIX_CONTRACT=PASS"

      - name: Deploy frozen candidate to storefront without domain movement
        id: storefront
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel .next
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$STOREFRONT_PROJECT" > .vercel/project.json
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" >/dev/null
          vercel build --prod --token="$VERCEL_TOKEN" --scope="$TEAM"
          url="$(vercel deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN" --scope="$TEAM" | tail -n1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "STOREFRONT_CANDIDATE_URL=$url" >> "$GITHUB_ENV"

      - name: Verify storefront JSON and browser contract
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/store-health.json -w '%{http_code}' "$STOREFRONT_CANDIDATE_URL/api/health")"
          test "$code" = 200
          jq -e '.ok==true' /tmp/store-health.json >/dev/null
          code="$(curl -sS -o /tmp/store-inventory.json -w '%{http_code}' "$STOREFRONT_CANDIDATE_URL/api/inventory?release=$GITHUB_RUN_ID")"
          test "$code" = 200
          jq -e '.ok==true and (.items|type=="array")' /tmp/store-inventory.json >/dev/null
          export STORE="$STOREFRONT_CANDIDATE_URL"
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:390,height:844},reducedMotion:'reduce'});const errors=[],n404=[];p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});p.on('pageerror',e=>errors.push(String(e)));p.on('response',r=>{if(r.status()===404)n404.push(r.url())});await p.goto(process.env.STORE,{waitUntil:'networkidle'});if(!(await p.locator('img[src*="wdcc-logo-transparent.webp"]').count()))throw Error('CANONICAL_LOGO_MISSING');if(!(await p.locator('nav.stickyCtaBar[aria-label="Quick actions"]').count()))throw Error('MOBILE_QUICK_ACTIONS_MISSING');if(!(await p.locator('a[href^="/schedule-test-drive"]').count()))throw Error('MOBILE_TEST_DRIVE_MISSING');if(!(await p.locator('a[href^="/get-approved"]').count()))throw Error('MOBILE_APPROVAL_MISSING');if(!(await p.getByText('CALL SEAN',{exact:true}).count()))throw Error('MOBILE_CALL_SEAN_MISSING');if(n404.length)throw Error('BROWSER_404:'+n404.join(','));if(errors.length)throw Error('BROWSER_ERRORS:'+errors.join(' | '));await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          echo "STOREFRONT_BROWSER_CONTRACT=PASS"

      - name: Pull Phoenix production ledger authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phxenv/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$PHOENIX_PROJECT" > /tmp/phxenv/.vercel/project.json
          cd /tmp/phxenv
          vercel env pull /tmp/phoenix.env --yes --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" >/dev/null
          grep -q '^BLOB_READ_WRITE_TOKEN=' /tmp/phoenix.env || { echo 'BLOB_READ_WRITE_TOKEN unavailable to acceptance runner' >&2; exit 1; }
          grep -q '^SESSION_SECRET=' /tmp/phoenix.env

      - name: Inject short-lived release QA users
        shell: bash
        run: |
          set -euo pipefail
          set -a; . /tmp/phoenix.env; set +a
          export RUN_TAG="release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';import fs from 'node:fs';import {get,head,put} from '@vercel/blob';
          const token=process.env.BLOB_READ_WRITE_TOKEN,path='private/state/platform-v3.json',run=process.env.RUN_TAG;
          const h=await head(path,{token});const r=await get(path,{access:'private',useCache:false,token});if(!r||r.statusCode!==200||!r.stream)throw Error('STATE_READ_FAILED');const chunks=[];for await(const c of r.stream)chunks.push(c);const raw=Buffer.concat(chunks);const s=JSON.parse(raw.toString('utf8'));const now=new Date().toISOString();const password=`Wdcc-Release-${crypto.randomBytes(18).toString('base64url')}!`;const hash=v=>{const salt=crypto.randomBytes(24);const d=crypto.scryptSync(v,salt,64);return `scrypt$${salt.toString('base64url')}$${d.toString('base64url')}`};const dealerId=`release-dealer-${crypto.randomUUID()}`,adminId=`release-admin-${crypto.randomUUID()}`,dealerEmail=`release-dealer-${run}@invalid.example`,adminEmail=`release-admin-${run}@invalid.example`;s.users=Array.isArray(s.users)?s.users:[];s.users.push({id:dealerId,email:dealerEmail,username:dealerEmail,displayName:`WDCC Release Dealer ${run}`,role:'dealer_agent',tenantId:'wdcc',status:'active',disabled:false,passwordHash:hash(password)});s.users.push({id:adminId,email:adminEmail,username:adminEmail,displayName:`WDCC Release Admin ${run}`,role:'platform_admin',tenantId:'wdcc',status:'active',disabled:false,passwordHash:hash(password)});s.audit=Array.isArray(s.audit)?s.audit:[];s.audit.push({id:crypto.randomUUID(),at:now,action:'release.acceptance.users_create',actor:'github-actions',run,dealerId,adminId});s.revision=Number(s.revision||0)+1;s.updatedAt=now;const backup=`private/state/backups/platform-v3-pre-release-${run}-${crypto.randomUUID()}.json`;await put(backup,raw,{access:'private',addRandomSuffix:false,allowOverwrite:false,contentType:'application/json',token});await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:h.etag,token});fs.writeFileSync('/tmp/release-qa.env',`RUN_TAG=${run}\nQA_PASSWORD=${password}\nDEALER_ID=${dealerId}\nDEALER_EMAIL=${dealerEmail}\nADMIN_ID=${adminId}\nADMIN_EMAIL=${adminEmail}\nBACKUP=${backup}\n`);
          NODE
          set -a; . /tmp/release-qa.env; set +a
          printf '::add-mask::%s\n' "$QA_PASSWORD"

      - name: Auth, role, lead, dashboard, vehicle, media and public visibility acceptance
        id: acceptance
        shell: bash
        run: |
          set -euo pipefail
          set -a; . /tmp/release-qa.env; . /tmp/phoenix.env; set +a
          printf '::add-mask::%s\n' "$QA_PASSWORD"
          login(){ label="$1"; email="$2"; expected="$3"; payload="$(jq -nc --arg email "$email" --arg password "$QA_PASSWORD" '{email:$email,password:$password}')"; code="$(curl -sS -D "/tmp/${label}-headers" -c "/tmp/${label}.cookies" -o "/tmp/${label}-login.json" -w '%{http_code}' -H "Origin: $PHOENIX_CANDIDATE_URL" -H 'content-type: application/json' -X POST "$PHOENIX_CANDIDATE_URL/api/auth/login" --data "$payload")"; test "$code" = 200; curl -fsS -b "/tmp/${label}.cookies" "$PHOENIX_CANDIDATE_URL/api/auth/session" > "/tmp/${label}-session.json"; jq -e --arg role "$expected" '.authenticated==true and ((.user.role|ascii_downcase)==($role|ascii_downcase))' "/tmp/${label}-session.json" >/dev/null; }
          login dealer "$DEALER_EMAIL" dealer_agent
          login admin "$ADMIN_EMAIL" platform_admin
          dealer_admin_code="$(curl -sS -b /tmp/dealer.cookies -o /tmp/dealer-admin.json -w '%{http_code}' "$PHOENIX_CANDIDATE_URL/api/admin/users")"
          case "$dealer_admin_code" in 401|403) ;; *) echo "dealer role boundary failed: $dealer_admin_code" >&2; exit 1;; esac
          curl -fsS -b /tmp/admin.cookies "$PHOENIX_CANDIDATE_URL/api/admin/users" | jq -e '.ok==true' >/dev/null

          postlead(){ kind="$1"; suffix="$2"; qa="$3"; key="wdcc-release-${suffix}-${RUN_TAG}"; if [ "$qa" = true ]; then q=',"qa":true'; email="release-${suffix}-${RUN_TAG}@invalid.example"; name="WDCC QA RELEASE ${suffix} ${RUN_TAG}"; else q=''; email="release-acceptance-${RUN_TAG}@example.com"; name="WDCC RELEASE ACCEPTANCE ${RUN_TAG}"; fi; body="{\"kind\":\"$kind\",\"name\":\"$name\",\"phone\":\"813-555-0199\",\"email\":\"$email\",\"message\":\"Automated WDCC release acceptance. Do not contact.\",\"consent\":true,\"source\":\"release-$suffix\"$q}"; code="$(curl -sS -o "/tmp/${suffix}.json" -w '%{http_code}' -H 'content-type: application/json' -H "Idempotency-Key: $key" -X POST "$STOREFRONT_CANDIDATE_URL/api/leads" --data "$body")"; case "$code" in 200|201) ;; *) cat "/tmp/${suffix}.json" >&2; exit 1;; esac; jq -e '.ok==true and .persisted==true and .item.id!=null' "/tmp/${suffix}.json" >/dev/null; }
          postlead schedule schedule false
          postlead approval approval true
          postlead contact contact true
          SCHEDULE_ID="$(jq -r '.item.id' /tmp/schedule.json)"; APPROVAL_ID="$(jq -r '.item.id' /tmp/approval.json)"; CONTACT_ID="$(jq -r '.item.id' /tmp/contact.json)"
          printf '%s\n%s\n%s\n' "$SCHEDULE_ID" "$APPROVAL_ID" "$CONTACT_ID" > /tmp/release-lead-ids.txt
          email_status="$(jq -r '.notifications.email // "unknown"' /tmp/schedule.json)"
          test "$email_status" = sent || { echo "EMAIL_NOTIFICATION_NOT_SENT:$email_status" >&2; exit 1; }
          curl -fsS -b /tmp/dealer.cookies "$PHOENIX_CANDIDATE_URL/api/leads" > /tmp/leads-feed.json
          jq -e --arg s "$SCHEDULE_ID" --arg a "$APPROVAL_ID" --arg c "$CONTACT_ID" '(.items//[]) as $x | any($x[];.id==$s) and any($x[];.id==$a) and any($x[];.id==$c)' /tmp/leads-feed.json >/dev/null

          stock="REL-${GITHUB_RUN_ID}"
          body="$(jq -nc --arg stock "$stock" '{year:2019,make:"Toyota",model:"Camry",trim:"Release acceptance",price:12345,downPayment:1500,mileage:54321,stock:$stock,description:"Automated transient WDCC release acceptance vehicle."}')"
          code="$(curl -sS -b /tmp/dealer.cookies -o /tmp/vehicle.json -w '%{http_code}' -H 'content-type: application/json' -X POST "$PHOENIX_CANDIDATE_URL/api/inventory" --data "$body")"
          test "$code" = 201
          VEHICLE_ID="$(jq -r '.item.id' /tmp/vehicle.json)"; test -n "$VEHICLE_ID"; echo "$VEHICLE_ID" > /tmp/release-vehicle-id.txt
          export VEHICLE_ID RUN_TAG
          node --input-type=module <<'NODE'
          import {put} from '@vercel/blob';const token=process.env.BLOB_READ_WRITE_TOKEN,id=process.env.VEHICLE_ID,run=process.env.RUN_TAG;const png=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9WlV1GQAAAAASUVORK5CYII=','base64');const p=`media/wdcc/${id}/release-${run}.png`;await put(p,png,{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'image/png',token});console.log(p);
          NODE
          media="media/wdcc/${VEHICLE_ID}/release-${RUN_TAG}.png"
          patch="$(jq -nc --arg p "$media" '{photoPathnames:[$p],primaryPhotoPathname:$p}')"
          curl -fsS -b /tmp/dealer.cookies -H 'content-type: application/json' -X PATCH "$PHOENIX_CANDIDATE_URL/api/inventory/$VEHICLE_ID" --data "$patch" | jq -e '.ok==true' >/dev/null
          curl -fsS "$PHOENIX_CANDIDATE_URL/api/media?p=$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))' "$media")" >/tmp/media.bin
          test -s /tmp/media.bin
          curl -fsS -b /tmp/dealer.cookies -H 'content-type: application/json' -X PATCH "$PHOENIX_CANDIDATE_URL/api/inventory/$VEHICLE_ID" --data '{"status":"published"}' | jq -e '.ok==true and .item.status=="published"' >/dev/null
          curl -fsS "$STOREFRONT_CANDIDATE_URL/api/inventory?public=$GITHUB_RUN_ID" > /tmp/public.json
          jq -e --arg id "$VEHICLE_ID" 'any((.items//[])[];.id==$id)' /tmp/public.json >/dev/null
          hide="$(jq -nc --arg stock "R36TEST-$stock" '{status:"draft",stock:$stock}')"
          curl -fsS -b /tmp/dealer.cookies -H 'content-type: application/json' -X PATCH "$PHOENIX_CANDIDATE_URL/api/inventory/$VEHICLE_ID" --data "$hide" | jq -e '.ok==true' >/dev/null
          curl -fsS "$STOREFRONT_CANDIDATE_URL/api/inventory?hidden=$GITHUB_RUN_ID" > /tmp/public-hidden.json
          jq -e --arg id "$VEHICLE_ID" 'all((.items//[])[];.id!=$id)' /tmp/public-hidden.json >/dev/null

          export DEALER_COOKIE="$(awk '$6=="__Host-wdcc_session"{print $7}' /tmp/dealer.cookies | tail -1)"
          export ADMIN_COOKIE="$(awk '$6=="__Host-wdcc_session"{print $7}' /tmp/admin.cookies | tail -1)"
          printf '::add-mask::%s\n' "$DEALER_COOKIE"; printf '::add-mask::%s\n' "$ADMIN_COOKIE"
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const phx=process.env.PHOENIX_CANDIDATE_URL;for(const [name,cookie,paths] of [['dealer',process.env.DEALER_COOKIE,['/dealer','/dealer/leads','/dealer/inventory']],['admin',process.env.ADMIN_COOKIE,['/admin','/admin/users']]]){const c=await b.newContext({viewport:{width:1440,height:1000}});await c.addCookies([{name:'__Host-wdcc_session',value:cookie,url:phx}]);const p=await c.newPage();for(const path of paths){await p.goto(phx+path,{waitUntil:'networkidle'});if(p.url().includes('/login'))throw Error(`${name.toUpperCase()}_${path}_REDIRECTED_TO_LOGIN`);}await c.close();}await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          echo "FULL_PREPROMOTION_ACCEPTANCE=PASS"

      - name: Cleanup release acceptance records
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [ -f /tmp/phoenix.env ] || exit 0
          set -a; . /tmp/phoenix.env; [ -f /tmp/release-qa.env ] && . /tmp/release-qa.env; set +a
          export IDS_FILE=/tmp/release-lead-ids.txt VEHICLE_FILE=/tmp/release-vehicle-id.txt
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';import fs from 'node:fs';import {get,head,put} from '@vercel/blob';const token=process.env.BLOB_READ_WRITE_TOKEN;if(!token)process.exit(0);const path='private/state/platform-v3.json';const h=await head(path,{token});const r=await get(path,{access:'private',useCache:false,token});if(!r||r.statusCode!==200||!r.stream)process.exit(0);const chunks=[];for await(const c of r.stream)chunks.push(c);const raw=Buffer.concat(chunks);const s=JSON.parse(raw.toString('utf8'));const ids=fs.existsSync(process.env.IDS_FILE)?new Set(fs.readFileSync(process.env.IDS_FILE,'utf8').trim().split(/\s+/).filter(Boolean)):new Set();const vehicleId=fs.existsSync(process.env.VEHICLE_FILE)?fs.readFileSync(process.env.VEHICLE_FILE,'utf8').trim():'';const userIds=new Set([process.env.DEALER_ID,process.env.ADMIN_ID].filter(Boolean));s.users=(s.users||[]).filter(u=>!userIds.has(u.id));s.leads=(s.leads||[]).filter(l=>!ids.has(l.id));if(vehicleId)s.vehicles=(s.vehicles||[]).filter(v=>v.id!==vehicleId);const now=new Date().toISOString();s.audit=(s.audit||[]).filter(a=>!ids.has(a.leadId)&&a.vehicleId!==vehicleId&&!userIds.has(a.actor));s.audit.push({id:crypto.randomUUID(),at:now,action:'release.acceptance.cleanup',actor:'github-actions',run:process.env.RUN_TAG||null});s.revision=Number(s.revision||0)+1;s.updatedAt=now;const backup=`private/state/backups/platform-v3-release-clean-${now.replace(/[:.]/g,'-')}-${crypto.randomUUID()}.json`;await put(backup,raw,{access:'private',addRandomSuffix:false,allowOverwrite:false,contentType:'application/json',token});await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:h.etag,token});console.log(JSON.stringify({ok:true,leadsRemoved:ids.size,vehicleRemoved:Boolean(vehicleId),usersRemoved:userIds.size,backup}));
          NODE

      - name: Promote only after every P0 check passes
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rollback(){
            echo 'Post-promotion verification failed; restoring prior production routing' >&2
            mkdir -p /tmp/rb-phx/.vercel; printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$PHOENIX_PROJECT" > /tmp/rb-phx/.vercel/project.json
            (cd /tmp/rb-phx && vercel promote "$PREV_PHOENIX" --yes --token="$VERCEL_TOKEN" --scope="$TEAM" >/dev/null 2>&1 || true)
            npx --yes vercel@59.3.0 alias set "$DEALER_SAFE_FALLBACK" "$DEALER_DOMAIN" --token="$VERCEL_TOKEN" --scope="$TEAM" >/dev/null 2>&1 || true
            mkdir -p /tmp/rb-store/.vercel; printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$STOREFRONT_PROJECT" > /tmp/rb-store/.vercel/project.json
            (cd /tmp/rb-store && vercel promote "$PREV_STOREFRONT" --yes --token="$VERCEL_TOKEN" --scope="$TEAM" >/dev/null 2>&1 || true)
          }
          trap rollback ERR
          mkdir -p /tmp/promote-phx/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$PHOENIX_PROJECT" > /tmp/promote-phx/.vercel/project.json
          (cd /tmp/promote-phx && vercel promote "$PHOENIX_CANDIDATE_URL" --yes --token="$VERCEL_TOKEN" --scope="$TEAM")
          npx --yes vercel@59.3.0 alias set "${PHOENIX_CANDIDATE_URL#https://}" "$DEALER_DOMAIN" --token="$VERCEL_TOKEN" --scope="$TEAM"
          sleep 4
          curl -fsS "https://$DEALER_DOMAIN/api/health" | jq -e '.ok==true' >/dev/null
          curl -fsS "$CANONICAL_BACKEND/api/health" | jq -e '.ok==true' >/dev/null

          mkdir -p /tmp/promote-store/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$STOREFRONT_PROJECT" > /tmp/promote-store/.vercel/project.json
          (cd /tmp/promote-store && vercel promote "$STOREFRONT_CANDIDATE_URL" --yes --token="$VERCEL_TOKEN" --scope="$TEAM")
          sleep 4
          curl -fsS "https://$STOREFRONT_DOMAIN/api/health" | jq -e '.ok==true' >/dev/null
          curl -fsS "https://$STOREFRONT_DOMAIN/api/inventory?release=post" | jq -e '.ok==true and (.items|type=="array")' >/dev/null
          curl -fsS "https://$STOREFRONT_DOMAIN/" | grep -qi 'wdcc-logo-transparent.webp'
          trap - ERR
          echo "WDCC_FROZEN_RELEASE_PROMOTED=PASS"

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          status="${{ job.status }}"
          body=$(cat <<EOF
          Frozen candidate: \`$CANDIDATE_SHA\`
          Job status: **$status**
          Phoenix candidate: \`${PHOENIX_CANDIDATE_URL:-not-created}\`
          Storefront candidate: \`${STOREFRONT_CANDIDATE_URL:-not-created}\`
          Prior Phoenix: \`${PREV_PHOENIX:-unknown}\`
          Prior storefront: \`${PREV_STOREFRONT:-unknown}\`

          Policy: no production alias movement occurs unless every pre-promotion P0 acceptance check passes. Cleanup runs regardless. Promotion has rollback protection.
          EOF
          )
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC frozen release execution ${GITHUB_RUN_ID}: $status" --body "$body" || true
