name: WDCC Frozen Release 188392c — BLOCKED

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-frozen-release-188392c
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 188392c81696da5d0d61f5c6f0bec45f490a232d

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Release executor intentionally disabled
        shell: bash
        run: |
          cat <<'EOF'
          WDCC RELEASE BLOCKED BY PRE-LAUNCH CONTROL.

          Frozen candidate: 188392c81696da5d0d61f5c6f0bec45f490a232d

          This legacy executor is intentionally disabled because it depended on
          exported BLOB_READ_WRITE_TOKEN / SESSION_SECRET semantics and mutated
          the canonical production ledger during candidate acceptance.

          Do not deploy or move aliases from this workflow.
          The replacement release path must use the proven canonical/OIDC state
          authority, production-origin authentication semantics, exact-run QA
          IDs/media cleanup, independent mailbox notification proof, immutable
          rollback targets, and post-promotion production E2E before certification.
          EOF
          exit 1
