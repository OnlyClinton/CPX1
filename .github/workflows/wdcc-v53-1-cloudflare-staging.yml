name: WDCC V53.1 Cloudflare Staging

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-v53-1-cloudflare-staging.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wdcc-v53-1-cloudflare-staging
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  SOURCE_SHA: 05eb60918e7bf305afbeb18303049f42d243e7a4
  BACKEND: https://wdcc-cpx-launch-cpxagency.vercel.app
  WORKER: wdcc-v53-1-staging
  CUSTOMER: https://wedontcarecars.com

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Exact source and production baseline preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          curl -fsS "$BACKEND/api/health?v531=$GITHUB_RUN_ID" -o /tmp/backend.json
          jq -e '.ok == true and .degraded == false' /tmp/backend.json >/dev/null
          curl -fsS -L "$CUSTOMER/?v531-before=$GITHUB_RUN_ID" -o /tmp/customer-before.html
          grep -q 'intro-sequence intro-impact' /tmp/customer-before.html
          grep -q 'mobile-action-bar' /tmp/customer-before.html
          grep -q '/assets/cars/2016-ford-f150-limited-1.webp' /tmp/customer-before.html
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Build exact V53.1 Cloudflare worker
        id: build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@latest wrangler@latest
          cat > open-next.config.ts <<'EOF'
          import { defineCloudflareConfig } from "@opennextjs/cloudflare";
          export default defineCloudflareConfig();
          EOF
          node <<'NODE'
          const fs=require('fs');const p='wrangler.jsonc';const cfg=JSON.parse(fs.readFileSync(p,'utf8'));
          cfg.name=process.env.WORKER;cfg.workers_dev=true;cfg.preview_urls=false;cfg.keep_vars=true;delete cfg.route;delete cfg.routes;
          cfg.vars=cfg.vars||{};cfg.vars.WDCC_RUNTIME_ROLE='frontend';cfg.vars.WDCC_DEALER_BACKEND_URL=process.env.BACKEND;
          fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          NODE
          npx opennextjs-cloudflare build
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Deploy isolated V53.1 workers.dev target
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/deploy.log
          URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/deploy.log | tail -1 || true)"
          test -n "$URL"
          echo "url=${URL%/}" >> "$GITHUB_OUTPUT"

      - name: Verify V53.1 operational contract
        id: verify
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 20); do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$URL/api/health?v531=$GITHUB_RUN_ID-$attempt" || true)"
            if [ "$code" = 200 ] && jq -e '.ok==true and .degraded==false and .release=="WDCC-V53-OPS-HARDENED" and .backend=="healthy"' /tmp/health.json >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          curl -fsS "$URL/api/inventory?v531=$GITHUB_RUN_ID" -o /tmp/inventory.json
          jq -e '.ok==true and (.items|type=="array")' /tmp/inventory.json >/dev/null
          curl -fsS -L "$URL/dealer" -o /tmp/dealer.html
          grep -q 'SALES COMMAND' /tmp/dealer.html
          curl -fsS -L "$URL/dealer/leads" -o /tmp/leads.html
          grep -q 'OVERDUE' /tmp/leads.html
          curl -fsS -L "$URL/dealer/inventory" -o /tmp/inventory.html
          grep -q 'Customer Live' /tmp/inventory.html
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Re-prove customer production baseline unchanged
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -L "$CUSTOMER/?v531-after=$GITHUB_RUN_ID" -o /tmp/customer-after.html
          grep -q 'intro-sequence intro-impact' /tmp/customer-after.html
          grep -q 'mobile-action-bar' /tmp/customer-after.html
          grep -q '/assets/cars/2016-ford-f150-limited-1.webp' /tmp/customer-after.html
          echo 'unchanged=true' >> "$GITHUB_OUTPUT"

      - name: Publish V53.1 evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          PREFLIGHT: ${{ steps.preflight.outcome }}
          BUILD: ${{ steps.build.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          UNCHANGED: ${{ steps.baseline.outputs.unchanged }}
        shell: bash
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC V53.1 staging ${GITHUB_RUN_ID}" --body "Exact source: \`$SOURCE_SHA\`
          Preflight: **$PREFLIGHT**
          Build: **$BUILD**
          Isolated deploy: **$DEPLOY**
          V53.1 contract: **$VERIFY**
          Customer baseline unchanged: **${UNCHANGED:-false}**
          Staging URL: \`${URL:-not-resolved}\`

          Production DNS and live routes are not mutated by this workflow." || true
