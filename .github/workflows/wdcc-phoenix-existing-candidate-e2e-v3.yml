name: WDCC Phoenix Existing Candidate E2E V3

on:
  push:
    branches: [main]
    paths: ['.github/workflows/wdcc-phoenix-existing-candidate-e2e-v3.yml']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wdcc-phoenix-existing-candidate-e2e-v3
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM: cpxagency
      TEAM_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      PHOENIX_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
      FINAL_SHA: 3101a4fc38e85e56d5b4c9a2171be820cf16886b
      BASE: https://wdcc-cpx-launch-mgcnoj8l9-cpxagency.vercel.app
      LIVE_APEX: https://wedontcarecars.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FINAL_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prove exact existing candidate and live baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          curl -fsS "$BASE/api/health?existing_e2e=$GITHUB_RUN_ID" -o /tmp/candidate-health.json
          jq -e --arg sha "$FINAL_SHA" '.ok==true and .degraded==false and .commit==$sha and .storage=="oidc-auto" and .state=="readable"' /tmp/candidate-health.json >/dev/null
          curl -fsS "$LIVE_APEX/api/health?existing_e2e=$GITHUB_RUN_ID" -o /tmp/live-before-health.json
          jq -e '.ok==true and .degraded==false' /tmp/live-before-health.json >/dev/null
          curl -fsS "$LIVE_APEX/api/inventory?existing_e2e=$GITHUB_RUN_ID" -o /tmp/live-before-inventory.json
          jq -e '.ok==true and all(.items[]; ((.stock//"")|ascii_upcase|startswith("QA-")|not) and ((.stock//"")|ascii_upcase|startswith("R36TEST-")|not))' /tmp/live-before-inventory.json >/dev/null

      - name: Install proof tooling after deployment is already complete
        run: |
          set -euo pipefail
          npm ci
          npm install --global vercel@59.3.0 >/dev/null
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node -e "require('playwright'); console.log('PLAYWRIGHT=READY')"
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$TEAM_ID" "$PHOENIX_ID" > .vercel/project.json

      - name: Create exact-run dealer identity with backup
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          export RUN_TAG="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > .wdcc-existing-user.mjs <<'NODE'
          import crypto from'node:crypto';import fs from'node:fs';import{get,head,put,BlobPreconditionFailedError}from'@vercel/blob';const path='private/state/platform-v3.json',run=process.env.RUN_TAG;async function stable(){for(let i=0;i<6;i++){const a=await head(path),r=await get(path,{access:'private',useCache:false});if(!r?.stream)throw Error('READ');const c=[];for await(const x of r.stream)c.push(x);const raw=Buffer.concat(c),b=await head(path);if(a.etag===b.etag)return{raw,etag:b.etag,s:JSON.parse(raw.toString())}}throw Error('HOT')}for(let n=1;n<=5;n++){const before=await stable(),s=before.s,now=new Date().toISOString(),password=`ExistingPhx-${crypto.randomBytes(18).toString('base64url')}!`,salt=crypto.randomBytes(24),digest=crypto.scryptSync(password,salt,64),passwordHash=`scrypt$${salt.toString('base64url')}$${digest.toString('base64url')}`,id=`existing-phx-${crypto.randomUUID()}`,email=`existing-phx-${run}@invalid.example`,stock=`R36TEST-EXISTING-PHX-${run}`,backup=`private/state/backups/platform-v3-pre-existing-phx-${run}-r${Number(s.revision||0)}-${crypto.randomUUID()}.json`;await put(backup,before.raw,{access:'private',addRandomSuffix:false,allowOverwrite:false,contentType:'application/json'});s.users=Array.isArray(s.users)?s.users:[];s.users.push({id,email,username:email,displayName:`Existing Phoenix E2E ${run}`,role:'dealer_agent',tenantId:'wdcc',status:'active',disabled:false,passwordHash});s.revision=Number(s.revision||0)+1;s.updatedAt=now;try{await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:before.etag});fs.writeFileSync('/tmp/existing.env',`RUN_TAG=${run}\nDEALER_ID=${id}\nDEALER_EMAIL=${email}\nQA_PASSWORD=${password}\nSTOCK=${stock}\nBACKUP=${backup}\n`);console.log(JSON.stringify({ok:true,id,email,stock,backup,revision:s.revision}));process.exit(0)}catch(e){if(e instanceof BlobPreconditionFailedError&&n<5)continue;throw e}}
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- node .wdcc-existing-user.mjs
          set -a; . /tmp/existing.env; set +a
          printf '::add-mask::%s\n' "$QA_PASSWORD"

      - name: Run exact browser/API acceptance
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          set -a; . /tmp/existing.env; set +a
          printf '::add-mask::%s\n' "$QA_PASSWORD"
          node <<'NODE'
          const fs=require('fs');const{chromium}=require('playwright');const base=process.env.BASE,run=process.env.RUN_TAG,stock=process.env.STOCK;const out={ok:false,base,run,stock,trace:[],errors:[],notFound:[],fiveHundreds:[]};const short=u=>{try{const x=new URL(u);return x.pathname+x.search}catch{return u}};async function text(r){try{return(await r.text()).slice(0,3000)}catch{return''}}
          (async()=>{const b=await chromium.launch({headless:true});try{const c=await b.newContext({viewport:{width:390,height:844}}),p=await c.newPage();p.on('console',m=>{if(m.type()==='error')out.errors.push(m.text())});p.on('pageerror',e=>out.errors.push(String(e)));p.on('response',r=>{const path=short(r.url());if(/\/api\/(auth|leads|inventory|upload)/.test(r.url()))out.trace.push({method:r.request().method(),url:path,status:r.status()});if(r.status()===404)out.notFound.push(path);if(r.status()>=500)out.fiveHundreds.push({path,status:r.status()})});
          await p.goto(`${base}/dealer/login`,{waitUntil:'domcontentloaded',timeout:30000});const login=await p.evaluate(async({email,password})=>{const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,password})});return{status:r.status,body:await r.text()}},{email:process.env.DEALER_EMAIL,password:process.env.QA_PASSWORD});out.loginResponse=login;if(login.status!==200)throw Error(`LOGIN_${login.status}_${login.body}`);const session=await p.evaluate(async()=>{const r=await fetch('/api/auth/session',{cache:'no-store'});return{status:r.status,body:await r.text()}});out.sessionResponse=session;if(session.status!==200||!JSON.parse(session.body).authenticated)throw Error(`SESSION_${session.status}_${session.body}`);out.login=true;
          const leadIds=[];for(const [kind,source] of [['schedule','schedule-test-drive'],['approval','get-approved'],['contact','call-sean']]){const res=await p.evaluate(async({kind,source,run})=>{const r=await fetch('/api/leads',{method:'POST',headers:{'content-type':'application/json','Idempotency-Key':`wdcc-qa-existing-${kind}-${run}`},body:JSON.stringify({qa:true,kind,source,name:`WDCC QA EXISTING ${kind} ${run}`,phone:'813-555-0193',email:`qa-existing-${kind}-${run}@invalid.example`,vehicleInterest:'Existing Phoenix certification',message:'Automated WDCC contract verification',consent:true})});return{status:r.status,body:await r.text()}},{kind,source,run});if(res.status!==200&&res.status!==201)throw Error(`LEAD_${kind}_${res.status}_${res.body}`);const j=JSON.parse(res.body);if(!j.ok||!j.persisted||!j.item?.id)throw Error(`LEAD_CONTRACT_${res.body}`);leadIds.push(j.item.id)}out.leadIds=leadIds;const feed=await p.evaluate(async()=>{const r=await fetch('/api/leads',{cache:'no-store'});return{status:r.status,body:await r.text()}});if(feed.status!==200)throw Error(`FEED_${feed.status}_${feed.body}`);const fj=JSON.parse(feed.body);for(const id of leadIds)if(!(fj.items||[]).some(x=>x.id===id))throw Error(`FEED_MISSING_${id}`);out.leads=true;
          await p.goto(`${base}/dealer/inventory/new`,{waitUntil:'domcontentloaded',timeout:30000});async function fill(n,v){const x=p.locator(`input[name="${n}"],textarea[name="${n}"]`).first();await x.waitFor({state:'visible',timeout:20000});await x.fill(v,{force:true})}await fill('year','2019');await fill('make','Toyota');await fill('model','Corolla');await fill('trim',`Existing Phoenix ${run}`);await fill('price','12345');await fill('downPayment','1500');await fill('mileage','54321');await fill('stock',stock);const desc=p.locator('textarea').first();if(await desc.count())await desc.fill(`QA-isolated existing Phoenix certification ${run}`);fs.writeFileSync('/tmp/existing.png',Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9WlV1GQAAAAASUVORK5CYII=','base64'));const input=p.locator('input[type=file][multiple]').first();if(!await input.count())throw Error('FILE_INPUT_MISSING');await input.setInputFiles('/tmp/existing.png');const draftP=p.waitForResponse(r=>short(r.url()).split('?')[0]==='/api/inventory'&&r.request().method()==='POST',{timeout:20000});const uploadP=p.waitForResponse(r=>short(r.url()).split('?')[0]==='/api/upload'&&r.request().method()==='POST',{timeout:40000}).catch(()=>null);const publish=p.locator('button[type="submit"][name="intent"][value="published"]:visible').first();if(!await publish.count())throw Error('VISIBLE_PUBLISH_MISSING');await publish.click();const draft=await draftP,dt=await text(draft);out.draft={status:draft.status(),body:dt};if(!draft.ok())throw Error(`DRAFT_${draft.status()}_${dt}`);const vehicleId=String(JSON.parse(dt).item?.id||'');if(!vehicleId)throw Error('DRAFT_ID_MISSING');out.vehicleId=vehicleId;const upload=await uploadP;if(!upload)throw Error(`UPLOAD_NOT_SEEN_${await p.locator('.statusMessage').first().textContent().catch(()=> '')}`);const ut=await text(upload);out.upload={status:upload.status(),body:ut};if(!upload.ok())throw Error(`UPLOAD_${upload.status()}_${ut}`);const nav=await p.waitForURL(/\/dealer\/inventory\?saved=published(?:&|$)/,{timeout:50000}).then(()=>true).catch(()=>false);if(!nav)throw Error(`PUBLISH_NAV_${await p.locator('.statusMessage').first().textContent().catch(()=> '')}`);const inv=await p.evaluate(async()=>{const r=await fetch('/api/inventory',{cache:'no-store'});return{status:r.status,body:await r.text()}});if(inv.status!==200)throw Error(`INVENTORY_${inv.status}_${inv.body}`);const item=(JSON.parse(inv.body).items||[]).find(x=>x.id===vehicleId||x.stock===stock);if(!item||String(item.status).toLowerCase()!=='published'||!(item.photoPathnames||[]).length)throw Error(`READBACK_${JSON.stringify(item||null)}`);out.vehicle={id:item.id,stock:item.stock,status:item.status,photoPathnames:item.photoPathnames,primaryPhotoPathname:item.primaryPhotoPathname||null};const anon=await b.newContext();const pub=await anon.request.get(`${base}/api/inventory?qa_public=${Date.now()}`),pj=await pub.json();await anon.close();if((pj.items||[]).some(x=>x.id===item.id||x.stock===stock))throw Error('QA_VEHICLE_PUBLIC');out.qaHidden=true;await p.screenshot({path:'/tmp/existing-phx.png',fullPage:true});if(out.fiveHundreds.length)throw Error(`UNEXPLAINED_5XX_${JSON.stringify(out.fiveHundreds)}`);if(out.notFound.length)throw Error(`UNEXPLAINED_404_${JSON.stringify(out.notFound)}`);if(out.errors.length)throw Error(`CONSOLE_ERRORS_${out.errors.join(' | ')}`);out.ok=true;fs.writeFileSync('/tmp/existing-result.json',JSON.stringify(out,null,2));}catch(e){out.error=String(e?.message||e);fs.writeFileSync('/tmp/existing-result.json',JSON.stringify(out,null,2));console.error(e);process.exitCode=1}finally{await b.close()}})();
          NODE
          cat /tmp/existing-result.json
          jq -e '.ok==true and .qaHidden==true and (.leadIds|length)==3 and (.vehicle.photoPathnames|length)>0 and .upload.status==200' /tmp/existing-result.json >/dev/null

      - name: Exact cleanup with backup
        if: always() && steps.identity.outcome == 'success'
        shell: bash
        run: |
          set +e
          set -a; . /tmp/existing.env; set +a
          cat > .wdcc-existing-clean.mjs <<'NODE'
          import crypto from'node:crypto';import{del,get,head,put,BlobPreconditionFailedError}from'@vercel/blob';const path='private/state/platform-v3.json',run=process.env.RUN_TAG,user=process.env.DEALER_ID,stock=process.env.STOCK;async function stable(){for(let i=0;i<6;i++){const a=await head(path),r=await get(path,{access:'private',useCache:false});if(!r?.stream)throw Error('READ');const c=[];for await(const x of r.stream)c.push(x);const raw=Buffer.concat(c),b=await head(path);if(a.etag===b.etag)return{raw,etag:b.etag,s:JSON.parse(raw.toString())}}throw Error('HOT')}for(let n=1;n<=5;n++){const before=await stable(),s=before.s,leadIds=(s.leads||[]).filter(x=>String(x.name||'').includes(run)||String(x.email||'').includes(run)||String(x.idempotencyKey||'').includes(run)).map(x=>x.id),vehicles=s.vehicles||[],targets=vehicles.filter(x=>String(x.stock||'')===stock),vehicleIds=targets.map(x=>x.id),media=[...new Set(targets.flatMap(x=>x.photoPathnames||[]).filter(Boolean))],backup=`private/state/backups/platform-v3-pre-existing-phx-clean-${run}-r${Number(s.revision||0)}-${crypto.randomUUID()}.json`;await put(backup,before.raw,{access:'private',addRandomSuffix:false,allowOverwrite:false,contentType:'application/json'});s.users=(s.users||[]).filter(x=>x.id!==user);s.leads=(s.leads||[]).filter(x=>!leadIds.includes(x.id));s.vehicles=vehicles.filter(x=>!vehicleIds.includes(x.id));s.revision=Number(s.revision||0)+1;s.updatedAt=new Date().toISOString();try{await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:before.etag});if(media.length)await del(media);console.log(JSON.stringify({ok:true,revision:s.revision,userRemoved:1,leadsRemoved:leadIds,vehiclesRemoved:vehicleIds,mediaRemoved:media,backup}));process.exit(0)}catch(e){if(e instanceof BlobPreconditionFailedError&&n<5)continue;throw e}}
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- node .wdcc-existing-clean.mjs | tee /tmp/existing-cleanup.json

      - name: Re-prove live baseline untouched
        if: always()
        shell: bash
        run: |
          set +e
          curl -fsS "$LIVE_APEX/api/health?existing_after=$GITHUB_RUN_ID" -o /tmp/live-after-health.json
          curl -fsS "$LIVE_APEX/api/inventory?existing_after=$GITHUB_RUN_ID" -o /tmp/live-after-inventory.json
          jq -e '.ok==true and .degraded==false' /tmp/live-after-health.json >/dev/null
          jq -e '.ok==true and all(.items[]; ((.stock//"")|ascii_upcase|startswith("QA-")|not) and ((.stock//"")|ascii_upcase|startswith("R36TEST-")|not))' /tmp/live-after-inventory.json >/dev/null

      - name: Report existing candidate acceptance
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        shell: bash
        run: |
          result='not captured'; [ -f /tmp/existing-result.json ] && result="$(cat /tmp/existing-result.json)"
          cleanup='not captured'; [ -f /tmp/existing-cleanup.json ] && cleanup="$(tail -1 /tmp/existing-cleanup.json)"
          body=$(cat <<EOF
          Exact SHA: \`$FINAL_SHA\`
          Existing candidate: \`$BASE\`
          Status: **$STATUS**
          No Vercel deployment, production alias, DNS record or Cloudflare route was created/moved by this workflow.

          Result:
          \`\`\`json
          $result
          \`\`\`

          Cleanup:
          \`\`\`json
          $cleanup
          \`\`\`
          EOF
          )
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC existing Phoenix candidate E2E ${GITHUB_RUN_ID}" --body "$body" || true

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wdcc-existing-phoenix-${{ github.run_id }}
          path: |
            /tmp/existing-result.json
            /tmp/existing-phx.png
            /tmp/candidate-health.json
            /tmp/live-before-health.json
            /tmp/live-after-health.json
          if-no-files-found: ignore
          retention-days: 5
