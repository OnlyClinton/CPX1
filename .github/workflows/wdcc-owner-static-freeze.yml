name: WDCC Owner Static Freeze Preview

on:
  push:
    branches:
      - freeze/wdcc-owner-static-20260826
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-owner-static-freeze-preview
  cancel-in-progress: false

env:
  EXPECTED_HERO_SIZE: '145504'
  EXPECTED_HERO_SHA256: 1d7a0e4fced7450f2bbc66443d44b1f35bd9e24a6366308362aafa65576d3eb2

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Guard owner-static source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test "$(wc -c < public/wdcc-hero-v2.webp | tr -d ' ')" = "$EXPECTED_HERO_SIZE"
          printf '%s  %s\n' "$EXPECTED_HERO_SHA256" public/wdcc-hero-v2.webp | sha256sum -c -
          test -s public/wdcc-official-logo.webp
          grep -q 'wdcc-hero-v2.webp' app/LockedIntro.tsx
          grep -q 'wdcc-official-logo.webp' app/LockedIntro.tsx
          grep -q 'animation:none' app/LockedIntro.tsx
          ! grep -Eqi 'WebGPU|requestAdapter|getContext\("webgpu"\)|createRenderPipeline|\.animate\(' app/LockedIntro.tsx
          grep -q '@media(min-width:1366px)' app/owner-optical-final.css
          ! grep -q 'hover:hover' app/owner-optical-final.css

      - name: Build exact source
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0 playwright@1.55.0
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets
          npx playwright install --with-deps chromium >/dev/null

      - name: Create isolated config
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          cfg.name='wdcc-owner-static-freeze';
          cfg.workers_dev=true;
          cfg.preview_urls=true;
          delete cfg.route;
          delete cfg.routes;
          fs.writeFileSync('wrangler.freeze.jsonc',JSON.stringify(cfg,null,2)+'\n');
          NODE
          ! grep -qi 'wedontcarecars.com' wrangler.freeze.jsonc

      - name: Deploy isolated freeze preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.freeze.jsonc 2>&1 | tee /tmp/freeze.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/freeze.log | tail -1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" | tee preview-url.txt

      - name: Smoke isolated preview
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          code=000
          for i in $(seq 1 30); do
            code="$(curl -sS -L -o /tmp/home.html -w '%{http_code}' "$URL/?freeze=$GITHUB_RUN_ID-$i" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          test "$code" = 200
          grep -qi "we don.t care" /tmp/home.html
          test "$(curl -sS -L -o /tmp/hero.webp -w '%{http_code}' "$URL/wdcc-hero-v2.webp?freeze=$GITHUB_RUN_ID")" = 200
          test "$(wc -c < /tmp/hero.webp | tr -d ' ')" = "$EXPECTED_HERO_SIZE"
          printf '%s  %s\n' "$EXPECTED_HERO_SHA256" /tmp/hero.webp | sha256sum -c -
          test "$(curl -sS -L -o /tmp/inventory.json -w '%{http_code}' "$URL/api/inventory?freeze=$GITHUB_RUN_ID")" = 200
          jq -e '((.items // .inventory // []) | length) >= 1' /tmp/inventory.json >/dev/null
          test "$(curl -sS -L -o /tmp/dealer.html -w '%{http_code}' "$URL/dealer?freeze=$GITHUB_RUN_ID")" = 200

      - name: Browser proof mobile and desktop
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-proof
          node - <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const url=process.env.URL;
            const browser=await chromium.launch({headless:true});
            const proof={url,sha:process.env.GITHUB_SHA,mobile:{},desktop:{},dealer:{}};
            const waitImg=async(p,s,w=100)=>{await p.locator(s).waitFor({state:'visible',timeout:12000});await p.waitForFunction(({s,w})=>{const i=document.querySelector(s);return i&&i.complete&&i.naturalWidth>=w},{s,w},{timeout:12000});};
            const waitIntroDone=async p=>{const i=p.locator('.li');if(await i.count())await i.waitFor({state:'detached',timeout:5000});await p.locator('.rh-hero-art').waitFor({state:'visible',timeout:5000});};
            try{
              const m=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
              const p=await m.newPage();
              await p.goto(`${url}/?mobile=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
              await waitImg(p,'.li-scene img',1000);await waitImg(p,'.li-badge img',200);
              await p.waitForTimeout(250);
              const introA=await p.evaluate(()=>{const b=document.querySelector('.li-badge img').getBoundingClientRect(),s=getComputedStyle(document.querySelector('.li-badge img')),scene=getComputedStyle(document.querySelector('.li-scene img'));return{x:b.x,y:b.y,w:b.width,h:b.height,animation:s.animationName,transform:s.transform,sceneAnimation:scene.animationName,sceneTransform:scene.transform,canvas:document.querySelectorAll('canvas').length}});
              await p.waitForTimeout(450);
              const introB=await p.evaluate(()=>{const b=document.querySelector('.li-badge img').getBoundingClientRect();return{x:b.x,y:b.y,w:b.width,h:b.height}});
              if(introA.canvas!==0||introA.animation!=='none'||introA.sceneAnimation!=='none')throw Error(`INTRO_MOTION_PRIMITIVE ${JSON.stringify(introA)}`);
              if(Math.abs(introA.x-introB.x)>.5||Math.abs(introA.y-introB.y)>.5||Math.abs(introA.w-introB.w)>.5||Math.abs(introA.h-introB.h)>.5)throw Error(`INTRO_MOVED ${JSON.stringify({introA,introB})}`);
              await p.screenshot({path:'visual-proof/mobile-intro.png'});
              await waitIntroDone(p);await waitImg(p,'.rh-logo img',200);
              const before=await p.evaluate(()=>{const q=s=>document.querySelector(s),st=s=>getComputedStyle(q(s)),r=s=>q(s).getBoundingClientRect();return{logoW:r('.rh-logo img').width,menu:st('.rh-menu').display,grid:st('.rh-grid').display,cardW:r('.rh-card').width,utilityDisplay:st('.rh-utility').display,utilityH:r('.rh-utility').height,utilityTop:r('.rh-utility').top,headerTop:r('.rh-header').top,headerPosition:st('.rh-header').position,utilityPosition:st('.rh-utility').position,h1Size:parseFloat(st('.rh-copy h1').fontSize),sectionH2Size:parseFloat(st('.rh-section-head h2').fontSize)}});
              if(before.logoW<88||before.menu==='none'||before.grid!=='flex'||before.cardW>360)throw Error(`MOBILE_COMPOSITION ${JSON.stringify(before)}`);
              if(before.utilityDisplay==='none'||before.utilityH<24)throw Error(`MOBILE_BANNER_HIDDEN ${JSON.stringify(before)}`);
              if(before.h1Size<37||before.sectionH2Size<29)throw Error(`MOBILE_TYPE_TOO_SMALL ${JSON.stringify(before)}`);
              if(!['fixed','sticky'].includes(before.headerPosition)||!['fixed','sticky'].includes(before.utilityPosition))throw Error(`MOBILE_PIN_MODE ${JSON.stringify(before)}`);
              await p.evaluate(()=>scrollTo(0,700));await p.waitForTimeout(180);
              const after=await p.evaluate(()=>{const u=document.querySelector('.rh-utility').getBoundingClientRect(),h=document.querySelector('.rh-header').getBoundingClientRect();return{uTop:u.top,uH:u.height,hTop:h.top}});
              if(Math.abs(after.uTop)>2||after.uH<24||Math.abs(after.hTop-after.uH)>3)throw Error(`MOBILE_NOT_PINNED ${JSON.stringify(after)}`);
              await p.evaluate(()=>scrollTo(0,0));await p.waitForTimeout(100);
              await p.screenshot({path:'visual-proof/mobile-hero.png'});await p.screenshot({path:'visual-proof/mobile-full.png',fullPage:true});
              proof.mobile={introA,introB,before,after};await m.close();

              const d=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});
              const q=await d.newPage();await q.goto(`${url}/?desktop=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});await waitImg(q,'.li-scene img',1000);await q.waitForTimeout(700);await q.screenshot({path:'visual-proof/desktop-intro.png'});await waitIntroDone(q);await waitImg(q,'.rh-logo img',200);
              const desk=await q.evaluate(()=>{const st=s=>getComputedStyle(document.querySelector(s)),r=s=>document.querySelector(s).getBoundingClientRect();return{menu:st('.rh-menu').display,nav:st('.rh-nav').display,grid:st('.rh-grid').display,logoW:r('.rh-logo img').width,h1Size:parseFloat(st('.rh-copy h1').fontSize)}});
              if(desk.menu!=='none'||desk.nav!=='flex'||desk.grid!=='grid'||desk.logoW<88||desk.h1Size<58)throw Error(`DESKTOP_COMPOSITION ${JSON.stringify(desk)}`);
              await q.screenshot({path:'visual-proof/desktop-hero.png'});await q.screenshot({path:'visual-proof/desktop-full.png',fullPage:true});proof.desktop=desk;
              const dealer=await d.newPage();await dealer.goto(`${url}/dealer?visual=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});await dealer.waitForTimeout(800);await dealer.screenshot({path:'visual-proof/dealer.png'});proof.dealer={url:dealer.url(),title:await dealer.title()};await d.close();
            }finally{await browser.close()}
            fs.writeFileSync('visual-proof/metrics.json',JSON.stringify(proof,null,2)+'\n');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Summary
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo '### WDCC owner-static frozen preview' >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: ${URL:-not-created}" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Production untouched.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-owner-static-freeze-proof
          path: |
            preview-url.txt
            visual-proof/
          if-no-files-found: warn
          retention-days: 7
