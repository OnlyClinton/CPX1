name: Trigger WDCC canonical promotion now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-wdcc-promotion-now.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing gated promotion workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run finalize-2vfd-production.yml --repo "$GITHUB_REPOSITORY" --ref main
