name: WDCC Visual Inspection Capture

on:
  push:
    branches: [qa/wdcc-visual-inspect-20260826]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIEW_URL: https://wdcc-preview.clico-global.workers.dev
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Capture desktop and mobile visual evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          base=os.environ['PREVIEW_URL'].rstrip('/')
          out=Path('visual-evidence')
          report=[]

          def inspect(ctx, path, label, intro=False):
              page=ctx.new_page()
              console=[]
              bad=[]
              page.on('console', lambda m: console.append({'type':m.type,'text':m.text}) if m.type in ('error','warning') else None)
              page.on('response', lambda r: bad.append({'status':r.status,'url':r.url}) if r.status >= 400 else None)
              url=base+path
              resp=page.goto(url, wait_until='domcontentloaded', timeout=45000)
              if intro:
                  page.wait_for_timeout(500)
                  page.screenshot(path=str(out/f'{label}-intro-500ms.png'))
                  page.wait_for_timeout(3200)
              else:
                  page.wait_for_timeout(1800)
              page.screenshot(path=str(out/f'{label}-viewport.png'))
              page.screenshot(path=str(out/f'{label}-full.png'), full_page=True)
              report.append({
                  'label':label,
                  'requested':url,
                  'final_url':page.url,
                  'status':resp.status if resp else None,
                  'title':page.title(),
                  'scroll_height':page.evaluate('document.documentElement.scrollHeight'),
                  'viewport':page.viewport_size,
                  'console':console[:50],
                  'bad_responses':bad[:100],
                  'body_text':page.locator('body').inner_text()[:4000],
              })
              page.close()

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              desktop=browser.new_context(viewport={'width':1440,'height':900}, device_scale_factor=1)
              inspect(desktop,'/?visual-inspect=desktop','desktop-home',intro=True)
              inspect(desktop,'/inventory?visual-inspect=desktop','desktop-inventory')
              inspect(desktop,'/dealer?visual-inspect=desktop','desktop-dealer')
              inspect(desktop,'/dealer/inventory?visual-inspect=desktop','desktop-dealer-inventory')
              desktop.close()

              mobile=browser.new_context(
                  viewport={'width':390,'height':844},
                  device_scale_factor=2,
                  is_mobile=True,
                  has_touch=True,
                  user_agent='Mozilla/5.0 (Linux; Android 16; Pixel 9 Pro) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Mobile Safari/537.36'
              )
              inspect(mobile,'/?visual-inspect=mobile','mobile-home',intro=True)
              inspect(mobile,'/inventory?visual-inspect=mobile','mobile-inventory')
              inspect(mobile,'/dealer?visual-inspect=mobile','mobile-dealer')
              inspect(mobile,'/dealer/inventory?visual-inspect=mobile','mobile-dealer-inventory')
              mobile.close()
              browser.close()

          (out/'visual-report.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          for item in report:
              print(item['label'], 'status=', item['status'], 'final=', item['final_url'], 'bad=', len(item['bad_responses']), 'console=', len(item['console']))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wdcc-visual-inspection
          path: visual-evidence/
          retention-days: 7
