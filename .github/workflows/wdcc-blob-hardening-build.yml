name: WDCC Blob Hardening Build

on:
  push:
    branches:
      - fix/wdcc-blob-quota-hardening-20260826
    paths:
      - lib/store.ts
      - .github/workflows/wdcc-blob-hardening-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-blob-hardening-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install and compile only
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
      - name: Verify quota-amplification guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'READ_CACHE_TTL_MS' lib/store.ts
          grep -q 'readInFlight' lib/store.ts
          grep -q 'STATE_PROVIDER_BLOCKED' lib/store.ts
          grep -q 'BACKUP_READ_LIMIT' lib/store.ts
          grep -q 'providerAccessBlocked' lib/store.ts
          echo 'WDCC_BLOB_HARDENING_BUILD=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "Exact SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'No deployment, route, alias, DNS, provider setting, or data mutation is performed by this workflow.' >> "$GITHUB_STEP_SUMMARY"
