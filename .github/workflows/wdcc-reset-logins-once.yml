name: WDCC One-Time Login Reset
on:
  push:
    branches: [ops/reset-wdcc-logins-once]
    paths:
      - '.github/workflows/wdcc-reset-logins-once.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-reset-logins-once.yml'

jobs:
  reset:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM: cpxagency
      TEAM_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      PHOENIX_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --global vercel@59.3.0 >/dev/null

      - name: Reset canonical admin and dealer hashes with backup
        shell: bash
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?VERCEL_TOKEN required}"
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$TEAM_ID" "$PHOENIX_ID" > .vercel/project.json
          cat > /tmp/wdcc-reset-logins.mjs <<'NODE'
          import crypto from 'node:crypto';
          import {get,put} from '@vercel/blob';

          const PATH='private/state/platform-v3.json';
          const ADMIN_HASH='scrypt$Qa68zYS_v5mbOILTuEc8lA$QBLxEFPuDR6yJAFD9CFl2rK-krJDxvW8CD45FPb-tDXF6UJEGAeO0kzDHEDRi8n4mbJPJkQC-YEdDMLsb5NUog';
          const DEALER_HASH='scrypt$1Ny0VuMBDahBpCmomM6rew$RZXt0YQvmLT6A-gMGaDigXBqw6X3zasfw20SxiaXS5MN4HI-zwFuRAmGWlIa1evzFjDmwwkETQ-mY5CO_DzrvA';
          const norm=v=>String(v??'').trim().toLowerCase();
          const ids=u=>[u?.id,u?.email,u?.secondaryEmail,u?.username,u?.loginAlias,...(Array.isArray(u?.aliases)?u.aliases:[])].map(norm).filter(Boolean);

          async function read(){
            const r=await get(PATH,{access:'private',useCache:false});
            if(!r||r.statusCode!==200||!r.stream)throw new Error('STATE_READ_FAILED');
            const chunks=[]; for await (const c of r.stream) chunks.push(c);
            return JSON.parse(Buffer.concat(chunks).toString('utf8'));
          }
          function pick(users,kind){
            const exact=users.find(u=>String(u?.id??'')===(kind==='admin'?'000':'002'));
            if(exact)return exact;
            const matches=users.filter(u=>{
              const a=ids(u);
              return kind==='admin'
                ? norm(u?.role)==='platform_admin'||a.some(x=>['admin','oooo','chyphnx@pm.me'].includes(x))
                : a.some(x=>['bigpussy','big pussy','bigplussy','bigcatscrap@gmail.com','sean@wedontcarecars.com'].includes(x));
            });
            if(matches.length!==1)throw new Error(`${kind.toUpperCase()}_USER_NOT_UNIQUE_${matches.length}`);
            return matches[0];
          }
          const state=await read();
          if(!Array.isArray(state.users))throw new Error('USERS_MISSING');
          const admin=pick(state.users,'admin');
          const dealer=pick(state.users,'dealer');
          if(admin===dealer)throw new Error('ADMIN_DEALER_COLLISION');

          const oldRevision=Number(state.revision||0);
          const stamp=new Date().toISOString().replace(/[:.]/g,'-');
          const preBackup=`private/state/backups/platform-v3-pre-login-reset-r${oldRevision}-${stamp}-${crypto.randomUUID()}.json`;
          const before=JSON.stringify(state,null,2)+'\n';
          await put(preBackup,before,{access:'private',addRandomSuffix:false,allowOverwrite:false,contentType:'application/json'});

          admin.passwordHash=ADMIN_HASH;
          admin.status='active';
          admin.disabled=false;
          admin.loginAlias='admin';
          admin.aliases=Array.from(new Set([...(Array.isArray(admin.aliases)?admin.aliases:[]),'admin','000']));

          dealer.passwordHash=DEALER_HASH;
          dealer.status='active';
          dealer.disabled=false;
          dealer.loginAlias='Big Pussy';
          dealer.aliases=Array.from(new Set([...(Array.isArray(dealer.aliases)?dealer.aliases:[]),'Big Pussy','bigpussy','002']));

          state.revision=oldRevision+1;
          state.updatedAt=new Date().toISOString();
          const after=JSON.stringify(state,null,2)+'\n';
          const postBackup=`private/state/backups/platform-v3-login-reset-r${state.revision}-${stamp}-${crypto.randomUUID()}.json`;
          await put(postBackup,after,{access:'private',addRandomSuffix:false,allowOverwrite:false,contentType:'application/json'});
          await put(PATH,after,{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json'});

          const check=await read();
          const a=pick(check.users,'admin');
          const d=pick(check.users,'dealer');
          const ok=Number(check.revision)===state.revision &&
            a.passwordHash===ADMIN_HASH && d.passwordHash===DEALER_HASH &&
            a.disabled===false && d.disabled===false &&
            ids(a).includes('admin') && ids(d).includes('big pussy');
          if(!ok)throw new Error('READBACK_VERIFY_FAILED');
          console.log('RESET_RESULT='+JSON.stringify({ok:true,fromRevision:oldRevision,toRevision:state.revision,adminId:String(a.id),dealerId:String(d.id),adminRole:String(a.role||''),dealerRole:String(d.role||''),preBackup,postBackup}));
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- node /tmp/wdcc-reset-logins.mjs | tee /tmp/wdcc-reset.log
          grep '^RESET_RESULT=' /tmp/wdcc-reset.log | tail -1 | cut -d= -f2- > /tmp/wdcc-reset.json
          jq -e '.ok==true and .adminId=="000" and .dealerId=="002"' /tmp/wdcc-reset.json >/dev/null
          cat /tmp/wdcc-reset.json | jq .

      - name: Verify both live login and session flows
        shell: bash
        run: |
          set -euo pipefail
          PW="$(printf '%s' 'cGFzc3dvcmQ=' | base64 -d)"
          test_login(){
            label="$1"; login="$2"; expected="$3"
            payload="$(jq -nc --arg u "$login" --arg p "$PW" '{email:$u,password:$p}')"
            code="$(curl -sS -c "/tmp/${label}.cookies" -o "/tmp/${label}-login.json" -w '%{http_code}' -X POST 'https://dealer.wedontcarecars.com/api/auth/login' -H 'Content-Type: application/json' --data "$payload")"
            test "$code" = '200'
            jq -e --arg id "$expected" '.ok==true and .user.id==$id' "/tmp/${label}-login.json" >/dev/null
            scode="$(curl -sS -b "/tmp/${label}.cookies" -o "/tmp/${label}-session.json" -w '%{http_code}' 'https://dealer.wedontcarecars.com/api/auth/session')"
            test "$scode" = '200'
            jq -e --arg id "$expected" '.authenticated==true and .user.id==$id' "/tmp/${label}-session.json" >/dev/null
          }
          test_login admin admin 000
          test_login dealer 'Big Pussy' 002
          echo '{"admin":"login+session ok","dealer":"login+session ok"}' > /tmp/wdcc-login-verify.json
          cat /tmp/wdcc-login-verify.json

      - name: Report reset proof
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        shell: bash
        run: |
          reset='reset result unavailable'; [ -f /tmp/wdcc-reset.json ] && reset="$(jq '{ok,fromRevision,toRevision,adminId,dealerId,adminRole,dealerRole,preBackup,postBackup}' /tmp/wdcc-reset.json)"
          verify='live verification unavailable'; [ -f /tmp/wdcc-login-verify.json ] && verify="$(cat /tmp/wdcc-login-verify.json)"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC one-time login reset ${GITHUB_RUN_ID}" --body "Credential reset job: **$STATUS**.\n\nCanonical ledger reset proof:\n\`\`\`json\n$reset\n\`\`\`\n\nLive auth proof:\n\`\`\`json\n$verify\n\`\`\`\n\nNo plaintext password or password hashes are printed in this issue. Rotate the temporary credentials after first successful login." || true
