name: WDCC Vercel Secret Probe
on:
  push:
    branches: [wdcc-release-8ar-working]
    paths-ignore:
      - 'release/WDCC-VERCEL-SECRET-PROBE.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      S1: ${{ secrets.VERCEL_TOKEN }}
      S2: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      S3: ${{ secrets.VERCEL_API_TOKEN }}
      S4: ${{ secrets.VERCEL_CLI_TOKEN }}
      S5: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
      S6: ${{ secrets.CPX_VERCEL_TOKEN }}
      S7: ${{ secrets.VERCEL_AUTH_TOKEN }}
      S8: ${{ secrets.VERCEL_TEAM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wdcc-release-8ar-working
      - shell: bash
        run: |
          mkdir -p release
          OUT=release/WDCC-VERCEL-SECRET-PROBE.txt
          : > "$OUT"
          for pair in 'VERCEL_TOKEN:S1' 'VERCEL_ACCESS_TOKEN:S2' 'VERCEL_API_TOKEN:S3' 'VERCEL_CLI_TOKEN:S4' 'VERCEL_DEPLOY_TOKEN:S5' 'CPX_VERCEL_TOKEN:S6' 'VERCEL_AUTH_TOKEN:S7' 'VERCEL_TEAM_TOKEN:S8'; do
            NAME="${pair%%:*}"; VAR="${pair##*:}"; VAL="${!VAR:-}"
            if [ -n "$VAL" ]; then echo "$NAME=present" >> "$OUT"; else echo "$NAME=missing" >> "$OUT"; fi
          done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$OUT"
          git commit -m 'Record safe Vercel secret alias probe' || true
          git push origin HEAD:wdcc-release-8ar-working
