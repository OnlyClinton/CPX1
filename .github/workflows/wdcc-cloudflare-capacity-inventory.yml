name: WDCC Cloudflare Route Ownership Readback

on:
  push:
    branches: [emergency/wdcc-cloudflare-r2-20260827]
    paths:
      - '.github/workflows/wdcc-cloudflare-capacity-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  routes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ZONE_API_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CANDIDATE: wdcc-v53-staging
    steps:
      - name: Read current wedontcarecars.com Worker routes only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ZONE_API_TOKEN:-}"; test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          zone_json="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_ZONE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=wedontcarecars.com&account.id=$CLOUDFLARE_ACCOUNT_ID&per_page=50")"
          ZONE="$(printf '%s' "$zone_json" | jq -r '.result[0].id')"; test -n "$ZONE"; test "$ZONE" != null
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_ZONE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE/workers/routes" -o /tmp/routes.json
          jq -e '.success==true' /tmp/routes.json >/dev/null
          jq '[.result[]|{pattern,script,id}]' /tmp/routes.json > /tmp/routes-summary.json
          jq -e --arg c "$CANDIDATE" 'all(.result[]; (.script//"") != $c)' /tmp/routes.json >/dev/null
          echo "CANDIDATE_UNBOUND=true"
          cat /tmp/routes-summary.json
      - name: Report route ownership proof
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s /tmp/routes-summary.json ]; then
            dealer="$(jq -c '[.[]|select(.pattern=="dealer.wedontcarecars.com/*")]|first//null' /tmp/routes-summary.json)"
            scripts="$(jq -c '[.[].script]|map(select(.!=null))|unique' /tmp/routes-summary.json)"
            gh issue comment 205 --repo "$GITHUB_REPOSITORY" --body "Read-only Cloudflare route proof run $GITHUB_RUN_ID: candidate \`wdcc-v53-staging\` is not present in any current wedontcarecars.com Worker route. Dealer route record=$dealer ; all currently route-bound scripts=$scripts. No Worker, route, DNS, alias, or deployment mutation was performed." || true
          fi
