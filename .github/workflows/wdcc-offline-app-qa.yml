name: WDCC Offline App QA
on:
  push:
    branches: [ops/offline-app-qa]
    paths:
      - '.github/workflows/wdcc-offline-app-qa.yml'
      - 'app/**'
      - 'lib/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  offline-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build without deployment
        run: npm run build
      - name: Assert dealer safety contract in source
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'status:"draft"' app/api/inventory/route.ts
          grep -F 'photo_required_before_publish' 'app/api/inventory/[id]/route.ts'
          grep -F 'media/wdcc/${vehicleId}/' app/api/upload/route.ts
          grep -F 'allowedContentTypes' app/api/upload/route.ts
          grep -F 'maximumSizeInBytes:15*1024*1024' app/api/upload/route.ts
      - name: Start local Next server
        shell: bash
        run: |
          set -euo pipefail
          npm start -- --hostname 127.0.0.1 --port 3000 >/tmp/wdcc-next.log 2>&1 &
          echo $! >/tmp/wdcc-next.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wdcc-next.log
          exit 1
      - name: Exercise local UI routes
        shell: bash
        run: |
          set -euo pipefail
          check(){
            path="$1"
            code="$(curl -sS -o /tmp/page.html -w '%{http_code}' "http://127.0.0.1:3000$path")"
            echo "$path => $code"
            test "$code" = '200'
          }
          check /login
          check /admin/login
          check /dealer/login
          check /dealer/dashboard
          check /dealer/inventory
          check /dealer/inventory/new
      - name: Verify unified login build artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:3000/login -o /tmp/login.html
          grep -qi 'password' /tmp/login.html
      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/wdcc-next.log || true
