name: WDCC Repair Storage Bindings
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-repair-storage-bindings.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ops/wdcc-repair-trigger.txt'
      - '.github/workflows/wdcc-repair-storage-bindings.yml'
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      SOURCE_PROJECT: prj_fz5mN7Q5gImZ9UGpv1GDpHxPtLNB
      PHOENIX_PROJECT: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
      HARDENED_ARTIFACT: wdcc-cpx-launch-g0t1np08g-cpxagency.vercel.app
      SAFE_FALLBACK: wdcc-cpx-launch-b01un0onc-cpxagency.vercel.app
      DEALER_DOMAIN: dealer.wedontcarecars.com
    steps:
      - uses: actions/checkout@v4

      - name: Require Vercel token
        run: test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN missing" >&2; exit 78; }

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.3.0

      - name: Restore healthy dealer alias before repair
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@59.3.0 alias set "$SAFE_FALLBACK" "$DEALER_DOMAIN" --token="$VERCEL_TOKEN" --scope=cpxagency
          sleep 4
          code="$(curl -sS -o /tmp/fallback-health.json -w '%{http_code}' "https://$DEALER_DOMAIN/api/health")"
          test "$code" = "200"
          jq -e '.ok == true' /tmp/fallback-health.json >/dev/null
          echo "WDCC_SAFE_FALLBACK=PASS"

      - name: Pull healthy dealer production environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dealer/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$SOURCE_PROJECT" > /tmp/dealer/.vercel/project.json
          cd /tmp/dealer
          vercel env pull /tmp/dealer.env --yes --environment=production --token="$VERCEL_TOKEN" --scope=cpxagency
          grep -q '^BLOB_READ_WRITE_TOKEN=' /tmp/dealer.env || { echo 'healthy dealer project has no BLOB_READ_WRITE_TOKEN' >&2; exit 1; }
          grep -q '^SESSION_SECRET=' /tmp/dealer.env || { echo 'healthy dealer project has no SESSION_SECRET' >&2; exit 1; }
          echo "WDCC_SOURCE_BINDINGS=FOUND"

      - name: Sync storage and auth bindings to hardened Phoenix project
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . /tmp/dealer.env
          set +a
          test -n "${BLOB_READ_WRITE_TOKEN:-}"
          test -n "${SESSION_SECRET:-}"
          mkdir -p /tmp/phoenix/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$PHOENIX_PROJECT" > /tmp/phoenix/.vercel/project.json
          cd /tmp/phoenix
          printf '%s' "$BLOB_READ_WRITE_TOKEN" | vercel env update BLOB_READ_WRITE_TOKEN production --sensitive --token="$VERCEL_TOKEN" --scope=cpxagency >/dev/null 2>&1 || {
            vercel env rm BLOB_READ_WRITE_TOKEN production --yes --token="$VERCEL_TOKEN" --scope=cpxagency >/dev/null 2>&1 || true
            printf '%s' "$BLOB_READ_WRITE_TOKEN" | vercel env add BLOB_READ_WRITE_TOKEN production --sensitive --token="$VERCEL_TOKEN" --scope=cpxagency >/dev/null
          }
          printf '%s' "$SESSION_SECRET" | vercel env update SESSION_SECRET production --sensitive --token="$VERCEL_TOKEN" --scope=cpxagency >/dev/null 2>&1 || {
            vercel env rm SESSION_SECRET production --yes --token="$VERCEL_TOKEN" --scope=cpxagency >/dev/null 2>&1 || true
            printf '%s' "$SESSION_SECRET" | vercel env add SESSION_SECRET production --sensitive --token="$VERCEL_TOKEN" --scope=cpxagency >/dev/null
          }
          vercel env pull /tmp/phoenix-check.env --yes --environment=production --token="$VERCEL_TOKEN" --scope=cpxagency >/dev/null
          grep -q '^BLOB_READ_WRITE_TOKEN=' /tmp/phoenix-check.env
          grep -q '^SESSION_SECRET=' /tmp/phoenix-check.env
          echo "WDCC_TARGET_BINDINGS=SYNCED"

      - name: Redeploy hardened artifact with repaired bindings
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          npx --yes vercel@59.3.0 redeploy "$HARDENED_ARTIFACT" --target production --token="$VERCEL_TOKEN" --scope=cpxagency 2>&1 | tee /tmp/redeploy.log
          NEW_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' /tmp/redeploy.log | tail -1)"
          test -n "$NEW_URL" || { echo 'Could not determine redeployed URL' >&2; exit 1; }
          echo "NEW_URL=$NEW_URL" >> "$GITHUB_ENV"
          echo "Redeployed hardened URL: $NEW_URL"

      - name: Verify hardened deployment before cutover
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 20); do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$NEW_URL/api/health" || true)"
            if [ "$code" = "200" ] && jq -e '.ok == true' /tmp/health.json >/dev/null 2>&1; then ok=1; break; fi
            sleep 3
          done
          test "$ok" = "1" || { cat /tmp/health.json || true; exit 1; }
          curl -sSI "$NEW_URL/dealer/login" > /tmp/headers.txt
          grep -qi '^content-security-policy:' /tmp/headers.txt
          grep -qi '^access-control-allow-origin: https://dealer\.wedontcarecars\.com' /tmp/headers.txt
          grep -qi '^strict-transport-security: max-age=63072000; includeSubDomains; preload' /tmp/headers.txt
          grep -qi '^x-frame-options: DENY' /tmp/headers.txt
          echo "WDCC_HARDENED_PRECUTOVER=PASS"

      - name: Cut over dealer alias with automatic rollback
        shell: bash
        run: |
          set -euo pipefail
          rollback(){
            echo 'Cutover verification failed; restoring known-good alias' >&2
            npx --yes vercel@59.3.0 alias set "$SAFE_FALLBACK" "$DEALER_DOMAIN" --token="$VERCEL_TOKEN" --scope=cpxagency >/dev/null 2>&1 || true
          }
          trap rollback ERR
          host="${NEW_URL#https://}"
          npx --yes vercel@59.3.0 alias set "$host" "$DEALER_DOMAIN" --token="$VERCEL_TOKEN" --scope=cpxagency
          sleep 5
          code="$(curl -sS -o /tmp/live-health.json -w '%{http_code}' "https://$DEALER_DOMAIN/api/health")"
          test "$code" = "200"
          jq -e '.ok == true' /tmp/live-health.json >/dev/null
          curl -sSI "https://$DEALER_DOMAIN/dealer/login" > /tmp/live-headers.txt
          grep -qi '^content-security-policy:' /tmp/live-headers.txt
          grep -qi '^access-control-allow-origin: https://dealer\.wedontcarecars\.com' /tmp/live-headers.txt
          grep -qi '^x-frame-options: DENY' /tmp/live-headers.txt
          trap - ERR
          echo "WDCC_HARDENED_CUTOVER=PASS"
