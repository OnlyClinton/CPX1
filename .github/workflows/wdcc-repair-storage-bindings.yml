name: WDCC Repair Storage Bindings
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-repair-storage-bindings.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ops/wdcc-repair-trigger.txt'
      - '.github/workflows/wdcc-repair-storage-bindings.yml'
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      DEALER_PROJECT: prj_fz5mN7Q5gImZ9UGpv1GDpHxPtLNB
      PHOENIX_PROJECT: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
      STOREFRONT_PROJECT: prj_We7xkAkB5Qy31Pt17USSkQFE0u7h
      HARDENED_ARTIFACT: wdcc-cpx-launch-g0t1np08g-cpxagency.vercel.app
      SAFE_FALLBACK: wdcc-cpx-launch-b01un0onc-cpxagency.vercel.app
      DEALER_DOMAIN: dealer.wedontcarecars.com
    steps:
      - uses: actions/checkout@v4

      - name: Require Vercel token
        run: test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN missing" >&2; exit 78; }

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.3.0

      - name: Restore safe dealer alias before repair
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@59.3.0 alias set "$SAFE_FALLBACK" "$DEALER_DOMAIN" --token="$VERCEL_TOKEN" --scope=cpxagency
          sleep 4
          code="$(curl -sS -o /tmp/fallback-health.json -w '%{http_code}' "https://$DEALER_DOMAIN/api/health" || true)"
          test "$code" = "200"
          jq -e '.ok == true' /tmp/fallback-health.json >/dev/null
          echo "WDCC_SAFE_FALLBACK=PASS"

      - name: Discover usable storage and session authority
        shell: bash
        run: |
          set -euo pipefail
          found=""
          for project in "$DEALER_PROJECT" "$PHOENIX_PROJECT" "$STOREFRONT_PROJECT"; do
            dir="/tmp/source-$project"
            mkdir -p "$dir/.vercel"
            printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$project" > "$dir/.vercel/project.json"
            if (cd "$dir" && vercel env pull "$dir/env" --yes --environment=production --token="$VERCEL_TOKEN" --scope=cpxagency >/dev/null 2>&1); then
              has_session=0; has_blob=0
              grep -q '^SESSION_SECRET=' "$dir/env" && has_session=1
              if grep -q '^BLOB_READ_WRITE_TOKEN=' "$dir/env" || grep -q '^BLOB_STORE_ID=' "$dir/env"; then has_blob=1; fi
              if [ "$has_session" = 1 ] && [ "$has_blob" = 1 ]; then
                cp "$dir/env" /tmp/wdcc-authority.env
                found="$project"
                break
              fi
            fi
          done
          test -n "$found" || { echo 'No project currently exposes both session and Blob authority. Runtime repair cannot proceed safely.' >&2; exit 78; }
          echo "WDCC_AUTHORITY_SOURCE=$found" >> "$GITHUB_ENV"
          echo "WDCC_SOURCE_BINDINGS=FOUND:$found"

      - name: Sync authority to canonical Phoenix backend
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . /tmp/wdcc-authority.env
          set +a
          test -n "${SESSION_SECRET:-}"
          test -n "${BLOB_READ_WRITE_TOKEN:-}${BLOB_STORE_ID:-}"
          mkdir -p /tmp/phoenix/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$PHOENIX_PROJECT" > /tmp/phoenix/.vercel/project.json
          cd /tmp/phoenix

          upsert_sensitive(){
            name="$1"; value="$2"
            [ -n "$value" ] || return 0
            printf '%s' "$value" | vercel env update "$name" production --sensitive --token="$VERCEL_TOKEN" --scope=cpxagency >/dev/null 2>&1 || {
              vercel env rm "$name" production --yes --token="$VERCEL_TOKEN" --scope=cpxagency >/dev/null 2>&1 || true
              printf '%s' "$value" | vercel env add "$name" production --sensitive --token="$VERCEL_TOKEN" --scope=cpxagency >/dev/null
            }
          }
          upsert_plain(){
            name="$1"; value="$2"
            [ -n "$value" ] || return 0
            printf '%s' "$value" | vercel env update "$name" production --token="$VERCEL_TOKEN" --scope=cpxagency >/dev/null 2>&1 || {
              vercel env rm "$name" production --yes --token="$VERCEL_TOKEN" --scope=cpxagency >/dev/null 2>&1 || true
              printf '%s' "$value" | vercel env add "$name" production --token="$VERCEL_TOKEN" --scope=cpxagency >/dev/null
            }
          }

          upsert_sensitive SESSION_SECRET "$SESSION_SECRET"
          upsert_sensitive BLOB_READ_WRITE_TOKEN "${BLOB_READ_WRITE_TOKEN:-}"
          upsert_plain BLOB_STORE_ID "${BLOB_STORE_ID:-}"
          upsert_plain WDCC_DEALER_BACKEND_URL "https://wdcc-cpx-launch-cpxagency.vercel.app"

          vercel env pull /tmp/phoenix-check.env --yes --environment=production --token="$VERCEL_TOKEN" --scope=cpxagency >/dev/null
          grep -q '^SESSION_SECRET=' /tmp/phoenix-check.env
          if ! grep -q '^BLOB_READ_WRITE_TOKEN=' /tmp/phoenix-check.env && ! grep -q '^BLOB_STORE_ID=' /tmp/phoenix-check.env; then
            echo 'Canonical Phoenix still lacks Blob authority after sync' >&2; exit 1
          fi
          echo "WDCC_TARGET_BINDINGS=SYNCED"

      - name: Redeploy hardened artifact with repaired bindings
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          npx --yes vercel@59.3.0 redeploy "$HARDENED_ARTIFACT" --target production --token="$VERCEL_TOKEN" --scope=cpxagency 2>&1 | tee /tmp/redeploy.log
          NEW_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' /tmp/redeploy.log | tail -1)"
          test -n "$NEW_URL" || { echo 'Could not determine redeployed URL' >&2; exit 1; }
          echo "NEW_URL=$NEW_URL" >> "$GITHUB_ENV"
          echo "Redeployed hardened URL: $NEW_URL"

      - name: Verify hardened deployment before cutover
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 20); do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$NEW_URL/api/health" || true)"
            if [ "$code" = "200" ] && jq -e '.ok == true' /tmp/health.json >/dev/null 2>&1; then ok=1; break; fi
            sleep 3
          done
          test "$ok" = "1" || { cat /tmp/health.json || true; exit 1; }
          curl -sSI "$NEW_URL/dealer" > /tmp/headers.txt
          grep -qi '^content-security-policy:' /tmp/headers.txt
          grep -qi '^access-control-allow-origin: https://dealer\.wedontcarecars\.com' /tmp/headers.txt
          grep -qi '^strict-transport-security: max-age=63072000; includeSubDomains; preload' /tmp/headers.txt
          grep -qi '^x-frame-options: DENY' /tmp/headers.txt
          echo "WDCC_HARDENED_PRECUTOVER=PASS"

      - name: Cut over dealer alias with automatic rollback
        shell: bash
        run: |
          set -euo pipefail
          rollback(){
            echo 'Cutover verification failed; restoring known-good alias' >&2
            npx --yes vercel@59.3.0 alias set "$SAFE_FALLBACK" "$DEALER_DOMAIN" --token="$VERCEL_TOKEN" --scope=cpxagency >/dev/null 2>&1 || true
          }
          trap rollback ERR
          host="${NEW_URL#https://}"
          npx --yes vercel@59.3.0 alias set "$host" "$DEALER_DOMAIN" --token="$VERCEL_TOKEN" --scope=cpxagency
          sleep 5
          code="$(curl -sS -o /tmp/live-health.json -w '%{http_code}' "https://$DEALER_DOMAIN/api/health")"
          test "$code" = "200"
          jq -e '.ok == true' /tmp/live-health.json >/dev/null
          curl -sSI "https://$DEALER_DOMAIN/dealer" > /tmp/live-headers.txt
          grep -qi '^content-security-policy:' /tmp/live-headers.txt
          grep -qi '^access-control-allow-origin: https://dealer\.wedontcarecars\.com' /tmp/live-headers.txt
          grep -qi '^x-frame-options: DENY' /tmp/live-headers.txt
          trap - ERR
          echo "WDCC_HARDENED_CUTOVER=PASS"
