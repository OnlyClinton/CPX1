name: WDCC Cloudflare Isolated Bootstrap

on:
  push:
    branches: [emergency/wdcc-cloudflare-r2-20260827]
    paths:
      - '.github/workflows/wdcc-cloudflare-bootstrap-isolated.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wdcc-cloudflare-isolated-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM: cpxagency
      TEAM_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      PHOENIX_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
      STATE_WORKER: wdcc-state-authority
      APP_WORKER: wdcc-cloudflare-backend
      BOOTSTRAP_SHA256: 364a7acba7a7be8af5ad9e9ef54e0bc11fed0d6601ba6975f6cd58700f1dd7d7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require provider credentials
        shell: bash
        run: |
          set -euo pipefail
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VERCEL_TOKEN; do
            test -n "${!v:-}" || { echo "missing $v"; exit 20; }
          done

      - name: Install Cloudflare and Vercel tooling
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0
          npm install --global vercel@59.5.0 >/dev/null
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$TEAM_ID" "$PHOENIX_ID" > .vercel/project.json

      - name: Deploy empty Cloudflare Durable Object authority
        id: state
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler.cf-state.jsonc <<EOF
          {
            "name":"$STATE_WORKER",
            "main":"cloudflare/wdcc-state-worker.mjs",
            "compatibility_date":"2026-08-27",
            "workers_dev":true,
            "preview_urls":true,
            "observability":{"enabled":true},
            "vars":{"WDCC_BOOTSTRAP_SHA256":"$BOOTSTRAP_SHA256"},
            "durable_objects":{"bindings":[{"name":"WDCC_STATE","class_name":"WDCCState"}]},
            "migrations":[{"tag":"v1","new_sqlite_classes":["WDCCState"]}]
          }
          EOF
          npx wrangler deploy --config wrangler.cf-state.jsonc 2>&1 | tee /tmp/state-deploy.log
          STATE_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/state-deploy.log | tail -1)"
          test -n "$STATE_URL"
          INTERNAL_TOKEN="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$INTERNAL_TOKEN"
          printf '%s' "$INTERNAL_TOKEN" >/tmp/internal-token
          printf '%s' "$INTERNAL_TOKEN" | npx wrangler secret put WDCC_STATE_SERVICE_TOKEN --config wrangler.cf-state.jsonc >/dev/null
          echo "STATE_URL=$STATE_URL"
          echo "url=$STATE_URL" >> "$GITHUB_OUTPUT"

      - name: Prove Durable Object storage without seeding ledger
        shell: bash
        env:
          STATE_URL: ${{ steps.state.outputs.url }}
        run: |
          set -euo pipefail
          TOKEN="$(cat /tmp/internal-token)"
          code="$(curl -sS -o /tmp/empty-health.json -w '%{http_code}' "$STATE_URL/health?bootstrap=$GITHUB_RUN_ID")"
          test "$code" = 503
          jq -e '.ok==false and .provider=="cloudflare" and .storage=="durable-object-sqlite" and .state=="unreadable"' /tmp/empty-health.json >/dev/null
          test "$(curl -sS -o /tmp/self-test.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -X POST "$STATE_URL/self-test")" = 200
          jq -e '.ok==true and .write==true and .read==true and .delete==true and .storage=="durable-object-sqlite"' /tmp/self-test.json >/dev/null

      - name: Build WDCC backend for Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets

      - name: Deploy isolated Cloudflare backend
        id: app
        shell: bash
        env:
          STATE_URL: ${{ steps.state.outputs.url }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const source=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          source.name=process.env.APP_WORKER;
          source.workers_dev=true;
          source.preview_urls=true;
          delete source.route; delete source.routes;
          source.vars={...(source.vars||{}),WDCC_RUNTIME_ROLE:'backend',WDCC_PROVIDER:'cloudflare',WDCC_STATE_SERVICE_URL:process.env.STATE_URL};
          delete source.vars.WDCC_DEALER_BACKEND_URL;
          fs.writeFileSync('wrangler.cf-app.jsonc',JSON.stringify(source,null,2)+'\n');
          NODE
          npx wrangler deploy --config wrangler.cf-app.jsonc 2>&1 | tee /tmp/app-deploy.log
          APP_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/app-deploy.log | tail -1)"
          test -n "$APP_URL"
          TOKEN="$(cat /tmp/internal-token)"
          printf '%s' "$TOKEN" | npx wrangler secret put WDCC_STATE_SERVICE_TOKEN --config wrangler.cf-app.jsonc >/dev/null
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- bash -lc 'test -n "${SESSION_SECRET:-}"; printf "%s" "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET --config wrangler.cf-app.jsonc >/dev/null'
          echo "APP_URL=$APP_URL"
          echo "url=$APP_URL" >> "$GITHUB_OUTPUT"

      - name: Prove backend is Cloudflare-bound and awaiting seed
        shell: bash
        env:
          APP_URL: ${{ steps.app.outputs.url }}
        run: |
          set -euo pipefail
          code=000
          for i in $(seq 1 15); do
            code="$(curl -sS -L -o /tmp/app-health.json -w '%{http_code}' "$APP_URL/api/health?bootstrap=$GITHUB_RUN_ID-$i" || true)"
            [ "$code" = 503 ] && break
            sleep 2
          done
          test "$code" = 503
          jq -e '.ok==false and .storage=="cloudflare-do" and .state=="unreadable" and .provider=="cloudflare" and .session=="configured"' /tmp/app-health.json >/dev/null
          echo "Cloudflare isolated bootstrap ready; no production route bound."

      - name: Record isolated bootstrap
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_URL: ${{ steps.state.outputs.url }}
          APP_URL: ${{ steps.app.outputs.url }}
        run: |
          set -euo pipefail
          gh issue comment 205 --repo "$GITHUB_REPOSITORY" --body "Cloudflare emergency bootstrap run $GITHUB_RUN_ID is isolated and ready. Durable Object storage self-test passed; backend Worker is deployed and correctly reports Cloudflare state authority as unreadable only because the canonical ledger has not been seeded. State Worker: $STATE_URL ; backend Worker: $APP_URL . No DNS, apex, dealer route, Vercel alias, or production traffic change was performed." || true

      - name: Failure record
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 205 --repo "$GITHUB_REPOSITORY" --body "Cloudflare isolated bootstrap run $GITHUB_RUN_ID failed before any production route movement. No DNS, apex, dealer route, or Vercel alias change was performed." || true
