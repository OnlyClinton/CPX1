name: WDCC Production Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: wdcc-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      VERCEL_ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      VERCEL_PROJECT_ID: prj_We7xkAkB5Qy31Pt17USSkQFE0u7h
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Require Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN GitHub secret is missing" >&2
            exit 78
          fi
      - name: Link canonical WDCC project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.3.0
      - name: Pull production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope=cpxagency
      - name: Build production bundle
        run: vercel build --prod --token="$VERCEL_TOKEN" --scope=cpxagency
      - name: Deploy production bundle
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --scope=cpxagency | tail -n 1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production URL: $url"
      - name: Verify apex homepage
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -L -o /tmp/wdcc-home.html -w '%{http_code}' https://wedontcarecars.com/)"
          echo "HTTP $code"
          test "$code" = "200"
          grep -qi "BAD CREDIT" /tmp/wdcc-home.html
      - name: Report deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          short="${GITHUB_SHA:0:7}"
          body=$(printf 'Commit: `%s`\nDeploy outcome: `%s`\nVerify outcome: `%s`\nProduction URL: `%s`\nApex: https://wedontcarecars.com/' "$GITHUB_SHA" "${DEPLOY_OUTCOME:-unknown}" "${VERIFY_OUTCOME:-unknown}" "${DEPLOY_URL:-not-created}")
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC production deploy report $short" --body "$body" || true
