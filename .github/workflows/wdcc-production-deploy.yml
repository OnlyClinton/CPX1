name: WDCC Production Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: wdcc-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      VERCEL_PROJECT_ID: prj_We7xkAkB5Qy31Pt17USSkQFE0u7h
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Require Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN GitHub secret is missing" >&2
            exit 78
          fi
      - name: Link canonical WDCC project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.3.0
      - name: Pull production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope=cpxagency
      - name: Build production bundle
        run: vercel build --prod --token="$VERCEL_TOKEN" --scope=cpxagency
      - name: Deploy production bundle
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --scope=cpxagency
