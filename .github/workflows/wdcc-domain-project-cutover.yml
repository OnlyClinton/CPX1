name: WDCC Domain Project Cutover

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-domain-project-cutover.yml'

concurrency:
  group: wdcc-domain-project-cutover
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
  VERCEL_PROJECT_ID: prj_We7xkAkB5Qy31Pt17USSkQFE0u7h
  VERCEL_SCOPE: cpxagency
  TARGET_PROJECT_ID: prj_We7xkAkB5Qy31Pt17USSkQFE0u7h
  RELEASE_REF: release/wdcc-screenshot-contract-20260825
  BACKEND_URL: https://wdcc-cpx-launch-cpxagency.vercel.app
  CANDIDATE_ALIAS: https://wdcc-v32-storefront-cpxagency.vercel.app
  ROLLBACK_URL: wdcc-v32-storefront-a2wntmnnn-cpxagency.vercel.app
  APEX: wedontcarecars.com
  WWW: www.wedontcarecars.com

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require Vercel authority
        run: test -n "$VERCEL_TOKEN"

      - name: Checkout immutable screenshot contract
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install application and Vercel CLI
        run: |
          set -euo pipefail
          npm ci
          npm install --global vercel@59.3.0

      - name: Verify canonical backend before cutover
        run: |
          set -euo pipefail
          curl -fsS "$BACKEND_URL/api/health?domain-cutover=$GITHUB_RUN_ID" -o /tmp/backend-health.json
          jq -e '.ok == true and .backend == "healthy"' /tmp/backend-health.json >/dev/null
          curl -fsS "$BACKEND_URL/api/inventory?domain-cutover=$GITHUB_RUN_ID" -o /tmp/backend-inventory.json
          jq -e '.ok == true and (.items | type == "array")' /tmp/backend-inventory.json >/dev/null

      - name: Link V32 customer alias authority
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Bind V32 frontend to canonical backend
        shell: bash
        run: |
          set -euo pipefail
          set_env(){
            local key="$1" value="$2"
            if ! printf '%s' "$value" | vercel env update "$key" production --sensitive --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" >/dev/null 2>&1; then
              vercel env rm "$key" production --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" >/dev/null 2>&1 || true
              printf '%s' "$value" | vercel env add "$key" production --sensitive --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" >/dev/null
            fi
          }
          set_env WDCC_RUNTIME_ROLE frontend
          set_env WDCC_DEALER_BACKEND_URL "$BACKEND_URL"
          set_env WDCC_TRUSTED_ORIGINS 'https://wedontcarecars.com,https://www.wedontcarecars.com,https://dealer.wedontcarecars.com'
          echo 'WDCC_V32_BINDINGS=SYNCED'

      - name: Pull V32 production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"

      - name: Build exact screenshot-contract release
        run: |
          set -euo pipefail
          grep -q 'screenshotContract' app/Exact2vfDHome.tsx
          grep -q 'screenshot-contract.css' app/layout.tsx
          grep -q 'Schedule a test drive' app/Exact2vfDHome.tsx
          grep -q 'Get pre-approved' app/Exact2vfDHome.tsx
          grep -q 'Call Sean' app/Exact2vfDHome.tsx
          npm run build
          vercel build --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"

      - name: Deploy prebuilt to V32 production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" | tail -n 1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployment: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify new V32 production through public project alias
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 20); do
            home_code="$(curl -sS -L -o /tmp/candidate-home.html -w '%{http_code}' "$CANDIDATE_ALIAS/?verify=$GITHUB_RUN_ID" || true)"
            health_code="$(curl -sS -L -o /tmp/candidate-health.json -w '%{http_code}' "$CANDIDATE_ALIAS/api/health?verify=$GITHUB_RUN_ID" || true)"
            if [ "$home_code" = 200 ] && [ "$health_code" = 200 ] && grep -q 'screenshotContract' /tmp/candidate-home.html && grep -q 'Schedule a test drive' /tmp/candidate-home.html && grep -q 'Get pre-approved' /tmp/candidate-home.html && grep -q 'mobile-action-bar' /tmp/candidate-home.html && jq -e '.ok == true and .backend == "healthy"' /tmp/candidate-health.json >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          curl -fsS "$CANDIDATE_ALIAS/api/inventory?verify=$GITHUB_RUN_ID" -o /tmp/candidate-inventory.json
          jq -e '.ok == true and (.items | type == "array") and (.items | length > 0)' /tmp/candidate-inventory.json >/dev/null
          for path in /schedule-test-drive /get-approved /dealer/login /admin/login; do
            code="$(curl -sS -L -o /dev/null -w '%{http_code}' "$CANDIDATE_ALIAS$path")"
            test "$code" = 200
          done

      - name: Point customer aliases at verified deployment
        id: alias_cutover
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          vercel alias set "$DEPLOY_URL" "$APEX" --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
          vercel alias set "$DEPLOY_URL" "$WWW" --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"

      - name: Verify live customer domains
        id: live
        shell: bash
        run: |
          set -euo pipefail
          for host in "$APEX" "$WWW"; do
            ok=0
            for i in $(seq 1 30); do
              home_code="$(curl -sS -L -o /tmp/live-home.html -w '%{http_code}' "https://$host/?release=$GITHUB_RUN_ID" || true)"
              health_code="$(curl -sS -L -o /tmp/live-health.json -w '%{http_code}' "https://$host/api/health?release=$GITHUB_RUN_ID" || true)"
              if [ "$home_code" = 200 ] && [ "$health_code" = 200 ] && grep -q 'screenshotContract' /tmp/live-home.html && grep -q 'Schedule a test drive' /tmp/live-home.html && grep -q 'Get pre-approved' /tmp/live-home.html && grep -q 'mobile-action-bar' /tmp/live-home.html && jq -e '.ok == true and .backend == "healthy"' /tmp/live-health.json >/dev/null 2>&1; then ok=1; break; fi
              sleep 2
            done
            test "$ok" = 1
          done
          curl -fsS "https://$WWW/api/inventory?release=$GITHUB_RUN_ID" -o /tmp/live-inventory.json
          jq -e '.ok == true and (.items | type == "array") and (.items | length > 0)' /tmp/live-inventory.json >/dev/null
          for url in \
            "https://$WWW/schedule-test-drive" \
            "https://$WWW/get-approved" \
            "https://$WWW/dealer/login" \
            "https://$WWW/admin/login"; do
            code="$(curl -sS -L -o /dev/null -w '%{http_code}' "$url")"
            test "$code" = 200
          done
          echo 'WDCC_CUSTOMER_DOMAIN_CONTRACT=PASS'

      - name: Roll back customer aliases if cutover verification fails
        if: failure() && steps.alias_cutover.outcome != 'skipped'
        shell: bash
        run: |
          set +e
          vercel alias set "$ROLLBACK_URL" "$APEX" --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
          vercel alias set "$ROLLBACK_URL" "$WWW" --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"

      - name: Verify dealer backend remains healthy
        if: success()
        run: |
          set -euo pipefail
          curl -fsS https://dealer.wedontcarecars.com/api/health -o /tmp/dealer-health.json
          jq -e '.ok == true and .backend == "healthy"' /tmp/dealer-health.json >/dev/null
          code="$(curl -sS -L -o /dev/null -w '%{http_code}' https://dealer.wedontcarecars.com/dealer)"
          test "$code" = 200

      - name: Report successful production cutover
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC screenshot-contract production PASS ${GITHUB_RUN_ID}" --body "Screenshot-contract release: \`$RELEASE_REF\`\nV32 deployment: \`$DEPLOY_URL\`\nApex + www screenshot contract, health, inventory, CTA, dealer-login and admin-login: **PASS**\nDealer backend remained healthy: **PASS**" || true

      - name: Report failed production cutover
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC screenshot-contract production FAIL ${GITHUB_RUN_ID}" --body "The V32 customer cutover gate failed. Candidate: \`${DEPLOY_URL:-not-created}\`. Customer aliases were rolled back when needed." || true
