name: WDCC Domain Project Cutover

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-domain-project-cutover.yml'

concurrency:
  group: wdcc-domain-project-cutover
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
  VERCEL_PROJECT_ID: prj_We7xkAkB5Qy31Pt17USSkQFE0u7h
  VERCEL_SCOPE: cpxagency
  CANDIDATE_URL: wdcc-v32-storefront-g58j9f8w2-cpxagency.vercel.app
  ROLLBACK_URL: wdcc-v32-storefront-a2wntmnnn-cpxagency.vercel.app
  BACKEND_URL: https://wdcc-cpx-launch-cpxagency.vercel.app
  APEX: wedontcarecars.com
  WWW: www.wedontcarecars.com

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require Vercel authority
        run: test -n "$VERCEL_TOKEN"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@59.3.0

      - name: Link V32 project
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Verify canonical backend before alias move
        run: |
          set -euo pipefail
          curl -fsS "$BACKEND_URL/api/health?cutover=$GITHUB_RUN_ID" -o /tmp/backend-health.json
          jq -e '.ok == true and .backend == "healthy"' /tmp/backend-health.json >/dev/null
          curl -fsS "$BACKEND_URL/api/inventory?cutover=$GITHUB_RUN_ID" -o /tmp/backend-inventory.json
          jq -e '.ok == true and (.items | type == "array")' /tmp/backend-inventory.json >/dev/null

      - name: Verify exact protected screenshot candidate
        shell: bash
        run: |
          set -euo pipefail
          vercel curl / --deployment "$CANDIDATE_URL" --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" > /tmp/candidate-home.html
          grep -q 'screenshotContract' /tmp/candidate-home.html
          grep -q 'wdcc-logo-transparent.webp' /tmp/candidate-home.html
          grep -q 'Schedule a test drive' /tmp/candidate-home.html
          grep -q 'Get pre-approved' /tmp/candidate-home.html
          grep -q 'CALL SEAN' /tmp/candidate-home.html
          grep -q 'mobile-action-bar' /tmp/candidate-home.html

          vercel curl /api/health --deployment "$CANDIDATE_URL" --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" > /tmp/candidate-health.json
          jq -e '.ok == true and .backend == "healthy"' /tmp/candidate-health.json >/dev/null

          vercel curl /api/inventory --deployment "$CANDIDATE_URL" --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" > /tmp/candidate-inventory.json
          jq -e '.ok == true and (.items | type == "array") and (.items | length > 0)' /tmp/candidate-inventory.json >/dev/null

          for path in /schedule-test-drive /get-approved /dealer/login /admin/login /dealer/inventory/new; do
            vercel curl "$path" --deployment "$CANDIDATE_URL" --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" > /tmp/candidate-page.html
            test -s /tmp/candidate-page.html
          done
          echo 'WDCC_EXACT_CANDIDATE=PASS'

      - name: Point customer aliases at exact candidate
        id: alias_cutover
        shell: bash
        run: |
          set -euo pipefail
          vercel alias set "$CANDIDATE_URL" "$APEX" --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
          vercel alias set "$CANDIDATE_URL" "$WWW" --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"

      - name: Verify live customer domains
        id: live
        shell: bash
        run: |
          set -euo pipefail
          for host in "$APEX" "$WWW"; do
            ok=0
            for i in $(seq 1 30); do
              home_code="$(curl -sS -L -o /tmp/live-home.html -w '%{http_code}' "https://$host/?release=$GITHUB_RUN_ID" || true)"
              health_code="$(curl -sS -L -o /tmp/live-health.json -w '%{http_code}' "https://$host/api/health?release=$GITHUB_RUN_ID" || true)"
              if [ "$home_code" = 200 ] && [ "$health_code" = 200 ] && grep -q 'screenshotContract' /tmp/live-home.html && grep -q 'wdcc-logo-transparent.webp' /tmp/live-home.html && grep -q 'Schedule a test drive' /tmp/live-home.html && grep -q 'Get pre-approved' /tmp/live-home.html && grep -q 'CALL SEAN' /tmp/live-home.html && grep -q 'mobile-action-bar' /tmp/live-home.html && jq -e '.ok == true and .backend == "healthy"' /tmp/live-health.json >/dev/null 2>&1; then
                ok=1
                break
              fi
              sleep 2
            done
            test "$ok" = 1
          done

          curl -fsS "https://$WWW/api/inventory?release=$GITHUB_RUN_ID" -o /tmp/live-inventory.json
          jq -e '.ok == true and (.items | type == "array") and (.items | length > 0)' /tmp/live-inventory.json >/dev/null

          for path in /schedule-test-drive /get-approved /dealer/login /admin/login /dealer/inventory/new; do
            code="$(curl -sS -L -o /dev/null -w '%{http_code}' "https://$WWW$path")"
            test "$code" = 200
          done
          echo 'WDCC_CUSTOMER_DOMAIN_CONTRACT=PASS'

      - name: Roll back customer aliases if verification fails
        if: failure() && steps.alias_cutover.outcome != 'skipped'
        shell: bash
        run: |
          set +e
          vercel alias set "$ROLLBACK_URL" "$APEX" --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
          vercel alias set "$ROLLBACK_URL" "$WWW" --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"

      - name: Confirm dealer backend stayed healthy
        if: success()
        run: |
          set -euo pipefail
          curl -fsS https://dealer.wedontcarecars.com/api/health -o /tmp/dealer-health.json
          jq -e '.ok == true and .backend == "healthy"' /tmp/dealer-health.json >/dev/null
          code="$(curl -sS -L -o /dev/null -w '%{http_code}' https://dealer.wedontcarecars.com/dealer)"
          test "$code" = 200

      - name: Report pass
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC screenshot-contract production PASS ${GITHUB_RUN_ID}" --body "Exact V32 candidate: \`$CANDIDATE_URL\`\nApex + www screenshot contract: **PASS**\nHealth + inventory + test drive + approval + dealer login + admin login + vehicle upload route: **PASS**\nDealer backend remained healthy: **PASS**" || true

      - name: Report fail
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC screenshot-contract production FAIL ${GITHUB_RUN_ID}" --body "Exact candidate or public-alias gate failed. Customer aliases were restored to 2vfD if they had moved. Production claim withheld." || true
