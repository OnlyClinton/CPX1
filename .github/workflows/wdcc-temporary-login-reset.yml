name: WDCC Requested Login Verification
on:
  push:
    branches: [ops/reset-wdcc-logins]
    paths:
      - '.github/workflows/wdcc-temporary-login-reset.yml'
      - 'scripts/wdcc-temp-login-reset.mjs'
      - 'scripts/wdcc-login-ui-e2e.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DEALER_URL: https://dealer.wedontcarecars.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify requested credentials and authenticated APIs
        run: node scripts/wdcc-temp-login-reset.mjs verify
      - name: Install Chromium for real browser login test
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify dealer and admin browser flows
        run: node scripts/wdcc-login-ui-e2e.cjs
