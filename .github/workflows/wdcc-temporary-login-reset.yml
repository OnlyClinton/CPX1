name: WDCC Unified Backend Login Verification
on:
  push:
    branches: [ops/reset-wdcc-logins]
    paths:
      - '.github/workflows/wdcc-temporary-login-reset.yml'
      - 'scripts/wdcc-temp-login-reset.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DEALER_URL: https://wdcc-cpx-launch.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify credentials, sessions, CRM, leads, inventory and admin on one authority
        run: node scripts/wdcc-temp-login-reset.mjs verify
