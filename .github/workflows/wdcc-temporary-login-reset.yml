name: WDCC Temporary Login Reset
on:
  push:
    branches: [ops/reset-wdcc-logins]
    paths:
      - '.github/workflows/wdcc-temporary-login-reset.yml'
      - 'scripts/wdcc-temp-login-reset.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset-and-verify:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      DEALER_URL: https://dealer.wedontcarecars.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check requested credentials before mutation
        run: node scripts/wdcc-temp-login-reset.mjs current || true
      - name: Locate healthy canonical Blob binding
        shell: bash
        run: |
          set -euo pipefail
          npm install --global vercel@59.3.0 >/dev/null
          found=''
          while read -r name id; do
            dir="/tmp/wdcc-$name"
            mkdir -p "$dir/.vercel"
            printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$id" > "$dir/.vercel/project.json"
            if (cd "$dir" && env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env pull "$dir/env" --yes --environment=production --token="$VERCEL_TOKEN" --scope=cpxagency >/dev/null 2>&1); then
              if grep -q '^BLOB_READ_WRITE_TOKEN=' "$dir/env"; then
                set +u
                set -a; . "$dir/env"; set +a
                set -u
                if node scripts/wdcc-temp-login-reset.mjs probe >"/tmp/probe-$name.json" 2>"/tmp/probe-$name.err"; then
                  found="$name"
                  cp "$dir/env" /tmp/wdcc-healthy.env
                  cat "/tmp/probe-$name.json"
                  break
                fi
              fi
            fi
          done <<'PROJECTS'
          backend prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
          dealer prj_fz5mN7Q5gImZ9UGpv1GDpHxPtLNB
          storefront prj_We7xkAkB5Qy31Pt17USSkQFE0u7h
          PROJECTS
          test -n "$found" || { echo 'No healthy canonical Blob binding found'; for f in /tmp/probe-*.err; do [ -f "$f" ] && { echo "--- $f"; tail -20 "$f"; }; done; exit 1; }
          echo "HEALTHY_BINDING=$found" >> "$GITHUB_ENV"
          echo "Healthy canonical binding: $found"
      - name: Backup and reset requested accounts
        shell: bash
        run: |
          set -euo pipefail
          set +u
          set -a; . /tmp/wdcc-healthy.env; set +a
          set -u
          node scripts/wdcc-temp-login-reset.mjs reset
      - name: Verify live sessions and dealer APIs
        run: node scripts/wdcc-temp-login-reset.mjs verify
