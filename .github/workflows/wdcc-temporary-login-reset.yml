name: WDCC Temporary Login Reset
on:
  push:
    branches: [ops/reset-wdcc-logins]
    paths:
      - '.github/workflows/wdcc-temporary-login-reset.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset-and-verify:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      DEALER_URL: https://dealer.wedontcarecars.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Find healthy canonical state binding
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          npm install --global vercel@59.3.0 >/dev/null
          projects=(
            'backend:prj_a3oclCcy4sbA2tge4BX7VAKXE4KR'
            'dealer:prj_fz5mN7Q5gImZ9UGpv1GDpHxPtLNB'
            'storefront:prj_We7xkAkB5Qy31Pt17USSkQFE0u7h'
          )
          found=''
          for item in "${projects[@]}"; do
            name="${item%%:*}"; id="${item#*:}"
            dir="/tmp/$name"; mkdir -p "$dir/.vercel"
            printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$id" > "$dir/.vercel/project.json"
            if (cd "$dir" && env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env pull "$dir/env" --yes --environment=production --token="$VERCEL_TOKEN" --scope=cpxagency >/dev/null 2>&1); then
              if grep -q '^BLOB_READ_WRITE_TOKEN=' "$dir/env"; then
                set -a; . "$dir/env"; set +a
                if BLOB_READ_WRITE_TOKEN="$BLOB_READ_WRITE_TOKEN" node --input-type=module <<'NODE' >/tmp/probe.json 2>/tmp/probe.err
                import {get} from '@vercel/blob';
                const r=await get('private/state/platform-v3.json',{access:'private',useCache:false,token:process.env.BLOB_READ_WRITE_TOKEN});
                if(!r||r.statusCode!==200||!r.stream)throw Error('STATE_READ_FAILED');
                const chunks=[];for await(const c of r.stream)chunks.push(c);const s=JSON.parse(Buffer.concat(chunks).toString('utf8'));
                if(!Array.isArray(s.users)||!s.users.length)throw Error('USERS_MISSING');
                console.log(JSON.stringify({ok:true,revision:Number(s.revision||0),users:s.users.map(u=>({id:String(u?.id??''),username:String(u?.username??''),displayName:String(u?.displayName??''),role:String(u?.role??''),status:String(u?.status??''),disabled:Boolean(u?.disabled),aliases:Array.isArray(u?.aliases)?u.aliases.map(String):[]}))},null,2));
NODE
                then
                  found="$name"; cp "$dir/env" /tmp/healthy.env; echo "healthy canonical state binding=$name"; cat /tmp/probe.json; break
                fi
              fi
            fi
          done
          test -n "$found" || { echo 'No healthy canonical Blob binding found'; for f in /tmp/probe.err; do [ -f "$f" ] && tail -20 "$f"; done; exit 1; }
          echo "HEALTHY_BINDING=$found" >> "$GITHUB_ENV"

      - name: Backup and reset admin plus dealer accounts
        shell: bash
        run: |
          set -euo pipefail
          set -a; . /tmp/healthy.env; set +a
          PW="$(printf '\160\141\163\163\167\157\162\144')"; export PW
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import {get,head,put,BlobPreconditionFailedError} from '@vercel/blob';
          const token=process.env.BLOB_READ_WRITE_TOKEN,path='private/state/platform-v3.json';
          const norm=v=>String(v??'').trim().toLowerCase();
          function hashPassword(p){const salt=crypto.randomBytes(24);const digest=crypto.scryptSync(p,salt,64);return `scrypt$${salt.toString('base64url')}$${digest.toString('base64url')}`}
          async function stableRead(){for(let i=0;i<4;i++){const m1=await head(path,{token});const r=await get(path,{access:'private',useCache:false,token});if(!r||r.statusCode!==200||!r.stream)throw Error('STATE_READ_FAILED');const chunks=[];for await(const c of r.stream)chunks.push(c);const raw=Buffer.concat(chunks);const m2=await head(path,{token});if(m1.etag===m2.etag)return{raw,etag:m2.etag,state:JSON.parse(raw.toString('utf8'))}}throw Error('STATE_TOO_HOT')}
          const before=await stableRead(),state=before.state;state.users=Array.isArray(state.users)?state.users:[];state.audit=Array.isArray(state.audit)?state.audit:[];
          const admin=state.users.find(u=>String(u?.id)==='000')||state.users.find(u=>['platform_admin','admin','owner'].includes(norm(u?.role)));
          const dealer=state.users.find(u=>String(u?.id)==='002')||state.users.find(u=>['bigpussy','bigplussy','big pussy'].some(a=>[u?.username,u?.loginAlias,u?.displayName,...(Array.isArray(u?.aliases)?u.aliases:[])].map(norm).includes(a)));
          if(!admin||!dealer||admin===dealer){console.error(JSON.stringify({error:'TARGET_USERS_NOT_FOUND',users:state.users.map(u=>({id:String(u?.id??''),username:String(u?.username??''),displayName:String(u?.displayName??''),role:String(u?.role??''),status:String(u?.status??''),disabled:Boolean(u?.disabled),aliases:Array.isArray(u?.aliases)?u.aliases.map(String):[]}))},null,2));process.exit(2)}
          const now=new Date().toISOString(),backup=`private/state/backups/platform-v3-pre-temp-login-reset-r${Number(state.revision||0)}-${now.replace(/[:.]/g,'-')}-${crypto.randomUUID()}.json`;
          await put(backup,before.raw,{access:'private',addRandomSuffix:false,allowOverwrite:false,contentType:'application/json',token});
          const addAlias=(u,a)=>{u.aliases=Array.isArray(u.aliases)?u.aliases:[];if(!u.aliases.some(x=>norm(x)===norm(a)))u.aliases.push(a)};
          admin.passwordHash=hashPassword(process.env.PW);admin.loginAlias='admin';addAlias(admin,'admin');admin.status='active';admin.disabled=false;admin.updatedAt=now;
          dealer.passwordHash=hashPassword(process.env.PW);dealer.loginAlias='Big Pussy';addAlias(dealer,'Big Pussy');addAlias(dealer,'BigPussy');dealer.status='active';dealer.disabled=false;dealer.updatedAt=now;
          state.audit.push({id:crypto.randomUUID(),at:now,action:'user.temporary_login_reset',actor:'authorized-maintenance',userId:String(admin.id),loginAlias:'admin',backup});
          state.audit.push({id:crypto.randomUUID(),at:now,action:'user.temporary_login_reset',actor:'authorized-maintenance',userId:String(dealer.id),loginAlias:'Big Pussy',backup});
          state.revision=Number(state.revision||0)+1;state.updatedAt=now;
          try{await put(path,JSON.stringify(state,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:before.etag,token})}catch(e){if(e instanceof BlobPreconditionFailedError)throw Error('STATE_CHANGED_DURING_RESET');throw e}
          console.log(JSON.stringify({ok:true,revision:state.revision,backup,admin:{id:String(admin.id),role:String(admin.role)},dealer:{id:String(dealer.id),role:String(dealer.role),loginAlias:dealer.loginAlias}},null,2));
NODE

      - name: Verify live login sessions and core dealer APIs
        shell: bash
        run: |
          set -euo pipefail
          PW="$(printf '\160\141\163\163\167\157\162\144')"
          login_test(){
            login="$1" jar="$2"
            payload="$(jq -nc --arg email "$login" --arg password "$PW" '{email:$email,password:$password}')"
            code="$(curl -sS -c "$jar" -o /tmp/login.json -w '%{http_code}' -X POST "$DEALER_URL/api/auth/login" -H 'content-type: application/json' -H "origin: $DEALER_URL" --data "$payload")"
            cat /tmp/login.json | jq .
            test "$code" = 200
            jq -e '.ok==true' /tmp/login.json >/dev/null
            scode="$(curl -sS -b "$jar" -o /tmp/session.json -w '%{http_code}' "$DEALER_URL/api/auth/session")"
            cat /tmp/session.json | jq .
            test "$scode" = 200
            jq -e '.authenticated==true' /tmp/session.json >/dev/null
            echo "$login login/session PASS"
          }
          login_test 'Big Pussy' /tmp/dealer.cookies
          login_test 'admin' /tmp/admin.cookies
          for path in /api/crm/dashboard /api/inventory /api/leads; do
            code="$(curl -sS -b /tmp/dealer.cookies -o /tmp/check.json -w '%{http_code}' "$DEALER_URL$path")"
            test "$code" = 200 || { echo "$path failed status=$code"; cat /tmp/check.json; exit 1; }
            echo "$path PASS"
          done
          code="$(curl -sS -b /tmp/admin.cookies -o /tmp/users.json -w '%{http_code}' "$DEALER_URL/api/admin/users")"
          test "$code" = 200 || { cat /tmp/users.json; exit 1; }
          jq -e '.ok==true' /tmp/users.json >/dev/null
          echo 'admin authority PASS'
