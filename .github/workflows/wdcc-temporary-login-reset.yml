name: WDCC Pre-Regression Dealer Verification
on:
  push:
    branches: [ops/reset-wdcc-logins]
    paths:
      - '.github/workflows/wdcc-temporary-login-reset.yml'
      - 'scripts/wdcc-login-ui-e2e.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DEALER_URL: https://wdcc-dealer-portal-n9u8asox5-cpxagency.vercel.app
      BOOTSTRAP_URL: https://wdcc-dealer-portal-n9u8asox5-cpxagency.vercel.app/?_vercel_share=ICv7cb0gFT9QcQBmr0NxaJMi8cwjWfvj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify dealer and admin login plus privileged APIs
        run: node scripts/wdcc-login-ui-e2e.cjs
