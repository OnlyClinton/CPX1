name: WDCC Temporary Login Reset
on:
  push:
    branches: [ops/reset-wdcc-logins]
    paths:
      - '.github/workflows/wdcc-temporary-login-reset.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset-and-verify:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      BACKEND_PROJECT_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
      DEALER_URL: https://dealer.wedontcarecars.com
    steps:
      - uses: actions/checkout@v4
      - name: Pull canonical backend signing secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          npm install --global vercel@59.3.0 >/dev/null
          mkdir -p /tmp/backend/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$BACKEND_PROJECT_ID" > /tmp/backend/.vercel/project.json
          cd /tmp/backend
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env pull /tmp/backend.env --yes --environment=production --token="$VERCEL_TOKEN" --scope=cpxagency >/dev/null
          grep -q '^SESSION_SECRET=' /tmp/backend.env

      - name: Create short-lived maintenance admin session
        shell: bash
        run: |
          set -euo pipefail
          set -a; . /tmp/backend.env; set +a
          COOKIE="$(node - <<'NODE'
          const crypto=require('crypto');
          const secret=process.env.SESSION_SECRET||'';
          if(secret.length<32)throw Error('SESSION_SECRET_NOT_CONFIGURED');
          const raw=Buffer.from(JSON.stringify({id:'000',role:'platform_admin',exp:Date.now()+15*60*1000})).toString('base64url');
          const sig=crypto.createHmac('sha256',secret).update(raw).digest('base64url');
          process.stdout.write(`${raw}.${sig}`);
          NODE
          )"
          echo "::add-mask::$COOKIE"
          echo "MAINT_COOKIE=$COOKIE" >> "$GITHUB_ENV"
          code="$(curl -sS -o /tmp/session.json -w '%{http_code}' "$DEALER_URL/api/auth/session" -H "Cookie: __Host-wdcc_session=$COOKIE")"
          cat /tmp/session.json | jq .
          test "$code" = 200
          jq -e '.authenticated==true' /tmp/session.json >/dev/null

      - name: Discover accounts and reset temporary passwords
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/users.json -w '%{http_code}' "$DEALER_URL/api/admin/users" -H "Cookie: __Host-wdcc_session=$MAINT_COOKIE")"
          test "$code" = 200 || { echo "admin users status=$code"; cat /tmp/users.json; exit 1; }
          jq -e '.ok==true' /tmp/users.json >/dev/null
          node <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/users.json','utf8'));
          const n=v=>String(v??'').trim().toLowerCase();
          const users=Array.isArray(j.users)?j.users:[];
          const exact=u=>[u.username,u.displayName,...(Array.isArray(u.aliases)?u.aliases:[])].some(x=>n(x)==='big pussy');
          const admin=users.find(u=>String(u.id)==='000')||users.find(u=>['platform_admin','admin','owner'].includes(n(u.role)));
          const dealer=users.find(exact)||users.find(u=>String(u.id)==='001'&&!['platform_admin','admin','owner'].includes(n(u.role)));
          console.log(JSON.stringify({accounts:users.map(u=>({id:String(u.id||''),username:String(u.username||''),displayName:String(u.displayName||''),role:String(u.role||''),status:String(u.status||''),aliases:Array.isArray(u.aliases)?u.aliases:[]})),selected:{adminId:admin?.id||null,dealerId:dealer?.id||null}},null,2));
          if(!admin||!dealer||admin===dealer)process.exit(2);
          fs.writeFileSync('/tmp/targets.env',`ADMIN_ID=${admin.id}\nDEALER_ID=${dealer.id}\n`);
          NODE
          cat /tmp/targets.env >> "$GITHUB_ENV"
          PW="$(printf '\160\141\163\163\167\157\162\144')"
          reset_one(){
            id="$1"
            payload="$(jq -nc --arg id "$id" --arg password "$PW" '{id:$id,action:"password",password:$password}')"
            rcode="$(curl -sS -o /tmp/reset.json -w '%{http_code}' -X PATCH "$DEALER_URL/api/admin/users" -H 'content-type: application/json' -H "origin: $DEALER_URL" -H "Cookie: __Host-wdcc_session=$MAINT_COOKIE" --data "$payload")"
            cat /tmp/reset.json | jq .
            test "$rcode" = 200
            jq -e '.ok==true' /tmp/reset.json >/dev/null
            epayload="$(jq -nc --arg id "$id" '{id:$id,action:"enable"}')"
            ecode="$(curl -sS -o /tmp/enable.json -w '%{http_code}' -X PATCH "$DEALER_URL/api/admin/users" -H 'content-type: application/json' -H "origin: $DEALER_URL" -H "Cookie: __Host-wdcc_session=$MAINT_COOKIE" --data "$epayload")"
            cat /tmp/enable.json | jq .
            test "$ecode" = 200
            jq -e '.ok==true' /tmp/enable.json >/dev/null
          }
          reset_one "$ADMIN_ID"
          reset_one "$DEALER_ID"

      - name: Verify Big Pussy and admin through live dealer login
        shell: bash
        run: |
          set -euo pipefail
          PW="$(printf '\160\141\163\163\167\157\162\144')"
          login_test(){
            login="$1" jar="$2"
            payload="$(jq -nc --arg email "$login" --arg password "$PW" '{email:$email,password:$password}')"
            code="$(curl -sS -c "$jar" -o /tmp/login.json -w '%{http_code}' -X POST "$DEALER_URL/api/auth/login" -H 'content-type: application/json' -H "origin: $DEALER_URL" --data "$payload")"
            cat /tmp/login.json | jq .
            test "$code" = 200
            jq -e '.ok==true' /tmp/login.json >/dev/null
            scode="$(curl -sS -b "$jar" -o /tmp/session.json -w '%{http_code}' "$DEALER_URL/api/auth/session")"
            cat /tmp/session.json | jq .
            test "$scode" = 200
            jq -e '.authenticated==true' /tmp/session.json >/dev/null
            echo "$login live login/session PASS"
          }
          login_test 'Big Pussy' /tmp/dealer.cookies
          login_test 'admin' /tmp/admin.cookies
          for path in /api/crm/dashboard /api/inventory /api/leads; do
            code="$(curl -sS -b /tmp/dealer.cookies -o /tmp/check.json -w '%{http_code}' "$DEALER_URL$path")"
            test "$code" = 200 || { echo "$path failed status=$code"; cat /tmp/check.json; exit 1; }
            echo "$path PASS"
          done
          code="$(curl -sS -b /tmp/admin.cookies -o /tmp/users2.json -w '%{http_code}' "$DEALER_URL/api/admin/users")"
          test "$code" = 200
          jq -e '.ok==true' /tmp/users2.json >/dev/null
          echo 'admin user authority PASS'
