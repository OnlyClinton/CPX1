name: WDCC Temporary Login Reset
on:
  push:
    branches: [ops/reset-wdcc-logins]
    paths:
      - '.github/workflows/wdcc-temporary-login-reset.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset-and-verify:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      BACKEND_PROJECT_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
      DEALER_URL: https://dealer.wedontcarecars.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pull canonical backend production bindings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          npm install --global vercel@59.3.0 >/dev/null
          mkdir -p /tmp/backend/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$BACKEND_PROJECT_ID" > /tmp/backend/.vercel/project.json
          cd /tmp/backend
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env pull /tmp/backend.env --yes --environment=production --token="$VERCEL_TOKEN" --scope=cpxagency >/dev/null
          grep -q '^BLOB_READ_WRITE_TOKEN=' /tmp/backend.env
          grep -q '^SESSION_SECRET=' /tmp/backend.env

      - name: Back up state and reset temporary login hashes
        shell: bash
        run: |
          set -euo pipefail
          set -a; . /tmp/backend.env; set +a
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import {get,head,put,BlobPreconditionFailedError} from '@vercel/blob';
          const token=process.env.BLOB_READ_WRITE_TOKEN;
          const path='private/state/platform-v3.json';
          const ADMIN_HASH='scrypt$wJ9O58L25349JwueUXoWixwt94LTLa5k$DA47-QCl2j-E473RprUhmZHFemM5zlqwCD59Jl_pw-TKErlR_PCPdRlm9lRO2kO3fma5QrjUUQdLy--Ugif73w';
          const DEALER_HASH='scrypt$IfgTAHgSDPhNJMn9RFMUkI_-Ad0S3fyv$JrdkoPaAPQr0B-JUk_gqwh16Mi6BNi6Gths4F_LBiaLq5MCJDGAofACMR21oCJo_qhxQy40t33rmTQy7m_d96w';
          const norm=v=>String(v??'').trim().toLowerCase();
          const identities=u=>[u?.id,u?.email,u?.secondaryEmail,u?.username,u?.loginAlias,u?.displayName,...(Array.isArray(u?.aliases)?u.aliases:[])].map(norm).filter(Boolean);
          async function stableRead(){
            for(let i=0;i<3;i++){
              const m1=await head(path,{token});
              const r=await get(path,{access:'private',useCache:false,token});
              if(!r||r.statusCode!==200||!r.stream)throw Error('STATE_READ_FAILED');
              const chunks=[]; for await(const c of r.stream)chunks.push(c);
              const raw=Buffer.concat(chunks); const m2=await head(path,{token});
              if(m1.etag===m2.etag)return {raw,etag:m2.etag,state:JSON.parse(raw.toString('utf8'))};
            }
            throw Error('STATE_TOO_HOT');
          }
          const before=await stableRead();
          const state=before.state; state.users=Array.isArray(state.users)?state.users:[]; state.audit=Array.isArray(state.audit)?state.audit:[];
          const admin=state.users.find(u=>String(u?.id)==='000') || state.users.find(u=>['platform_admin','admin','owner'].includes(norm(u?.role)));
          const exactDealer=state.users.find(u=>identities(u).includes('big pussy'));
          const fallbackDealer=state.users.find(u=>String(u?.id)==='001'&&!['platform_admin','admin','owner'].includes(norm(u?.role)));
          const dealer=exactDealer||fallbackDealer;
          if(!admin||!dealer||admin===dealer){
            console.error(JSON.stringify({error:'TARGET_USERS_NOT_FOUND',hasAdmin:Boolean(admin),hasDealer:Boolean(dealer),userIds:state.users.map(u=>({id:String(u?.id??''),role:String(u?.role??''),active:!(u?.disabled||u?.status==='disabled')}))},null,2));
            process.exit(2);
          }
          const now=new Date().toISOString();
          const addAlias=(u,a)=>{u.aliases=Array.isArray(u.aliases)?u.aliases:[];if(!u.aliases.some(x=>norm(x)===norm(a)))u.aliases.push(a)};
          admin.passwordHash=ADMIN_HASH; admin.loginAlias='admin'; addAlias(admin,'admin'); admin.status='active'; admin.disabled=false; admin.updatedAt=now;
          dealer.passwordHash=DEALER_HASH; dealer.loginAlias='Big Pussy'; addAlias(dealer,'Big Pussy'); dealer.status='active'; dealer.disabled=false; dealer.updatedAt=now;
          const stamp=now.replace(/[:.]/g,'-');
          const backup=`private/state/backups/platform-v3-pre-temp-login-reset-r${Number(state.revision||0)}-${stamp}-${crypto.randomUUID()}.json`;
          await put(backup,before.raw,{access:'private',addRandomSuffix:false,allowOverwrite:false,contentType:'application/json',token});
          state.audit.push({id:crypto.randomUUID(),at:now,action:'user.temporary_login_reset',actor:'authorized-maintenance',userId:String(admin.id),loginAlias:'admin',backup});
          state.audit.push({id:crypto.randomUUID(),at:now,action:'user.temporary_login_reset',actor:'authorized-maintenance',userId:String(dealer.id),loginAlias:'Big Pussy',backup});
          state.revision=Number(state.revision||0)+1; state.updatedAt=now;
          try{
            await put(path,JSON.stringify(state,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:before.etag,token});
          }catch(e){if(e instanceof BlobPreconditionFailedError)throw Error('STATE_CHANGED_DURING_RESET');throw e}
          console.log(JSON.stringify({ok:true,revision:state.revision,backup,adminId:String(admin.id),dealerId:String(dealer.id),adminRole:String(admin.role),dealerRole:String(dealer.role)},null,2));
          NODE

      - name: Verify both live logins and sessions
        shell: bash
        run: |
          set -euo pipefail
          PW="$(printf '\160\141\163\163\167\157\162\144')"
          login_test(){
            login="$1" jar="$2" expected="$3"
            payload="$(jq -nc --arg email "$login" --arg password "$PW" '{email:$email,password:$password}')"
            code="$(curl -sS -c "$jar" -o /tmp/login.json -w '%{http_code}' -X POST "$DEALER_URL/api/auth/login" -H 'content-type: application/json' -H "origin: $DEALER_URL" --data "$payload")"
            jq . /tmp/login.json
            test "$code" = 200
            jq -e '.ok==true' /tmp/login.json >/dev/null
            scode="$(curl -sS -b "$jar" -o /tmp/session.json -w '%{http_code}' "$DEALER_URL/api/auth/session")"
            jq . /tmp/session.json
            test "$scode" = 200
            jq -e '.authenticated==true' /tmp/session.json >/dev/null
            role="$(jq -r '.user.role // .role // ""' /tmp/session.json)"
            test -n "$role"
            echo "$login live session PASS role=$role"
          }
          login_test 'Big Pussy' /tmp/dealer.cookies dealer
          login_test 'admin' /tmp/admin.cookies admin

          for path in /api/crm/dashboard /api/inventory /api/leads; do
            code="$(curl -sS -b /tmp/dealer.cookies -o /tmp/check.json -w '%{http_code}' "$DEALER_URL$path")"
            test "$code" = 200 || { echo "$path failed status=$code"; cat /tmp/check.json; exit 1; }
            jq -e '.ok!=false' /tmp/check.json >/dev/null 2>&1 || { cat /tmp/check.json; exit 1; }
            echo "$path PASS"
          done

          code="$(curl -sS -b /tmp/admin.cookies -o /tmp/users.json -w '%{http_code}' "$DEALER_URL/api/admin/users")"
          test "$code" = 200 || { echo "admin users failed status=$code"; cat /tmp/users.json; exit 1; }
          jq -e '.ok==true and ((.users//[])|map(select(.id=="000"))|length)==1' /tmp/users.json >/dev/null
          echo 'admin user authority PASS'
