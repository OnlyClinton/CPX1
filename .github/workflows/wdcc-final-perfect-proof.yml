name: WDCC Final Perfect Visual Proof

on:
  push:
    branches:
      - fix/wdcc-locked-contract-20260826
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-final-perfect-visual-proof
  cancel-in-progress: true

env:
  EXPECTED_HERO_SIZE: '145504'
  EXPECTED_HERO_SHA256: 1d7a0e4fced7450f2bbc66443d44b1f35bd9e24a6366308362aafa65576d3eb2

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate immutable visual assets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test "$(wc -c < public/wdcc-hero-v2.webp | tr -d ' ')" = "$EXPECTED_HERO_SIZE"
          printf '%s  %s\n' "$EXPECTED_HERO_SHA256" public/wdcc-hero-v2.webp | sha256sum -c -
          test -s public/wdcc-logo-transparent.webp
          test -s app/LockedIntro.tsx
          test -s app/ReferenceCloneHome.tsx
          test -s app/visual-perfect.css
          test -f 'app/vehicle/[id]/page.tsx'

      - name: Build isolated Cloudflare artifact
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0 playwright@1.55.0
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets
          npx playwright install --with-deps chromium >/dev/null

      - name: Create no-route Worker config
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          cfg.name='wdcc-perfect-preview';
          cfg.workers_dev=true;
          cfg.preview_urls=true;
          delete cfg.route;
          delete cfg.routes;
          fs.writeFileSync('wrangler.perfect.jsonc',JSON.stringify(cfg,null,2)+'\n');
          NODE
          ! grep -qi 'wedontcarecars.com' wrangler.perfect.jsonc

      - name: Deploy no-production preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.perfect.jsonc 2>&1 | tee /tmp/wdcc-perfect.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wdcc-perfect.log | tail -1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" | tee preview-url.txt

      - name: Smoke exact deployed assets and routes
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          code=000
          for i in $(seq 1 30); do
            code="$(curl -sS -L -o /tmp/home.html -w '%{http_code}' "$URL/?proof=$GITHUB_RUN_ID-$i" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          test "$code" = 200
          grep -qi "we don.t care" /tmp/home.html
          test "$(curl -sS -L -o /tmp/hero.webp -w '%{http_code}' "$URL/wdcc-hero-v2.webp?proof=$GITHUB_RUN_ID")" = 200
          printf '%s  %s\n' "$EXPECTED_HERO_SHA256" /tmp/hero.webp | sha256sum -c -
          test "$(curl -sS -L -o /tmp/logo.webp -w '%{http_code}' "$URL/wdcc-logo-transparent.webp?proof=$GITHUB_RUN_ID")" = 200
          test -s /tmp/logo.webp
          test "$(curl -sS -L -o /tmp/inventory.json -w '%{http_code}' "$URL/api/inventory?proof=$GITHUB_RUN_ID")" = 200
          test "$(curl -sS -L -o /tmp/dealer.html -w '%{http_code}' "$URL/dealer?proof=$GITHUB_RUN_ID")" = 200

      - name: Capture and hard-check actual visuals
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-proof
          node - <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const url=process.env.URL;
            const browser=await chromium.launch({headless:true});
            const proof={url,sha:process.env.GITHUB_SHA,mobile:{},desktop:{},dealer:{}};
            const waitImg=async(p,s,w=100)=>{await p.locator(s).waitFor({state:'visible',timeout:12000});await p.waitForFunction(({s,w})=>{const i=document.querySelector(s);return i&&i.complete&&i.naturalWidth>=w},{s,w},{timeout:12000});};
            try{
              const m=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
              const p=await m.newPage(); const failures=[]; const consoleErrors=[];
              p.on('response',r=>{if(r.status()>=400) failures.push({status:r.status(),url:r.url()})});
              p.on('requestfailed',r=>failures.push({failed:r.url(),error:r.failure()?.errorText}));
              p.on('console',msg=>{if(msg.type()==='error')consoleErrors.push(msg.text())});
              p.on('pageerror',e=>consoleErrors.push(String(e)));
              await p.goto(`${url}/?m=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
              await waitImg(p,'.li-scene img',1000); await waitImg(p,'.li-badge img',200); await p.waitForTimeout(1000);
              const introLogo=await p.locator('.li-badge img').evaluate(el=>{const s=getComputedStyle(el);const b=el.getBoundingClientRect();return{src:el.getAttribute('src'),opacity:s.opacity,visibility:s.visibility,w:b.width,h:b.height}});
              if(!String(introLogo.src).includes('wdcc-logo-transparent.webp')||Number(introLogo.opacity)<.9||introLogo.visibility==='hidden'||introLogo.w<120) throw Error(`INTRO_LOGO_BAD ${JSON.stringify(introLogo)}`);
              await p.screenshot({path:'visual-proof/mobile-intro.png'});
              await p.getByRole('button',{name:/skip intro/i}).click(); await p.waitForTimeout(250);
              await waitImg(p,'.rh-hero-art',1000);
              const logo=await p.locator('.rh-logo img').evaluate(el=>{const s=getComputedStyle(el);const b=el.getBoundingClientRect();return{src:el.getAttribute('src'),opacity:s.opacity,visibility:s.visibility,w:b.width,h:b.height}});
              if(!String(logo.src).includes('wdcc-logo-transparent.webp')||Number(logo.opacity)<.9||logo.visibility==='hidden'||logo.w<45) throw Error(`MOBILE_HEADER_LOGO_BAD ${JSON.stringify(logo)}`);
              const pseudo=await p.locator('.rh-logo').evaluate(el=>getComputedStyle(el,'::after').display);
              if(pseudo!=='none') throw Error(`STALE_HEADER_PSEUDO_${pseudo}`);
              const h1=p.locator('.rh-copy h1'), hb=await h1.boundingBox();
              if(await h1.locator('span').count()!==3||!hb||hb.x<0||hb.x+hb.width>390) throw Error('MOBILE_HEADLINE_BAD');
              if(await p.locator('.rh-photo img[src*="wdcc-hero-v2.webp"]').count()) throw Error('MOBILE_INVENTORY_HERO_REUSE');
              if(await p.getByRole('link',{name:/call sean/i}).count()<1) throw Error('CALL_SEAN_MISSING');
              const heroArt=await p.locator('.rh-hero-art').boundingBox(); const copy=await p.locator('.rh-copy').boundingBox();
              if(!heroArt||!copy||heroArt.height>410||copy.y<285) throw Error(`MOBILE_HERO_COMPOSITION_BAD ${JSON.stringify({heroArt,copy})}`);
              const critical=failures.filter(x=>x.status>=500||(x.status===404&&/\/(vehicle|inventory)\//.test(x.url||'')));
              if(critical.length||consoleErrors.length) throw Error(`MOBILE_RUNTIME_ERRORS ${JSON.stringify({critical,consoleErrors})}`);
              await p.screenshot({path:'visual-proof/mobile-hero.png'}); await p.screenshot({path:'visual-proof/mobile-full.png',fullPage:true});
              proof.mobile={introLogo,logo,pseudo,hb,heroArt,copy,placeholders:await p.locator('.rh-photo-placeholder').count(),failures,consoleErrors}; await m.close();

              const d=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1}); const q=await d.newPage(); const derrors=[];
              q.on('console',msg=>{if(msg.type()==='error')derrors.push(msg.text())}); q.on('pageerror',e=>derrors.push(String(e)));
              await q.goto(`${url}/?d=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000}); await waitImg(q,'.li-scene img',1000); await waitImg(q,'.li-badge img',200); await q.waitForTimeout(1000); await q.screenshot({path:'visual-proof/desktop-intro.png'}); await q.getByRole('button',{name:/skip intro/i}).click(); await q.waitForTimeout(250); await waitImg(q,'.rh-hero-art',1000);
              const dl=await q.locator('.rh-logo img').evaluate(el=>{const s=getComputedStyle(el);const b=el.getBoundingClientRect();return{src:el.getAttribute('src'),opacity:s.opacity,visibility:s.visibility,w:b.width,h:b.height}}); if(Number(dl.opacity)<.9||dl.visibility==='hidden'||dl.w<50)throw Error(`DESKTOP_HEADER_LOGO_BAD ${JSON.stringify(dl)}`);
              const dh=q.locator('.rh-copy h1'),db=await dh.boundingBox(); if(!db||db.x<0||db.x+db.width>1440)throw Error('DESKTOP_HEADLINE_BAD'); if(await q.locator('.rh-photo img[src*="wdcc-hero-v2.webp"]').count())throw Error('DESKTOP_INVENTORY_HERO_REUSE'); if(derrors.length)throw Error(`DESKTOP_CONSOLE_ERRORS ${JSON.stringify(derrors)}`);
              await q.screenshot({path:'visual-proof/desktop-hero.png'}); await q.screenshot({path:'visual-proof/desktop-full.png',fullPage:true}); proof.desktop={logo:dl,headline:db,placeholders:await q.locator('.rh-photo-placeholder').count(),consoleErrors:derrors};
              const dealer=await d.newPage(); await dealer.goto(`${url}/dealer?visual=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000}); await dealer.waitForTimeout(800); await dealer.screenshot({path:'visual-proof/dealer.png'}); proof.dealer={url:dealer.url(),title:await dealer.title()}; await d.close();
            } finally {await browser.close()}
            fs.writeFileSync('visual-proof/metrics.json',JSON.stringify(proof,null,2)+'\n');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Publish exact preview result
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          echo '### WDCC final-perfect visual proof' >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: ${URL:-not-created}" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'No production route, alias, DNS, or provider setting changed.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-final-perfect-visual-proof
          path: |
            preview-url.txt
            visual-proof/
          if-no-files-found: warn
          retention-days: 7
