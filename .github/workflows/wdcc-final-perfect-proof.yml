name: WDCC Final Perfect Visual Proof

on:
  push:
    branches:
      - fix/wdcc-locked-contract-20260826
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-final-perfect-visual-proof
  cancel-in-progress: false

env:
  EXPECTED_HERO_SIZE: '145504'
  EXPECTED_HERO_SHA256: 1d7a0e4fced7450f2bbc66443d44b1f35bd9e24a6366308362aafa65576d3eb2

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate exact visual authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test "$(wc -c < public/wdcc-hero-v2.webp | tr -d ' ')" = "$EXPECTED_HERO_SIZE"
          printf '%s  %s\n' "$EXPECTED_HERO_SHA256" public/wdcc-hero-v2.webp | sha256sum -c -
          test -s public/wdcc-official-logo.webp
          test -s app/LockedIntro.tsx
          test -s app/ReferenceCloneHome.tsx
          test -s app/owner-visual-polish.css
          test -s app/owner-visual-hotfix.css
          test -s app/owner-optical-final.css
          test -f 'app/vehicle/[id]/page.tsx'
          grep -q 'wdcc-official-logo.webp' app/LockedIntro.tsx
          grep -q 'wdcc-official-logo.webp' app/ReferenceCloneHome.tsx
          grep -q 'clip-path:circle' app/LockedIntro.tsx
          grep -q 'owner-visual-polish.css' app/layout.tsx
          grep -q 'owner-visual-hotfix.css' app/layout.tsx
          grep -q 'owner-optical-final.css' app/layout.tsx
          ! grep -q 'brand-hero-final.css' app/layout.tsx
          ! grep -q 'preview-visual-corrections.css' app/layout.tsx
          ! grep -q 'li-dock' app/LockedIntro.tsx
          grep -q 'animation:none' app/LockedIntro.tsx

      - name: Build isolated Cloudflare artifact
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0 playwright@1.55.0
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets
          npx playwright install --with-deps chromium >/dev/null

      - name: Create no-route Worker config
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          cfg.name='wdcc-perfect-preview';
          cfg.workers_dev=true;
          cfg.preview_urls=true;
          delete cfg.route;
          delete cfg.routes;
          fs.writeFileSync('wrangler.perfect.jsonc',JSON.stringify(cfg,null,2)+'\n');
          NODE
          ! grep -qi 'wedontcarecars.com' wrangler.perfect.jsonc

      - name: Deploy no-production preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.perfect.jsonc 2>&1 | tee /tmp/wdcc-perfect.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wdcc-perfect.log | tail -1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" | tee preview-url.txt

      - name: Smoke exact deployed assets and routes
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          code=000
          for i in $(seq 1 30); do
            code="$(curl -sS -L -o /tmp/home.html -w '%{http_code}' "$URL/?proof=$GITHUB_RUN_ID-$i" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          test "$code" = 200
          grep -qi "we don.t care" /tmp/home.html
          grep -q 'wdcc-official-logo.webp' /tmp/home.html
          test "$(curl -sS -L -o /tmp/hero.webp -w '%{http_code}' "$URL/wdcc-hero-v2.webp?proof=$GITHUB_RUN_ID")" = 200
          printf '%s  %s\n' "$EXPECTED_HERO_SHA256" /tmp/hero.webp | sha256sum -c -
          test "$(curl -sS -L -o /tmp/logo.webp -w '%{http_code}' "$URL/wdcc-official-logo.webp?proof=$GITHUB_RUN_ID")" = 200
          test -s /tmp/logo.webp
          test "$(curl -sS -L -o /tmp/inventory.json -w '%{http_code}' "$URL/api/inventory?proof=$GITHUB_RUN_ID")" = 200
          test "$(curl -sS -L -o /tmp/dealer.html -w '%{http_code}' "$URL/dealer?proof=$GITHUB_RUN_ID")" = 200

      - name: Capture and hard-check actual visuals
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-proof
          node - <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const url=process.env.URL;
            const browser=await chromium.launch({headless:true});
            const proof={url,sha:process.env.GITHUB_SHA,mobile:{},desktop:{},dealer:{}};
            const waitImg=async(p,s,w=100)=>{await p.locator(s).waitFor({state:'visible',timeout:12000});await p.waitForFunction(({s,w})=>{const i=document.querySelector(s);return i&&i.complete&&i.naturalWidth>=w},{s,w},{timeout:12000});};
            const waitIntroDone=async p=>{const intro=p.locator('.li');if(await intro.count())await intro.waitFor({state:'detached',timeout:5000}).catch(async()=>{if(await intro.count())await p.getByRole('button',{name:/skip intro/i}).click({force:true,timeout:1500}).catch(()=>{})});await p.locator('.rh-hero-art').waitFor({state:'visible',timeout:5000});};
            try{
              const m=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
              const p=await m.newPage(); const errors=[];
              p.on('console',msg=>{if(msg.type()==='error')errors.push(msg.text())}); p.on('pageerror',e=>errors.push(String(e)));
              await p.goto(`${url}/?m=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
              await waitImg(p,'.li-scene img',1000); await waitImg(p,'.li-badge img',200); await p.waitForTimeout(650);
              const intro=await p.evaluate(()=>{const el=document.querySelector('.li-badge img'),scene=document.querySelector('.li-scene img'),s=getComputedStyle(el),ss=getComputedStyle(scene),b=el.getBoundingClientRect();return{src:el.currentSrc||el.src,clipPath:s.clipPath,opacity:s.opacity,w:b.width,badgeAnimation:s.animationName,sceneAnimation:ss.animationName,sceneTransform:ss.transform}});
              if(!intro.src.includes('wdcc-official-logo.webp')||!String(intro.clipPath).includes('circle')||Number(intro.opacity)<.9||intro.w<120) throw Error(`INTRO_BAD ${JSON.stringify(intro)}`);
              if(intro.badgeAnimation!=='none'||intro.sceneAnimation!=='none'||(intro.sceneTransform!=='none'&&!String(intro.sceneTransform).includes('matrix(1'))) throw Error(`INTRO_MOTION_ACTIVE ${JSON.stringify(intro)}`);
              await p.screenshot({path:'visual-proof/mobile-intro.png'}); await waitIntroDone(p); await waitImg(p,'.rh-logo img',200);
              const before=await p.evaluate(()=>{const q=s=>document.querySelector(s),st=s=>getComputedStyle(q(s)),r=s=>q(s).getBoundingClientRect();return{logoSrc:q('.rh-logo img').currentSrc||q('.rh-logo img').src,logoW:r('.rh-logo img').width,menu:st('.rh-menu').display,grid:st('.rh-grid').display,cardW:r('.rh-card').width,utilityDisplay:st('.rh-utility').display,utilityH:r('.rh-utility').height,utilityTop:r('.rh-utility').top,headerTop:r('.rh-header').top,headerPosition:st('.rh-header').position,utilityPosition:st('.rh-utility').position}});
              if(!before.logoSrc.includes('wdcc-official-logo.webp')||before.logoW<88||before.menu==='none'||before.grid!=='flex'||before.cardW>360) throw Error(`MOBILE_LAYOUT_BAD ${JSON.stringify(before)}`);
              if(before.utilityDisplay==='none'||before.utilityH<24) throw Error(`MOBILE_UTILITY_COLLAPSED ${JSON.stringify(before)}`);
              if(!['fixed','sticky'].includes(before.headerPosition)||!['fixed','sticky'].includes(before.utilityPosition)) throw Error(`MOBILE_PIN_MODE_BAD ${JSON.stringify(before)}`);
              await p.evaluate(()=>scrollTo(0,700)); await p.waitForTimeout(180);
              const after=await p.evaluate(()=>{const u=document.querySelector('.rh-utility').getBoundingClientRect(),h=document.querySelector('.rh-header').getBoundingClientRect();return{uTop:u.top,uH:u.height,hTop:h.top}});
              if(Math.abs(after.uTop)>2||after.uH<24||Math.abs(after.hTop-after.uH)>3) throw Error(`MOBILE_STACK_NOT_PINNED ${JSON.stringify(after)}`);
              await p.evaluate(()=>scrollTo(0,0)); await p.waitForTimeout(100);
              const h1=p.locator('.rh-copy h1'),hb=await h1.boundingBox(); if(await h1.locator('span').count()!==3||!hb||hb.x<0||hb.x+hb.width>390) throw Error(`MOBILE_HEADLINE_BAD ${JSON.stringify(hb)}`);
              const hero=await p.locator('.rh-hero-art').boundingBox(),copy=await p.locator('.rh-copy').boundingBox(); if(!hero||!copy||hero.height>420||copy.height>500) throw Error(`MOBILE_SCALE_BAD ${JSON.stringify({hero,copy})}`);
              if(await p.locator('.rh-photo img[src*="wdcc-hero-v2.webp"]').count()) throw Error('INVENTORY_HERO_REUSE'); if(errors.length) throw Error(`MOBILE_ERRORS ${JSON.stringify(errors)}`);
              await p.screenshot({path:'visual-proof/mobile-hero.png'}); await p.screenshot({path:'visual-proof/mobile-full.png',fullPage:true}); proof.mobile={intro,before,after,hb,hero,copy,errors}; await m.close();

              const d=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1}); const q=await d.newPage();
              await q.goto(`${url}/?d=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000}); await waitImg(q,'.li-scene img',1000); await waitImg(q,'.li-badge img',200); await q.waitForTimeout(650); await q.screenshot({path:'visual-proof/desktop-intro.png'}); await waitIntroDone(q); await waitImg(q,'.rh-logo img',200);
              const dl=await q.locator('.rh-logo img').evaluate(el=>{const b=el.getBoundingClientRect();return{src:el.currentSrc||el.src,w:b.width}}); if(!dl.src.includes('wdcc-official-logo.webp')||dl.w<88) throw Error(`DESKTOP_LOGO_BAD ${JSON.stringify(dl)}`);
              const dh=q.locator('.rh-copy h1'),db=await dh.boundingBox(); if(!db||db.x<0||db.x+db.width>1440) throw Error(`DESKTOP_HEADLINE_BAD ${JSON.stringify(db)}`);
              const comp=await q.evaluate(()=>({grid:getComputedStyle(document.querySelector('.rh-grid')).display,menu:getComputedStyle(document.querySelector('.rh-menu')).display})); if(comp.grid!=='grid'||comp.menu!=='none') throw Error(`DESKTOP_LAYOUT_BAD ${JSON.stringify(comp)}`);
              await q.screenshot({path:'visual-proof/desktop-hero.png'}); await q.screenshot({path:'visual-proof/desktop-full.png',fullPage:true}); proof.desktop={dl,db,comp};
              const dealer=await d.newPage(); await dealer.goto(`${url}/dealer?visual=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000}); await dealer.waitForTimeout(800); await dealer.screenshot({path:'visual-proof/dealer.png'}); proof.dealer={url:dealer.url(),title:await dealer.title()}; await d.close();
            }finally{await browser.close()}
            fs.writeFileSync('visual-proof/metrics.json',JSON.stringify(proof,null,2)+'\n');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Publish exact preview result
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          echo '### WDCC final-perfect visual proof' >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: ${URL:-not-created}" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Static intro, large round badge, visible pinned utility/header stack, mobile carousel and normalized scale verified.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No production route, alias, DNS, or provider setting changed.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-final-perfect-visual-proof
          path: |
            preview-url.txt
            visual-proof/
          if-no-files-found: warn
          retention-days: 7
