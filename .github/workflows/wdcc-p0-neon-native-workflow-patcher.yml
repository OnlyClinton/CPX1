name: WDCC P0 Neon Native Workflow Patcher

on:
  push:
    branches: [fix/wdcc-p0-neon-native-workflow-20260827]
    paths:
      - '.github/workflows/wdcc-p0-neon-native-workflow-patcher.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wdcc-p0-neon-native-workflow-20260827
          fetch-depth: 1
      - name: Replace obsolete local signer dependency with real Neon session proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('.github/workflows/wdcc-owner-approved-p0-dealer-upload.yml')
          s=p.read_text()
          def one(old,new):
              global s
              n=s.count(old)
              if n!=1: raise SystemExit(f'expected one match for {old[:80]!r}, found {n}')
              s=s.replace(old,new,1)

          one('  P0_SHA: 3e189ee26f55bf7c7eb76a85210e29ddea045c95\n','  P0_SHA: e3332fea49587f41cfd15cb041ebba6eb6db68d4\n')
          one("      github.event.comment.body == 'PROMOTE-WDCC-P0-DEALER-UPLOAD-3E189EE2'\n","      github.event.comment.body == 'PROMOTE-WDCC-P0-DEALER-UPLOAD-NEON-E3332FEA'\n")
          one('  VERCEL_SCOPE: cpxagency\n  VERCEL_ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM\n  PHOENIX_PROJECT_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR\n','')
          matches=re.findall(r'^      VERCEL_TOKEN: .*$',s,flags=re.M)
          if len(matches)!=1: raise SystemExit(f'expected one VERCEL_TOKEN env line, found {len(matches)}')
          literal='$'+'{{ secrets.WDCC_DEALER_E2E_PASSWORD }}'
          s=s.replace(matches[0],f'      WDCC_DEALER_E2E_PASSWORD: {literal}',1)
          one('          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VERCEL_TOKEN; do\n','          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID WDCC_DEALER_E2E_PASSWORD; do\n')
          one("          grep -Fq 'sessionCookieHeader' app/api/auth/login/route.ts\n","          grep -Fq 'return neonCurrentUser();' lib/auth.ts\n          grep -Fq 'sessionAuthority()' app/api/health/route.ts\n          ! grep -Fq 'sessionCookieHeader(user)' app/api/auth/login/route.ts\n")
          one('          npm install --global vercel@59.3.0 >/dev/null\n','')

          start=s.index('      - name: Pull existing stable WDCC session authority without exposing it\n')
          end=s.index('      - name: Generate workers.dev-only Durable Object configs\n',start)
          replacement='''      - name: Generate run-scoped internal state and media authority\n        shell: bash\n        run: |\n          set -euo pipefail\n          umask 077\n          openssl rand -hex 32 > /tmp/state.token\n          openssl rand -hex 32 > /tmp/media.token\n          test "$(wc -c < /tmp/state.token)" -ge 64\n          test "$(wc -c < /tmp/media.token)" -ge 64\n          echo 'P0_INTERNAL_SERVICE_AUTHORITY=GENERATED'\n\n'''
          s=s[:start]+replacement+s[end:]

          one('      - name: Deploy isolated exact dealer application and inject stable secrets\n','      - name: Deploy isolated exact dealer application and inject internal service secrets\n')
          one('          cat /tmp/session.secret | npx wrangler secret put SESSION_SECRET --name "$APP_WORKER" >/dev/null\n','')

          stage_start=s.index('      - name: Stage exact vehicle create photo checkpoint publish isolation and cleanup\n')
          stage_end=s.index('      - name: Capture dealer front-door rollback version\n',stage_start)
          stage=s[stage_start:stage_end]
          stage_pat=re.compile(r"          SESSION_FILE=/tmp/session\.secret node - <<'NODE'\n.*?          stock=\"WDCC-QA-P0-\$GITHUB_RUN_ID\"\n",re.S)
          if len(stage_pat.findall(stage))!=1: raise SystemExit(f'staged forged-cookie block matches={len(stage_pat.findall(stage))}')
          login='''          printf '::add-mask::%s\\n' "$WDCC_DEALER_E2E_PASSWORD"\n          jq -nc --arg p "$WDCC_DEALER_E2E_PASSWORD" '{username:"dealer",password:$p}' > /tmp/stage-login-body.json\n          test "$(curl --http1.1 -sS -c /tmp/dealer.jar -X POST -H 'Content-Type: application/json' --data-binary @/tmp/stage-login-body.json -o /tmp/stage-login.json -w '%{http_code}' "$APP_URL/api/auth/login")" = 200\n          jq -e '.ok==true and (.role=="dealer_agent" or .role=="dealer")' /tmp/stage-login.json >/dev/null\n          test "$(curl --http1.1 -sS -b /tmp/dealer.jar -o /tmp/stage-session.json -w '%{http_code}' "$APP_URL/api/auth/session")" = 200\n          jq -e '.authenticated==true and (.user.role=="dealer_agent" or .user.role=="dealer")' /tmp/stage-session.json >/dev/null\n          stock="WDCC-QA-P0-$GITHUB_RUN_ID"\n'''
          stage=stage_pat.sub(lambda _:login,stage,count=1)
          stage=stage.replace('-H "Cookie: $cookie"','-b /tmp/dealer.jar')
          if 'Cookie: $cookie' in stage or '/tmp/dealer.cookie' in stage: raise SystemExit('staged forged cookie reference remains')
          s=s[:stage_start]+stage+s[stage_end:]

          live_start=s.index('      - name: Promote dealer front door and prove live end to end or rollback\n')
          live=s[live_start:]
          live_pat=re.compile(r"          SESSION_FILE=/tmp/session\.secret node - <<'NODE'\n.*?stock=\"WDCC-QA-P0-LIVE-\$GITHUB_RUN_ID\"\n",re.S)
          if len(live_pat.findall(live))!=1: raise SystemExit(f'live forged-cookie block matches={len(live_pat.findall(live))}')
          live_login='''          printf '::add-mask::%s\\n' "$WDCC_DEALER_E2E_PASSWORD"\n          jq -nc --arg p "$WDCC_DEALER_E2E_PASSWORD" '{username:"dealer",password:$p}' > /tmp/live-login-body.json\n          test "$(curl --http1.1 -sS -c /tmp/live.jar -X POST -H 'Content-Type: application/json' --data-binary @/tmp/live-login-body.json -o /tmp/live-login.json -w '%{http_code}' "$DEALER_ROOT/api/auth/login")" = 200\n          jq -e '.ok==true and (.role=="dealer_agent" or .role=="dealer")' /tmp/live-login.json >/dev/null\n          test "$(curl --http1.1 -sS -b /tmp/live.jar -o /tmp/live-session.json -w '%{http_code}' "$DEALER_ROOT/api/auth/session")" = 200\n          jq -e '.authenticated==true and (.user.role=="dealer_agent" or .user.role=="dealer")' /tmp/live-session.json >/dev/null\n          stock="WDCC-QA-P0-LIVE-$GITHUB_RUN_ID"\n'''
          live=live_pat.sub(lambda _:live_login,live,count=1)
          live=live.replace('-H "Cookie: $cookie"','-b /tmp/live.jar')
          if 'Cookie: $cookie' in live: raise SystemExit('live forged cookie header remains')
          s=s[:live_start]+live

          old_header='x-wdcc-dealer-app-sha","3e189ee26f55bf7c7eb76a85210e29ddea045c95"'
          new_header='x-wdcc-dealer-app-sha","e3332fea49587f41cfd15cb041ebba6eb6db68d4"'
          if s.count(old_header)!=1: raise SystemExit(f'old frontdoor SHA header matches={s.count(old_header)}')
          s=s.replace(old_header,new_header,1)
          cleanup=re.findall(r'^          rm -f /tmp/session\.secret .*$',s,flags=re.M)
          if len(cleanup)!=1: raise SystemExit(f'cleanup session line matches={len(cleanup)}')
          s=s.replace(cleanup[0],'          rm -f /tmp/state.token /tmp/media.token /tmp/dealer.jar /tmp/live.jar /tmp/stage-login-body.json /tmp/live-login-body.json',1)
          if '/tmp/session.secret' in s: raise SystemExit('session.secret reference remains')
          if 'SESSION_FILE=' in s: raise SystemExit('SESSION_FILE reference remains')
          if 'VERCEL_TOKEN' in s: raise SystemExit('VERCEL_TOKEN reference remains')
          if '-H "Cookie: $cookie"' in s: raise SystemExit('forged Cookie header remains')
          if '/tmp/dealer.cookie' in s or '/tmp/live.cookie' in s: raise SystemExit('forged cookie file reference remains')
          if "grep -Fq 'sessionCookieHeader' app/api/auth/login/route.ts" in s: raise SystemExit('old sessionCookieHeader expectation remains')
          if 'secrets.WDCC_DEALER_E2E_PASSWORD' not in s: raise SystemExit('literal GitHub dealer password secret expression missing')
          p.write_text(s)
          PY
          rm .github/workflows/wdcc-p0-neon-native-workflow-patcher.yml
          git diff --check
          git diff -- .github/workflows/wdcc-owner-approved-p0-dealer-upload.yml
          git config user.name 'WDCC Control Proof Bot'
          git config user.email '120651995+OnlyClinton@users.noreply.github.com'
          git add -A
          git commit -m 'fix(wdcc): use real Neon sessions in P0 dealer upload gate'
          git push origin HEAD:fix/wdcc-p0-neon-native-workflow-20260827
