name: WDCC Dealer Frontdoor Source Readonly

on:
  push:
    branches: [proof/wdcc-522-immutable-parser-20260829]
    paths:
      - '.github/workflows/wdcc-dealer-frontdoor-source-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect host references only
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/wdcc-dealer-frontdoor" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > /tmp/frontdoor.raw
          grep -Eo 'https://[A-Za-z0-9._/-]+' /tmp/frontdoor.raw | sort -u || true
          strings /tmp/frontdoor.raw | grep -Ei 'vercel|wedontcarecars|backend|origin' | head -n 80 || true
          echo 'READ_ONLY=YES'
