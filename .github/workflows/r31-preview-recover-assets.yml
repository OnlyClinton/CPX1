name: Recover exact 2vfD assets for R31 preview
on:
  push:
    branches: [preview/r31-exact-live-base]
    paths:
      - '.github/workflows/r31-preview-recover-assets.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/r31-exact-live-base
      - name: Download exact a2wntmnnn logo and hero
        shell: bash
        run: |
          set -euo pipefail
          LOGO='https://wdcc-v32-storefront-a2wntmnnn-cpxagency.vercel.app/wdcc-logo-transparent.webp?_vercel_share=gUOAh4QairMdJ6YTeFedOO5kP2sx8iRx'
          HERO='https://wdcc-v32-storefront-a2wntmnnn-cpxagency.vercel.app/wdcc-hero-v2.webp?_vercel_share=9m1F1wTisGT95EXbSclUAqTGEuZu8TIX'
          curl -fsSL -L "$LOGO" -o public/wdcc-logo-transparent.webp
          curl -fsSL -L "$HERO" -o public/wdcc-hero-v2.webp
          echo "logo_bytes=$(stat -c '%s' public/wdcc-logo-transparent.webp)"
          echo "hero_bytes=$(stat -c '%s' public/wdcc-hero-v2.webp)"
          test "$(stat -c '%s' public/wdcc-logo-transparent.webp)" = '47594'
          test "$(head -c 4 public/wdcc-logo-transparent.webp)" = 'RIFF'
          test "$(head -c 4 public/wdcc-hero-v2.webp)" = 'RIFF'
          sha256sum public/wdcc-logo-transparent.webp public/wdcc-hero-v2.webp
      - name: Commit exact preview assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WDCC Preview Bot'
          git config user.email '120651995+OnlyClinton@users.noreply.github.com'
          git add public/wdcc-logo-transparent.webp public/wdcc-hero-v2.webp
          if git diff --cached --quiet; then
            echo 'Exact donor assets already match.'
          else
            git commit -m 'Use exact a2wntmnnn WDCC logo and hero for R31 preview'
            git push origin HEAD:preview/r31-exact-live-base
          fi
