name: WDCC Canonical Logo Source Fix

on:
  push:
    branches:
      - fix/wdcc-locked-contract-20260826
    paths:
      - '.github/workflows/wdcc-canonical-logo-source-fix.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace retired runtime logo references
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(grep -RIl --include='*.ts' --include='*.tsx' 'wdcc-official-logo\.webp' app/dealer app/admin app/PortalExperience.tsx 2>/dev/null || true)
          if ((${#files[@]})); then
            sed -i 's#wdcc-official-logo\.webp#wdcc-logo-transparent.webp#g' "${files[@]}"
          fi
          if grep -RIn --include='*.ts' --include='*.tsx' 'wdcc-official-logo\.webp' app/dealer app/admin app/PortalExperience.tsx 2>/dev/null; then
            echo 'retired logo reference remains' >&2
            exit 1
          fi
      - name: Commit normalized source and self-remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/wdcc-canonical-logo-source-fix.yml
          git add app/dealer app/admin app/PortalExperience.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(wdcc): use canonical logo across dealer runtime'
          git push origin HEAD:fix/wdcc-locked-contract-20260826
