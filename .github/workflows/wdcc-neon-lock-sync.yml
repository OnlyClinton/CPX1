name: WDCC Neon Lockfile Sync

on:
  push:
    branches:
      - fix/wdcc-blob-hardening-mainline-20260826
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wdcc-blob-hardening-mainline-20260826
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve Neon driver and lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install @neondatabase/serverless@latest --save --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          node -e "const p=require('./package-lock.json'); const v=p.packages?.['node_modules/@neondatabase/serverless']?.version; if(!v) process.exit(2); console.log('NEON_DRIVER='+v)"
      - name: Commit resolved lockfile to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Lockfile already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore: lock Neon serverless driver'
          git push origin HEAD:fix/wdcc-blob-hardening-mainline-20260826
