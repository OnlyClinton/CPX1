name: WDCC Cloudflare Two Slot Recovery Proof

on:
  push:
    branches: [emergency/wdcc-cloudflare-r2-20260827]
    paths:
      - '.github/workflows/wdcc-cloudflare-two-slot-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wdcc-cloudflare-two-slot-proof
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM: cpxagency
      TEAM_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      PHOENIX_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
      STATE_WORKER: wdcc-v53-staging
      STATE_URL: https://wdcc-v53-staging.clico-global.workers.dev
      APP_WORKER: wdcc-v53-1-staging
      APP_URL: https://wdcc-v53-1-staging.clico-global.workers.dev
      BOOTSTRAP_SHA256: 364a7acba7a7be8af5ad9e9ef54e0bc11fed0d6601ba6975f6cd58700f1dd7d7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require provider credentials
        shell: bash
        run: |
          set -euo pipefail
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VERCEL_TOKEN; do test -n "${!v:-}" || exit 20; done

      - name: Install Cloudflare and Vercel tooling
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0
          npm install --global vercel@59.5.0 >/dev/null
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$TEAM_ID" "$PHOENIX_ID" > .vercel/project.json

      - name: Restore existing V53 staging slot as state-only Worker
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler.state.jsonc <<EOF
          {
            "name":"$STATE_WORKER",
            "main":"cloudflare/wdcc-state-worker.mjs",
            "compatibility_date":"2026-08-27",
            "workers_dev":true,
            "preview_urls":true,
            "observability":{"enabled":true},
            "vars":{"WDCC_BOOTSTRAP_SHA256":"$BOOTSTRAP_SHA256"},
            "durable_objects":{"bindings":[{"name":"WDCC_STATE","class_name":"WDCCState"}]},
            "migrations":[{"tag":"v1","new_sqlite_classes":["WDCCState"]}]
          }
          EOF
          npx wrangler deploy --config wrangler.state.jsonc 2>&1 | tee /tmp/state-deploy.log
          grep -q "$STATE_URL" /tmp/state-deploy.log
          TOKEN="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$TOKEN"
          printf '%s' "$TOKEN" >/tmp/state-token
          printf '%s' "$TOKEN" | npx wrangler secret put WDCC_STATE_SERVICE_TOKEN --config wrangler.state.jsonc >/dev/null

      - name: Prove state slot retained durable synthetic ledger
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat /tmp/state-token)"
          code="$(curl -sS -o /tmp/state-health.json -w '%{http_code}' "$STATE_URL/health?two-slot=$GITHUB_RUN_ID")"
          test "$code" = 200
          jq -e '.ok==true and .provider=="cloudflare" and .storage=="durable-object-sqlite" and .state=="readable" and .revision>=1' /tmp/state-health.json >/dev/null
          test "$(curl -sS -o /tmp/state-self.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -X POST "$STATE_URL/self-test")" = 200
          jq -e '.ok==true and .write==true and .read==true and .delete==true' /tmp/state-self.json >/dev/null
          test "$(curl -sS -o /tmp/state.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$STATE_URL/state")" = 200
          jq -e '.revision>=1 and (.users|type)=="array" and (.vehicles|type)=="array" and (.leads|type)=="array"' /tmp/state.json >/dev/null
          jq '{revision,users:(.users|length),vehicles:(.vehicles|length),leads:(.leads|length),audit:(.audit|length)}' /tmp/state.json

      - name: Build WDCC app for separate Cloudflare app slot
        shell: bash
        run: |
          set -euo pipefail
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets

      - name: Deploy app to existing V53.1 isolated staging slot
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const source=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          source.name=process.env.APP_WORKER;
          source.main='.open-next/worker.js';
          source.workers_dev=true;
          source.preview_urls=true;
          delete source.route; delete source.routes;
          delete source.durable_objects; delete source.migrations;
          source.vars={...(source.vars||{}),WDCC_RUNTIME_ROLE:'backend',WDCC_PROVIDER:'cloudflare',WDCC_STATE_SERVICE_URL:process.env.STATE_URL};
          delete source.vars.WDCC_DEALER_BACKEND_URL;
          fs.writeFileSync('wrangler.app.jsonc',JSON.stringify(source,null,2)+'\n');
          NODE
          npx wrangler deploy --config wrangler.app.jsonc 2>&1 | tee /tmp/app-deploy.log
          grep -q "$APP_URL" /tmp/app-deploy.log
          TOKEN="$(cat /tmp/state-token)"
          printf '%s' "$TOKEN" | npx wrangler secret put WDCC_STATE_SERVICE_TOKEN --config wrangler.app.jsonc >/dev/null
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- bash -lc 'test -n "${SESSION_SECRET:-}"; printf "%s" "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET --config wrangler.app.jsonc >/dev/null'

      - name: Prove complete Cloudflare app against separate durable state Worker
        shell: bash
        run: |
          set -euo pipefail
          code=000
          for i in $(seq 1 20); do
            code="$(curl -sS -o /tmp/app-health.json -w '%{http_code}' "$APP_URL/api/health?two-slot=$GITHUB_RUN_ID-$i" || true)"
            if [ "$code" = 200 ]; then break; fi
            sleep 2
          done
          echo "APP_HEALTH_HTTP=$code"
          cat /tmp/app-health.json || true
          test "$code" = 200
          jq -e '.ok==true and .degraded==false and .backend=="local" and .storage=="cloudflare-do" and .state=="readable" and .provider=="cloudflare" and .session=="configured" and .revision>=1' /tmp/app-health.json >/dev/null

          inv="$(curl -sS -o /tmp/inventory.json -w '%{http_code}' "$APP_URL/api/inventory?two-slot=$GITHUB_RUN_ID")"
          echo "INVENTORY_HTTP=$inv"
          cat /tmp/inventory.json
          test "$inv" = 200
          jq -e '.ok==true and (.items|type)=="array"' /tmp/inventory.json >/dev/null

          dealer="$(curl -sS -L -o /tmp/dealer.html -w '%{http_code}' "$APP_URL/dealer?two-slot=$GITHUB_RUN_ID")"
          echo "DEALER_HTTP=$dealer"
          test "$dealer" = 200
          grep -qi 'dealer' /tmp/dealer.html

          state="$(curl -sS -o /tmp/state-health-final.json -w '%{http_code}' "$STATE_URL/health?two-slot-final=$GITHUB_RUN_ID")"
          echo "STATE_HTTP=$state"
          cat /tmp/state-health-final.json
          test "$state" = 200
          jq -e '.ok==true and .storage=="durable-object-sqlite" and .state=="readable"' /tmp/state-health-final.json >/dev/null

      - name: Record green isolated Cloudflare replacement
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 205 --repo "$GITHUB_REPOSITORY" --body "Cloudflare emergency replacement proof run $GITHUB_RUN_ID is GREEN using two existing isolated Worker slots and no new Worker allocation: state=\`wdcc-v53-staging\`, app=\`wdcc-v53-1-staging\`. Durable Object SQLite write/read/delete is green; app health=200 with provider=cloudflare, storage=cloudflare-do, state=readable, session=configured; inventory=200; dealer page=200. No production route, DNS, Vercel alias, apex, or dealer traffic changed. The state in this isolated proof remains synthetic/non-production, so live cutover is still blocked until final production ledger revision 654 is recovered or independently reconstructed and verified." || true

      - name: Record isolated failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 205 --repo "$GITHUB_REPOSITORY" --body "Cloudflare two-slot emergency proof run $GITHUB_RUN_ID failed in isolated staging. No production route, DNS, Vercel alias, apex, or dealer traffic changed." || true
