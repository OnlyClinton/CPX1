name: WDCC Honda Preview Media Reencode

on:
  push:
    branches: [preview/wdcc-mockup-convergence-20260827-v2-proof]
    paths:
      - '.github/workflows/wdcc-honda-preview-media-reencode.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/wdcc-mockup-convergence-20260827-v2-proof
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Re-encode only the recovered Honda Pilot preview derivative
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false sharp@0.34.5 >/dev/null
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import sharp from 'sharp';
          const path='app/recoveredVisualMedia/hondaPilot.ts';
          const src=fs.readFileSync(path,'utf8');
          const m=src.match(/base64,([^\"]+)/);
          if(!m) throw new Error('HONDA_BASE64_NOT_FOUND');
          const input=Buffer.from(m[1],'base64');
          const meta=await sharp(input,{failOn:'none'}).metadata();
          console.log('input',JSON.stringify({bytes:input.length,format:meta.format,width:meta.width,height:meta.height}));
          const output=await sharp(input,{failOn:'none'}).rotate().resize({width:240,height:135,fit:'cover'}).webp({quality:76,effort:6}).toBuffer();
          const outMeta=await sharp(output).metadata();
          if(outMeta.format!=='webp'||outMeta.width!==240||outMeta.height!==135) throw new Error('HONDA_REENCODE_INVALID');
          const text=`// Preview-only validated re-encode of the recovered first-party 2019 Honda Pilot derivative already staged from WDCC_V54_BACKEND_SNAPSHOT_20260709_004713.json.\nconst image=\"data:image/webp;base64,${output.toString('base64')}\";\nexport default image;\n`;
          fs.writeFileSync(path,text);
          console.log('output',JSON.stringify({bytes:output.length,format:outMeta.format,width:outMeta.width,height:outMeta.height}));
          NODE
          git diff -- app/recoveredVisualMedia/hondaPilot.ts
          test -z "$(git diff --name-only | grep -v '^app/recoveredVisualMedia/hondaPilot.ts$' || true)"
      - name: Commit preview-only repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WDCC Preview Proof Bot'
          git config user.email '120651995+OnlyClinton@users.noreply.github.com'
          git add app/recoveredVisualMedia/hondaPilot.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(wdcc): reencode Honda review derivative for browser decode'
          git push origin HEAD:preview/wdcc-mockup-convergence-20260827-v2-proof
