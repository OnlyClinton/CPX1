name: WDCC Dealer KPI Edge Hotfix

on:
  push:
    branches:
      - fix/dealer-kpi-drilldowns-thumbnails
    paths:
      - '.github/workflows/wdcc-dealer-kpi-edge-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-dealer-kpi-edge-hotfix
  cancel-in-progress: false

env:
  PRIMARY_ORIGIN: https://wdcc-cpx-launch-qhcvflfih-cpxagency.vercel.app
  FALLBACK_ORIGIN: https://wdcc-cpx-launch-b01un0onc-cpxagency.vercel.app
  EXPECTED_SHA: b8e0ba97f34e79591c20fd334c45a8f6e810fb96
  DEALER_HOST: dealer.wedontcarecars.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require Cloudflare authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Prove current dealer origin
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$PRIMARY_ORIGIN/api/health?kpi_edge=$GITHUB_RUN_ID")"
          test "$code" = 200
          jq -e --arg sha "$EXPECTED_SHA" '.ok==true and .degraded==false and .commit==$sha' /tmp/health.json >/dev/null
          curl -fsS "$PRIMARY_ORIGIN/api/inventory?kpi_edge=$GITHUB_RUN_ID" -o /tmp/inventory.json
          jq -e '.ok==true and (.items|type)=="array"' /tmp/inventory.json >/dev/null
          for path in /dealer /dealer/leads /dealer/inventory; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$PRIMARY_ORIGIN$path")"
            test "$code" = 200
          done

      - name: Install Wrangler
        run: npm install --global wrangler@4.90.0 >/dev/null

      - name: Build staged edge hotfix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wdcc-kpi-edge
          cat > /tmp/wdcc-kpi-edge/worker.js <<'EOF'
          const PRIMARY = "https://wdcc-cpx-launch-qhcvflfih-cpxagency.vercel.app";
          const FALLBACK = "https://wdcc-cpx-launch-b01un0onc-cpxagency.vercel.app";
          const HOTFIX_MARKER = "WDCC_KPI_EDGE_V1";

          function targetUrl(request, base) {
            const incoming = new URL(request.url);
            const target = new URL(base);
            target.pathname = incoming.pathname;
            target.search = incoming.search;
            return target;
          }

          function dealerEnhancementScript() {
            return `<script data-wdcc-edge="${HOTFIX_MARKER}">
          (()=>{
            if(window.__wdccKpiEdgeV1)return; window.__wdccKpiEdgeV1=true;
            const routes=['/dealer/leads?view=new-today','/dealer/leads?view=hot','/dealer/leads?view=appointments','/dealer/inventory?view=published','/dealer/leads?view=sold'];
            const viewLabel={hot:'Hot',appointments:'Appointments',sold:'Sold',all:'All',published:'Published'};
            const photoOf=v=>v&&(v.primaryPhotoPathname||v.primaryPhoto||v.photoPathname||(v.photos&&v.photos[0]&&(v.photos[0].pathname||v.photos[0])))||'';
            const photoUrl=p=>!p?'':/^https?:\\/\\//i.test(String(p))?String(p):'/api/media?p='+encodeURIComponent(String(p));
            function wireKpis(){
              const cards=[...document.querySelectorAll('.crmKpis article')];
              cards.slice(0,5).forEach((card,i)=>{
                if(card.dataset.wdccDrilldown)return;
                card.dataset.wdccDrilldown=routes[i]; card.setAttribute('role','link'); card.tabIndex=0; card.style.cursor='pointer'; card.style.position='relative';
                const arrow=document.createElement('span'); arrow.textContent='›'; arrow.setAttribute('aria-hidden','true'); Object.assign(arrow.style,{position:'absolute',right:'14px',top:'10px',fontSize:'20px',color:'#8293a3',fontWeight:'700'}); card.appendChild(arrow);
                const go=()=>{location.href=routes[i]};
                card.addEventListener('click',e=>{if(e.target.closest('a,button,input,select,textarea'))return;go()});
                card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}});
              });
            }
            async function addInventoryThumbs(){
              const list=document.querySelector('.inventoryPulseList'); if(!list||list.dataset.wdccThumbs)return;
              try{
                const r=await fetch('/api/crm/dashboard',{cache:'no-store',credentials:'same-origin'}); if(!r.ok)return;
                const j=await r.json(); const inv=j.inventory||[]; const links=[...list.querySelectorAll('a')];
                links.forEach((a,i)=>{
                  if(a.querySelector('[data-wdcc-thumb]')||!inv[i])return;
                  const p=photoUrl(photoOf(inv[i])); let el;
                  if(p){el=document.createElement('img'); el.src=p; el.alt=((inv[i].year||'')+' '+(inv[i].make||'')+' '+(inv[i].model||'')).trim();}
                  else{el=document.createElement('span'); el.textContent='NO PHOTO'; Object.assign(el.style,{fontSize:'7px',color:'#748698',fontWeight:'800',display:'grid',placeItems:'center'});}
                  el.dataset.wdccThumb='1'; Object.assign(el.style,{width:'58px',height:'44px',objectFit:'cover',borderRadius:'8px',flex:'0 0 auto',background:'#0b1824',border:'1px solid #22394c'});
                  Object.assign(a.style,{display:'grid',gridTemplateColumns:'58px minmax(0,1fr) auto',alignItems:'center',gap:'10px'}); a.insertBefore(el,a.firstChild);
                });
                list.dataset.wdccThumbs='1';
              }catch{}
            }
            function clickRequestedTab(){
              const u=new URL(location.href), view=u.searchParams.get('view'); if(!view)return;
              if(view==='new-today'){
                const all=[...document.querySelectorAll('.leadInboxTabs button')].find(b=>/^All\\b/i.test(b.textContent||'')); if(all&&!all.dataset.wdccClicked){all.dataset.wdccClicked='1';all.click();setTimeout(filterToday,80)}; return;
              }
              const label=viewLabel[view]; if(!label)return;
              const btn=[...document.querySelectorAll('.leadInboxTabs button')].find(b=>(b.textContent||'').trim().toLowerCase().startsWith(label.toLowerCase()));
              if(btn&&!btn.dataset.wdccClicked){btn.dataset.wdccClicked='1';btn.click()}
            }
            async function filterToday(){
              if(!location.search.includes('view=new-today'))return;
              try{
                const r=await fetch('/api/crm/dashboard',{cache:'no-store',credentials:'same-origin'}); if(!r.ok)return;
                const j=await r.json(); const today=new Date().toDateString(); const ids=new Set((j.leads||[]).filter(x=>{const d=new Date(x.createdAt||x.created_at||0);return !Number.isNaN(d.getTime())&&d.toDateString()===today}).map(x=>String(x.id)));
                document.querySelectorAll('.leadCards .leadCardPro').forEach(card=>{const t=card.textContent||''; const match=[...ids].some(id=>t.includes('Lead ID: '+id)); card.style.display=match?'':'none'});
                const empty=document.querySelector('.leadCards .crmEmpty'); if(empty)empty.style.display=ids.size?'none':'';
              }catch{}
            }
            function apply(){wireKpis();addInventoryThumbs();clickRequestedTab(); if(location.search.includes('view=new-today'))filterToday()}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',apply,{once:true});else apply();
            const mo=new MutationObserver(apply); mo.observe(document.documentElement,{childList:true,subtree:true}); setTimeout(()=>mo.disconnect(),12000);
          })();
          </script>`;
          }

          async function enhanceDealerHtml(response, incoming) {
            if (incoming.method !== 'GET') return response;
            if (!incoming.pathname.startsWith('/dealer')) return response;
            const type = response.headers.get('content-type') || '';
            if (!type.includes('text/html')) return response;
            let html = await response.text();
            if (!html.includes(HOTFIX_MARKER)) html = html.replace(/<\\/body>/i, dealerEnhancementScript() + '</body>');
            const headers = new Headers(response.headers);
            headers.delete('content-length'); headers.delete('content-encoding'); headers.delete('etag');
            headers.set('cache-control','private, no-store, max-age=0, must-revalidate');
            headers.set('x-wdcc-kpi-edge',HOTFIX_MARKER);
            return new Response(html,{status:response.status,statusText:response.statusText,headers});
          }

          async function proxy(request, base) {
            const incoming = new URL(request.url);
            const target = targetUrl(request, base);
            const headers = new Headers(request.headers);
            headers.set('x-forwarded-host', incoming.host);
            headers.set('x-forwarded-proto', 'https');
            headers.set('x-wdcc-frontdoor', 'cloudflare-dealer');
            headers.delete('cf-worker');
            const init = { method: request.method, headers, redirect: 'manual' };
            if (!['GET','HEAD'].includes(request.method)) init.body = request.body;
            const response = await fetch(new Request(target.toString(), init));
            const outHeaders = new Headers(response.headers);
            const location = outHeaders.get('location');
            if (location) { try { const loc=new URL(location,target); if(loc.hostname===new URL(base).hostname){loc.protocol=incoming.protocol;loc.hostname=incoming.hostname;loc.port=incoming.port;outHeaders.set('location',loc.toString())} } catch {} }
            outHeaders.set('x-wdcc-edge','cloudflare-dealer'); outHeaders.set('x-wdcc-origin',new URL(base).hostname);
            const proxied=new Response(response.body,{status:response.status,statusText:response.statusText,headers:outHeaders});
            return enhanceDealerHtml(proxied,{method:request.method,pathname:incoming.pathname});
          }

          export default { async fetch(request) {
            try { const response=await proxy(request,PRIMARY); if(response.status<500)return response; } catch {}
            try { return await proxy(request,FALLBACK); } catch { return new Response('Dealer portal temporarily unavailable',{status:503,headers:{'cache-control':'no-store'}}); }
          }};
          EOF

          cat > /tmp/wdcc-kpi-edge/wrangler.jsonc <<'EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "wdcc-dealer-kpi-stage",
            "main": "worker.js",
            "compatibility_date": "2026-08-25",
            "workers_dev": true,
            "observability": {"enabled": true}
          }
          EOF

      - name: Deploy and verify isolated workers.dev stage
        id: stage
        working-directory: /tmp/wdcc-kpi-edge
        shell: bash
        run: |
          set -euo pipefail
          wrangler deploy 2>&1 | tee /tmp/kpi-stage.log
          URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/kpi-stage.log | tail -1 || true)"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 20); do
            code="$(curl -sS -o /tmp/stage-health.json -w '%{http_code}' "$URL/api/health?attempt=$attempt" || true)"
            if [ "$code" = 200 ] && jq -e --arg sha "$EXPECTED_SHA" '.ok==true and .degraded==false and .commit==$sha' /tmp/stage-health.json >/dev/null 2>&1; then break; fi
            sleep 2
          done
          jq -e --arg sha "$EXPECTED_SHA" '.ok==true and .degraded==false and .commit==$sha' /tmp/stage-health.json >/dev/null
          for path in '/dealer' '/dealer/leads?view=hot' '/dealer/inventory?view=published'; do
            curl -fsS -D /tmp/stage.h "$URL$path" -o /tmp/stage.html
            grep -q 'WDCC_KPI_EDGE_V1' /tmp/stage.html
            grep -qi '^x-wdcc-kpi-edge: WDCC_KPI_EDGE_V1' /tmp/stage.h
          done
          echo 'KPI_EDGE_STAGE=PASS'

      - name: Prepare production Worker and rollback source
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/wdcc-kpi-edge/worker.js /tmp/wdcc-kpi-edge/hotfix-worker.js
          cat > /tmp/wdcc-kpi-edge/rollback.js <<'EOF'
          const PRIMARY="https://wdcc-cpx-launch-qhcvflfih-cpxagency.vercel.app";
          const FALLBACK="https://wdcc-cpx-launch-b01un0onc-cpxagency.vercel.app";
          function targetUrl(request,base){const incoming=new URL(request.url),target=new URL(base);target.pathname=incoming.pathname;target.search=incoming.search;return target}
          async function proxy(request,base){const incoming=new URL(request.url),target=targetUrl(request,base),headers=new Headers(request.headers);headers.set('x-forwarded-host',incoming.host);headers.set('x-forwarded-proto','https');headers.set('x-wdcc-frontdoor','cloudflare-dealer');headers.delete('cf-worker');const init={method:request.method,headers,redirect:'manual'};if(!['GET','HEAD'].includes(request.method))init.body=request.body;const response=await fetch(new Request(target.toString(),init)),outHeaders=new Headers(response.headers),location=outHeaders.get('location');if(location){try{const loc=new URL(location,target);if(loc.hostname===new URL(base).hostname){loc.protocol=incoming.protocol;loc.hostname=incoming.hostname;loc.port=incoming.port;outHeaders.set('location',loc.toString())}}catch{}}outHeaders.set('x-wdcc-edge','cloudflare-dealer');outHeaders.set('x-wdcc-origin',new URL(base).hostname);return new Response(response.body,{status:response.status,statusText:response.statusText,headers:outHeaders})}
          export default{async fetch(request){try{const response=await proxy(request,PRIMARY);if(response.status<500)return response}catch{}try{return await proxy(request,FALLBACK)}catch{return new Response('Dealer portal temporarily unavailable',{status:503,headers:{'cache-control':'no-store'}})}}};
          EOF
          node - <<'NODE'
          const fs=require('fs');const p='/tmp/wdcc-kpi-edge/wrangler.jsonc';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.name='wdcc-dealer-frontdoor';c.routes=[{pattern:'dealer.wedontcarecars.com/*',zone_name:'wedontcarecars.com'}];fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');
          NODE

      - name: Deploy live dealer edge hotfix
        working-directory: /tmp/wdcc-kpi-edge
        shell: bash
        run: |
          set -euo pipefail
          cp hotfix-worker.js worker.js
          wrangler deploy

      - name: Verify live dealer behavior marker
        id: liveverify
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          curl -fsS -D /tmp/live-health.h "https://$DEALER_HOST/api/health?kpi_live=$GITHUB_RUN_ID" -o /tmp/live-health.json
          jq -e --arg sha "$EXPECTED_SHA" '.ok==true and .degraded==false and .commit==$sha' /tmp/live-health.json >/dev/null
          grep -qi '^x-wdcc-edge: cloudflare-dealer' /tmp/live-health.h
          for path in '/dealer' '/dealer/leads?view=hot' '/dealer/inventory?view=published'; do
            curl -fsS -D /tmp/live.h "https://$DEALER_HOST$path" -o /tmp/live.html
            grep -q 'WDCC_KPI_EDGE_V1' /tmp/live.html
            grep -qi '^x-wdcc-kpi-edge: WDCC_KPI_EDGE_V1' /tmp/live.h
          done
          echo 'WDCC_KPI_EDGE_LIVE=PASS'

      - name: Roll back edge hotfix if live verification fails
        if: failure() && steps.liveverify.outcome == 'failure'
        working-directory: /tmp/wdcc-kpi-edge
        shell: bash
        run: |
          set -euo pipefail
          cp rollback.js worker.js
          wrangler deploy
