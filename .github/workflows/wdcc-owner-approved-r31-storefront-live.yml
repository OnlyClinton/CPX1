name: WDCC Owner Approved R31 Storefront Live

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  actions: read

concurrency:
  group: wdcc-production-release
  cancel-in-progress: false

env:
  APPROVED_SHA: 0b7789d18822bb3bc7fed5b90003fd50bf41f9af
  VISUAL_SHA: f8072425855e16ae2c0ef57a78637e15bbad6322
  VERCEL_SCOPE: cpxagency
  VERCEL_TEAM_ID: team_G6jmETRRl8fV3KfivPOdj8JM
  VERCEL_PROJECT_ID: prj_We7xkAkB5Qy31Pt17USSkQFE0u7h
  APEX: wedontcarecars.com
  WWW: www.wedontcarecars.com

jobs:
  promote:
    if: >-
      github.event.issue.number == 205 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == 'PROMOTE-WDCC-R31-F8072425'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Fail closed on owner approval and release control
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test "$GITHUB_REPOSITORY_OWNER" = "${{ github.event.comment.user.login }}"
          curl -fsS "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/205" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' > /tmp/issue.json
          jq -e '.number==205 and .state=="open"' /tmp/issue.json >/dev/null
          printf '[]\n' > /tmp/comments.json
          page=1
          while :; do
            curl -fsS "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/205/comments?per_page=100&page=$page" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' > /tmp/comments-page.json
            count="$(jq 'length' /tmp/comments-page.json)"
            jq -s 'add' /tmp/comments.json /tmp/comments-page.json > /tmp/comments-next.json
            mv /tmp/comments-next.json /tmp/comments.json
            test "$count" -lt 100 && break
            page=$((page + 1))
          done
          jq -e --arg owner "$GITHUB_REPOSITORY_OWNER" --arg marker "WDCC_OWNER_VISUAL_APPROVAL $VISUAL_SHA" \
            'any(.[]; .user.login==$owner and .author_association=="OWNER" and (.body // "")==$marker)' /tmp/comments.json >/dev/null
          echo 'OWNER_VISUAL_APPROVAL=PASS'
          echo 'RELEASE_CONTROL=PASS'

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_SHA }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prove exact R31 source and build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test -f app/r31-mobile-composition-final.css
          grep -Fq "background-image:url('/wdcc-hero-v2.webp')" app/r31-mobile-composition-final.css
          grep -Fq '.wdcc-mobile-actions{display:none!important}' app/r31-mobile-composition-final.css
          grep -Fq 'r31-mobile-composition-final.css' app/layout.tsx
          npm ci
          npm run build
          echo 'EXACT_R31_SOURCE_BUILD=PASS'

      - name: Browser visual and animation torture test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/wdcc-next.log 2>&1 &
          app_pid=$!
          trap 'kill $app_pid 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS --max-time 3 http://127.0.0.1:3000/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1 || { cat /tmp/wdcc-next.log; exit 1; }
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const cfg of [
              {name:'desktop',width:1440,height:1100,isMobile:false,hasTouch:false},
              {name:'mobile',width:390,height:844,isMobile:true,hasTouch:true},
              {name:'touch',width:980,height:1740,isMobile:false,hasTouch:true}
            ]){
              const context=await browser.newContext({viewport:{width:cfg.width,height:cfg.height},isMobile:cfg.isMobile,hasTouch:cfg.hasTouch,deviceScaleFactor:1});
              const page=await context.newPage();
              const errors=[];
              page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              page.on('pageerror',e=>errors.push(String(e)));
              await page.goto('http://127.0.0.1:3000/?hard-proof=1',{waitUntil:'domcontentloaded',timeout:30000});
              const frames=await page.evaluate(async()=>{
                const values=[];let last=performance.now();const start=last;
                await new Promise(resolve=>{function tick(now){values.push(now-last);last=now;if(now-start<1800)requestAnimationFrame(tick);else resolve()}requestAnimationFrame(tick)});
                values.sort((a,b)=>a-b);const p95=values[Math.floor(values.length*.95)]||999;const slow=values.filter(v=>v>50).length;return {count:values.length,p95,slow,slowPct:values.length?slow/values.length:1};
              });
              await page.waitForTimeout(1700);
              const home=await page.evaluate(()=>({
                overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+1,
                hero:getComputedStyle(document.querySelector('.rh-hero'),'::before').backgroundImage,
                hidden:[...document.querySelectorAll('[data-rh-reveal]')].filter(n=>getComputedStyle(n).opacity==='0').length,
                dock:[...document.querySelectorAll('.rh-mobile-dock,.mobile-action-bar,.wdcc-mobile-actions')].some(n=>getComputedStyle(n).display!=='none'),
                logo:document.querySelector('.rh-logo img')?.getBoundingClientRect().width||0,
                cards:document.querySelectorAll('.rh-card').length,
                loaded:[...document.querySelectorAll('.rh-card img')].filter(i=>i.complete&&i.naturalWidth>0).length
              }));
              if(frames.p95>75||frames.slowPct>.10)throw Error(`${cfg.name} animation frame budget ${JSON.stringify(frames)}`);
              if(home.overflow||!home.hero.includes('wdcc-hero-v2.webp')||home.hidden||home.dock||home.cards<5||home.loaded<5)throw Error(`${cfg.name} visual contract ${JSON.stringify(home)}`);
              await page.screenshot({path:`proof/${cfg.name}-home.png`,fullPage:true});
              await page.goto('http://127.0.0.1:3000/inventory?hard-proof=1',{waitUntil:'domcontentloaded',timeout:30000});
              const inv=await page.evaluate(()=>({count:document.querySelectorAll('.inventoryTop + .section .card').length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+1,images:[...document.querySelectorAll('.inventoryTop + .section .card img')].filter(i=>i.complete&&i.naturalWidth>0).length}));
              if(inv.count<5||inv.images<5||inv.overflow)throw Error(`${cfg.name} inventory ${JSON.stringify(inv)}`);
              if(errors.length)throw Error(`${cfg.name} console ${errors.slice(0,3).join(' | ')}`);
              await context.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill "$app_pid" 2>/dev/null || true
          trap - EXIT
          echo 'RESPONSIVE_VISUAL_ANIMATION=PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: wdcc-r31-live-proof
          path: proof/*.png
          if-no-files-found: error

      - name: Deploy immutable Vercel donor without aliases
        id: target
        shell: bash
        run: |
          set -euo pipefail
          npm install --global vercel@59.5.0
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_TEAM_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
          vercel build --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
          target="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE")"
          test -n "$target"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$target?teamId=$VERCEL_TEAM_ID" > /tmp/target.json
          jq -e --arg sha "$APPROVED_SHA" '.readyState=="READY" and .meta.githubCommitSha==$sha' /tmp/target.json >/dev/null
          echo "IMMUTABLE_TARGET=$target"

      - name: Prove immutable donor
        env:
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          set -euo pipefail
          vercel --scope "$VERCEL_SCOPE" curl / --deployment "$TARGET" > /tmp/home
          grep -qi 'we don.t care' /tmp/home
          grep -q 'wdcc-hero-v2.webp' /tmp/home
          vercel --scope "$VERCEL_SCOPE" curl /api/health --deployment "$TARGET" > /tmp/health
          jq -e '.ok==true and .degraded==false' /tmp/health >/dev/null
          vercel --scope "$VERCEL_SCOPE" curl /api/inventory --deployment "$TARGET" > /tmp/inventory.json
          jq -e '.ok==true and (.items|length)>=5' /tmp/inventory.json >/dev/null
          echo 'IMMUTABLE_DONOR=PASS'

      - name: Capture exact alias rollback targets
        id: rollback
        run: |
          set -euo pipefail
          for host in "$APEX" "$WWW"; do
            key="${host//./_}"
            curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$host?teamId=$VERCEL_TEAM_ID" > "/tmp/before-$key.json"
            current="$(jq -r '.url // empty' "/tmp/before-$key.json")"
            test -n "$current"
            echo "$key=$current" >> "$GITHUB_OUTPUT"
          done

      - name: Promote apex and www, verify, rollback on failure
        env:
          TARGET: ${{ steps.target.outputs.target }}
          ROLLBACK_APEX: ${{ steps.rollback.outputs.wedontcarecars_com }}
          ROLLBACK_WWW: ${{ steps.rollback.outputs.www_wedontcarecars_com }}
        run: |
          set -Eeuo pipefail
          changed=0
          rollback(){ rc=$?; trap - ERR INT TERM; if [ "$changed" = 1 ]; then vercel alias set "$ROLLBACK_APEX" "$APEX" --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" || true; vercel alias set "$ROLLBACK_WWW" "$WWW" --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" || true; fi; exit "$rc"; }
          trap rollback ERR INT TERM
          changed=1
          vercel alias set "$TARGET" "$APEX" --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
          vercel alias set "$TARGET" "$WWW" --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
          for i in $(seq 1 45); do
            code="$(curl -sS -L --max-time 20 -o /tmp/live-home -w '%{http_code}' "https://$APEX/?r31=$APPROVED_SHA")"
            if [ "$code" = 200 ] && grep -qi 'we don.t care' /tmp/live-home; then break; fi
            [ "$i" = 45 ] && exit 1
            sleep 2
          done
          for path in / /inventory /get-approved /schedule-test-drive /app; do
            code="$(curl -sS -L --max-time 20 -o /tmp/live-path -w '%{http_code}' "https://$APEX$path?r31=$APPROVED_SHA")"
            test "$code" = 200
          done
          code="$(curl -sS -L --max-time 20 -o /tmp/www-home -w '%{http_code}' "https://$WWW/?r31=$APPROVED_SHA")"
          test "$code" = 200
          code="$(curl -sS -L --max-time 20 -o /tmp/dealer -w '%{http_code}' "https://dealer.wedontcarecars.com/api/health?r31=$APPROVED_SHA")"
          test "$code" = 200
          echo 'LIVE_R31_STOREFRONT=PASS'
          trap - ERR INT TERM
          changed=0
          echo 'R31_PRODUCTION_PROMOTION=PASS'
