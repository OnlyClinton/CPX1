name: WDCC Custom Domain Shape Readonly

on:
  push:
    branches: [proof/wdcc-522-immutable-parser-20260829]
    paths:
      - '.github/workflows/wdcc-custom-domain-shape-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Print safe domain and route ownership metadata
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          echo '=== DOMAINS ==='
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" "${auth[@]}" | jq -c '.result[] | select(.hostname=="wedontcarecars.com" or .hostname=="www.wedontcarecars.com" or .hostname=="dealer.wedontcarecars.com")'
          zone="$(curl -fsS 'https://api.cloudflare.com/client/v4/zones?name=wedontcarecars.com' "${auth[@]}" | jq -r '.result[0].id // empty')"; test -n "$zone"
          echo '=== ROUTES ==='
          curl -fsS "https://api.cloudflare.com/client/v4/zones/$zone/workers/routes" "${auth[@]}" | jq -c '.result[] | select(.pattern|contains("wedontcarecars.com"))'
          echo 'READ_ONLY=YES'
