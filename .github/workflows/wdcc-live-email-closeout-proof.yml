name: WDCC Live Email Closeout Proof

on:
  pull_request:
    branches: [preview/wdcc-mockup-convergence-20260827-v2-proof]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/wdcc-live-email-closeout-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-live-email-closeout-proof
  cancel-in-progress: false

env:
  FROZEN_CANDIDATE_SHA: 883f211f345f69967ffad84c3dec3ff36e4f0aee
  VERCEL_SCOPE: cpxagency
  TARGET_ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
  CANONICAL_PROJECT_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
  STAGE_PROJECT_ID: prj_eZGqe21T4dHDBXGyRAOHHMhgy9cf
  PROOF_RECIPIENT: sean@wedontcarecars.com

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proof/wdcc-live-email-closeout-20260829
          fetch-depth: 0

      - name: Prove workflow-only lineage
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$FROZEN_CANDIDATE_SHA^{commit}"
          changed="$(git diff --name-only "$FROZEN_CANDIDATE_SHA" HEAD)"
          test "$changed" = '.github/workflows/wdcc-live-email-closeout-proof.yml'
          echo "FROZEN_CANDIDATE_SHA=$FROZEN_CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'CANDIDATE_CODE_CHANGED=NO' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Pull canonical and staged Vercel environment read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          npm install --global vercel@59.5.0 >/dev/null
          pull_env(){
            project_id="$1"; output="$2"; work="$3"
            mkdir -p "$work/.vercel"
            printf '{"orgId":"%s","projectId":"%s"}\n' "$TARGET_ORG_ID" "$project_id" > "$work/.vercel/project.json"
            (cd "$work" && VERCEL_ORG_ID="$TARGET_ORG_ID" VERCEL_PROJECT_ID="$project_id" vercel env pull "$output" --environment=production --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" >/dev/null)
            test -s "$output"
          }
          pull_env "$CANONICAL_PROJECT_ID" /tmp/wdcc-canonical.env /tmp/wdcc-canonical-project
          pull_env "$STAGE_PROJECT_ID" /tmp/wdcc-stage.env /tmp/wdcc-stage-project
          echo 'VERCEL_CANONICAL_ENV_READ=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'VERCEL_EMAIL_STAGE_ENV_READ=PASS' >> "$GITHUB_STEP_SUMMARY"

      - name: Compare live email configuration presence
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          flags(){
            file="$1"
            bash -c '
              set -a; . "$1"; set +a
              key="${RESEND_API_KEY:-${WDCC_RESEND_API_KEY:-}}"
              [ -n "$key" ] && k=present || k=missing
              [ -n "${WDCC_LEAD_NOTIFICATION_EMAILS:-}" ] && r=present || r=missing
              [ -n "${WDCC_LEAD_FROM_EMAIL:-}" ] && f=present || f=missing
              printf "%s,%s,%s" "$k" "$r" "$f"
            ' _ "$file"
          }
          canonical="$(flags /tmp/wdcc-canonical.env)"
          stage="$(flags /tmp/wdcc-stage.env)"
          IFS=, read -r ck cr cf <<< "$canonical"
          IFS=, read -r sk sr sf <<< "$stage"
          printf 'CANONICAL email config: key=%s recipients=%s from=%s\n' "$ck" "$cr" "$cf"
          printf 'STAGE email config: key=%s recipients=%s from=%s\n' "$sk" "$sr" "$sf"
          {
            echo "CANONICAL_RESEND_API_KEY=$ck"
            echo "CANONICAL_RECIPIENTS=$cr"
            echo "CANONICAL_FROM=$cf"
            echo "STAGE_RESEND_API_KEY=$sk"
            echo "STAGE_RECIPIENTS=$sr"
            echo "STAGE_FROM=$sf"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "canonical_complete=$([ "$ck,$cr,$cf" = 'present,present,present' ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "stage_complete=$([ "$sk,$sr,$sf" = 'present,present,present' ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Stop if canonical live configuration is incomplete
        if: ${{ steps.compare.outputs.canonical_complete != 'true' }}
        shell: bash
        env:
          STAGE_COMPLETE: ${{ steps.compare.outputs.stage_complete }}
        run: |
          set -euo pipefail
          if [ "$STAGE_COMPLETE" = true ]; then
            echo 'CANONICAL_EMAIL_CONFIG=INCOMPLETE' >> "$GITHUB_STEP_SUMMARY"
            echo 'STAGED_EMAIL_CONFIG=COMPLETE' >> "$GITHUB_STEP_SUMMARY"
            echo 'MIGRATION_READY=YES' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'CANONICAL_EMAIL_CONFIG=INCOMPLETE' >> "$GITHUB_STEP_SUMMARY"
            echo 'STAGED_EMAIL_CONFIG=INCOMPLETE' >> "$GITHUB_STEP_SUMMARY"
            echo 'MIGRATION_READY=NO' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 20

      - name: Validate canonical recipient and sender
        if: ${{ steps.compare.outputs.canonical_complete == 'true' }}
        id: config
        shell: bash
        run: |
          set -euo pipefail
          set -a; . /tmp/wdcc-canonical.env; set +a
          export RESEND_API_KEY="${RESEND_API_KEY:-${WDCC_RESEND_API_KEY:-}}"
          node - <<'NODE'
          const recipient=process.env.PROOF_RECIPIENT.toLowerCase();
          const configured=(process.env.WDCC_LEAD_NOTIFICATION_EMAILS||'').split(',').map(v=>v.trim().toLowerCase()).filter(Boolean);
          if(!configured.includes(recipient)) throw new Error('canonical recipient list does not include Sean');
          const from=(process.env.WDCC_LEAD_FROM_EMAIL||'').trim();
          const match=from.match(/<([^>]+)>\s*$/);
          const address=(match?match[1]:from).trim().toLowerCase();
          if(!/^[^@\s]+@wedontcarecars\.com$/.test(address)) throw new Error('canonical From identity is not on wedontcarecars.com');
          NODE
          from_value="$(node -e 'process.stdout.write(String(process.env.WDCC_LEAD_FROM_EMAIL||""))')"
          echo "from=$from_value" >> "$GITHUB_OUTPUT"
          echo 'RECIPIENT_CONFIG_INCLUDES_SEAN=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "FROM_IDENTITY=$from_value" >> "$GITHUB_STEP_SUMMARY"

      - name: Send exactly one live provider proof and require delivery
        if: ${{ steps.compare.outputs.canonical_complete == 'true' }}
        id: send
        shell: bash
        env:
          CONFIGURED_FROM: ${{ steps.config.outputs.from }}
        run: |
          set -euo pipefail
          set -a; . /tmp/wdcc-canonical.env; set +a
          export RESEND_API_KEY="${RESEND_API_KEY:-${WDCC_RESEND_API_KEY:-}}"
          unset WDCC_DATABASE_URL DATABASE_URL POSTGRES_URL NEON_DATABASE_URL NEON_BRANCH_ID WDCC_DATABASE_BRANCH_ID
          subject="WDCC live email closeout — ${FROZEN_CANDIDATE_SHA:0:12} — run ${GITHUB_RUN_ID}"
          text="WDCC live email launch-gate proof. Candidate SHA: ${FROZEN_CANDIDATE_SHA}. This proves the configured WDCC sender and real Resend provider can deliver to sean@wedontcarecars.com. No reply is required."
          payload="$(jq -n --arg from "$CONFIGURED_FROM" --arg to "$PROOF_RECIPIENT" --arg subject "$subject" --arg text "$text" '{from:$from,to:[$to],subject:$subject,text:$text}')"
          code="$(curl -sS -o /tmp/resend-send.json -w '%{http_code}' https://api.resend.com/emails -X POST -H "Authorization: Bearer $RESEND_API_KEY" -H 'Content-Type: application/json' -H "Idempotency-Key: wdcc-live-email-${FROZEN_CANDIDATE_SHA}-${GITHUB_RUN_ID}" --data "$payload")"
          case "$code" in 200|201) ;; *) echo "Resend send failed: HTTP $code" >&2; cat /tmp/resend-send.json >&2; exit 4;; esac
          email_id="$(jq -r '.id // empty' /tmp/resend-send.json)"; test -n "$email_id"
          delivered=0; last_event=''; message_id=''
          for i in $(seq 1 30); do
            retrieve_code="$(curl -sS -o /tmp/resend-email.json -w '%{http_code}' "https://api.resend.com/emails/$email_id" -H "Authorization: Bearer $RESEND_API_KEY")"
            if [ "$retrieve_code" = 200 ]; then
              last_event="$(jq -r '.last_event // empty' /tmp/resend-email.json)"
              message_id="$(jq -r '.message_id // empty' /tmp/resend-email.json)"
              case "$last_event" in delivered|opened|clicked) delivered=1; break;; bounced|failed|complained|suppressed) exit 5;; esac
            fi
            sleep 2
          done
          test "$delivered" = 1
          jq -n --arg candidate_sha "$FROZEN_CANDIDATE_SHA" --arg recipient "$PROOF_RECIPIENT" --arg from "$CONFIGURED_FROM" --arg subject "$subject" --arg resend_email_id "$email_id" --arg message_id "$message_id" --arg last_event "$last_event" '{ok:true,candidate_sha:$candidate_sha,recipient_config_confirmed:true,recipient:$recipient,from:$from,subject:$subject,resend_email_id:$resend_email_id,message_id:$message_id,last_event:$last_event,production_database_access:false,production_routes_changed:false,production_data_changed:false}' > live-email-proof.json
          echo "subject=$subject" >> "$GITHUB_OUTPUT"
          echo "email_id=$email_id" >> "$GITHUB_OUTPUT"
          echo "message_id=$message_id" >> "$GITHUB_OUTPUT"
          echo "last_event=$last_event" >> "$GITHUB_OUTPUT"
          echo 'LIVE_RESEND_SEND=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "RESEND_EMAIL_ID=$email_id" >> "$GITHUB_STEP_SUMMARY"
          echo "MESSAGE_ID=$message_id" >> "$GITHUB_STEP_SUMMARY"
          echo "LAST_EVENT=$last_event" >> "$GITHUB_STEP_SUMMARY"
          echo "PROOF_SUBJECT=$subject" >> "$GITHUB_STEP_SUMMARY"
          echo 'PRODUCTION_DATABASE_ACCESS=NO' >> "$GITHUB_STEP_SUMMARY"
          echo 'PRODUCTION_ROUTES_CHANGED=NO' >> "$GITHUB_STEP_SUMMARY"
          echo 'PRODUCTION_DATA_CHANGED=NO' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized proof
        if: ${{ steps.send.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: wdcc-live-email-closeout-${{ github.run_id }}
          path: live-email-proof.json
          if-no-files-found: error
          retention-days: 14
