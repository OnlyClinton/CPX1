name: WDCC Live Email Closeout Proof

on:
  pull_request:
    branches: [preview/wdcc-mockup-convergence-20260827-v2-proof]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/wdcc-live-email-closeout-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-live-email-closeout-proof
  cancel-in-progress: true

env:
  FROZEN_CANDIDATE_SHA: 883f211f345f69967ffad84c3dec3ff36e4f0aee
  VERCEL_SCOPE: cpxagency
  VERCEL_ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
  VERCEL_PROJECT_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
  PROOF_RECIPIENT: sean@wedontcarecars.com
  PROOF_FROM: WDCC Leads <leads@wedontcarecars.com>

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      GH_WDCC_RESEND_API_KEY: ${{ secrets.WDCC_RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove frozen candidate lineage
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$FROZEN_CANDIDATE_SHA^{commit}"
          echo "FROZEN_CANDIDATE_SHA=$FROZEN_CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'PR522_CANDIDATE_CHANGED=NO' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Pull canonical environment metadata without redeploying
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          npm install --global vercel@59.5.0 >/dev/null
          mkdir -p /tmp/wdcc-email-config/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > /tmp/wdcc-email-config/.vercel/project.json
          cd /tmp/wdcc-email-config
          VERCEL_ORG_ID="$VERCEL_ORG_ID" VERCEL_PROJECT_ID="$VERCEL_PROJECT_ID" \
            vercel env pull /tmp/wdcc-email.env --environment=production --yes \
            --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" >/dev/null
          grep -q '^WDCC_LEAD_NOTIFICATION_EMAILS=' /tmp/wdcc-email.env
          grep -q '^WDCC_LEAD_FROM_EMAIL=' /tmp/wdcc-email.env
          echo 'CANONICAL_RECIPIENT_VARIABLE_PRESENT=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'CANONICAL_FROM_VARIABLE_PRESENT=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'PROOF_RECIPIENT=sean@wedontcarecars.com' >> "$GITHUB_STEP_SUMMARY"
          echo 'PROOF_FROM=leads@wedontcarecars.com' >> "$GITHUB_STEP_SUMMARY"
          echo 'PRODUCTION_REDEPLOY_PERFORMED=NO' >> "$GITHUB_STEP_SUMMARY"
          echo 'PRODUCTION_DATA_CHANGED=NO' >> "$GITHUB_STEP_SUMMARY"
          echo 'PRODUCTION_ROUTES_CHANGED=NO' >> "$GITHUB_STEP_SUMMARY"

      - name: Send one provider proof and require delivery
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          function parseEnv(path) {
            const vals = {};
            for (const raw of fs.readFileSync(path, 'utf8').split(/\r?\n/)) {
              if (!raw || raw.trimStart().startsWith('#')) continue;
              const m = raw.match(/^([A-Za-z_][A-Za-z0-9_]*)=(.*)$/);
              if (!m) continue;
              let v = m[2];
              if (v.length >= 2 && v.startsWith('"') && v.endsWith('"')) {
                try { v = JSON.parse(v); } catch { v = v.slice(1, -1); }
              } else if (v.length >= 2 && v.startsWith("'") && v.endsWith("'")) {
                v = v.slice(1, -1);
              }
              vals[m[1]] = String(v);
            }
            return vals;
          }
          const summary = line => fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + '\n');
          const vals = parseEnv('/tmp/wdcc-email.env');
          const key = (process.env.GH_RESEND_API_KEY || process.env.GH_WDCC_RESEND_API_KEY || vals.RESEND_API_KEY || vals.WDCC_RESEND_API_KEY || '').trim();
          if (!key) {
            summary('RESEND_API_KEY_PRESENT=NO');
            summary('EMAIL_GATE=HOLD_PROVIDER_CREDENTIAL_MISSING');
            process.exit(20);
          }
          summary('RESEND_API_KEY_PRESENT=YES');

          const sleep = ms => new Promise(r => setTimeout(r, ms));
          (async () => {
            const subject = `WDCC live email closeout — ${process.env.FROZEN_CANDIDATE_SHA.slice(0,12)}`;
            const send = await fetch('https://api.resend.com/emails', {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${key}`,
                'Content-Type': 'application/json',
                'Idempotency-Key': `wdcc-live-email-${process.env.FROZEN_CANDIDATE_SHA}-v2`
              },
              body: JSON.stringify({
                from: process.env.PROOF_FROM,
                to: [process.env.PROOF_RECIPIENT],
                subject,
                text: `WDCC live provider proof for frozen candidate ${process.env.FROZEN_CANDIDATE_SHA}. No reply required.`
              })
            });
            const sendText = await send.text();
            let sendJson = {};
            try { sendJson = JSON.parse(sendText); } catch {}
            if (!send.ok) {
              summary(`LIVE_RESEND_SEND=FAIL_HTTP_${send.status}`);
              const message = String(sendJson.message || sendJson.name || 'provider rejected request').replace(/[\r\n]+/g, ' ').slice(0, 300);
              summary(`PROVIDER_ERROR=${message}`);
              summary('EMAIL_GATE=HOLD_PROVIDER_REJECTED');
              console.error(`RESEND_REJECTED_HTTP_${send.status}: ${message}`);
              process.exit(23);
            }
            const emailId = String(sendJson.id || '');
            if (!emailId) {
              summary('LIVE_RESEND_SEND=FAIL_NO_PROVIDER_ID');
              process.exit(24);
            }
            summary('LIVE_RESEND_SEND=ACCEPTED');
            summary(`RESEND_EMAIL_ID=${emailId}`);

            let lastEvent = '';
            for (let i = 0; i < 30; i++) {
              const r = await fetch(`https://api.resend.com/emails/${encodeURIComponent(emailId)}`, {
                headers: { Authorization: `Bearer ${key}` }
              });
              if (r.ok) {
                const j = await r.json();
                lastEvent = String(j.last_event || '');
                if (['delivered','opened','clicked'].includes(lastEvent)) {
                  summary(`LAST_EVENT=${lastEvent}`);
                  summary('EMAIL_GATE=GREEN');
                  return;
                }
                if (['bounced','failed','complained','suppressed'].includes(lastEvent)) {
                  summary(`LAST_EVENT=${lastEvent}`);
                  summary('EMAIL_GATE=HOLD_DELIVERY_FAILURE');
                  process.exit(25);
                }
              }
              await sleep(2000);
            }
            summary(`LAST_EVENT=${lastEvent || 'not_terminal'}`);
            summary('EMAIL_GATE=HOLD_DELIVERY_NOT_CONFIRMED');
            process.exit(26);
          })().catch(err => {
            summary(`PROOF_ERROR=${String(err && err.message || err).replace(/[\r\n]+/g,' ').slice(0,300)}`);
            process.exit(27);
          });
          NODE
