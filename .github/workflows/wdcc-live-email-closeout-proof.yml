name: WDCC Live Email Closeout Proof

on:
  pull_request:
    branches: [preview/wdcc-mockup-convergence-20260827-v2-proof]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/wdcc-live-email-closeout-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-live-email-closeout-proof
  cancel-in-progress: false

env:
  FROZEN_CANDIDATE_SHA: 883f211f345f69967ffad84c3dec3ff36e4f0aee
  VERCEL_SCOPE: cpxagency
  VERCEL_ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
  VERCEL_PROJECT_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
  PROOF_RECIPIENT: sean@wedontcarecars.com
  PROOF_FROM: WDCC Leads <leads@wedontcarecars.com>

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      GH_WDCC_RESEND_API_KEY: ${{ secrets.WDCC_RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove frozen candidate lineage
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$FROZEN_CANDIDATE_SHA^{commit}"
          echo "FROZEN_CANDIDATE_SHA=$FROZEN_CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'PR522_CANDIDATE_CHANGED=NO' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure canonical recipient and intended sender
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          npm install --global vercel@59.5.0 >/dev/null
          mkdir -p /tmp/wdcc-email-config/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > /tmp/wdcc-email-config/.vercel/project.json
          cd /tmp/wdcc-email-config
          printf '%s\n' "$PROOF_RECIPIENT" | VERCEL_ORG_ID="$VERCEL_ORG_ID" VERCEL_PROJECT_ID="$VERCEL_PROJECT_ID" vercel env add WDCC_LEAD_NOTIFICATION_EMAILS production --force --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
          printf '%s\n' "$PROOF_FROM" | VERCEL_ORG_ID="$VERCEL_ORG_ID" VERCEL_PROJECT_ID="$VERCEL_PROJECT_ID" vercel env add WDCC_LEAD_FROM_EMAIL production --force --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
          VERCEL_ORG_ID="$VERCEL_ORG_ID" VERCEL_PROJECT_ID="$VERCEL_PROJECT_ID" vercel env pull /tmp/wdcc-email.env --environment=production --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" >/dev/null
          set -a; . /tmp/wdcc-email.env; set +a
          test "$WDCC_LEAD_NOTIFICATION_EMAILS" = "$PROOF_RECIPIENT"
          test "$WDCC_LEAD_FROM_EMAIL" = "$PROOF_FROM"
          echo 'RECIPIENT_CONFIG_INCLUDES_SEAN=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'INTENDED_FROM_IDENTITY=leads@wedontcarecars.com' >> "$GITHUB_STEP_SUMMARY"
          echo 'NONSECRET_EMAIL_CONFIG_READBACK=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'PRODUCTION_DATA_CHANGED=NO' >> "$GITHUB_STEP_SUMMARY"
          echo 'PRODUCTION_ROUTES_CHANGED=NO' >> "$GITHUB_STEP_SUMMARY"

      - name: Require real Resend credential
        id: provider
        shell: bash
        run: |
          set -euo pipefail
          set -a; . /tmp/wdcc-email.env; set +a
          key="${RESEND_API_KEY:-${WDCC_RESEND_API_KEY:-${GH_RESEND_API_KEY:-${GH_WDCC_RESEND_API_KEY:-}}}}"
          if [ -z "$key" ]; then
            echo 'RESEND_API_KEY_PRESENT=NO' >> "$GITHUB_STEP_SUMMARY"
            echo 'EMAIL_GATE=HOLD_PROVIDER_CREDENTIAL_MISSING' >> "$GITHUB_STEP_SUMMARY"
            exit 20
          fi
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo 'RESEND_API_KEY_PRESENT=YES' >> "$GITHUB_STEP_SUMMARY"

      - name: Send one live provider proof and require delivery
        shell: bash
        env:
          RESEND_API_KEY: ${{ steps.provider.outputs.key }}
        run: |
          set -euo pipefail
          subject="WDCC live email closeout — ${FROZEN_CANDIDATE_SHA:0:12} — run ${GITHUB_RUN_ID}"
          payload="$(jq -n --arg from "$PROOF_FROM" --arg to "$PROOF_RECIPIENT" --arg subject "$subject" --arg text "WDCC live provider proof for frozen candidate $FROZEN_CANDIDATE_SHA. No reply required." '{from:$from,to:[$to],subject:$subject,text:$text}')"
          code="$(curl -sS -o /tmp/send.json -w '%{http_code}' https://api.resend.com/emails -X POST -H "Authorization: Bearer $RESEND_API_KEY" -H 'Content-Type: application/json' -H "Idempotency-Key: wdcc-live-email-${FROZEN_CANDIDATE_SHA}-${GITHUB_RUN_ID}" --data "$payload")"
          case "$code" in 200|201) ;; *) cat /tmp/send.json >&2; exit 4;; esac
          email_id="$(jq -r '.id // empty' /tmp/send.json)"; test -n "$email_id"
          delivered=0
          for i in $(seq 1 30); do
            curl -sS -o /tmp/email.json "https://api.resend.com/emails/$email_id" -H "Authorization: Bearer $RESEND_API_KEY"
            event="$(jq -r '.last_event // empty' /tmp/email.json)"
            case "$event" in delivered|opened|clicked) delivered=1; break;; bounced|failed|complained|suppressed) exit 5;; esac
            sleep 2
          done
          test "$delivered" = 1
          echo 'LIVE_RESEND_SEND=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "RESEND_EMAIL_ID=$email_id" >> "$GITHUB_STEP_SUMMARY"
          echo "LAST_EVENT=$event" >> "$GITHUB_STEP_SUMMARY"
          echo 'EMAIL_GATE=GREEN' >> "$GITHUB_STEP_SUMMARY"
