name: WDCC Trigger Apex Recovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-trigger-apex-recovery.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch emergency no-build apex cutover
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wdcc-emergency-apex-cutover.yml --repo "$GITHUB_REPOSITORY" --ref main
