name: WDCC Mockup V2 Media Diagnostic

on:
  push:
    branches: [preview/wdcc-mockup-convergence-20260827-v2-proof]
    paths:
      - '.github/workflows/wdcc-mockup-v2-media-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wdcc-media-diag && cd /tmp/wdcc-media-diag
          npm init -y >/dev/null
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Identify exact failing featured media
        shell: bash
        env:
          PREVIEW_URL: https://wdcc-v2-9d04cba4b5d4.clico-global.workers.dev
        run: |
          set -euo pipefail
          cd /tmp/wdcc-media-diag
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          await page.goto(`${process.env.PREVIEW_URL}/?owner-review=1&intro=1&media-diag=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
          const skip=page.locator('.li-skip');
          if(await skip.count()) await skip.click({force:true});
          await page.waitForFunction(()=>!document.querySelector('.li'),null,{timeout:5000});
          await page.waitForFunction(()=>document.querySelectorAll('.rh-grid article').length>=5,null,{timeout:10000});
          await page.waitForTimeout(1000);
          const cards=await page.evaluate(()=>[...document.querySelectorAll('.rh-grid article')].map((c,index)=>{
            const img=c.querySelector('a:first-child img');
            const placeholder=c.querySelector('[aria-label$="photo unavailable"]');
            const title=c.querySelector('a[aria-label^="View "]')?.getAttribute('aria-label')||c.textContent?.trim().slice(0,120)||'';
            return {index,title,hasImg:Boolean(img),complete:Boolean(img?.complete),naturalWidth:img?.naturalWidth||0,naturalHeight:img?.naturalHeight||0,srcPrefix:img?.getAttribute('src')?.slice(0,80)||'',placeholder:Boolean(placeholder)};
          }));
          console.log(JSON.stringify({preview:process.env.PREVIEW_URL,cards},null,2));
          await browser.close();
          if(cards.length!==5) process.exit(2);
          if(cards.filter(c=>c.hasImg&&c.complete&&c.naturalWidth>0).length!==5) process.exit(1);
          NODE
