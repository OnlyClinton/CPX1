name: WDCC My Day Clickthrough Build
on:
  push:
    branches:
      - fix/wdcc-myday-clickthrough-thumbnails
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
