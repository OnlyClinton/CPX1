name: WDCC Dealer Target Production
# target-refresh: leads-inventory-target-v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-dealer-target-production.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wdcc-dealer-target-production
  cancel-in-progress: true

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
  VERCEL_PROJECT_ID: prj_fz5mN7Q5gImZ9UGpv1GDpHxPtLNB
  VERCEL_SCOPE: cpxagency
  DEALER: https://dealer.wedontcarecars.com
  PROJECT_ALIAS: https://wdcc-dealer-portal.vercel.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Require dealer deployment authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test "$VERCEL_PROJECT_ID" = 'prj_fz5mN7Q5gImZ9UGpv1GDpHxPtLNB'

      - name: Install dependencies and pinned Vercel CLI
        run: |
          npm ci
          npm install --global vercel@59.3.0

      - name: Pull dealer production configuration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
          jq -e --arg p "$VERCEL_PROJECT_ID" '.projectId == $p' .vercel/project.json >/dev/null

      - name: Build dealer artifact on GitHub
        shell: bash
        run: |
          set -euo pipefail
          vercel build --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
          test -d .vercel/output

      - name: Deploy archived prebuilt artifact to dealer project only
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          log=/tmp/vercel-deploy.log
          vercel deploy --prebuilt --prod --yes --archive=tgz --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" 2>&1 | tee "$log"
          url="$(grep -Eo 'https://wdcc-dealer-portal-[A-Za-z0-9-]+\.vercel\.app' "$log" | tail -1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify corrected UI on stable alias and live dealer frontdoor
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 30); do
            code="$(curl -sS -L -o /tmp/project-ui.html -w '%{http_code}' "$PROJECT_ALIAS/dealer?ui_fix=$GITHUB_RUN_ID-$i" || true)"
            if [ "$code" = 200 ] && grep -q 'RUN YOUR DEALERSHIP' /tmp/project-ui.html && grep -q 'SECURE DEALER ACCESS' /tmp/project-ui.html; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          echo "project_alias=PASS" >> "$GITHUB_OUTPUT"
          live="$(curl -sS -L -o /tmp/live-ui.html -w '%{http_code}' "$DEALER/dealer?ui_fix=$GITHUB_RUN_ID" || true)"
          test "$live" = 200
          grep -q 'RUN YOUR DEALERSHIP' /tmp/live-ui.html
          echo "live_http=$live" >> "$GITHUB_OUTPUT"
          echo "live_target=PASS" >> "$GITHUB_OUTPUT"

      - name: Report dealer UI deployment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          PROJECT_ALIAS: ${{ steps.verify.outputs.project_alias }}
          LIVE_HTTP: ${{ steps.verify.outputs.live_http }}
          LIVE_TARGET: ${{ steps.verify.outputs.live_target }}
        shell: bash
        run: |
          body="Status: **$STATUS**\nSource: \`$GITHUB_SHA\`\nDealer UI deployment: \`$DEPLOYMENT_URL\`\nStable dealer UI alias: **$PROJECT_ALIAS**\nLive dealer HTTP/target: \`$LIVE_HTTP\` / **$LIVE_TARGET**\nAPIs remain routed by Cloudflare target V3 to immutable Phoenix authority."
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC corrected dealer UI production $GITHUB_RUN_ID" --body "$body" || true
