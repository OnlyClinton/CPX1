name: Emergency restore WDCC public to exact 2vfD

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-restore-wdcc-public-2vfd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-public:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API: https://api.cloudflare.com/client/v4
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZONE_ID: 53f5a816cfbba0c31d6d12fe46af05a1
      DONOR: https://wdcc-v32-storefront-a2wntmnnn-cpxagency.vercel.app
      APEX: https://wedontcarecars.com
      WWW: https://www.wedontcarecars.com
    steps:
      - name: Require Cloudflare authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 2; }

      - name: Snapshot Worker routes
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$CF_API/zones/$ZONE_ID/workers/routes" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H 'Content-Type: application/json' > /tmp/routes-before.json
          jq -e '.success == true' /tmp/routes-before.json >/dev/null
          jq -r '.result[] | [.id,.pattern,(.script//"-")] | @tsv' /tmp/routes-before.json | sort | tee /tmp/routes-before.tsv

      - name: Remove stale customer storefront Worker route only
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t PUBLIC_IDS < <(jq -r '.result[] | select(.pattern=="wedontcarecars.com/*" and .script=="wdcc-home-sleek-edge") | .id' /tmp/routes-before.json)
          if [ "${#PUBLIC_IDS[@]}" -gt 1 ]; then
            echo 'Unexpected duplicate public WDCC Worker routes; refusing broad mutation.'
            exit 3
          fi
          if [ "${#PUBLIC_IDS[@]}" -eq 1 ]; then
            id="${PUBLIC_IDS[0]}"
            echo "Removing stale customer Worker route $id"
            curl -fsS -X DELETE "$CF_API/zones/$ZONE_ID/workers/routes/$id" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H 'Content-Type: application/json' > /tmp/delete-public.json
            jq -e '.success == true' /tmp/delete-public.json >/dev/null
          else
            echo 'Stale public Worker route already absent.'
          fi

      - name: Purge stale public WDCC hero and logo objects
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg a1 "$APEX/wdcc-logo-transparent.webp" \
                --arg a2 "$APEX/wdcc-hero-v2.webp" \
                --arg w1 "$WWW/wdcc-logo-transparent.webp" \
                --arg w2 "$WWW/wdcc-hero-v2.webp" \
                '{files:[$a1,$a2,$w1,$w2]}' > /tmp/purge.json
          curl -fsS -X POST "$CF_API/zones/$ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H 'Content-Type: application/json' \
            --data @/tmp/purge.json > /tmp/purge-result.json
          jq -e '.success == true' /tmp/purge-result.json >/dev/null

      - name: Prove dealer Worker route was not touched
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$CF_API/zones/$ZONE_ID/workers/routes" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H 'Content-Type: application/json' > /tmp/routes-after.json
          jq -e '.success == true' /tmp/routes-after.json >/dev/null
          test "$(jq '[.result[] | select(.pattern=="wedontcarecars.com/*")] | length' /tmp/routes-after.json)" -eq 0
          jq -e '.result[] | select(.pattern=="dealer.wedontcarecars.com/*" and .script=="wdcc-dealer-frontdoor")' /tmp/routes-after.json >/dev/null

      - name: Verify exact 2vfD HTML and media are exposed
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl -fsS --max-time 25 "$DONOR/wdcc-logo-transparent.webp?proof=$stamp" -o /tmp/donor-logo.webp
          curl -fsS --max-time 25 "$DONOR/wdcc-hero-v2.webp?proof=$stamp" -o /tmp/donor-hero.webp
          donor_logo="$(sha256sum /tmp/donor-logo.webp | awk '{print $1}')"
          donor_hero="$(sha256sum /tmp/donor-hero.webp | awk '{print $1}')"

          for host in "$APEX" "$WWW"; do
            ok=0
            for i in $(seq 1 15); do
              code="$(curl -sS -L --max-time 25 -o /tmp/live.html -w '%{http_code}' "$host/?restore=$stamp-$i" || true)"
              if [ "$code" = 200 ] \
                && grep -q 'wdcc-logo-transparent.webp' /tmp/live.html \
                && grep -q 'wdcc-hero-v2.webp' /tmp/live.html \
                && grep -qi 'we don.t care' /tmp/live.html; then
                ok=1; break
              fi
              sleep 2
            done
            test "$ok" = 1
            curl -fsS --max-time 25 "$host/wdcc-logo-transparent.webp?restore=$stamp" -o /tmp/live-logo.webp
            curl -fsS --max-time 25 "$host/wdcc-hero-v2.webp?restore=$stamp" -o /tmp/live-hero.webp
            live_logo="$(sha256sum /tmp/live-logo.webp | awk '{print $1}')"
            live_hero="$(sha256sum /tmp/live-hero.webp | awk '{print $1}')"
            test "$live_logo" = "$donor_logo"
            test "$live_hero" = "$donor_hero"
          done

          dealer_code="$(curl -sS -L --max-time 20 -o /dev/null -w '%{http_code}' https://dealer.wedontcarecars.com/dealer || true)"
          echo "$dealer_code" | grep -Eq '^(200|302|307|308)$'
          echo 'PUBLIC_EXACT_2VFD_ORIGIN=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'PUBLIC_MEDIA_HASH_MATCH=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'DEALER_ROUTE_PRESERVED=PASS' >> "$GITHUB_STEP_SUMMARY"
