name: BUILD WDCC DEALER V3 AND ISOLATED PREVIEW

on:
  push:
    branches: [codex/wdcc-dealer-app-v3-20260830]
    paths:
      - "android/dealer-app/**"
      - "app/app/**"
      - "app/dealer/**"
      - "app/vehicle/**"
      - "lib/vehiclePhotos.ts"
      - "public/wdcc-logo-transparent.webp"
      - ".github/workflows/build-wdcc-dealer-v3-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wdcc-dealer-v3-preview
  cancel-in-progress: true

env:
  APK_URL: https://github.com/OnlyClinton/CPX1/releases/download/wdcc-dealer-app-v3/WDCC-Dealer-v3.apk
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
  VERCEL_PROJECT_ID: prj_We7xkAkB5Qy31Pt17USSkQFE0u7h
  VERCEL_SCOPE: cpxagency

jobs:
  build-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build and inspect installable Android APK
        working-directory: android/dealer-app
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../../WDCC-Dealer-v3.apk
          test "$(stat -c%s ../../WDCC-Dealer-v3.apk)" -gt 1000000
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs ../../WDCC-Dealer-v3.apk
          sha256sum ../../WDCC-Dealer-v3.apk | tee ../../WDCC-Dealer-v3.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: WDCC-Dealer-v3-APK
          path: |
            WDCC-Dealer-v3.apk
            WDCC-Dealer-v3.apk.sha256
          retention-days: 30

      - name: Publish stable Android installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wdcc-dealer-app-v3
          target_commitish: ${{ github.sha }}
          name: WDCC Dealer Android App 3.0
          body: |
            Installable Android build of the WDCC Dealer Portal.

            Includes the validated official WDCC badge, live dealer-domain routing,
            camera/gallery vehicle photos, deep links, app shortcuts, session persistence,
            and visible connection recovery controls.

            Exact build commit: ${{ github.sha }}
          files: |
            WDCC-Dealer-v3.apk
            WDCC-Dealer-v3.apk.sha256
          make_latest: true
          prerelease: false
          draft: false
          overwrite_files: true

      - name: Verify public APK integrity
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl -fL --retry 2 --retry-delay 2 "$APK_URL" -o /tmp/WDCC-Dealer-v3.apk; then
              break
            fi
            sleep 5
          done
          test "$(stat -c%s /tmp/WDCC-Dealer-v3.apk)" -gt 1000000
          release_sha="$(sha256sum /tmp/WDCC-Dealer-v3.apk | awk '{print $1}')"
          local_sha="$(awk '{print $1}' WDCC-Dealer-v3.apk.sha256)"
          test "$release_sha" = "$local_sha"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Build exact web source
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Prove launcher and download routes locally
        run: |
          set -euo pipefail
          npm start >/tmp/wdcc-v3-next.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/app -o /tmp/app.html && break
            sleep 1
          done
          grep -q 'Run your inventory from anywhere' /tmp/app.html
          grep -q 'https://dealer.wedontcarecars.com/dealer' /tmp/app.html
          grep -q 'Download Android' /tmp/app.html
          curl -sS -D /tmp/download.headers -o /dev/null http://127.0.0.1:3000/app/download/android
          test "$(awk 'NR==1 {print $2}' /tmp/download.headers)" = 307
          test "$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/,"" ); print $2}' /tmp/download.headers | tail -n1)" = "$APK_URL"

      - name: Link storefront project and build preview configuration
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          npm install --global vercel@59.5.0 >/dev/null
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          vercel pull --yes --environment=preview --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" >/dev/null
          vercel build --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Deploy isolated preview candidate
        id: deploy
        run: |
          set -euo pipefail
          output="$(vercel deploy --prebuilt --skip-domain --yes --env "WDCC_ANDROID_APK_URL=$APK_URL" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" 2>&1)"
          printf '%s\n' "$output"
          url="$(printf '%s\n' "$output" | grep -Eo 'https://wdcc-v32-storefront-[a-z0-9-]+-cpxagency\.vercel\.app' | tail -n1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify live dealer dependency
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 https://dealer.wedontcarecars.com/api/health -o /tmp/dealer-health.json
          jq -e '.ok == true and .degraded == false' /tmp/dealer-health.json >/dev/null

      - name: Publish proof summary
        env:
          CANDIDATE: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo '## WDCC Dealer App v3 release proof'
            echo
            echo "- Exact source: $GITHUB_SHA"
            echo "- Isolated preview: $CANDIDATE/app"
            echo "- Android installer: $APK_URL"
            echo '- Production aliases, DNS, Cloudflare routes, and dealer domain: unchanged per release-control issue #205'
            echo '- Web build, local launcher routes, APK signature, release checksum, isolated preview deploy, and live dealer health: verified'
          } >> "$GITHUB_STEP_SUMMARY"
