name: WDCC Strict Visual Interaction Gate

on:
  push:
    branches:
      - fix/wdcc-locked-contract-20260826
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-strict-visual-gate
  cancel-in-progress: true

jobs:
  strict-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0 playwright@1.55.0
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets
          npx playwright install --with-deps chromium >/dev/null

      - name: Create isolated no-route worker
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          cfg.name='wdcc-strict-visual-preview';
          cfg.workers_dev=true;
          cfg.preview_urls=true;
          delete cfg.route;
          delete cfg.routes;
          fs.writeFileSync('wrangler.strict-visual.jsonc',JSON.stringify(cfg,null,2)+'\n');
          NODE
          ! grep -qi 'wedontcarecars.com' wrangler.strict-visual.jsonc

      - name: Deploy exact isolated preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.strict-visual.jsonc 2>&1 | tee /tmp/wdcc-strict-visual.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wdcc-strict-visual.log | tail -1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > strict-preview-url.txt

      - name: Strict storefront and dealer interaction proof
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p strict-visual-proof
          node - <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const base=process.env.URL;
            if(!base)throw Error('PREVIEW_URL_MISSING');
            const invRes=await fetch(`${base}/api/inventory?strict=${Date.now()}`);
            if(!invRes.ok)throw Error(`INVENTORY_${invRes.status}`);
            const invJson=await invRes.json();
            const items=Array.isArray(invJson.items)?invJson.items:Array.isArray(invJson.inventory)?invJson.inventory:[];
            if(!items.length)throw Error('NO_REAL_INVENTORY');
            const live=items.filter(v=>String(v.status||'').toLowerCase()==='published'&&v.internalOnly!==true&&!['internal','dealer_only'].includes(String(v.visibility||'').toLowerCase()));
            const first=live[0]||items[0];
            if(!first?.id)throw Error('NO_REAL_VEHICLE_ID');
            const firstId=String(first.id);
            const proof={sha:process.env.GITHUB_SHA,url:base,writeRequests:[],checks:{}};
            const browser=await chromium.launch({headless:true});
            const waitIntroDone=async p=>{
              const intro=p.locator('.li');
              if(await intro.count())await intro.waitFor({state:'detached',timeout:5000}).catch(async()=>{
                if(await intro.count())await p.getByRole('button',{name:/skip intro/i}).click({timeout:1500}).catch(()=>{});
              });
              await p.locator('.rh-header').waitFor({state:'visible',timeout:5000});
            };
            async function wireDealer(page){
              page.on('request',r=>{if(['POST','PUT','PATCH','DELETE'].includes(r.method()))proof.writeRequests.push({method:r.method(),url:r.url()})});
              const sessionBody=JSON.stringify({authenticated:true,name:'WDCC Strict Visual QA',role:'dealer_agent',tenantId:'wdcc',user:{id:'strict-visual-only',displayName:'WDCC Strict Visual QA',role:'dealer_agent',tenantId:'wdcc'}});
              const dashBody=JSON.stringify({summary:{soldThisWeek:0,newToday:0,appointments:0,applications:0,messages:0},inventory:items,leads:[]});
              const itemBody=JSON.stringify({item:first});
              await page.route('**/api/auth/session',r=>r.fulfill({status:200,contentType:'application/json',body:sessionBody}));
              await page.route('**/api/crm/dashboard',r=>r.fulfill({status:200,contentType:'application/json',body:dashBody}));
              await page.route('**/api/inventory/*',r=>{
                const u=new URL(r.request().url());
                if(decodeURIComponent(u.pathname)===`/api/inventory/${firstId}`)return r.fulfill({status:200,contentType:'application/json',body:itemBody});
                return r.continue();
              });
            }
            try{
              const mc=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
              const m=await mc.newPage();
              await m.goto(`${base}/?strict=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
              await m.locator('.li-badge img').waitFor({state:'visible',timeout:12000});
              const intro=await m.evaluate(()=>{
                const badge=document.querySelector('.li-badge img'),scene=document.querySelector('.li-scene img');
                const bs=getComputedStyle(badge),ss=getComputedStyle(scene),bb=badge.getBoundingClientRect();
                return {badgeW:bb.width,badgeAnimation:bs.animationName,badgeTransform:bs.transform,sceneAnimation:ss.animationName,sceneTransform:ss.transform};
              });
              if(intro.badgeW<120||intro.badgeAnimation!=='none'||intro.sceneAnimation!=='none'||intro.badgeTransform!=='none'||intro.sceneTransform!=='none')throw Error(`INTRO_NOT_STATIC ${JSON.stringify(intro)}`);
              await m.screenshot({path:'strict-visual-proof/mobile-intro.png'});
              await waitIntroDone(m);

              const header=await m.evaluate(()=>{
                const u=document.querySelector('.rh-utility'),h=document.querySelector('.rh-header'),logo=document.querySelector('.rh-logo img');
                const ub=u.getBoundingClientRect(),hb=h.getBoundingClientRect(),lb=logo.getBoundingClientRect();
                return {utilityPosition:getComputedStyle(u).position,headerPosition:getComputedStyle(h).position,utilityH:ub.height,headerTop:hb.top,logoW:lb.width};
              });
              if(!['sticky','fixed'].includes(header.utilityPosition)||!['sticky','fixed'].includes(header.headerPosition)||header.utilityH<24||header.logoW<88)throw Error(`MOBILE_HEADER_BAD ${JSON.stringify(header)}`);
              await m.evaluate(()=>scrollTo(0,700)); await m.waitForTimeout(160);
              const pinned=await m.evaluate(()=>{const u=document.querySelector('.rh-utility').getBoundingClientRect(),h=document.querySelector('.rh-header').getBoundingClientRect();return{uTop:u.top,uH:u.height,hTop:h.top}});
              if(Math.abs(pinned.uTop)>2||Math.abs(pinned.hTop-pinned.uH)>3)throw Error(`MOBILE_HEADER_NOT_PINNED ${JSON.stringify(pinned)}`);
              await m.evaluate(()=>scrollTo(0,0)); await m.waitForTimeout(120);

              const menu=m.locator('.rh-menu');
              await menu.click();
              const nav=m.locator('.rh-nav.open');
              await nav.waitFor({state:'visible',timeout:3000});
              const navLinks=await nav.locator('a').count();
              if(navLinks<3)throw Error(`MOBILE_NAV_INCOMPLETE ${navLinks}`);
              await m.screenshot({path:'strict-visual-proof/mobile-nav-open.png'});
              await menu.click();

              const grid=m.locator('.rh-grid');
              const cards=grid.locator('.rh-card');
              if(await cards.count()<2)throw Error('MOBILE_CAROUSEL_NEEDS_2_CARDS');
              const scrollBefore=await grid.evaluate(el=>el.scrollLeft);
              await grid.evaluate(el=>el.scrollBy({left:el.clientWidth*0.9,behavior:'instant'}));
              await m.waitForTimeout(250);
              const scrollAfter=await grid.evaluate(el=>el.scrollLeft);
              if(scrollAfter<=scrollBefore+20)throw Error(`MOBILE_CAROUSEL_DID_NOT_ADVANCE ${scrollBefore}->${scrollAfter}`);
              await m.screenshot({path:'strict-visual-proof/mobile-carousel-advanced.png'});
              proof.checks.mobile={intro,header,pinned,navLinks,scrollBefore,scrollAfter};
              await mc.close();

              const dc=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});
              const d=await dc.newPage();
              await d.goto(`${base}/?strict-desktop=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
              await waitIntroDone(d);
              const desktop=await d.evaluate(()=>{
                const grid=document.querySelector('.rh-grid'),menu=document.querySelector('.rh-menu'),logo=document.querySelector('.rh-logo img');
                const gs=getComputedStyle(grid),ms=getComputedStyle(menu),lb=logo.getBoundingClientRect();
                const tracks=gs.gridTemplateColumns.split(/\s+/).filter(Boolean);
                return {display:gs.display,tracks,menu:ms.display,logoW:lb.width};
              });
              if(desktop.display!=='grid'||desktop.tracks.length!==3||desktop.menu!=='none'||desktop.logoW<88)throw Error(`DESKTOP_CONTRACT_BAD ${JSON.stringify(desktop)}`);
              await d.screenshot({path:'strict-visual-proof/desktop-grid.png',fullPage:true});
              proof.checks.desktop=desktop;

              const dealer=await dc.newPage(); await wireDealer(dealer);
              await dealer.goto(`${base}/dealer/inventory/new?edit=${encodeURIComponent(firstId)}&strict=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
              await dealer.locator('.editVehicleApp').waitFor({state:'visible',timeout:12000});
              const preview=dealer.getByRole('button',{name:/^preview$/i}).last();
              await preview.scrollIntoViewIfNeeded();
              await preview.click({timeout:5000});
              await dealer.locator('.previewModal').waitFor({state:'visible',timeout:5000});
              await dealer.locator('.previewModal').screenshot({path:'strict-visual-proof/dealer-preview-desktop.png'});
              proof.checks.dealerDesktop='normal-click-pass';
              await dc.close();

              const dmc=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
              const dm=await dmc.newPage(); await wireDealer(dm);
              await dm.goto(`${base}/dealer/inventory/new?edit=${encodeURIComponent(firstId)}&strict=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
              await dm.locator('.editVehicleApp').waitFor({state:'visible',timeout:12000});
              const mobilePreview=dm.getByRole('button',{name:/^preview$/i}).last();
              await mobilePreview.scrollIntoViewIfNeeded();
              await mobilePreview.click({timeout:5000});
              await dm.locator('.previewModal').waitFor({state:'visible',timeout:5000});
              await dm.locator('.previewModal').screenshot({path:'strict-visual-proof/dealer-preview-mobile.png'});
              proof.checks.dealerMobile='normal-click-pass';
              await dmc.close();
            } finally { await browser.close(); }
            if(proof.writeRequests.length)throw Error(`STRICT_PROOF_WRITE_REQUEST ${JSON.stringify(proof.writeRequests)}`);
            fs.writeFileSync('strict-visual-proof/metrics.json',JSON.stringify(proof,null,2)+'\n');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Publish strict proof summary
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          echo '### WDCC strict exact-SHA visual interaction gate' >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: ${URL:-not-created}" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Requires real mobile menu interaction, carousel advancement, exactly three desktop grid tracks, and normal dealer Preview clicks without force.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No production route, alias, DNS, lead, inventory, media, provider, or database mutation is permitted.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-strict-visual-proof
          path: |
            strict-preview-url.txt
            strict-visual-proof/
          if-no-files-found: warn
          retention-days: 7
