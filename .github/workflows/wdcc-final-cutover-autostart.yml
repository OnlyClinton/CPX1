name: WDCC Final Cutover Autostart

on:
  push:
    branches: [release/dealer-cloudflare-v1]
    paths:
      - '.github/workflows/wdcc-final-cutover-autostart.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch corrected dealer final cutover
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run wdcc-dealer-final-zone-cutover.yml \
            -R "$GITHUB_REPOSITORY" \
            --ref release/dealer-cloudflare-v1
