name: WDCC Current Board Owner Approval Proof

on:
  push:
    branches: [fix/wdcc-locked-contract-20260826]
    paths:
      - 'app/**'
      - 'public/**'
      - '.github/support/wdcc-owner-board-rebuild-proof.mjs'
      - '.github/support/wdcc-owner-board-rebuild-proof-latest.mjs'
      - '.github/workflows/wdcc-owner-approval-current.yml'
      - 'WDCC_LOCKED_CONTRACT.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-current-board-owner-${{ github.sha }}
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  owner-approval-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Lock current supplied-board authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -s public/wdcc-hero-v2.webp
          test -s public/wdcc-logo-transparent.webp
          test -s app/WdccPublicChrome.tsx
          test -s app/ReferenceCloneHome.tsx
          test -s app/wdcc-round-header-contract.css
          test -s .github/support/wdcc-owner-board-rebuild-proof-latest.mjs
          grep -Fq 'data-wdcc-logo-art="owner-wordmark"' app/WdccPublicChrome.tsx
          grep -Fq '/wdcc-logo-transparent.webp' app/WdccPublicChrome.tsx
          grep -Fq 'data-wdcc-intro-badge-art="owner-approved"' app/LockedIntro.tsx
          grep -Fq 'OWNER-SUPPLIED BOARD CLOSEOUT' app/wdcc-round-header-contract.css
          grep -Fq 'Vehicles ready now.' app/ReferenceCloneHome.tsx
          grep -Fq 'Add Vehicle is a clean new record' WDCC_LOCKED_CONTRACT.md
          grep -Fq 'new-vehicle' app/dealer/inventory/new/page.tsx

      - name: Build exact Cloudflare candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0 playwright@1.55.0
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets
          test -s .next/BUILD_ID
          npx playwright install --with-deps chromium >/dev/null

      - name: Create exact-SHA no-route Worker
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          cfg.name=`wdcc-owner-${process.env.GITHUB_SHA}`;
          cfg.workers_dev=true;
          cfg.preview_urls=true;
          delete cfg.route;
          delete cfg.routes;
          fs.writeFileSync('wrangler.owner-current.jsonc',JSON.stringify(cfg,null,2)+'\n');
          NODE
          ! grep -qi 'wedontcarecars.com' wrangler.owner-current.jsonc
          grep -Fq "$GITHUB_SHA" wrangler.owner-current.jsonc

      - name: Deploy immutable owner-review Worker only
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.owner-current.jsonc 2>&1 | tee /tmp/wdcc-owner-current.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wdcc-owner-current.log | tail -1)"
          test -n "$url"
          case "$url" in *"$GITHUB_SHA"*) ;; *) echo "Not exact SHA: $url" >&2; exit 1;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > current-owner-preview-url.txt

      - name: Verify exact remote build and assets
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          code=000
          for i in $(seq 1 30); do
            code="$(curl --http1.1 -sS -L -o /tmp/current-home.html -w '%{http_code}' "$URL/?owner-review=1&root-warm=$GITHUB_RUN_ID-$i" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          test "$code" = 200
          build="$(tr -d '\r\n' < .next/BUILD_ID)"
          grep -Fq -- "$build" /tmp/current-home.html
          grep -Fq 'data-wdcc-logo-art="owner-wordmark"' /tmp/current-home.html
          test "$(curl --http1.1 -sS -L -o /tmp/current-wordmark.webp -w '%{http_code}' "$URL/wdcc-logo-transparent.webp?asset=$GITHUB_RUN_ID")" = 200
          test "$(sha256sum /tmp/current-wordmark.webp | awk '{print $1}')" = "$(sha256sum public/wdcc-logo-transparent.webp | awk '{print $1}')"
          test "$(curl --http1.1 -sS -D /tmp/current-logo.headers -L -o /tmp/current-logo.webp -w '%{http_code}' "$URL/wdcc-owner-logo?asset=$GITHUB_RUN_ID")" = 200
          grep -qi '^x-wdcc-logo: owner-approved' /tmp/current-logo.headers

      - name: Capture and prove current supplied boards
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          node .github/support/wdcc-owner-board-rebuild-proof-latest.mjs
          test -s owner-board-proof/result.json
          node -e "const r=require('./owner-board-proof/result.json');if(!r.pass||r.writes.length)process.exit(1)"

      - name: Require exact current branch head
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test -n "$current"
          test "$current" = "$GITHUB_SHA"

      - name: Publish owner approval summary
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          echo '### WDCC CURRENT SUPPLIED BOARDS — OWNER APPROVAL PROOF' >> "$GITHUB_STEP_SUMMARY"
          echo "Exact SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Isolated workers.dev: ${URL:-not-created}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Production routes / aliases / DNS: UNTOUCHED' >> "$GITHUB_STEP_SUMMARY"
          if [ -s owner-board-proof/result.json ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const r=require('./owner-board-proof/result.json');
          console.log(`PASS: ${r.pass}`);
          console.log(`Board families: ${Object.keys(r.boards||{}).length}`);
          console.log(`Mobile Featured cards: ${r.boards?.homeMobile?.cards?.length||0} · benefit columns: ${r.boards?.homeMobile?.benefits||0}`);
          console.log(`Browser writes: ${r.writes.length}`);
          NODE
          else
            echo 'OWNER_REVIEW_ELIGIBLE: NO' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-current-owner-approval-${{ github.sha }}
          path: |
            current-owner-preview-url.txt
            owner-board-proof/
          if-no-files-found: warn
          retention-days: 7
