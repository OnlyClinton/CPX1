name: WDCC Current Board Owner Approval Proof

on:
  push:
    branches: [fix/wdcc-locked-contract-20260826]
    paths:
      - 'app/**'
      - 'public/**'
      - 'scripts/**'
      - '.github/workflows/wdcc-owner-approval-current.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-current-board-owner-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  owner-approval-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Lock current owner-board authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -s public/wdcc-hero-v2.webp
          test -s app/wdcc-acceptance-closeout.css
          test -s app/WdccPublicChrome.tsx
          test -s app/ReferenceCloneHome.tsx
          grep -Fq 'height:64px!important' app/wdcc-acceptance-closeout.css
          grep -Fq 'width:62px!important' app/wdcc-acceptance-closeout.css
          grep -Fq 'grid-template-columns:repeat(4,minmax(0,1fr))!important' app/wdcc-acceptance-closeout.css
          grep -Fq '29.5vw!important' app/wdcc-acceptance-closeout.css
          grep -Fq '/wdcc-owner-logo' app/WdccPublicChrome.tsx

      - name: Build exact Cloudflare candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0 playwright@1.55.0
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets
          test -s .next/BUILD_ID
          npx playwright install --with-deps chromium >/dev/null

      - name: Create exact-SHA no-route Worker
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          cfg.name=`wdcc-owner-${process.env.GITHUB_SHA}`;
          cfg.workers_dev=true;
          cfg.preview_urls=true;
          delete cfg.route;
          delete cfg.routes;
          fs.writeFileSync('wrangler.owner-current.jsonc',JSON.stringify(cfg,null,2)+'\n');
          NODE
          ! grep -qi 'wedontcarecars.com' wrangler.owner-current.jsonc
          grep -Fq "$GITHUB_SHA" wrangler.owner-current.jsonc

      - name: Deploy immutable owner-review Worker only
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.owner-current.jsonc 2>&1 | tee /tmp/wdcc-owner-current.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wdcc-owner-current.log | tail -1)"
          test -n "$url"
          case "$url" in *"$GITHUB_SHA"*) ;; *) echo "Not exact SHA: $url" >&2; exit 1;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > current-owner-preview-url.txt

      - name: Verify exact remote build and assets
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p current-owner-proof
          code=000
          for i in $(seq 1 25); do
            code="$(curl --http1.1 -sS -L -o /tmp/current-home.html -w '%{http_code}' "$URL/?owner-review=1&warm=$i" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          test "$code" = 200
          build="$(tr -d '\r\n' < .next/BUILD_ID)"
          grep -Fq -- "$build" /tmp/current-home.html
          curl --http1.1 -fsSL "$URL/wdcc-hero-v2.webp" -o /tmp/current-hero.webp
          test "$(sha256sum /tmp/current-hero.webp | awk '{print $1}')" = "$(sha256sum public/wdcc-hero-v2.webp | awk '{print $1}')"
          printf 'sha=%s\nurl=%s\nbuild=%s\nroot_http=%s\n' "$GITHUB_SHA" "$URL" "$build" "$code" > current-owner-proof/remote-integrity.txt

      - name: Capture and prove current 9194 50869 owner board
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {chromium} from 'playwright';
          const base=process.env.URL,sha=process.env.GITHUB_SHA,out='current-owner-proof';
          fs.mkdirSync(out,{recursive:true});
          const result={sha,url:base,mobile:{},desktop:{},dealer:{},writes:[],pass:false};
          const fail=(name,data={})=>{throw new Error(`${name}_${JSON.stringify(data)}`)};
          const rect=e=>{const r=e?.getBoundingClientRect();return r?{x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom,cx:r.x+r.width/2}:null};
          const tracks=e=>getComputedStyle(e).gridTemplateColumns.split(/\s+/).filter(Boolean).length;
          const browser=await chromium.launch({headless:true});
          const watch=p=>p.on('request',r=>{if(['POST','PUT','PATCH','DELETE'].includes(r.method()))result.writes.push({method:r.method(),url:r.url()})});
          const skipIntro=async p=>{const intro=p.locator('.li');if(await intro.count()){const b=p.getByRole('button',{name:/skip intro/i});if(await b.count())await b.click().catch(()=>{});await intro.waitFor({state:'detached',timeout:7000}).catch(()=>{})}};
          const wireDealer=async p=>{
            const session={authenticated:true,name:'WDCC Owner Review',role:'dealer_agent',tenantId:'wdcc',user:{id:'owner-visual',displayName:'WDCC Owner Review',role:'dealer_agent',tenantId:'wdcc'}};
            const dashboard={summary:{soldThisWeek:0,newToday:0,appointments:0,applications:0,messages:0},inventory:[],leads:[]};
            await p.route('**/api/auth/session**',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(session)}));
            await p.route('**/api/crm/dashboard**',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(dashboard)}));
            await p.route('**/api/inventory**',r=>r.request().method()==='GET'?r.fulfill({status:200,contentType:'application/json',body:'{"ok":true,"items":[]}'}):r.abort());
            await p.route('**/api/leads**',r=>r.request().method()==='GET'?r.fulfill({status:200,contentType:'application/json',body:'{"ok":true,"items":[]}'}):r.abort());
          };
          try{
            const mc=await browser.newContext({viewport:{width:390,height:844},screen:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:1});
            const m=await mc.newPage();watch(m);
            let response=await m.goto(`${base}/?owner-review=1&current-board=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
            if(!response||response.status()!==200)fail('MOBILE_HOME_HTTP',{status:response?.status()||0});
            await m.locator('.li').waitFor({state:'visible',timeout:10000});
            await m.locator('.li-scene img').waitFor({state:'visible',timeout:10000});
            await m.locator('.li-badge img').waitFor({state:'visible',timeout:10000});
            await m.waitForFunction(()=>[document.querySelector('.li-scene img'),document.querySelector('.li-badge img')].every(x=>x&&x.complete&&x.naturalWidth>0),null,{timeout:10000});
            await m.screenshot({path:`${out}/mobile-intro.png`});
            await skipIntro(m);
            await m.locator('.reference-home').waitFor({state:'visible',timeout:10000});
            await m.locator('.wdccOwnerReviewBanner').waitFor({state:'visible',timeout:10000});
            await m.locator('.rh-grid > article').first().waitFor({state:'visible',timeout:10000});
            const mm=await m.evaluate(()=>{
              const q=s=>document.querySelector(s),R=e=>{const r=e?.getBoundingClientRect();return r?{x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom,cx:r.x+r.width/2}:null};
              const header=q('[data-wdcc-public-chrome="header"]'),logo=q('[data-wdcc-public-chrome="header"] img[data-wdcc-logo-art="owner-approved"]'),call=q('.rh-call'),utility=q('[data-wdcc-public-chrome="utility"]'),hero=q('.rh-hero'),art=q('.rh-hero-art'),benefits=q('.rh-benefits'),grid=q('.rh-grid');
              const cards=[...grid.children].map(R),ctas=[...document.querySelectorAll('.rh-hero-actions .rh-btn')].map(e=>({text:(e.textContent||'').trim(),...R(e)}));
              const us=utility?getComputedStyle(utility):null,cs=getComputedStyle(call);
              return{winW:innerWidth,header:R(header),logo:R(logo),logoSrc:logo?.getAttribute('src')||'',logoNatural:[logo?.naturalWidth||0,logo?.naturalHeight||0],call:R(call),callRadius:cs.borderTopLeftRadius,utility:R(utility),utilityDisplay:us?.display||'none',hero:R(hero),heroLoaded:Boolean(art?.complete&&art?.naturalWidth>0),heroNatural:[art?.naturalWidth||0,art?.naturalHeight||0],headline:[...document.querySelectorAll('.rh-copy h1 span')].map(x=>(x.textContent||'').trim()),benefitTracks:getComputedStyle(benefits).gridTemplateColumns.split(/\s+/).filter(Boolean).length,ctas,cards,banner:(document.querySelector('.wdccOwnerReviewBanner')?.textContent||'').trim(),overflow:document.documentElement.scrollWidth-innerWidth};
            });
            if(mm.header.h<60||mm.header.h>68||Math.abs(mm.header.y)>2)fail('MOBILE_HEADER_HEIGHT',mm);
            if(mm.logo.w<58||mm.logo.w>66||mm.logo.h<58||mm.logo.h>66||Math.abs(mm.logo.cx-mm.winW/2)>4||mm.logoSrc!=='/wdcc-owner-logo'||mm.logoNatural[0]<20)fail('MOBILE_LOGO',mm);
            if(mm.call.w<40||mm.call.w>44||Math.abs(mm.call.w-mm.call.h)>1||mm.callRadius!=='50%')fail('MOBILE_CALL',mm);
            if(mm.utilityDisplay!=='none'&&(mm.utility?.h||0)>1)fail('MOBILE_UTILITY_VISIBLE',mm);
            if(!mm.heroLoaded||Math.abs(mm.hero.y-mm.header.bottom)>2)fail('MOBILE_HERO',mm);
            if(JSON.stringify(mm.headline)!==JSON.stringify(['BAD CREDIT?','NO CREDIT?',"WE DON'T CARE."]))fail('MOBILE_HEADLINE',mm);
            if(mm.benefitTracks!==4)fail('MOBILE_BENEFITS',mm);
            if(mm.ctas.length!==2||mm.ctas.some(x=>x.w<340)||mm.ctas[1].y<=mm.ctas[0].bottom)fail('MOBILE_CTAS',mm);
            if(!/NOT LIVE/i.test(mm.banner)||mm.cards.length!==5||mm.cards[0].w<100||mm.cards[0].w>135||!mm.cards[2]||mm.cards[2].right>390)fail('MOBILE_FEATURED_THREE_CARD_STRIP',mm);
            if(mm.overflow>2)fail('MOBILE_OVERFLOW',mm);
            result.mobile.home=mm;
            await m.screenshot({path:`${out}/mobile-home.png`,fullPage:true});

            response=await m.goto(`${base}/inventory?owner-review=1&current-board=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
            if(!response||response.status()!==200)fail('MOBILE_INVENTORY_HTTP',{status:response?.status()||0});
            await m.locator('.inventoryGrid').waitFor({state:'visible',timeout:10000});
            const mi=await m.evaluate(()=>({tracks:getComputedStyle(document.querySelector('.inventoryGrid')).gridTemplateColumns.split(/\s+/).filter(Boolean).length,controls:Boolean(document.querySelector('.publicInventoryControls')),banner:(document.querySelector('.wdccOwnerReviewBanner')?.textContent||'').trim(),overflow:document.documentElement.scrollWidth-innerWidth}));
            if(mi.tracks!==1||!mi.controls||! /NOT LIVE/i.test(mi.banner)||mi.overflow>2)fail('MOBILE_INVENTORY',mi);
            result.mobile.inventory=mi;await m.screenshot({path:`${out}/mobile-inventory.png`,fullPage:true});
            await mc.close();

            const dc=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});
            const d=await dc.newPage();watch(d);
            response=await d.goto(`${base}/?owner-review=1&current-board=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
            if(!response||response.status()!==200)fail('DESKTOP_HOME_HTTP',{status:response?.status()||0});
            await skipIntro(d);await d.locator('.rh-grid > article').first().waitFor({state:'visible',timeout:10000});
            const dm=await d.evaluate(()=>{const art=document.querySelector('.rh-hero-art'),utility=document.querySelector('[data-wdcc-public-chrome="utility"]'),grid=document.querySelector('.rh-grid'),logo=document.querySelector('[data-wdcc-public-chrome="header"] img[data-wdcc-logo-art="owner-approved"]');return{heroLoaded:Boolean(art?.complete&&art?.naturalWidth>0),utilityH:utility?.getBoundingClientRect().height||0,logoW:logo?.getBoundingClientRect().width||0,headline:[...document.querySelectorAll('.rh-copy h1 span')].map(x=>(x.textContent||'').trim()),benefitTracks:getComputedStyle(document.querySelector('.rh-benefits')).gridTemplateColumns.split(/\s+/).filter(Boolean).length,gridDisplay:getComputedStyle(grid).display,gridTracks:getComputedStyle(grid).gridTemplateColumns.split(/\s+/).filter(Boolean).length,cards:grid.children.length,overflow:document.documentElement.scrollWidth-innerWidth}});
            if(!dm.heroLoaded||dm.utilityH<20||dm.logoW<60||JSON.stringify(dm.headline)!==JSON.stringify(['BAD CREDIT?','NO CREDIT?',"WE DON'T CARE."])||dm.benefitTracks!==4||dm.gridDisplay!=='grid'||dm.gridTracks!==5||dm.cards!==5||dm.overflow>2)fail('DESKTOP_HOME',dm);
            result.desktop.home=dm;await d.screenshot({path:`${out}/desktop-home.png`,fullPage:true});

            response=await d.goto(`${base}/inventory?owner-review=1&current-board=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
            if(!response||response.status()!==200)fail('DESKTOP_INVENTORY_HTTP',{status:response?.status()||0});
            await d.locator('.inventoryGrid').waitFor({state:'visible',timeout:10000});
            const di=await d.evaluate(()=>({tracks:getComputedStyle(document.querySelector('.inventoryGrid')).gridTemplateColumns.split(/\s+/).filter(Boolean).length,controls:Boolean(document.querySelector('.publicInventoryControls')),overflow:document.documentElement.scrollWidth-innerWidth}));
            if(di.tracks!==3||!di.controls||di.overflow>2)fail('DESKTOP_INVENTORY',di);
            result.desktop.inventory=di;await d.screenshot({path:`${out}/desktop-inventory.png`,fullPage:true});

            const dealer=await dc.newPage();watch(dealer);await wireDealer(dealer);
            for(const spec of [{name:'dashboard',path:'/dealer',selector:'.dealerDashboardLocked'},{name:'inventory',path:'/dealer/inventory',selector:'.inventoryContract'},{name:'editor',path:'/dealer/inventory/new',selector:'.editVehicleApp'}]){
              response=await dealer.goto(`${base}${spec.path}?current-board=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
              if(!response||response.status()!==200)fail(`DEALER_${spec.name.toUpperCase()}_HTTP`,{status:response?.status()||0});
              await dealer.locator(spec.selector).waitFor({state:'visible',timeout:10000});
              if(spec.name==='editor'){const steps=await dealer.locator('.stepper button').count();if(steps!==5)fail('DEALER_EDITOR_STEPS',{steps});result.dealer.editor={steps};const photos=dealer.locator('.stepper button').filter({hasText:/photos/i}).first();if(await photos.count())await photos.click().catch(()=>{});}
              await dealer.screenshot({path:`${out}/dealer-${spec.name}-desktop.png`,fullPage:true});
            }
            await dc.close();
            if(result.writes.length)fail('OWNER_PROOF_WRITE_REQUESTS',result.writes);
            result.pass=true;fs.writeFileSync(`${out}/result.json`,JSON.stringify(result,null,2)+'\n');
            console.log('WDCC_CURRENT_OWNER_APPROVAL_PASS',JSON.stringify({sha,mobileHeader:result.mobile.home.header.h,mobileLogo:result.mobile.home.logo.w,mobileBenefits:result.mobile.home.benefitTracks,mobileCardWidth:result.mobile.home.cards[0].w,desktopCards:result.desktop.home.cards,writes:result.writes.length}));
          } finally {await browser.close()}
          NODE

      - name: Require exact current branch head
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test -n "$current"
          test "$current" = "$GITHUB_SHA"

      - name: Publish owner approval summary
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          echo '### WDCC CURRENT BOARD — OWNER APPROVAL PROOF' >> "$GITHUB_STEP_SUMMARY"
          echo "Exact SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Isolated workers.dev: ${URL:-not-created}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Production routes / aliases / DNS: UNTOUCHED' >> "$GITHUB_STEP_SUMMARY"
          if [ -s current-owner-proof/result.json ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const r=require('./current-owner-proof/result.json');
          console.log(`PASS: ${r.pass}`);
          console.log(`Mobile header: ${r.mobile.home.header.h}px`);
          console.log(`Mobile emblem: ${r.mobile.home.logo.w}px · center ${r.mobile.home.logo.cx}/${r.mobile.home.winW/2}px`);
          console.log(`Mobile benefits: ${r.mobile.home.benefitTracks} across`);
          console.log(`Mobile featured card width: ${r.mobile.home.cards[0].w.toFixed(1)}px`);
          console.log(`Desktop featured cards: ${r.desktop.home.cards}`);
          console.log(`Browser writes: ${r.writes.length}`);
          NODE
          else
            echo 'OWNER_REVIEW_ELIGIBLE: NO' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-current-owner-approval-${{ github.sha }}
          path: |
            current-owner-preview-url.txt
            current-owner-proof/
          if-no-files-found: warn
          retention-days: 7
