name: WDCC VNext Convergence

on:
  push:
    branches:
      - wdcc-vnext-convergence
  workflow_dispatch:

concurrency:
  group: wdcc-vnext-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wdcc-vnext-convergence
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install convergence dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript 7 native typecheck
        run: npm run typecheck
      - name: Next production build
        run: npm run build
      - name: Refresh lockfile on successful build
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh convergence lockfile [skip ci]"
            git push origin HEAD:wdcc-vnext-convergence
          fi
