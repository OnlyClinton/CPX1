name: WDCC 522 Enable Isolated Proof Preview

on:
  push:
    branches: [proof/wdcc-522-immutable-parser-20260829]
    paths:
      - '.github/workflows/wdcc-522-enable-proof-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: wdcc-v2-883f211f345f-proof
    steps:
      - name: Enable workers.dev previews on isolated proof Worker only
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers/$WORKER_NAME"
          curl -fsS -X PATCH "$api" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"subdomain":{"enabled":true,"previews_enabled":true}}' > /tmp/patch.json
          jq -e '.success == true' /tmp/patch.json >/dev/null
          jq -c '{name:(.result.name // null),subdomain:{enabled:(.result.subdomain.enabled // null),previews_enabled:(.result.subdomain.previews_enabled // null),preview_url_suffix:(.result.subdomain.preview_url_suffix // null),url:(.result.subdomain.url // null)},deployed_on:(.result.deployed_on // null)}' /tmp/patch.json
          test "$(jq -r '.result.subdomain.enabled' /tmp/patch.json)" = true
          test "$(jq -r '.result.subdomain.previews_enabled' /tmp/patch.json)" = true
          test "$(jq -r '.result.deployed_on // "null"' /tmp/patch.json)" = null
          echo 'ISOLATED_PROOF_PREVIEWS_ENABLED=YES'
          echo 'PRODUCTION_DEPLOYED=NO'
          echo 'ROUTES_CHANGED=NO'
          echo 'TRAFFIC_CHANGED=NO'
