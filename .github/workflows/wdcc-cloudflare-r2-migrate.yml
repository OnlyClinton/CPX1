name: WDCC Cloudflare R2 Migration

on:
  push:
    branches:
      - release/wdcc-cloudflare-20260827
    paths:
      - .github/workflows/wdcc-cloudflare-r2-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: release/wdcc-cloudflare-20260827

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply Cloudflare R2 migration
        run: python scripts/wdcc-cloudflare-r2-migrate.py

      - name: Validate migration surface
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'WDCC_STATE_PROVIDER.*r2' wrangler.jsonc
          grep -q 'wdcc-platform-prod' wrangler.jsonc
          grep -q 'selectedStateProvider' lib/store.ts
          grep -q 'etagMatches' lib/store.ts
          grep -q 'STATE_R2_NOT_SEEDED' lib/store.ts
          grep -q 'cloudflareDataBucket' app/api/upload/route.ts
          grep -q 'request.formData' app/api/upload/route.ts
          ! grep -q '@vercel/blob/client' app/dealer/inventory/VehicleEditor.tsx
          grep -q 'uploadBody.append("file"' app/dealer/inventory/VehicleEditor.tsx

      - name: Compile migrated application
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Commit isolated Cloudflare migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/cloudflareR2.ts lib/store.ts app/api/upload/route.ts app/api/media/route.ts app/api/health/route.ts app/dealer/inventory/VehicleEditor.tsx wrangler.jsonc
          git diff --cached --check
          git commit -m 'feat(wdcc): move canonical state and media runtime to Cloudflare R2'
          git push origin HEAD:release/wdcc-cloudflare-20260827
