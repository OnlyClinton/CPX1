name: WDCC P0 App Postdeploy Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/wdcc-p0-app-postdeploy-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: https://wdcc-proof-04c5d526.clico-global.workers.dev
    steps:
      - name: Probe isolated app without mutation
        shell: bash
        run: |
          set -u
          probe_get(){
            label="$1"; url="$2"; body="/tmp/${label}.body"; headers="/tmp/${label}.headers"
            code="$(curl --http1.1 --max-time 20 -sS -D "$headers" -o "$body" -w '%{http_code}' "$url" || true)"
            echo "${label}_HTTP=$code"
            echo "--- ${label} headers ---"
            sed -n '1,20p' "$headers" || true
            echo "--- ${label} body ---"
            head -c 3000 "$body" || true
            echo
          }
          probe_get health "$APP_URL/api/health?p0=postdeploy-diagnostic-$GITHUB_RUN_ID"
          probe_get dealer_login "$APP_URL/dealer/login?p0=postdeploy-diagnostic-$GITHUB_RUN_ID"
          probe_get dealer_new "$APP_URL/dealer/inventory/new?p0=postdeploy-diagnostic-$GITHUB_RUN_ID"
          invalid_body=/tmp/invalid_login.body
          invalid_headers=/tmp/invalid_login.headers
          invalid_code="$(curl --http1.1 --max-time 20 -sS -D "$invalid_headers" -o "$invalid_body" -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"username":"dealer","password":"__wdcc_invalid_probe__"}' "$APP_URL/api/auth/login" || true)"
          echo "invalid_login_HTTP=$invalid_code"
          echo '--- invalid_login headers ---'
          sed -n '1,20p' "$invalid_headers" || true
          echo '--- invalid_login body ---'
          head -c 3000 "$invalid_body" || true
          echo
          echo 'DIAGNOSTIC_ONLY=PASS'
