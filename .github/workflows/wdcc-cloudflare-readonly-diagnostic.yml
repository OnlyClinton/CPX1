name: WDCC Cloudflare Readonly Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-cloudflare-readonly-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CUSTOMER_DOMAIN: wedontcarecars.com
      DEALER_DOMAIN: dealer.wedontcarecars.com
      LIVE_WORKER: wdcc-dealer-frontdoor
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_API_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WDCC_DEALER_E2E_PASSWORD: ${{ secrets.WDCC_DEALER_E2E_PASSWORD }}
    steps:
      - name: Read-only staged preflight
        shell: bash
        run: |
          set -u
          fail=0
          present(){ test -n "${!1:-}" && echo "$1=PRESENT" || { echo "$1=MISSING"; fail=1; }; }
          present CLOUDFLARE_API_TOKEN
          present CLOUDFLARE_ZONE_API_TOKEN
          present CLOUDFLARE_ACCOUNT_ID
          present WDCC_DEALER_E2E_PASSWORD

          api(){
            label="$1" token="$2" url="$3" out="$4"
            code="$(curl -sS -o "$out" -w '%{http_code}' -H "Authorization: Bearer $token" "$url" || true)"
            echo "$label HTTP=$code"
            jq -c '{success:(.success//false),errors:[(.errors//[])[]|{code,message}]}' "$out" 2>/dev/null || echo "$label RESPONSE=non-json"
            test "$code" = 200 && jq -e '.success==true' "$out" >/dev/null 2>&1 || fail=1
          }

          echo 'STAGE=worker-token-verify'
          api worker_token "$CLOUDFLARE_API_TOKEN" 'https://api.cloudflare.com/client/v4/user/tokens/verify' /tmp/worker.json

          echo 'STAGE=zone-token-verify'
          api zone_token "$CLOUDFLARE_ZONE_API_TOKEN" 'https://api.cloudflare.com/client/v4/user/tokens/verify' /tmp/zone-token.json

          echo 'STAGE=zone-token-zone-lookup'
          api zone_lookup "$CLOUDFLARE_ZONE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=$CUSTOMER_DOMAIN&account.id=$CLOUDFLARE_ACCOUNT_ID&per_page=50" /tmp/zones.json
          ZONE_ID="$(jq -r '.result[0].id // empty' /tmp/zones.json 2>/dev/null)"
          echo "zone_token_matches=$(jq -r '.result|length // 0' /tmp/zones.json 2>/dev/null || echo 0)"

          echo 'STAGE=worker-token-zone-lookup'
          api worker_zone_lookup "$CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=$CUSTOMER_DOMAIN&account.id=$CLOUDFLARE_ACCOUNT_ID&per_page=50" /tmp/worker-zones.json
          WORKER_ZONE_ID="$(jq -r '.result[0].id // empty' /tmp/worker-zones.json 2>/dev/null)"
          echo "worker_token_matches=$(jq -r '.result|length // 0' /tmp/worker-zones.json 2>/dev/null || echo 0)"

          if [ -n "$WORKER_ZONE_ID" ]; then
            echo 'STAGE=worker-token-dns-record-read'
            api worker_dns_read "$CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$WORKER_ZONE_ID/dns_records?name=$DEALER_DOMAIN&per_page=100" /tmp/worker-dns.json
            jq -c --arg n "$DEALER_DOMAIN" '[.result[]? | select(.name==$n) | {type,name,content,proxied}]' /tmp/worker-dns.json 2>/dev/null || true

            echo 'STAGE=worker-token-dnssec-read'
            api worker_dnssec_read "$CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$WORKER_ZONE_ID/dnssec" /tmp/worker-dnssec.json
            jq -c '{status:(.result.status//null),key_tag:(.result.key_tag//null),algorithm:(.result.algorithm//null),digest_type:(.result.digest_type//null)}' /tmp/worker-dnssec.json 2>/dev/null || true
          else
            echo 'WORKER_ZONE_ID=UNRESOLVED'
          fi

          echo 'STAGE=worker-route-read'
          api worker_routes "$CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$LIVE_WORKER/routes" /tmp/routes.json
          jq -c --arg d "$DEALER_DOMAIN/*" '[.result[]? | select(.pattern==$d) | {id,pattern,script}]' /tmp/routes.json 2>/dev/null || true

          echo "READONLY_DIAGNOSTIC_FAIL=$fail"
          exit "$fail"
