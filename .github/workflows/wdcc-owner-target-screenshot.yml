name: WDCC Owner Exact Page Matrix

on:
  push:
    branches: [fix/wdcc-locked-contract-20260826]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-owner-exact-page-matrix-${{ github.sha }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      URL: https://wiva-${{ github.sha }}.clico-global.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Wait for exact immutable preview
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for exact SHA preview: $URL"
          for i in $(seq 1 120); do
            code="$(curl --http1.1 -sS -L -o /tmp/home.html -w '%{http_code}' "$URL/?owner-review=1&wait=$i" || true)"
            if [ "$code" = 200 ] && grep -Eqi "we don.?t care" /tmp/home.html; then exit 0; fi
            sleep 2
          done
          echo "Exact preview did not become ready: $URL" >&2
          exit 1

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Capture canonical exact-head page matrix
        shell: bash
        run: |
          set -euo pipefail
          node .github/support/wdcc-owner-board-rebuild-proof.mjs
          test -s owner-board-proof/result.json
          node -e "const r=require('./owner-board-proof/result.json');if(!r.pass||r.writes.length)process.exit(1)"

      - name: Publish owner matrix summary
        if: always()
        shell: bash
        run: |
          echo '### WDCC owner exact page matrix' >> "$GITHUB_STEP_SUMMARY"
          echo "Exact SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: $URL/?owner-review=1" >> "$GITHUB_STEP_SUMMARY"
          if [ -s owner-board-proof/result.json ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const r=require('./owner-board-proof/result.json');
          console.log(`PASS: ${r.pass}`);
          console.log(`Board surfaces: ${Object.keys(r.boards||{}).length}`);
          console.log(`Browser writes: ${(r.writes||[]).length}`);
          console.log('Contract: round persistent header · mobile featured snap · 3-column desktop inventory · single-column mobile dealer editor · pointer-safe controls');
          NODE
          else
            echo 'OWNER_MATRIX_ELIGIBLE: NO' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-owner-exact-page-matrix-${{ github.sha }}
          path: owner-board-proof/
          if-no-files-found: warn
          retention-days: 7
