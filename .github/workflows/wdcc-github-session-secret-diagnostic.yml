name: WDCC GitHub Session Secret Diagnostic

on:
  push:
    branches: [diagnostic/wdcc-session-authority-20260827]
    paths:
      - '.github/workflows/wdcc-github-session-secret-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      C1: ${{ secrets.SESSION_SECRET }}
      C2: ${{ secrets.WDCC_SESSION_SECRET }}
      C3: ${{ secrets.WDCC_AUTH_SECRET }}
      C4: ${{ secrets.AUTH_SECRET }}
      C5: ${{ secrets.BETTER_AUTH_SECRET }}
      C6: ${{ secrets.NEXTAUTH_SECRET }}
      C7: ${{ secrets.WDCC_P0_SESSION_SECRET }}
      C8: ${{ secrets.WDCC_DEALER_SESSION_SECRET }}
    steps:
      - name: Report candidate presence and length only
        shell: bash
        run: |
          set -euo pipefail
          names=(SESSION_SECRET WDCC_SESSION_SECRET WDCC_AUTH_SECRET AUTH_SECRET BETTER_AUTH_SECRET NEXTAUTH_SECRET WDCC_P0_SESSION_SECRET WDCC_DEALER_SESSION_SECRET)
          for i in $(seq 1 8); do
            key="C$i"; value="${!key:-}"; present=false; [ -n "$value" ] && present=true
            printf '%s present=%s length=%s\n' "${names[$((i-1))]}" "$present" "${#value}"
          done
          echo 'No secret values were printed or uploaded.' >> "$GITHUB_STEP_SUMMARY"
