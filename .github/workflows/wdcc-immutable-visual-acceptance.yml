name: WDCC Immutable Visual Acceptance

on:
  push:
    branches:
      - fix/wdcc-locked-contract-20260826
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-immutable-visual-acceptance
  cancel-in-progress: true

jobs:
  visual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate controlling visual source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -s public/wdcc-hero-v2.webp
          test -s public/wdcc-official-logo.webp
          test -s app/LockedIntro.tsx
          test -s app/ReferenceCloneHome.tsx
          test -s app/owner-device-final.css
          grep -q 'href="/get-approved" aria-label="GET PRE-APPROVED">GET PRE-APPROVED<' app/ReferenceCloneHome.tsx
          grep -q 'href="/inventory" aria-label="BROWSE INVENTORY">BROWSE INVENTORY<' app/ReferenceCloneHome.tsx
          grep -q 'owner-device-final.css' app/layout.tsx
          ! grep -q 'li-dock' app/LockedIntro.tsx

      - name: Build exact Cloudflare candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0 playwright@1.55.0
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets
          npx playwright install --with-deps chromium >/dev/null

      - name: Create SHA-specific no-route worker
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          cfg.name=`wdcc-proof-${process.env.GITHUB_SHA}`;
          cfg.workers_dev=true;
          cfg.preview_urls=true;
          delete cfg.route;
          delete cfg.routes;
          fs.writeFileSync('wrangler.immutable-visual.jsonc',JSON.stringify(cfg,null,2)+'\n');
          NODE
          ! grep -qi 'wedontcarecars.com' wrangler.immutable-visual.jsonc
          grep -q "$GITHUB_SHA" wrangler.immutable-visual.jsonc

      - name: Deploy immutable isolated preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.immutable-visual.jsonc 2>&1 | tee /tmp/wdcc-immutable-visual.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wdcc-immutable-visual.log | tail -1)"
          test -n "$url"
          case "$url" in *"$GITHUB_SHA"*) ;; *) echo "Preview is not SHA-specific: $url" >&2; exit 1;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > immutable-preview-url.txt

      - name: Prove storefront and dealer visual contract
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p immutable-visual-proof
          node - <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');

          const base=process.env.URL;
          if(!base) throw Error('IMMUTABLE_PREVIEW_URL_MISSING');
          const proof={
            sha:process.env.GITHUB_SHA,
            url:base,
            provider:{status:0,ok:false,itemCount:0,customerVisibleCount:0,mode:'unknown'},
            storefront:{},dealer:{},writeRequests:[]
          };
          const customerVisible=v=>String(v?.status||'').toLowerCase()==='published'&&v?.internalOnly!==true&&!['internal','dealer_only'].includes(String(v?.visibility||'').toLowerCase())&&!/^(R36TEST|WDCC[-_]QA|QA|TEST)[-_]/i.test(String(v?.stock||''));

          (async()=>{
            let inventoryJson={items:[]},items=[];
            try{
              const r=await fetch(`${base}/api/inventory?visual-provider=${Date.now()}`);
              proof.provider.status=r.status;
              inventoryJson=await r.json().catch(()=>({items:[]}));
              items=Array.isArray(inventoryJson.items)?inventoryJson.items:Array.isArray(inventoryJson.inventory)?inventoryJson.inventory:[];
              proof.provider.ok=r.ok;
              proof.provider.itemCount=items.length;
              proof.provider.customerVisibleCount=items.filter(customerVisible).length;
              proof.provider.mode=r.ok?(items.length?'available':'available-empty'):'blocked';
            }catch(e){
              proof.provider.mode='blocked';
              proof.provider.error=String(e?.message||e);
            }

            const browser=await chromium.launch({headless:true});
            const watchWrites=page=>page.on('request',r=>{if(['POST','PUT','PATCH','DELETE'].includes(r.method()))proof.writeRequests.push({method:r.method(),url:r.url()})});
            const finishIntro=async page=>{
              const intro=page.locator('.li');
              if(await intro.count()){
                await page.getByRole('button',{name:/skip intro/i}).click({timeout:1800}).catch(()=>{});
                await intro.waitFor({state:'detached',timeout:5000}).catch(()=>{});
              }
              await page.locator('.rh-header').waitFor({state:'visible',timeout:8000});
            };
            const waitInventorySettled=async page=>{
              await page.waitForFunction(()=>{
                const cards=document.querySelectorAll('.rh-card').length;
                const state=document.querySelector('.rh-inventory-state');
                return cards>0 || (state && !/loading/i.test(state.textContent||''));
              },null,{timeout:10000});
            };
            const checkCtas=async page=>{
              const a=page.locator('.rh-hero-actions a.rh-btn');
              if(await a.count()!==2)throw Error('HERO_CTA_COUNT');
              const data=await a.evaluateAll(nodes=>nodes.map(n=>{const r=n.getBoundingClientRect();return{text:(n.textContent||'').trim(),aria:n.getAttribute('aria-label'),path:new URL(n.href).pathname,left:r.left,top:r.top,right:r.right,bottom:r.bottom,width:r.width}}));
              if(data[0].text!=='GET PRE-APPROVED'||data[0].aria!=='GET PRE-APPROVED'||data[0].path!=='/get-approved')throw Error(`PRIMARY_CTA_BAD ${JSON.stringify(data[0])}`);
              if(data[1].text!=='BROWSE INVENTORY'||data[1].aria!=='BROWSE INVENTORY'||data[1].path!=='/inventory')throw Error(`SECONDARY_CTA_BAD ${JSON.stringify(data[1])}`);
              return data;
            };
            const checkInventoryUi=async(page,mobile)=>{
              await waitInventorySettled(page);
              const cards=page.locator('.rh-grid .rh-card');
              const count=await cards.count();
              const state=page.locator('.rh-inventory-state');
              if(!proof.provider.ok){
                if(count!==0)throw Error(`PROVIDER_BLOCKED_BUT_CARDS_RENDERED_${count}`);
                await state.waitFor({state:'visible',timeout:5000});
                const text=(await state.innerText()).toLowerCase();
                if(!text.includes('temporarily unavailable')||!text.includes('not substituting demo vehicles'))throw Error(`INVENTORY_FALLBACK_BAD ${text}`);
                return {mode:'provider-fallback',cards:0,text};
              }
              if(count===0){
                await state.waitFor({state:'visible',timeout:5000});
                return {mode:'available-empty',cards:0,text:await state.innerText()};
              }
              if(mobile&&count>=2){
                const grid=page.locator('.rh-grid');
                const before=await grid.evaluate(el=>el.scrollLeft);
                await grid.evaluate(el=>el.scrollBy({left:Math.max(220,el.clientWidth*.85),behavior:'instant'}));
                await page.waitForTimeout(250);
                const after=await grid.evaluate(el=>el.scrollLeft);
                if(after<=before+20)throw Error(`MOBILE_CAROUSEL_DID_NOT_ADVANCE ${before}->${after}`);
                return {mode:'live-carousel',cards:count,before,after};
              }
              if(!mobile){
                const grid=page.locator('.rh-grid');
                const geom=await grid.evaluate(el=>{const s=getComputedStyle(el);return{display:s.display,tracks:s.gridTemplateColumns.split(/\s+/).filter(Boolean)}});
                if(geom.display!=='grid'||geom.tracks.length!==3)throw Error(`DESKTOP_GRID_BAD ${JSON.stringify(geom)}`);
                return {mode:'live-grid',cards:count,...geom};
              }
              return {mode:'single-live-card',cards:count};
            };

            try{
              const mobileCtx=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
              const m=await mobileCtx.newPage(); watchWrites(m);
              await m.goto(`${base}/?visual-mobile=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
              const intro=m.locator('.li');
              if(await intro.count()){
                await m.locator('.li-badge img').waitFor({state:'visible',timeout:6000});
                const staticIntro=await m.evaluate(()=>{const b=document.querySelector('.li-badge img'),s=document.querySelector('.li-scene img');const bs=getComputedStyle(b),ss=getComputedStyle(s),br=b.getBoundingClientRect();return{badgeW:br.width,badgeAnimation:bs.animationName,badgeTransform:bs.transform,sceneAnimation:ss.animationName,sceneTransform:ss.transform}});
                if(staticIntro.badgeW<145||staticIntro.badgeAnimation!=='none'||staticIntro.sceneAnimation!=='none'||staticIntro.badgeTransform!=='none'||staticIntro.sceneTransform!=='none')throw Error(`INTRO_NOT_STATIC ${JSON.stringify(staticIntro)}`);
                proof.storefront.mobileIntro=staticIntro;
                await m.screenshot({path:'immutable-visual-proof/mobile-intro.png'});
              }
              await finishIntro(m);
              await m.evaluate(()=>scrollTo(0,0)); await m.waitForTimeout(120);
              const mobileGeom=await m.evaluate(()=>{
                const u=document.querySelector('.rh-utility').getBoundingClientRect(),h=document.querySelector('.rh-header').getBoundingClientRect(),hero=document.querySelector('.rh-hero').getBoundingClientRect(),logo=document.querySelector('.rh-logo img').getBoundingClientRect(),call=document.querySelector('.rh-call').getBoundingClientRect(),cs=getComputedStyle(document.querySelector('.rh-call')),benefits=getComputedStyle(document.querySelector('.rh-benefits'));
                return{docW:document.documentElement.scrollWidth,winW:innerWidth,uTop:u.top,uH:u.height,hTop:h.top,hBottom:h.bottom,heroTop:hero.top,logoW:logo.width,callW:call.width,callH:call.height,callRadius:cs.borderTopLeftRadius,benefitTracks:benefits.gridTemplateColumns.split(/\s+/).filter(Boolean).length};
              });
              if(mobileGeom.docW>mobileGeom.winW+1)throw Error(`MOBILE_HORIZONTAL_OVERFLOW ${JSON.stringify(mobileGeom)}`);
              if(Math.abs(mobileGeom.uTop)>2||Math.abs(mobileGeom.hTop-mobileGeom.uH)>3||Math.abs(mobileGeom.heroTop-mobileGeom.hBottom)>3)throw Error(`MOBILE_HEADER_HERO_GAP ${JSON.stringify(mobileGeom)}`);
              if(mobileGeom.logoW<70||Math.abs(mobileGeom.callW-mobileGeom.callH)>2||mobileGeom.callW<42||mobileGeom.benefitTracks!==2)throw Error(`MOBILE_GEOMETRY_BAD ${JSON.stringify(mobileGeom)}`);
              const mobileCtas=await checkCtas(m);
              if(mobileCtas[1].top<=mobileCtas[0].bottom)throw Error('MOBILE_CTAS_NOT_STACKED');
              if(mobileCtas.some(x=>x.width<330))throw Error(`MOBILE_CTAS_NOT_FULL_WIDTH ${JSON.stringify(mobileCtas)}`);
              const finance=await m.locator('.rh-finance .rh-step').evaluateAll(nodes=>nodes.map(n=>({client:n.clientWidth,scroll:n.scrollWidth,text:(n.textContent||'').trim()})));
              if(finance.some(x=>x.scroll>x.client+2))throw Error(`MOBILE_FINANCE_OVERFLOW ${JSON.stringify(finance)}`);
              const menu=m.locator('.rh-menu'); await menu.click();
              const nav=m.locator('.rh-nav.open'); await nav.waitFor({state:'visible',timeout:3000});
              const navLinks=await nav.locator('a').count(); if(navLinks<3)throw Error(`MOBILE_NAV_INCOMPLETE_${navLinks}`); await menu.click();
              const mobileInventory=await checkInventoryUi(m,true);
              await m.screenshot({path:'immutable-visual-proof/mobile-storefront.png',fullPage:true});
              proof.storefront.mobile={geometry:mobileGeom,ctas:mobileCtas,navLinks,inventory:mobileInventory};
              await mobileCtx.close();

              const desktopCtx=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});
              const d=await desktopCtx.newPage(); watchWrites(d);
              await d.goto(`${base}/?visual-desktop=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000}); await finishIntro(d);
              const desktopGeom=await d.evaluate(()=>{const menu=getComputedStyle(document.querySelector('.rh-menu')).display,logo=document.querySelector('.rh-logo img').getBoundingClientRect(),u=document.querySelector('.rh-utility').getBoundingClientRect(),h=document.querySelector('.rh-header').getBoundingClientRect(),hero=document.querySelector('.rh-hero').getBoundingClientRect();return{menu,logoW:logo.width,docW:document.documentElement.scrollWidth,winW:innerWidth,uTop:u.top,uH:u.height,hTop:h.top,hBottom:h.bottom,heroTop:hero.top}});
              if(desktopGeom.menu!=='none'||desktopGeom.logoW<80||desktopGeom.docW>desktopGeom.winW+1)throw Error(`DESKTOP_CHROME_BAD ${JSON.stringify(desktopGeom)}`);
              const desktopCtas=await checkCtas(d);
              const desktopInventory=await checkInventoryUi(d,false);
              await d.screenshot({path:'immutable-visual-proof/desktop-storefront.png',fullPage:true});
              proof.storefront.desktop={geometry:desktopGeom,ctas:desktopCtas,inventory:desktopInventory};

              const sessionBody=JSON.stringify({authenticated:true,name:'WDCC Visual QA',role:'dealer_agent',tenantId:'wdcc',user:{id:'visual-only',displayName:'WDCC Visual QA',role:'dealer_agent',tenantId:'wdcc'}});
              const dealerItems=proof.provider.ok?items:[];
              const dashBody=JSON.stringify({summary:{soldThisWeek:0,newToday:0,appointments:0,applications:0,messages:0},inventory:dealerItems,leads:[]});
              async function wireDealer(page){
                watchWrites(page);
                await page.route('**/api/auth/session**',r=>r.fulfill({status:200,contentType:'application/json',body:sessionBody}));
                await page.route('**/api/crm/dashboard**',r=>r.fulfill({status:200,contentType:'application/json',body:dashBody}));
                await page.route('**/api/inventory**',r=>{
                  const req=r.request(),u=new URL(req.url());
                  if(req.method()!=='GET')return r.abort();
                  if(u.pathname==='/api/inventory')return r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,items:dealerItems})});
                  const id=decodeURIComponent(u.pathname.slice('/api/inventory/'.length));
                  const item=dealerItems.find(v=>String(v.id)===id);
                  return item?r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,item})}):r.fulfill({status:404,contentType:'application/json',body:'{"ok":false,"error":"NOT_FOUND"}'});
                });
              }
              const capture=async(page,path,selector,name,full=true)=>{await page.goto(`${base}${path}${path.includes('?')?'&':'?'}visual=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});await page.locator(selector).waitFor({state:'visible',timeout:10000});await page.screenshot({path:`immutable-visual-proof/${name}.png`,fullPage:full});};

              const dealer=await desktopCtx.newPage(); await wireDealer(dealer);
              await capture(dealer,'/dealer','.dealerDashboardLocked','dealer-dashboard-desktop');
              const dashVisual=await dealer.evaluate(()=>{const title=document.querySelector('.dcTitle h1'),logo=document.querySelector('.dcTop .brand img'),ts=getComputedStyle(title),ls=getComputedStyle(logo),lr=logo.getBoundingClientRect();return{titleColor:ts.color,logoDisplay:ls.display,logoW:lr.width,logoH:lr.height,naturalW:logo.naturalWidth,naturalH:logo.naturalHeight}});
              if(dashVisual.logoDisplay==='none'||dashVisual.logoW<48||dashVisual.naturalW<1||/rgb\(255, 255, 255\)/.test(dashVisual.titleColor))throw Error(`DEALER_DASHBOARD_VISUAL_BAD ${JSON.stringify(dashVisual)}`);
              await capture(dealer,'/dealer/inventory','.inventoryContract','dealer-inventory-desktop');
              await capture(dealer,'/dealer/inventory/import','.dcDrop','dealer-import-desktop');
              await dealer.goto(`${base}/dealer/inventory/new?visual=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
              await dealer.locator('.editVehicleApp').waitFor({state:'visible',timeout:10000});
              await dealer.screenshot({path:'immutable-visual-proof/dealer-editor-desktop.png',fullPage:true});
              const photos=dealer.locator('.sectionBlock').filter({hasText:'Photos'}).first(); if(await photos.count())await photos.screenshot({path:'immutable-visual-proof/dealer-photos-desktop.png'});
              const readiness=dealer.locator('.readinessCard').first(); if(await readiness.count())await readiness.screenshot({path:'immutable-visual-proof/dealer-readiness-desktop.png'});
              const previewButton=dealer.getByRole('button',{name:/^preview$/i}).last(); await previewButton.scrollIntoViewIfNeeded(); await previewButton.click({timeout:5000});
              await dealer.locator('.previewModal').waitFor({state:'visible',timeout:5000}); await dealer.locator('.previewModal').screenshot({path:'immutable-visual-proof/dealer-preview-desktop.png'});
              proof.dealer.desktop={dashboard:dashVisual,inventoryMode:proof.provider.ok?'canonical-readonly':'empty-provider-fallback',preview:'normal-click-pass'};
              await desktopCtx.close();

              const dealerMobileCtx=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
              const dm=await dealerMobileCtx.newPage(); await wireDealer(dm);
              await capture(dm,'/dealer','.dealerDashboardLocked','dealer-dashboard-mobile');
              await capture(dm,'/dealer/inventory','.inventoryContract','dealer-inventory-mobile');
              await capture(dm,'/dealer/inventory/import','.dcDrop','dealer-import-mobile');
              await dm.goto(`${base}/dealer/inventory/new?visual-mobile=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000}); await dm.locator('.editVehicleApp').waitFor({state:'visible',timeout:10000});
              await dm.screenshot({path:'immutable-visual-proof/dealer-editor-mobile.png',fullPage:true});
              const mobilePreview=dm.getByRole('button',{name:/^preview$/i}).last(); await mobilePreview.scrollIntoViewIfNeeded(); await mobilePreview.click({timeout:5000}); await dm.locator('.previewModal').waitFor({state:'visible',timeout:5000}); await dm.locator('.previewModal').screenshot({path:'immutable-visual-proof/dealer-preview-mobile.png'});
              proof.dealer.mobile={inventoryMode:proof.provider.ok?'canonical-readonly':'empty-provider-fallback',preview:'normal-click-pass'};
              await dealerMobileCtx.close();
            }finally{await browser.close();}

            if(proof.writeRequests.length)throw Error(`VISUAL_PROOF_WRITE_REQUEST ${JSON.stringify(proof.writeRequests)}`);
            fs.writeFileSync('immutable-visual-proof/metrics.json',JSON.stringify(proof,null,2)+'\n');
          })().catch(e=>{console.error(e);try{fs.writeFileSync('immutable-visual-proof/failure.txt',String(e?.stack||e)+'\n')}catch{}process.exit(1)});
          NODE

      - name: Publish visual acceptance summary
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          echo '### WDCC immutable visual acceptance' >> "$GITHUB_STEP_SUMMARY"
          echo "Exact SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Immutable preview: ${URL:-not-created}" >> "$GITHUB_STEP_SUMMARY"
          if [ -s immutable-visual-proof/metrics.json ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const p=require('./immutable-visual-proof/metrics.json');
          console.log(`Canonical inventory probe: HTTP ${p.provider.status||0} · ${p.provider.mode}`);
          console.log(p.provider.ok?'Live inventory UI was verified against canonical read-only data.':'Canonical inventory is provider-blocked; the honest no-demo storefront fallback and empty dealer visual shell were verified instead.');
          console.log(`Browser write requests: ${p.writeRequests.length}`);
          NODE
          fi
          echo 'This visual gate never authorizes merge or production promotion; owner approval and the separate functional/provider gate remain required.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-immutable-visual-${{ github.sha }}
          path: |
            immutable-preview-url.txt
            immutable-visual-proof/
          if-no-files-found: warn
          retention-days: 7
