name: WDCC PR586 Exact Head Proof

on:
  push:
    branches:
      - proof/wdcc-586-build-00e6eaeb

permissions:
  contents: read

jobs:
  exact-head-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: 00e6eaebb370ac2865fcab23c00bb77c6f0df9ee
      WDCC_RUNTIME_ROLE: canonical
      SESSION_SECRET: visual-proof-only-00e6eaebb370ac2865fcab23c00bb77c6f0df9ee-0123456789
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify immutable candidate
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install locked dependencies
        run: npm ci
      - name: Build exact candidate
        run: npm run build
      - name: Verify recovery and canonical-auth routes are emitted
        shell: bash
        run: |
          set -euo pipefail
          test -d .next
          grep -Rqs 'request-password-reset' app lib
          grep -Rqs 'reset-password' app lib
          grep -Rqs 'change-password' app lib
          grep -Rqs 'sign-in/email' app lib
          ! grep -Rqs 'RESEND_API_KEY' app lib
          ! grep -Rqs 'WDCC_PASSWORD_RESET_FROM' app lib
          echo "WDCC_PR586_EXACT_HEAD_BUILD=PASS sha=$CANDIDATE_SHA"
      - name: Install isolated browser tooling
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium
      - name: Start isolated exact candidate
        shell: bash
        run: |
          set -euo pipefail
          npm start -- -p 3100 > /tmp/wdcc-pr586-next.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wdcc-pr586-next.log >&2
          exit 1
      - name: Capture owner-visible changed surfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof/desktop proof/mobile
          cat > capture.cjs <<'NODE'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const base='http://127.0.0.1:3100';
          const dealer={authenticated:true,user:{id:'visual-proof-dealer',displayName:'Sean · Sales Manager',username:'bigpussy',role:'dealer',tenantId:'wdcc',mustChangePassword:false},session:{role:'dealer',tenantId:'wdcc',mustChangePassword:false}};
          async function shot(browser,dir,name,path,{session=null}={}){
            const viewport=dir==='desktop'?{width:1440,height:1000}:{width:390,height:844};
            const context=await browser.newContext({viewport,deviceScaleFactor:1});
            const page=await context.newPage();
            await page.route('**/api/auth/session',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(session||{authenticated:false,user:null,session:null})}));
            await page.goto(base+path,{waitUntil:'domcontentloaded',timeout:15000});
            await page.waitForTimeout(800);
            await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important}'}).catch(()=>{});
            const cdp=await context.newCDPSession(page);
            const result=await cdp.send('Page.captureScreenshot',{format:'png',fromSurface:true,captureBeyondViewport:false});
            fs.writeFileSync(`proof/${dir}/${name}.png`,Buffer.from(result.data,'base64'));
            await cdp.detach();
            await context.close();
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const dir of ['desktop','mobile']){
              await shot(browser,dir,'01-login','/login');
              await shot(browser,dir,'02-forgot-password','/forgot-password');
              await shot(browser,dir,'03-reset-password','/reset-password?token=visual-proof-token-abcdefghijklmnopqrstuvwxyz0123456789');
              await shot(browser,dir,'04-change-password','/change-password',{session:dealer});
              await shot(browser,dir,'05-dealer-entry','/dealer');
              await shot(browser,dir,'06-admin-entry','/admin');
            }
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
          node capture.cjs
          rm capture.cjs
          test "$(find proof -type f -name '*.png' | wc -l)" -eq 12
          sha256sum proof/desktop/*.png proof/mobile/*.png > proof/SHA256SUMS.txt
          printf 'candidate=%s\nrender_mode=isolated-local-cdp\nauth_state=mocked-for-visual-only\nproduction_writes=none\nscope=PR586 owner-visible changed surfaces\n' "$CANDIDATE_SHA" > proof/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WDCC-PR586-owner-visible-exact-head-00e6eaeb
          path: proof/
          if-no-files-found: error
          retention-days: 14
