name: WDCC Canonical Owner Board Rebuild Proof

on:
  push:
    branches:
      - fix/wdcc-locked-contract-20260826
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-owner-board-${{ github.sha }}
  cancel-in-progress: false

jobs:
  owner-board-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Lock canonical owner-board source
        shell: bash
        run: |
          set -euo pipefail
          test -s app/wdcc-owner-board-final.css
          grep -Fq 'wdcc-owner-board-final.css' app/layout.tsx
          ! grep -Fq 'wdcc-system-v2.css' app/layout.tsx
          ! grep -Fq 'wdcc-owner-screenshot-correction.css' app/layout.tsx
          ! grep -Fq 'wdcc-public-owner-render-fix.css' app/layout.tsx
          grep -Fq 'wdcc-wordmark' app/WdccPublicChrome.tsx
          grep -Fq 'grid-template-columns:repeat(5,minmax(0,1fr))!important' app/wdcc-owner-board-final.css
          grep -Fq 'grid-template-columns:repeat(3,minmax(0,1fr))!important' app/wdcc-owner-board-final.css
          grep -Fq 'flex:0 0 clamp(108px,29.5vw,124px)!important' app/wdcc-owner-board-final.css
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Build exact Cloudflare candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0 playwright@1.55.0
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets
          npx playwright install --with-deps chromium >/dev/null

      - name: Create isolated exact-SHA Worker
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          cfg.name=`wob-${process.env.GITHUB_SHA}`;
          cfg.workers_dev=true;
          cfg.preview_urls=true;
          delete cfg.route;
          delete cfg.routes;
          fs.writeFileSync('wrangler.owner-board.jsonc',JSON.stringify(cfg,null,2)+'\n');
          NODE
          ! grep -qi 'wedontcarecars.com' wrangler.owner-board.jsonc

      - name: Deploy isolated exact-SHA preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.owner-board.jsonc 2>&1 | tee /tmp/wob.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wob.log | tail -1)"
          test -n "$url"
          case "$url" in *"$GITHUB_SHA"*) ;; *) echo "Not exact SHA: $url" >&2; exit 1;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > owner-board-preview-url.txt

      - name: Prove owner boards in browser
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p owner-board-proof
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {chromium} from 'playwright';
          const base=process.env.URL;
          const out='owner-board-proof';
          const browser=await chromium.launch({headless:true});
          const writes=[];
          const watch=p=>p.on('request',r=>{if(['POST','PUT','PATCH','DELETE'].includes(r.method()))writes.push({method:r.method(),url:r.url()})});
          const R=e=>{const r=e?.getBoundingClientRect();return r?{x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom}:null};
          const vehicles=[
            {id:'real-2004-nissan-350z',year:2020,make:'Dodge',model:'Challenger',trim:'SXT',price:24995,downPayment:2000,mileage:41000,stock:'DGC2020SXT',status:'published',visibility:'public',transmission:'Automatic',drivetrain:'RWD',description:'Clean title. Runs and drives great.',primary_image_url:'/wdcc-review-media/nissan350z'},
            {id:'real-2016-ford-f150-limited',year:2019,make:'Dodge',model:'Charger',trim:'R/T',price:21995,downPayment:1500,mileage:53000,stock:'DCR2019RT',status:'published',visibility:'public',transmission:'Automatic',drivetrain:'RWD',description:'Dealer vehicle.',primary_image_url:'/wdcc-review-media/fordF150'},
            {id:'real-2019-honda-pilot',year:2018,make:'Chevrolet',model:'Camaro',trim:'LT',price:20995,downPayment:1500,mileage:38000,stock:'CCLT2018',status:'published',visibility:'public',transmission:'Automatic',drivetrain:'RWD',description:'Dealer vehicle.',primary_image_url:'/wdcc-review-media/hondaPilot'},
            {id:'real-2019-kia-sportage',year:2020,make:'Jeep',model:'Grand Cherokee',trim:'Laredo',price:23995,downPayment:2000,mileage:60000,stock:'JGCL2020',status:'draft',visibility:'public',transmission:'Automatic',drivetrain:'4WD',description:'Dealer vehicle.',primary_image_url:'/wdcc-review-media/kiaSportage'},
            {id:'real-2019-toyota-rav4',year:2018,make:'Ford',model:'F-150',trim:'XLT',price:22995,downPayment:2000,mileage:71000,stock:'FF150XLT2018',status:'published',visibility:'public',transmission:'Automatic',drivetrain:'4WD',description:'Dealer vehicle.',primary_image_url:'/wdcc-review-media/toyotaRav4'}
          ];
          const session={authenticated:true,name:'Sean',role:'dealer_agent',tenantId:'wdcc',user:{id:'owner-board',displayName:'Sean',role:'dealer_agent',tenantId:'wdcc'}};
          const dashboard={summary:{soldThisWeek:7,newToday:12,appointments:5,applications:8,messages:3},inventory:vehicles,leads:[]};
          async function wire(page){
            await page.route('**/api/auth/session**',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(session)}));
            await page.route('**/api/crm/dashboard**',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(dashboard)}));
            await page.route('**/api/inventory**',r=>r.request().method()==='GET'?r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,items:vehicles})}):r.abort());
            await page.route('**/api/leads**',r=>r.request().method()==='GET'?r.fulfill({status:200,contentType:'application/json',body:'{"ok":true,"items":[]}'}):r.abort());
          }
          async function skip(page){const b=page.getByRole('button',{name:/skip intro/i});if(await b.count())await b.click().catch(()=>{});await page.locator('.li').waitFor({state:'detached',timeout:6000}).catch(()=>{})}
          try{
            const desktopCtx=await browser.newContext({viewport:{width:1440,height:1000},screen:{width:1440,height:1000},deviceScaleFactor:1});
            const d=await desktopCtx.newPage();watch(d);
            let response=await d.goto(`${base}/?owner-review=1&board=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});if(!response||response.status()!==200)throw Error(`DESKTOP_HOME_HTTP_${response?.status()||0}`);await skip(d);
            await d.locator('.wdcc-wordmark').waitFor({state:'visible'});await d.locator('.rh-grid>article').first().waitFor({state:'visible'});
            await d.waitForFunction(()=>[...document.querySelectorAll('.rh-grid>article img')].length===5&&[...document.querySelectorAll('.rh-grid>article img')].every(i=>i.complete&&i.naturalWidth>20),null,{timeout:15000});
            const home=await d.evaluate(()=>{const q=s=>document.querySelector(s),grid=q('.rh-grid'),cards=[...grid.children].map(e=>{const r=e.getBoundingClientRect();return{w:r.width,h:r.height}});return{wordmark:(q('.wdcc-wordmark')?.textContent||'').trim(),utilityH:q('[data-wdcc-public-chrome="utility"]')?.getBoundingClientRect().height||0,headerH:q('[data-wdcc-public-chrome="header"]')?.getBoundingClientRect().height||0,heroH:q('.rh-hero')?.getBoundingClientRect().height||0,heroLoaded:Boolean(q('.rh-hero-art')?.complete&&q('.rh-hero-art')?.naturalWidth>20),benefits:getComputedStyle(q('.rh-benefits')).gridTemplateColumns.split(/\s+/).filter(Boolean).length,gridDisplay:getComputedStyle(grid).display,gridTracks:getComputedStyle(grid).gridTemplateColumns.split(/\s+/).filter(Boolean).length,cards,finance:getComputedStyle(q('.rh-steps')).gridTemplateColumns.split(/\s+/).filter(Boolean).length,trust:getComputedStyle(q('.rh-trust-grid')).gridTemplateColumns.split(/\s+/).filter(Boolean).length,overflow:document.documentElement.scrollWidth-innerWidth}});
            if(!/WDCC.*WE DON'T CARE CARS/i.test(home.wordmark)||home.utilityH<28||home.headerH<70||!home.heroLoaded||home.heroH<520||home.benefits!==4||home.gridDisplay!=='grid'||home.gridTracks!==5||home.cards.length!==5||home.finance!==4||home.trust!==4||home.overflow>2)throw Error(`DESKTOP_HOME_BOARD_${JSON.stringify(home)}`);
            await d.screenshot({path:`${out}/50869-desktop-home.png`,fullPage:true});

            response=await d.goto(`${base}/inventory?owner-review=1&board=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});if(!response||response.status()!==200)throw Error('DESKTOP_INVENTORY_HTTP');await d.locator('.wdccVehicleGrid>article').first().waitFor({state:'visible'});const inv=await d.evaluate(()=>({tracks:getComputedStyle(document.querySelector('.wdccVehicleGrid')).gridTemplateColumns.split(/\s+/).filter(Boolean).length,overflow:document.documentElement.scrollWidth-innerWidth}));if(inv.tracks!==3||inv.overflow>2)throw Error(`DESKTOP_INVENTORY_BOARD_${JSON.stringify(inv)}`);await d.screenshot({path:`${out}/desktop-inventory.png`,fullPage:true});

            const dealer=await desktopCtx.newPage();watch(dealer);await wire(dealer);
            response=await dealer.goto(`${base}/dealer?board=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});if(!response||response.status()!==200)throw Error('DEALER_DASH_HTTP');await dealer.locator('.dealerDashboardLocked').waitFor({state:'visible'});const dd=await dealer.evaluate(()=>({side:getComputedStyle(document.querySelector('.dcSide')).display,metrics:getComputedStyle(document.querySelector('.dashMetrics')).gridTemplateColumns.split(/\s+/).filter(Boolean).length,workspace:getComputedStyle(document.querySelector('.dashboardContent')).backgroundColor,overflow:document.documentElement.scrollWidth-innerWidth}));if(dd.side==='none'||dd.metrics!==6||dd.overflow>2)throw Error(`DEALER_DASH_BOARD_${JSON.stringify(dd)}`);await dealer.screenshot({path:`${out}/10668-dashboard-desktop.png`,fullPage:true});
            response=await dealer.goto(`${base}/dealer/inventory?board=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});if(!response||response.status()!==200)throw Error('DEALER_INVENTORY_HTTP');await dealer.locator('.inventoryTable').waitFor({state:'visible'});await dealer.screenshot({path:`${out}/51074-all-vehicles-desktop.png`,fullPage:true});
            response=await dealer.goto(`${base}/dealer/inventory/new?board=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});if(!response||response.status()!==200)throw Error('DEALER_EDITOR_HTTP');await dealer.locator('.editVehicleApp').waitFor({state:'visible'});const stepCount=await dealer.locator('.stepper button').count();if(stepCount!==5)throw Error(`DEALER_EDITOR_STEPS_${stepCount}`);await dealer.screenshot({path:`${out}/10667-add-edit-desktop.png`,fullPage:true});
            await desktopCtx.close();

            const mobileCtx=await browser.newContext({viewport:{width:390,height:844},screen:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
            const m=await mobileCtx.newPage();watch(m);
            response=await m.goto(`${base}/?owner-review=1&board-mobile=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});if(!response||response.status()!==200)throw Error('MOBILE_HOME_HTTP');await skip(m);await m.locator('.wdcc-wordmark').waitFor({state:'visible'});await m.locator('.rh-grid>article').first().waitFor({state:'visible'});const mh=await m.evaluate(()=>{const q=s=>document.querySelector(s),grid=q('.rh-grid'),cards=[...grid.children].map(e=>{const r=e.getBoundingClientRect();return{x:r.x,right:r.right,w:r.width}}),utility=q('[data-wdcc-public-chrome="utility"]');return{utilityDisplay:utility?getComputedStyle(utility).display:'none',headerH:q('[data-wdcc-public-chrome="header"]')?.getBoundingClientRect().height||0,benefits:getComputedStyle(q('.rh-benefits')).gridTemplateColumns.split(/\s+/).filter(Boolean).length,display:getComputedStyle(grid).display,cards,finance:getComputedStyle(q('.rh-steps')).gridTemplateColumns.split(/\s+/).filter(Boolean).length,overflow:document.documentElement.scrollWidth-innerWidth}});if(mh.utilityDisplay!=='none'||mh.headerH<64||mh.headerH>72||mh.benefits!==4||mh.display!=='flex'||mh.cards.length!==5||mh.cards[2].right>390||mh.finance!==1||mh.overflow>2)throw Error(`MOBILE_HOME_BOARD_${JSON.stringify(mh)}`);await m.screenshot({path:`${out}/50869-mobile-home.png`,fullPage:true});
            response=await m.goto(`${base}/inventory?owner-review=1&board-mobile=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});if(!response||response.status()!==200)throw Error('MOBILE_INV_HTTP');await m.locator('.wdccVehicleGrid>article').first().waitFor({state:'visible'});const mi=await m.evaluate(()=>{const g=document.querySelector('.wdccVehicleGrid'),a=g.querySelector('article>a');return{tracks:getComputedStyle(g).gridTemplateColumns.split(/\s+/).filter(Boolean).length,mediaH:a?.getBoundingClientRect().height||0,overflow:document.documentElement.scrollWidth-innerWidth}});if(mi.tracks!==1||mi.mediaH>205||mi.overflow>2)throw Error(`MOBILE_INV_BOARD_${JSON.stringify(mi)}`);await m.screenshot({path:`${out}/mobile-inventory.png`,fullPage:true});

            const md=await mobileCtx.newPage();watch(md);await wire(md);response=await md.goto(`${base}/dealer?board-mobile=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});if(!response||response.status()!==200)throw Error('MOBILE_DEALER_HTTP');await md.locator('.dealerDashboardLocked').waitFor({state:'visible'});const mdd=await md.evaluate(()=>({side:getComputedStyle(document.querySelector('.dcSide')).display,nav:getComputedStyle(document.querySelector('.dashMobileNav')).display,metricTracks:getComputedStyle(document.querySelector('.dashMetrics')).gridTemplateColumns.split(/\s+/).filter(Boolean).length,overflow:document.documentElement.scrollWidth-innerWidth}));if(mdd.side!=='none'||mdd.nav!=='grid'||mdd.metricTracks!==2||mdd.overflow>2)throw Error(`MOBILE_DEALER_BOARD_${JSON.stringify(mdd)}`);await md.screenshot({path:`${out}/10668-dashboard-mobile.png`,fullPage:true});
            response=await md.goto(`${base}/dealer/inventory?board-mobile=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});if(!response||response.status()!==200)throw Error('MOBILE_ALL_VEHICLES_HTTP');await md.locator('.inventoryRow').first().waitFor({state:'visible'});await md.screenshot({path:`${out}/51074-all-vehicles-mobile.png`,fullPage:true});
            response=await md.goto(`${base}/dealer/inventory/new?board-mobile=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});if(!response||response.status()!==200)throw Error('MOBILE_EDITOR_HTTP');await md.locator('.editVehicleApp').waitFor({state:'visible'});await md.screenshot({path:`${out}/10667-add-edit-mobile.png`,fullPage:true});
            await mobileCtx.close();
            if(writes.length)throw Error(`OWNER_BOARD_WRITE_REQUESTS_${JSON.stringify(writes)}`);
            fs.writeFileSync(`${out}/result.json`,JSON.stringify({sha:process.env.GITHUB_SHA,url:base,home,inv,dd,mh,mi,mdd,writes,pass:true},null,2)+'\n');
            console.log('WDCC_CANONICAL_OWNER_BOARD_PASS',JSON.stringify({desktopCards:home.gridTracks,mobileThirdRight:mh.cards[2].right,desktopInventory:inv.tracks,mobileInventory:mi.tracks,dealerMetrics:dd.metrics,mobileDealerMetrics:mdd.metricTracks,writes:writes.length}));
          } finally {await browser.close()}
          NODE

      - name: Require exact current head
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$current" = "$GITHUB_SHA"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-owner-board-rebuild-${{ github.sha }}
          path: |
            owner-board-preview-url.txt
            owner-board-proof/
          if-no-files-found: warn
          retention-days: 7
