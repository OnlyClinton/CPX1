name: WDCC Canonical Owner Board Rebuild Proof

on:
  push:
    branches:
      - fix/wdcc-locked-contract-20260826
      - fix/wdcc-owner-board-final-lock-20260827
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-owner-board-${{ github.sha }}
  cancel-in-progress: false

jobs:
  owner-board-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Lock canonical owner-board source
        shell: bash
        run: |
          set -euo pipefail
          test -s app/wdcc-owner-board-final.css
          test -s .github/support/wdcc-owner-board-rebuild-proof.mjs
          grep -Fq 'wdcc-owner-board-final.css' app/layout.tsx
          last_wdcc_css="$(grep -o 'import"\./wdcc-[^"]*\.css"' app/layout.tsx | tail -1 | sed 's/^import"\.\///;s/"$//')"
          test "$last_wdcc_css" = 'wdcc-owner-board-final.css'
          ! grep -Fq 'wdcc-system-v2.css' app/layout.tsx
          ! grep -Fq 'wdcc-owner-screenshot-correction.css' app/layout.tsx
          ! grep -Fq 'wdcc-public-owner-render-fix.css' app/layout.tsx
          ! grep -Fq 'wdcc-final-board-polish.css' app/layout.tsx
          grep -Fq 'data-wdcc-logo-art="owner-approved"' app/WdccPublicChrome.tsx
          grep -Fq 'src="/wdcc-owner-logo"' app/WdccPublicChrome.tsx
          grep -Fq 'width:62px!important' app/WdccPublicChrome.tsx
          grep -Fq 'height:64px!important' app/WdccPublicChrome.tsx
          grep -Fq 'OWNER-BOARD FINAL' app/wdcc-owner-board-final.css
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Build exact Cloudflare candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0 playwright@1.55.0
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          test -d .open-next/assets
          test -s .next/BUILD_ID
          npx playwright install --with-deps chromium >/dev/null

      - name: Create isolated exact-SHA Worker
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          cfg.name=`wob-${process.env.GITHUB_SHA}`;
          cfg.workers_dev=true;
          cfg.preview_urls=true;
          delete cfg.route;
          delete cfg.routes;
          fs.writeFileSync('wrangler.owner-board.jsonc',JSON.stringify(cfg,null,2)+'\n');
          NODE
          ! grep -qi 'wedontcarecars.com' wrangler.owner-board.jsonc
          grep -Fq "$GITHUB_SHA" wrangler.owner-board.jsonc

      - name: Deploy isolated exact-SHA preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.owner-board.jsonc 2>&1 | tee /tmp/wob.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wob.log | tail -1)"
          test -n "$url"
          case "$url" in *"$GITHUB_SHA"*) ;; *) echo "Not exact SHA: $url" >&2; exit 1;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > owner-board-preview-url.txt

      - name: Warm and verify exact preview
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          code=000
          for i in $(seq 1 30); do
            code="$(curl --http1.1 -sS -L -o /tmp/wob-home.html -w '%{http_code}' "$URL/?warm=$GITHUB_RUN_ID-$i" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          test "$code" = 200
          local_build="$(tr -d '\r\n' < .next/BUILD_ID)"
          grep -Fq "$local_build" /tmp/wob-home.html
          test "$(curl --http1.1 -sS -L -o /tmp/wob-hero.webp -w '%{http_code}' "$URL/wdcc-hero-v2.webp?warm=$GITHUB_RUN_ID")" = 200
          test -s /tmp/wob-hero.webp
          for id in nissan350z fordF150 hondaPilot kiaSportage toyotaRav4; do
            media=000
            for i in $(seq 1 8); do
              media="$(curl --http1.1 -sS -L -o "/tmp/$id.webp" -w '%{http_code}' "$URL/wdcc-review-media/$id?warm=$GITHUB_RUN_ID-$i" || true)"
              [ "$media" = 200 ] && break
              sleep 1
            done
            test "$media" = 200
            test -s "/tmp/$id.webp"
          done

      - name: Prove owner boards in browser
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          node .github/support/wdcc-owner-board-rebuild-proof.mjs

      - name: Require exact current head
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test -n "$current"
          test "$current" = "$GITHUB_SHA"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wdcc-owner-board-rebuild-${{ github.sha }}
          path: |
            owner-board-preview-url.txt
            owner-board-proof/
          if-no-files-found: warn
          retention-days: 7