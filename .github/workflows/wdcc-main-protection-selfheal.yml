name: WDCC Main Protection Self-Heal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-main-protection-selfheal.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: wdcc-main-protection-selfheal
  cancel-in-progress: false

jobs:
  enforce:
    if: github.repository == 'OnlyClinton/CPX1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_TOKEN: ${{ secrets.WDCC_REPO_ADMIN_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      BRANCH: main
    steps:
      - name: Require dedicated repository-administration token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            echo 'WDCC_MAIN_PROTECTION=BLOCKED'
            echo 'Missing repository secret WDCC_REPO_ADMIN_TOKEN.' >&2
            echo 'Use a fine-grained token scoped only to OnlyClinton/CPX1 with Administration: write.' >&2
            exit 1
          fi

      - name: Apply exact main branch protection policy
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}/branches/${BRANCH}/protection"
          cat > /tmp/protection.json <<'JSON'
          {
            "required_status_checks": {
              "strict": true,
              "contexts": ["audit", "visual-acceptance"]
            },
            "enforce_admins": true,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": false,
              "required_approving_review_count": 1,
              "require_last_push_approval": true
            },
            "restrictions": null,
            "required_linear_history": false,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "block_creations": false,
            "required_conversation_resolution": false,
            "lock_branch": false,
            "allow_fork_syncing": false
          }
          JSON
          curl -fsS --retry 3 --retry-all-errors \
            -X PUT \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "$api" \
            --data-binary @/tmp/protection.json \
            > /tmp/applied.json
          jq -e '.enforce_admins.enabled == true' /tmp/applied.json >/dev/null

      - name: Verify protection is non-bypassable and checks are required
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}/branches/${BRANCH}/protection"
          curl -fsS --retry 3 --retry-all-errors \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "$api" > /tmp/verify.json

          jq -e '
            .enforce_admins.enabled == true and
            .required_status_checks.strict == true and
            (.required_status_checks.contexts | index("audit") != null) and
            (.required_status_checks.contexts | index("visual-acceptance") != null) and
            .required_pull_request_reviews.required_approving_review_count >= 1 and
            .required_pull_request_reviews.dismiss_stale_reviews == true and
            .required_pull_request_reviews.require_last_push_approval == true and
            .allow_force_pushes.enabled == false and
            .allow_deletions.enabled == false
          ' /tmp/verify.json >/dev/null

          echo 'WDCC_MAIN_PROTECTION=PASS'
          {
            echo '### WDCC main protection — enforced'
            echo '- pull request required'
            echo '- one approval required'
            echo '- stale approvals dismissed'
            echo '- latest push requires independent approval'
            echo '- required checks: audit, visual-acceptance'
            echo '- administrators cannot bypass'
            echo '- force pushes blocked'
            echo '- branch deletion blocked'
            echo '- no production/provider/deployment authority added'
          } >> "$GITHUB_STEP_SUMMARY"
