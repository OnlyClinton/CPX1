name: WDCC ENABLE HOME EDGE PROXY

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-enable-home-edge-proxy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-enable-home-edge-proxy
  cancel-in-progress: false

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ZONE_API_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Discover authorized apex record
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/cf-token /tmp/zone-id /tmp/apex-record.json
          try_token(){
            local label="$1" token="$2"
            [ -n "$token" ] || return 1
            local code zone records_code
            code="$(curl -sS -o /tmp/zones-$label.json -w '%{http_code}' "https://api.cloudflare.com/client/v4/zones?name=wedontcarecars.com&status=active" -H "Authorization: Bearer $token" -H 'Content-Type: application/json' || true)"
            echo "$label zone lookup HTTP $code"
            [ "$code" = 200 ] || return 1
            zone="$(jq -r '.result[0].id // empty' /tmp/zones-$label.json)"
            [ -n "$zone" ] || return 1
            records_code="$(curl -sS -o /tmp/records-$label.json -w '%{http_code}' "https://api.cloudflare.com/client/v4/zones/$zone/dns_records?name=wedontcarecars.com&per_page=100" -H "Authorization: Bearer $token" -H 'Content-Type: application/json' || true)"
            echo "$label DNS lookup HTTP $records_code"
            [ "$records_code" = 200 ] || return 1
            jq -e '.success==true' /tmp/records-$label.json >/dev/null || return 1
            jq -c '[.result[] | select(.name=="wedontcarecars.com" and (.type=="CNAME" or .type=="A" or .type=="AAAA"))]' /tmp/records-$label.json > /tmp/candidates-$label.json
            local count="$(jq 'length' /tmp/candidates-$label.json)"
            echo "$label apex A/AAAA/CNAME records: $count"
            [ "$count" -ge 1 ] || return 1
            local rec
            rec="$(jq -c '([.[]|select(.type=="CNAME")]|first) // ([.[]|select(.type=="A")]|first) // ([.[]|select(.type=="AAAA")]|first)' /tmp/candidates-$label.json)"
            [ -n "$rec" ] && [ "$rec" != null ] || return 1
            printf '%s' "$token" > /tmp/cf-token
            printf '%s' "$zone" > /tmp/zone-id
            printf '%s' "$rec" > /tmp/apex-record.json
            echo "token_label=$label" >> "$GITHUB_OUTPUT"
            return 0
          }

          if try_token zone "$CLOUDFLARE_ZONE_API_TOKEN"; then :
          elif try_token workers "$CLOUDFLARE_API_TOKEN"; then :
          else
            echo 'No available Cloudflare credential can read the apex DNS record.' >&2
            exit 1
          fi

          jq -r '"Apex record: \(.type) \(.name) -> \(.content) (proxied=\(.proxied), proxiable=\(.proxiable))"' /tmp/apex-record.json
          jq -e '.proxiable==true' /tmp/apex-record.json >/dev/null

      - name: Guarded apex proxy enable with rollback
        shell: bash
        run: |
          set -euo pipefail
          CF_TOKEN="$(cat /tmp/cf-token)"
          ZONE_ID="$(cat /tmp/zone-id)"
          record="$(cat /tmp/apex-record.json)"
          auth=(-H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json')
          REC_ID="$(jq -r '.id' <<<"$record")"
          REC_TYPE="$(jq -r '.type' <<<"$record")"
          REC_NAME="$(jq -r '.name' <<<"$record")"
          REC_CONTENT="$(jq -r '.content' <<<"$record")"
          REC_TTL="$(jq -r '.ttl' <<<"$record")"
          ORIGINAL_PROXY="$(jq -r '.proxied' <<<"$record")"

          make_payload(){ jq -nc --arg type "$REC_TYPE" --arg name "$REC_NAME" --arg content "$REC_CONTENT" --argjson ttl "$REC_TTL" --argjson proxied "$1" '{type:$type,name:$name,content:$content,ttl:$ttl,proxied:$proxied}'; }
          restore(){
            echo "Rolling apex proxy back to proxied=$ORIGINAL_PROXY" >&2
            curl -sS -X PATCH "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$REC_ID" "${auth[@]}" --data "$(make_payload "$ORIGINAL_PROXY")" >/tmp/rollback.json || true
          }
          committed=0
          trap 'if [ "$committed" != 1 ]; then restore; fi' EXIT

          if [ "$ORIGINAL_PROXY" != true ]; then
            code="$(curl -sS -o /tmp/update.json -w '%{http_code}' -X PATCH "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$REC_ID" "${auth[@]}" --data "$(make_payload true)" || true)"
            echo "Proxy-enable HTTP $code"
            [ "$code" = 200 ]
            jq -e '.success==true and .result.proxied==true' /tmp/update.json >/dev/null
          fi

          sleep 6
          ok=0
          for attempt in $(seq 1 25); do
            root_code="$(curl -sS -D /tmp/root.h -o /tmp/root.html -w '%{http_code}' "https://wedontcarecars.com/?edge_enable=$GITHUB_RUN_ID&attempt=$attempt" || true)"
            health_code="$(curl -sS -D /tmp/health.h -o /tmp/health.json -w '%{http_code}' "https://wedontcarecars.com/api/health?edge_enable=$GITHUB_RUN_ID&attempt=$attempt" || true)"
            inv_code="$(curl -sS -D /tmp/inv.h -o /tmp/inv.json -w '%{http_code}' "https://wedontcarecars.com/api/inventory?edge_enable=$GITHUB_RUN_ID&attempt=$attempt" || true)"
            if [ "$root_code" = 200 ] && [ "$health_code" = 200 ] && [ "$inv_code" = 200 ] \
              && grep -q 'id="wdcc-sleek-edge"' /tmp/root.html \
              && grep -qi '^x-wdcc-edge: cloudflare-home-sleek' /tmp/root.h \
              && jq -e '.ok==true and .degraded==false' /tmp/health.json >/dev/null 2>&1 \
              && jq -e '.ok==true and (.items|type)=="array"' /tmp/inv.json >/dev/null 2>&1 \
              && ! grep -qi '^x-wdcc-edge: cloudflare-home-sleek' /tmp/health.h \
              && ! grep -qi '^x-wdcc-edge: cloudflare-home-sleek' /tmp/inv.h; then
                ok=1
                break
            fi
            sleep 3
          done
          if [ "$ok" != 1 ]; then
            echo 'Live root/API isolation gate did not pass.' >&2
            echo 'Root headers:' >&2; grep -Ei '^(server|cf-ray|x-wdcc-edge|x-wdcc-origin|location):' /tmp/root.h >&2 || true
            echo 'Health headers:' >&2; grep -Ei '^(server|cf-ray|x-wdcc-edge|x-wdcc-origin|location):' /tmp/health.h >&2 || true
            exit 1
          fi
          committed=1
          trap - EXIT
          echo 'WDCC_HOME_EDGE_PROXY=PASS'
