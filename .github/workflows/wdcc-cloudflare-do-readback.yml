name: WDCC Cloudflare DO Readback

on:
  push:
    branches: [ops/wdcc-blob-recovery-20260827]
    paths:
      - '.github/workflows/wdcc-cloudflare-do-readback.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove propagated Durable Object Worker
        shell: bash
        run: |
          set -euo pipefail
          URL='https://wdcc-proof-a9570307a3cabdbc67e9e32a9f2e48df1f6d65f9.clico-global.workers.dev'
          code=000
          for i in $(seq 1 20); do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$URL/health?i=$i" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          test "$code" = 200
          jq -e '.ok==true and .storage=="durable-object-reuse-probe"' /tmp/health.json >/dev/null
          MARKER="do-readback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl -fsS -X POST -H 'content-type: application/json' --data "{\"marker\":\"$MARKER\"}" "$URL/write" | jq -e '.ok==true' >/dev/null
          test "$(curl -fsS "$URL/read" | jq -r .value.marker)" = "$MARKER"
          echo 'DURABLE_OBJECT_PERSISTENCE=PASS'
