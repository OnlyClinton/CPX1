name: WDCC CLOUDFLARE VISUAL CONTRACT

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-cloudflare-visual-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-contract:
    runs-on: ubuntu-latest
    env:
      URL: https://wdcc-storefront.clico-global.workers.dev
    steps:
      - name: Verify homepage visual contract
        shell: bash
        run: |
          set -euo pipefail

          curl -fsS -D /tmp/home.headers -o /tmp/home.html "$URL/?visual-contract=$GITHUB_RUN_ID"
          grep -qi "we don.t care" /tmp/home.html
          grep -q "wdcc-logo-transparent.webp" /tmp/home.html
          grep -q "wdcc-hero-v2.webp" /tmp/home.html
          grep -qi "tampa bay" /tmp/home.html

          curl -fsS -D /tmp/logo.headers -o /tmp/logo.webp "$URL/wdcc-logo-transparent.webp?visual-contract=$GITHUB_RUN_ID"
          logo_type="$(tr -d '\r' </tmp/logo.headers | awk -F': ' 'tolower($1)=="content-type"{print tolower($2)}' | tail -1)"
          case "$logo_type" in image/webp*) ;; *) echo "WDCC logo is not WebP: $logo_type" >&2; exit 1;; esac
          test "$(wc -c </tmp/logo.webp)" -gt 1000

          curl -fsS -D /tmp/hero.headers -o /tmp/hero.webp "$URL/wdcc-hero-v2.webp?visual-contract=$GITHUB_RUN_ID"
          hero_type="$(tr -d '\r' </tmp/hero.headers | awk -F': ' 'tolower($1)=="content-type"{print tolower($2)}' | tail -1)"
          case "$hero_type" in image/webp*) ;; *) echo "WDCC hero is not WebP: $hero_type" >&2; exit 1;; esac
          test "$(wc -c </tmp/hero.webp)" -gt 10000

          curl -fsS "$URL/api/health?visual-contract=$GITHUB_RUN_ID" -o /tmp/health.json
          jq -e '.ok == true and .backend == "healthy"' /tmp/health.json >/dev/null

          echo "WDCC_CLOUDFLARE_VISUAL_CONTRACT=PASS"
          {
            echo '# WDCC Cloudflare visual contract — PASS'
            echo
            echo '- transparent WDCC logo: served as WebP'
            echo '- Tampa/car hero: served as WebP'
            echo '- homepage references logo, hero, and Tampa copy'
            echo '- API health: healthy'
          } >> "$GITHUB_STEP_SUMMARY"
