name: WDCC Configure Email Nonsecret

on:
  pull_request:
    branches: [preview/wdcc-mockup-convergence-20260827-v2-proof]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/wdcc-email-configure-nonsecret.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-email-configure-nonsecret
  cancel-in-progress: false

env:
  VERCEL_SCOPE: cpxagency
  VERCEL_ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
  VERCEL_PROJECT_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
  WDCC_LEAD_NOTIFICATION_EMAILS: sean@wedontcarecars.com
  WDCC_LEAD_FROM_EMAIL: WDCC Leads <leads@wedontcarecars.com>

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Require scoped Vercel authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure recipient and intended sender only
        shell: bash
        run: |
          set -euo pipefail
          npm install --global vercel@59.5.0 >/dev/null
          mkdir -p /tmp/wdcc-email-config/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > /tmp/wdcc-email-config/.vercel/project.json
          cd /tmp/wdcc-email-config
          printf '%s\n' "$WDCC_LEAD_NOTIFICATION_EMAILS" | VERCEL_ORG_ID="$VERCEL_ORG_ID" VERCEL_PROJECT_ID="$VERCEL_PROJECT_ID" vercel env add WDCC_LEAD_NOTIFICATION_EMAILS production --force --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
          printf '%s\n' "$WDCC_LEAD_FROM_EMAIL" | VERCEL_ORG_ID="$VERCEL_ORG_ID" VERCEL_PROJECT_ID="$VERCEL_PROJECT_ID" vercel env add WDCC_LEAD_FROM_EMAIL production --force --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
          echo 'WDCC_LEAD_NOTIFICATION_EMAILS=CONFIGURED' >> "$GITHUB_STEP_SUMMARY"
          echo 'WDCC_LEAD_FROM_EMAIL=CONFIGURED' >> "$GITHUB_STEP_SUMMARY"
          echo 'RESEND_API_KEY=NOT_CREATED_BY_THIS_WORKFLOW' >> "$GITHUB_STEP_SUMMARY"
          echo 'PRODUCTION_DATA_CHANGED=NO' >> "$GITHUB_STEP_SUMMARY"
          echo 'PRODUCTION_ROUTES_CHANGED=NO' >> "$GITHUB_STEP_SUMMARY"

      - name: Read back presence without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/wdcc-email-config
          VERCEL_ORG_ID="$VERCEL_ORG_ID" VERCEL_PROJECT_ID="$VERCEL_PROJECT_ID" vercel env pull /tmp/wdcc-email-config.env --environment=production --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" >/dev/null
          set -a; . /tmp/wdcc-email-config.env; set +a
          test "$WDCC_LEAD_NOTIFICATION_EMAILS" = 'sean@wedontcarecars.com'
          test "$WDCC_LEAD_FROM_EMAIL" = 'WDCC Leads <leads@wedontcarecars.com>'
          echo 'NONSECRET_EMAIL_CONFIG_READBACK=PASS' >> "$GITHUB_STEP_SUMMARY"
