name: Recover WDCC 2vfD Source
on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      DEPLOYMENT_ID: dpl_2vfDGZg6erycSF6Pmwo6yPbFSaxp
    steps:
      - uses: actions/checkout@v4
      - name: Require token
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN missing" >&2; exit 78; }
      - name: Recover exact deployment files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered
          curl -fsSL -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments/$DEPLOYMENT_ID/files?teamId=$VERCEL_TEAM_ID" > files.json
          cat > recover.mjs <<'EOF'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const token=process.env.VERCEL_TOKEN, team=process.env.VERCEL_TEAM_ID, dep=process.env.DEPLOYMENT_ID;
          const tree=JSON.parse(await fs.readFile('files.json','utf8'));
          const files=[];
          function walk(nodes,prefix=''){
            for(const n of nodes||[]){
              const p=prefix?`${prefix}/${n.name}`:n.name;
              if(n.type==='directory') walk(n.children||[],p);
              else if(n.type==='file'&&n.uid) files.push({...n,path:p});
            }
          }
          walk(tree);
          const manifest=[];
          for(const f of files){
            const u=`https://api.vercel.com/v8/deployments/${dep}/files/${f.uid}?teamId=${encodeURIComponent(team)}`;
            const r=await fetch(u,{headers:{Authorization:`Bearer ${token}`}});
            if(!r.ok) throw new Error(`${f.path}: ${r.status}`);
            const raw=await r.text();
            let parsed; try{parsed=JSON.parse(raw)}catch{parsed=raw}
            const b64=typeof parsed==='string'?parsed:(parsed?.data??parsed?.content??parsed?.file??parsed?.value);
            if(typeof b64!=='string') throw new Error(`${f.path}: unknown content response`);
            const buf=Buffer.from(b64,'base64');
            const out=path.join('recovered',f.path);
            await fs.mkdir(path.dirname(out),{recursive:true});
            await fs.writeFile(out,buf);
            manifest.push({path:f.path,uid:f.uid,size:buf.length,contentType:f.contentType||null});
          }
          await fs.writeFile('recovered-manifest.json',JSON.stringify(manifest,null,2));
          console.log(`Recovered ${manifest.length} files`);
          EOF
          node recover.mjs
      - name: Publish recovered source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WDCC Recovery Bot"
          git config user.email "120651995+OnlyClinton@users.noreply.github.com"
          git checkout --orphan recovered-2vfd-source
          git rm -rf . >/dev/null 2>&1 || true
          cp -a recovered/. .
          cp recovered-manifest.json RECOVERED_2VFD_MANIFEST.json
          git add -A
          git commit -m "Recovered exact WDCC 2vfD source"
          git push --force origin HEAD:recovered-2vfd-source

# Recovery is intentionally manual-only. Normal main pushes must never rewrite recovery branches.
