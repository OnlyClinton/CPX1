name: WDCC Public Route and Inventory Truth Gate

on:
  pull_request:
    paths:
      - 'app/**'
      - 'scripts/wdcc-public-route-contract.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/wdcc-public-route-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-routes:
    name: Route coverage, inventory integrity and Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Public route and inventory safety contract
        run: node scripts/wdcc-public-route-contract.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build checked-in site
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
