name: WDCC Final Front Back Click Acceptance

on:
  push:
    branches:
      - dev/wdcc-cinematic-mockup-v1
    paths:
      - '.github/workflows/wdcc-final-click-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-final-front-back-click-acceptance
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start production build
        shell: bash
        run: |
          nohup npm start -- -p 3000 >/tmp/wdcc-click.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:3000/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/ >/dev/null
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Prove storefront and dealer click paths
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const base='http://127.0.0.1:3000';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:900}});
          const home=async()=>{await page.goto(base,{waitUntil:'domcontentloaded'});await page.waitForTimeout(3000)};
          await home();
          await page.locator('.hero-cta-test').click();
          await page.waitForURL('**/get-approved**');
          if(!page.url().includes('/get-approved'))throw Error('Get Pre-Approved route failed');
          await home();
          await page.locator('.hero-cta-qualify').click();
          await page.waitForURL('**/inventory**');
          if(!page.url().includes('/inventory'))throw Error('Browse Inventory route failed');
          await home();
          await page.locator('.main-nav a[href="/financing"]').click();
          await page.waitForURL('**/financing');
          const financing=(await page.locator('body').innerText()).toLowerCase();
          if(!financing.includes('in-house financing')||!financing.includes('get pre-approved'))throw Error('Financing route content failed');
          for(const path of ['/financing','/get-approved','/inventory','/dealer']){
            const r=await page.request.get(`${base}${path}`);
            if(!r.ok())throw Error(`${path} returned ${r.status()}`);
          }
          await page.goto(`${base}/dealer`,{waitUntil:'domcontentloaded'});await page.waitForTimeout(1400);
          if(!(await page.locator('body').innerText()).includes('Dealer Sign In'))throw Error('Dealer entrance missing');
          await page.screenshot({path:'dealer-login-desktop.png',fullPage:true});
          await page.goto(`${base}/dealer/inventory/new`,{waitUntil:'domcontentloaded'});await page.waitForTimeout(1600);
          if(!(await page.locator('body').innerText()).includes('Dealer Sign In'))throw Error('Add Vehicle is not protected');
          const mobile=await browser.newPage({viewport:{width:390,height:844}});
          await mobile.goto(`${base}/dealer`,{waitUntil:'domcontentloaded'});await mobile.waitForTimeout(1200);
          if(!(await mobile.locator('body').innerText()).includes('Dealer Sign In'))throw Error('Mobile dealer entrance missing');
          await mobile.screenshot({path:'dealer-login-mobile.png',fullPage:true});
          await browser.close();
          console.log('WDCC_FINAL_FRONT_BACK_CLICK_ACCEPTANCE=PASS');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: wdcc-dealer-login-proof
          path: dealer-login-*.png
          retention-days: 7
