name: WDCC Dev Cinematic Preview

on:
  push:
    branches:
      - dev/wdcc-cinematic-mockup-v1
    paths:
      - 'app/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/wdcc-dev-cinematic-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-dev-cinematic-preview
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
  VERCEL_PROJECT_ID: prj_We7xkAkB5Qy31Pt17USSkQFE0u7h

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Exact recovered 2vfD asset gate
        shell: bash
        run: |
          test "$(git hash-object public/wdcc-hero-v2.webp)" = "f75ea69f3aee373bb4e3ee393d37290836266127"
          test "$(git hash-object public/wdcc-logo-transparent.webp)" = "983e6fffee3786712b8878594ceb79495ac5a891"
      - name: Type/build gate
        run: npm run build
      - name: Start local production build
        shell: bash
        run: |
          nohup npm start -- -p 3000 >/tmp/wdcc-dev.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:3000/ >/tmp/home.html && break
            sleep 1
          done
          test -s /tmp/home.html
          grep -q 'wdcc-app' /tmp/home.html
      - name: Install browser verifier
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture and enforce desktop/mobile visual proof
        shell: bash
        run: |
          mkdir -p visual-proof
          cat > visual-proof/capture.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          async function capture(name,width,height){
            const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
            page.setDefaultTimeout(10000);
            await page.route('**/api/inventory**', route=>route.abort());
            const failed=[];
            page.on('requestfailed',r=>{if(!r.url().includes('/api/inventory')) failed.push(`${r.failure()?.errorText||'failed'} ${r.url()}`)});
            await page.goto('http://127.0.0.1:3000/?dev-proof=1',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForSelector('[data-wdcc-intro="challenger-tampa-v1"]');
            await page.waitForTimeout(850);
            const introState=await page.locator('.cinematic-v2 .cinScene').evaluate(e=>({background:getComputedStyle(e).backgroundImage,width:e.getBoundingClientRect().width,height:e.getBoundingClientRect().height}));
            if(!introState.background.includes('wdcc-hero-v2.webp')||introState.width<width*.95||introState.height<height*.95) throw new Error(`${name}: Tampa/Challenger intro canvas invalid ${JSON.stringify(introState)}`);
            await page.screenshot({path:`visual-proof/${name}-intro.png`,fullPage:false});
            await page.waitForTimeout(3200);
            await page.waitForSelector('.screenshotHero');
            const visual=await page.evaluate(()=>{
              const R=e=>e?.getBoundingClientRect().toJSON();
              const hero=document.querySelector('.screenshotHero'),copy=document.querySelector('.hero-copy'),heading=document.querySelector('.hero h1'),how=document.querySelector('.screenshotHow'),wordmark=document.querySelector('.logo-button .wdcc-wordmark');
              const visible=e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden'};
              const visibleImgs=[...document.querySelectorAll('img')].filter(visible);
              const navLinks=[...document.querySelectorAll('.main-nav a')].filter(visible).map(R);
              const cards=[...document.querySelectorAll('.featured-slide')].filter(visible).map(R);
              const cardBodies=[...document.querySelectorAll('.vehicle-card-body')].filter(visible).map(R);
              const steps=[...document.querySelectorAll('.steps-grid article')].filter(visible).map(R);
              const menuLines=[...document.querySelectorAll('.mobile-menu i')].filter(visible).map(R);
              const callSvg=document.querySelector('.mobile-call svg');
              const title=document.querySelector('.featured-slide.active .vehicle-title')||document.querySelector('.vehicle-title');
              const price=document.querySelector('.featured-slide.active .vehicle-price')||document.querySelector('.vehicle-price');
              return {innerWidth:window.innerWidth,scrollWidth:document.documentElement.scrollWidth,heroBackground:hero?getComputedStyle(hero).backgroundImage:'',heroRect:R(hero),copyRect:R(copy),headingRect:R(heading),headingFont:heading?getComputedStyle(heading).fontSize:'',wordmarkRect:wordmark&&visible(wordmark)?R(wordmark):null,brokenImages:visibleImgs.filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.currentSrc||i.src),visibleImageCount:visibleImgs.length,navLinks,cards,cardBodies,steps,menuLines,howRect:R(how),callSvgRect:callSvg&&visible(callSvg)?R(callSvg):null,titleRect:R(title),priceRect:R(price)};
            });
            console.log(`${name} visual=${JSON.stringify(visual)}`);
            if(!visual.heroBackground.includes('wdcc-hero-v2.webp')) throw new Error(`${name}: hero Tampa/Challenger background missing`);
            if(!visual.wordmarkRect||visual.wordmarkRect.width<80||visual.wordmarkRect.height<25) throw new Error(`${name}: horizontal WDCC wordmark missing or too small`);
            if(visual.scrollWidth>visual.innerWidth+3) throw new Error(`${name}: horizontal overflow ${visual.scrollWidth}>${visual.innerWidth}`);
            if(visual.brokenImages.length) throw new Error(`${name}: broken visible images ${JSON.stringify(visual.brokenImages)}`);
            const minVisible=width<=560?1:5;
            if(visual.visibleImageCount<minVisible) throw new Error(`${name}: too few rendered inventory images ${visual.visibleImageCount}<${minVisible}`);
            const heroTop=visual.heroRect?.y??0,heroBottom=heroTop+(visual.heroRect?.height??0);
            if(!visual.copyRect||visual.copyRect.y<heroTop-2||visual.copyRect.y+visual.copyRect.height>heroBottom-12) throw new Error(`${name}: hero copy clipped ${JSON.stringify({hero:visual.heroRect,copy:visual.copyRect})}`);
            if(width>900){
              if(visual.navLinks.length<5) throw new Error(`${name}: desktop nav links missing`);
              const navGaps=visual.navLinks.slice(1).map((r,i)=>r.x-(visual.navLinks[i].x+visual.navLinks[i].width));
              if(navGaps.some(g=>g<12)) throw new Error(`${name}: desktop nav labels collide ${JSON.stringify(navGaps)}`);
              if(visual.cards.length!==5) throw new Error(`${name}: expected five desktop inventory cards, got ${visual.cards.length}`);
              const cardY=visual.cards.map(r=>r.y); if(Math.max(...cardY)-Math.min(...cardY)>5) throw new Error(`${name}: desktop inventory cards are not one row ${JSON.stringify(cardY)}`);
              const maxCardBottom=Math.max(...visual.cardBodies.map(r=>r.y+r.height)); if(!visual.howRect||maxCardBottom>visual.howRect.y-8) throw new Error(`${name}: inventory card content overlaps process section`);
              if(visual.steps.length!==4) throw new Error(`${name}: expected 4 desktop process steps, got ${visual.steps.length}`);
              const stepY=visual.steps.map(r=>r.y); if(Math.max(...stepY)-Math.min(...stepY)>5) throw new Error(`${name}: process steps are not one row ${JSON.stringify(stepY)}`);
            }else{
              if(visual.menuLines.length!==3||visual.menuLines.some(r=>r.width<15||r.height<1.5)) throw new Error(`${name}: mobile hamburger is not three visible lines`);
              if(!visual.callSvgRect||visual.callSvgRect.width<18||visual.callSvgRect.height<18) throw new Error(`${name}: mobile call icon missing`);
              if(!visual.titleRect||!visual.priceRect||visual.priceRect.y<visual.titleRect.y+visual.titleRect.height-1) throw new Error(`${name}: mobile vehicle title/price collide`);
              const maxBodyBottom=Math.max(...visual.cardBodies.map(r=>r.y+r.height)); if(!visual.howRect||maxBodyBottom>visual.howRect.y-8) throw new Error(`${name}: mobile inventory card overlaps process section`);
              if(visual.copyRect.y<visual.heroRect.y+240) throw new Error(`${name}: mobile hero copy still overlays too much of the car image`);
            }
            const checks={wordmark:await page.locator('.logo-button .wdcc-wordmark').count(),hero:await page.locator('.screenshotHero').count(),primary:await page.locator('.hero-cta-test').count(),secondary:await page.locator('.hero-cta-qualify').count(),inventory:await page.locator('.screenshotInventory').count()};
            if(Object.values(checks).some(v=>v<1)) throw new Error(`${name}: mockup contract missing ${JSON.stringify(checks)}`);
            if(failed.length) throw new Error(`${name}: unexpected resource failures ${JSON.stringify(failed)}`);
            await page.screenshot({path:`visual-proof/${name}-home.png`,fullPage:true});
            await page.close();
          }
          await capture('desktop',1440,1000);
          await capture('mobile',390,844);
          await browser.close();
          NODE
          node visual-proof/capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: wdcc-cinematic-visual-proof
          path: visual-proof/*.png
          retention-days: 7
      - name: Require preview deployment credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: test -n "$VERCEL_TOKEN"
      - name: Install Vercel CLI
        run: npm install --global vercel@59.5.0
      - name: Link preview project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
      - name: Pull preview environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" --scope=cpxagency
      - name: Build preview artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --token="$VERCEL_TOKEN" --scope=cpxagency
      - name: Deploy preview only
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          vercel deploy --prebuilt --yes --archive=tgz --token="$VERCEL_TOKEN" --scope=cpxagency 2>&1 | tee /tmp/vercel-preview.log
          url="$(tr -d '\r' </tmp/vercel-preview.log | sed -E $'s/\x1B\[[0-9;]*[A-Za-z]//g' | grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' | tail -1)"
          if [ -z "$url" ]; then echo 'Preview URL not found in Vercel output.' >&2; exit 1; fi
          printf '%s\n' "$url" | tee preview-url.txt
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: wdcc-cinematic-preview-url
          path: preview-url.txt
          retention-days: 7
      - name: Summary
        run: |
          echo '### WDCC dev cinematic preview' >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Production aliases were not touched.' >> "$GITHUB_STEP_SUMMARY"
