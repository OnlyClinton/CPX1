name: WDCC Dev Cinematic Preview

on:
  push:
    branches:
      - dev/wdcc-cinematic-mockup-v1
    paths:
      - 'app/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/wdcc-dev-cinematic-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-dev-cinematic-preview
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
  VERCEL_PROJECT_ID: prj_We7xkAkB5Qy31Pt17USSkQFE0u7h

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Type/build gate
        run: npm run build
      - name: Start local production build
        shell: bash
        run: |
          nohup npm start -- -p 3000 >/tmp/wdcc-dev.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:3000/ >/tmp/home.html && break
            sleep 1
          done
          test -s /tmp/home.html
          grep -q 'wdcc-app' /tmp/home.html
      - name: Install browser verifier
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture and enforce desktop/mobile visual proof
        shell: bash
        run: |
          mkdir -p visual-proof
          cat > visual-proof/capture.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          async function capture(name,width,height){
            const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
            page.setDefaultTimeout(10000);
            // Keep the visual contract deterministic: use the known static mockup inventory donor.
            await page.route('**/api/inventory**', route=>route.abort());
            const failed=[];
            page.on('requestfailed',r=>{if(!r.url().includes('/api/inventory')) failed.push(`${r.failure()?.errorText||'failed'} ${r.url()}`)});
            await page.goto('http://127.0.0.1:3000/?dev-proof=1',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForSelector('[data-wdcc-intro="challenger-tampa-v1"]');
            await page.waitForTimeout(850);
            const introState=await page.locator('.cinematic-v2 .cinScene').evaluate(e=>({
              background:getComputedStyle(e).backgroundImage,
              width:e.getBoundingClientRect().width,
              height:e.getBoundingClientRect().height
            }));
            if(!introState.background.includes('wdcc-hero-v2.webp')||introState.width<width*.95||introState.height<height*.95){
              throw new Error(`${name}: Tampa/Challenger intro canvas invalid ${JSON.stringify(introState)}`);
            }
            await page.screenshot({path:`visual-proof/${name}-intro.png`,fullPage:false});
            await page.waitForTimeout(3200);
            await page.waitForSelector('.screenshotHero');
            const visual=await page.evaluate(()=>{
              const hero=document.querySelector('.screenshotHero');
              const copy=document.querySelector('.hero-copy');
              const heading=document.querySelector('.hero h1');
              const visibleImgs=[...document.querySelectorAll('img')].filter(i=>{const r=i.getBoundingClientRect();const s=getComputedStyle(i);return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden'});
              return {
                innerWidth:window.innerWidth,
                scrollWidth:document.documentElement.scrollWidth,
                heroBackground:hero?getComputedStyle(hero).backgroundImage:'',
                heroRect:hero?.getBoundingClientRect().toJSON(),
                copyRect:copy?.getBoundingClientRect().toJSON(),
                headingRect:heading?.getBoundingClientRect().toJSON(),
                headingFont:heading?getComputedStyle(heading).fontSize:'',
                brokenImages:visibleImgs.filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.currentSrc||i.src),
                visibleImageCount:visibleImgs.length
              };
            });
            console.log(`${name} visual=${JSON.stringify(visual)}`);
            if(!visual.heroBackground.includes('wdcc-hero-v2.webp')) throw new Error(`${name}: hero Tampa/Challenger background missing`);
            if(visual.scrollWidth>visual.innerWidth+3) throw new Error(`${name}: horizontal overflow ${visual.scrollWidth}>${visual.innerWidth}`);
            if(visual.brokenImages.length) throw new Error(`${name}: broken visible images ${JSON.stringify(visual.brokenImages)}`);
            const minVisible=width<=560?2:5;
            if(visual.visibleImageCount<minVisible) throw new Error(`${name}: too few rendered images ${visual.visibleImageCount}<${minVisible}`);
            const heroTop=visual.heroRect?.y??0;
            const heroBottom=heroTop+(visual.heroRect?.height??0);
            if(!visual.copyRect||visual.copyRect.y<heroTop-2||visual.copyRect.y+visual.copyRect.height>heroBottom-12){
              throw new Error(`${name}: hero copy clipped ${JSON.stringify({hero:visual.heroRect,copy:visual.copyRect})}`);
            }
            const checks={
              logo:await page.locator('.header-logo-image').count(),
              hero:await page.locator('.screenshotHero').count(),
              primary:await page.locator('.hero-cta-test').count(),
              secondary:await page.locator('.hero-cta-qualify').count(),
              inventory:await page.locator('.screenshotInventory').count()
            };
            if(Object.values(checks).some(v=>v<1)) throw new Error(`${name}: mockup contract missing ${JSON.stringify(checks)}`);
            if(failed.length) throw new Error(`${name}: unexpected resource failures ${JSON.stringify(failed)}`);
            await page.screenshot({path:`visual-proof/${name}-home.png`,fullPage:true});
            await page.close();
          }
          await capture('desktop',1440,1000);
          await capture('mobile',390,844);
          await browser.close();
          NODE
          node visual-proof/capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: wdcc-cinematic-visual-proof
          path: visual-proof/*.png
          retention-days: 7
      - name: Require preview deployment credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: test -n "$VERCEL_TOKEN"
      - name: Install Vercel CLI
        run: npm install --global vercel@59.5.0
      - name: Link preview project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
      - name: Pull preview environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" --scope=cpxagency
      - name: Build preview artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --token="$VERCEL_TOKEN" --scope=cpxagency
      - name: Deploy preview only
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" --scope=cpxagency 2>&1 | tee /tmp/vercel-preview.log | grep -Eo 'https://[^ ]+\.vercel\.app' | tail -1)"
          test -n "$url"
          printf '%s\n' "$url" | tee preview-url.txt
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: wdcc-cinematic-preview-url
          path: preview-url.txt
          retention-days: 7
      - name: Summary
        run: |
          echo '### WDCC dev cinematic preview' >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Production aliases were not touched.' >> "$GITHUB_STEP_SUMMARY"
