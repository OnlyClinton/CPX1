name: WDCC Production Control Audit

on:
  # Intentionally unfiltered so this check always reports on every PR and can
  # safely be configured as a required status check on main.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject unguarded production-write lanes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          root=Path('.github/workflows')
          errors=[]
          dangerous=[]
          control_files={
              'wdcc-production-control-audit.yml',
              'wdcc-production-freeze-check.yml',
          }
          for path in sorted([*root.glob('*.yml'), *root.glob('*.yaml')]):
              if path.name in control_files:
                  continue
              text=path.read_text(errors='replace')
              low=text.lower()
              reasons=[]
              if re.search(r'\bvercel\s+alias\s+set\b', low):
                  reasons.append('vercel alias write')
              if 'dns_records/' in low and re.search(r'-x\s+(patch|put|post|delete)\b', low):
                  reasons.append('Cloudflare DNS write')
              if 'workers/routes' in low and re.search(r'-x\s+(patch|put|post|delete)\b', low):
                  reasons.append('Cloudflare route write')
              if 'wrangler deploy' in low and (
                  'wedontcarecars.com/*' in low or
                  'www.wedontcarecars.com/*' in low or
                  'dealer.wedontcarecars.com/*' in low or
                  ('zone_name' in low and 'wedontcarecars.com' in low)
              ):
                  reasons.append('Cloudflare production deploy')
              if re.search(r'\bvercel\b[^\n]*--prod\b', low):
                  reasons.append('Vercel production deploy')
              if not reasons:
                  continue

              dangerous.append((str(path), reasons))
              header=text.split('permissions:',1)[0]
              if re.search(r'(?m)^\s+push\s*:', header):
                  errors.append(f'{path}: production-write workflow may not have a push trigger')
              if re.search(r'(?m)^\s+pull_request\s*:', header):
                  errors.append(f'{path}: production-write workflow may not have a pull_request trigger')

              frozen='wdcc-production-freeze-check.yml' in text
              hardened_alias=(
                  path.name == 'emergency-vercel-alias-pin-2vfd.yml' and
                  'OWNER-APPROVED-2VFD' in text and
                  'release_control_issue' in text and
                  'verify-only' in text
              )
              hardened_owner_public_alias=(
                  path.name == 'wdcc-owner-promote-f68584.yml' and
                  'github.event.issue.number == 205' in text and
                  'github.event.comment.user.login == github.repository_owner' in text and
                  "github.event.comment.body == 'PROMOTE-WDCC-F68584-PUBLIC'" in text and
                  'DONOR_HOST: wdcc-v32-storefront-9n0nyfyk3-cpxagency.vercel.app' in text and
                  'APEX: wedontcarecars.com' in text and
                  'WWW: www.wedontcarecars.com' in text and
                  'dealer.wedontcarecars.com' not in low
              )
              if not (frozen or hardened_alias or hardened_owner_public_alias):
                  errors.append(f'{path}: production-write workflow lacks the approved #205 fail-closed gate')

          print('Dangerous active workflow signatures:')
          for path,reasons in dangerous:
              print(f'  {path}: {", ".join(reasons)}')
          if errors:
              print('\nCONTROL AUDIT FAILED:', file=sys.stderr)
              for error in errors:
                  print(f'  - {error}', file=sys.stderr)
              raise SystemExit(1)
          print('WDCC_PRODUCTION_CONTROL_AUDIT=PASS')
          PY
