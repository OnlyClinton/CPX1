name: WDCC Emergency Alias Recovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-emergency-alias-recovery.yml'
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM: cpxagency
      HEALTHY_ARTIFACT: wdcc-cpx-launch-b01un0onc-cpxagency.vercel.app
      DEALER_DOMAIN: dealer.wedontcarecars.com
    steps:
      - name: Require token
        run: test -n "$VERCEL_TOKEN"

      - name: Verify donor health before cutover
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/donor-health.json -w '%{http_code}' "https://$HEALTHY_ARTIFACT/api/health")"
          test "$code" = "200"
          jq -e '.ok == true and .degraded == false and .storage.ok == true' /tmp/donor-health.json >/dev/null
          curl -fsS "https://$HEALTHY_ARTIFACT/api/inventory" | jq -e '.ok == true' >/dev/null
          curl -fsSI "https://$HEALTHY_ARTIFACT/dealer/login" >/dev/null

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.3.0

      - name: Cut dealer domain to healthy artifact
        shell: bash
        run: |
          set -euo pipefail
          vercel alias set "$HEALTHY_ARTIFACT" "$DEALER_DOMAIN" --token="$VERCEL_TOKEN" --scope="$TEAM"

      - name: Verify production after cutover
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 20); do
            code="$(curl -sS -o /tmp/live-health.json -w '%{http_code}' "https://$DEALER_DOMAIN/api/health" || true)"
            if [ "$code" = "200" ] && jq -e '.ok == true and .degraded == false and .storage.ok == true' /tmp/live-health.json >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 3
          done
          test "$ok" = "1"
          curl -fsS "https://$DEALER_DOMAIN/api/inventory" | jq -e '.ok == true' >/dev/null
          curl -fsSI "https://$DEALER_DOMAIN/dealer/login" >/dev/null
          echo 'WDCC_DEALER_ALIAS_RECOVERY=PASS'
