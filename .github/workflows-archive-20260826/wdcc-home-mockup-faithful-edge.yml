roIn{min-height:610px;position:relative;z-index:2;display:flex;align-items:center}.refCopy{width:min(620px,47vw);padding:54px 0 44px}.refKicker{margin:0 0 13px;color:#57a9ec;font-size:10px;font-weight:950;text-transform:uppercase;letter-spacing:.13em}.refKicker:before{content:"";display:inline-block;width:34px;height:2px;background:var(--g);margin-right:10px;vertical-align:middle}.refHero h1{margin:0 0 18px;text-transform:uppercase;font-size:clamp(54px,5.7vw,88px);line-height:.87;letter-spacing:-.058em;font-weight:1000;text-shadow:0 6px 24px #000d}.refHero h1 .red{color:var(--r)}.refHero h1 .blue{color:var(--b)}.refLead{max-width:520px;margin:0;color:#eef3f7;font-size:15px;line-height:1.5;font-weight:650}.refActions{display:flex;gap:11px;flex-wrap:wrap;margin-top:22px}.refBtn{min-height:47px;padding:0 20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:950;text-transform:uppercase;letter-spacing:.04em}.refBtn.red{background:var(--r)}.refBtn.dark{background:#09131dcc;border:1px solid #8295a7}.refPhone{display:flex;align-items:center;gap:8px;margin-top:17px;font-size:11px;font-weight:950;text-transform:uppercase}.refPhone b{color:var(--r)}.refBenefitWrap{background:#fff;color:var(--i)}.refBenefits{width:min(1460px,calc(100% - 30px));margin:-1px auto 0;position:relative;z-index:8;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid #dfe3e7;border-radius:0 0 10px 10px;overflow:hidden;box-shadow:0 14px 36px #0002}.refBenefit{min-height:100px;padding:17px 18px;background:#fff;display:grid;grid-template-columns:42px minmax(0,1fr);align-items:center;gap:12px;border-right:1px solid #e0e4e8}.refBenefit:last-child{border-right:0}.refIcon{width:38px;height:38px;border:2px solid var(--r);border-radius:50%;display:grid;place-items:center;color:var(--r);font-weight:1000}.refBenefit strong{display:block;font-size:10px;font-weight:950;text-transform:uppercase}.refBenefit small{display:block;margin-top:4px;color:#65717c;font-size:9px;line-height:1.35}.refInventory{background:var(--p);color:var(--i);padding:40px 20px 50px}.refSecHead{margin-bottom:18px;display:flex;align-items:end;justify-content:space-between;gap:22px}.refSecHead small{display:block;color:#65717c;font-size:9px;font-weight:950;letter-spacing:.08em;text-transform:uppercase}.refSecHead h2{margin:4px 0;font-size:clamp(28px,3vw,42px);letter-spacing:-.045em}.refSecHead p{margin:0;color:#66717b;font-size:11px}.refViewAll{font-size:10px;font-weight:950;text-transform:uppercase}.refGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.refCard{background:#fff;border:1px solid #d7dde2;border-radius:7px;overflow:hidden;box-shadow:0 6px 18px #11182714}.refPhoto{display:block;aspect-ratio:1.38;background:#101820;overflow:hidden;position:relative}.refPhoto img{width:100%;height:100%;object-fit:cover}.refBadge{position:absolute;top:7px;left:7px;padding:4px 6px;border-radius:2px;background:#159052;color:#fff;font-size:7px;font-weight:950;text-transform:uppercase}.refBody{padding:11px 11px 12px}.refEy{margin:0 0 4px;color:#68727d;font-size:8px;font-weight:900;text-transform:uppercase}.refTitle{display:block;min-height:31px;color:#101820;font-size:13px;font-weight:950;line-height:1.2}.refPrice{display:block;margin-top:7px;color:#101820;font-size:21px;font-weight:1000}.refPay{margin:2px 0 0;color:#59636d;font-size:9px}.refPills{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}.refPills span{padding:4px 6px;border-radius:2px;background:#f0f2f4;color:#444e58;font-size:7px;font-weight:900}.refFinance{background:#07131e;padding:45px 20px 48px}.refFinance h2{margin:0 0 17px;font-size:29px;letter-spacing:-.04em;text-transform:uppercase;font-style:italic}.refFinance h2 span{color:var(--r)}.refSteps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.refStep{min-height:142px;padding:18px;border:1px solid #263746;border-radius:7px;background:#0d1b28}.refStep b{width:32px;height:32px;border-radius:50%;background:var(--r);display:grid;place-items:center;margin-bottom:12px}.refStep strong{display:block;font-size:10px;text-transform:uppercase}.refStep small{display:block;margin-top:6px;color:#c6d0d8;font-size:9px;line-height:1.4}.refTrustWrap{background:#fff;color:var(--i);padding:0 18px 22px}.refTrust{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid #dce2e7;border-radius:0 0 10px 10px;overflow:hidden}.refTrust article{min-height:86px;padding:15px;display:flex;align-items:center;border-right:1px solid #e0e4e7}.refTrust article:last-child{border-right:0}.refTrust b{font-size:9px;text-transform:uppercase}.refTrust span{display:block;color:#66717c;font-size:8px;margin-top:3px}.refFooter{background:#02060a;padding:24px 20px;color:#9ba7b2}.refFoot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:10px}
          @media(max-width:1100px){.refNav{gap:17px;font-size:9px}.refGrid{grid-template-columns:repeat(3,minmax(0,1fr))}.refCopy{width:min(580px,54vw)}}
          @media(max-width:820px){.refUtility{display:none}.refHeader{height:70px}.refHead{width:100%;padding:0 12px;grid-template-columns:64px minmax(0,1fr) 48px;gap:6px}.refLogo{grid-column:1;justify-self:start;width:60px;height:66px}.refLogo img{width:58px;height:58px}.refMenu{grid-column:3;display:grid;place-items:center;width:44px;height:44px;border:1px solid #2b4354;border-radius:10px;background:#0a1823;color:#fff;font-size:24px;justify-self:end}.refHeadCta{display:none}.refNav{position:absolute;z-index:120;left:10px;right:10px;top:70px;display:none;grid-template-columns:1fr 1fr;gap:2px;padding:8px;background:#07131ff8;border:1px solid #ffffff20;border-radius:12px;box-shadow:0 20px 50px #000d}.refNav.open{display:grid}.refNav a{min-height:44px;padding:0 12px;display:flex;align-items:center;color:#fff;font-size:10px}.refHero{min-height:610px;background-position:70% top;background-size:auto 610px}.refHeroIn{width:100%;min-height:610px;align-items:flex-end}.refCopy{width:100%;padding:275px 14px 24px;background:linear-gradient(0deg,#02060a 8%,#02060ade 56%,#02060a00 100%)}.refHero h1{font-size:clamp(41px,13vw,56px);line-height:.9;margin-bottom:14px}.refLead{font-size:14px;line-height:1.42}.refActions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:17px}.refBtn{min-height:46px;padding:0 12px;font-size:9px}.refPhone{display:none}.refBenefits{width:100%;margin:0;border-radius:0;grid-template-columns:repeat(4,minmax(0,1fr));box-shadow:none}.refBenefit{min-height:80px;padding:10px 6px;display:block;text-align:center}.refIcon{width:30px;height:30px;margin:0 auto 6px;font-size:13px}.refBenefit strong{font-size:7px}.refBenefit small{font-size:6.5px}.refInventory{padding:28px 12px 34px}.refGrid{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px}.refCard{min-width:78%;scroll-snap-align:start}.refSteps{grid-template-columns:1fr 1fr}.refTrust{grid-template-columns:1fr 1fr}}
          @media(max-width:520px){.refHeader{height:68px}.refNav{top:68px}.refHero{min-height:590px;background-position:70% top;background-size:auto 590px}.refHeroIn{min-height:590px}.refCopy{padding:262px 14px 22px}.refHero h1{font-size:clamp(40px,12.9vw,54px)}.refCard{min-width:82%}.refSteps{grid-template-columns:1fr}}
