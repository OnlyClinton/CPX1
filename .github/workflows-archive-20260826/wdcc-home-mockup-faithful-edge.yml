name: WDCC HOME MOCKUP FAITHFUL EDGE

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-home-mockup-faithful-edge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdcc-home-mockup-faithful-edge
  cancel-in-progress: true

env:
  ORIGIN: https://www.wedontcarecars.com
  APEX: https://wedontcarecars.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require Cloudflare authorization
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install Wrangler
        run: npm install --global wrangler@4.90.0 >/dev/null
      - name: Build exact screenshot-faithful edge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wdcc-reference-edge
          cat > /tmp/wdcc-reference-edge/worker.js <<'EOF'
          const ORIGIN='https://www.wedontcarecars.com';
          const CSS=`<style id="wdcc-reference-lock">
