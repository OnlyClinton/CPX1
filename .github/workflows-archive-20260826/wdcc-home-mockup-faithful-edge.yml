</div></section><section class="refInventory"><div class="refSecHead"><div><small>Featured inventory</small><h2>Vehicles ready now.</h2><p>Cash price and down payment shown clearly.</p></div><a class="refViewAll" href="/inventory">View all inventory →</a></div><div class="refGrid"><article class="refCard"><a class="refPhoto" href="/inventory/2004-nissan-350z"><img src="/assets/cars/2004-nissan-350z-1.webp" alt="2004 Nissan 350Z"><span class="refBadge">Available</span></a><div class="refBody"><p class="refEy">2004 Nissan</p><a class="refTitle" href="/inventory/2004-nissan-350z">350Z</a><strong class="refPrice">$4,900</strong><p class="refPay">$2,000 down · 154,000 miles</p><div class="refPills"><span>Car</span><span>RWD</span></div></div></article><article class="refCard"><a class="refPhoto" href="/inventory/2016-ford-f150-limited"><img src="/assets/cars/2016-ford-f150-limited-1.webp" alt="2016 Ford F-150"><span class="refBadge">Available</span></a><div class="refBody"><p class="refEy">2016 Ford</p><a class="refTitle" href="/inventory/2016-ford-f150-limited">F-150 Limited</a><strong class="refPrice">$15,000</strong><p class="refPay">$6,000 down · 164,000 miles</p><div class="refPills"><span>Truck</span><span>Automatic</span></div></div></article><article class="refCard"><a class="refPhoto" href="/inventory/2019-honda-pilot"><img src="/assets/cars/2019-honda-pilot-1.webp" alt="2019 Honda Pilot"><span class="refBadge">Available</span></a><div class="refBody"><p class="refEy">2019 Honda</p><a class="refTitle" href="/inventory/2019-honda-pilot">Pilot</a><strong class="refPrice">$7,900</strong><p class="refPay">$3,000 down · 380,000 miles</p><div class="refPills"><span>SUV</span><span>Automatic</span></div></div></article><article class="refCard"><a class="refPhoto" href="/inventory/2019-kia-sportage"><img src="/assets/cars/2019-kia-sportage-1.webp" alt="2019 Kia Sportage"><span class="refBadge">Available</span></a><div class="refBody"><p class="refEy">2019 Kia</p><a class="refTitle" href="/inventory/2019-kia-sportage">Sportage</a><strong class="refPrice">$6,500</strong><p class="refPay">$2,500 down · 127,000 miles</p><div class="refPills"><span>SUV</span><span>Automatic</span></div></div></article><article class="refCard"><a class="refPhoto" href="/inventory/2019-toyota-rav4"><img src="/assets/cars/2019-toyota-rav4-1.webp" alt="2019 Toyota RAV4"><span class="refBadge">Available</span></a><div class="refBody"><p class="refEy">2019 Toyota</p><a class="refTitle" href="/inventory/2019-toyota-rav4">RAV4</a><strong class="refPrice">$10,500</strong><p class="refPay">$4,500 down · 240,000 miles</p><div class="refPills"><span>SUV</span><span>Automatic</span></div></div></article></div></section><section class="refFinance" id="how"><div class="refFinanceIn"><h2>In-house financing <span>made easy</span></h2><div class="refSteps"><article class="refStep"><b>1</b><strong>Apply online</strong><small>Send basic details securely.</small></article><article class="refStep"><b>2</b><strong>Talk to Sean</strong><small>Confirm down payment and vehicle fit.</small></article><article class="refStep"><b>3</b><strong>Choose your car</strong><small>Shop our inventory online or in person.</small></article><article class="refStep"><b>4</b><strong>Drive today</strong><small>Schedule pickup or a test drive.</small></article></div></div></section><section class="refTrustWrap"><div class="refTrust"><article><div><b>Tampa Bay proud</b><span>Local dealer. Local community.</span></div></article><article><div><b>Straight answers</b><span>No runaround. No hidden fees.</span></div></article><article><div><b>Real people</b><span>Talk to Sean. Not a call center.</span></div></article><article><div><b>In-house financing</b><span>We make it happen when others can't.</span></div></article></div></section><footer class="refFooter"><div class="refFoot"><span>WDCC · We Don't Care Cars</span><span>Serving Tampa Bay · Confirm availability before visiting</span><a href="tel:+18135164752">813-516-4752</a></div></footer><script>document.getElementById('refMenu')?.addEventListener('click',()=>document.getElementById('refNav')?.classList.toggle('open'));</script></div>`;
          function target(request){const incoming=new URL(request.url);const out=new URL(ORIGIN);out.pathname=incoming.pathname;out.search=incoming.search;return out;}
          async function originFetch(request){const incoming=new URL(request.url),headers=new Headers(request.headers);headers.set('x-forwarded-host',incoming.host);headers.set('x-forwarded-proto','https');headers.delete('cf-worker');const init={method:request.method,headers,redirect:'manual'};if(!['GET','HEAD'].includes(request.method))init.body=request.body;const response=await fetch(new Request(target(request).toString(),init));return response;}
          class Head{element(el){el.append(CSS,{html:true})}}class Body{element(el){el.setInnerContent(BODY,{html:true})}}
          export default{async fetch(request){const incoming=new URL(request.url);const response=await originFetch(request);const outHeaders=new Headers(response.headers);const loc=outHeaders.get('location');if(loc){try{const u=new URL(loc,ORIGIN);if(u.hostname==='www.wedontcarecars.com'){u.hostname=incoming.hostname;u.protocol='https:';outHeaders.set('location',u.toString())}}catch{}}if(incoming.pathname!=='/'||(response.headers.get('content-type')||'').includes('text/html')===false)return new Response(response.body,{status:response.status,statusText:response.statusText,headers:outHeaders});const transformed=new HTMLRewriter().on('head',new Head()).on('body',new Body()).transform(response);const h=new Headers(transformed.headers);h.set('x-wdcc-reference-clone','1');h.set('cache-control','no-store,max-age=0');return new Response(transformed.body,{status:transformed.status,statusText:transformed.statusText,headers:h})}};
          EOF
          cat > /tmp/wdcc-reference-edge/wrangler.jsonc <<'EOF'
          {"name":"wdcc-home-sleek-edge","main":"worker.js","compatibility_date":"2026-08-25","routes":[{"pattern":"wedontcarecars.com/*","zone_name":"wedontcarecars.com"}]}
          EOF
      - name: Deploy canonical edge
        working-directory: /tmp/wdcc-reference-edge
        run: wrangler deploy
      - name: Verify apex body replacement and pass-through
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 30); do
            code="$(curl -sS -D /tmp/live.h -o /tmp/live.html -w '%{http_code}' "$APEX/?ref=$GITHUB_RUN_ID&attempt=$i" || true)"
            if [ "$code" = 200 ] && grep -qi 'x-wdcc-reference-clone: 1' /tmp/live.h && grep -q 'refHome' /tmp/live.html && grep -q 'Browse inventory' /tmp/live.html; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          curl -fsS "$APEX/inventory?ref=$GITHUB_RUN_ID" -o /tmp/inventory.html
          test -s /tmp/inventory.html
          curl -fsS "$APEX/wdcc-logo-transparent.webp" -o /tmp/logo.webp
          test -s /tmp/logo.webp
          echo 'WDCC_REFERENCE_EDGE_LIVE=PASS'
