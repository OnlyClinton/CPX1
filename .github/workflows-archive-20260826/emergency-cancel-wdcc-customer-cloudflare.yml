name: Emergency stop WDCC customer Cloudflare
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-cancel-wdcc-customer-cloudflare.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-frontdoor:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel customer Cloudflare front-door runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cancel_all(){
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$REPO/actions/runs?branch=main&per_page=100" > /tmp/runs.json
            jq -r '.workflow_runs[] | select(.path==".github/workflows/wdcc-cloudflare-frontdoor.yml" and (.status=="queued" or .status=="in_progress")) | .id' /tmp/runs.json | while read -r id; do
              [ -n "$id" ] || continue
              echo "Cancelling customer Cloudflare run $id"
              curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/repos/$REPO/actions/runs/$id/cancel" >/dev/null || true
            done
          }
          cancel_all
          sleep 5
          cancel_all
          echo "Customer-domain Cloudflare runs cancelled; exact 2vfD remains the visual lock."
