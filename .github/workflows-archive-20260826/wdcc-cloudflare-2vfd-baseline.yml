name: WDCC CLOUDFLARE 2VFD BASELINE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-cloudflare-2vfd-baseline.yml'

concurrency:
  group: wdcc-cloudflare-2vfd-baseline
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  DONOR_REF: recovered-2vfd-source
  DONOR_DIR: src

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact recovered 2vfD donor
        uses: actions/checkout@v4
        with:
          ref: recovered-2vfd-source

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Prove exact donor identity
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.name!=='wdcc-storefront'||p.version!=='1.0.0'||p.dependencies.next!=='16.2.6') process.exit(1)"
          test -s app/globals.css
          test "$(wc -c < app/globals.css)" -gt 90000
          echo '2VFD_DONOR_IDENTITY=PASS'

      - name: Install donor and Cloudflare adapter
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@1.19.9 wrangler@4.90.0
          cat > open-next.config.ts <<'EOF'
          import { defineCloudflareConfig } from "@opennextjs/cloudflare";
          export default defineCloudflareConfig();
          EOF
          cat > wrangler.jsonc <<'EOF'
          {
            "$schema": "./node_modules/wrangler/config-schema.json",
            "name": "wdcc-2vfd-baseline",
            "main": ".open-next/worker.js",
            "compatibility_date": "2026-08-25",
            "compatibility_flags": ["nodejs_compat"],
            "workers_dev": true,
            "assets": {
              "directory": ".open-next/assets",
              "binding": "ASSETS",
              "run_worker_first": true
            },
            "observability": {"enabled": true}
          }
          EOF

      - name: Build exact 2vfD donor
        working-directory: src
        run: npx opennextjs-cloudflare build

      - name: Deploy isolated 2vfD baseline
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/wdcc-2vfd-deploy.log

      - name: Verify 2vfD baseline
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wdcc-2vfd-deploy.log | tail -1)"
          test -n "$URL"
          for i in $(seq 1 20); do
            code="$(curl -sS -o /tmp/home.html -w '%{http_code}' "$URL/?baseline=2vfd-$GITHUB_RUN_ID" || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          [ "$code" = 200 ]
          grep -qi 'we don.t care' /tmp/home.html
          echo "2VFD_BASELINE_URL=$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact donor: dpl_2vfDGZg6erycSF6Pmwo6yPbFSaxp" >> "$GITHUB_STEP_SUMMARY"
