name: WDCC Dealer Ready Double Acceptance v3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wdcc-dealer-ready-double-acceptance-v3.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wdcc-dealer-ready-double-acceptance-v3
  cancel-in-progress: true
jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      AUTH_PROJECT: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
      DEALER: https://dealer.wedontcarecars.com
      STOREFRONT: https://wedontcarecars.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Pull production bindings from live auth backend project
        shell: bash
        run: |
          set -euo pipefail
          npm install --global vercel@59.3.0 >/dev/null
          mkdir -p /tmp/auth/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$AUTH_PROJECT" > /tmp/auth/.vercel/project.json
          cd /tmp/auth
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env pull /tmp/auth.env --yes --environment=production --token="$VERCEL_TOKEN" --scope=cpxagency >/dev/null
          grep -q '^BLOB_READ_WRITE_TOKEN=' /tmp/auth.env
          grep -q '^SESSION_SECRET=' /tmp/auth.env
      - name: Create short-lived authorized session against auth backend state
        shell: bash
        run: |
          set -euo pipefail
          set -a; . /tmp/auth.env; set +a
          node <<'NODE' > /tmp/session.env
          const crypto=require('crypto'),{get}=require('@vercel/blob');
          (async()=>{const r=await get('private/state/platform-v3.json',{access:'private',useCache:false,token:process.env.BLOB_READ_WRITE_TOKEN});if(!r||r.statusCode!==200||!r.stream)throw Error('STATE_READ_FAILED');const a=[];for await(const c of r.stream)a.push(c);const s=JSON.parse(Buffer.concat(a).toString());const roles=new Set(['dealer_agent','tenant_admin','platform_admin']);const u=(s.users||[]).find(x=>roles.has(String(x.role||'').toLowerCase())&&x.status!=='disabled'&&!x.disabled);if(!u)throw Error('NO_AUTHORIZED_USER');const raw=Buffer.from(JSON.stringify({id:u.id,role:u.role,exp:Date.now()+1800000})).toString('base64url');const sig=crypto.createHmac('sha256',process.env.SESSION_SECRET).update(raw).digest('base64url');console.log(`QA_COOKIE=${raw}.${sig}`)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          cat /tmp/session.env >> "$GITHUB_ENV"
      - name: Verify live dealer auth facade accepts session
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/session.json -w '%{http_code}' "$DEALER/api/auth/session" -H "Cookie: __Host-wdcc_session=$QA_COOKIE")"
          test "$code" = 200
          jq -e '.authenticated==true' /tmp/session.json >/dev/null
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify dealer routes and execute two full acceptances
        shell: bash
        run: |
          set -euo pipefail
          export RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node <<'NODE'
          const fs=require('fs'),{chromium}=require('playwright');
          const D=process.env.DEALER,S=process.env.STOREFRONT,C=process.env.QA_COOKIE,R=process.env.RUN_ID,wait=ms=>new Promise(r=>setTimeout(r,ms));
          const customer=/Bad credit\?|No credit\?|Vehicles ready now\./i;
          const dealer=/DEALER PORTAL|Inventory Operations|Dashboard|All Vehicles|Add \/ Edit Vehicle|Checking secure dealer session/i;
          async function req(ctx,method,url,data){const o={method,headers:{Cookie:`__Host-wdcc_session=${C}`}};if(data!==undefined){o.headers['content-type']='application/json';o.data=data}const r=await ctx.request.fetch(url,o);let x={};try{x=await r.json()}catch{}return[r,x]}
          async function waitDealer(ctx,id,status,label){for(let i=0;i<20;i++){const[r,x]=await req(ctx,'GET',D+'/api/inventory');if(!r.ok())throw Error(`${label}_DEALER_API_${r.status()}`);const v=(x.items||[]).find(v=>String(v.id)===String(id));if(v&&String(v.status||'').toLowerCase()===status)return v;await wait(1000)}throw Error(`${label}_DEALER_${status}_TIMEOUT`)}
          async function waitPublic(ctx,id,want,label){for(let i=0;i<25;i++){const r=await ctx.request.get(`${S}/api/inventory?dealer_ready=${R}-${Date.now()}`);if(!r.ok())throw Error(`${label}_PUBLIC_API_${r.status()}`);const x=await r.json(),has=(x.items||[]).some(v=>String(v.id)===String(id));if(has===want)return;await wait(1000)}throw Error(`${label}_PUBLIC_${want?'SHOW':'HIDE'}_TIMEOUT`)}
          async function archive(ctx,id,stock,label){const[r,x]=await req(ctx,'PATCH',`${D}/api/inventory/${encodeURIComponent(id)}`,{status:'archived',stock:`R36TEST-${stock}`.slice(0,120)});if(!r.ok())throw Error(`${label}_ARCHIVE_${r.status()}_${x.error||''}`);await waitDealer(ctx,id,'archived',label);await waitPublic(ctx,id,false,label)}
          (async()=>{fs.writeFileSync('/tmp/qa.png',Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9WlV1GQAAAAASUVORK5CYII=','base64'));const b=await chromium.launch({headless:true});const out={ok:false,routes:{},runs:[]};try{
            const anon=await b.newContext({viewport:{width:390,height:844}}),ap=await anon.newPage();for(const[k,path]of[['root','/'],['login','/dealer/login']]){const resp=await ap.goto(D+path,{waitUntil:'domcontentloaded',timeout:60000}),text=await ap.locator('body').innerText().catch(()=> '');if(!resp||resp.status()===404||resp.status()>=500||new URL(ap.url()).hostname!=='dealer.wedontcarecars.com'||customer.test(text))throw Error(`ROUTE_${k.toUpperCase()}_NOT_DEALER`);out.routes[k]={status:resp.status(),url:ap.url()}}await anon.close();
            const c=await b.newContext({viewport:{width:390,height:844}});await c.addCookies([{name:'__Host-wdcc_session',value:C,domain:'dealer.wedontcarecars.com',path:'/',httpOnly:true,secure:true,sameSite:'Strict'}]);const p=await c.newPage();for(const[k,path]of[['dashboard','/dealer/dashboard'],['inventory','/dealer/inventory'],['upload','/dealer/inventory/new']]){const resp=await p.goto(D+path,{waitUntil:'networkidle',timeout:60000}),text=await p.locator('body').innerText();if(!resp||resp.status()===404||resp.status()>=500||new URL(p.url()).hostname!=='dealer.wedontcarecars.com'||p.url().includes('/dealer/login')||customer.test(text)||!dealer.test(text))throw Error(`ROUTE_${k.toUpperCase()}_FAIL_${resp&&resp.status()}_${p.url()}`);out.routes[k]={status:resp.status(),url:p.url()}}
            for(let n=1;n<=2;n++){const stock=`WDCC-QA-READY-${R}-${n}`,model=`QA-READY-${R}-${n}`;let id='';try{await p.goto(D+'/dealer/dashboard',{waitUntil:'networkidle',timeout:60000});if(customer.test(await p.locator('body').innerText()))throw Error(`RUN${n}_DASHBOARD_STOREFRONT`);await p.goto(D+'/dealer/inventory/new',{waitUntil:'networkidle',timeout:60000});if(p.url().includes('/dealer/login'))throw Error(`RUN${n}_UPLOAD_AUTH_REDIRECT`);for(const[lab,val]of[['YEAR','2021'],['MAKE','Toyota'],['MODEL',model],['TRIM','AUTOMATED QA ONLY'],['PRICE','12345'],['DOWN PAYMENT','1500'],['MILEAGE','54321'],['STOCK #',stock]])await p.getByLabel(lab).fill(val);await p.getByLabel('DESCRIPTION').fill(`Automated WDCC dealer acceptance ${n}. QA ONLY - archive after verification.`);await p.locator('input[type=file][multiple]').first().setInputFiles('/tmp/qa.png');await p.getByRole('button',{name:/Save Draft/i}).first().click();await p.waitForURL(/\/dealer\/inventory\?saved=draft/,{timeout:60000});let[r,x]=await req(c,'GET',D+'/api/inventory'),v=(x.items||[]).find(v=>v.stock===stock);if(!r.ok()||!v)throw Error(`RUN${n}_DRAFT_MISSING`);id=String(v.id);if(String(v.status||'').toLowerCase()!=='draft'||!(v.photoPathnames||[]).length)throw Error(`RUN${n}_DRAFT_PHOTO_FAIL`);await waitPublic(c,id,false,`RUN${n}_DRAFT`);[r,x]=await req(c,'PATCH',`${D}/api/inventory/${encodeURIComponent(id)}`,{status:'published'});if(!r.ok())throw Error(`RUN${n}_PUBLISH_${r.status()}_${x.error||''}`);await waitDealer(c,id,'published',`RUN${n}_PUBLISH`);await waitPublic(c,id,true,`RUN${n}_PUBLISH`);const pub=await c.newPage();await pub.goto(`${S}/inventory?dealer_ready=${R}-${n}`,{waitUntil:'networkidle',timeout:60000});if(!(await pub.locator('body').innerText()).includes(model))throw Error(`RUN${n}_PUBLIC_UI_MISSING`);await pub.close();await archive(c,id,stock,`RUN${n}`);out.runs.push({run:n,id,draft:true,photo:true,published:true,dealerInventory:true,publicApi:true,publicUi:true,archived:true,publicRemoved:true})}catch(e){if(id)try{await archive(c,id,stock,`RUN${n}_FAILSAFE`)}catch{}throw e}}
            if(out.runs.length!==2)throw Error('DOUBLE_ACCEPTANCE_INCOMPLETE');out.ok=true;fs.writeFileSync('/tmp/result.json',JSON.stringify(out,null,2));await c.close()}finally{await b.close()}})().catch(e=>{fs.writeFileSync('/tmp/result.json',JSON.stringify({ok:false,error:String(e.message||e)},null,2));console.error(e);process.exit(1)});
          NODE
          cat /tmp/result.json
          jq -e '.ok==true and (.runs|length)==2 and all(.runs[];.draft and .photo and .published and .dealerInventory and .publicApi and .publicUi and .archived and .publicRemoved)' /tmp/result.json >/dev/null
      - run: echo 'WDCC_DEALER_READY_DOUBLE_ACCEPTANCE_V3=PASS'
# automation-probe: 2026-08-25T18:05:05Z
