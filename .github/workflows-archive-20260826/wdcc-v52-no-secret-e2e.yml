name: WDCC V52 No-Secret E2E
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-v52-no-secret-e2e.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Verify dealer V52 health and inventory
        id: health
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://dealer.wedontcarecars.com"
          curl -fsS "$BASE/api/health" -o /tmp/health.json
          jq -e '.ok == true and .degraded == false and .release == "WDCC-V52-LEAD-INVENTORY-CONTRACT"' /tmp/health.json >/dev/null
          curl -fsS "$BASE/api/inventory" -o /tmp/inventory-before.json
          jq -e '.ok == true and ((.items // []) | length > 0)' /tmp/inventory-before.json >/dev/null
          echo "inventory_before=$(jq '(.items // []) | length' /tmp/inventory-before.json)" >> "$GITHUB_OUTPUT"

      - name: Run three lead contracts on dealer V52
        id: leads
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://dealer.wedontcarecars.com"
          RUN="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          post_lead(){
            kind="$1"; source="$2"; suffix="$3"; phone="$4"
            curl -fsS -X POST "$BASE/api/leads" \
              -H 'content-type: application/json' \
              -H "idempotency-key: wdcc-v52-$suffix-$RUN" \
              --data "{\"kind\":\"$kind\",\"name\":\"WDCC V52 QA $suffix $RUN\",\"phone\":\"$phone\",\"email\":\"qa-$suffix-$RUN@invalid.example\",\"vehicleInterest\":\"Production contract QA\",\"preferredTime\":\"QA only\",\"message\":\"Automated V52 production contract verification\",\"consent\":true,\"source\":\"$source\"}"
          }
          post_lead schedule schedule-test-drive schedule 813-555-0101 > /tmp/schedule.json
          post_lead approval get-approved approval 813-555-0102 > /tmp/approval.json
          post_lead contact call-sean contact 813-555-0103 > /tmp/contact.json
          jq -e '.ok == true and .persisted == true and .item.kind == "schedule" and .item.source == "schedule-test-drive" and (.item.id|length>0)' /tmp/schedule.json >/dev/null
          jq -e '.ok == true and .persisted == true and .item.kind == "approval" and .item.source == "get-approved" and (.item.id|length>0)' /tmp/approval.json >/dev/null
          jq -e '.ok == true and .persisted == true and .item.kind == "contact" and .item.source == "call-sean" and (.item.id|length>0)' /tmp/contact.json >/dev/null
          for f in schedule approval contact; do
            echo "${f}_id=$(jq -r '.item.id' /tmp/$f.json)" >> "$GITHUB_OUTPUT"
            echo "${f}_source=$(jq -r '.item.source' /tmp/$f.json)" >> "$GITHUB_OUTPUT"
            echo "${f}_email=$(jq -r '.notifications.email // "unknown"' /tmp/$f.json)" >> "$GITHUB_OUTPUT"
            echo "${f}_sms=$(jq -r '.notifications.sms // "unknown"' /tmp/$f.json)" >> "$GITHUB_OUTPUT"
            echo "${f}_source_system=$(jq -r '.source // "unknown"' /tmp/$f.json)" >> "$GITHUB_OUTPUT"
          done

      - name: Verify idempotency for schedule lead
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://dealer.wedontcarecars.com"
          RUN="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl -fsS -X POST "$BASE/api/leads" \
            -H 'content-type: application/json' \
            -H "idempotency-key: wdcc-v52-schedule-$RUN" \
            --data "{\"kind\":\"schedule\",\"name\":\"WDCC V52 QA schedule $RUN\",\"phone\":\"813-555-0101\",\"email\":\"qa-schedule-$RUN@invalid.example\",\"vehicleInterest\":\"Production contract QA\",\"preferredTime\":\"QA only\",\"message\":\"Automated V52 production contract verification\",\"consent\":true,\"source\":\"schedule-test-drive\"}" > /tmp/dedupe.json
          jq -e '.ok == true and .deduplicated == true' /tmp/dedupe.json >/dev/null

      - name: Exercise vehicle create-to-publish proof on canonical ledger
        id: vehicle
        shell: bash
        run: |
          set -euo pipefail
          BACKEND="https://wdcc-cpx-launch-b01un0onc-cpxagency.vercel.app"
          curl -fsS -X POST "$BACKEND/api/qa-proof" -H 'content-type: application/json' --data '{}' > /tmp/vehicle-proof.json
          jq -e '.ok == true and .vehicle != null and .vehicle.status == "published" and .vehicle.stock == "R36TEST-QA-PROOF-20260824"' /tmp/vehicle-proof.json >/dev/null
          echo "vehicle_id=$(jq -r '.vehicle.id' /tmp/vehicle-proof.json)" >> "$GITHUB_OUTPUT"
          echo "vehicle_status=$(jq -r '.vehicle.status' /tmp/vehicle-proof.json)" >> "$GITHUB_OUTPUT"
          echo "ledger_leads=$(jq -r '.counts.leads' /tmp/vehicle-proof.json)" >> "$GITHUB_OUTPUT"
          echo "ledger_vehicles=$(jq -r '.counts.vehicles' /tmp/vehicle-proof.json)" >> "$GITHUB_OUTPUT"

      - name: Verify dealer reads same ledger after vehicle proof
        id: after
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://dealer.wedontcarecars.com"
          curl -fsS "$BASE/api/health" | jq -e '.ok == true and .degraded == false' >/dev/null
          curl -fsS "$BASE/api/inventory" -o /tmp/inventory-after.json
          jq -e '.ok == true and ((.items // []) | length > 0)' /tmp/inventory-after.json >/dev/null
          echo "inventory_after=$(jq '(.items // []) | length' /tmp/inventory-after.json)" >> "$GITHUB_OUTPUT"

      - name: Report E2E proof
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTH: ${{ steps.health.outcome }}
          LEADS: ${{ steps.leads.outcome }}
          VEHICLE: ${{ steps.vehicle.outcome }}
          AFTER: ${{ steps.after.outcome }}
          SCHEDULE_ID: ${{ steps.leads.outputs.schedule_id }}
          APPROVAL_ID: ${{ steps.leads.outputs.approval_id }}
          CONTACT_ID: ${{ steps.leads.outputs.contact_id }}
          SCHEDULE_EMAIL: ${{ steps.leads.outputs.schedule_email }}
          APPROVAL_EMAIL: ${{ steps.leads.outputs.approval_email }}
          CONTACT_EMAIL: ${{ steps.leads.outputs.contact_email }}
          SCHEDULE_SMS: ${{ steps.leads.outputs.schedule_sms }}
          APPROVAL_SMS: ${{ steps.leads.outputs.approval_sms }}
          CONTACT_SMS: ${{ steps.leads.outputs.contact_sms }}
          VEHICLE_ID: ${{ steps.vehicle.outputs.vehicle_id }}
          VEHICLE_STATUS: ${{ steps.vehicle.outputs.vehicle_status }}
          LEDGER_LEADS: ${{ steps.vehicle.outputs.ledger_leads }}
          LEDGER_VEHICLES: ${{ steps.vehicle.outputs.ledger_vehicles }}
        shell: bash
        run: |
          body=$(cat <<EOF
          Dealer V52 health/inventory: **$HEALTH**
          Three attributed lead contracts: **$LEADS**
          Canonical vehicle publish proof: **$VEHICLE**
          Post-write dealer health: **$AFTER**

          Schedule: \`$SCHEDULE_ID\` — email \`$SCHEDULE_EMAIL\` — sms \`$SCHEDULE_SMS\`
          Get approved: \`$APPROVAL_ID\` — email \`$APPROVAL_EMAIL\` — sms \`$APPROVAL_SMS\`
          Call Sean/contact: \`$CONTACT_ID\` — email \`$CONTACT_EMAIL\` — sms \`$CONTACT_SMS\`
          Vehicle: \`$VEHICLE_ID\` — status \`$VEHICLE_STATUS\`
          Canonical ledger after proof: leads \`$LEDGER_LEADS\`, vehicles \`$LEDGER_VEHICLES\`

          Dealer production: https://dealer.wedontcarecars.com/
          Remaining external blocker if apex still fails: Vercel domain assignment for https://wedontcarecars.com/
          EOF
          )
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC V52 no-secret E2E proof ${GITHUB_RUN_ID}" --body "$body" || true
