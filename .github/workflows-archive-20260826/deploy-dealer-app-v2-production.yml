name: WDCC DEALER PRODUCTION DEPLOY

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-dealer-app-v2-production.yml'

concurrency:
  group: wdcc-dealer-production
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
  VERCEL_PROJECT_ID: prj_We7xkAkB5Qy31Pt17USSkQFE0u7h
  VERCEL_SCOPE: cpxagency
  CANDIDATE_URL: wdcc-v32-storefront-g58j9f8w2-cpxagency.vercel.app
  ROLLBACK_URL: wdcc-cpx-launch-qhcvflfih-cpxagency.vercel.app
  BACKEND_URL: https://wdcc-cpx-launch-cpxagency.vercel.app
  DEALER_HOST: dealer.wedontcarecars.com
  CUSTOMER_HOST: www.wedontcarecars.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require Vercel authority
        run: test -n "$VERCEL_TOKEN"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@59.3.0

      - name: Link verified V32 screenshot project
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Verify canonical V53 backend before alias move
        run: |
          set -euo pipefail
          curl -fsS "$BACKEND_URL/api/health?dealer-alias-preflight=$GITHUB_RUN_ID" -o /tmp/backend-health.json
          jq -e '.ok == true and .degraded == false' /tmp/backend-health.json >/dev/null
          curl -fsS "$BACKEND_URL/api/inventory?dealer-alias-preflight=$GITHUB_RUN_ID" -o /tmp/backend-inventory.json
          jq -e '.ok == true and (.items | type == "array")' /tmp/backend-inventory.json >/dev/null
          curl -fsS "https://$CUSTOMER_HOST/api/health?dealer-alias-preflight=$GITHUB_RUN_ID" -o /tmp/customer-health.json
          jq -e '.ok == true and .backend == "healthy"' /tmp/customer-health.json >/dev/null

      - name: Verify exact screenshot frontend candidate
        shell: bash
        run: |
          set -euo pipefail
          vercel --scope "$VERCEL_SCOPE" curl /api/health --deployment "$CANDIDATE_URL" > /tmp/candidate-health.json
          jq -e '.ok == true' /tmp/candidate-health.json >/dev/null
          vercel --scope "$VERCEL_SCOPE" curl /api/inventory --deployment "$CANDIDATE_URL" > /tmp/candidate-inventory.json
          jq -e '.ok == true and (.items | type == "array") and (.items | length > 0)' /tmp/candidate-inventory.json >/dev/null
          for path in /dealer /dealer/login /dealer/dashboard /dealer/inventory/new; do
            vercel --scope "$VERCEL_SCOPE" curl "$path" --deployment "$CANDIDATE_URL" > /tmp/candidate-page.html
            test -s /tmp/candidate-page.html
          done
          echo 'WDCC_DEALER_FRONTEND_CANDIDATE=PASS'

      - name: Point dealer alias to verified screenshot frontend
        id: alias_cutover
        run: |
          set -euo pipefail
          vercel alias set "$CANDIDATE_URL" "$DEALER_HOST" --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"

      - name: Verify live dealer frontend and V53 proxy
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 30); do
            health_code="$(curl -sS -L -o /tmp/dealer-health.json -w '%{http_code}' "https://$DEALER_HOST/api/health?release=$GITHUB_RUN_ID" || true)"
            login_code="$(curl -sS -L -o /tmp/dealer-login.html -w '%{http_code}' "https://$DEALER_HOST/dealer/login?release=$GITHUB_RUN_ID" || true)"
            if [ "$health_code" = 200 ] && [ "$login_code" = 200 ] && jq -e '.ok == true' /tmp/dealer-health.json >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1

          curl -fsS "https://$DEALER_HOST/api/inventory?release=$GITHUB_RUN_ID" -o /tmp/dealer-inventory.json
          jq -e '.ok == true and (.items | type == "array") and (.items | length > 0)' /tmp/dealer-inventory.json >/dev/null

          for path in /dealer /dealer/login /dealer/dashboard /dealer/inventory/new; do
            code="$(curl -sS -L -o /dev/null -w '%{http_code}' "https://$DEALER_HOST$path")"
            test "$code" = 200
          done

          curl -fsS "https://$CUSTOMER_HOST/api/health?dealer-release=$GITHUB_RUN_ID" -o /tmp/customer-health.json
          jq -e '.ok == true and .backend == "healthy"' /tmp/customer-health.json >/dev/null
          curl -fsS "https://$CUSTOMER_HOST/api/inventory?dealer-release=$GITHUB_RUN_ID" -o /tmp/customer-inventory.json
          jq -e '.ok == true and (.items | type == "array") and (.items | length > 0)' /tmp/customer-inventory.json >/dev/null
          echo 'WDCC_DEALER_ALIAS_CONTRACT=PASS'

      - name: Restore canonical dealer alias if verification fails
        if: failure() && steps.alias_cutover.outcome != 'skipped'
        run: |
          set +e
          vercel alias set "$ROLLBACK_URL" "$DEALER_HOST" --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"

      - name: Report pass
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC dealer screenshot frontend PASS ${GITHUB_RUN_ID}" --body "Dealer alias: \`$DEALER_HOST\`\nFrontend: \`$CANDIDATE_URL\`\nCanonical V53 backend remained healthy: **PASS**\nDealer health + inventory + login + dashboard + Add/Edit route: **PASS**\nCustomer storefront backend proxy remained healthy: **PASS**\nNo new Vercel deployment was required." || true

      - name: Report fail
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC dealer screenshot frontend FAIL ${GITHUB_RUN_ID}" --body "Alias-only dealer cutover failed. Dealer alias was restored to the proven canonical V53 deployment if it had moved." || true
