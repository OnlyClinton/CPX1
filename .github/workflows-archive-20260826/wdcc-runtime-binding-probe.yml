name: WDCC Runtime Binding Probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-runtime-binding-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      PHOENIX_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
      DEALER_ID: prj_fz5mN7Q5gImZ9UGpv1GDpHxPtLNB
      B01: https://wdcc-cpx-launch-b01un0onc-cpxagency.vercel.app
      STOREFRONT: https://wedontcarecars.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --global vercel@59.3.0 >/dev/null

      - name: Probe Phoenix Blob separately from session secret
        id: phoenix
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$PHOENIX_ID" > .vercel/project.json
          cat > .probe.mjs <<'NODE'
          import {get} from '@vercel/blob';
          const session=String(process.env.SESSION_SECRET||'').length>=32;
          let blob=false,error=null,counts=null;
          try{const r=await get('private/state/platform-v3.json',{access:'private',useCache:false,token:process.env.BLOB_READ_WRITE_TOKEN});if(r&&r.statusCode===200&&r.stream){const c=[];for await(const x of r.stream)c.push(x);const s=JSON.parse(Buffer.concat(c).toString('utf8'));blob=true;counts={users:(s.users||[]).length,vehicles:(s.vehicles||[]).length,leads:(s.leads||[]).length,revision:Number(s.revision||0)}}}catch(e){error=String(e?.message||e)}
          console.log('PROBE='+JSON.stringify({sessionConfigured:session,blobReadable:blob,error,counts}));
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope=cpxagency -- node .probe.mjs | tee /tmp/phoenix.log
          grep '^PROBE=' /tmp/phoenix.log | tail -1 | cut -d= -f2- >/tmp/phoenix.json
          cat /tmp/phoenix.json | jq .
          echo "session=$(jq -r '.sessionConfigured' /tmp/phoenix.json)" >> "$GITHUB_OUTPUT"
          echo "blob=$(jq -r '.blobReadable' /tmp/phoenix.json)" >> "$GITHUB_OUTPUT"
          echo "error=$(jq -r '.error // ""' /tmp/phoenix.json)" >> "$GITHUB_OUTPUT"

      - name: Probe dealer project's runtime bindings
        id: dealer
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$DEALER_ID" > .vercel/project.json
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope=cpxagency -- node .probe.mjs | tee /tmp/dealer.log
          grep '^PROBE=' /tmp/dealer.log | tail -1 | cut -d= -f2- >/tmp/dealer.json
          cat /tmp/dealer.json | jq .
          echo "session=$(jq -r '.sessionConfigured' /tmp/dealer.json)" >> "$GITHUB_OUTPUT"
          echo "blob=$(jq -r '.blobReadable' /tmp/dealer.json)" >> "$GITHUB_OUTPUT"
          echo "error=$(jq -r '.error // ""' /tmp/dealer.json)" >> "$GITHUB_OUTPUT"

      - name: Prove b01 runtime lead write
        id: b01
        shell: bash
        run: |
          set -euo pipefail
          RUN="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          code="$(curl -sS -o /tmp/b01.json -w '%{http_code}' -X POST "$B01/api/leads" -H 'content-type: application/json' -H "idempotency-key: wdcc-qa-b01-$RUN" --data "{\"qa\":true,\"kind\":\"schedule\",\"name\":\"WDCC QA B01 $RUN\",\"phone\":\"813-555-0161\",\"email\":\"qa-b01-$RUN@invalid.example\",\"vehicleInterest\":\"B01 runtime proof\",\"message\":\"Automated QA - do not contact\",\"consent\":true,\"source\":\"b01-authority-probe\"}")"
          cat /tmp/b01.json | jq .
          test "$code" = 200 -o "$code" = 201
          jq -e '.ok==true and .persisted==true and .item.kind=="schedule" and .item.source=="b01-authority-probe"' /tmp/b01.json >/dev/null
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "id=$(jq -r '.item.id' /tmp/b01.json)" >> "$GITHUB_OUTPUT"
          echo "qa=$(jq -r '.qa // .item.qa // false' /tmp/b01.json)" >> "$GITHUB_OUTPUT"

      - name: Prove storefront routes lead to persistence
        id: storefront
        shell: bash
        run: |
          set -euo pipefail
          RUN="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          submit(){ k="$1";s="$2";x="$3";p="$4";curl -sS -X POST "$STOREFRONT/api/leads" -H 'content-type: application/json' -H "idempotency-key: wdcc-qa-store-$x-$RUN" --data "{\"qa\":true,\"kind\":\"$k\",\"name\":\"WDCC QA STORE $x $RUN\",\"phone\":\"$p\",\"email\":\"qa-store-$x-$RUN@invalid.example\",\"vehicleInterest\":\"Storefront runtime proof\",\"message\":\"Automated QA - do not contact\",\"consent\":true,\"source\":\"$s\"}";}
          submit schedule schedule-test-drive schedule 813-555-0162 >/tmp/s.json
          submit approval get-approved approval 813-555-0163 >/tmp/a.json
          submit contact call-sean contact 813-555-0164 >/tmp/c.json
          for f in s a c; do cat /tmp/$f.json | jq .; jq -e '.ok==true and .persisted==true and (.item.id|length>0)' /tmp/$f.json >/dev/null; done
          jq -e '.item.kind=="schedule" and .item.source=="schedule-test-drive"' /tmp/s.json >/dev/null
          jq -e '.item.kind=="approval" and .item.source=="get-approved"' /tmp/a.json >/dev/null
          jq -e '.item.kind=="contact" and .item.source=="call-sean"' /tmp/c.json >/dev/null
          echo "schedule=$(jq -r '.item.id' /tmp/s.json)" >> "$GITHUB_OUTPUT"
          echo "approval=$(jq -r '.item.id' /tmp/a.json)" >> "$GITHUB_OUTPUT"
          echo "contact=$(jq -r '.item.id' /tmp/c.json)" >> "$GITHUB_OUTPUT"
          echo "authority=$(jq -r '.source // "unknown"' /tmp/s.json)" >> "$GITHUB_OUTPUT"

      - name: Report binding probe
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          P_SESSION: ${{ steps.phoenix.outputs.session }}
          P_BLOB: ${{ steps.phoenix.outputs.blob }}
          P_ERROR: ${{ steps.phoenix.outputs.error }}
          D_SESSION: ${{ steps.dealer.outputs.session }}
          D_BLOB: ${{ steps.dealer.outputs.blob }}
          D_ERROR: ${{ steps.dealer.outputs.error }}
          B01: ${{ steps.b01.outcome }}
          B01_CODE: ${{ steps.b01.outputs.code }}
          B01_ID: ${{ steps.b01.outputs.id }}
          STORE: ${{ steps.storefront.outcome }}
          SCHEDULE: ${{ steps.storefront.outputs.schedule }}
          APPROVAL: ${{ steps.storefront.outputs.approval }}
          CONTACT: ${{ steps.storefront.outputs.contact }}
          AUTHORITY: ${{ steps.storefront.outputs.authority }}
        run: |
          body=$(printf 'Status: **%s**\nPhoenix runtime: session `%s`, blob `%s`, error `%s`\nDealer runtime: session `%s`, blob `%s`, error `%s`\nb01 lead write: `%s` HTTP `%s` id `%s`\nStorefront 3 lead writes: `%s` schedule `%s`, approval `%s`, contact `%s`, response authority `%s`' "$STATUS" "$P_SESSION" "$P_BLOB" "$P_ERROR" "$D_SESSION" "$D_BLOB" "$D_ERROR" "$B01" "$B01_CODE" "$B01_ID" "$STORE" "$SCHEDULE" "$APPROVAL" "$CONTACT" "$AUTHORITY")
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC runtime binding probe ${GITHUB_RUN_ID}" --body "$body" || true

# No deployment or secret output. QA records use invalid.example and qa=true.
