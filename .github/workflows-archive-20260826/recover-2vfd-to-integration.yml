name: Recover Exact 2vfD To Integration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-2vfd-to-integration.yml'
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      DEPLOYMENT_ID: dpl_2vfDGZg6erycSF6Pmwo6yPbFSaxp
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require Vercel token
        run: test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN missing" >&2; exit 78; }
      - name: Recover exact donor files from Vercel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/2vfd && mkdir -p /tmp/2vfd
          curl -fsSL -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments/$DEPLOYMENT_ID/files?teamId=$VERCEL_TEAM_ID" > /tmp/files.json
          cat >/tmp/recover.mjs <<'EOF'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const token=process.env.VERCEL_TOKEN, team=process.env.VERCEL_TEAM_ID, dep=process.env.DEPLOYMENT_ID;
          const tree=JSON.parse(await fs.readFile('/tmp/files.json','utf8'));
          const files=[];
          function walk(nodes,prefix=''){
            for(const n of nodes||[]){
              const p=prefix?`${prefix}/${n.name}`:n.name;
              if(n.type==='directory') walk(n.children||[],p);
              else if(n.type==='file'&&n.uid) files.push({...n,path:p});
            }
          }
          walk(tree);
          for(const f of files){
            const url=`https://api.vercel.com/v8/deployments/${dep}/files/${f.uid}?teamId=${encodeURIComponent(team)}`;
            const r=await fetch(url,{headers:{Authorization:`Bearer ${token}`}});
            if(!r.ok) throw new Error(`${f.path}: ${r.status}`);
            const txt=await r.text();
            let parsed; try{parsed=JSON.parse(txt)}catch{parsed=txt}
            const b64=typeof parsed==='string'?parsed:(parsed?.data??parsed?.content??parsed?.file??parsed?.value);
            if(typeof b64!=='string') throw new Error(`${f.path}: unknown response`);
            const out=path.join('/tmp/2vfd',f.path);
            await fs.mkdir(path.dirname(out),{recursive:true});
            await fs.writeFile(out,Buffer.from(b64,'base64'));
          }
          await fs.writeFile('/tmp/2vfd/.wdcc-visual-donor',`${dep}\n`);
          console.log(`Recovered ${files.length} files from ${dep}`);
          EOF
          node /tmp/recover.mjs
      - name: Replace integration branch with recovered donor
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin wdcc-2vfd-integration
          git checkout -B wdcc-2vfd-integration origin/wdcc-2vfd-integration
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/2vfd/. ./
          git config user.name "WDCC Recovery Bot"
          git config user.email "wdcc-recovery@users.noreply.github.com"
          git add -A
          git commit -m "[2vfd-recovered] Exact Vercel donor source" || true
          git push --force origin HEAD:wdcc-2vfd-integration
