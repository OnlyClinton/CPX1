name: WDCC Trigger Storage Repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-trigger-storage-repair.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical storage repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wdcc-repair-storage-bindings.yml --repo "$GITHUB_REPOSITORY" --ref main
