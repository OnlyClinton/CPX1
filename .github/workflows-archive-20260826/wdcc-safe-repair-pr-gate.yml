name: WDCC Safe Repair PR Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/wdcc-safe-repair-trigger'

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: wdcc-safe-repair-pr-gate
  cancel-in-progress: false

env:
  TEAM: cpxagency
  ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
  PHOENIX_PROJECT: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
  STOREFRONT_PROJECT: prj_We7xkAkB5Qy31Pt17USSkQFE0u7h
  DEALER_PROJECT: prj_fz5mN7Q5gImZ9UGpv1GDpHxPtLNB
  CANDIDATE_SHA: 188392c81696da5d0d61f5c6f0bec45f490a232d
  ROLLBACK_SHA: d6c886ec252441ae46f7a7eb166521b2f5f09492
  LIVE: https://wdcc-cpx-launch-cpxagency.vercel.app
  STORE_ID: store_cNUyQRVlXtyvZQ5N
  QA1: QA-LOAD-32819132897-1
  QA2: QA-LOAD-32819198581-1

jobs:
  safe-repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout immutable candidate only
        uses: actions/checkout@v4
        with:
          ref: 188392c81696da5d0d61f5c6f0bec45f490a232d
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Repair candidate authority and close exact QA leak
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -n "$VERCEL_TOKEN"
          npm ci
          npm install --global vercel@59.3.0 >/dev/null
          rm -rf /tmp/node_modules
          ln -s "$PWD/node_modules" /tmp/node_modules

          code="$(curl -sS -o /tmp/live-before.json -w '%{http_code}' "$LIVE/api/health?prsafe=$GITHUB_RUN_ID")"
          test "$code" = 200
          jq -e --arg sha "$ROLLBACK_SHA" '.ok==true and .degraded==false and .commit==$sha' /tmp/live-before.json >/dev/null

          cat >/tmp/probe.mjs <<'NODE'
          import {get} from '@vercel/blob';
          const r=await get('private/state/platform-v3.json',{access:'private',useCache:false});
          if(!r||r.statusCode!==200||!r.stream) throw Error('STATE_READ_FAILED');
          const chunks=[]; for await(const c of r.stream) chunks.push(c);
          const s=JSON.parse(Buffer.concat(chunks).toString('utf8'));
          if(!Array.isArray(s.users)||!Array.isArray(s.leads)||!Array.isArray(s.vehicles)) throw Error('STATE_CONTRACT_INVALID');
          const q=new Set(['QA-LOAD-32819132897-1','QA-LOAD-32819198581-1']);
          console.log(JSON.stringify({ok:true,revision:Number(s.revision||0),qa:(s.vehicles||[]).filter(v=>q.has(String(v.stock||''))).map(v=>({id:v.id,stock:v.stock,status:v.status}))}));
          NODE

          source_project=''
          for p in "$PHOENIX_PROJECT" "$DEALER_PROJECT" "$STOREFRONT_PROJECT"; do
            d="/tmp/src-$p"; rm -rf "$d"; mkdir -p "$d/.vercel"
            printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$p" > "$d/.vercel/project.json"
            (cd "$d" && vercel env pull "$d/env" --yes --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" >/dev/null 2>&1) || continue
            grep -q '^SESSION_SECRET=' "$d/env" || continue
            grep -q '^BLOB_READ_WRITE_TOKEN=' "$d/env" || continue
            if (set -a; . "$d/env"; set +a; node /tmp/probe.mjs > "$d/probe.json" && jq -e '.ok==true' "$d/probe.json" >/dev/null); then
              cp "$d/env" /tmp/authority.env
              cp "$d/probe.json" /tmp/authority-probe.json
              source_project="$p"
              break
            fi
          done
          test -n "$source_project" || { echo 'NO_WORKING_STATIC_AUTHORITY' >&2; exit 78; }
          set -a; . /tmp/authority.env; set +a
          echo "::add-mask::$BLOB_READ_WRITE_TOKEN"
          echo "::add-mask::$SESSION_SECRET"
          echo "authority=$source_project" >> "$GITHUB_OUTPUT"
          cat /tmp/authority-probe.json

          rm -rf .vercel .next
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$PHOENIX_PROJECT" > .vercel/project.json
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" >/dev/null
          vercel build --prod --token="$VERCEL_TOKEN" --scope="$TEAM" >/dev/null
          out="$(vercel deploy --prebuilt --prod --skip-domain \
            --env "BLOB_READ_WRITE_TOKEN=$BLOB_READ_WRITE_TOKEN" \
            --env "SESSION_SECRET=$SESSION_SECRET" \
            --env "BLOB_STORE_ID=$STORE_ID" \
            --token="$VERCEL_TOKEN" --scope="$TEAM" 2>&1)"
          printf '%s\n' "$out"
          candidate="$(printf '%s\n' "$out" | grep -Eo 'https://wdcc-cpx-launch-[a-z0-9]+-cpxagency\.vercel\.app' | head -1 || true)"
          test -n "$candidate"
          echo "$candidate" >/tmp/candidate-url.txt
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"

          good=0
          for i in $(seq 1 20); do
            code="$(curl -sS -o /tmp/candidate-before.json -w '%{http_code}' "$candidate/api/health?prsafe=$GITHUB_RUN_ID&try=$i" || true)"
            if [ "$code" = 200 ] && jq -e --arg sha "$CANDIDATE_SHA" '.ok==true and .degraded==false and .storage=="token" and .state=="readable" and .commit==$sha' /tmp/candidate-before.json >/dev/null 2>&1; then good=1; break; fi
            sleep 2
          done
          cat /tmp/candidate-before.json
          test "$good" = 1

          curl -fsS "$candidate/api/inventory?qa_filter_before=$GITHUB_RUN_ID" -o /tmp/candidate-inventory-before.json
          jq -e --arg a "$QA1" --arg b "$QA2" '.ok==true and ([.items[]? | select(.stock==$a or .stock==$b)] | length)==0' /tmp/candidate-inventory-before.json >/dev/null

          cat >/tmp/archive.mjs <<'NODE'
          import crypto from 'node:crypto';
          import {get,head,put,BlobPreconditionFailedError} from '@vercel/blob';
          const path='private/state/platform-v3.json';
          const stocks=new Set(['QA-LOAD-32819132897-1','QA-LOAD-32819198581-1']);
          let result=null;
          for(let attempt=1;attempt<=3;attempt++){
            const h=await head(path);
            const r=await get(path,{access:'private',useCache:false});
            if(!r||r.statusCode!==200||!r.stream) throw Error('STATE_READ_FAILED');
            const chunks=[]; for await(const c of r.stream) chunks.push(c);
            const raw=Buffer.concat(chunks), s=JSON.parse(raw.toString('utf8'));
            const matches=(s.vehicles||[]).filter(v=>stocks.has(String(v.stock||'')));
            const pending=matches.filter(v=>String(v.status||'').toLowerCase()!=='archived');
            if(!pending.length){result={ok:true,noOp:true,revision:Number(s.revision||0),found:matches.map(v=>({id:v.id,stock:v.stock,status:v.status}))};break;}
            const now=new Date().toISOString();
            const backup=`private/state/backups/platform-v3-pre-qa-load-archive-r${Number(s.revision||0)}-${crypto.randomUUID()}.json`;
            await put(backup,raw,{access:'private',addRandomSuffix:false,allowOverwrite:false,contentType:'application/json'});
            const archived=[];
            s.vehicles=(s.vehicles||[]).map(v=>{if(!stocks.has(String(v.stock||'')))return v; archived.push({id:v.id,stock:v.stock,fromStatus:v.status}); return {...v,status:'archived',qa:true,updatedAt:now,qaCleanupAt:now};});
            s.audit=Array.isArray(s.audit)?s.audit:[];
            s.audit.push({id:crypto.randomUUID(),at:now,action:'qa.load_inventory.archive_exact',actor:'github-actions',run:process.env.GITHUB_RUN_ID||null,stocks:[...stocks],vehicleIds:archived.map(x=>x.id),backup});
            s.revision=Number(s.revision||0)+1; s.updatedAt=now;
            try{
              await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:h.etag});
              result={ok:true,noOp:false,revision:s.revision,archived,backup}; break;
            }catch(e){if(e instanceof BlobPreconditionFailedError && attempt<3) continue; throw e;}
          }
          if(!result) throw Error('QA_ARCHIVE_NO_RESULT');
          console.log(JSON.stringify(result));
          NODE
          GITHUB_RUN_ID="$GITHUB_RUN_ID" node /tmp/archive.mjs | tee /tmp/qa-cleanup.json
          jq -e '.ok==true' /tmp/qa-cleanup.json >/dev/null

          for base in "$LIVE" "$candidate"; do
            curl -fsS "$base/api/inventory?qa_verify=$GITHUB_RUN_ID" -o /tmp/inventory-check.json
            jq -e --arg a "$QA1" --arg b "$QA2" '.ok==true and ([.items[]? | select(.stock==$a or .stock==$b)] | length)==0' /tmp/inventory-check.json >/dev/null
          done
          code="$(curl -sS -o /tmp/live-after.json -w '%{http_code}' "$LIVE/api/health?prsafe_after=$GITHUB_RUN_ID")"
          test "$code" = 200
          jq -e --arg sha "$ROLLBACK_SHA" '.ok==true and .degraded==false and .commit==$sha' /tmp/live-after.json >/dev/null
          code="$(curl -sS -o /tmp/candidate-after.json -w '%{http_code}' "$candidate/api/health?prsafe_after=$GITHUB_RUN_ID")"
          test "$code" = 200
          jq -e --arg sha "$CANDIDATE_SHA" '.ok==true and .degraded==false and .state=="readable" and .commit==$sha' /tmp/candidate-after.json >/dev/null
          echo 'SAFE_REPAIR_PR_GATE=PASS'

      - name: Report evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          AUTHORITY: ${{ steps.repair.outputs.authority }}
          CANDIDATE: ${{ steps.repair.outputs.candidate }}
        shell: bash
        run: |
          h='not captured'; [ -f /tmp/candidate-after.json ] && h="$(cat /tmp/candidate-after.json)"
          c='not captured'; [ -f /tmp/qa-cleanup.json ] && c="$(cat /tmp/qa-cleanup.json)"
          l='not captured'; [ -f /tmp/live-after.json ] && l="$(cat /tmp/live-after.json)"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC safe repair PR gate ${GITHUB_RUN_ID}" --body "Frozen SHA: \`$CANDIDATE_SHA\`
Status: **$STATUS**
Authority: \`${AUTHORITY:-not-found}\`
Candidate: \`${CANDIDATE:-not-created}\`
No project env, alias, DNS, Cloudflare route, storefront domain, or dealer domain was changed.
Candidate health: \`$h\`
QA cleanup: \`$c\`
Live health: \`$l\`" || true

      - name: Dispatch controlled frozen-candidate E2E
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wdcc-candidate-local-e2e.yml --repo "$GITHUB_REPOSITORY" --ref main
