name: WDCC Dealer Frontdoor Watchdog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-dealer-frontdoor-watchdog.yml'
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: wdcc-dealer-frontdoor-watchdog
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LIVE_WORKER: wdcc-dealer-frontdoor
      KNOWN_GOOD_VERSION: 49f77a46-5fb0-405f-9a79-298c9729b85d
    steps:
      - name: Detect route drift and self-heal only when needed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DEALER='https://dealer.wedontcarecars.com'

          healthy(){
            local tag="$1" drift=0
            api_code="$(curl -sS -D /tmp/api.h -o /tmp/api.json -w '%{http_code}' "$DEALER/api/health?watchdog=${GITHUB_RUN_ID}-${tag}" || true)"
            [ "$api_code" = 200 ] || drift=1
            jq -e '.ok==true and .degraded==false and .service=="wdcc-canonical-authority"' /tmp/api.json >/dev/null 2>&1 || drift=1
            grep -qi '^x-wdcc-edge: cloudflare-dealer-target-v3' /tmp/api.h || drift=1
            grep -qi '^x-wdcc-origin: wdcc-cpx-launch-qhcvflfih-cpxagency.vercel.app' /tmp/api.h || drift=1

            ui_code="$(curl -sS -D /tmp/ui.h -L -o /tmp/ui.html -w '%{http_code}' "$DEALER/dealer?watchdog=${GITHUB_RUN_ID}-${tag}" || true)"
            [ "$ui_code" = 200 ] || drift=1
            grep -q 'RUN YOUR DEALERSHIP' /tmp/ui.html || drift=1
            grep -q 'targetDealerLogin' /tmp/ui.html || drift=1
            grep -qi '^x-wdcc-edge: cloudflare-dealer-target-v3' /tmp/ui.h || drift=1
            grep -qi '^x-wdcc-origin: wdcc-dealer-portal.vercel.app' /tmp/ui.h || drift=1
            [ "$drift" = 0 ]
          }

          if healthy initial; then
            echo 'WDCC dealer frontdoor healthy; no mutation.'
            exit 0
          fi

          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo 'Dealer drift detected; restoring known-good Target V3 Worker before recertification.'
          npx --yes wrangler@4.90.0 versions deploy "$KNOWN_GOOD_VERSION@100%" --name "$LIVE_WORKER" -y --message "watchdog immediate Target V3 restore $GITHUB_RUN_ID"

          restored=0
          for i in $(seq 1 15); do
            if healthy "restore-$i"; then restored=1; break; fi
            sleep 2
          done
          test "$restored" = 1

          # Re-run the full canonical owner after immediate recovery. If that
          # workflow hits a propagation false-negative, its rollback point is
          # now this already-good Target V3 version rather than a stale V52 one.
          gh workflow run wdcc-dealer-target-frontdoor-v3.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "WDCC dealer frontdoor drift healed ${GITHUB_RUN_ID}" \
            --body "Watchdog detected dealer frontdoor drift, immediately restored known-good Target V3 Worker version $KNOWN_GOOD_VERSION, verified UI+API recovery, then dispatched full Target V3 recertification. Expected UI origin: wdcc-dealer-portal.vercel.app. Expected API origin: wdcc-cpx-launch-qhcvflfih-cpxagency.vercel.app. Customer storefront routing was not modified." || true
