name: WDCC Blob Binding Diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wdcc-blob-binding-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Diagnose candidate blob bindings without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          npm install --global vercel@59.3.0 >/dev/null
          for spec in dealer:prj_fz5mN7Q5gImZ9UGpv1GDpHxPtLNB auth:prj_a3oclCcy4sbA2tge4BX7VAKXE4KR; do
            name=${spec%%:*}; id=${spec#*:}; d=/tmp/$name; mkdir -p "$d/.vercel"; printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$id" > "$d/.vercel/project.json"; cd "$d";
            env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env pull "/tmp/$name.env" --yes --environment=production --token="$VERCEL_TOKEN" --scope=cpxagency >/dev/null;
            echo "=== $name ===";
            set -a; . "/tmp/$name.env"; set +a;
            node <<'NODE'
            const {get}=require('@vercel/blob');
            const candidates={BLOB_READ_WRITE_TOKEN:process.env.BLOB_READ_WRITE_TOKEN,WDCC_MEDIA_BLOB_READ_WRITE_TOKEN:process.env.WDCC_MEDIA_BLOB_READ_WRITE_TOKEN};
            (async()=>{for(const [k,t] of Object.entries(candidates)){if(!t){console.log(`${k}=MISSING`);continue}console.log(`${k}_LEN=${t.length}`);console.log(`${k}_FORMAT=${/^vercel_blob_rw_[A-Za-z0-9]+_[A-Za-z0-9]+$/.test(t)?'CANONICAL':'NONCANONICAL'}`);try{const r=await get('private/state/platform-v3.json',{access:'private',useCache:false,token:t});console.log(`${k}_STATE=${r&&r.statusCode===200?'READABLE':`STATUS_${r&&r.statusCode}`}`)}catch(e){console.log(`${k}_STATE_ERROR=${String(e&&e.message||e).replace(/[^A-Za-z0-9:_ -]/g,'').slice(0,120)}`)}}})().catch(e=>{console.error(e);process.exit(1)});
            NODE
            unset BLOB_READ_WRITE_TOKEN WDCC_MEDIA_BLOB_READ_WRITE_TOKEN SESSION_SECRET || true
          done
