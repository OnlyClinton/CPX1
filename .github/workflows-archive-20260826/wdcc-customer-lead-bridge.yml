name: WDCC Customer Lead Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-customer-lead-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wdcc-customer-lead-bridge-live
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CUSTOMER: https://wedontcarecars.com
      DEALER: https://dealer.wedontcarecars.com
      API_ORIGIN: https://wdcc-cpx-launch-qhcvflfih-cpxagency.vercel.app
      WORKER: wdcc-customer-lead-bridge
      PATTERN: wedontcarecars.com/api/leads*
      TEAM: cpxagency
      TEAM_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      PHOENIX_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_API_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prove immutable authority and storefront baseline
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ZONE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VERCEL_TOKEN; do test -n "${!v:-}" || { echo "missing $v" >&2; exit 20; }; done
          test "$(curl -sS -o /tmp/backend-health.json -w '%{http_code}' "$API_ORIGIN/api/health?lead_bridge=$GITHUB_RUN_ID")" = 200
          jq -e '.ok==true and .degraded==false and .service=="wdcc-canonical-authority" and .release=="WDCC-V53-CANONICAL"' /tmp/backend-health.json >/dev/null
          test "$(curl -sS -L -o /tmp/customer-before.html -w '%{http_code}' "$CUSTOMER/?lead_bridge_before=$GITHUB_RUN_ID")" = 200
          grep -q 'intro-sequence intro-impact' /tmp/customer-before.html
          grep -q 'mobile-action-bar' /tmp/customer-before.html
          echo ok=true >> "$GITHUB_OUTPUT"

      - name: Install repair runtime
        run: |
          set -euo pipefail
          npm ci
          npm install --global wrangler@4.90.0 vercel@59.5.0 >/dev/null
          mkdir -p /tmp/lead-bridge .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$TEAM_ID" "$PHOENIX_ID" > .vercel/project.json

      - name: Build lead-only bridge
        shell: bash
        working-directory: /tmp/lead-bridge
        run: |
          set -euo pipefail
          cat > worker.js <<'EOF'
          const API='https://wdcc-cpx-launch-qhcvflfih-cpxagency.vercel.app';
          const CUSTOMER='https://wedontcarecars.com';
          function headersFor(req){const h=new Headers();for(const n of ['accept','accept-language','content-type','idempotency-key','user-agent','x-wdcc-request-id']){const v=req.headers.get(n);if(v)h.set(n,v)}h.set('origin',CUSTOMER);h.set('x-forwarded-host','wedontcarecars.com');h.set('x-forwarded-proto','https');h.set('x-wdcc-frontdoor','customer-lead-v53');return h}
          export default{async fetch(req){const u=new URL(req.url);if(!u.pathname.startsWith('/api/leads'))return new Response('Not found',{status:404});const target=new URL(API);target.pathname=u.pathname;target.search=u.search;try{const init={method:req.method,headers:headersFor(req),redirect:'manual'};if(!['GET','HEAD'].includes(req.method))init.body=req.body;const r=await fetch(target.toString(),init),h=new Headers(r.headers);h.set('cache-control','no-store');h.set('x-wdcc-edge','customer-lead-v53');h.set('x-wdcc-origin',target.hostname);return new Response(r.body,{status:r.status,statusText:r.statusText,headers:h})}catch(e){return Response.json({ok:false,persisted:false,error:'canonical_lead_authority_unavailable'},{status:503,headers:{'cache-control':'no-store','x-wdcc-edge':'customer-lead-v53'}})}}};
          EOF
          cat > wrangler.jsonc <<EOF
          {"name":"$WORKER","main":"worker.js","compatibility_date":"2026-08-25","compatibility_flags":["global_fetch_strictly_public"],"workers_dev":true,"preview_urls":true,"observability":{"enabled":true}}
          EOF

      - name: Stage bridge and prove direct canonical lead persistence
        id: stage
        shell: bash
        working-directory: /tmp/lead-bridge
        run: |
          set -euo pipefail
          wrangler deploy 2>&1 | tee /tmp/bridge-stage.log
          URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/bridge-stage.log | tail -1)"; test -n "$URL"; echo "url=$URL" >> "$GITHUB_OUTPUT"
          KEY="wdcc-qa-bridge-stage-$GITHUB_RUN_ID"; BODY="$(jq -nc --arg r "$GITHUB_RUN_ID" '{qa:true,kind:"schedule",name:("WDCC QA BRIDGE STAGE "+$r),phone:"813-555-0197",email:("bridge-stage-"+$r+"@invalid.example"),vehicleInterest:"Lead bridge stage",message:"Automated WDCC contract verification",consent:true,source:"schedule-test-drive",pagePath:"/qa/bridge-stage"}')"
          CODE="$(curl -sS -D /tmp/stage.h -o /tmp/stage.json -w '%{http_code}' -H 'content-type: application/json' -H "Idempotency-Key: $KEY" -X POST "$URL/api/leads" --data "$BODY")"; case "$CODE" in 200|201);;*) cat /tmp/stage.json;exit 1;;esac
          jq -e '.ok==true and .persisted==true and .item.id!=null' /tmp/stage.json >/dev/null
          jq -r '.item.id' /tmp/stage.json >/tmp/stage-lead-id
          grep -qi '^x-wdcc-origin: wdcc-cpx-launch-qhcvflfih-cpxagency.vercel.app' /tmp/stage.h
          echo ok=true >> "$GITHUB_OUTPUT"

      - name: Create disposable dealer verifier
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          export RUN_TAG="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > .wdcc-bridge-user.mjs <<'NODE'
          import crypto from'node:crypto';import fs from'node:fs';import{get,head,put,BlobPreconditionFailedError}from'@vercel/blob';const path='private/state/platform-v3.json',run=process.env.RUN_TAG;async function stable(){for(let i=0;i<8;i++){const a=await head(path),r=await get(path,{access:'private',useCache:false});if(!r?.stream)throw Error('READ');const c=[];for await(const x of r.stream)c.push(x);const raw=Buffer.concat(c),b=await head(path);if(a.etag===b.etag)return{etag:b.etag,s:JSON.parse(raw.toString())}}throw Error('HOT')}for(let n=1;n<=6;n++){const b=await stable(),s=b.s,password=`Bridge-${crypto.randomBytes(18).toString('base64url')}!`,salt=crypto.randomBytes(24),digest=crypto.scryptSync(password,salt,64),hash=`scrypt$${salt.toString('base64url')}$${digest.toString('base64url')}`,id=`bridge-${crypto.randomUUID()}`,email=`bridge-${run}@invalid.example`,now=new Date().toISOString();s.users=Array.isArray(s.users)?s.users:[];s.users.push({id,email,username:email,displayName:`WDCC Bridge ${run}`,role:'dealer_agent',tenantId:'wdcc',status:'active',disabled:false,passwordHash:hash});s.revision=Number(s.revision||0)+1;s.updatedAt=now;try{await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:b.etag});fs.writeFileSync('/tmp/bridge.env',`QA_ID=${id}\nQA_EMAIL=${email}\nQA_PASSWORD=${password}\nRUN_TAG=${run}\n`);console.log(JSON.stringify({ok:true,id}));process.exit(0)}catch(e){if(e instanceof BlobPreconditionFailedError&&n<6)continue;throw e}}
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- node .wdcc-bridge-user.mjs
          set -a;. /tmp/bridge.env;set +a;printf '::add-mask::%s\n' "$QA_PASSWORD";echo ok=true >> "$GITHUB_OUTPUT"

      - name: Capture route state and bind lead-only route
        id: bind
        shell: bash
        working-directory: /tmp/lead-bridge
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_ZONE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=wedontcarecars.com&account.id=$CLOUDFLARE_ACCOUNT_ID&per_page=50" -o /tmp/zones.json
          ZONE="$(jq -r '.result[0].id' /tmp/zones.json)";test -n "$ZONE";echo "$ZONE" >/tmp/zone-id
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_ZONE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE/workers/routes" -o /tmp/routes-before.json
          jq -c --arg p "$PATTERN" '[.result[]?|select(.pattern==$p)]' /tmp/routes-before.json >/tmp/existing-route.json
          node - <<'NODE'
          const fs=require('fs'),p='wrangler.jsonc',c=JSON.parse(fs.readFileSync(p));c.workers_dev=true;c.routes=[{pattern:process.env.PATTERN,zone_name:'wedontcarecars.com'}];fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')
          NODE
          wrangler deploy >/tmp/bridge-live.log 2>&1
          sleep 3
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_ZONE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE/workers/routes" -o /tmp/routes-after.json
          ROUTE_ID="$(jq -r --arg p "$PATTERN" --arg s "$WORKER" '.result[]?|select(.pattern==$p and .script==$s)|.id' /tmp/routes-after.json | head -1)";test -n "$ROUTE_ID";echo "$ROUTE_ID" >/tmp/route-id
          echo ok=true >> "$GITHUB_OUTPUT"

      - name: Prove three public lead paths and dealer readback
        id: live
        shell: bash
        run: |
          set -euo pipefail
          set -a;. /tmp/bridge.env;set +a;printf '::add-mask::%s\n' "$QA_PASSWORD"
          payload="$(jq -nc --arg u "$QA_EMAIL" --arg p "$QA_PASSWORD" '{username:$u,email:$u,password:$p}')"
          LOGIN="$(curl -sS -c /tmp/dealer.cookies -o /tmp/login.json -w '%{http_code}' -H 'content-type: application/json' -X POST "$DEALER/api/auth/login" --data "$payload")";test "$LOGIN" = 200;jq -e '.ok==true' /tmp/login.json >/dev/null
          : >/tmp/live-lead-ids
          for spec in 'schedule schedule-test-drive' 'approval get-approved' 'contact call-sean';do set -- $spec;kind="$1";source="$2";KEY="wdcc-qa-bridge-${kind}-${RUN_TAG}";BODY="$(jq -nc --arg k "$kind" --arg s "$source" --arg r "$RUN_TAG" '{qa:true,kind:$k,name:("WDCC QA BRIDGE "+$k+" "+$r),phone:"813-555-0197",email:("bridge-"+$k+"-"+$r+"@invalid.example"),vehicleInterest:"Customer lead bridge",message:"Automated WDCC contract verification",consent:true,source:$s,pagePath:("/qa/bridge-"+$k)}')";CODE="$(curl -sS -D "/tmp/${kind}.h" -o "/tmp/${kind}.json" -w '%{http_code}' -H 'content-type: application/json' -H "Idempotency-Key: $KEY" -X POST "$CUSTOMER/api/leads" --data "$BODY")";case "$CODE" in 200|201);;*)echo "$kind HTTP $CODE";cat "/tmp/${kind}.json";exit 1;;esac;jq -e '.ok==true and .persisted==true and .item.id!=null' "/tmp/${kind}.json" >/dev/null;grep -qi '^x-wdcc-edge: customer-lead-v53' "/tmp/${kind}.h";jq -r '.item.id' "/tmp/${kind}.json" >>/tmp/live-lead-ids;done
          FEED="$(curl -sS -b /tmp/dealer.cookies -o /tmp/dealer-leads.json -w '%{http_code}' "$DEALER/api/leads")";test "$FEED" = 200
          while read -r id;do jq -e --arg id "$id" 'any((.items//[])[];.id==$id)' /tmp/dealer-leads.json >/dev/null;done </tmp/live-lead-ids
          test "$(curl -sS -L -o /tmp/customer-after.html -w '%{http_code}' "$CUSTOMER/?lead_bridge_after=$GITHUB_RUN_ID")" = 200
          grep -q 'intro-sequence intro-impact' /tmp/customer-after.html;grep -q 'mobile-action-bar' /tmp/customer-after.html
          echo "login=$LOGIN" >> "$GITHUB_OUTPUT";echo "feed=$FEED" >> "$GITHUB_OUTPUT";echo ok=true >> "$GITHUB_OUTPUT"

      - name: Cleanup QA users and leads
        if: always()
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          ids="$(cat /tmp/stage-lead-id /tmp/live-lead-ids 2>/dev/null | paste -sd, - || true)";uid='';[ -f /tmp/bridge.env ]&&{ set -a;. /tmp/bridge.env;set +a;uid="$QA_ID";};export QA_ID="$uid" LEAD_IDS="$ids"
          cat > .wdcc-bridge-clean.mjs <<'NODE'
          import crypto from'node:crypto';import{get,head,put,BlobPreconditionFailedError}from'@vercel/blob';const path='private/state/platform-v3.json',uid=process.env.QA_ID||'',ids=new Set((process.env.LEAD_IDS||'').split(',').filter(Boolean));async function stable(){for(let i=0;i<8;i++){const a=await head(path),r=await get(path,{access:'private',useCache:false});if(!r?.stream)throw Error('READ');const c=[];for await(const x of r.stream)c.push(x);const raw=Buffer.concat(c),b=await head(path);if(a.etag===b.etag)return{etag:b.etag,s:JSON.parse(raw.toString())}}throw Error('HOT')}for(let n=1;n<=6;n++){const b=await stable(),s=b.s,u=(s.users||[]).length,l=(s.leads||[]).length,now=new Date().toISOString();s.users=(s.users||[]).filter(x=>x.id!==uid);s.leads=(s.leads||[]).filter(x=>!ids.has(x.id));s.audit=Array.isArray(s.audit)?s.audit:[];s.audit.push({id:crypto.randomUUID(),at:now,action:'qa.customer_lead_bridge.cleanup',actor:'github-actions',userId:uid,leadCount:ids.size});s.revision=Number(s.revision||0)+1;s.updatedAt=now;try{await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:b.etag});console.log(JSON.stringify({ok:true,removedUsers:u-s.users.length,removedLeads:l-s.leads.length,revision:s.revision}));process.exit(0)}catch(e){if(e instanceof BlobPreconditionFailedError&&n<6)continue;throw e}}
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- node .wdcc-bridge-clean.mjs | tee /tmp/bridge-clean.log
          grep -q '"ok":true' /tmp/bridge-clean.log;echo ok=true >> "$GITHUB_OUTPUT"

      - name: Publish repair evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          STAGE: ${{ steps.stage.outputs.ok }}
          IDENTITY: ${{ steps.identity.outputs.ok }}
          BIND: ${{ steps.bind.outputs.ok }}
          LIVE: ${{ steps.live.outputs.ok }}
          LOGIN: ${{ steps.live.outputs.login }}
          FEED: ${{ steps.live.outputs.feed }}
          CLEAN: ${{ steps.cleanup.outputs.ok }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC customer lead bridge $GITHUB_RUN_ID" --body "Overall: **$STATUS**\nImmutable V53 staging lead persistence: **${STAGE:-false}**\nLead-only Cloudflare route bound: **${BIND:-false}**\nThree public lead paths + dealer readback: **${LIVE:-false}**\nDealer login/feed: \`${LOGIN:-?}/${FEED:-?}\`\nQA cleanup: **${CLEAN:-false}**\n\nRoute: \`$PATTERN -> $WORKER\`. Customer storefront HTML baseline is checked before and after. No storefront visual deployment or alias change is performed." || true
