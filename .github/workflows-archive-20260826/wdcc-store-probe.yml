name: WDCC Store Probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-store-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      PROJECT_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --global vercel@59.3.0 >/dev/null
      - name: Link Phoenix for OIDC environment
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$PROJECT_ID" > .vercel/project.json
      - name: Probe candidate stores for canonical ledger paths
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          cat > .wdcc-store-probe.mjs <<'NODE'
          import {list} from '@vercel/blob';
          const stores=[
            ['wdcc-live-20260824-013607','store_WtHRfeknoGWfBJaG'],
            ['wdcc-live-20260824-012925','store_p3tfLnQ5WvnqNbOJ'],
            ['wdcc-v10-20260819-194257','store_cNUyQRVlXtyvZQ5N'],
            ['wdcc-clean-20260819-173749','store_vVJ5kU6x76yZVkGs'],
            ['wdcc-rescue-20260819-172412','store_KopvAQeMcatdS5DS'],
            ['wdcc-private-20260801-013053','store_A0xNekR2GnstDXyZ'],
            ['wdcc-private-20260801005157','store_LdMSV1550BRgc0SP'],
            ['wdcc-production-1785324309','store_Vlt7vqRfSvpRxwxQ']
          ];
          const oidc=process.env.VERCEL_OIDC_TOKEN||'';
          const results=[];
          for(const [name,storeId] of stores){
            try{
              const r=await list({prefix:'private/state/',limit:200,oidcToken:oidc||undefined,storeId});
              const paths=(r.blobs||[]).map(b=>b.pathname);
              results.push({name,storeId,ok:true,count:paths.length,canonical:paths.includes('private/state/platform-v3.json'),paths:paths.slice(0,40)});
            }catch(e){results.push({name,storeId,ok:false,error:String(e?.message||e)});}
          }
          console.log('OIDC_PRESENT='+Boolean(oidc));
          console.log('STORE_RESULTS='+JSON.stringify(results));
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope=cpxagency -- node .wdcc-store-probe.mjs | tee /tmp/probe.log
          grep '^STORE_RESULTS=' /tmp/probe.log | tail -1 | cut -d= -f2- > /tmp/results.json
          cat /tmp/results.json | jq .
          echo "canonical_count=$(jq '[.[]|select(.canonical==true)]|length' /tmp/results.json)" >> "$GITHUB_OUTPUT"
      - name: Report read-only store probe
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          data='not captured'; [ -f /tmp/results.json ] && data="$(cat /tmp/results.json)"
          body=$(printf 'Read-only candidate-store probe. No storage or deployment mutation.\n\n```json\n%s\n```' "$data")
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC Blob store probe ${GITHUB_RUN_ID}" --body "$body" || true

# Read-only. Explicit existing store IDs only; no creation, deletion, connection, or write operations.
