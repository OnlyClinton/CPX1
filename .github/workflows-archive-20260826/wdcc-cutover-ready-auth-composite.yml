name: WDCC Cutover READY Auth Composite
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-cutover-ready-auth-composite.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cutover:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM: cpxagency
      CANDIDATE: wdcc-v32-storefront-9x6w64q3k-cpxagency.vercel.app
      FALLBACK: wdcc-v32-storefront-mqfvbvl65-cpxagency.vercel.app
      APEX: wedontcarecars.com
      WWW: www.wedontcarecars.com
    steps:
      - name: Install Vercel CLI
        run: npm install --global vercel@59.3.0 >/dev/null
      - name: Preflight READY candidate
        shell: bash
        run: |
          set -euo pipefail
          for p in / /dealer /admin /api/health; do
            out="$(vercel curl "$p" --deployment "$CANDIDATE" -- --silent --output /tmp/body --write-out '%{http_code}')"
            code="$(printf '%s' "$out" | tail -c 3)"
            echo "$p => $code"
            test "$code" = 200
          done
          auth="$(vercel curl /api/auth/login --deployment "$CANDIDATE" -- --silent --request POST --header 'Origin: https://wedontcarecars.com' --header 'Content-Type: application/json' --data '{"email":"probe-no-user@invalid.example","password":"nope"}' --write-out '\nHTTP:%{http_code}')"
          printf '%s\n' "$auth"
          printf '%s' "$auth" | grep -q 'invalid_credentials'
          printf '%s' "$auth" | grep -q 'HTTP:401'
          ! printf '%s' "$auth" | grep -q 'No blob credentials found'
      - name: Cut over apex and www with rollback
        shell: bash
        run: |
          set -euo pipefail
          rollback(){
            vercel alias set "$FALLBACK" "$APEX" --token="$VERCEL_TOKEN" --scope="$TEAM" >/dev/null 2>&1 || true
            vercel alias set "$FALLBACK" "$WWW" --token="$VERCEL_TOKEN" --scope="$TEAM" >/dev/null 2>&1 || true
          }
          trap rollback ERR
          vercel alias set "$CANDIDATE" "$APEX" --token="$VERCEL_TOKEN" --scope="$TEAM"
          vercel alias set "$CANDIDATE" "$WWW" --token="$VERCEL_TOKEN" --scope="$TEAM"
          sleep 5
          for p in / /dealer /admin /api/health; do
            code="$(curl -sS -L -o /tmp/live-body -w '%{http_code}' "https://$APEX$p")"
            echo "$p => $code"
            test "$code" = 200
          done
          h="$(curl -sS "https://$APEX/api/health")"
          printf '%s\n' "$h"
          printf '%s' "$h" | jq -e '.ok==true and .degraded==false' >/dev/null
          auth="$(curl -sS -o /tmp/auth.json -w '%{http_code}' -H 'Origin: https://wedontcarecars.com' -H 'Content-Type: application/json' -X POST "https://$APEX/api/auth/login" --data '{"email":"probe-no-user@invalid.example","password":"nope"}')"
          echo "auth => $auth"
          test "$auth" = 401
          jq -e '.error=="invalid_credentials"' /tmp/auth.json >/dev/null
          trap - ERR
          echo 'WDCC_READY_AUTH_CUTOVER=PASS'
