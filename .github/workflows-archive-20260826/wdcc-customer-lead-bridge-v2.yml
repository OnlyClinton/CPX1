name: WDCC Customer Lead Bridge V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-customer-lead-bridge-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wdcc-customer-lead-bridge-v2-live
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CUSTOMER: https://wedontcarecars.com
      DEALER: https://dealer.wedontcarecars.com
      API_ORIGIN: https://wdcc-cpx-launch-qhcvflfih-cpxagency.vercel.app
      WORKER: wdcc-customer-lead-bridge
      PATTERN: wedontcarecars.com/api/leads*
      TEAM: cpxagency
      TEAM_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      PHOENIX_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_API_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prove immutable authority and current storefront baseline
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ZONE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VERCEL_TOKEN; do test -n "${!v:-}" || exit 20; done
          test "$(curl -sS -o /tmp/backend.json -w '%{http_code}' "$API_ORIGIN/api/health?bridge_v2=$GITHUB_RUN_ID")" = 200
          jq -e '.ok==true and .degraded==false and .service=="wdcc-canonical-authority" and .release=="WDCC-V53-CANONICAL"' /tmp/backend.json >/dev/null
          test "$(curl -sS -L -o /tmp/customer-before.html -w '%{http_code}' "$CUSTOMER/?bridge_v2_before=$GITHUB_RUN_ID")" = 200
          grep -q 'class="refHome"' /tmp/customer-before.html
          grep -q 'class="refHero"' /tmp/customer-before.html
          grep -q 'class="refBenefits"' /tmp/customer-before.html
          echo ok=true >> "$GITHUB_OUTPUT"

      - name: Install runtime
        run: |
          set -euo pipefail
          npm ci
          npm install --global wrangler@4.90.0 vercel@59.5.0 >/dev/null
          mkdir -p /tmp/bridge .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$TEAM_ID" "$PHOENIX_ID" > .vercel/project.json

      - name: Build and stage canonical lead bridge
        id: stage
        shell: bash
        working-directory: /tmp/bridge
        run: |
          set -euo pipefail
          cat > worker.js <<'EOF'
          const API='https://wdcc-cpx-launch-qhcvflfih-cpxagency.vercel.app',CUSTOMER='https://wedontcarecars.com';
          function hs(r){const h=new Headers();for(const n of ['accept','accept-language','content-type','idempotency-key','user-agent','x-wdcc-request-id']){const v=r.headers.get(n);if(v)h.set(n,v)}h.set('origin',CUSTOMER);h.set('x-forwarded-host','wedontcarecars.com');h.set('x-forwarded-proto','https');h.set('x-wdcc-frontdoor','customer-lead-v53');return h}
          export default{async fetch(r){const u=new URL(r.url);if(!u.pathname.startsWith('/api/leads'))return new Response('Not found',{status:404});const t=new URL(API);t.pathname=u.pathname;t.search=u.search;try{const i={method:r.method,headers:hs(r),redirect:'manual'};if(!['GET','HEAD'].includes(r.method))i.body=r.body;const x=await fetch(t.toString(),i),h=new Headers(x.headers);h.set('cache-control','no-store');h.set('x-wdcc-edge','customer-lead-v53');h.set('x-wdcc-origin',t.hostname);return new Response(x.body,{status:x.status,statusText:x.statusText,headers:h})}catch{return Response.json({ok:false,persisted:false,error:'canonical_lead_authority_unavailable'},{status:503,headers:{'cache-control':'no-store','x-wdcc-edge':'customer-lead-v53'}})}}};
          EOF
          cat > wrangler.jsonc <<EOF
          {"name":"$WORKER","main":"worker.js","compatibility_date":"2026-08-25","compatibility_flags":["global_fetch_strictly_public"],"workers_dev":true,"preview_urls":true,"observability":{"enabled":true}}
          EOF
          wrangler deploy 2>&1 | tee /tmp/stage.log
          URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/stage.log|tail -1)";test -n "$URL";echo "url=$URL" >> "$GITHUB_OUTPUT"
          KEY="wdcc-qa-bridge-v2-stage-$GITHUB_RUN_ID";BODY="$(jq -nc --arg r "$GITHUB_RUN_ID" '{qa:true,kind:"schedule",name:("WDCC QA BRIDGE V2 STAGE "+$r),phone:"813-555-0197",email:("bridge-v2-stage-"+$r+"@invalid.example"),vehicleInterest:"Bridge V2",message:"Automated WDCC contract verification",consent:true,source:"schedule-test-drive",pagePath:"/qa/bridge-v2-stage"}')"
          CODE="$(curl -sS -D /tmp/stage.h -o /tmp/stage.json -w '%{http_code}' -H 'content-type: application/json' -H "Idempotency-Key: $KEY" -X POST "$URL/api/leads" --data "$BODY")";case "$CODE" in 200|201);;*)cat /tmp/stage.json;exit 1;;esac
          jq -e '.ok==true and .persisted==true and .item.id!=null' /tmp/stage.json >/dev/null;grep -qi '^x-wdcc-origin: wdcc-cpx-launch-qhcvflfih-cpxagency.vercel.app' /tmp/stage.h
          jq -r '.item.id' /tmp/stage.json >/tmp/stage-lead-id
          echo ok=true >> "$GITHUB_OUTPUT"

      - name: Create disposable dealer verifier from Phoenix state
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          export RUN_TAG="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > .bridge-user.mjs <<'NODE'
          import crypto from'node:crypto';import fs from'node:fs';import{get,head,put,BlobPreconditionFailedError}from'@vercel/blob';const path='private/state/platform-v3.json',run=process.env.RUN_TAG;async function stable(){for(let i=0;i<8;i++){const a=await head(path),r=await get(path,{access:'private',useCache:false});if(!r?.stream)throw Error('READ');const c=[];for await(const x of r.stream)c.push(x);const raw=Buffer.concat(c),b=await head(path);if(a.etag===b.etag)return{etag:b.etag,s:JSON.parse(raw.toString())}}throw Error('HOT')}for(let n=1;n<=6;n++){const b=await stable(),s=b.s,password=`BridgeV2-${crypto.randomBytes(18).toString('base64url')}!`,salt=crypto.randomBytes(24),digest=crypto.scryptSync(password,salt,64),hash=`scrypt$${salt.toString('base64url')}$${digest.toString('base64url')}`,id=`bridge-v2-${crypto.randomUUID()}`,email=`bridge-v2-${run}@invalid.example`,now=new Date().toISOString();s.users=Array.isArray(s.users)?s.users:[];s.users.push({id,email,username:email,displayName:`WDCC Bridge V2 ${run}`,role:'dealer_agent',tenantId:'wdcc',status:'active',disabled:false,passwordHash:hash});s.revision=Number(s.revision||0)+1;s.updatedAt=now;try{await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:b.etag});fs.writeFileSync('/tmp/bridge.env',`QA_ID=${id}\nQA_EMAIL=${email}\nQA_PASSWORD=${password}\nRUN_TAG=${run}\n`);console.log(JSON.stringify({ok:true,id}));process.exit(0)}catch(e){if(e instanceof BlobPreconditionFailedError&&n<6)continue;throw e}}
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- node .bridge-user.mjs
          set -a;. /tmp/bridge.env;set +a;printf '::add-mask::%s\n' "$QA_PASSWORD";echo ok=true >> "$GITHUB_OUTPUT"

      - name: Capture exact existing route and bind lead bridge
        id: bind
        shell: bash
        working-directory: /tmp/bridge
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_ZONE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=wedontcarecars.com&account.id=$CLOUDFLARE_ACCOUNT_ID&per_page=50" -o /tmp/zones.json
          ZONE="$(jq -r '.result[0].id' /tmp/zones.json)";test -n "$ZONE";echo "$ZONE" >/tmp/zone
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_ZONE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE/workers/routes" -o /tmp/routes-before.json
          jq -c --arg p "$PATTERN" '[.result[]?|select(.pattern==$p)]|first//null' /tmp/routes-before.json >/tmp/route-before.json
          node - <<'NODE'
          const fs=require('fs'),p='wrangler.jsonc',c=JSON.parse(fs.readFileSync(p));c.routes=[{pattern:process.env.PATTERN,zone_name:'wedontcarecars.com'}];fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')
          NODE
          wrangler deploy >/tmp/live-deploy.log 2>&1;sleep 3
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_ZONE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE/workers/routes" -o /tmp/routes-after.json
          ID="$(jq -r --arg p "$PATTERN" --arg s "$WORKER" '.result[]?|select(.pattern==$p and .script==$s)|.id' /tmp/routes-after.json|head -1)";test -n "$ID";echo "$ID" >/tmp/route-id;echo ok=true >> "$GITHUB_OUTPUT"

      - name: Three live public lead flows plus dealer readback with route rollback trap
        id: live
        shell: bash
        run: |
          set -euo pipefail
          rollback(){ rc=$?;trap - ERR INT TERM;ZONE="$(cat /tmp/zone)";RID="$(cat /tmp/route-id 2>/dev/null||true)";BEFORE="$(cat /tmp/route-before.json)";if [ "$BEFORE" = null ];then [ -n "$RID" ]&&curl -fsS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_ZONE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE/workers/routes/$RID" >/dev/null||true;else BID="$(jq -r '.id' /tmp/route-before.json)";BP="$(jq -r '.pattern' /tmp/route-before.json)";BS="$(jq -r '.script // empty' /tmp/route-before.json)";curl -fsS -X PUT -H "Authorization: Bearer $CLOUDFLARE_ZONE_API_TOKEN" -H 'content-type: application/json' "https://api.cloudflare.com/client/v4/zones/$ZONE/workers/routes/$BID" --data "$(jq -nc --arg p "$BP" --arg s "$BS" '{pattern:$p,script:$s}')" >/dev/null||true;fi;exit "$rc";};trap rollback ERR INT TERM
          set -a;. /tmp/bridge.env;set +a;printf '::add-mask::%s\n' "$QA_PASSWORD"
          P="$(jq -nc --arg u "$QA_EMAIL" --arg p "$QA_PASSWORD" '{username:$u,email:$u,password:$p}')";LOGIN="$(curl -sS -c /tmp/dealer.cookies -o /tmp/login.json -w '%{http_code}' -H 'content-type: application/json' -X POST "$DEALER/api/auth/login" --data "$P")";test "$LOGIN" = 200;jq -e '.ok==true' /tmp/login.json >/dev/null
          : >/tmp/live-lead-ids
          for spec in 'schedule schedule-test-drive' 'approval get-approved' 'contact call-sean';do set -- $spec;k="$1";s="$2";KEY="wdcc-qa-bridge-v2-${k}-${RUN_TAG}";B="$(jq -nc --arg k "$k" --arg s "$s" --arg r "$RUN_TAG" '{qa:true,kind:$k,name:("WDCC QA BRIDGE V2 "+$k+" "+$r),phone:"813-555-0197",email:("bridge-v2-"+$k+"-"+$r+"@invalid.example"),vehicleInterest:"Bridge V2 live",message:"Automated WDCC contract verification",consent:true,source:$s,pagePath:("/qa/bridge-v2-"+$k)}')";C="$(curl -sS -D "/tmp/${k}.h" -o "/tmp/${k}.json" -w '%{http_code}' -H 'content-type: application/json' -H "Idempotency-Key: $KEY" -X POST "$CUSTOMER/api/leads" --data "$B")";case "$C" in 200|201);;*)cat "/tmp/${k}.json";exit 1;;esac;jq -e '.ok==true and .persisted==true and .item.id!=null' "/tmp/${k}.json" >/dev/null;grep -qi '^x-wdcc-edge: customer-lead-v53' "/tmp/${k}.h";jq -r '.item.id' "/tmp/${k}.json" >>/tmp/live-lead-ids;done
          FEED="$(curl -sS -b /tmp/dealer.cookies -o /tmp/feed.json -w '%{http_code}' "$DEALER/api/leads")";test "$FEED" = 200;while read -r id;do jq -e --arg id "$id" 'any((.items//[])[];.id==$id)' /tmp/feed.json >/dev/null;done </tmp/live-lead-ids
          test "$(curl -sS -L -o /tmp/customer-after.html -w '%{http_code}' "$CUSTOMER/?bridge_v2_after=$GITHUB_RUN_ID")" = 200;grep -q 'class="refHome"' /tmp/customer-after.html;grep -q 'class="refHero"' /tmp/customer-after.html;grep -q 'class="refBenefits"' /tmp/customer-after.html
          trap - ERR INT TERM;echo "login=$LOGIN" >> "$GITHUB_OUTPUT";echo "feed=$FEED" >> "$GITHUB_OUTPUT";echo ok=true >> "$GITHUB_OUTPUT"

      - name: Cleanup QA state
        if: always()
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          ids="$(cat /tmp/stage-lead-id /tmp/live-lead-ids 2>/dev/null|paste -sd, -||true)";uid='';[ -f /tmp/bridge.env ]&&{ set -a;. /tmp/bridge.env;set +a;uid="$QA_ID";};export QA_ID="$uid" LEAD_IDS="$ids"
          cat > .bridge-clean.mjs <<'NODE'
          import crypto from'node:crypto';import{get,head,put,BlobPreconditionFailedError}from'@vercel/blob';const path='private/state/platform-v3.json',uid=process.env.QA_ID||'',ids=new Set((process.env.LEAD_IDS||'').split(',').filter(Boolean));async function stable(){for(let i=0;i<8;i++){const a=await head(path),r=await get(path,{access:'private',useCache:false});if(!r?.stream)throw Error('READ');const c=[];for await(const x of r.stream)c.push(x);const raw=Buffer.concat(c),b=await head(path);if(a.etag===b.etag)return{etag:b.etag,s:JSON.parse(raw.toString())}}throw Error('HOT')}for(let n=1;n<=6;n++){const b=await stable(),s=b.s,u=(s.users||[]).length,l=(s.leads||[]).length,now=new Date().toISOString();s.users=(s.users||[]).filter(x=>x.id!==uid);s.leads=(s.leads||[]).filter(x=>!ids.has(x.id));s.audit=Array.isArray(s.audit)?s.audit:[];s.audit.push({id:crypto.randomUUID(),at:now,action:'qa.customer_lead_bridge_v2.cleanup',actor:'github-actions',userId:uid,leadCount:ids.size});s.revision=Number(s.revision||0)+1;s.updatedAt=now;try{await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:b.etag});console.log(JSON.stringify({ok:true,removedUsers:u-s.users.length,removedLeads:l-s.leads.length,revision:s.revision}));process.exit(0)}catch(e){if(e instanceof BlobPreconditionFailedError&&n<6)continue;throw e}}
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- node .bridge-clean.mjs|tee /tmp/clean.log;grep -q '"ok":true' /tmp/clean.log;echo ok=true >> "$GITHUB_OUTPUT"

      - name: Publish evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          STAGE: ${{ steps.stage.outputs.ok }}
          IDENTITY: ${{ steps.identity.outputs.ok }}
          BIND: ${{ steps.bind.outputs.ok }}
          LIVE: ${{ steps.live.outputs.ok }}
          LOGIN: ${{ steps.live.outputs.login }}
          FEED: ${{ steps.live.outputs.feed }}
          CLEAN: ${{ steps.cleanup.outputs.ok }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC customer lead bridge V2 $GITHUB_RUN_ID" --body "Overall: **$STATUS**\nImmutable V53 stage persistence: **${STAGE:-false}**\nLead route bound: **${BIND:-false}**\nSchedule / Get Approved / Call Sean through real customer domain + dealer readback: **${LIVE:-false}**\nDealer login/feed: \`${LOGIN:-?}/${FEED:-?}\`\nQA cleanup: **${CLEAN:-false}**\nCustomer reference-clone baseline checked before and after. Live failures automatically restore/remove the lead-only route." || true
