name: WDCC V53.1 Final Dealer Promotion V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-v531-final-dealer-promotion-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wdcc-v531-final-dealer-promotion-v2
  cancel-in-progress: false

env:
  SOURCE_SHA: f768a082da55bdfb8483dbde06867c607949d58b
  BACKEND: https://wdcc-cpx-launch-qhcvflfih-cpxagency.vercel.app
  STAGE: https://wdcc-v53-1-staging.clico-global.workers.dev
  DEALER: https://dealer.wedontcarecars.com
  CUSTOMER: https://wedontcarecars.com
  LIVE_WORKER: wdcc-dealer-frontdoor
  TEAM: cpxagency
  TEAM_ID: team_G6jmETRRl8fV3KfivPOdj8JM
  PHOENIX_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_API_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Certified release preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ZONE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VERCEL_TOKEN; do test -n "${!v:-}" || { echo "missing $v" >&2; exit 20; }; done
          curl -fsS "$STAGE/api/health?promotion-v2=$GITHUB_RUN_ID" -o /tmp/stage-health.json
          jq -e '.ok==true and .degraded==false and .release=="WDCC-V53-OPS-HARDENED" and .backend=="healthy"' /tmp/stage-health.json >/dev/null
          curl -fsS "$BACKEND/api/health?promotion-v2=$GITHUB_RUN_ID" -o /tmp/backend-health.json
          jq -e '.ok==true and .degraded==false and .service=="wdcc-canonical-authority"' /tmp/backend-health.json >/dev/null
          curl -fsS -L "$CUSTOMER/?promotion-v2-before=$GITHUB_RUN_ID" -o /tmp/customer-before.html
          grep -q 'intro-sequence intro-impact' /tmp/customer-before.html
          grep -q 'mobile-action-bar' /tmp/customer-before.html
          grep -q '/assets/cars/2016-ford-f150-limited-1.webp' /tmp/customer-before.html
          echo ok=true >> "$GITHUB_OUTPUT"

      - name: Install promotion runtime
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --global vercel@59.3.0 >/dev/null
          npm install --no-save --package-lock=false @opennextjs/cloudflare@latest wrangler@latest playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          mkdir -p .vercel /tmp/screens
          printf '{"orgId":"%s","projectId":"%s"}\n' "$TEAM_ID" "$PHOENIX_ID" > .vercel/project.json

      - name: Capture exact live rollback point
        id: rollback
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify -o /tmp/cf-token.json
          jq -e '.success==true and .result.status=="active"' /tmp/cf-token.json >/dev/null
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_ZONE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=wedontcarecars.com&account.id=$CLOUDFLARE_ACCOUNT_ID&per_page=50" -o /tmp/zones.json
          jq -e '.success==true and (.result|length)==1' /tmp/zones.json >/dev/null
          ZONE_ID="$(jq -r '.result[0].id' /tmp/zones.json)"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_ZONE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=dealer.wedontcarecars.com" -o /tmp/dealer-dns.json
          jq -e '.success==true and (.result|length)==1 and .result[0].proxied==true' /tmp/dealer-dns.json >/dev/null
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$LIVE_WORKER/routes" -o /tmp/routes.json
          jq -e --arg p 'dealer.wedontcarecars.com/*' --arg s "$LIVE_WORKER" '.success==true and any(.result[]?;.pattern==$p and .script==$s)' /tmp/routes.json >/dev/null
          npx wrangler deployments status --name "$LIVE_WORKER" --json > /tmp/deployments.json
          OLD="$(python - <<'PY'
          import json
          data=json.load(open('/tmp/deployments.json'))
          rows=[]
          def walk(x):
              if isinstance(x,dict):
                  vid=x.get('version_id') or x.get('versionId') or x.get('id') if ('version_id' in x or 'versionId' in x) else None
                  pct=x.get('percentage')
                  if vid: rows.append((pct,str(vid)))
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(data)
          chosen=''
          for pct,vid in rows:
              if pct in (100,100.0,'100','100.0',1,1.0,'1','1.0'):
                  chosen=vid;break
          if not chosen and rows: chosen=rows[0][1]
          print(chosen)
          PY
          )"
          test -n "$OLD"
          echo "Captured rollback Worker version: $OLD"
          echo "old_version=$OLD" >> "$GITHUB_OUTPUT"
          echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"

      - name: Build and upload V53.1 at zero traffic
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          cat > open-next.config.ts <<'EOF'
          import { defineCloudflareConfig } from "@opennextjs/cloudflare";
          export default defineCloudflareConfig();
          EOF
          node <<'NODE'
          const fs=require('fs'),p='wrangler.jsonc',c=JSON.parse(fs.readFileSync(p,'utf8'));c.name=process.env.LIVE_WORKER;c.workers_dev=false;c.preview_urls=true;c.keep_vars=true;delete c.route;delete c.routes;c.vars=c.vars||{};c.vars.WDCC_RUNTIME_ROLE='frontend';c.vars.WDCC_DEALER_BACKEND_URL=process.env.BACKEND;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');
          NODE
          npx opennextjs-cloudflare build
          TAG="wdcc-v531-final-v2-${GITHUB_RUN_ID}"
          WRANGLER_OUTPUT_FILE_PATH=/tmp/wrangler-output.jsonl npx wrangler versions upload --name "$LIVE_WORKER" --tag "$TAG" --message "WDCC V53.1 certified candidate $GITHUB_RUN_ID" 2>&1 | tee /tmp/upload.log
          NEW="$(python - <<'PY'
          import json,re
          out=''
          try:
              for line in open('/tmp/wrangler-output.jsonl'):
                  try: x=json.loads(line)
                  except: continue
                  if x.get('type')=='version-upload' and x.get('version_id'): out=x['version_id']
          except FileNotFoundError: pass
          if not out:
              m=re.findall(r'[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}',open('/tmp/upload.log').read())
              if m: out=m[-1]
          print(out)
          PY
          )"
          test -n "$NEW"
          test "$NEW" != "${{ steps.rollback.outputs.old_version }}"
          echo "Uploaded zero-traffic Worker version: $NEW"
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Create short-lived live dealer
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          export RUN_TAG="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > .wdcc-v2-live-user.mjs <<'NODE'
          import crypto from'node:crypto';import fs from'node:fs';import{get,head,put,BlobPreconditionFailedError}from'@vercel/blob';const path='private/state/platform-v3.json',run=process.env.RUN_TAG;async function stable(){for(let i=0;i<6;i++){const a=await head(path),r=await get(path,{access:'private',useCache:false});if(!r?.stream)throw Error('READ');const c=[];for await(const x of r.stream)c.push(x);const raw=Buffer.concat(c),b=await head(path);if(a.etag===b.etag)return{raw,etag:b.etag,s:JSON.parse(raw.toString())}}throw Error('HOT')}for(let n=1;n<=5;n++){const before=await stable(),s=before.s,now=new Date().toISOString(),password=`LiveV2-${crypto.randomBytes(18).toString('base64url')}!`,salt=crypto.randomBytes(24),digest=crypto.scryptSync(password,salt,64),hash=`scrypt$${salt.toString('base64url')}$${digest.toString('base64url')}`,id=`livev2-${crypto.randomUUID()}`,email=`livev2-${run}@invalid.example`,backup=`private/state/backups/platform-v3-pre-livev2-${run}-r${Number(s.revision||0)}-${crypto.randomUUID()}.json`;await put(backup,before.raw,{access:'private',addRandomSuffix:false,allowOverwrite:false,contentType:'application/json'});s.users=Array.isArray(s.users)?s.users:[];s.audit=Array.isArray(s.audit)?s.audit:[];s.users.push({id,email,username:email,displayName:`V53.1 Live V2 ${run}`,role:'dealer_agent',tenantId:'wdcc',status:'active',disabled:false,passwordHash:hash});s.audit.push({id:crypto.randomUUID(),at:now,action:'qa.v531_live_v2.create',actor:'github-actions',run,userId:id,backup});s.revision=Number(s.revision||0)+1;s.updatedAt=now;try{await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:before.etag});fs.writeFileSync('/tmp/livev2.env',`RUN_TAG=${run}\nQA_ID=${id}\nQA_EMAIL=${email}\nQA_PASSWORD=${password}\n`);console.log(JSON.stringify({ok:true,id,email,backup}));process.exit(0)}catch(e){if(e instanceof BlobPreconditionFailedError&&n<5)continue;throw e}}
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- node .wdcc-v2-live-user.mjs
          set -a; . /tmp/livev2.env; set +a; printf '::add-mask::%s\n' "$QA_PASSWORD"
          echo ok=true >> "$GITHUB_OUTPUT"

      - name: Atomic dealer cutover with rollback trap
        id: cutover
        env:
          OLD_VERSION: ${{ steps.rollback.outputs.old_version }}
          NEW_VERSION: ${{ steps.upload.outputs.new_version }}
        shell: bash
        run: |
          set -euo pipefail
          rollback(){ rc=$?; trap - ERR INT TERM; echo "LIVE GATE FAILED — restoring $OLD_VERSION" >&2; npx wrangler versions deploy "$OLD_VERSION@100%" --name "$LIVE_WORKER" -y --message "WDCC V53.1 automatic rollback $GITHUB_RUN_ID" || npx wrangler rollback "$OLD_VERSION" --name "$LIVE_WORKER" --message "WDCC V53.1 automatic rollback $GITHUB_RUN_ID" || true; exit "$rc"; }
          trap rollback ERR INT TERM
          npx wrangler versions deploy "$NEW_VERSION@100%" --name "$LIVE_WORKER" -y --message "WDCC V53.1 dealer promotion $GITHUB_RUN_ID"
          ok=false; for i in $(seq 1 25); do code="$(curl -sS -o /tmp/live-health.json -w '%{http_code}' "$DEALER/api/health?v531-v2-live=$GITHUB_RUN_ID-$i" || true)"; if [ "$code" = 200 ] && jq -e '.ok==true and .degraded==false and .release=="WDCC-V53-OPS-HARDENED" and .backend=="healthy"' /tmp/live-health.json >/dev/null 2>&1; then ok=true; break; fi; sleep 2; done; test "$ok" = true
          set -a; . /tmp/livev2.env; set +a; printf '::add-mask::%s\n' "$QA_PASSWORD"
          payload="$(jq -nc --arg u "$QA_EMAIL" --arg p "$QA_PASSWORD" '{username:$u,email:$u,password:$p}')"
          LOGIN="$(curl -sS -c /tmp/live.cookies -o /tmp/login.json -w '%{http_code}' -H "Origin: $DEALER" -H 'content-type: application/json' -X POST "$DEALER/api/auth/login" --data "$payload")"
          SESSION="$(curl -sS -b /tmp/live.cookies -o /tmp/session.json -w '%{http_code}' "$DEALER/api/auth/session")"
          DASHBOARD="$(curl -sS -b /tmp/live.cookies -o /tmp/dashboard.json -w '%{http_code}' "$DEALER/api/crm/dashboard")"
          LEADS="$(curl -sS -b /tmp/live.cookies -o /tmp/leads.json -w '%{http_code}' "$DEALER/api/leads")"
          INVENTORY="$(curl -sS -b /tmp/live.cookies -o /tmp/inventory.json -w '%{http_code}' "$DEALER/api/inventory")"
          echo "LOGIN=$LOGIN SESSION=$SESSION DASHBOARD=$DASHBOARD LEADS=$LEADS INVENTORY=$INVENTORY"
          test "$LOGIN" = 200; test "$SESSION" = 200; test "$DASHBOARD" = 200; test "$LEADS" = 200; test "$INVENTORY" = 200
          jq -e '.ok==true' /tmp/login.json >/dev/null; jq -e '.authenticated==true' /tmp/session.json >/dev/null; jq -e '.ok==true' /tmp/dashboard.json >/dev/null; jq -e '.ok==true' /tmp/leads.json >/dev/null; jq -e '.ok==true' /tmp/inventory.json >/dev/null
          cat > .wdcc-v2-live-ui.mjs <<'NODE'
          import{chromium}from'playwright';const base=process.env.DEALER,email=process.env.QA_EMAIL,password=process.env.QA_PASSWORD,b=await chromium.launch({headless:true});try{const c=await b.newContext({viewport:{width:1440,height:1000}}),p=await c.newPage();await p.goto(`${base}/dealer`,{waitUntil:'networkidle'});await p.locator('input[autocomplete="username"]').fill(email);await p.locator('input[autocomplete="current-password"]').fill(password);await p.getByRole('button',{name:/sign in/i}).click();await p.waitForFunction(()=>['NEXT BEST MOVE','OVERDUE','CUSTOMER LIVE','NOTIFY GAPS'].every(x=>document.body.innerText.includes(x)),null,{timeout:30000});await p.screenshot({path:'/tmp/screens/live-dashboard.png',fullPage:true});await p.goto(`${base}/dealer/leads`,{waitUntil:'networkidle'});await p.waitForFunction(()=>document.body.innerText.includes('OVERDUE')&&document.body.innerText.includes('NOTIFY'),null,{timeout:30000});await p.screenshot({path:'/tmp/screens/live-leads.png',fullPage:true});await p.goto(`${base}/dealer/inventory`,{waitUntil:'networkidle'});await p.waitForFunction(()=>document.body.innerText.includes('Customer Live'),null,{timeout:30000});await p.screenshot({path:'/tmp/screens/live-inventory.png',fullPage:true});console.log(JSON.stringify({ok:true}))}finally{await b.close()}
          NODE
          DEALER="$DEALER" QA_EMAIL="$QA_EMAIL" QA_PASSWORD="$QA_PASSWORD" node .wdcc-v2-live-ui.mjs
          curl -fsS -L "$CUSTOMER/?v531-v2-after=$GITHUB_RUN_ID" -o /tmp/customer-after.html
          grep -q 'intro-sequence intro-impact' /tmp/customer-after.html
          grep -q 'mobile-action-bar' /tmp/customer-after.html
          grep -q '/assets/cars/2016-ford-f150-limited-1.webp' /tmp/customer-after.html
          trap - ERR INT TERM
          echo "login=$LOGIN" >> "$GITHUB_OUTPUT"; echo "session=$SESSION" >> "$GITHUB_OUTPUT"; echo "dashboard=$DASHBOARD" >> "$GITHUB_OUTPUT"; echo "leads=$LEADS" >> "$GITHUB_OUTPUT"; echo "inventory=$INVENTORY" >> "$GITHUB_OUTPUT"; echo ok=true >> "$GITHUB_OUTPUT"

      - name: Upload live screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wdcc-v531-live-v2-${{ github.run_id }}
          path: /tmp/screens/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup short-lived live dealer
        id: cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [ -f /tmp/livev2.env ] || { echo ok=true >> "$GITHUB_OUTPUT"; exit 0; }
          set -a; . /tmp/livev2.env; set +a; export QA_ID RUN_TAG
          cat > .wdcc-v2-live-clean.mjs <<'NODE'
          import crypto from'node:crypto';import{get,head,put,BlobPreconditionFailedError}from'@vercel/blob';const path='private/state/platform-v3.json',id=process.env.QA_ID,run=process.env.RUN_TAG;async function stable(){for(let i=0;i<6;i++){const a=await head(path),r=await get(path,{access:'private',useCache:false});if(!r?.stream)throw Error('READ');const c=[];for await(const x of r.stream)c.push(x);const raw=Buffer.concat(c),b=await head(path);if(a.etag===b.etag)return{etag:b.etag,s:JSON.parse(raw.toString())}}throw Error('HOT')}for(let n=1;n<=5;n++){const before=await stable(),s=before.s,u=Array.isArray(s.users)?s.users:[];s.users=u.filter(x=>x.id!==id);s.audit=Array.isArray(s.audit)?s.audit:[];s.audit.push({id:crypto.randomUUID(),at:new Date().toISOString(),action:'qa.v531_live_v2.cleanup',actor:'github-actions',run,userId:id});s.revision=Number(s.revision||0)+1;s.updatedAt=new Date().toISOString();try{await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:before.etag});console.log(JSON.stringify({ok:true,removed:u.length-s.users.length}));process.exit(0)}catch(e){if(e instanceof BlobPreconditionFailedError&&n<5)continue;throw e}}
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- node .wdcc-v2-live-clean.mjs
          echo ok=true >> "$GITHUB_OUTPUT"

      - name: Publish promotion evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OLD: ${{ steps.rollback.outputs.old_version }}
          NEW: ${{ steps.upload.outputs.new_version }}
          CUTOVER: ${{ steps.cutover.outcome }}
          L: ${{ steps.cutover.outputs.login }}
          S: ${{ steps.cutover.outputs.session }}
          D: ${{ steps.cutover.outputs.dashboard }}
          E: ${{ steps.cutover.outputs.leads }}
          I: ${{ steps.cutover.outputs.inventory }}
          CLEAN: ${{ steps.cleanup.outcome }}
        shell: bash
        run: |
          INTEGRATIONS='not-live'; [ -f /tmp/live-health.json ] && INTEGRATIONS="$(jq -c '.integrations // {}' /tmp/live-health.json)"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC V53.1 FINAL DEALER PROMOTION V2 $GITHUB_RUN_ID" --body "Exact source: \`$SOURCE_SHA\`
          Backend: \`$BACKEND\`
          Previous Worker: \`${OLD:-unknown}\`
          Promoted Worker: \`${NEW:-not-uploaded}\`
          Dealer cutover: **$CUTOVER**
          Live Login/Session/CRM/Leads/Inventory: \`${L:-?}/${S:-?}/${D:-?}/${E:-?}/${I:-?}\`
          Temporary identity cleanup: **$CLEAN**
          Live notification readiness: \`$INTEGRATIONS\`

          Customer baseline is re-proved after dealer promotion. Any failed live gate invokes automatic rollback." || true
