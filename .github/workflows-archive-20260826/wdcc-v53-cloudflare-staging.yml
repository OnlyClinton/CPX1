name: WDCC V53 Cloudflare Staging

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-v53-cloudflare-staging.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wdcc-v53-cloudflare-staging
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  SOURCE_SHA: b95884ac3960920b2d5714bfc6fd3043091a6c62
  BACKEND: https://wdcc-cpx-launch-cpxagency.vercel.app
  WORKER: wdcc-v53-staging
  CUSTOMER: https://wedontcarecars.com

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact V53 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Prove source backend and customer baseline before staging
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          curl -fsS "$BACKEND/api/health?v53-stage=$GITHUB_RUN_ID" -o /tmp/backend-health.json
          jq -e '.ok == true and .degraded == false' /tmp/backend-health.json >/dev/null
          code="$(curl -sS -L -o /tmp/customer-before.html -w '%{http_code}' "$CUSTOMER/?v53-stage-before=$GITHUB_RUN_ID")"
          test "$code" = 200
          grep -q 'intro-sequence intro-impact' /tmp/customer-before.html
          grep -q 'mobile-action-bar' /tmp/customer-before.html
          grep -q '/assets/cars/2016-ford-f150-limited-1.webp' /tmp/customer-before.html
          echo 'preflight=pass' >> "$GITHUB_OUTPUT"

      - name: Build V53 Cloudflare staging worker
        id: build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @opennextjs/cloudflare@latest wrangler@latest
          cat > open-next.config.ts <<'EOF'
          import { defineCloudflareConfig } from "@opennextjs/cloudflare";
          export default defineCloudflareConfig();
          EOF
          node <<'NODE'
          const fs=require('fs');
          const p='wrangler.jsonc';
          const cfg=JSON.parse(fs.readFileSync(p,'utf8'));
          cfg.name=process.env.WORKER;
          cfg.workers_dev=true;
          cfg.preview_urls=false;
          cfg.keep_vars=true;
          delete cfg.route;
          delete cfg.routes;
          cfg.vars=cfg.vars||{};
          cfg.vars.WDCC_RUNTIME_ROLE='frontend';
          cfg.vars.WDCC_DEALER_BACKEND_URL=process.env.BACKEND;
          fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          NODE
          npx opennextjs-cloudflare build
          echo 'build=pass' >> "$GITHUB_OUTPUT"

      - name: Deploy isolated workers.dev staging target
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/deploy.log
          URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/deploy.log | tail -1 || true)"
          test -n "$URL" || { echo 'wrangler did not report a workers.dev URL' >&2; cat /tmp/deploy.log >&2; exit 1; }
          URL="${URL%/}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify V53 staging contract
        id: verify
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 20); do
            code="$(curl -sS -o /tmp/stage-health.json -w '%{http_code}' "$URL/api/health?v53=$GITHUB_RUN_ID-$attempt" || true)"
            if [ "$code" = 200 ] && jq -e '.ok == true and .degraded == false and .release == "WDCC-V53-OPS-HARDENED" and .backend == "healthy"' /tmp/stage-health.json >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 2
          done
          test "$ok" = 1
          curl -fsS "$URL/api/inventory?v53=$GITHUB_RUN_ID" -o /tmp/stage-inventory.json
          jq -e '.ok == true and (.items | type == "array")' /tmp/stage-inventory.json >/dev/null
          code="$(curl -sS -L -o /tmp/dealer.html -w '%{http_code}' "$URL/dealer")"
          test "$code" = 200
          grep -q 'SALES COMMAND' /tmp/dealer.html
          code="$(curl -sS -L -o /tmp/leads.html -w '%{http_code}' "$URL/dealer/leads")"
          test "$code" = 200
          grep -q 'OVERDUE' /tmp/leads.html
          code="$(curl -sS -L -o /tmp/inventory.html -w '%{http_code}' "$URL/dealer/inventory")"
          test "$code" = 200
          grep -q 'Customer Live' /tmp/inventory.html
          echo 'verified=pass' >> "$GITHUB_OUTPUT"

      - name: Re-prove customer production stayed untouched
        id: customer
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -L -o /tmp/customer-after.html -w '%{http_code}' "$CUSTOMER/?v53-stage-after=$GITHUB_RUN_ID")"
          test "$code" = 200
          grep -q 'intro-sequence intro-impact' /tmp/customer-after.html
          grep -q 'mobile-action-bar' /tmp/customer-after.html
          grep -q '/assets/cars/2016-ford-f150-limited-1.webp' /tmp/customer-after.html
          echo 'unchanged=true' >> "$GITHUB_OUTPUT"

      - name: Publish staging evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          PREFLIGHT: ${{ steps.preflight.outcome }}
          BUILD: ${{ steps.build.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          CUSTOMER_UNCHANGED: ${{ steps.customer.outputs.unchanged }}
        shell: bash
        run: |
          body=$(cat <<EOF
          Exact source: \`$SOURCE_SHA\`
          Preflight: **$PREFLIGHT**
          Build: **$BUILD**
          Isolated workers.dev deploy: **$DEPLOY**
          V53 contract: **$VERIFY**
          Customer baseline unchanged: **${CUSTOMER_UNCHANGED:-false}**
          Staging URL: \`${URL:-not-resolved}\`

          This workflow does not mutate production DNS, customer aliases, or the live dealer Worker route.
          EOF
          )
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC V53 Cloudflare staging ${GITHUB_RUN_ID}" --body "$body" || true
