name: WDCC Unified Auth Leads V7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-unified-auth-leads-v7.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM: cpxagency
      ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      PHOENIX_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
      BASE: https://wdcc-cpx-launch-hqw7zqgix-cpxagency.vercel.app
      LIVE_ORIGIN: https://dealer.wedontcarecars.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Setup Phoenix OIDC
        run: |
          npm ci
          npm install --global vercel@59.3.0 >/dev/null
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$PHOENIX_ID" > .vercel/project.json
          curl -fsS "$BASE/api/health" | jq -e '.ok==true and .degraded==false' >/dev/null
      - name: Create temporary users
        id: users
        shell: bash
        run: |
          set -euo pipefail
          export RUN_TAG="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > .v7-users.mjs <<'NODE'
          import crypto from 'node:crypto';import fs from 'node:fs';import {get,head,put} from '@vercel/blob';const path='private/state/platform-v3.json',run=process.env.RUN_TAG;async function stable(){for(let i=0;i<4;i++){const a=await head(path),r=await get(path,{access:'private',useCache:false});if(!r||r.statusCode!==200||!r.stream)throw Error('READ');const c=[];for await(const x of r.stream)c.push(x);const raw=Buffer.concat(c),b=await head(path);if(a.etag===b.etag)return{raw,etag:b.etag,s:JSON.parse(raw.toString('utf8'))}}throw Error('HOT')}const before=await stable(),s=before.s,now=new Date().toISOString(),pw=`WdccQA-${crypto.randomBytes(18).toString('base64url')}!`,salt=crypto.randomBytes(24),dig=crypto.scryptSync(pw,salt,64),hash=`scrypt$${salt.toString('base64url')}$${dig.toString('base64url')}`,dealerId=`qa-v7-dealer-${crypto.randomUUID()}`,adminId=`qa-v7-admin-${crypto.randomUUID()}`,dealerEmail=`qa-v7-dealer-${run}@invalid.example`,adminEmail=`qa-v7-admin-${run}@invalid.example`;s.users=Array.isArray(s.users)?s.users:[];s.audit=Array.isArray(s.audit)?s.audit:[];s.users.push({id:dealerId,email:dealerEmail,username:dealerEmail,displayName:`WDCC QA V7 Dealer ${run}`,role:'dealer_agent',tenantId:'wdcc',status:'active',disabled:false,passwordHash:hash});s.users.push({id:adminId,email:adminEmail,username:adminEmail,displayName:`WDCC QA V7 Admin ${run}`,role:'platform_admin',tenantId:'wdcc',status:'active',disabled:false,passwordHash:hash});const backup=`private/state/backups/platform-v3-pre-v7-r${Number(s.revision||0)}-${now.replace(/[:.]/g,'-')}-${crypto.randomUUID()}.json`;await put(backup,before.raw,{access:'private',addRandomSuffix:false,allowOverwrite:false,contentType:'application/json'});s.audit.push({id:crypto.randomUUID(),at:now,action:'qa.unified_v7.users_create',actor:'github-actions',run,dealerId,adminId,backup});s.revision=Number(s.revision||0)+1;s.updatedAt=now;await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:before.etag});fs.writeFileSync('/tmp/qa.env',`RUN_TAG=${run}\nQA_PASSWORD=${pw}\nDEALER_ID=${dealerId}\nDEALER_EMAIL=${dealerEmail}\nADMIN_ID=${adminId}\nADMIN_EMAIL=${adminEmail}\n`);console.log(JSON.stringify({ok:true,run,backup}));
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- node .v7-users.mjs
          set -a; . /tmp/qa.env; set +a; printf '::add-mask::%s\n' "$QA_PASSWORD"
      - name: Authenticate dealer and admin as live dealer origin
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          set -a; . /tmp/qa.env; set +a; printf '::add-mask::%s\n' "$QA_PASSWORD"
          login(){ label="$1"; email="$2"; role="$3"; body="$(jq -nc --arg e "$email" --arg p "$QA_PASSWORD" '{email:$e,password:$p}')"; code="$(curl -sS -c "/tmp/$label.cookies" -o "/tmp/$label-login.json" -w '%{http_code}' -H "Origin: $LIVE_ORIGIN" -H 'content-type: application/json' -X POST "$BASE/api/auth/login" --data "$body")"; test "$code" = 200 || { cat "/tmp/$label-login.json"; exit 1; }; sc="$(curl -sS -b "/tmp/$label.cookies" -o "/tmp/$label-session.json" -w '%{http_code}' "$BASE/api/auth/session")"; test "$sc" = 200; jq -e --arg r "$role" '.authenticated==true and ((.user.role|ascii_downcase)==($r|ascii_downcase))' "/tmp/$label-session.json" >/dev/null; echo "${label}_login=$code" >> "$GITHUB_OUTPUT"; echo "${label}_session=$sc" >> "$GITHUB_OUTPUT"; }
          login dealer "$DEALER_EMAIL" dealer_agent
          login admin "$ADMIN_EMAIL" platform_admin
      - name: Create all lead flows and verify dealer feed
        id: leads
        shell: bash
        run: |
          set -euo pipefail
          set -a; . /tmp/qa.env; set +a; run="$RUN_TAG"
          post(){ kind="$1"; source="$2"; suffix="$3"; qa="$4"; key="wdcc-v7-$suffix-$run"; if [ "$qa" = true ]; then name="WDCC QA V7 $suffix $run"; email="qa-v7-$suffix-$run@invalid.example"; q='"qa":true,'; else name="WDCC ACCEPTANCE V7 $suffix $run"; email="acceptance-v7-$suffix-$run@example.com"; q=''; fi; body="{${q}\"kind\":\"$kind\",\"name\":\"$name\",\"phone\":\"813-555-0199\",\"email\":\"$email\",\"vehicleInterest\":\"Acceptance vehicle\",\"message\":\"Automated WDCC acceptance. Do not contact applicant.\",\"consent\":true,\"source\":\"$source\"}"; code="$(curl -sS -o "/tmp/$suffix.json" -w '%{http_code}' -H "Origin: $LIVE_ORIGIN" -H 'content-type: application/json' -H "Idempotency-Key: $key" -X POST "$BASE/api/leads" --data "$body")"; case "$code" in 200|201);;*) cat "/tmp/$suffix.json"; exit 1;;esac; jq -e '.ok==true and .persisted==true and .item.id!=null' "/tmp/$suffix.json" >/dev/null; }
          post schedule schedule-test-drive schedule false
          post approval get-approved approval true
          post contact call-sean contact true
          S="$(jq -r '.item.id' /tmp/schedule.json)";A="$(jq -r '.item.id' /tmp/approval.json)";C="$(jq -r '.item.id' /tmp/contact.json)";fc="$(curl -sS -b /tmp/dealer.cookies -o /tmp/feed.json -w '%{http_code}' "$BASE/api/leads")";test "$fc" = 200;jq -e --arg s "$S" --arg a "$A" --arg c "$C" '(.items//[]) as $x | any($x[];.id==$s) and any($x[];.id==$a) and any($x[];.id==$c)' /tmp/feed.json >/dev/null;echo "schedule=$S" >> "$GITHUB_OUTPUT";echo "approval=$A" >> "$GITHUB_OUTPUT";echo "contact=$C" >> "$GITHUB_OUTPUT";echo "feed=$fc" >> "$GITHUB_OUTPUT";echo "email=$(jq -r '.notifications.email // .notification.email // "unknown"' /tmp/schedule.json)" >> "$GITHUB_OUTPUT";echo "sms=$(jq -r '.notifications.sms // .notification.sms // "unknown"' /tmp/schedule.json)" >> "$GITHUB_OUTPUT";echo "webhook=$(jq -r '.notifications.webhook // .notification.webhook // "unknown"' /tmp/schedule.json)" >> "$GITHUB_OUTPUT"
      - name: Cleanup
        id: cleanup
        if: always() && steps.users.outcome == 'success'
        shell: bash
        run: |
          set +e; set -a; . /tmp/qa.env; set +a
          cat > .v7-clean.mjs <<'NODE'
          import crypto from 'node:crypto';import {get,head,put} from '@vercel/blob';const path='private/state/platform-v3.json',run=process.env.RUN_TAG,ids=new Set([process.env.DEALER_ID,process.env.ADMIN_ID]);async function stable(){for(let i=0;i<4;i++){const a=await head(path),r=await get(path,{access:'private',useCache:false});if(!r||r.statusCode!==200||!r.stream)throw Error('READ');const c=[];for await(const x of r.stream)c.push(x);const raw=Buffer.concat(c),b=await head(path);if(a.etag===b.etag)return{raw,etag:b.etag,s:JSON.parse(raw.toString('utf8'))}}throw Error('HOT')}const before=await stable(),s=before.s,now=new Date().toISOString(),leadIds=(s.leads||[]).filter(x=>String(x.name||'').includes(run)||String(x.email||'').includes(run)).map(x=>x.id);s.users=(s.users||[]).filter(x=>!ids.has(x.id));s.leads=(s.leads||[]).filter(x=>!leadIds.includes(x.id));s.audit=Array.isArray(s.audit)?s.audit:[];const backup=`private/state/backups/platform-v3-pre-v7-clean-r${Number(s.revision||0)}-${now.replace(/[:.]/g,'-')}-${crypto.randomUUID()}.json`;await put(backup,before.raw,{access:'private',addRandomSuffix:false,allowOverwrite:false,contentType:'application/json'});s.audit.push({id:crypto.randomUUID(),at:now,action:'qa.unified_v7.cleanup',actor:'github-actions',run,leadsRemoved:leadIds.length,backup});s.revision=Number(s.revision||0)+1;s.updatedAt=now;await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:before.etag});console.log(JSON.stringify({ok:true,usersRemoved:2,leadsRemoved:leadIds.length,backup}));
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- node .v7-clean.mjs > /tmp/cleanup.json 2>&1; cat /tmp/cleanup.json
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          AUTH: ${{ steps.auth.outcome }}
          DL: ${{ steps.auth.outputs.dealer_login }}
          DS: ${{ steps.auth.outputs.dealer_session }}
          AL: ${{ steps.auth.outputs.admin_login }}
          AS: ${{ steps.auth.outputs.admin_session }}
          LEADS: ${{ steps.leads.outcome }}
          S: ${{ steps.leads.outputs.schedule }}
          A: ${{ steps.leads.outputs.approval }}
          C: ${{ steps.leads.outputs.contact }}
          FEED: ${{ steps.leads.outputs.feed }}
          EMAIL: ${{ steps.leads.outputs.email }}
          SMS: ${{ steps.leads.outputs.sms }}
          WEBHOOK: ${{ steps.leads.outputs.webhook }}
          CLEANUP: ${{ steps.cleanup.outcome }}
        run: |
          body=$(printf 'Target `%s` simulated as `%s`\n\nOverall **%s**\nDealer/admin auth **%s**: dealer %s/%s; admin %s/%s\nLeads/feed **%s** HTTP %s: `%s`, `%s`, `%s`\nNotifications: email `%s`; SMS `%s`; webhook `%s`\nCleanup **%s**' "$BASE" "$LIVE_ORIGIN" "$STATUS" "$AUTH" "$DL" "$DS" "$AL" "$AS" "$LEADS" "$FEED" "$S" "$A" "$C" "$EMAIL" "$SMS" "$WEBHOOK" "$CLEANUP")
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC unified auth leads V7 ${GITHUB_RUN_ID}" --body "$body" || true
