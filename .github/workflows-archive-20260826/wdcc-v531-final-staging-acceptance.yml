name: WDCC V53.1 Final Staging Acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-v531-final-staging-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wdcc-v531-final-staging-acceptance
  cancel-in-progress: true

env:
  SOURCE_SHA: f768a082da55bdfb8483dbde06867c607949d58b
  BACKEND: https://wdcc-cpx-launch-qhcvflfih-cpxagency.vercel.app
  STAGE: https://wdcc-v53-1-staging.clico-global.workers.dev
  WORKER: wdcc-v53-1-staging
  CUSTOMER: https://wedontcarecars.com
  TEAM: cpxagency
  TEAM_ID: team_G6jmETRRl8fV3KfivPOdj8JM
  PHOENIX_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Immutable preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VERCEL_TOKEN; do test -n "${!v:-}" || exit 20; done
          curl -fsS "$BACKEND/api/health?final-stage=$GITHUB_RUN_ID" -o /tmp/backend-health.json
          jq -e '.ok==true and .degraded==false and .service=="wdcc-canonical-authority"' /tmp/backend-health.json >/dev/null
          curl -fsS -L "$CUSTOMER/?final-stage-before=$GITHUB_RUN_ID" -o /tmp/customer-before.html
          grep -q 'intro-sequence intro-impact' /tmp/customer-before.html
          grep -q 'mobile-action-bar' /tmp/customer-before.html
          grep -q '/assets/cars/2016-ford-f150-limited-1.webp' /tmp/customer-before.html
          echo ok=true >> "$GITHUB_OUTPUT"

      - name: Install acceptance runtime
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --global vercel@59.3.0 >/dev/null
          npm install --no-save --package-lock=false @opennextjs/cloudflare@latest wrangler@latest playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          mkdir -p .vercel /tmp/screens
          printf '{"orgId":"%s","projectId":"%s"}\n' "$TEAM_ID" "$PHOENIX_ID" > .vercel/project.json

      - name: Create temporary dealer
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          export RUN_TAG="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > .wdcc-final-user.mjs <<'NODE'
          import crypto from'node:crypto';import fs from'node:fs';import{get,head,put,BlobPreconditionFailedError}from'@vercel/blob';
          const path='private/state/platform-v3.json',run=process.env.RUN_TAG;
          async function stable(){for(let i=0;i<6;i++){const a=await head(path),r=await get(path,{access:'private',useCache:false});if(!r?.stream)throw Error('READ');const c=[];for await(const x of r.stream)c.push(x);const raw=Buffer.concat(c),b=await head(path);if(a.etag===b.etag)return{raw,etag:b.etag,s:JSON.parse(raw.toString())}}throw Error('HOT')}
          for(let n=1;n<=5;n++){const before=await stable(),s=before.s,now=new Date().toISOString(),password=`Final-${crypto.randomBytes(18).toString('base64url')}!`,salt=crypto.randomBytes(24),digest=crypto.scryptSync(password,salt,64),hash=`scrypt$${salt.toString('base64url')}$${digest.toString('base64url')}`,id=`final-${crypto.randomUUID()}`,email=`final-${run}@invalid.example`,backup=`private/state/backups/platform-v3-pre-final-${run}-r${Number(s.revision||0)}-${crypto.randomUUID()}.json`;await put(backup,before.raw,{access:'private',addRandomSuffix:false,allowOverwrite:false,contentType:'application/json'});s.users=Array.isArray(s.users)?s.users:[];s.audit=Array.isArray(s.audit)?s.audit:[];s.users.push({id,email,username:email,displayName:`Final V53.1 ${run}`,role:'dealer_agent',tenantId:'wdcc',status:'active',disabled:false,passwordHash:hash});s.audit.push({id:crypto.randomUUID(),at:now,action:'qa.v531_final.create',actor:'github-actions',run,userId:id,backup});s.revision=Number(s.revision||0)+1;s.updatedAt=now;try{await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:before.etag});fs.writeFileSync('/tmp/final.env',`RUN_TAG=${run}\nQA_ID=${id}\nQA_EMAIL=${email}\nQA_PASSWORD=${password}\n`);console.log(JSON.stringify({ok:true,id,email,backup}));process.exit(0)}catch(e){if(e instanceof BlobPreconditionFailedError&&n<5)continue;throw e}}
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- node .wdcc-final-user.mjs
          set -a; . /tmp/final.env; set +a; printf '::add-mask::%s\n' "$QA_PASSWORD"
          echo ok=true >> "$GITHUB_OUTPUT"

      - name: Build exact Cloudflare staging worker
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cat > open-next.config.ts <<'EOF'
          import { defineCloudflareConfig } from "@opennextjs/cloudflare";
          export default defineCloudflareConfig();
          EOF
          node <<'NODE'
          const fs=require('fs'),p='wrangler.jsonc',c=JSON.parse(fs.readFileSync(p,'utf8'));c.name=process.env.WORKER;c.workers_dev=true;c.preview_urls=false;c.keep_vars=true;delete c.route;delete c.routes;c.vars=c.vars||{};c.vars.WDCC_RUNTIME_ROLE='frontend';c.vars.WDCC_DEALER_BACKEND_URL=process.env.BACKEND;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');
          NODE
          npx opennextjs-cloudflare build
          echo ok=true >> "$GITHUB_OUTPUT"

      - name: Deploy isolated staging worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/deploy.log
          grep -q "$STAGE" /tmp/deploy.log || true
          echo ok=true >> "$GITHUB_OUTPUT"

      - name: Require five protected 200s and authenticated UI
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          ok=false; for i in $(seq 1 20); do code="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$STAGE/api/health?final=$GITHUB_RUN_ID-$i" || true)"; if [ "$code" = 200 ] && jq -e '.ok==true and .degraded==false and .release=="WDCC-V53-OPS-HARDENED" and .backend=="healthy"' /tmp/health.json >/dev/null 2>&1; then ok=true; break; fi; sleep 2; done; test "$ok" = true
          set -a; . /tmp/final.env; set +a; printf '::add-mask::%s\n' "$QA_PASSWORD"
          payload="$(jq -nc --arg u "$QA_EMAIL" --arg p "$QA_PASSWORD" '{username:$u,email:$u,password:$p}')"
          LOGIN="$(curl -sS -c /tmp/final.cookies -o /tmp/login.json -w '%{http_code}' -H "Origin: $STAGE" -H 'content-type: application/json' -X POST "$STAGE/api/auth/login" --data "$payload")"
          SESSION="$(curl -sS -b /tmp/final.cookies -o /tmp/session.json -w '%{http_code}' "$STAGE/api/auth/session")"
          DASHBOARD="$(curl -sS -b /tmp/final.cookies -o /tmp/dashboard.json -w '%{http_code}' "$STAGE/api/crm/dashboard")"
          LEADS="$(curl -sS -b /tmp/final.cookies -o /tmp/leads.json -w '%{http_code}' "$STAGE/api/leads")"
          INVENTORY="$(curl -sS -b /tmp/final.cookies -o /tmp/inventory.json -w '%{http_code}' "$STAGE/api/inventory")"
          echo "LOGIN=$LOGIN SESSION=$SESSION DASHBOARD=$DASHBOARD LEADS=$LEADS INVENTORY=$INVENTORY"
          test "$LOGIN" = 200; test "$SESSION" = 200; test "$DASHBOARD" = 200; test "$LEADS" = 200; test "$INVENTORY" = 200
          jq -e '.ok==true' /tmp/login.json >/dev/null; jq -e '.authenticated==true' /tmp/session.json >/dev/null; jq -e '.ok==true' /tmp/dashboard.json >/dev/null; jq -e '.ok==true' /tmp/leads.json >/dev/null; jq -e '.ok==true' /tmp/inventory.json >/dev/null
          cat > .wdcc-final-ui.mjs <<'NODE'
          import{chromium}from'playwright';const base=process.env.STAGE,email=process.env.QA_EMAIL,password=process.env.QA_PASSWORD,b=await chromium.launch({headless:true});try{const c=await b.newContext({viewport:{width:1440,height:1000}}),p=await c.newPage();await p.goto(`${base}/dealer`,{waitUntil:'networkidle'});await p.locator('input[autocomplete="username"]').fill(email);await p.locator('input[autocomplete="current-password"]').fill(password);await p.getByRole('button',{name:/sign in/i}).click();await p.waitForFunction(()=>['NEXT BEST MOVE','OVERDUE','CUSTOMER LIVE','NOTIFY GAPS'].every(x=>document.body.innerText.includes(x)),null,{timeout:30000});await p.screenshot({path:'/tmp/screens/dashboard.png',fullPage:true});await p.goto(`${base}/dealer/leads`,{waitUntil:'networkidle'});await p.waitForFunction(()=>document.body.innerText.includes('OVERDUE')&&document.body.innerText.includes('NOTIFY'),null,{timeout:30000});await p.screenshot({path:'/tmp/screens/leads.png',fullPage:true});await p.goto(`${base}/dealer/inventory`,{waitUntil:'networkidle'});await p.waitForFunction(()=>document.body.innerText.includes('Customer Live'),null,{timeout:30000});await p.screenshot({path:'/tmp/screens/inventory.png',fullPage:true});console.log(JSON.stringify({ok:true}))}finally{await b.close()}
          NODE
          STAGE="$STAGE" QA_EMAIL="$QA_EMAIL" QA_PASSWORD="$QA_PASSWORD" node .wdcc-final-ui.mjs
          echo "login=$LOGIN" >> "$GITHUB_OUTPUT"; echo "session=$SESSION" >> "$GITHUB_OUTPUT"; echo "dashboard=$DASHBOARD" >> "$GITHUB_OUTPUT"; echo "leads=$LEADS" >> "$GITHUB_OUTPUT"; echo "inventory=$INVENTORY" >> "$GITHUB_OUTPUT"; echo ok=true >> "$GITHUB_OUTPUT"

      - name: Re-prove customer unchanged
        id: customer
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -L "$CUSTOMER/?final-stage-after=$GITHUB_RUN_ID" -o /tmp/customer-after.html
          grep -q 'intro-sequence intro-impact' /tmp/customer-after.html
          grep -q 'mobile-action-bar' /tmp/customer-after.html
          grep -q '/assets/cars/2016-ford-f150-limited-1.webp' /tmp/customer-after.html
          echo unchanged=true >> "$GITHUB_OUTPUT"

      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wdcc-v531-final-stage-${{ github.run_id }}
          path: /tmp/screens/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup temporary dealer
        id: cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [ -f /tmp/final.env ] || { echo ok=true >> "$GITHUB_OUTPUT"; exit 0; }
          set -a; . /tmp/final.env; set +a; export QA_ID RUN_TAG
          cat > .wdcc-final-clean.mjs <<'NODE'
          import crypto from'node:crypto';import{get,head,put,BlobPreconditionFailedError}from'@vercel/blob';const path='private/state/platform-v3.json',id=process.env.QA_ID,run=process.env.RUN_TAG;async function stable(){for(let i=0;i<6;i++){const a=await head(path),r=await get(path,{access:'private',useCache:false});if(!r?.stream)throw Error('READ');const c=[];for await(const x of r.stream)c.push(x);const raw=Buffer.concat(c),b=await head(path);if(a.etag===b.etag)return{etag:b.etag,s:JSON.parse(raw.toString())}}throw Error('HOT')}for(let n=1;n<=5;n++){const before=await stable(),s=before.s,u=Array.isArray(s.users)?s.users:[];s.users=u.filter(x=>x.id!==id);s.audit=Array.isArray(s.audit)?s.audit:[];s.audit.push({id:crypto.randomUUID(),at:new Date().toISOString(),action:'qa.v531_final.cleanup',actor:'github-actions',run,userId:id});s.revision=Number(s.revision||0)+1;s.updatedAt=new Date().toISOString();try{await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:before.etag});console.log(JSON.stringify({ok:true,removed:u.length-s.users.length}));process.exit(0)}catch(e){if(e instanceof BlobPreconditionFailedError&&n<5)continue;throw e}}
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- node .wdcc-final-clean.mjs
          echo ok=true >> "$GITHUB_OUTPUT"

      - name: Publish final staging evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          C: ${{ steps.contract.outcome }}
          L: ${{ steps.contract.outputs.login }}
          S: ${{ steps.contract.outputs.session }}
          D: ${{ steps.contract.outputs.dashboard }}
          E: ${{ steps.contract.outputs.leads }}
          I: ${{ steps.contract.outputs.inventory }}
          CUSTOMER_OK: ${{ steps.customer.outputs.unchanged }}
          CLEAN: ${{ steps.cleanup.outcome }}
        shell: bash
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC V53.1 final staging acceptance $GITHUB_RUN_ID" --body "Exact source: \`$SOURCE_SHA\`
          Backend: \`$BACKEND\`
          Staging: \`$STAGE\`
          Authenticated API + UI contract: **$C**
          Login/Session/CRM/Leads/Inventory: \`${L:-?}/${S:-?}/${D:-?}/${E:-?}/${I:-?}\`
          Customer baseline unchanged: **${CUSTOMER_OK:-false}**
          Temporary identity cleanup: **$CLEAN**

          No production DNS, alias, or live Worker traffic is changed." || true
