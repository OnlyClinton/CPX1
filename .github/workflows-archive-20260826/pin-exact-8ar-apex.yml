name: Pin exact immutable 8AR apex
# trigger-refresh: 2026-08-25T14:43Z
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pin-exact-8ar-apex.yml'
  workflow_dispatch:

jobs:
  pin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM: cpxagency
      DONOR: wdcc-v32-storefront-dkel7d5n2-cpxagency.vercel.app
      DONOR_ID: dpl_8ARLPgiW4ZKC9qwQxJrwqc2hrZzX
      APEX: wedontcarecars.com
      WWW: www.wedontcarecars.com
    steps:
      - name: Require token
        run: test -n "$VERCEL_TOKEN"

      - name: Install Vercel CLI
        run: npm install --global vercel@59.3.0 >/dev/null

      - name: Pin apex and www to exact 8AR artifact
        id: alias
        shell: bash
        run: |
          set -euo pipefail
          vercel alias set "$DONOR" "$APEX" --token="$VERCEL_TOKEN" --scope="$TEAM"
          vercel alias set "$DONOR" "$WWW" --token="$VERCEL_TOKEN" --scope="$TEAM"

      - name: Verify exact 8AR public render contract
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          for host in "$APEX" "$WWW"; do
            ok=0
            for i in $(seq 1 20); do
              curl -sS "https://$host/?intro=1&pin=${GITHUB_RUN_ID}" -o /tmp/live.html || true
              if grep -q 'intro-sequence intro-reveal' /tmp/live.html \
                && grep -q 'intro-scene' /tmp/live.html \
                && grep -q 'intro-smoke smoke-one' /tmp/live.html \
                && grep -q 'intro-smoke smoke-two' /tmp/live.html \
                && grep -q 'wdcc-hero-v2.webp' /tmp/live.html \
                && grep -q 'Tampa Bay · Drive today' /tmp/live.html \
                && grep -q 'Schedule a test drive' /tmp/live.html; then
                ok=1; break
              fi
              sleep 2
            done
            test "$ok" = '1'
          done
          echo 'pinned=true' >> "$GITHUB_OUTPUT"

      - name: Report exact 8AR pin
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ALIAS_STATUS: ${{ steps.alias.outcome }}
          VERIFY_STATUS: ${{ steps.verify.outcome }}
          PINNED: ${{ steps.verify.outputs.pinned }}
        shell: bash
        run: |
          body=$(printf 'Alias pin: **%s**\nExact 8AR render verification: **%s**\nPinned: `%s`\n\nApex: https://wedontcarecars.com/?intro=1\nPinned donor: `%s` (`%s`)\nDealer/backend were not changed.' "$ALIAS_STATUS" "$VERIFY_STATUS" "$PINNED" "$DONOR" "$DONOR_ID")
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC exact 8AR live pin ${GITHUB_SHA:0:7}" --body "$body" || true
