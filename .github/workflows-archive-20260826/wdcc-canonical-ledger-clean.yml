name: WDCC Canonical Ledger Clean
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wdcc-canonical-ledger-clean.yml']
  workflow_dispatch:
jobs:
  clean:
    runs-on: ubuntu-latest
    permissions: {contents: read, issues: write}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      PROJECT_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
      STORE_ID: store_cNUyQRVlXtyvZQ5N
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm install --global vercel@59.3.0 >/dev/null
      - run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$ORG_ID" "$PROJECT_ID" > .vercel/project.json
      - name: Backup and clean canonical ledger with optimistic retry
        id: clean
        shell: bash
        run: |
          set -euo pipefail
          cat > .wdcc-clean.mjs <<'NODE'
          import crypto from 'node:crypto';
          import {get,head,put,BlobPreconditionFailedError} from '@vercel/blob';
          const oidc=process.env.VERCEL_OIDC_TOKEN,storeId=process.env.STORE_ID,path='private/state/platform-v3.json';
          const opts={oidcToken:oidc,storeId};
          async function readStable(){
            for(let i=0;i<3;i++){
              const m1=await head(path,opts);const r=await get(path,{access:'private',useCache:false,...opts});if(!r||r.statusCode!==200||!r.stream)throw Error('STATE_READ_FAILED');const chunks=[];for await(const c of r.stream)chunks.push(c);const m2=await head(path,opts);if(m1.etag===m2.etag)return {raw:Buffer.concat(chunks),etag:m2.etag,state:JSON.parse(Buffer.concat(chunks).toString('utf8'))};
            }
            throw Error('STATE_TOO_HOT_TO_READ_STABLY');
          }
          const badVehicle=v=>{const status=String(v?.status||'').toLowerCase(),stock=String(v?.stock||'').toUpperCase(),badges=Array.isArray(v?.badges)?v.badges.map(x=>String(x).toUpperCase()):[];const invalid=Number(v?.year)<=1900||!String(v?.make||'').trim()||!String(v?.model||'').trim()||Number(v?.price||0)<=0;const synthetic=stock.startsWith('R36TEST-')||stock.startsWith('WDCC-QA-')||badges.includes('R36-TEST')||badges.includes('QA');return status==='published'&&(invalid||synthetic)};
          const qaLead=l=>l?.qa===true||String(l?.status||'').toLowerCase()==='test'||String(l?.email||'').toLowerCase().endsWith('@invalid.example')||['WDCC QA ','WDCC V52 QA','WDCC MATRIX','WDCC ISOLATED'].some(p=>String(l?.name||'').toUpperCase().startsWith(p));
          let result=null;
          for(let attempt=1;attempt<=2;attempt++){
            const before=await readStable();const s=before.state;const rev=Number(s.revision||0);const vehicleIds=(s.vehicles||[]).filter(badVehicle).map(v=>v.id),leadIds=(s.leads||[]).filter(qaLead).map(l=>l.id);
            if(!vehicleIds.length&&!leadIds.length){result={ok:true,noOp:true,revision:rev,vehiclesArchived:0,qaLeadsRemoved:0,backup:null};break;}
            const now=new Date().toISOString(),hash=crypto.createHash('sha256').update(before.raw).digest('hex');const backup=`private/state/backups/platform-v3-pre-qa-clean-r${rev}-${now.replace(/[:.]/g,'-')}-${crypto.randomUUID()}.json`;
            await put(backup,before.raw,{access:'private',addRandomSuffix:false,allowOverwrite:false,contentType:'application/json',...opts});
            s.vehicles=(s.vehicles||[]).map(v=>vehicleIds.includes(v.id)?{...v,status:'archived',updatedAt:now,qaCleanupAt:now}:v);s.leads=(s.leads||[]).filter(l=>!leadIds.includes(l.id));s.audit=Array.isArray(s.audit)?s.audit:[];
            for(const id of vehicleIds)s.audit.push({id:crypto.randomUUID(),at:now,action:'qa.cleanup.vehicle_archive',actor:'wdcc-canonical-ledger-clean',vehicleId:id});for(const id of leadIds)s.audit.push({id:crypto.randomUUID(),at:now,action:'qa.cleanup.lead_remove',actor:'wdcc-canonical-ledger-clean',leadId:id});s.audit.push({id:crypto.randomUUID(),at:now,action:'qa.cleanup.summary',actor:'wdcc-canonical-ledger-clean',fromRevision:rev,vehiclesArchived:vehicleIds.length,qaLeadsRemoved:leadIds.length,backup,beforeHash:hash});s.revision=rev+1;s.updatedAt=now;
            try{await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:before.etag,...opts});const after=await readStable();const bad=(after.state.vehicles||[]).filter(badVehicle).length,qa=(after.state.leads||[]).filter(qaLead).length;if(bad||qa)throw Error(`VERIFY_FAILED_bad_${bad}_qa_${qa}`);result={ok:true,noOp:false,fromRevision:rev,toRevision:Number(after.state.revision||0),vehiclesArchived:vehicleIds.length,qaLeadsRemoved:leadIds.length,backup};break;}catch(e){if(e instanceof BlobPreconditionFailedError&&attempt<2)continue;throw e;}
          }
          if(!result)throw Error('CLEAN_RESULT_MISSING');console.log('CLEAN_RESULT='+JSON.stringify(result));
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope=cpxagency -- node .wdcc-clean.mjs | tee /tmp/clean.log
          grep '^CLEAN_RESULT=' /tmp/clean.log | tail -1 | cut -d= -f2- >/tmp/clean.json
          cat /tmp/clean.json | jq .
          echo "vehicles=$(jq -r '.vehiclesArchived' /tmp/clean.json)" >> "$GITHUB_OUTPUT"
          echo "leads=$(jq -r '.qaLeadsRemoved' /tmp/clean.json)" >> "$GITHUB_OUTPUT"
          echo "revision=$(jq -r '.toRevision // .revision' /tmp/clean.json)" >> "$GITHUB_OUTPUT"
          echo "backup=$(jq -r '.backup // "none"' /tmp/clean.json)" >> "$GITHUB_OUTPUT"
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          VEHICLES: ${{ steps.clean.outputs.vehicles }}
          LEADS: ${{ steps.clean.outputs.leads }}
          REVISION: ${{ steps.clean.outputs.revision }}
          BACKUP: ${{ steps.clean.outputs.backup }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC canonical cleanup ${GITHUB_RUN_ID}" --body "Status **$STATUS** — revision ${REVISION:-unknown}; QA/invalid vehicles archived ${VEHICLES:-unknown}; QA leads removed ${LEADS:-unknown}; immutable backup ${BACKUP:-unknown}." || true
