name: WDCC Live V52 Acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'ops/wdcc-live-e2e-trigger.txt'
      - '.github/workflows/wdcc-live-e2e.yml'
  workflow_dispatch:

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BASE: https://dealer.wedontcarecars.com
    steps:
      - uses: actions/checkout@v4

      - name: Health is live and healthy
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$BASE/api/health")"
          test "$code" = "200"
          jq -e '.ok == true and .degraded == false and .backend == "healthy"' /tmp/health.json >/dev/null
          cat /tmp/health.json

      - name: Hardened dealer login headers
        shell: bash
        run: |
          set -euo pipefail
          curl -sSI "$BASE/dealer/login" > /tmp/login.headers
          grep -qi '^content-security-policy:' /tmp/login.headers
          grep -qi '^access-control-allow-origin: https://dealer\.wedontcarecars\.com' /tmp/login.headers
          grep -qi '^strict-transport-security: max-age=63072000; includeSubDomains; preload' /tmp/login.headers
          grep -qi '^x-frame-options: DENY' /tmp/login.headers
          grep -qi '^cache-control: private, no-store' /tmp/login.headers
          cat /tmp/login.headers

      - name: Anonymous session is denied
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/session.json -w '%{http_code}' "$BASE/api/auth/session")"
          test "$code" = "200"
          jq -e '.authenticated == false and .user == null and .session == null' /tmp/session.json >/dev/null
          cat /tmp/session.json

      - name: Inventory read works
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/inventory.json -w '%{http_code}' "$BASE/api/inventory")"
          test "$code" = "200"
          jq -e '.ok == true and (.items | type == "array") and (.items | length > 0)' /tmp/inventory.json >/dev/null
          jq '{ok, count:(.items|length), sample:(.items[:3]|map({year,make,model,status}))}' /tmp/inventory.json

      - name: Invalid and cross-origin auth are blocked
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/invalid.json -w '%{http_code}' -H 'Origin: https://dealer.wedontcarecars.com' -H 'Content-Type: application/json' -X POST "$BASE/api/auth/login" --data '{"email":"__wdcc_qa_invalid__","password":"definitely-wrong"}')"
          test "$code" = "401"
          code="$(curl -sS -o /tmp/cross.json -w '%{http_code}' -H 'Origin: https://evil.example' -H 'Content-Type: application/json' -X POST "$BASE/api/auth/login" --data '{"email":"x","password":"x"}')"
          test "$code" = "403"
          cat /tmp/invalid.json; echo; cat /tmp/cross.json

      - name: Anonymous dealer writes are blocked
        shell: bash
        run: |
          set -euo pipefail
          before="$(curl -sS "$BASE/api/inventory" | jq '.items|length')"
          code="$(curl -sS -o /tmp/write.json -w '%{http_code}' -H 'Origin: https://dealer.wedontcarecars.com' -H 'Content-Type: application/json' -X POST "$BASE/api/inventory" --data '{"year":2024,"make":"WDCC-QA-NO-WRITE","model":"BLOCKED","price":1}')"
          case "$code" in 400|401|403) ;; *) echo "unexpected inventory write status $code" >&2; cat /tmp/write.json; exit 1;; esac
          code2="$(curl -sS -o /tmp/upload.json -w '%{http_code}' -H 'Origin: https://dealer.wedontcarecars.com' -H 'Content-Type: application/json' -X POST "$BASE/api/upload" --data '{}')"
          case "$code2" in 400|401|403) ;; *) echo "unexpected upload status $code2" >&2; cat /tmp/upload.json; exit 1;; esac
          after="$(curl -sS "$BASE/api/inventory" | jq '.items|length')"
          test "$before" = "$after"
          echo "inventory_count_before=$before inventory_count_after=$after inventory_write_status=$code upload_status=$code2"

      - name: Create and deduplicate all three customer lead types
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date +%s)"
          for kind in schedule contact approval; do
            key="wdcc-live-v52-${kind}-${stamp}"
            payload="$(jq -nc --arg kind "$kind" --arg name "WDCC LIVE QA ${kind} ${stamp}" --arg key "$key" '{kind:$kind,name:$name,email:"wdcc-live-qa@example.com",phone:"5550100199",vehicleInterest:"V52 live acceptance test",message:"Automated WDCC production QA; safe to archive",preferredTime:"QA only",source:"live-v52-acceptance",consent:true,idempotencyKey:$key}')"
            code="$(curl -sS -o "/tmp/lead-${kind}.json" -w '%{http_code}' -H 'Content-Type: application/json' -H "Idempotency-Key: $key" -X POST "$BASE/api/leads" --data "$payload")"
            case "$code" in 200|201) ;; *) echo "$kind lead failed status=$code" >&2; cat "/tmp/lead-${kind}.json"; exit 1;; esac
            jq -e '.ok == true and .persisted == true and .item.id != null' "/tmp/lead-${kind}.json" >/dev/null
            dup="$(curl -sS -o "/tmp/lead-${kind}-dup.json" -w '%{http_code}' -H 'Content-Type: application/json' -H "Idempotency-Key: $key" -X POST "$BASE/api/leads" --data "$payload")"
            case "$dup" in 200|201) ;; *) echo "$kind duplicate check failed status=$dup" >&2; cat "/tmp/lead-${kind}-dup.json"; exit 1;; esac
            jq -e '.ok == true and .item.id != null' "/tmp/lead-${kind}-dup.json" >/dev/null
            echo "--- $kind ---"
            jq '{ok,persisted,deduplicated,source,item:{id:.item.id,kind:.item.kind,name:.item.name},notifications}' "/tmp/lead-${kind}.json"
            echo "duplicate_status=$dup"
          done

      - name: Acceptance summary
        run: |
          echo 'WDCC_V52_LIVE_ACCEPTANCE=PASS'
