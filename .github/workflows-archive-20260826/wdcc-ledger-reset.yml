name: WDCC Synthetic Ledger Reset
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-ledger-reset.yml'
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      DEALER_PROJECT_ID: prj_fz5mN7Q5gImZ9UGpv1GDpHxPtLNB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pull canonical dealer bindings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          npm install --global vercel@59.3.0 >/dev/null
          mkdir -p /tmp/dealer/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$DEALER_PROJECT_ID" > /tmp/dealer/.vercel/project.json
          cd /tmp/dealer
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env pull /tmp/dealer.env --yes --environment=production --token="$VERCEL_TOKEN" --scope=cpxagency >/dev/null
          grep -q '^BLOB_READ_WRITE_TOKEN=' /tmp/dealer.env
      - name: Back up and clean synthetic ledger records
        id: clean
        shell: bash
        run: |
          set -euo pipefail
          set -a; . /tmp/dealer.env; set +a
          node --input-type=module <<'NODE' > /tmp/reset.json
          import crypto from 'node:crypto';
          import {get,put} from '@vercel/blob';
          const token=process.env.BLOB_READ_WRITE_TOKEN;
          const path='private/state/platform-v3.json';
          const read=async()=>{
            const r=await get(path,{access:'private',useCache:false,token});
            if(!r||r.statusCode!==200||!r.stream)throw Error('STATE_READ_FAILED');
            const chunks=[]; for await(const c of r.stream)chunks.push(c);
            return JSON.parse(Buffer.concat(chunks).toString('utf8'));
          };
          const state=await read();
          const before=JSON.stringify(state,null,2)+'\n';
          const stamp=new Date().toISOString();
          const badVehicle=v=>{
            const status=String(v?.status||'').toLowerCase();
            const stock=String(v?.stock||'').toUpperCase();
            const badges=Array.isArray(v?.badges)?v.badges.map(x=>String(x).toUpperCase()):[];
            const structurallyInvalid=Number(v?.year)<=1900||!String(v?.make||'').trim()||!String(v?.model||'').trim()||Number(v?.price||0)<=0;
            const synthetic=stock.startsWith('R36TEST-')||stock.startsWith('WDCC-QA-')||badges.includes('R36-TEST')||badges.includes('QA');
            return status==='published'&&(synthetic||structurallyInvalid);
          };
          const qaLead=l=>{
            const email=String(l?.email||'').toLowerCase();
            const name=String(l?.name||'').toUpperCase();
            return l?.qa===true||String(l?.status||'').toLowerCase()==='test'||email.endsWith('@invalid.example')||name.startsWith('WDCC QA ')||name.startsWith('WDCC MATRIX')||name.startsWith('WDCC ISOLATED')||name.startsWith('WDCC V52 QA');
          };
          const vehicleIds=(state.vehicles||[]).filter(badVehicle).map(v=>v.id);
          const leadIds=(state.leads||[]).filter(qaLead).map(l=>l.id);
          const backup=`private/state/backups/platform-v3-pre-synthetic-reset-${stamp.replace(/[:.]/g,'-')}-${crypto.randomUUID()}.json`;
          await put(backup,before,{access:'private',addRandomSuffix:false,allowOverwrite:false,contentType:'application/json',token});
          const now=new Date().toISOString();
          state.vehicles=(state.vehicles||[]).map(v=>vehicleIds.includes(v.id)?{...v,status:'archived',updatedAt:now,qaCleanupAt:now}:v);
          state.leads=(state.leads||[]).filter(l=>!leadIds.includes(l.id));
          state.audit=Array.isArray(state.audit)?state.audit:[];
          for(const id of vehicleIds)state.audit.push({id:crypto.randomUUID(),at:now,action:'qa.cleanup.vehicle_archive',actor:'wdcc-deep-qa',vehicleId:id});
          for(const id of leadIds)state.audit.push({id:crypto.randomUUID(),at:now,action:'qa.cleanup.lead_remove',actor:'wdcc-deep-qa',leadId:id});
          state.audit.push({id:crypto.randomUUID(),at:now,action:'qa.cleanup.summary',actor:'wdcc-deep-qa',vehiclesArchived:vehicleIds.length,qaLeadsRemoved:leadIds.length,backup});
          state.revision=Number(state.revision||0)+1;
          state.updatedAt=now;
          await put(path,JSON.stringify(state,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',token});
          const after=await read();
          const stillBad=(after.vehicles||[]).filter(badVehicle).length;
          const stillQa=(after.leads||[]).filter(qaLead).length;
          if(stillBad||stillQa)throw Error(`RESET_VERIFY_FAILED vehicles=${stillBad} leads=${stillQa}`);
          console.log(JSON.stringify({ok:true,backup,vehiclesArchived:vehicleIds.length,vehicleIds,qaLeadsRemoved:leadIds.length,revision:after.revision},null,2));
          NODE
          cat /tmp/reset.json
          echo "vehicles=$(jq -r '.vehiclesArchived' /tmp/reset.json)" >> "$GITHUB_OUTPUT"
          echo "leads=$(jq -r '.qaLeadsRemoved' /tmp/reset.json)" >> "$GITHUB_OUTPUT"
          echo "backup=$(jq -r '.backup' /tmp/reset.json)" >> "$GITHUB_OUTPUT"
      - name: Verify public inventory is clean
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://wedontcarecars.com/api/inventory?reset=${GITHUB_RUN_ID}" -o /tmp/public.json
          jq -e '.ok==true and ((.items//[])|type)=="array"' /tmp/public.json >/dev/null
          jq -e 'all((.items//[])[]; ((.status|ascii_downcase)=="published") and (.year>1900) and ((.make|length)>0) and ((.model|length)>0) and (.price>0) and (((.stock//"")|ascii_upcase|startswith("R36TEST-"))|not) and (((.stock//"")|ascii_upcase|startswith("WDCC-QA-"))|not))' /tmp/public.json >/dev/null
          echo "count=$(jq '(.items//[])|length' /tmp/public.json)" >> "$GITHUB_OUTPUT"
      - name: Report reset proof
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          VEHICLES: ${{ steps.clean.outputs.vehicles }}
          LEADS: ${{ steps.clean.outputs.leads }}
          BACKUP: ${{ steps.clean.outputs.backup }}
          VERIFY: ${{ steps.verify.outcome }}
          COUNT: ${{ steps.verify.outputs.count }}
        shell: bash
        run: |
          body=$(printf 'Status: **%s**\nSynthetic/invalid vehicles archived: `%s`\nSynthetic QA leads removed: `%s`\nImmutable pre-reset backup: `%s`\nPublic inventory verification: **%s**\nPublic inventory count after reset: `%s`' "$STATUS" "$VEHICLES" "$LEADS" "$BACKUP" "$VERIFY" "$COUNT")
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC synthetic ledger reset ${GITHUB_RUN_ID}" --body "$body" || true

# This reset never deletes real customer or dealer records. It archives only unmistakable synthetic/invalid published vehicles and removes unmistakable synthetic QA leads after creating an immutable backup.
