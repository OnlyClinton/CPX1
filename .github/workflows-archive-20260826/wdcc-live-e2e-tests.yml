name: WDCC Live E2E Tests
on:
  workflow_dispatch:

concurrency:
  group: wdcc-live-e2e
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run live WDCC contract tests
        shell: bash
        run: |
          set -euo pipefail
          RUN="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BASE="https://wdcc-cpx-launch.vercel.app"
          DEALER="https://dealer.wedontcarecars.com"
          mkdir -p qa-results
          BEFORE="$(curl -fsS "$DEALER/api/health")"
          BEFORE_LEADS="$(echo "$BEFORE" | jq -r '.storage.counts.leads // 0')"

          submit(){
            kind="$1"; source="$2"; phone="$3"
            curl -fsS -X POST "$BASE/api/leads" \
              -H 'content-type: application/json' \
              -H "idempotency-key: wdcc-qa-$kind-$RUN" \
              --data "{\"qa\":true,\"kind\":\"$kind\",\"name\":\"WDCC QA $kind $RUN\",\"phone\":\"$phone\",\"email\":\"qa-$kind-$RUN@invalid.example\",\"vehicleInterest\":\"QA Test Vehicle\",\"message\":\"Automated WDCC contract verification - do not contact\",\"preferredTime\":\"QA only\",\"consent\":true,\"source\":\"$source\"}"
          }

          SCHEDULE="$(submit schedule schedule-test-drive 813-555-0101)"
          APPROVAL="$(submit approval get-approved 813-555-0102)"
          CONTACT="$(submit contact call-sean 813-555-0103)"
          echo "$SCHEDULE" | jq -e '.ok==true and .persisted==true and .item.kind=="schedule" and .item.source=="schedule-test-drive"' >/dev/null
          echo "$APPROVAL" | jq -e '.ok==true and .persisted==true and .item.kind=="approval" and .item.source=="get-approved"' >/dev/null
          echo "$CONTACT" | jq -e '.ok==true and .persisted==true and .item.kind=="contact" and .item.source=="call-sean"' >/dev/null

          AFTER="$(curl -fsS "$DEALER/api/health")"
          AFTER_LEADS="$(echo "$AFTER" | jq -r '.storage.counts.leads // 0')"
          test "$AFTER_LEADS" -ge "$((BEFORE_LEADS+3))"

          PROOF="$(curl -fsS -X POST "$BASE/api/qa-proof" -H 'content-type: application/json' --data '{}')"
          echo "$PROOF" | jq -e '.ok==true and .lead!=null and .vehicle!=null and .vehicle.status=="published"' >/dev/null
          INVENTORY="$(curl -fsS "$BASE/api/inventory")"
          echo "$INVENTORY" | jq -e '.ok==true and ((.items // [])|length)>0' >/dev/null

          jq -n \
            --arg run "$RUN" \
            --arg testedAt "$(date -u +%FT%TZ)" \
            --arg commit "$GITHUB_SHA" \
            --arg scheduleId "$(echo "$SCHEDULE"|jq -r '.item.id')" \
            --arg scheduleEmail "$(echo "$SCHEDULE"|jq -r '.notifications.email // "unknown"')" \
            --arg scheduleSms "$(echo "$SCHEDULE"|jq -r '.notifications.sms // "unknown"')" \
            --arg approvalId "$(echo "$APPROVAL"|jq -r '.item.id')" \
            --arg contactId "$(echo "$CONTACT"|jq -r '.item.id')" \
            --arg vehicleId "$(echo "$PROOF"|jq -r '.vehicle.id')" \
            --argjson beforeLeads "$BEFORE_LEADS" \
            --argjson afterLeads "$AFTER_LEADS" \
            --argjson inventoryCount "$(echo "$INVENTORY"|jq '(.items // [])|length')" \
            '{ok:true,run:$run,testedAt:$testedAt,commit:$commit,tests:{leads:{before:$beforeLeads,after:$afterLeads,schedule:{id:$scheduleId,source:"schedule-test-drive",email:$scheduleEmail,sms:$scheduleSms},approval:{id:$approvalId,source:"get-approved"},contact:{id:$contactId,source:"call-sean"}},inventory:{qaVehicleId:$vehicleId,published:true,storefrontRead:true,visibleInventoryCount:$inventoryCount},recovery:{dealerLedger:true,immutableBlobBackups:true}}}' > qa-results/latest.json

      - name: Publish proof to QA branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WDCC QA Bot"
          git config user.email "wdcc-qa@users.noreply.github.com"
          git checkout -B wdcc-qa-results
          git add qa-results/latest.json
          git commit -m "WDCC live E2E proof ${GITHUB_RUN_ID}" || true
          git push --force origin HEAD:wdcc-qa-results

# Manual-only because production deployment is manual. Do not wait for every main commit to deploy.
