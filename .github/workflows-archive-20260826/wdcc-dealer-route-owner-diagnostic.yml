name: WDCC Dealer Route Owner Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-dealer-route-owner-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Resolve exact dealer route owner
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN"; test -n "$CF_ACCOUNT"
          zone_json="$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=wedontcarecars.com&account.id=$CF_ACCOUNT")"
          ZONE="$(printf '%s' "$zone_json" | jq -r '.result[0].id')"; test -n "$ZONE"; test "$ZONE" != null
          curl -fsS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE/workers/routes" -o /tmp/routes.json
          curl -fsS -D /tmp/live.h -o /tmp/live.json "https://dealer.wedontcarecars.com/api/health?route_diag=$GITHUB_RUN_ID" || true
          dealer_routes="$(jq -c '[.result[]|select(.pattern|test("dealer\\.wedontcarecars\\.com"))|{id,pattern,script}]' /tmp/routes.json)"
          edge="$(awk 'BEGIN{IGNORECASE=1}/^x-wdcc-edge:/{sub(/\r$/,"",$2);print $2}' /tmp/live.h | tail -1)"
          origin="$(awk 'BEGIN{IGNORECASE=1}/^x-wdcc-origin:/{sub(/\r$/,"",$2);print $2}' /tmp/live.h | tail -1)"
          service="$(jq -r '.service // "unknown"' /tmp/live.json 2>/dev/null || echo unknown)"
          release="$(jq -r '.release // "unknown"' /tmp/live.json 2>/dev/null || echo unknown)"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC dealer route owner diagnostic $GITHUB_RUN_ID" --body "Dealer routes: \`$dealer_routes\`\nLive x-wdcc-edge: \`$edge\`\nLive x-wdcc-origin: \`$origin\`\nLive service/release: \`$service / $release\`\nThis diagnostic performs no route, DNS, Worker, Vercel, or data mutation." || true
