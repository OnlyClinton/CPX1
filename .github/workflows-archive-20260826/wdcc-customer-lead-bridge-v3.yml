name: WDCC Customer Lead Bridge V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wdcc-customer-lead-bridge-v3.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wdcc-customer-lead-bridge-v3-live
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CUSTOMER: https://wedontcarecars.com
      DEALER: https://dealer.wedontcarecars.com
      API_ORIGIN: https://wdcc-cpx-launch-qhcvflfih-cpxagency.vercel.app
      WORKER: wdcc-customer-lead-v53
      PATTERN: wedontcarecars.com/api/leads*
      TEAM: cpxagency
      TEAM_ID: team_G6jmETRRl8fV3KfivPOdj8JM
      PHOENIX_ID: prj_a3oclCcy4sbA2tge4BX7VAKXE4KR
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_API_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Preflight canonical backend and current storefront
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ZONE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VERCEL_TOKEN; do test -n "${!v:-}" || exit 20; done
          test "$(curl -sS -o /tmp/backend.json -w '%{http_code}' "$API_ORIGIN/api/health?v3=$GITHUB_RUN_ID")" = 200
          jq -e '.ok==true and .degraded==false and .service=="wdcc-canonical-authority" and .release=="WDCC-V53-CANONICAL"' /tmp/backend.json >/dev/null
          test "$(curl -sS -L -o /tmp/home.html -w '%{http_code}' "$CUSTOMER/?lead_v3_before=$GITHUB_RUN_ID")" = 200
          grep -q 'class="refHome"' /tmp/home.html;grep -q 'class="refHero"' /tmp/home.html;grep -q 'class="refBenefits"' /tmp/home.html
          echo ok=true >> "$GITHUB_OUTPUT"

      - name: Install runtime
        run: |
          set -euo pipefail
          npm ci
          npm install --global wrangler@4.90.0 vercel@59.5.0 >/dev/null
          mkdir -p /tmp/lead-v3 .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$TEAM_ID" "$PHOENIX_ID" > .vercel/project.json

      - name: Build minimal canonical-host lead worker
        shell: bash
        working-directory: /tmp/lead-v3
        run: |
          set -euo pipefail
          cat > worker.js <<'EOF'
          const API='https://wdcc-cpx-launch-qhcvflfih-cpxagency.vercel.app';
          function apiHeaders(req){const h=new Headers();for(const n of ['accept','accept-language','content-type','idempotency-key','user-agent','x-wdcc-request-id']){const v=req.headers.get(n);if(v)h.set(n,v)}h.set('x-wdcc-frontdoor','customer-lead-v53');return h}
          export default{async fetch(req){const u=new URL(req.url);if(!u.pathname.startsWith('/api/leads'))return new Response('Not found',{status:404});const t=new URL(API);t.pathname=u.pathname;t.search=u.search;try{const init={method:req.method,headers:apiHeaders(req),redirect:'manual'};if(!['GET','HEAD'].includes(req.method))init.body=req.body;const r=await fetch(t.toString(),init),h=new Headers(r.headers);h.set('cache-control','no-store');h.set('x-wdcc-edge','customer-lead-v53');h.set('x-wdcc-origin',t.hostname);return new Response(r.body,{status:r.status,statusText:r.statusText,headers:h})}catch(e){return Response.json({ok:false,persisted:false,error:'canonical_lead_authority_unavailable'},{status:503,headers:{'cache-control':'no-store','x-wdcc-edge':'customer-lead-v53'}})}}};
          EOF
          cat > wrangler.jsonc <<EOF
          {"name":"$WORKER","main":"worker.js","compatibility_date":"2026-08-25","compatibility_flags":["global_fetch_strictly_public"],"workers_dev":true,"preview_urls":true,"observability":{"enabled":true}}
          EOF

      - name: Stage all three lead types on workers.dev
        id: stage
        shell: bash
        working-directory: /tmp/lead-v3
        run: |
          set -euo pipefail
          wrangler deploy 2>&1 | tee /tmp/stage.log
          URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/stage.log|tail -1)";test -n "$URL";echo "url=$URL" >> "$GITHUB_OUTPUT"
          : >/tmp/stage-ids
          for spec in 'schedule schedule-test-drive' 'approval get-approved' 'contact call-sean';do set -- $spec;k="$1";s="$2";key="wdcc-qa-v3-stage-${k}-${GITHUB_RUN_ID}";body="$(jq -nc --arg k "$k" --arg s "$s" --arg r "$GITHUB_RUN_ID" '{qa:true,kind:$k,name:("WDCC QA LEAD V3 STAGE "+$k+" "+$r),phone:"813-555-0194",email:("lead-v3-stage-"+$k+"-"+$r+"@invalid.example"),vehicleInterest:"Lead V3 stage",message:"Automated WDCC contract verification",consent:true,source:$s,pagePath:("/qa/lead-v3-stage-"+$k)}')";code="$(curl -sS -D "/tmp/stage-${k}.h" -o "/tmp/stage-${k}.json" -w '%{http_code}' -H 'content-type: application/json' -H "Idempotency-Key: $key" -X POST "$URL/api/leads" --data "$body")";echo "$k=$code";case "$code" in 200|201);;*)cat "/tmp/stage-${k}.json";exit 1;;esac;jq -e '.ok==true and .persisted==true and .item.id!=null' "/tmp/stage-${k}.json" >/dev/null;grep -qi '^x-wdcc-origin: wdcc-cpx-launch-qhcvflfih-cpxagency.vercel.app' "/tmp/stage-${k}.h";jq -r '.item.id' "/tmp/stage-${k}.json" >>/tmp/stage-ids;done
          echo ok=true >> "$GITHUB_OUTPUT"

      - name: Create disposable dealer verifier
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          export RUN_TAG="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > .lead-v3-user.mjs <<'NODE'
          import crypto from'node:crypto';import fs from'node:fs';import{get,head,put,BlobPreconditionFailedError}from'@vercel/blob';const path='private/state/platform-v3.json',run=process.env.RUN_TAG;async function stable(){for(let i=0;i<8;i++){const a=await head(path),r=await get(path,{access:'private',useCache:false});if(!r?.stream)throw Error('READ');const c=[];for await(const x of r.stream)c.push(x);const raw=Buffer.concat(c),b=await head(path);if(a.etag===b.etag)return{etag:b.etag,s:JSON.parse(raw.toString())}}throw Error('HOT')}for(let n=1;n<=6;n++){const b=await stable(),s=b.s,password=`LeadV3-${crypto.randomBytes(18).toString('base64url')}!`,salt=crypto.randomBytes(24),digest=crypto.scryptSync(password,salt,64),hash=`scrypt$${salt.toString('base64url')}$${digest.toString('base64url')}`,id=`lead-v3-${crypto.randomUUID()}`,email=`lead-v3-${run}@invalid.example`,now=new Date().toISOString();s.users=Array.isArray(s.users)?s.users:[];s.users.push({id,email,username:email,displayName:`WDCC Lead V3 ${run}`,role:'dealer_agent',tenantId:'wdcc',status:'active',disabled:false,passwordHash:hash});s.revision=Number(s.revision||0)+1;s.updatedAt=now;try{await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:b.etag});fs.writeFileSync('/tmp/lead-v3.env',`QA_ID=${id}\nQA_EMAIL=${email}\nQA_PASSWORD=${password}\nRUN_TAG=${run}\n`);console.log(JSON.stringify({ok:true,id}));process.exit(0)}catch(e){if(e instanceof BlobPreconditionFailedError&&n<6)continue;throw e}}
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- node .lead-v3-user.mjs
          set -a;. /tmp/lead-v3.env;set +a;printf '::add-mask::%s\n' "$QA_PASSWORD";echo ok=true >> "$GITHUB_OUTPUT"

      - name: Capture and bind narrow customer lead route
        id: bind
        shell: bash
        working-directory: /tmp/lead-v3
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_ZONE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=wedontcarecars.com&account.id=$CLOUDFLARE_ACCOUNT_ID&per_page=50" -o /tmp/zones.json
          ZONE="$(jq -r '.result[0].id' /tmp/zones.json)";test -n "$ZONE";echo "$ZONE" >/tmp/zone
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_ZONE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE/workers/routes" -o /tmp/routes-before.json
          jq -c --arg p "$PATTERN" '[.result[]?|select(.pattern==$p)]|first//null' /tmp/routes-before.json >/tmp/route-before.json
          node - <<'NODE'
          const fs=require('fs'),p='wrangler.jsonc',c=JSON.parse(fs.readFileSync(p));c.routes=[{pattern:process.env.PATTERN,zone_name:'wedontcarecars.com'}];fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')
          NODE
          wrangler deploy >/tmp/live-deploy.log 2>&1;sleep 3
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_ZONE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE/workers/routes" -o /tmp/routes-after.json
          RID="$(jq -r --arg p "$PATTERN" --arg s "$WORKER" '.result[]?|select(.pattern==$p and .script==$s)|.id' /tmp/routes-after.json|head -1)";test -n "$RID";echo "$RID" >/tmp/route-id;echo ok=true >> "$GITHUB_OUTPUT"

      - name: Prove three real customer lead paths plus dealer readback
        id: live
        shell: bash
        run: |
          set -euo pipefail
          rollback(){ rc=$?;trap - ERR INT TERM;ZONE="$(cat /tmp/zone)";RID="$(cat /tmp/route-id 2>/dev/null||true)";BEFORE="$(cat /tmp/route-before.json)";if [ "$BEFORE" = null ];then [ -n "$RID" ]&&curl -fsS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_ZONE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE/workers/routes/$RID" >/dev/null||true;else BID="$(jq -r '.id' /tmp/route-before.json)";BP="$(jq -r '.pattern' /tmp/route-before.json)";BS="$(jq -r '.script // empty' /tmp/route-before.json)";curl -fsS -X PUT -H "Authorization: Bearer $CLOUDFLARE_ZONE_API_TOKEN" -H 'content-type: application/json' "https://api.cloudflare.com/client/v4/zones/$ZONE/workers/routes/$BID" --data "$(jq -nc --arg p "$BP" --arg s "$BS" '{pattern:$p,script:$s}')" >/dev/null||true;fi;exit "$rc";};trap rollback ERR INT TERM
          set -a;. /tmp/lead-v3.env;set +a;printf '::add-mask::%s\n' "$QA_PASSWORD"
          p="$(jq -nc --arg u "$QA_EMAIL" --arg p "$QA_PASSWORD" '{username:$u,email:$u,password:$p}')";LOGIN="$(curl -sS -c /tmp/dealer.cookies -o /tmp/login.json -w '%{http_code}' -H 'content-type: application/json' -X POST "$DEALER/api/auth/login" --data "$p")";test "$LOGIN" = 200;jq -e '.ok==true' /tmp/login.json >/dev/null
          : >/tmp/live-ids
          for spec in 'schedule schedule-test-drive' 'approval get-approved' 'contact call-sean';do set -- $spec;k="$1";s="$2";key="wdcc-qa-lead-v3-${k}-${RUN_TAG}";body="$(jq -nc --arg k "$k" --arg s "$s" --arg r "$RUN_TAG" '{qa:true,kind:$k,name:("WDCC QA LEAD V3 "+$k+" "+$r),phone:"813-555-0194",email:("lead-v3-"+$k+"-"+$r+"@invalid.example"),vehicleInterest:"Lead V3 live",message:"Automated WDCC contract verification",consent:true,source:$s,pagePath:("/qa/lead-v3-"+$k)}')";code="$(curl -sS -D "/tmp/live-${k}.h" -o "/tmp/live-${k}.json" -w '%{http_code}' -H 'content-type: application/json' -H "Idempotency-Key: $key" -X POST "$CUSTOMER/api/leads" --data "$body")";echo "$k=$code";case "$code" in 200|201);;*)cat "/tmp/live-${k}.json";exit 1;;esac;jq -e '.ok==true and .persisted==true and .item.id!=null' "/tmp/live-${k}.json" >/dev/null;grep -qi '^x-wdcc-edge: customer-lead-v53' "/tmp/live-${k}.h";jq -r '.item.id' "/tmp/live-${k}.json" >>/tmp/live-ids;done
          FEED="$(curl -sS -b /tmp/dealer.cookies -o /tmp/feed.json -w '%{http_code}' "$DEALER/api/leads?lead_v3=$GITHUB_RUN_ID")";test "$FEED" = 200;while read -r id;do jq -e --arg id "$id" 'any((.items//[])[];.id==$id)' /tmp/feed.json >/dev/null;done </tmp/live-ids
          test "$(curl -sS -L -o /tmp/home-after.html -w '%{http_code}' "$CUSTOMER/?lead_v3_after=$GITHUB_RUN_ID")" = 200;grep -q 'class="refHome"' /tmp/home-after.html;grep -q 'class="refHero"' /tmp/home-after.html;grep -q 'class="refBenefits"' /tmp/home-after.html
          trap - ERR INT TERM;echo "login=$LOGIN" >> "$GITHUB_OUTPUT";echo "feed=$FEED" >> "$GITHUB_OUTPUT";echo ok=true >> "$GITHUB_OUTPUT"

      - name: Cleanup stage/live QA leads and user
        if: always()
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          uid='';[ -f /tmp/lead-v3.env ]&&{ set -a;. /tmp/lead-v3.env;set +a;uid="$QA_ID";};export QA_ID="$uid" LEAD_IDS="$(cat /tmp/stage-ids /tmp/live-ids 2>/dev/null|paste -sd, -||true)"
          cat > .lead-v3-clean.mjs <<'NODE'
          import crypto from'node:crypto';import{get,head,put,BlobPreconditionFailedError}from'@vercel/blob';const path='private/state/platform-v3.json',uid=process.env.QA_ID||'',ids=new Set((process.env.LEAD_IDS||'').split(',').filter(Boolean));async function stable(){for(let i=0;i<8;i++){const a=await head(path),r=await get(path,{access:'private',useCache:false});if(!r?.stream)throw Error('READ');const c=[];for await(const x of r.stream)c.push(x);const raw=Buffer.concat(c),b=await head(path);if(a.etag===b.etag)return{etag:b.etag,s:JSON.parse(raw.toString())}}throw Error('HOT')}for(let n=1;n<=6;n++){const b=await stable(),s=b.s,u=(s.users||[]).length,l=(s.leads||[]).length,now=new Date().toISOString();s.users=(s.users||[]).filter(x=>x.id!==uid);s.leads=(s.leads||[]).filter(x=>!ids.has(x.id));s.audit=Array.isArray(s.audit)?s.audit:[];s.audit.push({id:crypto.randomUUID(),at:now,action:'qa.customer_lead_v3.cleanup',actor:'github-actions',userId:uid,leadCount:ids.size});s.revision=Number(s.revision||0)+1;s.updatedAt=now;try{await put(path,JSON.stringify(s,null,2)+'\n',{access:'private',addRandomSuffix:false,allowOverwrite:true,contentType:'application/json',ifMatch:b.etag});console.log(JSON.stringify({ok:true,removedUsers:u-s.users.length,removedLeads:l-s.leads.length,revision:s.revision}));process.exit(0)}catch(e){if(e instanceof BlobPreconditionFailedError&&n<6)continue;throw e}}
          NODE
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel env run --environment=production --token="$VERCEL_TOKEN" --scope="$TEAM" -- node .lead-v3-clean.mjs|tee /tmp/clean.log;grep -q '"ok":true' /tmp/clean.log;echo ok=true >> "$GITHUB_OUTPUT"

      - name: Publish V3 evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          PRE: ${{ steps.preflight.outputs.ok }}
          STAGE: ${{ steps.stage.outputs.ok }}
          IDENTITY: ${{ steps.identity.outputs.ok }}
          BIND: ${{ steps.bind.outputs.ok }}
          LIVE: ${{ steps.live.outputs.ok }}
          LOGIN: ${{ steps.live.outputs.login }}
          FEED: ${{ steps.live.outputs.feed }}
          CLEAN: ${{ steps.cleanup.outputs.ok }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "WDCC customer lead bridge V3 $GITHUB_RUN_ID" --body "Overall: **$STATUS**\nCanonical backend/current storefront preflight: **${PRE:-false}**\nWorkers.dev Schedule/Get Approved/Call Sean: **${STAGE:-false}**\nNarrow customer lead route bound: **${BIND:-false}**\nReal wedontcarecars.com three lead paths + dealer readback: **${LIVE:-false}**\nDealer login/feed: \`${LOGIN:-?}/${FEED:-?}\`\nCleanup: **${CLEAN:-false}**\n\nThis bridge deliberately omits customer `Origin` and `X-Forwarded-Host` when calling immutable Phoenix so Next.js sees the canonical Vercel request host. Live failures restore/remove the narrow route automatically. The reference-clone storefront is checked before and after." || true
